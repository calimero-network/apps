# Native iOS Merraria (apps/merraria/mobile/ios): test the non-UI layer (MerrariaCore, a local
# SwiftPM package: generated contract client, world list, game bridge, touch mapping, bundled-game
# check) on macOS, then generate
# the Xcode project from project.yml and build the app for the iOS Simulator. The swift-sdk is
# resolved from GitHub at the revision project.yml and MerrariaCore/Package.swift pin.
name: Merraria iOS

on:
  pull_request:
    paths:
      - apps/merraria/mobile/ios/**
      - apps/merraria/mobile/game/**
      - .github/workflows/merraria-ios.yml
  push:
    branches: [main]
    paths:
      - apps/merraria/mobile/ios/**
      - apps/merraria/mobile/game/**
      - .github/workflows/merraria-ios.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merraria-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Test core & build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/merraria/mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test MerrariaCore (macOS)
        run: swift test --package-path MerrariaCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Merraria.xcodeproj \
            -scheme Merraria \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merraria-ios-logs
          path: apps/merraria/mobile/ios/xcodebuild-*.log
          if-no-files-found: warn
