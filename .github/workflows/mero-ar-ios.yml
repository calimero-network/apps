# Native iOS Mero AR (apps/mero-ar/mobile/ios): test the core package (generated
# client, models, the room service and the scene store) on macOS, then generate
# the Xcode project from project.yml, build the app for the iOS Simulator and
# run its unit tests there. The Swift SDK is resolved from calimero-network/core
# at the release MeroARCore/Package.swift and project.yml pin.
name: Mero AR iOS

on:
  pull_request:
    paths:
      - apps/mero-ar/mobile/ios/**
      - .github/workflows/mero-ar-ios.yml
  push:
    branches: [main]
    paths:
      - apps/mero-ar/mobile/ios/**
      - .github/workflows/mero-ar-ios.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mero-ar-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mero-ar/mobile/ios/MeroARCore
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test

  app:
    name: Build and test app (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mero-ar/mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project MeroAR.xcodeproj \
            -scheme MeroAR \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-build.log

      # Addressed by UDID after waiting, not by name: on a cold runner
      # CoreSimulator is often not up yet and xcodebuild's device list comes
      # back empty; touching simctl starts the service.
      - name: Wait for a simulator, then run the unit tests
        env:
          XCB_QUIET: ${{ runner.debug == '1' && '' || '-quiet' }}
        run: |
          set -euo pipefail
          udid=""
          for attempt in $(seq 1 20); do
            udid=$(xcrun simctl list devices available -j \
              | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next((x["udid"] for rt in d for x in d[rt] if "iPhone" in x["name"]), ""))')
            [ -n "$udid" ] && break
            echo "attempt $attempt: no iPhone simulator yet, waiting…"
            sleep 5
          done
          if [ -z "$udid" ]; then
            echo "::error::no iOS simulator became available — tests did NOT run"
            xcrun simctl list devices
            exit 1
          fi
          echo "using simulator $udid"
          xcrun simctl boot "$udid" || true
          xcodebuild test $XCB_QUIET -project MeroAR.xcodeproj -scheme MeroAR \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/DerivedData -only-testing:MeroARTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mero-ar-ios-logs
          path: apps/mero-ar/mobile/ios/xcodebuild-*.log
          if-no-files-found: warn
