# Native iOS Mero CRM (apps/mero-crm/mobile/ios): test the core package
# (generated client, helpers, view models) on macOS, then generate the Xcode
# project from project.yml and build the app for the iOS Simulator. The
# swift-sdk is resolved from GitHub at the revision Core/Package.swift and
# project.yml pin.
name: Mero CRM iOS

on:
  pull_request:
    paths:
      - apps/mero-crm/mobile/ios/**
      - .github/workflows/mero-crm-ios.yml
  push:
    branches: [main]
    paths:
      - apps/mero-crm/mobile/ios/**
      - .github/workflows/mero-crm-ios.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mero-crm-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mero-crm/mobile/ios/Core
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test

  app:
    name: Build app (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mero-crm/mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project MeroCRM.xcodeproj \
            -scheme MeroCRM \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mero-crm-ios-logs
          path: apps/mero-crm/mobile/ios/xcodebuild-*.log
          if-no-files-found: warn
