# Native iOS Mero Forum (apps/mero-forum/mobile/ios).
#
# - Logic: the ForumCore package (generated contract client, view models, invitation codec) is
#   tested on macOS with `swift test`, against the swift-sdk's in-memory fakes.
# - App: the Xcode project is generated from project.yml and the app is built for the iOS
#   Simulator, unsigned. The swift-sdk is resolved from GitHub at the revision both pin.
name: Mero Forum iOS

on:
  pull_request:
    paths:
      - apps/mero-forum/mobile/ios/**
      - .github/workflows/mero-forum-ios.yml
  push:
    branches: [main]
    paths:
      - apps/mero-forum/mobile/ios/**
      - .github/workflows/mero-forum-ios.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mero-forum-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  logic:
    name: Logic tests (swift test)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mero-forum/mobile/ios/ForumCore
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

  app:
    name: Build the app (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mero-forum/mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project MeroForum.xcodeproj \
            -scheme MeroForum \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mero-forum-ios-logs
          path: apps/mero-forum/mobile/ios/xcodebuild-*.log
          if-no-files-found: warn
