# CI for component apps: `calimero-sdk` on core's wasmtime component
# runtime (`wasm32-wasip2`), developed and e2e-tested on `merod local`.
#
# Every app is a component app now; ci.yml keeps the workspace-wide checks and
# the `frontend` job (lint, typecheck, test, build, codegen of every pnpm member
# a change reaches, scripts/ci-scope.py). This file adds what needs a contract:
#
#   checks    always: pins, packages/connect + passkey + merod-local
#   rust      per app: fmt, clippy -D warnings (host and wasm32-wasip2), cargo test
#             (core's TestApp harness + scenarios/*.json), release build, ABI current,
#             a dev-signed .mpk (build, pack and inspect are core's released
#             `meroctl`, at the release scripts/install-meroctl.sh pins)
#   e2e       per app: the app's scenarios/*.json on `merod local` (core's release
#             binary at component-core-tag), as real accounts through mero-js
#   browser   per app with an `app/playwright.config.ts`: its Playwright suite in
#             Chromium on the same `merod local`
#   cross-app e2e/cross-app: Chat, Calimero Home and KV Store over one org on the
#             same `merod local`, each from its own dev server
#   ok        the one check to require: fails if any job above failed or was cancelled
#
# WHICH APPS, PER JOB. On a pull request scripts/ci-scope.py components reads the
# diff and decides each job's matrix separately: a contract change runs that
# app's rust + e2e (+ any suite that bundles it), a frontend change runs only
# the suites that serve it, a `mobile/` or README change runs nothing here, and
# a change to merod-local or a shared JS pin runs every e2e leg without
# rebuilding every contract. `python3 scripts/ci-scope.py components --explain
# <paths>` shows the answer for any diff. A push to main and a dispatch run
# everything: main is where an app nothing touched still has to prove itself.

name: Components

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: components-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect component apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Each job's own matrix: see scripts/ci-scope.py components.
      rust: ${{ steps.set.outputs.rust }}
      # [{app, build}]: `build` legs make their own wasm (the contract did not
      # change, only the JS that drives it), the rest take it from `rust`.
      e2e: ${{ steps.set.outputs.e2e }}
      browser_apps: ${{ steps.set.outputs.browser }}
      cross_app: ${{ steps.set.outputs.cross_app }}
      tag: ${{ steps.set.outputs.tag }}
      # The shared Rust cache: one entry for every app (they all pin the same
      # core), saved only from main. Per-app keys were 1.1 GB each; 27 of them
      # overflow the repository's 10 GB, so every leg restored nothing.
      cache_key: ${{ steps.set.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the matrices
        id: set
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          LOCKS: ${{ hashFiles('apps/*/logic/Cargo.lock', 'scripts/install-meroctl.sh') }}
        run: |
          set -euo pipefail
          tag=$(awk -F'"' '/^component-core-tag/{print $2}' Cargo.toml)
          [ -n "$tag" ] || { echo "::error::no component-core-tag in Cargo.toml"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cache_key=component-target-${RUNNER_OS}-${tag}-${LOCKS}" >> "$GITHUB_OUTPUT"

          # Only a pull request is scoped. A failure of the script covers
          # everything: the one wrong answer that fails loudly.
          if [ "$EVENT" != "pull_request" ]; then
            scope=$(python3 scripts/ci-scope.py components --all)
          elif ! scope=$(python3 scripts/ci-scope.py components --explain --base "$BASE" --head HEAD); then
            echo "::warning::ci-scope.py components failed — covering every app"
            scope=$(python3 scripts/ci-scope.py components --all)
          fi
          echo "scope: $scope"
          for k in rust e2e browser; do
            echo "$k=$(jq -c ".$k" <<<"$scope")" >> "$GITHUB_OUTPUT"
          done
          echo "cross_app=$(jq -r '.cross_app' <<<"$scope")" >> "$GITHUB_OUTPUT"
          echo "::notice::rust: $(jq -c .rust <<<"$scope") | e2e: $(jq -c '[.e2e[].app]' <<<"$scope") | browser: $(jq -c .browser <<<"$scope") | cross-app: $(jq -r .cross_app <<<"$scope") (core $tag)"

  checks:
    name: Pins, tooling and shared packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Assert every component crate pins core at component-core-tag
        run: python3 scripts/check-component-pins.py
      - name: Assert the pin check still catches drift
        run: python3 scripts/tests/component-pins-test.py

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # merod-local runs as TypeScript under Node's type stripping (>= 22.18).
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: packages/connect, passkey and merod-local (typecheck, lint, test)
        run: |
          pnpm --filter @calimero-apps/connect --filter @calimero-apps/passkey --filter @calimero-apps/merod-local typecheck
          pnpm --filter @calimero-apps/connect --filter @calimero-apps/passkey --filter @calimero-apps/merod-local lint
          pnpm --filter @calimero-apps/connect --filter @calimero-apps/passkey --filter @calimero-apps/merod-local test
          node packages/merod-local/src/cli.ts
      # Lint here is one rule, `no-deprecated`: mero-js's retired wrappers fail it.
      - name: packages/names and e2e/cross-app (lint)
        run: pnpm --filter @calimero-apps/names --filter @calimero-apps/cross-app-e2e lint

  rust:
    name: Rust (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.rust != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.rust != '[]' && needs.changes.outputs.rust || '["none"]') }}
    env:
      LOGIC: apps/${{ matrix.app }}/logic
      # One target dir for the app, its nested wasm32-wasip2 test build and
      # meroctl's release build, so the core crates compile once per job.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-components
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      # The shared cache (see `changes`): restored everywhere, saved from main.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-components
          key: ${{ needs.changes.outputs.cache_key }}
          restore-keys: |
            component-target-${{ runner.os }}-${{ needs.changes.outputs.tag }}-
            component-target-${{ runner.os }}-
      # core's released `meroctl` builds, packs and inspects the components,
      # at the release scripts/install-meroctl.sh pins (cached by its hash).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/meroctl
          key: meroctl-${{ runner.os }}-${{ hashFiles('scripts/install-meroctl.sh') }}
      - name: Install meroctl
        env:
          MEROCTL_ROOT: ${{ runner.temp }}/meroctl
        run: |
          scripts/install-meroctl.sh
          echo "$MEROCTL_ROOT/bin" >> "$GITHUB_PATH"

      - run: cargo fmt --manifest-path "$LOGIC/Cargo.toml" -- --check
      - name: Clippy (host, tests included)
        run: cargo clippy --locked --manifest-path "$LOGIC/Cargo.toml" --all-targets -- -D warnings
      - name: Clippy (wasm32-wasip2, what the node runs)
        run: cargo clippy --locked --manifest-path "$LOGIC/Cargo.toml" --target wasm32-wasip2 -- -D warnings
      # tests/*.rs build the crate for wasm32-wasip2 and run it on core's real
      # wasmtime engine (TestApp), scenarios/*.json included.
      - name: Test (core's TestApp harness)
        run: cargo test --locked --manifest-path "$LOGIC/Cargo.toml"

      - name: Release build
        run: scripts/component-build.sh "$LOGIC"
      - name: Assert the committed ABI matches the build
        run: |
          git add --intent-to-add -- "$LOGIC/res/abi.json" 2>/dev/null || true
          if ! git diff --quiet -- "$LOGIC/res/abi.json"; then
            echo "::error::$LOGIC/res/abi.json is stale. Run 'scripts/component-build.sh $LOGIC' (meroctl from scripts/install-meroctl.sh) and commit it."
            git --no-pager diff -- "$LOGIC/res/abi.json"
            exit 1
          fi
      # No --key: meroctl signs with the development key, which a registry refuses.
      - name: Pack a dev-signed bundle (never publishable)
        run: |
          wasm=$(ls "$LOGIC"/res/*.wasm)
          meroctl app pack "$LOGIC" --no-frontend --wasm "$wasm" --app-version 0.0.0 --out "dist/${{ matrix.app }}-dev.mpk"
          meroctl app inspect "dist/${{ matrix.app }}-dev.mpk" > /dev/null
      # One leg saves (a key is write-once, so a second save is only a warning),
      # and only on main: a pull request's cache is visible to that PR alone,
      # and 27 of them evicted main's.
      - name: Save the shared cache (main only)
        if: github.event_name == 'push' && matrix.app == fromJSON(needs.changes.outputs.rust)[0]
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-components
          key: ${{ needs.changes.outputs.cache_key }}
      - uses: actions/upload-artifact@v4
        with:
          name: component-${{ matrix.app }}-${{ github.sha }}
          path: |
            apps/${{ matrix.app }}/logic/res/*.wasm
            dist/${{ matrix.app }}-dev.mpk
          retention-days: 7

  e2e:
    name: E2E on merod local (${{ matrix.app }})
    needs: [changes, rust]
    # `rust` is skipped when no contract changed (a merod-local or mero-js
    # change), and a skipped `needs:` skips this job unless the `if:` says
    # otherwise. A failed or cancelled `rust` still stops it.
    if: >-
      !cancelled() && needs.changes.outputs.e2e != '[]'
      && (needs.rust.result == 'success' || needs.rust.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.e2e != '[]' && needs.changes.outputs.e2e || '[{"app":"none","build":false}]') }}
    env:
      TAG: ${{ needs.changes.outputs.tag }}
      LOGIC: apps/${{ matrix.app }}/logic
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-components
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !matrix.build }}
        uses: actions/download-artifact@v4
        with:
          name: component-${{ matrix.app }}-${{ github.sha }}

      # A `build` leg: the contract is unchanged, so only its release wasm is
      # needed, not the whole `rust` leg (fmt, clippy, tests) to get it.
      - if: matrix.build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - if: matrix.build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-components
          key: ${{ needs.changes.outputs.cache_key }}
          restore-keys: |
            component-target-${{ runner.os }}-${{ needs.changes.outputs.tag }}-
            component-target-${{ runner.os }}-
      # core's released `meroctl` builds, packs and inspects the components,
      # at the release scripts/install-meroctl.sh pins (cached by its hash).
      - if: matrix.build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/meroctl
          key: meroctl-${{ runner.os }}-${{ hashFiles('scripts/install-meroctl.sh') }}
      - name: Install meroctl
        if: matrix.build
        env:
          MEROCTL_ROOT: ${{ runner.temp }}/meroctl
        run: |
          scripts/install-meroctl.sh
          echo "$MEROCTL_ROOT/bin" >> "$GITHUB_PATH"
      - name: Release build
        if: matrix.build
        run: scripts/component-build.sh "$LOGIC"

      # core's release binary for the pinned tag, checked against the release's
      # SHA256SUMS. A release whose binaries are not uploaded yet fails here
      # rather than testing against something else.
      - name: Install merod ${{ env.TAG }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/merod" && cd "$RUNNER_TEMP/merod"
          base="https://github.com/calimero-network/core/releases/download/$TAG"
          asset=merod_x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          grep -E "  $asset\$" SHA256SUMS | sha256sum -c -
          tar -xzf "$asset" merod
          ./merod --version
          echo "MEROD_BIN=$RUNNER_TEMP/merod/merod" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run the scenarios on merod local
        run: |
          wasm=$(ls apps/${{ matrix.app }}/logic/res/*.wasm)
          pnpm merod-local e2e ${{ matrix.app }} --wasm "$wasm"

      - name: Upload the cluster log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merod-local-${{ matrix.app }}-${{ github.sha }}
          path: .merod-local/merod.log
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser E2E on merod local (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.browser_apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.browser_apps != '[]' && needs.changes.outputs.browser_apps || '["none"]') }}
    env:
      TAG: ${{ needs.changes.outputs.tag }}
      # A suite's global setup may bundle a component it installs (Home's builds
      # a dev-signed KV Store), so the job carries the wasm toolchain and the
      # same target dir layout as `rust`.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-components
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-components
          key: ${{ needs.changes.outputs.cache_key }}
          restore-keys: |
            component-target-${{ runner.os }}-${{ needs.changes.outputs.tag }}-
            component-target-${{ runner.os }}-
      # core's released `meroctl` builds, packs and inspects the components,
      # at the release scripts/install-meroctl.sh pins (cached by its hash).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/meroctl
          key: meroctl-${{ runner.os }}-${{ hashFiles('scripts/install-meroctl.sh') }}
      - name: Install meroctl
        env:
          MEROCTL_ROOT: ${{ runner.temp }}/meroctl
        run: |
          scripts/install-meroctl.sh
          echo "$MEROCTL_ROOT/bin" >> "$GITHUB_PATH"

      # Same binary and checksum check as `e2e`.
      - name: Install merod ${{ env.TAG }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/merod" && cd "$RUNNER_TEMP/merod"
          base="https://github.com/calimero-network/core/releases/download/$TAG"
          asset=merod_x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          grep -E "  $asset\$" SHA256SUMS | sha256sum -c -
          tar -xzf "$asset" merod
          ./merod --version
          echo "MEROD_BIN=$RUNNER_TEMP/merod/merod" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Capped because `playwright install --with-deps` has no timeout of its own.
      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          working-directory: apps/${{ matrix.app }}/app

      # The config's global setup starts `merod local --fresh` itself and the
      # webServer runs vite against it (VITE_CALIMERO_TARGET=local).
      - name: Run the browser e2e
        working-directory: apps/${{ matrix.app }}/app
        run: pnpm exec playwright test

      - name: Upload the report and cluster log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ matrix.app }}-${{ github.sha }}
          path: |
            apps/${{ matrix.app }}/app/playwright-report
            apps/${{ matrix.app }}/app/test-results
            .merod-local/*.log
          # `.merod-local/` is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  cross-app:
    name: Cross-app E2E on merod local (Chat, Home, KV Store)
    needs: changes
    if: needs.changes.outputs.cross_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ needs.changes.outputs.tag }}
      # The global setup bundles dev-signed Chat and KV Store packages, so the
      # job carries the wasm toolchain and the same target dir layout as `rust`.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-components
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-components
          key: ${{ needs.changes.outputs.cache_key }}
          restore-keys: |
            component-target-${{ runner.os }}-${{ needs.changes.outputs.tag }}-
            component-target-${{ runner.os }}-
      # core's released `meroctl` builds, packs and inspects the components,
      # at the release scripts/install-meroctl.sh pins (cached by its hash).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/meroctl
          key: meroctl-${{ runner.os }}-${{ hashFiles('scripts/install-meroctl.sh') }}
      - name: Install meroctl
        env:
          MEROCTL_ROOT: ${{ runner.temp }}/meroctl
        run: |
          scripts/install-meroctl.sh
          echo "$MEROCTL_ROOT/bin" >> "$GITHUB_PATH"

      # Same binary and checksum check as `e2e`.
      - name: Install merod ${{ env.TAG }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/merod" && cd "$RUNNER_TEMP/merod"
          base="https://github.com/calimero-network/core/releases/download/$TAG"
          asset=merod_x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          grep -E "  $asset\$" SHA256SUMS | sha256sum -c -
          tar -xzf "$asset" merod
          ./merod --version
          echo "MEROD_BIN=$RUNNER_TEMP/merod/merod" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Capped because `playwright install --with-deps` has no timeout of its own.
      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          working-directory: e2e/cross-app

      # The global setup starts `merod local --fresh --origins …` itself, and the
      # config's three webServers run each app's vite against it.
      - name: Run the cross-app e2e
        working-directory: e2e/cross-app
        run: pnpm exec playwright test

      - name: Upload the report and cluster log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-app-e2e-${{ github.sha }}
          path: |
            e2e/cross-app/playwright-report
            e2e/cross-app/test-results
            .merod-local/*.log
          # `.merod-local/` is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # The one check to require. A job skipped because the change does not reach
  # it is a pass; a failure or a cancellation anywhere is not. Without it, the
  # checks a PR shows depend on which apps it touched, so no fixed set of
  # per-app check names can be required.
  ok:
    name: Components OK
    needs: [changes, checks, rust, e2e, browser, cross-app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed or was out of scope
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$NEEDS" >/dev/null; then
            echo "::error::a Components job failed or was cancelled"
            exit 1
          fi
