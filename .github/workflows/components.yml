# CI for component apps: `calimero-sdk` on core's wasmtime component
# runtime (`wasm32-wasip2`), developed and e2e-tested on `merod local`.
#
# The v1 pipeline (ci.yml) finds its apps through `cargo metadata` of the root
# workspace, which a component app is excluded from (root Cargo.toml,
# `[workspace].exclude`), so each app is covered by exactly one of the two. The
# v1 `frontend` job still typechecks, tests and builds every pnpm member, a
# component app's frontend included; this file adds what is specific to them.
#
#   checks    always: pins, tools/component-bundle, packages/connect + passkey + merod-local
#   rust      per app: fmt, clippy -D warnings (host and wasm32-wasip2), cargo test
#             (core's TestApp harness + scenarios/*.json), release build, ABI current,
#             a dev-signed .mpk
#   frontend  per app: lint, typecheck, test, build
#   e2e       per app: the app's scenarios/*.json on `merod local` (core's release
#             binary at component-core-tag), as real accounts through mero-js

name: Components

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: components-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect component apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.set.outputs.apps }}
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the app matrix
        id: set
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag=$(awk -F'"' '/^component-core-tag/{print $2}' Cargo.toml)
          [ -n "$tag" ] || { echo "::error::no component-core-tag in Cargo.toml"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          all=$(scripts/component-apps.sh all)
          # What every component app builds against or is tested with: a change
          # here covers all of them. A brand-new branch (no usable base) does too.
          #
          # Cargo.toml and pnpm-lock.yaml are judged by scripts/lockfile-fanout.py
          # rather than by name: every port edits both (its crate joins
          # `[workspace].exclude`, its frontend becomes a pnpm importer), and
          # neither edit reaches another component app.
          shared='^(pnpm-workspace\.yaml|package\.json|tools/component-bundle/|packages/(connect|passkey|merod-local)/|scripts/(component-apps\.sh|check-component-pins\.py|lockfile-fanout\.py)|\.github/workflows/components\.yml)'
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! changed=$(git diff --name-only "$BASE" HEAD); then
            apps="$all"
          elif grep -Eq "$shared" <<<"$changed"; then
            apps="$all"
          else
            extra=""
            if grep -qx 'Cargo.toml' <<<"$changed"; then
              verdict=$(python3 scripts/lockfile-fanout.py manifest --for components --base "$BASE" --head HEAD) || verdict=all
              [ "$verdict" = "all" ] && extra=all
            fi
            if [ -z "$extra" ] && grep -qx 'pnpm-lock.yaml' <<<"$changed"; then
              verdict=$(python3 scripts/lockfile-fanout.py pnpm --base "$BASE" --head HEAD) || verdict=all
              if [ "$verdict" = "all" ]; then
                extra=all
              else
                # Importer dirs (`apps/x/app`), mapped like a changed file there.
                changed=$(printf '%s\n%s\n' "$changed" "$(sed '/^$/d; s|$|/package.json|' <<<"$verdict")")
              fi
            fi
            if [ "$extra" = "all" ]; then
              apps="$all"
            else
              apps=$(scripts/component-apps.sh from-paths <<<"$changed")
            fi
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "::notice::component apps: $apps (core $tag)"

  checks:
    name: Pins, tooling and shared packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Assert every component crate pins core at component-core-tag
        run: python3 scripts/check-component-pins.py
      - name: Assert the pin check still catches drift
        run: python3 scripts/tests/component-pins-test.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/component-bundle/target
          key: component-bundle-${{ runner.os }}-${{ hashFiles('tools/component-bundle/Cargo.lock') }}
          restore-keys: component-bundle-${{ runner.os }}-
      - name: tools/component-bundle (fmt, clippy, test)
        working-directory: tools/component-bundle
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # merod-local runs as TypeScript under Node's type stripping (>= 22.18).
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: packages/connect, passkey and merod-local (typecheck, test)
        run: |
          pnpm --filter @calimero-apps/connect --filter @calimero-apps/passkey --filter @calimero-apps/merod-local typecheck
          pnpm --filter @calimero-apps/connect --filter @calimero-apps/passkey --filter @calimero-apps/merod-local test
          node packages/merod-local/src/cli.ts

  rust:
    name: Rust (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps != '[]' && needs.changes.outputs.apps || '["none"]') }}
    env:
      LOGIC: apps/${{ matrix.app }}/logic
      # One target dir for the app, its nested wasm32-wasip2 test build and the
      # builder, so the core crates compile once per job.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-components
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-components
          key: component-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles(format('apps/{0}/logic/Cargo.lock', matrix.app), 'tools/component-bundle/Cargo.lock') }}
          restore-keys: component-${{ matrix.app }}-${{ runner.os }}-

      - run: cargo fmt --manifest-path "$LOGIC/Cargo.toml" -- --check
      - name: Clippy (host, tests included)
        run: cargo clippy --locked --manifest-path "$LOGIC/Cargo.toml" --all-targets -- -D warnings
      - name: Clippy (wasm32-wasip2, what the node runs)
        run: cargo clippy --locked --manifest-path "$LOGIC/Cargo.toml" --target wasm32-wasip2 -- -D warnings
      # tests/*.rs build the crate for wasm32-wasip2 and run it on core's real
      # wasmtime engine (TestApp), scenarios/*.json included.
      - name: Test (core's TestApp harness)
        run: cargo test --locked --manifest-path "$LOGIC/Cargo.toml"

      - name: Release build
        run: cargo run --locked --release --manifest-path tools/component-bundle/Cargo.toml -- build "$LOGIC"
      - name: Assert the committed ABI matches the build
        run: |
          git add --intent-to-add -- "$LOGIC/res/abi.json" 2>/dev/null || true
          if ! git diff --quiet -- "$LOGIC/res/abi.json"; then
            echo "::error::$LOGIC/res/abi.json is stale. Run 'cargo run --release --manifest-path tools/component-bundle/Cargo.toml -- build $LOGIC' and commit it."
            git --no-pager diff -- "$LOGIC/res/abi.json"
            exit 1
          fi
      - name: Pack a dev-signed bundle (never publishable)
        run: |
          wasm=$(ls "$LOGIC"/res/*.wasm)
          cargo run --locked --release --manifest-path tools/component-bundle/Cargo.toml -- \
            bundle "$LOGIC" --dev --no-frontend --wasm "$wasm" --app-version 0.0.0 --output "dist/${{ matrix.app }}-dev.mpk"
          cargo run --locked --release --manifest-path tools/component-bundle/Cargo.toml -- \
            inspect "dist/${{ matrix.app }}-dev.mpk" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: component-${{ matrix.app }}-${{ github.sha }}
          path: |
            apps/${{ matrix.app }}/logic/res/*.wasm
            dist/${{ matrix.app }}-dev.mpk
          retention-days: 7

  frontend:
    name: Frontend (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps != '[]' && needs.changes.outputs.apps || '["none"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test, build
        run: |
          app="./apps/${{ matrix.app }}/app"
          pnpm --filter "$app" lint
          pnpm --filter "$app" typecheck
          pnpm --filter "$app" test
          pnpm --filter "$app" build

  e2e:
    name: E2E on merod local (${{ matrix.app }})
    needs: [changes, rust]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps != '[]' && needs.changes.outputs.apps || '["none"]') }}
    env:
      TAG: ${{ needs.changes.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: component-${{ matrix.app }}-${{ github.sha }}

      # core's release binary for the pinned tag, checked against the release's
      # SHA256SUMS. A release whose binaries are not uploaded yet fails here
      # rather than testing against something else.
      - name: Install merod ${{ env.TAG }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/merod" && cd "$RUNNER_TEMP/merod"
          base="https://github.com/calimero-network/core/releases/download/$TAG"
          asset=merod_x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          grep -E "  $asset\$" SHA256SUMS | sha256sum -c -
          tar -xzf "$asset" merod
          ./merod --version
          echo "MEROD_BIN=$RUNNER_TEMP/merod/merod" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run the scenarios on merod local
        run: |
          wasm=$(ls apps/${{ matrix.app }}/logic/res/*.wasm)
          pnpm merod-local e2e ${{ matrix.app }} --wasm "$wasm"

      - name: Upload the cluster log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merod-local-${{ matrix.app }}-${{ github.sha }}
          path: .merod-local/merod.log
          if-no-files-found: ignore
          retention-days: 7
