# Native iOS Mero Models (apps/mero-models/mobile/ios): test the ModelsCore package
# (generated client, invitation format, view models) on macOS, then generate the Xcode
# project from project.yml and build the app for the iOS Simulator. The swift-sdk is
# resolved from GitHub at the revision project.yml and ModelsCore/Package.swift pin.
name: Mero Models iOS

on:
  pull_request:
    paths:
      - apps/mero-models/mobile/ios/**
      - apps/mero-models/mobile/viewer/dist/**
      - .github/workflows/mero-models-ios.yml
  push:
    branches: [main]
    paths:
      - apps/mero-models/mobile/ios/**
      - apps/mero-models/mobile/viewer/dist/**
      - .github/workflows/mero-models-ios.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mero-models-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Test core & build app
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mero-models/mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test ModelsCore (macOS)
        run: swift test --package-path ModelsCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MeroModels.xcodeproj \
            -scheme MeroModels \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mero-models-ios-logs
          path: apps/mero-models/mobile/ios/xcodebuild-*.log
          if-no-files-found: warn
