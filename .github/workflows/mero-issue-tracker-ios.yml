# Native iOS Mero Issue Tracker (apps/mero-issue-tracker/mobile/ios): run the Core package's
# tests on macOS (generated contract client + view models against the SDK's fakes), then generate
# the Xcode project from project.yml and build the app for the iOS Simulator. The swift-sdk is
# resolved from GitHub at the revision project.yml and Core/Package.swift pin.
name: Mero Issue Tracker iOS

on:
  pull_request:
    paths:
      - apps/mero-issue-tracker/mobile/ios/**
      - .github/workflows/mero-issue-tracker-ios.yml
  push:
    branches: [main]
    paths:
      - apps/mero-issue-tracker/mobile/ios/**
      - .github/workflows/mero-issue-tracker-ios.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mero-issue-tracker-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Core tests & app build
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mero-issue-tracker/mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core tests (macOS)
        working-directory: apps/mero-issue-tracker/mobile/ios/Core
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MeroIssues.xcodeproj \
            -scheme MeroIssues \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mero-issue-tracker-ios-logs
          path: apps/mero-issue-tracker/mobile/ios/xcodebuild-*.log
          if-no-files-found: warn
