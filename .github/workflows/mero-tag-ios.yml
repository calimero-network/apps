# Native iOS Mero Tag (apps/mero-tag/mobile/ios): test the core package
# (generated contract client, models, space service, tracker store) on macOS,
# then generate the Xcode project from project.yml and run the app's unit tests
# on an iOS Simulator. The Swift SDK is resolved from calimero-network/core at
# the release TagCore/Package.swift and project.yml pin. The generated client is
# checked by the Mobile clients workflow; the contract and the served page by
# the Components and CI workflows.
name: Mero Tag iOS

on:
  pull_request:
    paths:
      - apps/mero-tag/mobile/ios/**
      - .github/workflows/mero-tag-ios.yml
  push:
    branches: [main]
    paths:
      - apps/mero-tag/mobile/ios/**
      - .github/workflows/mero-tag-ios.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mero-tag-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mero-tag/mobile/ios/TagCore
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test

  app:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mero-tag/mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Addressed by UDID after waiting, not by name: on a cold runner
      # CoreSimulator is often not up yet and xcodebuild's device list comes
      # back empty; touching simctl starts the service.
      - name: Wait for a simulator, then run the unit tests
        env:
          XCB_QUIET: ${{ runner.debug == '1' && '' || '-quiet' }}
        run: |
          set -euo pipefail
          udid=""
          for attempt in $(seq 1 20); do
            udid=$(xcrun simctl list devices available -j \
              | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next((x["udid"] for rt in d for x in d[rt] if "iPhone" in x["name"]), ""))')
            [ -n "$udid" ] && break
            echo "attempt $attempt: no iPhone simulator yet, waiting…"
            sleep 5
          done
          if [ -z "$udid" ]; then
            echo "::error::no iOS simulator became available — tests did NOT run"
            xcrun simctl list devices
            exit 1
          fi
          echo "using simulator $udid"
          xcrun simctl boot "$udid" || true
          xcodebuild test $XCB_QUIET -project MeroTag.xcodeproj -scheme MeroTag \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath .build -only-testing:MeroTagTests \
            CODE_SIGNING_ALLOWED=NO
