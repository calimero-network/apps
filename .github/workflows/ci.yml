# Per-app CI, path-filtered.
#
# The filter is the point. A frontend-only change must not pay for a WASM build
# or spin up merobox containers, and a change to the workspace root must fan out
# to EVERY app — because bumping the SDK changes every contract's bytes. The
# per-repo setup this replaces could not express the second half at all.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── what changed ───────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.set.outputs.apps }}
      # The merobox matrix is driven STRICTLY by what can change a contract.
      # `apps` is a union that a JS-only change can widen, and e2e does not gate
      # on js_deps — so sharing one matrix ran a 40-minute two-node e2e for
      # every app whenever a lockfile moved. These two must stay separate.
      #
      # ⚠️ Only `e2e` uses this. `wasm` must stay on `apps` because it is the
      # producer of the artifacts BOTH it and `browser` download, and `browser`
      # runs over `apps` — see the note on the wasm job's matrix.
      contract_apps: ${{ steps.set.outputs.contract_apps }}
      logic: ${{ steps.filter.outputs.logic }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # `shared` and `js_deps` are the EFFECTIVE verdicts, not the raw path
      # filters: a lockfile that changed only for the app being touched does not
      # make this a workspace-level change. See the `locks` step below.
      shared: ${{ steps.locks.outputs.shared }}
      tooling: ${{ steps.filter.outputs.tooling }}
      js_deps: ${{ steps.locks.outputs.js_deps }}
    steps:
      # Full history: deciding whether a lockfile change reaches other apps
      # means reading the lockfile as it was BEFORE this change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `list-files: shell` so the per-app mapping below reads real paths
          # instead of re-deriving them from a boolean.
          list-files: shell
          filters: |
            # A workspace-level change is one that can change a CONTRACT's
            # bytes, which is what justifies fanning out to every app AND
            # running the 40-minute merobox matrix.
            #
            # It used to include `.github/**`, `scripts/**` and the JS
            # workspace files, so editing a COMMENT in this very file triggered
            # the most expensive path in the pipeline. Those still need to run
            # something — they just do not change any wasm — so they are their
            # own filters below.
            #
            # The manifest and the lockfile are separate because they answer
            # differently: editing the workspace manifest is always everyone's
            # business, while `Cargo.lock` is also rewritten just by adding or
            # renaming an app. The `locks` step tells those two cases apart.
            #
            # Add 'crates/**' to `workspace_manifest` when that dir is created.
            workspace_manifest:
              - 'Cargo.toml'
            cargo_lock:
              - 'Cargo.lock'
            # The pipeline itself changed, so the pipeline has to be exercised —
            # including the e2e, since these are what drive it.
            tooling:
              - '.github/**'
              - 'scripts/**'
              - 'requirements-e2e.txt'
            # JS-only: a catalog bump or a tsconfig change cannot alter a
            # contract, so it must not start merod containers.
            #
            # Same split as above. The catalog and the shared tsconfig are
            # everyone's; `pnpm-lock.yaml` is per-importer, so adding an app
            # rewrites it without changing what any other app resolves.
            js_config:
              - 'tsconfig.base.json'
            # The catalog SOURCE. Split out of `js_config` because it answers
            # differently for the same reason the lockfiles do: an arriving app
            # only ADDS catalog entries for dependencies no one else has, which
            # cannot change what another app resolves. The `locks` step tells
            # that apart from an existing pin actually moving.
            pnpm_workspace:
              - 'pnpm-workspace.yaml'
            pnpm_lock:
              - 'pnpm-lock.yaml'
            logic:
              - 'apps/*/logic/**'
            frontend:
              - 'apps/*/app/**'
            app:
              - 'apps/**'

      # DID THE LOCKFILES CHANGE FOR ANYONE ELSE?
      #
      # `Cargo.lock` and `pnpm-lock.yaml` are rewritten whenever an app is
      # added, renamed or removed, and both used to be plain booleans that
      # fanned out to every app. So every migration PR paid for the full WASM +
      # browser + merobox matrix to prove that nine untouched apps still built.
      #
      # scripts/lockfile-fanout.py answers the narrower question the fan-out
      # actually needs — see its docstring for the rules, and
      # scripts/tests/lockfile-fanout-test.py for both branches pinned.
      - name: Decide whether the lockfile changes reach other apps
        id: locks
        env:
          MANIFEST: ${{ steps.filter.outputs.workspace_manifest }}
          CARGO_LOCK: ${{ steps.filter.outputs.cargo_lock }}
          JS_CONFIG: ${{ steps.filter.outputs.js_config }}
          PNPM_WORKSPACE: ${{ steps.filter.outputs.pnpm_workspace }}
          PNPM_LOCK: ${{ steps.filter.outputs.pnpm_lock }}
          # For a PR this is the base of the merge; for a push, the previous
          # tip. Empty or all-zeroes (a brand-new branch) makes the script
          # answer `all`, which is the safe direction.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -uo pipefail

          # The workspace manifest and the shared JS config are everyone's
          # business on their own; the lockfiles only sometimes are.
          shared="$MANIFEST"
          js_deps="$JS_CONFIG"
          extra_paths=""

          # Note the explicit failure branch on every probe below. With `set
          # -e` a crash would kill the job; WITHOUT it, an unchecked `$(...)`
          # leaves `verdict` empty, which reads as "no fan-out" and SKIPS apps
          # — the one direction that fails silently. So a failure is forced to
          # mean `all`.
          if [ "$CARGO_LOCK" = "true" ] && [ "$shared" != "true" ]; then
            if ! verdict=$(python3 scripts/lockfile-fanout.py cargo --base "$BASE" --head HEAD); then
              verdict=all
              echo "::warning::lockfile-fanout.py failed on Cargo.lock — covering every app"
            fi
            if [ "$verdict" = "all" ]; then
              shared=true
              echo "::notice::Cargo.lock moved a dependency — covering every app"
            else
              echo "::notice::Cargo.lock changed only for the apps in this PR"
            fi
          fi

          if [ "$PNPM_WORKSPACE" = "true" ] && [ "$js_deps" != "true" ]; then
            if ! verdict=$(python3 scripts/lockfile-fanout.py catalog --base "$BASE" --head HEAD); then
              verdict=all
              echo "::warning::lockfile-fanout.py failed on pnpm-workspace.yaml — covering every app"
            fi
            if [ "$verdict" = "all" ]; then
              js_deps=true
              echo "::notice::pnpm-workspace.yaml moved an existing catalog pin — covering every app"
            else
              echo "::notice::pnpm-workspace.yaml only added catalog entries — no fan-out"
            fi
          fi

          if [ "$PNPM_LOCK" = "true" ] && [ "$js_deps" != "true" ]; then
            if ! verdict=$(python3 scripts/lockfile-fanout.py pnpm --base "$BASE" --head HEAD); then
              verdict=all
              echo "::warning::lockfile-fanout.py failed on pnpm-lock.yaml — covering every app"
            fi
            if [ "$verdict" = "all" ]; then
              js_deps=true
              echo "::notice::pnpm-lock.yaml changed shared resolution — covering every app"
            elif [ -n "$verdict" ]; then
              # Importer paths, which map to apps exactly like source paths do.
              extra_paths="$verdict"
              echo "::notice::pnpm importers changed: $(echo "$verdict" | tr '\n' ' ')"
            fi
          fi

          echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "js_deps=$js_deps" >> "$GITHUB_OUTPUT"
          {
            echo "extra_paths<<__EOF__"
            echo "$extra_paths"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # WHICH APPS, not "are there any".
      #
      # This used to be `cargo metadata | .name` — every app in the workspace —
      # while the filters above are repo-wide booleans. So touching ONE
      # contract set `logic=true` and then built wasm and ran a two-node merobox
      # e2e for EVERY app: cost O(apps) per PR, and the per-app filtering this
      # file's header claims as the monorepo's new capability was never actually
      # expressed. Found by a reviewer, not by CI, because with one app in the
      # repo the two are indistinguishable.
      #
      # A genuine workspace-level change still means every app — an SDK bump
      # really does change every contract's bytes.
      - name: Resolve the app matrix
        id: set
        env:
          SHARED: ${{ steps.locks.outputs.shared }}
          TOOLING: ${{ steps.filter.outputs.tooling }}
          JS_DEPS: ${{ steps.locks.outputs.js_deps }}
          APP_FILES: ${{ steps.filter.outputs.app_files }}
          LOGIC_FILES: ${{ steps.filter.outputs.logic_files }}
          EXTRA_PATHS: ${{ steps.locks.outputs.extra_paths }}
        run: |
          set -euo pipefail
          if [ "$SHARED" = "true" ] || [ "$TOOLING" = "true" ] || [ "$JS_DEPS" = "true" ]; then
            apps=$(bash scripts/app-packages.sh all)
            echo "::notice::workspace-level change — covering every app: $apps"
          else
            apps=$(printf '%s\n%s' "$APP_FILES" "$EXTRA_PATHS" \
                   | bash scripts/app-packages.sh from-paths)
            echo "::notice::changed apps: $apps"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

          # Contracts only. A frontend edit or a lockfile importer cannot alter
          # what a two-node merobox run does, so neither belongs in the matrix
          # that starts merod containers.
          if [ "$SHARED" = "true" ] || [ "$TOOLING" = "true" ]; then
            contract_apps=$(bash scripts/app-packages.sh all)
            echo "::notice::contract-level change — merobox covers every app: $contract_apps"
          else
            contract_apps=$(printf '%s' "$LOGIC_FILES" | bash scripts/app-packages.sh from-paths)
            echo "::notice::merobox apps: $contract_apps"
          fi
          echo "contract_apps=$contract_apps" >> "$GITHUB_OUTPUT"

  # ── workspace-wide, cheap, always ──────────────────────────────────────────
  metadata:
    name: App metadata
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-app-metadata.sh

      # `icon` is the one field check-app-metadata.sh never looked at, and every
      # way it can be wrong is silent: the bundle publishes, this job is green,
      # and the only symptom is the wrong picture in the registry and in the
      # desktop launcher. Two apps shipped cargo-mero's shared placeholder for
      # months that way.
      - name: Assert every app's icon is real and safe to mask
        run: python3 scripts/check-app-icons.py

      # The matrix resolver decides what the rest of this file runs, and both of
      # its wrong answers are silent — too broad only costs money, too narrow
      # skips an app with nothing to notice. So its rules are tested.
      - name: Test the lockfile fan-out rules
        run: python3 scripts/tests/lockfile-fanout-test.py

      # A consumer job cannot run where its artifact's producer is gated off —
      # GitHub skips a job whose `needs:` was skipped, whatever its own `if:`
      # says. That failure is silent, so the gates are asserted here.
      - name: Assert artifact producers are not gated more narrowly than consumers
        run: python3 scripts/tests/producer-gate-test.py

      # `create_mesh` joins internally and has no step boundary to retry at, so
      # an unsettled one loses the whole scenario to a KeyDelivery race. The
      # symptom is a flake, which is why six scenarios shipped without a settle.
      - name: Assert every create_mesh is preceded by a settle
        run: python3 scripts/tests/mesh-settle-test.py

      # A lockfile inside a workspace member installs nothing (pnpm resolves
      # from the root) but Dependabot scans it, so it generates security alerts
      # forever. Two of them accounted for 176 of 182 open alerts, including all
      # four criticals.
      - name: Assert no lockfile lives inside a workspace member
        run: python3 scripts/tests/no-nested-lockfiles-test.py

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.logic == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      # ONE cache for the whole workspace, keyed on the single Cargo.lock. This
      # is where the monorepo pays for itself: `calimero-sdk` is compiled once
      # and every app links the same artifacts, instead of nine repos each
      # building it into nine separate caches.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # `cargo-native-`, not a key shared with the wasm jobs.
          #
          # GitHub's cache is write-once per key: the first job to finish saves
          # and every other save is REJECTED with a warning, not a failure. With
          # one key across `rust`, `wasm`, `e2e` and publish-bundle, the stored
          # tree was whichever job won the race — a native tree from
          # `cargo test --workspace`, or a wasm32 `app-release` tree from
          # `cargo mero build`, never both — so every later run restored the
          # wrong half and recompiled the other.
          key: cargo-native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-native-${{ runner.os }}-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Covers every app's TestHost tests and tests/converge.rs in one
      # invocation, sharing the compiled SDK.
      - run: cargo test --workspace

  wasm:
    name: Build WASM (${{ matrix.app }})
    needs: changes
    # ⚠️ This condition MUST stay identical to the `browser` job's, and it is not
    # about what a wasm build proves. This job is the only producer of
    # `mpk-<app>-<sha>`, and `browser` both `needs:` it and downloads that
    # artifact. A skipped `needs:` dependency skips the dependent job, so gating
    # this on contract-only changes silently skipped the browser e2e on every
    # frontend-only PR — while `browser`'s own `if` said, correctly, that a
    # frontend change is exactly what a UI-against-a-real-node test should catch.
    # Nothing failed; the check just read "skipping" and the PR looked green.
    # Measured on #35 (a login-wiring change across four frontends): Build WASM
    # skipped → Browser E2E skipped, zero browser coverage.
    #
    # The extra cost is small: the cargo cache below is keyed on `Cargo.lock`,
    # which a frontend-only change does not move, so this is a warm no-op
    # rebuild plus the bundling step, not a cold fat-LTO build. `e2e` keeps its
    # own contract-only gate, so the expensive two-node merobox legs are
    # unaffected.
    #
    # `apps != '[]'` is what makes an empty matrix a skipped job rather than a
    # job that silently succeeds having built nothing.
    if: (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.logic == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.tooling == 'true' || needs.changes.outputs.js_deps == 'true') && needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # ⚠️ `apps`, and it CANNOT be narrowed to `contract_apps`.
      #
      # This job is the only producer of `mpk-<app>` and `wasm-<app>`, and the
      # jobs that consume them do not agree on a matrix: `browser` runs over
      # `apps` (a frontend or lockfile change can break the UI), while `e2e`
      # runs over `contract_apps`. So this must cover the UNION, which is
      # `apps`.
      #
      # Narrowing it to `contract_apps` looks right — a pnpm resolution cannot
      # change a byte of wasm — and it is what this comment used to say. It
      # fails in the consumer instead, and not as a build error:
      #
      #     Unable to download artifact(s): Artifact not found for name:
      #     mpk-kv-store-<sha>
      #
      # which reads like a flaky runner rather than a matrix that skipped the
      # producer. Measured on migrate/merraria.
      # Sentinel fallback: an empty array leaves `${{ matrix.app }}` unexpanded,
      # so GitHub prints the raw template as a skipped check. Falling back to
      # `["none"]` keeps the name resolvable; this job's `if` gates on the same
      # `!= '[]'`, so the leg is skipped and simply reads "… (none)".
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps != '[]' && needs.changes.outputs.apps || '["none"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Separate from the native key — see the `rust` job. Shared between the
          # wasm and e2e jobs on purpose: both build the same wasm32 tree.
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - uses: ./.github/actions/install-cargo-mero

      # cargo-mero blanks RUSTFLAGS when unset (so a .cargo/config.toml is
      # ignored) but honours an ambient one. An app that ships a
      # `logic/wasm-rustflags` file exports it here into $GITHUB_ENV, so EVERY
      # wasm build in this job — the build below, the dry-run bundle, and any
      # fixture bundle — picks it up. Additive: an app with no file sets nothing.
      #
      # mero-sheets needs `-Ctarget-feature=-nontrapping-fptoint`: its recalc
      # engine casts f64->i64, lowering to the `i64.trunc_sat_f64_s` opcode that
      # cargo-mero's bundled wasm-opt rejects. The flag lowers the SAME
      # saturating cast without that opcode. Safe job-wide — this job only ever
      # builds wasm, never a native target.
      - name: Load per-app wasm RUSTFLAGS
        run: |
          f="apps/${{ matrix.app }}/logic/wasm-rustflags"
          [ -f "$f" ] && echo "RUSTFLAGS=$(tr -d '\n' < "$f")" >> "$GITHUB_ENV" || true

      - name: Build
        run: cargo mero build -p ${{ matrix.app }}

      # `cargo mero build` resolves the ABI from the compiled `__calimero_abi()`,
      # so this is the authoritative copy. A stale committed ABI would let the
      # generated-client check validate against a snapshot of a contract that no
      # longer exists and report success.
      - name: Assert the committed ABI matches the built contract
        run: |
          # `git add --intent-to-add` first: plain `git diff` ignores UNTRACKED
          # files, so a new app with no committed ABI at all would sail through
          # the gate that exists to notice exactly that.
          git add --intent-to-add -- 'apps/*/logic/res/abi.json' 'apps/*/logic/res/state-schema.json' 2>/dev/null || true
          if ! git diff --quiet -- 'apps/*/logic/res/abi.json' 'apps/*/logic/res/state-schema.json'; then
            echo "::error::a committed ABI is stale. Run 'cargo mero build -p ${{ matrix.app }}' and 'pnpm -F ${{ matrix.app }} codegen', then commit."
            git --no-pager diff --stat -- 'apps/*/logic/res/'
            git --no-pager diff -- 'apps/*/logic/res/abi.json' | head -200
            exit 1
          fi
          echo "committed ABI matches the built contract"

      # Prove the app is PUBLISHABLE, not merely compilable.
      #
      # This exists because of a gap it would have caught: kv-store had no `icon`
      # in [package.metadata.calimero], and `cargo mero bundle` refuses to run
      # without an icon decision — `no icon configured for <package>`. Nothing on
      # a pull request bundles, and the release workflow only runs on a push to
      # main, so that was a 12/12-green PR whose first act after merging would
      # have been a failed publish.
      #
      # `--dev` signs with the well-known development key, which the registry
      # REFUSES — so this can never publish anything by accident. It still
      # exercises everything that is easy to get wrong offline: the icon
      # decision, the package id's path-safety, the services list against the
      # built wasm, and the manifest the registry will render.
      #
      # --app-version is fixed rather than resolved from the registry: this
      # output is thrown away, and asking the registry for a number on every PR
      # would make CI depend on it being reachable.
      - name: Dry-run the bundle (dev key — never publishable)
        run: |
          cargo mero bundle \
            --manifest-path apps/${{ matrix.app }}/logic/Cargo.toml \
            --dev \
            --app-version 0.0.0 \
            --output "dist/dry-run-${{ matrix.app }}.mpk"

      # An app may ship a hand-rolled bundle FIXTURE its scenarios install —
      # scaffolding-e2e's two-service .mpk, which exists to exercise merod's
      # multi-service install and `service_name` selection. It has to be built
      # HERE: this is the only job with a Rust toolchain, and the e2e job
      # deliberately downloads the contract rather than rebuilding it. Without
      # this the scenario fails at `Application path not found`.
      - name: Build any bundle fixtures this app ships
        run: |
          script="apps/${{ matrix.app }}/logic/build-multi-service-bundle.sh"
          if [ -x "$script" ]; then
            echo "running $script"
            (cd "apps/${{ matrix.app }}/logic" && ./build-multi-service-bundle.sh)
          else
            echo "no bundle fixture for ${{ matrix.app }} — nothing to build"
          fi

      # A SEPARATE artifact on purpose. The upload below uses glob paths whose
      # least-common-ancestor is `apps/`, which is what makes `path: apps`
      # correct on the download side — adding a repo-root path like `dist/`
      # here would move that ancestor to `.` and silently break the layout the
      # e2e job depends on (see the note on that download step).
      - name: Upload the dev bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpk-${{ matrix.app }}-${{ github.sha }}
          path: dist/dry-run-${{ matrix.app }}.mpk
          retention-days: 3
          if-no-files-found: ignore

      # `always()` so a failing ABI gate still hands over the regenerated file —
      # which is exactly what the error asks you to commit. Withholding it makes
      # the error true and useless at the same time.
      - name: Upload wasm + ABI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.app }}-${{ github.sha }}
          path: |
            apps/*/logic/res/*.wasm
            apps/*/logic/res/abi.json
            apps/*/logic/res/state-schema.json
            apps/*/logic/res/*.mpk
          retention-days: 3

  frontend:
    name: Frontend (typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.logic == 'true' || needs.changes.outputs.tooling == 'true' || needs.changes.outputs.js_deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `tsc -b`, never `tsc --noEmit`: the app tsconfig is a solution file, and
      # --noEmit on a solution file checks nothing and exits 0.
      - run: pnpm -r typecheck

      # Regenerating and diffing is what turns a contract/frontend mismatch into
      # a failed build rather than a runtime 500. It needs no node and no wasm —
      # it reads the committed ABI, which the `wasm` job proves is current.
      - name: Assert the generated clients are current
        run: |
          pnpm -r codegen
          # Same reason as the ABI gate: untracked generated output is invisible
          # to `git diff`, so a new app could pass with no client committed.
          git add --intent-to-add -- 'apps/*/app/src/generated' 2>/dev/null || true
          if ! git diff --quiet -- 'apps/*/app/src/generated'; then
            echo "::error::a generated client is stale. Run 'pnpm -r codegen' and commit."
            git --no-pager diff -- 'apps/*/app/src/generated'
            exit 1
          fi
          echo "generated clients match the committed ABIs"

      - run: pnpm -r test
      - run: pnpm -r build

      # `pnpm -r build` succeeding does not mean Vercel will serve anything: it
      # uploads whatever `outputDirectory` names, and an empty or wrong path is
      # not an error. mero-sign deployed that way — its `vercel.json` pointed at
      # `apps/mero-sign/build`, which no build ever wrote. This asserts every
      # app's declared output directory is the one its build produced, and that
      # each carries the SPA rewrite its client-side router needs.
      - name: Assert vercel.json matches the real build output
        run: scripts/check-vercel-output.sh

  browser:
    name: Browser E2E (${{ matrix.app }})
    # `needs: wasm` for the same reason the merobox e2e does: run the bundle
    # that job already built and the ABI gate already validated, rather than
    # paying for a second fat-LTO wasm build.
    needs: [changes, wasm]
    # Frontend OR contract: this drives the UI against a real node, so either
    # side can break it — unlike the merobox e2e, which a frontend-only change
    # cannot affect.
    if: (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.logic == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.tooling == 'true' || needs.changes.outputs.js_deps == 'true') && needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Sentinel fallback: an empty array leaves `${{ matrix.app }}` unexpanded,
      # so GitHub prints the raw template as a skipped check. Falling back to
      # `["none"]` keeps the name resolvable; this job's `if` gates on the same
      # `!= '[]'`, so the leg is skipped and simply reads "… (none)".
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps != '[]' && needs.changes.outputs.apps || '["none"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mpk-${{ matrix.app }}-${{ github.sha }}
          path: bundle

      - name: Verify the bundle arrived
        run: |
          set -euo pipefail
          mpk=$(find bundle -name '*.mpk' -print -quit)
          if [ -z "$mpk" ]; then
            echo "::error::no .mpk in the downloaded artifact — the browser e2e would install nothing"
            ls -la bundle || true
            exit 1
          fi
          echo "KV_MPK_PATH=$PWD/$mpk" >> "$GITHUB_ENV"
          echo "using $mpk ($(wc -c <"$mpk") bytes)"

      # The merod the workspace declares, so the browser runs against the same
      # release the contract is built for. Read from the merod-image pin rather
      # than hard-coded, so a core bump stays one edit.
      - name: Resolve and download merod
        run: |
          set -euo pipefail
          ver=$(awk -F'"' '/^merod-image/{print $2}' Cargo.toml | sed 's/.*://')
          test -n "$ver"
          echo "merod $ver"
          url="https://github.com/calimero-network/core/releases/download/${ver}/merod_x86_64-unknown-linux-gnu.tar.gz"
          # ⚠️ Retried. This is the only unretried network fetch left in CI, and
          # it killed `Browser E2E (mero-blocks)` with
          #
          #     curl: (35) Recv failure: Connection reset by peer
          #
          # before a single test ran — a GitHub releases blip reported as an app
          # failure. `--retry-all-errors` so a reset counts as retryable (plain
          # `--retry` is documented around transient HTTP/timeout cases);
          # publish-bundle.yml already retries every call it makes.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 --max-time 300 "$url" -o /tmp/merod.tgz
          mkdir -p "$HOME/.local/merod"
          tar -xzf /tmp/merod.tgz -C "$HOME/.local/merod"
          bin=$(find "$HOME/.local/merod" -type f -name merod -print -quit)
          test -n "$bin"
          chmod +x "$bin"
          echo "MEROD_BINARY=$bin" >> "$GITHUB_ENV"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: pw
        working-directory: apps/${{ matrix.app }}/app
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Keyed on the resolved version so a Playwright bump invalidates it.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # ⚠️ `playwright install --with-deps` has no timeout of its own and has
      # been observed running to the 6-hour job default elsewhere in the fleet.
      # Capped, and the OS deps are installed separately on a cache hit so the
      # ~170 MB browser download is skipped.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        working-directory: apps/${{ matrix.app }}/app
        # Same apt hang as the cache-hit step below; same bounded retry.
        run: |
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::playwright install attempt $attempt hung or failed; retrying"
            sleep 15
          done
          echo "::error::playwright install failed three times — this is the apt hang, not the app"
          exit 1

      # ⚠️ Retried, and each ATTEMPT is bounded rather than just the step.
      #
      # `playwright install-deps` shells out to apt, which intermittently hangs
      # rather than failing. A bare `timeout-minutes` does not help: the step
      # timeout FAILS THE JOB, so a transient apt stall reads as a broken app.
      # It killed three jobs in one afternoon — Browser E2E (mero-sign) on main
      # and (mero-pixart) on a PR, both with no test output at all, the log
      # ending in `Terminate orphan process: (npm exec playwright install-deps
      # chromium)`. A rerun passed every time.
      #
      # `timeout` bounds each attempt so a hang becomes a retry instead of a
      # dead job; the step budget covers three of them.
      - name: Install Chromium OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        working-directory: apps/${{ matrix.app }}/app
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install-deps chromium; then exit 0; fi
            echo "::warning::playwright install-deps attempt $attempt hung or failed; retrying"
            sleep 15
          done
          echo "::error::playwright install-deps failed three times — this is the apt hang, not the app"
          exit 1

      # An app opts into a specific CI suite with `test:e2e:ci`; otherwise the
      # default projects run. scaffolding-e2e needs this: its default config has
      # a globalSetup that drives a real hosted login, which on a runner ends at
      # `chrome-error://chromewebdata/`, while its mocked config injects auth in
      # the page and needs no node.
      - name: Run the browser e2e
        working-directory: apps/${{ matrix.app }}/app
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:e2e:ci']?0:1)"; then
            echo "using this app's test:e2e:ci"
            pnpm run test:e2e:ci
          else
            npx playwright test
          fi

      - name: Upload the report and node log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ matrix.app }}-${{ github.sha }}
          path: |
            apps/${{ matrix.app }}/app/playwright-report
            apps/${{ matrix.app }}/app/test-results
            apps/${{ matrix.app }}/app/.playwright-data/*.log
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E (${{ matrix.app }})
    # BLOCKING again. It was made advisory when the namespace joins looked like
    # an unfixable core-side race; they were not. Every scenario now sets
    # `e2e_mode: true`, which clears `merod init`'s default `bootstrap.nodes` —
    # the PUBLIC calimero devnet boot-node. Without that, each container spent
    # its startup dialing unreachable public addresses until the relay client
    # hit capacity, the peers never found each other, and the join died on
    # `KeyDelivery timed out`. See the comment at the top of any scenario.
    # `needs: wasm` so the contract is DOWNLOADED, not rebuilt. This job used to
    # run `cargo mero build -p` itself, duplicating a fat-LTO wasm build the
    # `wasm` job had already done and uploaded — and it needed a Rust toolchain,
    # a cargo cache and cargo-mero to do it.
    needs: [changes, wasm]
    # Only when a CONTRACT or the pipeline moved. A frontend-only change cannot
    # alter what a two-node merobox run does, and each of these pulls an image
    # and starts two merod containers.
    if: (needs.changes.outputs.logic == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.tooling == 'true') && needs.changes.outputs.contract_apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Sentinel fallback: an empty array leaves `${{ matrix.app }}` unexpanded,
      # so GitHub prints the raw template as a skipped check. Falling back to
      # `["none"]` keeps the name resolvable; this job's `if` gates on the same
      # `!= '[]'`, so the leg is skipped and simply reads "… (none)".
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.contract_apps != '[]' && needs.changes.outputs.contract_apps || '["none"]') }}
    steps:
      - uses: actions/checkout@v4

      # The exact artifact the wasm job built and the ABI gate validated, so the
      # e2e runs the same bytes rather than a second independent build.
      #
      # `path: apps`, and that is not a guess — it is what the archive layout
      # actually is, established by getting it wrong twice.
      #
      # The upload uses GLOB paths (`apps/*/logic/res/*.wasm`). upload-artifact
      # takes the least-common-ancestor of the pattern's literal prefix, which is
      # `apps/`, so the archive contains `<app-dir>/logic/res/<name>.wasm`.
      # Therefore:
      #
      #   path: .                    -> ./kv-store/logic/res/…   (wrong: no apps/)
      #   path: apps/<app>/logic/res -> apps/<app>/logic/res/<app>/logic/res/…
      #   path: apps                 -> apps/<app>/logic/res/…   ✓
      #
      # Both wrong versions were caught in one line by the verification step
      # below rather than by merobox failing inside `install_application`, which
      # is the whole reason that step exists.
      - uses: actions/download-artifact@v4
        with:
          name: wasm-${{ matrix.app }}-${{ github.sha }}
          path: apps

      - name: Verify the contract arrived
        run: |
          set -euo pipefail
          res="apps/${{ matrix.app }}/logic/res"
          # ⚠️ This job — and publish-bundle.yml — index a DIRECTORY by cargo
          # PACKAGE name. That holds while every app directory is named like its
          # crate, which scripts/app-packages.sh no longer assumes for the
          # path->app mapping. Assert it here so the first app where they differ
          # says so, rather than failing as "no wasm".
          if [ ! -d "apps/${{ matrix.app }}/logic" ]; then
            echo "::error::no apps/${{ matrix.app }}/logic — this app's directory is not named after its cargo package, which this job assumes"
            exit 1
          fi
          wasm=$(find "$res" -name '*.wasm' -print -quit)
          if [ -z "$wasm" ]; then
            echo "::error::no wasm in the downloaded artifact — the e2e would run against nothing"
            ls -la "$res" || true
            exit 1
          fi
          echo "using $wasm ($(wc -c <"$wasm") bytes)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── the app's own dev bundle ────────────────────────────────────────────
      #
      # A scenario that passes `service_name` cannot install a bare .wasm — it
      # has to install a BUNDLE, because that is the only thing carrying the
      # services list the name selects from. Those scenarios were unrunnable
      # here: the wasm job uploads the bundle as a separate `mpk-` artifact and
      # only the BROWSER job downloaded it, so fifteen scenarios sat parked in
      # `logic/workflows/probes/` (one level below the `workflows/*.yml` glob)
      # rather than gating anything.
      #
      # Strict on purpose: this job `needs: wasm`, and the bundle dry-run runs
      # unconditionally there, so a missing artifact means something upstream is
      # wrong and should be loud rather than a scenario failing later with
      # `Application path not found`.
      - uses: actions/download-artifact@v4
        with:
          name: mpk-${{ matrix.app }}-${{ github.sha }}
          path: apps/${{ matrix.app }}/logic/dist

      # The artifact is named after the DIRECTORY (`dry-run-<app>.mpk`), but a
      # scenario refers to the bundle by its PACKAGE ID — `dist/<package>.mpk`,
      # the same name `cargo mero bundle` writes locally, which is what makes a
      # scenario runnable by hand as well as in CI. Read the id out of the
      # manifest rather than assuming it equals the directory name; the two are
      # deliberately allowed to differ (mero-design/mero-pixart already do).
      #
      # tomllib is stdlib from 3.11, which the step above just installed.
      - name: Name the bundle after its package id
        working-directory: apps/${{ matrix.app }}/logic
        run: |
          set -euo pipefail
          pkg=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['metadata']['calimero']['package'])")
          src="dist/dry-run-${{ matrix.app }}.mpk"
          if [ ! -f "$src" ]; then
            echo "::error::$src missing from the mpk artifact — a service_name scenario would fail as 'Application path not found'"
            ls -la dist || true
            exit 1
          fi
          cp "$src" "dist/${pkg}.mpk"
          echo "bundle available as dist/${pkg}.mpk ($(wc -c <"$src") bytes)"

      # calimero-client-py ships an sdist ONLY, so an uncached job compiles a
      # Rust wheel (~70s measured).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-e2e.txt') }}

      # Both pins come from ONE file. Pinning merobox alone pins nothing:
      # calimero-client-py is a transitive dep that tracks core master.
      - run: pip install -r requirements-e2e.txt && merobox --version

      # Free schema gate. Catches a YAML mistake before fourteen containers
      # start, instead of after.
      - name: Validate workflows
        working-directory: apps/${{ matrix.app }}/logic
        run: |
          shopt -s nullglob
          for f in workflows/*.yml; do merobox bootstrap validate "$f"; done

      # ⚠️ Tear the containers down BETWEEN scenarios, not just at the end.
      # `nuke_on_start` in a scenario clears DATA, not a previous scenario's
      # running containers, and scenarios pick their own node prefix while
      # sharing the default host ports. So the second scenario to want 2428
      # dies at:
      #
      #     Bind for 0.0.0.0:2428 failed: port is already allocated
      #
      # which reads like a runner problem rather than a missing teardown. Any
      # app with ONE scenario — kv-store, mero-design, merraria — never sees it;
      # scaffolding-e2e has 18.
      - name: Run workflows
        working-directory: apps/${{ matrix.app }}/logic
        run: |
          shopt -s nullglob

          # Run one scenario; always tear the containers down afterwards so a
          # retry (or the next scenario) starts from a clean host.
          run_one() {
            merobox bootstrap run "$1" --log-level info
            local s=$?
            # ⚠️ `stop` alone is not enough between attempts, which made the
            # retry loop actively misleading.
            #
            # Observed on main: kv-store's attempt 1 lost the join race
            # (`join_namespace … 500`), then attempts 2-5 all failed EARLIER, at
            # `create_namespace … 500` — a step that had just succeeded.
            # Stopping a container leaves its data folder behind, so each retry
            # started on a host still holding the previous attempt's state and
            # failed for a different reason than the one being retried.
            #
            # `merobox nuke` deletes the node data folders, which is what makes a
            # retry an actual retry. `nuke_on_start: true` covers this for the
            # scenarios that set it; 39 of them do not.
            # NOT silenced. Suppressing this hid the very thing that needed
            # reading: after any failed attempt, every later attempt failed
            # EARLIER (at `create_namespace`), which means the teardown is the
            # suspect — and with the output thrown away there was no way to tell
            # whether `nuke` even ran.
            # ⚠️ `stop --all` and `nuke` are BOTH insufficient, and the
            # diagnostics above are what showed it:
            #
            #   --- teardown after attempt (exit 0) ---
            #   No Calimero nodes are currently running
            #   No Calimero node data directories found.
            #   kvc-node-3-init Exited (0) About a minute ago
            #   kvc-node-2-init Exited (0) About a minute ago
            #   kvc-node-1-init Exited (0) About a minute ago
            #
            # `stop` does not see the `*-init` containers, and `nuke` finds no
            # host data directories at all because the state lives in Docker. So
            # the next scenario started on a host still holding the previous
            # one's containers and network, and its join then hung ~50s and
            # 500d: kv-store's `converge.yml` passed, and `simple-store.yml`
            # failed at `Create mesh with node-2` on all SIX attempts, always at
            # the same step. Deterministic, not flaky.
            #
            # A CI runner is disposable and only ever holds merobox containers
            # here, so removing all of them plus the networks is both safe and
            # the only thing that actually makes the next attempt cold.
            echo "--- teardown after attempt (exit $s) ---"
            merobox stop --all 2>&1 | tail -3 || true
            merobox nuke --force 2>&1 | tail -3 || true
            leftover=$(docker ps -aq 2>/dev/null || true)
            if [ -n "$leftover" ]; then
              echo "removing $(echo "$leftover" | wc -l | tr -d ' ') leftover container(s)"
              docker rm -f $leftover >/dev/null 2>&1 || true
            fi
            docker network prune -f >/dev/null 2>&1 || true
            docker volume prune -f >/dev/null 2>&1 || true
            echo "remaining: $(docker ps -aq 2>/dev/null | wc -l | tr -d ' ') container(s)"
            return $s
          }

          # Up to 6 attempts per scenario, for the cold-namespace-join
          # KeyDelivery flake: `join_namespace` (and `create_mesh`, which joins
          # internally) 500s when the group key misses its 5s gossip window — a
          # core-side timing race CI load provokes. It has been observed to lose
          # TWICE in a row on a heavily loaded runner, so one retry was not
          # enough; three attempts makes that vanishingly unlikely while a
          # genuine failure still loses all three and reds the job. A
          # `create_mesh` scenario has no step boundary to settle at, so the
          # whole scenario is the unit of retry.
          for f in workflows/*.yml; do
            echo "::group::$f"
            ok=0
            # 4 attempts with an ESCALATING gap, not 3 with a flat 5s. The
            # in-scenario settle before each join is already 12s and
            # group-late-joiner.yml is explicit that widening it further is the
            # wrong lever; what is left is the gap BETWEEN attempts. A retry
            # starting 5s after a torn-down stack races the same cold state the
            # previous attempt lost to.
            #
            # Observed on a full-fanout run (a `shared` change reaches all 16
            # apps): battleships, mero-design, mero-calendar and scaffolding-e2e
            # each lost all THREE attempts at `Node 2 Joins Namespace`, while the
            # same legs pass on a narrow run.
            # 6 attempts, and the count is chosen from the observed failure
            # SHAPE rather than picked round.
            #
            # `create_mesh` joins its `nodes:` list in a sequential loop with NO
            # delay between them (merobox mesh.py), so a settle before the step
            # only helps the FIRST node — the second joins with nothing. That is
            # why `authored-shared.yml` (2 nodes in one mesh) is the worst leg,
            # while `access-control.yml` (1 node) fails an attempt and passes the
            # next. Losing 4 independent attempts puts its per-attempt success
            # near 1 in 4; 6 attempts with teardown between each is what makes
            # the leg reliable without pretending the underlying race is fixed.
            #
            # This cannot be fixed from this repository: the join races core's
            # KeyDelivery window, merobox exposes no wait-for-connectivity gate
            # (`wait_for_sync` needs membership the joining node does not yet
            # have), `bootstrap_nodes` wants a peer id unknown until runtime, and
            # group-late-joiner.yml rules out widening the in-scenario settle.
            for attempt in 1 2 3 4 5 6; do
              if run_one "$f"; then ok=1; break; fi
              if [ "$attempt" -lt 6 ]; then
                # capped so six attempts do not blow the 40-minute job budget
                gap=$(( attempt * 15 )); [ "$gap" -gt 45 ] && gap=45
                echo "::warning file=$f::attempt $attempt failed — retrying in ${gap}s (cold-join KeyDelivery flake)"
                sleep "$gap"
              fi
            done
            echo "::endgroup::"
            if [ "$ok" -ne 1 ]; then
              # Deliberately NOT "this is a real failure". Six backed-off
              # attempts still lose sometimes, and saying otherwise sends the
              # reader after the app instead of the race.
              echo "::error file=$f::scenario failed on all 6 attempts — most likely the cold-join KeyDelivery race (core-side); check the node-logs artifact before treating it as an app defect"
              exit 1
            fi
          done

      # `merobox logs` takes a NODE_NAME argument — with only `--tail` it exits
      # `Error: Missing argument 'NODE_NAME'`, so the first version of this step
      # produced no diagnostics at all on the failure it existed to explain.
      # `merobox bootstrap run` already exports each node's log to
      # data/container-logs/, so upload that instead of re-deriving it.
      - name: Collect node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-logs-${{ matrix.app }}-${{ github.run_attempt }}
          path: apps/${{ matrix.app }}/logic/data/container-logs/
          if-no-files-found: ignore
          retention-days: 3
