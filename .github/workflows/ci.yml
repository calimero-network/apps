# Per-app CI, path-filtered.
#
# The filter is the point. A frontend-only change must not pay for a WASM build,
# and a change to the workspace root must fan out
# to EVERY app — because bumping the SDK changes every contract's bytes. The
# per-repo setup this replaces could not express the second half at all.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all:
        # Re-verify the whole fleet on demand — e.g. after an SDK bump whose own
        # run was cancelled (see concurrency below). A dispatch otherwise has
        # no diff to scope from.
        description: Run every app, not only what changed
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale runs on a PR branch only. On main every merge must finish:
  # cancelling there meant two merges seconds apart discarded the first one's
  # run — which is how the rc.45 SDK bump (#215) landed without its fleet-wide
  # run ever completing, hidden under the next merge's app-scoped run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── what changed ───────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.set.outputs.apps }}
      # `apps` as {app, shard} pairs: an app in BROWSER_SHARDS runs its browser
      # e2e split across that many runners.
      browser_matrix: ${{ steps.set.outputs.browser_matrix }}
      journey_matrix: ${{ steps.journey.outputs.matrix }}
      logic: ${{ steps.filter.outputs.logic }}
      # pnpm workspace dirs the frontend job typechecks/tests/builds, or
      # ["*"] for all of them. Frontend-only apps (no crate) appear here and
      # nowhere in `apps`.
      frontend_dirs: ${{ steps.set.outputs.frontend_dirs }}
      # `shared` and `js_deps` are the EFFECTIVE verdicts, not the raw path
      # filters: a lockfile that changed only for the app being touched does not
      # make this a workspace-level change. See the `locks` step below.
      shared: ${{ (github.event_name == 'workflow_dispatch' && inputs.all) && 'true' || steps.locks.outputs.shared }}
      tooling: ${{ steps.filter.outputs.tooling }}
      js_deps: ${{ steps.locks.outputs.js_deps }}
      # The raw `conformance` filter, not narrowed by the `locks` step: any
      # lockfile move can change the mero-js/mero-react the rig runs. A manual
      # "run every app" dispatch runs it too.
      conformance: ${{ (github.event_name == 'workflow_dispatch' && inputs.all) && 'true' || steps.filter.outputs.conformance }}
    steps:
      # Full history: deciding whether a lockfile change reaches other apps
      # means reading the lockfile as it was BEFORE this change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `list-files: shell` so the per-app mapping below reads real paths
          # instead of re-deriving them from a boolean.
          list-files: shell
          filters: |
            # A workspace-level change is one that can change a CONTRACT's
            # bytes, which is what justifies fanning out to every app.
            #
            # It used to include `.github/**`, `scripts/**` and the JS
            # workspace files, so editing a COMMENT in this very file triggered
            # the most expensive path in the pipeline. Those still need to run
            # something — they just do not change any wasm — so they are their
            # own filters below.
            #
            # The manifest and the lockfile are separate because they answer
            # differently: editing the workspace manifest is always everyone's
            # business, while `Cargo.lock` is also rewritten just by adding or
            # renaming an app. The `locks` step tells those two cases apart.
            #
            # Add 'crates/**' to `workspace_manifest` when that dir is created.
            workspace_manifest:
              - 'Cargo.toml'
            cargo_lock:
              - 'Cargo.lock'
            # The pipeline itself changed, so the pipeline has to be exercised.
            #
            # NOT `.github/**` and NOT `scripts/**`. release.yml and
            # publish-bundle.yml drive nothing here, and the `check-*.py` guards
            # and their tests run ONLY in the `metadata` job, which always runs.
            # Listing them here meant a mero-design PR that moved a guard's
            # baseline (#204) rebuilt and browser-tested all 17 apps.
            tooling:
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'scripts/app-packages.sh'
              - 'scripts/ci-scope.py'
              - 'scripts/lockfile-fanout.py'
            # Runs only in the frontend job, over every app's build output.
            frontend_tooling:
              - 'scripts/check-vercel-output.sh'
              - 'scripts/check-service-workers.py'
              # The generator every app's `codegen` runs, at its pinned tag.
              - 'scripts/install-mero-app-build.sh'
            # JS-only: a catalog bump or a tsconfig change cannot alter a
            # contract.
            #
            # Same split as above. The catalog and the shared tsconfig are
            # everyone's; `pnpm-lock.yaml` is per-importer, so adding an app
            # rewrites it without changing what any other app resolves.
            js_config:
              - 'tsconfig.base.json'
              - 'package.json'
            # The catalog SOURCE. Split out of `js_config` because it answers
            # differently for the same reason the lockfiles do: an arriving app
            # only ADDS catalog entries for dependencies no one else has, which
            # cannot change what another app resolves. The `locks` step tells
            # that apart from an existing pin actually moving.
            pnpm_workspace:
              - 'pnpm-workspace.yaml'
            pnpm_lock:
              - 'pnpm-lock.yaml'
            logic:
              - 'apps/*/logic/**'
            frontend:
              - 'apps/*/app/**'
            # Everything that can reach an app. scripts/ci-scope.py decides
            # WHICH apps: a README or a dev script beside an app reaches none,
            # and a shared package reaches every app that imports it.
            app:
              - 'apps/**'
              - 'packages/**'
            # The conformance rig (conformance.yml). Not an app ci-scope.py maps:
            # it has no contract of its own, and what it checks is what a shared
            # package or a JS dependency bump can break for EVERY app — the
            # admin and RPC calls mero-react makes, on a node and on an account.
            conformance:
              - 'apps/conformance/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/conformance.yml'

      # DID THE LOCKFILES CHANGE FOR ANYONE ELSE?
      #
      # `Cargo.lock` and `pnpm-lock.yaml` are rewritten whenever an app is
      # added, renamed or removed, and both used to be plain booleans that
      # fanned out to every app. So every migration PR paid for the full WASM +
      # browser matrix to prove that nine untouched apps still built.
      #
      # scripts/lockfile-fanout.py answers the narrower question the fan-out
      # actually needs — see its docstring for the rules, and
      # scripts/tests/lockfile-fanout-test.py for both branches pinned.
      - name: Decide whether the lockfile changes reach other apps
        id: locks
        env:
          MANIFEST: ${{ steps.filter.outputs.workspace_manifest }}
          CARGO_LOCK: ${{ steps.filter.outputs.cargo_lock }}
          JS_CONFIG: ${{ steps.filter.outputs.js_config }}
          PNPM_WORKSPACE: ${{ steps.filter.outputs.pnpm_workspace }}
          PNPM_LOCK: ${{ steps.filter.outputs.pnpm_lock }}
          # For a PR this is the base of the merge; for a push, the previous
          # tip. Empty or all-zeroes (a brand-new branch) makes the script
          # answer `all`, which is the safe direction.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -uo pipefail

          # The shared JS config is everyone's business on its own; the
          # manifest and the lockfiles only sometimes are.
          shared=false
          js_deps="$JS_CONFIG"
          extra_paths=""

          # Note the explicit failure branch on every probe below. With `set
          # -e` a crash would kill the job; WITHOUT it, an unchecked `$(...)`
          # leaves `verdict` empty, which reads as "no fan-out" and SKIPS apps
          # — the one direction that fails silently. So a failure is forced to
          # mean `all`.
          # Porting an app to the component SDK appends its crate to
          # `[workspace].exclude` and nothing else here; that cannot change
          # another member's bytes, so it must not cost the full matrix.
          if [ "$MANIFEST" = "true" ]; then
            if ! verdict=$(python3 scripts/lockfile-fanout.py manifest --base "$BASE" --head HEAD); then
              verdict=all
              echo "::warning::lockfile-fanout.py failed on Cargo.toml — covering every app"
            fi
            if [ "$verdict" = "all" ]; then
              shared=true
              echo "::notice::Cargo.toml changed the workspace — covering every app"
            else
              echo "::notice::Cargo.toml only changed [workspace].exclude or the component pins — no fan-out"
            fi
          fi

          if [ "$CARGO_LOCK" = "true" ] && [ "$shared" != "true" ]; then
            if ! verdict=$(python3 scripts/lockfile-fanout.py cargo --base "$BASE" --head HEAD); then
              verdict=all
              echo "::warning::lockfile-fanout.py failed on Cargo.lock — covering every app"
            fi
            if [ "$verdict" = "all" ]; then
              shared=true
              echo "::notice::Cargo.lock moved a dependency — covering every app"
            else
              echo "::notice::Cargo.lock changed only for the apps in this PR"
            fi
          fi

          if [ "$PNPM_WORKSPACE" = "true" ] && [ "$js_deps" != "true" ]; then
            if ! verdict=$(python3 scripts/lockfile-fanout.py catalog --base "$BASE" --head HEAD); then
              verdict=all
              echo "::warning::lockfile-fanout.py failed on pnpm-workspace.yaml — covering every app"
            fi
            if [ "$verdict" = "all" ]; then
              js_deps=true
              echo "::notice::pnpm-workspace.yaml moved an existing catalog pin — covering every app"
            else
              echo "::notice::pnpm-workspace.yaml only added catalog entries — no fan-out"
            fi
          fi

          if [ "$PNPM_LOCK" = "true" ] && [ "$js_deps" != "true" ]; then
            if ! verdict=$(python3 scripts/lockfile-fanout.py pnpm --base "$BASE" --head HEAD); then
              verdict=all
              echo "::warning::lockfile-fanout.py failed on pnpm-lock.yaml — covering every app"
            fi
            if [ "$verdict" = "all" ]; then
              js_deps=true
              echo "::notice::pnpm-lock.yaml changed shared resolution — covering every app"
            elif [ -n "$verdict" ]; then
              # Importer paths, which map to apps exactly like source paths do.
              extra_paths="$verdict"
              echo "::notice::pnpm importers changed: $(echo "$verdict" | tr '\n' ' ')"
            fi
          fi

          echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "js_deps=$js_deps" >> "$GITHUB_OUTPUT"
          {
            echo "extra_paths<<__EOF__"
            echo "$extra_paths"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # WHICH APPS, not "are there any".
      #
      # This used to be `cargo metadata | .name` — every app in the workspace —
      # while the filters above are repo-wide booleans. So touching ONE
      # contract set `logic=true` and then built wasm and ran the node e2e for
      # EVERY app: cost O(apps) per PR, and the per-app filtering this
      # file's header claims as the monorepo's new capability was never actually
      # expressed. Found by a reviewer, not by CI, because with one app in the
      # repo the two are indistinguishable.
      #
      # A genuine workspace-level change still means every app — an SDK bump
      # really does change every contract's bytes.
      - name: Resolve the app matrix
        id: set
        env:
          # A manual "run every app" dispatch counts as a workspace-level change.
          SHARED: ${{ (github.event_name == 'workflow_dispatch' && inputs.all) && 'true' || steps.locks.outputs.shared }}
          TOOLING: ${{ steps.filter.outputs.tooling }}
          FRONTEND_TOOLING: ${{ steps.filter.outputs.frontend_tooling }}
          JS_DEPS: ${{ steps.locks.outputs.js_deps }}
          APP_FILES: ${{ steps.filter.outputs.app_files }}
          EXTRA_PATHS: ${{ steps.locks.outputs.extra_paths }}
          # Runners per app whose browser e2e outgrows one job's limit. Playwright
          # splits by test count in project order, so mero-docs' last shard
          # takes most of the ~30s two-node tests: at 4 it ran 24.4 of the
          # job's 25 minutes and timed out after two in-run retries.
          BROWSER_SHARDS: '{"mero-docs": 6}'
        run: |
          set -euo pipefail
          # pnpm importers arrive as bare dirs (`apps/x/app`); give them a file
          # so they map the way a changed source file does.
          importers=$(printf '%s\n' "$EXTRA_PATHS" | sed '/^$/d; s|$|/package.json|')
          if ! scope=$(printf '%s\n%s\n' "$APP_FILES" "$importers" | python3 scripts/ci-scope.py); then
            echo "::warning::ci-scope.py failed — covering every app"
            SHARED=true
            scope='{"app_paths":[],"frontend_dirs":[]}'
          fi
          echo "scope: $scope"

          if [ "$SHARED" = "true" ] || [ "$TOOLING" = "true" ] || [ "$JS_DEPS" = "true" ]; then
            apps=$(bash scripts/app-packages.sh all)
            frontend_dirs='["*"]'
            echo "::notice::workspace-level change — covering every app: $apps"
          else
            apps=$(jq -r '.app_paths[]' <<<"$scope" | bash scripts/app-packages.sh from-paths)
            frontend_dirs=$(jq -c '.frontend_dirs' <<<"$scope")
            [ "$FRONTEND_TOOLING" = "true" ] && frontend_dirs='["*"]'
            echo "::notice::changed apps: $apps"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          browser_matrix=$(jq -c --argjson shards "$BROWSER_SHARDS" \
            '[.[] as $app | ($shards[$app] // 1) as $n | range(1; $n + 1) | {app: $app, shard: "\(.)/\($n)"}]' <<<"$apps")
          echo "browser_matrix=$browser_matrix" >> "$GITHUB_OUTPUT"
          echo "frontend_dirs=$frontend_dirs" >> "$GITHUB_OUTPUT"
          echo "::notice::frontend dirs: $frontend_dirs"

      - name: Resolve the journey matrix
        id: journey
        env:
          APPS: ${{ steps.set.outputs.apps }}
        run: |
          set -euo pipefail
          pin=$(awk -F'"' '/^merod-image/{print $2}' Cargo.toml | sed 's/.*://')
          desktop=$(curl -fsSL --retry 5 --retry-all-errors https://raw.githubusercontent.com/calimero-network/tauri-app/master/merod-config.json | jq -r .version || true)
          desktop_leg="$desktop"
          if [ "$(python3 scripts/merod-older.py "$desktop" "$pin")" = true ]; then
            echo "::warning::journey: the desktop ships merod $desktop, older than the pin $pin; bundles built against $pin refuse to install on it, so the desktop leg is skipped until tauri-app bumps merod-config.json"
            desktop_leg=""
          fi
          legs=$(jq -nc --arg pin "$pin" --arg desktop "$desktop_leg" \
            '[{leg: "pin", merod: $pin}] + (if ($desktop != "" and $desktop != "null" and $desktop != $pin) then [{leg: "desktop", merod: $desktop}] else [] end)')
          with_journey=$(jq -r '.[]' <<<"$APPS" | while read -r app; do
            if [ -f "apps/$app/app/playwright.journey.config.ts" ]; then echo "$app"; fi
          done | jq -Rsc 'split("\n") | map(select(length > 0))')
          # An app that ships its frontend in its bundle also runs from the one its node serves.
          node_legs=$(python3 scripts/frontend-dir.py --list | jq -Rsc --arg pin "$pin" --argjson apps "$with_journey" \
            'split("\n") | map(select(length > 0 and . as $a | $apps | index($a))) | map({app: ., leg: "node", merod: $pin})')
          matrix=$(jq -c --argjson legs "$legs" --argjson node "$node_legs" '[.[] as $app | $legs[] | . + {app: $app}] + $node' <<<"$with_journey")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "::notice::journey: pin $pin, desktop ${desktop:-unknown}; $matrix"

  # ── workspace-wide, cheap, always ──────────────────────────────────────────
  metadata:
    name: App metadata
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: check-live-frontends.py asks whether a live origin serves
      # a title this repo has EVER built for that app, which it answers from
      # `git log --follow` over each index.html. A depth-1 checkout makes that
      # lookup blind, and the check then falls back to comparing production
      # against an undeployed working tree — the exact false positive it was
      # changed to stop.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/check-app-metadata.sh

      # Two dependency PRs merged back to back red EVERY app: git line-merges
      # pnpm-lock.yaml into a hybrid with a duplicated mapping key, pnpm refuses
      # the whole file, and every job dies at install. The key is in NEITHER
      # branch — git makes it. Cheap to check, and the message names the cause.
      - name: Assert pnpm-lock.yaml is not a merged hybrid
        run: python3 scripts/check-lockfile.py

      # `icon` is the one field check-app-metadata.sh never looked at, and every
      # way it can be wrong is silent: the bundle publishes, this job is green,
      # and the only symptom is the wrong picture in the registry and in the
      # desktop launcher. Two apps shipped cargo-mero's shared placeholder for
      # months that way.
      - name: Assert every app's icon is real and safe to mask
        run: python3 scripts/check-app-icons.py

      # A cold desktop open hands the app a minted session in the URL fragment,
      # and mero-react's node-trust rule is default-DENY: an app that anchors
      # neither way drops it with only a console error. Nothing throws and the
      # web path is unaffected, so it survives any amount of green CI — three
      # apps were in that state.
      - name: Assert every app can adopt a desktop hand-off
        run: python3 scripts/check-desktop-sso.py

      # Every core request struct is `deny_unknown_fields`, so an extra body key
      # is a 400 that kills the whole call — not a field the node ignores. Two
      # of them were live against rc.34: `alias` on namespace/context create
      # (core replaced the group alias with a metadata record in #2338) and
      # `executorPublicKey` on the JSON-RPC envelope (dropped in #2116). Nothing
      # here could catch either — the vitest wire tests assert the keys that
      # should be present and never that nothing else is, the Playwright suites
      # `page.route` the node so no deserializer ever sees the body. This reads the bodies out of the source and compares them to core's
      # schema, which is the only check in this file that does.
      - name: Assert no app sends a body key the node refuses
        run: python3 scripts/check-admin-wire.py

      # The checker's own tests. Its first version matched routes as LITERAL
      # strings, so every `` `/namespaces/${id}/groups` `` call site was
      # invisible to it and four apps sent `groupAlias` there under a green
      # check. A guard that silently stops covering a shape is worse than no
      # guard, because it also carries the claim that the shape is covered.
      - name: Assert the wire checker still catches what it claims to
        run: python3 scripts/tests/admin-wire-test.py

      # Since core#4890 each app has its own team in an organization, and what
      # invite, remove and leave mean depends on the org's mode: in an org
      # that keeps its apps apart, an invite that does not name the app's
      # team opens every app to the person, with nothing thrown. Those rules
      # live in one module (`packages/connect/src/orgApp.ts`); this fails when
      # an org app calls `createOrg`, `scopeApps`, `invite` or `removeMember`
      # itself. Unconverted apps sit on an exemption list that only shrinks.
      - name: Assert org apps reach their organization through the shared module
        run: python3 scripts/check-org-app-module.py
      - name: Assert the org-app module check still catches what it claims to
        run: python3 scripts/tests/org-app-module-test.py

      # `battleships.vercel.app` served a create-react-app build for an unknown
      # length of time after the app moved to Vite in this repo. The repo was
      # fine and every existing check passed; the Vercel project simply never
      # deployed from here. That URL is what the registry publishes as
      # links.frontend, so it is what the desktop launcher opens, what invite
      # links resolve to, and what authorizes a login callback — a stale
      # deployment silently becomes the app. An unreachable host reports as
      # skipped, not as a failure: a check that reds the build when a third
      # party is down gets switched off, and then it catches nothing.
      - name: Assert each live deployment is the app this repo builds
        run: python3 scripts/check-live-frontends.py

      - name: Assert the live-frontend history survives an app rename
        run: python3 scripts/tests/live-frontends-history-test.py

      - name: Assert the publish script uploads straight to storage
        run: bash scripts/publish-bundle.test.sh

      # Release skips a component whose manifest equals the registry's latest.
      # Wrong one way and a change nodes act on (outbound, frontendAliases,
      # upgrades, the guide) silently never ships; wrong the other and every
      # dispatch adds a duplicate version to the registry's Redis.
      - name: Assert Release skips only a component nothing changed in
        run: python3 scripts/tests/registry-unchanged-test.py

      # The frontend packed into a bundle is built with the lowest release the
      # cluster runs: too high and it refuses every node of a half-rolled-out
      # cluster, so the derivation is tested against fixture responses.
      - name: Assert the derived attestation floor is the cluster's lowest release
        run: python3 scripts/tests/cluster-min-release-test.py

      # The vitest copy-lint suite only scans string literals and JSX text in a
      # handful of files, so an em dash in a comment, a test name or a Rust doc
      # comment slips past review every time. This scans
      # every tracked file under apps/mero-docs instead. The landing page is a
      # generated copy of scripts/landing/template, so it is fixed there.
      - name: Assert no em dash in apps/mero-docs
        run: |
          ! git grep -nI $'\u2014' -- apps/mero-docs ':!apps/mero-docs/app/src/pages/landing' ':!apps/mero-docs/app/src/generated'

      # The matrix resolver decides what the rest of this file runs, and both of
      # its wrong answers are silent — too broad only costs money, too narrow
      # skips an app with nothing to notice. So its rules are tested.
      - name: Test the lockfile fan-out rules
        run: python3 scripts/tests/lockfile-fanout-test.py

      # The per-app scope. Wrong in either direction and nothing fails: too
      # broad costs the whole matrix, too narrow skips an app silently.
      - name: Assert the app scope picks the apps a change reaches, and only those
        run: python3 scripts/tests/ci-scope-test.py

      # Vercel's ignore step reuses that scope. Too narrow and a changed app
      # never deploys; too broad and every push rebuilds every Vercel project.
      - name: Assert Vercel skips only the apps a change does not reach
        run: python3 scripts/tests/vercel-ignore-build-test.py

      # Its fixtures are real builds: mero-chat's worker before and after it
      # stopped precaching its page, and hyperfeed's push-only worker.
      - name: Assert the service-worker check still catches a precached page
        run: python3 scripts/tests/service-workers-test.py

      # A consumer job cannot run where its artifact's producer is gated off —
      # GitHub skips a job whose `needs:` was skipped, whatever its own `if:`
      # says. That failure is silent, so the gates are asserted here.
      - name: Assert artifact producers are not gated more narrowly than consumers
        run: python3 scripts/tests/producer-gate-test.py

      # A filter that stops matching skips the rig with nothing to notice.
      - name: Assert the conformance rig is gated on the paths it depends on
        run: python3 scripts/tests/conformance-gate-test.py

      - name: Assert the journey skips a desktop merod older than the pin
        run: python3 scripts/tests/merod-older-test.py

      # A lockfile inside a workspace member installs nothing (pnpm resolves
      # from the root) but Dependabot scans it, so it generates security alerts
      # forever. Two of them accounted for 176 of 182 open alerts, including all
      # four criticals.
      - name: Assert no lockfile lives inside a workspace member
        run: python3 scripts/tests/no-nested-lockfiles-test.py

      - name: Assert frontend-dir is read from the TOML, not grepped
        run: python3 scripts/tests/frontend-dir-test.py

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.logic == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      # ONE cache for the whole workspace, keyed on the single Cargo.lock. This
      # is where the monorepo pays for itself: `calimero-sdk` is compiled once
      # and every app links the same artifacts, instead of nine repos each
      # building it into nine separate caches.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # `cargo-native-`, not a key shared with the wasm jobs.
          #
          # GitHub's cache is write-once per key: the first job to finish saves
          # and every other save is REJECTED with a warning, not a failure. With
          # one key across `rust`, `wasm` and publish-bundle, the stored
          # tree was whichever job won the race — a native tree from
          # `cargo test --workspace`, or a wasm32 `app-release` tree from
          # `cargo mero build`, never both — so every later run restored the
          # wrong half and recompiled the other.
          key: cargo-native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-native-${{ runner.os }}-

      # Once the last v1 app moves to the component SDK the root workspace has
      # no members, and `cargo fmt --all` / `clippy --workspace` fail on an
      # empty virtual manifest. Component apps are covered by components.yml.
      - id: ws
        name: Count root workspace members
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.workspace_members | length')
          echo "members=$n" >> "$GITHUB_OUTPUT"
          [ "$n" != 0 ] || echo "::notice::the root workspace has no members; every app is a component app (components.yml)"
      - if: steps.ws.outputs.members != '0'
        run: cargo fmt --all -- --check
      - if: steps.ws.outputs.members != '0'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Covers every app's TestHost tests and tests/converge.rs in one
      # invocation, sharing the compiled SDK.
      - if: steps.ws.outputs.members != '0'
        run: cargo test --workspace

  wasm:
    name: Build WASM (${{ matrix.app }})
    needs: changes
    # ⚠️ This condition MUST stay identical to the `browser` job's, and it is not
    # about what a wasm build proves. This job is the only producer of
    # `mpk-<app>-<sha>`, and `browser` both `needs:` it and downloads that
    # artifact. A skipped `needs:` dependency skips the dependent job, so gating
    # this on contract-only changes silently skipped the browser e2e on every
    # frontend-only PR — while `browser`'s own `if` said, correctly, that a
    # frontend change is exactly what a UI-against-a-real-node test should catch.
    # Nothing failed; the check just read "skipping" and the PR looked green.
    # Measured on #35 (a login-wiring change across four frontends): Build WASM
    # skipped → Browser E2E skipped, zero browser coverage.
    #
    # The extra cost is small: the cargo cache below is keyed on `Cargo.lock`,
    # which a frontend-only change does not move, so this is a warm no-op
    # rebuild plus the bundling step, not a cold fat-LTO build.
    #
    # `apps != '[]'` is what makes an empty matrix a skipped job rather than a
    # job that silently succeeds having built nothing.
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # ⚠️ `apps`, and it CANNOT be narrowed to the apps whose contract changed.
      #
      # This job is the only producer of `mpk-<app>` and `wasm-<app>`, and
      # `browser` and `journey` consume them over `apps` (a frontend or lockfile
      # change can break the UI).
      #
      # Narrowing it to contract changes looks right — a pnpm resolution cannot
      # change a byte of wasm — and it is what this comment used to say. It
      # fails in the consumer instead, and not as a build error:
      #
      #     Unable to download artifact(s): Artifact not found for name:
      #     mpk-kv-store-<sha>
      #
      # which reads like a flaky runner rather than a matrix that skipped the
      # producer. Measured on migrate/merraria.
      # Sentinel fallback: an empty array leaves `${{ matrix.app }}` unexpanded,
      # so GitHub prints the raw template as a skipped check. Falling back to
      # `["none"]` keeps the name resolvable; this job's `if` gates on the same
      # `!= '[]'`, so the leg is skipped and simply reads "… (none)".
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps != '[]' && needs.changes.outputs.apps || '["none"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Separate from the native key — see the `rust` job.
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - uses: ./.github/actions/install-cargo-mero

      # cargo-mero blanks RUSTFLAGS when unset (so a .cargo/config.toml is
      # ignored) but honours an ambient one. An app that ships a
      # `logic/wasm-rustflags` file exports it here into $GITHUB_ENV, so EVERY
      # wasm build in this job — the build below, the dry-run bundle, and any
      # fixture bundle — picks it up. Additive: an app with no file sets nothing.
      #
      # mero-sheets needs `-Ctarget-feature=-nontrapping-fptoint`: its recalc
      # engine casts f64->i64, lowering to the `i64.trunc_sat_f64_s` opcode that
      # cargo-mero's bundled wasm-opt rejects. The flag lowers the SAME
      # saturating cast without that opcode. Safe job-wide — this job only ever
      # builds wasm, never a native target.
      - name: Load per-app wasm RUSTFLAGS
        run: |
          f="apps/${{ matrix.app }}/logic/wasm-rustflags"
          [ -f "$f" ] && echo "RUSTFLAGS=$(tr -d '\n' < "$f")" >> "$GITHUB_ENV" || true

      - name: Build
        run: cargo mero build -p ${{ matrix.app }}

      # Before the bundle: cargo-mero packs `frontend-dir` as it finds it.
      - uses: ./.github/actions/build-frontend
        id: frontend
        with:
          app: ${{ matrix.app }}

      # Prove the app is PUBLISHABLE, not merely compilable.
      #
      # This exists because of a gap it would have caught: kv-store had no `icon`
      # in [package.metadata.calimero], and `cargo mero bundle` refuses to run
      # without an icon decision — `no icon configured for <package>`. Nothing on
      # a pull request bundles, and the release workflow only runs on a push to
      # main, so that was a 12/12-green PR whose first act after merging would
      # have been a failed publish.
      #
      # `--dev` signs with the well-known development key, which the registry
      # REFUSES — so this can never publish anything by accident. It still
      # exercises everything that is easy to get wrong offline: the icon
      # decision, the package id's path-safety, the services list against the
      # built wasm, and the manifest the registry will render.
      #
      # --app-version is fixed rather than resolved from the registry: this
      # output is thrown away, and asking the registry for a number on every PR
      # would make CI depend on it being reachable.
      - name: Dry-run the bundle (dev key — never publishable)
        run: |
          cargo mero bundle \
            --manifest-path apps/${{ matrix.app }}/logic/Cargo.toml \
            --dev \
            --app-version 0.0.0 \
            --output "dist/dry-run-${{ matrix.app }}.mpk"

      - name: Check the bundle's frontend
        if: steps.frontend.outputs.dir != ''
        run: cargo mero bundle --check-frontend "dist/dry-run-${{ matrix.app }}.mpk"

      # After the bundle, not the build: only the bundle rebuilds every service the
      # manifest lists, so only then is each logic/crates/<name>/res/ ABI current.
      - name: Assert the committed ABIs match the built contracts
        env:
          ABI: ":(glob)apps/*/logic/**/res/abi.json"
          SCHEMA: ":(glob)apps/*/logic/**/res/state-schema.json"
        run: |
          # `git add --intent-to-add` first: plain `git diff` ignores UNTRACKED
          # files, so a new app with no committed ABI at all would sail through
          # the gate that exists to notice exactly that.
          git add --intent-to-add -- "$ABI" "$SCHEMA" 2>/dev/null || true
          if ! git diff --quiet -- "$ABI" "$SCHEMA"; then
            echo "::error::a committed ABI is stale. Run '${RUSTFLAGS:+RUSTFLAGS=\"$RUSTFLAGS\" }cargo mero bundle --manifest-path apps/${{ matrix.app }}/logic/Cargo.toml --dev --app-version 0.0.0 --output /tmp/dry-run.mpk' and 'pnpm -F ${{ matrix.app }} codegen', then commit."
            git --no-pager diff --stat -- "$ABI" "$SCHEMA"
            git --no-pager diff -- "$ABI" "$SCHEMA" | head -200
            exit 1
          fi
          echo "committed ABIs match the built contracts"

      # An app may ship a hand-rolled bundle FIXTURE its tests install — e.g.
      # the Mero CRM bundle mero-forms' journey sends a response to. It has to
      # be built HERE: this is the only job with a Rust toolchain, and the jobs
      # that use it download the `wasm-<app>` artifact rather than rebuilding.
      - name: Build any bundle fixtures this app ships
        run: |
          script="apps/${{ matrix.app }}/logic/build-multi-service-bundle.sh"
          if [ -x "$script" ]; then
            echo "running $script"
            (cd "apps/${{ matrix.app }}/logic" && ./build-multi-service-bundle.sh)
          else
            echo "no bundle fixture for ${{ matrix.app }} — nothing to build"
          fi

      # A SEPARATE artifact on purpose. The upload below uses glob paths whose
      # least-common-ancestor is `apps/`, which is what makes `path: apps`
      # correct on the download side — adding a repo-root path like `dist/`
      # here would move that ancestor to `.` and silently break the layout the
      # `browser` and `journey` downloads (`path: apps`) depend on.
      - name: Upload the dev bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpk-${{ matrix.app }}-${{ github.sha }}
          path: dist/dry-run-${{ matrix.app }}.mpk
          retention-days: 3
          if-no-files-found: ignore

      # `always()` so a failing ABI gate still hands over the regenerated file —
      # which is exactly what the error asks you to commit. Withholding it makes
      # the error true and useless at the same time.
      - name: Upload wasm + ABI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.app }}-${{ github.sha }}
          path: |
            apps/*/logic/res/*.wasm
            apps/*/logic/res/abi.json
            apps/*/logic/res/state-schema.json
            apps/*/logic/res/*.mpk
            apps/*/logic/crates/*/res/abi.json
            apps/*/logic/crates/*/res/state-schema.json
          retention-days: 3

  frontend:
    name: Frontend (typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.frontend_dirs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only the workspace members this change reaches (`["*"]` = all). It was
      # `pnpm -r` over every app on every PR — a mero-chat fix typechecked,
      # tested and built all 17 frontends.
      - name: Scope the workspace to this change
        env:
          DIRS: ${{ needs.changes.outputs.frontend_dirs }}
        run: |
          set -euo pipefail
          if [ "$(jq -r '.[0]' <<<"$DIRS")" = "*" ]; then
            filter=""
            apps=""
            # Every app's vitest at once (pnpm runs 4, each using every core)
            # starves the runner, and the suites' waits time out at random:
            # one suite at a time when the whole workspace is in scope.
            echo "PNPM_TEST_CONCURRENCY=--workspace-concurrency=1" >> "$GITHUB_ENV"
          else
            filter=$(jq -r '.[] | "--filter ./" + .' <<<"$DIRS" | tr '\n' ' ')
            apps=$(jq -r '.[] | select(startswith("apps/"))' <<<"$DIRS" | tr '\n' ' ')
          fi
          echo "PNPM_FILTER=$filter" >> "$GITHUB_ENV"
          echo "VERCEL_APPS=$apps" >> "$GITHUB_ENV"
          # The app checks below run over every app when VERCEL_APPS is empty,
          # so skip them when the change built no app (only a package).
          if [ -z "$filter" ] || [ -n "$apps" ]; then
            echo "CHECK_APPS=true" >> "$GITHUB_ENV"
          fi
          echo "scope: ${filter:-every workspace member}"

      # `tsc -b`, never `tsc --noEmit`: the app tsconfig is a solution file, and
      # --noEmit on a solution file checks nothing and exits 0.
      - run: pnpm -r $PNPM_FILTER typecheck

      # A component app's `codegen` is core's `mero-app-build codegen` (its typed
      # client from the committed ABI), at the tag scripts/install-mero-app-build.sh
      # pins. Cached by that script's hash, so a run that does not move the tag
      # does not compile it.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mero-app-build
          key: mero-app-build-${{ runner.os }}-${{ hashFiles('scripts/install-mero-app-build.sh') }}
      - name: Install mero-app-build
        env:
          MERO_APP_BUILD_ROOT: ${{ runner.temp }}/mero-app-build
        run: |
          scripts/install-mero-app-build.sh
          echo "$MERO_APP_BUILD_ROOT/bin" >> "$GITHUB_PATH"

      # Regenerating and diffing is what turns a contract/frontend mismatch into
      # a failed build rather than a runtime 500. It needs no node and no wasm —
      # it reads the committed ABI, which the `wasm` job (`rust` in
      # components.yml for a component app) proves is current.
      - name: Assert the generated clients are current
        run: |
          # `--if-present`: only an app that calls its contract through a
          # generated client has the script, and pnpm refuses a filtered run in
          # which no selected package has it.
          pnpm -r $PNPM_FILTER --if-present run codegen
          # Same reason as the ABI gate: untracked generated output is invisible
          # to `git diff`, so a new app could pass with no client committed.
          git add --intent-to-add -- 'apps/*/app/src/generated' 2>/dev/null || true
          if ! git diff --quiet -- 'apps/*/app/src/generated'; then
            echo "::error::a generated client is stale. Run 'scripts/install-mero-app-build.sh', then 'pnpm -r codegen', and commit."
            git --no-pager diff -- 'apps/*/app/src/generated'
            exit 1
          fi
          echo "generated clients match the committed ABIs"

      - run: pnpm -r $PNPM_TEST_CONCURRENCY $PNPM_FILTER test
      - run: pnpm -r $PNPM_FILTER build
      - run: pnpm -r $PNPM_FILTER --if-present run check:bundle
      - run: pnpm -r $PNPM_FILTER --if-present run format:check

      # `pnpm -r build` succeeding does not mean Vercel will serve anything: it
      # uploads whatever `outputDirectory` names, and an empty or wrong path is
      # not an error. mero-sign deployed that way — its `vercel.json` pointed at
      # `apps/mero-sign/build`, which no build ever wrote. This asserts every
      # app's declared output directory is the one its build produced, and that
      # each carries the SPA rewrite its client-side router needs.
      - name: Assert vercel.json matches the real build output
        if: env.CHECK_APPS == 'true'
        # shellcheck disable=SC2086 — word-splitting the list is the point
        run: scripts/check-vercel-output.sh $VERCEL_APPS

      # Every app's HTML is served `no-cache`, but a service worker answers
      # before that header is read. mero-chat's precached index.html, so the
      # first open after a deploy ran the previous build and an invite opened
      # from the desktop landed on a screen the release had removed. This fails
      # a build whose worker could serve a page older than the deploy.
      - name: Assert no service worker serves a stale page
        if: env.CHECK_APPS == 'true'
        # shellcheck disable=SC2086 — word-splitting the list is the point
        run: python3 scripts/check-service-workers.py $VERCEL_APPS

  browser:
    name: Browser E2E (${{ matrix.app }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }})
    # `needs: wasm`: run the bundle that job already built and the ABI gate already validated, rather than
    # paying for a second fat-LTO wasm build.
    needs: [changes, wasm]
    # Frontend OR contract: this drives the UI against a real node, so either
    # side can break it.
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Sentinel fallback: an empty array leaves `${{ matrix.app }}` unexpanded,
      # so GitHub prints the raw template as a skipped check. Falling back to
      # a "none" leg keeps the name resolvable; this job's `if` gates on the same
      # `!= '[]'`, so the leg is skipped and simply reads "… (none)".
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.browser_matrix != '[]' && needs.changes.outputs.browser_matrix || '[{"app":"none","shard":"1/1"}]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mpk-${{ matrix.app }}-${{ github.sha }}
          path: bundle

      - name: Verify the bundle arrived
        run: |
          set -euo pipefail
          mpk=$(find bundle -name '*.mpk' -print -quit)
          if [ -z "$mpk" ]; then
            echo "::error::no .mpk in the downloaded artifact — the browser e2e would install nothing"
            ls -la bundle || true
            exit 1
          fi
          echo "KV_MPK_PATH=$PWD/$mpk" >> "$GITHUB_ENV"
          echo "using $mpk ($(wc -c <"$mpk") bytes)"

      # Any bundle fixture the wasm job built for this app
      # (logic/build-multi-service-bundle.sh) lands in its logic/res/ — e.g.
      # the Mero CRM bundle mero-forms' journey sends a response to. `path:
      # apps` because the upload globs `apps/*/logic/res/*`, so the archive is
      # rooted at `apps/`.
      - uses: actions/download-artifact@v4
        with:
          name: wasm-${{ matrix.app }}-${{ github.sha }}
          path: apps

      - uses: ./.github/actions/setup-merod

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Capped because `playwright install --with-deps` has no timeout of its own.
      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          working-directory: apps/${{ matrix.app }}/app

      # An app opts into a specific CI suite with `test:e2e:ci`; otherwise the
      # default projects run. scaffolding-e2e needs this: its default config has
      # a globalSetup that drives a real hosted login, which on a runner ends at
      # `chrome-error://chromewebdata/`, while its mocked config injects auth in
      # the page and needs no node.
      - name: Run the browser e2e
        working-directory: apps/${{ matrix.app }}/app
        env:
          SHARD: ${{ matrix.shard }}
          # Keep `.playwright-data/` past teardown: the upload below names its
          # node logs, and teardown otherwise deletes them first, so a failed
          # run uploaded none.
          KEEP_DATA: "1"
        run: |
          shard_args=()
          [ "$SHARD" = "1/1" ] || shard_args=(--shard="$SHARD")
          if node -e "process.exit(require('./package.json').scripts?.['test:e2e:ci']?0:1)"; then
            echo "using this app's test:e2e:ci"
            pnpm run test:e2e:ci "${shard_args[@]}"
          else
            npx playwright test "${shard_args[@]}"
          fi

      - name: Upload the report and node log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ matrix.app }}-${{ strategy.job-index }}-${{ github.sha }}
          path: |
            apps/${{ matrix.app }}/app/playwright-report
            apps/${{ matrix.app }}/app/test-results
            apps/${{ matrix.app }}/app/.playwright-data/*.log
          retention-days: 7
          if-no-files-found: ignore

  journey:
    name: Journey (${{ matrix.app }} on ${{ matrix.leg }} ${{ matrix.merod }})
    needs: [changes, wasm]
    if: needs.changes.outputs.journey_matrix != '[]' && needs.changes.outputs.journey_matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.journey_matrix != '[]' && needs.changes.outputs.journey_matrix || '[{"app":"none","leg":"none","merod":""}]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mpk-${{ matrix.app }}-${{ github.sha }}
          path: bundle

      - name: Verify the bundle arrived
        run: |
          set -euo pipefail
          mpk=$(find "$PWD/bundle" -name '*.mpk' -print -quit)
          if [ -z "$mpk" ]; then
            echo "::error::no .mpk in the downloaded artifact"
            ls -la bundle || true
            exit 1
          fi
          echo "JOURNEY_MPK=$mpk" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-merod
        with:
          version: ${{ matrix.merod }}

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          working-directory: apps/${{ matrix.app }}/app

      - name: Run the journey
        working-directory: apps/${{ matrix.app }}/app
        env:
          JOURNEY_APP: ${{ matrix.app }}
          JOURNEY_MEROD_LABEL: ${{ matrix.leg }} ${{ matrix.merod }}
          JOURNEY_FROM_NODE: ${{ matrix.leg == 'node' && '1' || '' }}
          JOURNEY_DATA_DIR: ${{ runner.temp }}/journey
        run: npx playwright test -c playwright.journey.config.ts

      - name: Upload the report and node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-${{ matrix.app }}-${{ matrix.leg }}-${{ github.sha }}
          path: |
            apps/${{ matrix.app }}/app/playwright-report/journey
            apps/${{ matrix.app }}/app/test-results/journey
            ${{ runner.temp }}/journey/*.log
            ${{ runner.temp }}/journey/rig.json
          retention-days: 7
          if-no-files-found: ignore

  # The conformance rig: every admin and RPC call, on a node and on an account,
  # against the newest core release built with mock attestation. Its own
  # workflow because it also runs nightly and by hand with a core ref; here it
  # runs when the `conformance` filter matches. Not a required check.
  conformance:
    name: Conformance
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    uses: ./.github/workflows/conformance.yml
