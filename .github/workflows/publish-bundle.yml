# Build, sign and publish ONE app's bundle to the Calimero App Registry.
#
# Reusable on purpose. Before the monorepo this pipeline existed as seven
# near-identical copies of 313-416 lines, no two byte-identical, each hard-coding
# its own default branch in `on.push.branches` — so copying it into a repo whose
# default was the other name produced a workflow that was valid YAML, passed
# lint, and never ran.
#
# THE REGISTRY OWNS THE VERSION. The check job asks it for the highest published
# appVersion and increments the patch; an empty registry starts at 0.0.1. So a
# release never bumps a number by hand and can never collide.
#
# Stated plainly: there is NO idempotency. Re-running this, or a second push
# touching an app's logic/, mints ANOTHER version of the same content. That is
# the price of not hand-maintaining the number, and it is the right trade.
#
# Required secrets (organization level):
#   MERO_SIGN_KEY             full JSON of the production signing key
#                             ({private_key, public_key, signer_id}). The
#                             registry PINS the signer per package and the node
#                             derives ApplicationId from (package, signer), so a
#                             different key publishes a DIFFERENT app — silently,
#                             as a new install rather than an upgrade.
#   CALIMERO_REGISTRY_API_KEY registry API token, read by cargo-mero as
#                             CALIMERO_API_KEY.

name: Publish bundle

on:
  workflow_call:
    # Declared explicitly rather than relying on `secrets: inherit` at the call
    # site. `inherit` forwards EVERY secret the caller can see to a job that
    # signs and publishes with a production key; naming the two it needs means
    # nothing else is in scope if this workflow ever grows a step that runs
    # third-party code.
    secrets:
      MERO_SIGN_KEY:
        required: true
      CALIMERO_REGISTRY_API_KEY:
        required: true
    inputs:
      app:
        description: The app directory under apps/ (also the cargo package name)
        required: true
        type: string
      version:
        description: Explicit X.Y.Z to publish. Empty lets the registry decide.
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Per-app, NOT global. A global group would serialise every app in the repo
# behind one another. Never cancel: a half-finished signed publish is worse than
# a queued one.
concurrency:
  group: publish-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  check:
    name: Resolve the next version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      package: ${{ steps.pkg.outputs.package }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Read from cargo, not by grepping the manifest: the package id lives in
      # [package.metadata.calimero] and a rename there must not leave this
      # workflow verifying one id and publishing another.
      - name: Read the package id
        id: pkg
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          package=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg app "$APP" '.packages[] | select(.name == $app) | .metadata.calimero.package // empty')
          case "$package" in
            "" ) echo "::error::no [package.metadata.calimero].package for '$APP'"; exit 1 ;;
            *[!a-zA-Z0-9.-]* ) echo "::error::unexpected characters in package id '$package'"; exit 1 ;;
          esac
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "Package: $package"

      - name: Resolve the next version from the registry
        id: ver
        env:
          # Through the environment, never inlined: a template expression is
          # substituted before the shell sees it, so a crafted input would run
          # as code.
          INPUT_VERSION: ${{ inputs.version }}
          PACKAGE: ${{ steps.pkg.outputs.package }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version override must be exactly X.Y.Z (got '$INPUT_VERSION')"
              exit 1
            fi
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "::notice::publishing $PACKAGE $INPUT_VERSION (explicit override)"
            exit 0
          fi

          # An unreachable registry must NOT read as "nothing published" — that
          # resets the lineage to the floor and signs BELOW what is already out
          # there. Only a well-formed answer may decide.
          if ! response=$(curl -fsS --retry 3 --retry-delay 2 --max-time 30 \
              "https://apps.calimero.network/api/v2/bundles?package=$PACKAGE"); then
            echo "::error::could not reach the registry to resolve the next version"
            exit 1
          fi
          if ! jq -e 'type == "array"' >/dev/null <<<"$response"; then
            echo "::error::registry response is not a bundle list: $response"
            exit 1
          fi

          count=$(jq -r 'length' <<<"$response")
          if [ "$count" = "0" ]; then
            version="0.0.1"
            echo "::notice::nothing published for $PACKAGE yet — starting at $version"
          else
            # A listing with entries but no parseable version is an unrecognized
            # scheme: fail rather than default, which would sign below what is
            # published.
            version=$(jq -r '
              [ .[].appVersion // empty
                | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
                | split(".") | map(tonumber) ]
              | sort
              | if length == 0 then "" else (last | "\(.[0]).\(.[1]).\(.[2]+1)") end
            ' <<<"$response")
            if [ -z "$version" ]; then
              echo "::error::registry listed $count bundle(s) for $PACKAGE but none had a readable X.Y.Z appVersion"
              exit 1
            fi
            echo "::notice::highest published is $(jq -r '[.[].appVersion // empty]|join(", ")' <<<"$response") — releasing $version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Confirm that version is actually free
        id: decide
        env:
          PACKAGE: ${{ steps.pkg.outputs.package }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Belt and braces. A 200 here means the resolution logic disagrees
          # with the registry (or a concurrent release landed) — stop, rather
          # than fail deep in the publish step after signing.
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 30 \
            "https://apps.calimero.network/api/v2/bundles/$PACKAGE/$VERSION" || echo "000")
          case "$code" in
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            200) echo "::error::$PACKAGE $VERSION is already published — version resolution disagrees with the registry"; exit 1 ;;
            *)   echo "::error::registry returned $code for $PACKAGE $VERSION — refusing to publish blind"; exit 1 ;;
          esac

  deploy:
    name: Build, sign & publish
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check required secrets
        env:
          MERO_SIGN_KEY: ${{ secrets.MERO_SIGN_KEY }}
          CALIMERO_REGISTRY_API_KEY: ${{ secrets.CALIMERO_REGISTRY_API_KEY }}
        run: |
          missing=0
          [ -n "$MERO_SIGN_KEY" ] || { echo "::error::MERO_SIGN_KEY is not set"; missing=1; }
          [ -n "$CALIMERO_REGISTRY_API_KEY" ] || { echo "::error::CALIMERO_REGISTRY_API_KEY is not set"; missing=1; }
          exit $missing

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: ./.github/actions/install-cargo-mero

      - name: Write signing key
        env:
          MERO_SIGN_KEY: ${{ secrets.MERO_SIGN_KEY }}
        run: |
          umask 077
          printf '%s' "$MERO_SIGN_KEY" > "$RUNNER_TEMP/mero-sign-key.json"

      - name: Verify the signer matches the published package
        env:
          # The well-known public DEV key's signerId. A dev-signed lineage
          # cannot be continued (the registry refuses dev signatures), so a
          # package still pinned to it is treated as a first real publish.
          DEV_SIGNER: did:key:z6MknF3p5L5FDHJQ7FREUapuX4Wmp4MtF6WrHYaXS2B3eZQd
          PACKAGE: ${{ needs.check.outputs.package }}
        run: |
          local_signer=$(cargo mero key derive-signer-id --key "$RUNNER_TEMP/mero-sign-key.json")

          if ! response=$(curl -fsS --retry 3 --retry-delay 2 --max-time 30 \
              "https://apps.calimero.network/api/v2/bundles?package=$PACKAGE"); then
            echo "::error::could not reach the registry to verify the signer — refusing to publish blind"
            exit 1
          fi
          # Every DISTINCT signerId in the listing, not `.[0]`.
          #
          # The version resolution above deliberately scans the whole list rather
          # than trusting its order; this gate was trusting it. If the registry
          # ever returns bundles in another order, `.[0]` is an arbitrary
          # element — and this is the check standing between a wrong key and
          # publishing a DIFFERENT application under the same package id.
          #
          # More than one distinct signer for a package should be impossible
          # (the registry pins it), so treat it as a reason to stop rather than
          # something to pick from.
          if ! signers=$(printf '%s' "$response" | jq -er '[.[].signerId // empty] | unique | join(" ")'); then
            echo "::error::registry returned a response this step cannot parse: $response"
            exit 1
          fi
          count=$(wc -w <<<"$signers" | tr -d ' ')
          if [ "$count" -gt 1 ]; then
            echo "::error::registry lists MULTIPLE signers for $PACKAGE ($signers) — refusing to guess which lineage this release continues"
            exit 1
          fi
          published_signer="$signers"

          if [ -z "$published_signer" ]; then
            echo "::notice::nothing published for $PACKAGE — skipping signer check (first publish)"
          elif [ "$published_signer" = "$DEV_SIGNER" ]; then
            echo "::notice::published lineage is dev-key-signed and cannot be continued; publishing under this key mints a NEW application id (existing installs see a new app, not an upgrade)"
          elif [ "$local_signer" != "$published_signer" ]; then
            echo "::error::key's signerId ($local_signer) does not match the published signerId ($published_signer). The registry pins the signer per package and the node derives ApplicationId from (package, signer), so this would land as a new application id instead of an upgrade."
            exit 1
          else
            echo "signer matches published package ($local_signer)"
          fi

      # The SDK deps are pinned to a release tag, so the revision is already
      # determined — this records WHICH commit that tag resolved to, so a signed
      # release is never traceable only to a moving name.
      - name: Record the core revision
        id: core
        run: |
          set -euo pipefail
          rev=$(awk -F'#' '/^source = "git\+https:\/\/github.com\/calimero-network\/core/{print $2; exit}' Cargo.lock | tr -d '"')
          if [ -z "$rev" ]; then
            echo "::error::could not determine which core revision the SDK deps resolved to"
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "::notice::signing a bundle built against core $rev"

      # `--app-version`, not `--bump`: the check job already resolved the number
      # against the registry, and cargo-mero's own --bump floors an empty
      # registry at 0.1.0 rather than the 0.0.1 this fleet restarts from. (They
      # are mutually exclusive anyway.)
      #
      # `--manifest-path`, not `-p`: `cargo mero bundle` has no `-p` flag, only
      # `cargo mero build` does.
      #
      # `--output` pins the filename so the publish step never reconstructs a
      # versioned one and can never pick up a stale .mpk from an earlier build.
      - name: Build & sign bundle
        env:
          APP: ${{ inputs.app }}
          PACKAGE: ${{ needs.check.outputs.package }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Per-app wasm RUSTFLAGS (see ci.yml Build). p2p-sheets needs
          # -Ctarget-feature=-nontrapping-fptoint or wasm-opt rejects its
          # recalc engine's trunc_sat. Additive: no file, no flag.
          f="apps/$APP/logic/wasm-rustflags"
          [ -f "$f" ] && export RUSTFLAGS="$(tr -d '\n' < "$f")"
          cargo mero bundle \
            --manifest-path "apps/$APP/logic/Cargo.toml" \
            --key "$RUNNER_TEMP/mero-sign-key.json" \
            --app-version "$VERSION" \
            --output "dist/$PACKAGE.mpk"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mero-sign-key.json"

      - name: Publish to the App Registry
        env:
          CALIMERO_API_KEY: ${{ secrets.CALIMERO_REGISTRY_API_KEY }}
          CALIMERO_REGISTRY_URL: https://apps.calimero.network
          PACKAGE: ${{ needs.check.outputs.package }}
        run: cargo mero publish "dist/$PACKAGE.mpk"

      - name: Summary
        env:
          APP: ${{ inputs.app }}
          PACKAGE: ${{ needs.check.outputs.package }}
          VERSION: ${{ needs.check.outputs.version }}
          CORE_REV: ${{ steps.core.outputs.rev }}
        run: |
          {
            echo "### $APP published :rocket:"
            echo ""
            echo "- **Package:** \`$PACKAGE\`"
            echo "- **Version:** \`$VERSION\`"
            echo "- **Core revision:** \`$CORE_REV\`"
            # The app's own page, not the registry root: the point of a release
            # summary is to be one click from what was released.
            echo "- **App:** https://apps.calimero.network/apps/$PACKAGE"
            echo "- **Bundle:** https://apps.calimero.network/api/v2/bundles/$PACKAGE/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Published::$PACKAGE $VERSION — https://apps.calimero.network/apps/$PACKAGE"
