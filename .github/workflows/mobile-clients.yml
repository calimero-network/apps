# The native apps' generated contract clients (Swift for iOS, Kotlin for
# Android) are current with each app's committed ABI. scripts/mobile-codegen.sh
# regenerates them with core's `mero-app-build codegen` at the revision it pins
# and fails on any difference. The ABI itself is proven current by ci.yml's
# `wasm` job (components.yml's `rust` for a component app).
name: Mobile clients

on:
  pull_request:
    paths:
      - apps/*/logic/res/abi.json
      - apps/*/mobile/**
      - scripts/mobile-codegen.sh
      - scripts/install-mero-app-build.sh
      - .github/workflows/mobile-clients.yml
  push:
    branches: [main]
    paths:
      - apps/*/logic/res/abi.json
      - apps/*/mobile/**
      - scripts/mobile-codegen.sh
      - scripts/install-mero-app-build.sh
      - .github/workflows/mobile-clients.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-clients-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fresh:
    name: Generated clients are current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Keyed by the generator tag the script pins: a run that does not move
      # it does not compile it.
      - name: Generator revision
        id: rev
        run: echo "rev=$(sed -n 's/^REF=//p' scripts/mobile-codegen.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mero-app-build
          key: mobile-mero-app-build-${{ runner.os }}-${{ steps.rev.outputs.rev }}

      - name: Regenerate and compare
        env:
          MERO_APP_BUILD_ROOT: ${{ runner.temp }}/mero-app-build
        run: scripts/mobile-codegen.sh --install --check
