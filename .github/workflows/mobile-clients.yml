# The native apps' generated contract clients (Swift for iOS, Kotlin for
# Android) are current with each app's committed ABI. scripts/mobile-codegen.sh
# regenerates them with core's `meroctl app codegen` at the release
# scripts/install-meroctl.sh pins, and fails on any difference. The ABI itself
# is proven current by ci.yml's `wasm` job (components.yml's `rust` for a
# component app).
name: Mobile clients

on:
  pull_request:
    paths:
      - apps/*/logic/res/abi.json
      - apps/*/mobile/**
      - scripts/mobile-codegen.sh
      - scripts/install-meroctl.sh
      - .github/workflows/mobile-clients.yml
  push:
    branches: [main]
    paths:
      - apps/*/logic/res/abi.json
      - apps/*/mobile/**
      - scripts/mobile-codegen.sh
      - scripts/install-meroctl.sh
      - .github/workflows/mobile-clients.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-clients-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fresh:
    name: Generated clients are current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Keyed by the installer, which holds the pin: a run that does not move
      # it does not download it.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/meroctl
          key: mobile-meroctl-${{ runner.os }}-${{ hashFiles('scripts/install-meroctl.sh') }}

      - name: Regenerate and compare
        env:
          MEROCTL_ROOT: ${{ runner.temp }}/meroctl
        run: scripts/mobile-codegen.sh --install --check
