name: Build an app's frontend for its bundle
description: >
  When the app's logic/Cargo.toml sets `frontend-dir`, build the frontend so
  `cargo mero bundle` packs it. Does nothing for an app without the key.

inputs:
  app:
    description: The app directory under apps/ (also the pnpm package name).
    required: true
  min-release:
    description: >
      VITE_CALIMERO_MIN_RELEASE for the build: the lowest mero-tee release a
      cloud node may run. A production build connects to no node without it,
      not even to the cluster that serves it.
    required: false
    default: ""
  cluster:
    description: >
      VITE_CALIMERO_CLUSTER for the build. Usually empty: a frontend packed into
      a bundle connects to the cluster that serves it, whatever its name.
    required: false
    default: ""
  require-min-release:
    description: >
      "true" fails the build when the app ships a frontend and `min-release` is
      empty (a publish: the bundle's frontend would never connect).
    required: false
    default: "false"

outputs:
  dir:
    description: The frontend directory from the repo root, empty when the app ships none.
    value: ${{ steps.dir.outputs.dir }}

runs:
  using: composite
  steps:
    - name: Resolve the frontend directory
      id: dir
      shell: bash
      env:
        APP: ${{ inputs.app }}
      run: echo "dir=$(python3 scripts/frontend-dir.py "$APP")" >> "$GITHUB_OUTPUT"

    - name: Check the frontend's attestation floor
      if: steps.dir.outputs.dir != '' && inputs.require-min-release == 'true' && inputs.min-release == ''
      shell: bash
      env:
        APP: ${{ inputs.app }}
      run: |
        echo "::error title=CALIMERO_MIN_RELEASE is not set::$APP ships a frontend in its bundle, and a production build connects to no node without VITE_CALIMERO_MIN_RELEASE (the lowest mero-tee release a cloud node may run). Set the repository variable CALIMERO_MIN_RELEASE (Settings > Secrets and variables > Actions > Variables), e.g. to the shared cluster's current mero-tee release, and publish again."
        exit 1

    - name: Enable corepack (pnpm)
      if: steps.dir.outputs.dir != ''
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@v4
      if: steps.dir.outputs.dir != ''
      with:
        node-version: "22"
        cache: pnpm

    - name: Build the frontend
      if: steps.dir.outputs.dir != ''
      shell: bash
      env:
        APP: ${{ inputs.app }}
        VITE_CALIMERO_MIN_RELEASE: ${{ inputs.min-release }}
        VITE_CALIMERO_CLUSTER: ${{ inputs.cluster }}
      run: |
        pnpm install --frozen-lockfile
        pnpm -F "$APP" build
