name: Build an app's frontend for its bundle
description: >
  When the app's logic/Cargo.toml sets `frontend-dir`, build the frontend so
  `cargo mero bundle` packs it. Does nothing for an app without the key.

inputs:
  app:
    description: The app directory under apps/ (also the pnpm package name).
    required: true
  min-release:
    description: >
      VITE_CALIMERO_MIN_RELEASE for the build: the lowest mero-tee release a
      cloud node may run. A production build connects to no node without it,
      not even to the cluster that serves it. Overrides the derived floor.
    required: false
    default: ""
  cluster:
    description: >
      VITE_CALIMERO_CLUSTER for the build. Usually empty: a frontend packed into
      a bundle connects to the cluster that serves it, whatever its name.
    required: false
    default: ""
  require-min-release:
    description: >
      "true" (a publish): when the app ships a frontend and `min-release` is
      empty, derive the floor from what `floor-cluster`'s nodes run now
      (scripts/cluster-min-release.py), and fail when that yields nothing: the
      bundle's frontend would never connect.
    required: false
    default: "false"
  floor-cluster:
    description: The cluster whose nodes' lowest mero-tee release is the derived floor.
    required: false
    default: eu-shared-1

outputs:
  dir:
    description: The frontend directory from the repo root, empty when the app ships none.
    value: ${{ steps.dir.outputs.dir }}

runs:
  using: composite
  steps:
    - name: Resolve the frontend directory
      id: dir
      shell: bash
      env:
        APP: ${{ inputs.app }}
      run: echo "dir=$(python3 scripts/frontend-dir.py "$APP")" >> "$GITHUB_OUTPUT"

    # The floor the frontend is built with. A set `min-release` wins; on a
    # publish without one, the lowest release the cluster's answering nodes run
    # right now (so a half-rolled-out cluster passes). Never mero-tee's newest
    # GitHub release: it is published before nodes roll to it.
    - name: Resolve the frontend's attestation floor
      id: floor
      if: steps.dir.outputs.dir != ''
      shell: bash
      env:
        APP: ${{ inputs.app }}
        GIVEN: ${{ inputs.min-release }}
        REQUIRE: ${{ inputs.require-min-release }}
        CLUSTER: ${{ inputs.floor-cluster }}
      run: |
        floor="$GIVEN"
        source="the repository variable CALIMERO_MIN_RELEASE"
        if [ -z "$floor" ] && [ "$REQUIRE" = "true" ]; then
          source="the lowest mero-tee release ${CLUSTER}'s nodes run now"
          floor=$(python3 scripts/cluster-min-release.py --cluster "$CLUSTER") || floor=""
          if [ -z "$floor" ]; then
            echo "::error title=No attestation floor::$APP ships a frontend in its bundle, and a production build connects to no node without VITE_CALIMERO_MIN_RELEASE. It could not be derived from ${CLUSTER}'s nodes (see the log above). Set the repository variable CALIMERO_MIN_RELEASE (Settings > Secrets and variables > Actions > Variables), or CALIMERO_CLUSTER to a cluster that answers, and publish again."
            exit 1
          fi
        fi
        echo "min-release=$floor" >> "$GITHUB_OUTPUT"
        if [ -n "$floor" ]; then
          echo "::notice::$APP's frontend is built with VITE_CALIMERO_MIN_RELEASE=$floor, from $source"
          echo "**$APP frontend**: \`VITE_CALIMERO_MIN_RELEASE=$floor\` (from $source)" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Enable corepack (pnpm)
      if: steps.dir.outputs.dir != ''
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@v4
      if: steps.dir.outputs.dir != ''
      with:
        node-version: "22"
        cache: pnpm

    - name: Build the frontend
      if: steps.dir.outputs.dir != ''
      shell: bash
      env:
        APP: ${{ inputs.app }}
        VITE_CALIMERO_MIN_RELEASE: ${{ steps.floor.outputs.min-release }}
        VITE_CALIMERO_CLUSTER: ${{ inputs.cluster }}
      run: |
        pnpm install --frozen-lockfile
        pnpm -F "$APP" build
