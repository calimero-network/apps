name: Set up Playwright
description: >
  Install the Chromium that an app's Playwright version expects, plus its OS
  dependencies, from cache when possible. Needs `pnpm install` first.

inputs:
  working-directory:
    description: The app directory whose Playwright version to install for.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve the Playwright version
      id: pw
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    # Keyed on the resolved version so a Playwright bump invalidates it.
    - uses: actions/cache@v4
      id: pw-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

    # ⚠️ Both Playwright install steps below shell out to `apt-get update`,
    # and apt exits 100 when ANY configured index fails — including the
    # third-party repos the runner image ships and Playwright never reads a
    # package from. Playwright turns that into
    # `Failed to install browser dependencies`, which reads as a broken app.
    #
    # On 2026-09-09 Google's Chrome repo served a `Release` file newer than
    # its `Packages.gz` (Release created 17:16Z, Packages last modified
    # 09:41Z). apt called it `Hash Sum mismatch` and ALL SIXTEEN Browser E2E
    # legs went red on main with no test having run — on the very commit
    # whose PR run had been green ninety minutes earlier. The bounded retry
    # below cannot clear that: a stale CDN index is not a transient stall, so
    # all three attempts hit the same mismatch.
    #
    # Playwright's deps come from Ubuntu main/universe only, so the fix is to
    # take the other lists out of apt's view for this job. Parked by rename
    # rather than deleted (apt reads only `*.list`/`*.sources`), and selected
    # by CONTENT so a future runner image reshuffling the filenames cannot
    # accidentally park the Ubuntu archive itself.
    - name: Keep apt to the Ubuntu archive
      shell: bash
      run: |
        set -euo pipefail
        for f in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
          [ -e "$f" ] || continue
          # `ubuntu.com` matches the archive/security/ports hosts;
          # `apt-mirrors.txt` matches the `mirror+file:` list the hosted
          # images use. Deliberately NOT a bare `ubuntu`, which would also
          # match `packages.microsoft.com/ubuntu/24.04/prod`.
          if grep -qE 'ubuntu\.com|apt-mirrors\.txt' "$f"; then
            echo "keeping   $(basename "$f")"
            continue
          fi
          echo "parking   $(basename "$f")"
          sudo mv "$f" "$f.ci-disabled"
        done
        # Defense in depth for the OTHER half of this failure class: a reset
        # or timeout mid-fetch. apt does not retry by default, and the retry
        # loops below can only re-run the whole install.
        printf 'Acquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-retries >/dev/null
    # ⚠️ `playwright install --with-deps` has no timeout of its own and has
    # been observed running to the 6-hour job default elsewhere in the fleet.
    # Capped, and the OS deps are installed separately on a cache hit so the
    # ~170 MB browser download is skipped.
    - name: Install Chromium
      if: steps.pw-cache.outputs.cache-hit != 'true'
      working-directory: ${{ inputs.working-directory }}
      # Same apt hang as the cache-hit step below; same bounded retry.
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if timeout 300 npx playwright install --with-deps chromium; then exit 0; fi
          echo "::warning::playwright install attempt $attempt hung or failed; retrying"
          # ⚠️ `timeout` kills the npx wrapper, NOT the apt-get it started
          # under sudo — and that orphan keeps /var/lib/dpkg/lock-frontend.
          # So a timed-out attempt POISONS every retry after it:
          #
          #     E: Could not get lock /var/lib/dpkg/lock-frontend.
          #        It is held by process 2746 (apt-get)
          #
          # which is exactly how `Browser E2E (mero-sheets)` died on
          # 2026-09-11 — attempt 1 hung for the full 4 minutes fetching
          # fonts, then attempts 2 and 3 failed in under a second each. The
          # loop looked like three chances and was really one.
          #
          # So clear the ground before retrying: kill the orphan, wait for
          # the lock to actually drop (SIGTERM is not instant), and finish
          # any half-configured packages it left behind.
          sudo pkill -x apt-get 2>/dev/null || true
          sudo pkill -x dpkg 2>/dev/null || true
          for _ in $(seq 1 60); do
            sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
            sleep 2
          done
          sudo dpkg --configure -a >/dev/null 2>&1 || true
          sleep 15
        done
        echo "::error::playwright install failed three times — an apt stall or a broken index, not the app"
        echo "apt sources still in play:"; cat /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
        exit 1

    # ⚠️ Retried, and each ATTEMPT is bounded rather than just the step.
    #
    # `playwright install-deps` shells out to apt, which intermittently hangs
    # rather than failing. A bare `timeout-minutes` does not help: the step
    # timeout FAILS THE JOB, so a transient apt stall reads as a broken app.
    # It killed three jobs in one afternoon — Browser E2E (mero-sign) on main
    # and (mero-pixart) on a PR, both with no test output at all, the log
    # ending in `Terminate orphan process: (npm exec playwright install-deps
    # chromium)`. A rerun passed every time.
    #
    # `timeout` bounds each attempt so a hang becomes a retry instead of a
    # dead job; the step budget covers three of them.
    - name: Install Chromium OS deps (cache hit)
      if: steps.pw-cache.outputs.cache-hit == 'true'
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if timeout 240 npx playwright install-deps chromium; then exit 0; fi
          echo "::warning::playwright install-deps attempt $attempt hung or failed; retrying"
          # ⚠️ `timeout` kills the npx wrapper, NOT the apt-get it started
          # under sudo — and that orphan keeps /var/lib/dpkg/lock-frontend.
          # So a timed-out attempt POISONS every retry after it:
          #
          #     E: Could not get lock /var/lib/dpkg/lock-frontend.
          #        It is held by process 2746 (apt-get)
          #
          # which is exactly how `Browser E2E (mero-sheets)` died on
          # 2026-09-11 — attempt 1 hung for the full 4 minutes fetching
          # fonts, then attempts 2 and 3 failed in under a second each. The
          # loop looked like three chances and was really one.
          #
          # So clear the ground before retrying: kill the orphan, wait for
          # the lock to actually drop (SIGTERM is not instant), and finish
          # any half-configured packages it left behind.
          sudo pkill -x apt-get 2>/dev/null || true
          sudo pkill -x dpkg 2>/dev/null || true
          for _ in $(seq 1 60); do
            sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
            sleep 2
          done
          sudo dpkg --configure -a >/dev/null 2>&1 || true
          sleep 15
        done
        echo "::error::playwright install-deps failed three times — an apt stall or a broken index, not the app"
        echo "apt sources still in play:"; cat /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
        exit 1
