# The pnpm workspace for every app's frontend.
#
# `catalog:` is the npm answer to Cargo's `[workspace.dependencies]` (pnpm
# >= 9.5). An app writes `"react": "catalog:"` and the version lives here, once.
#
# Before the monorepo the nine app repos held three TypeScript versions, three
# Vites, four vitests, three Playwrights and four Reacts between them, and a
# mero-js release opened N pull requests that all conflicted with each other on
# the lockfile. One line here replaces that.

packages:
  - "apps/*/app"
  # The first shared frontend package landed with the post-join sync gate
  # (@calimero-apps/join-sync), so this is live now rather than housekeeping.
  - "packages/*"

catalog:
  # ── Calimero ───────────────────────────────────────────────────────────────
  # Both of these carry the rc.41 403 fixes and are the reason the pin moved:
  #   mero-js 19.14.1 (#166)  — a revoked token family answers /sse and
  #     /sse/subscription with 403, not 401. The terminal check only ever looked
  #     at 401, so a dead credential surfaced as a bare HTTPError and reconnected
  #     on a timer forever. It is now an AuthRevokedError and the loop stops.
  #   mero-react 9.1.2 (#73)  — neither non-admin AppMode asked for
  #     `context:subscribe`, which core requires for /sse, /sse/subscription and
  #     /ws. Every app token was refused 403 permission_denied on all three.
  #   mero-react 9.1.3 (#74)  — and MeroProvider's own stream handler then threw
  #     both of those 403s away: it opened `if (!err.message.includes('401'))`,
  #     and core answers a dead or under-scoped token with 403, never 401. The
  #     app went offline with no refresh, no logout and no prompt — and 19.14.1
  #     correctly stopping its reconnect loop turned that into a SILENT dead end.
  # ⚠️ The grant set is baked into a client key when it is MINTED, so an app
  # already holding a token has to log in again to pick #73 up. 9.1.3 is what
  # makes that happen by itself instead of stranding the session offline.
  # mero-js 21.3.0 (#207) carries the invitation redeem that
  # @calimero-apps/invite used to keep its own copy of, and `classifyError`.
  # The two majors in between removed `getCertificate` and changed TEE image
  # trust; no app on the catalog used either.
  # mero-js 23.0.0 (mero-js#219) is the pin now, and the reason is the schema:
  # core 0.11.0-rc.70 derives a subgroup's id from its create and root-guards
  # owner-level ops, and 23 is the first release that builds both at
  # SIGNED_NAMESPACE_OP_SCHEMA_VERSION 20. 21.x signs at 11 and 22.x signs at 20
  # without the salt or the root proof, so rc.70 refuses their ops. The 22.0.0
  # break (#202) dropped the chosen `groupId` from CreateGroupRequest; no app
  # sent one. 22.4.0 (#214) added RelayClient.describeCreation/createContext,
  # which lets delegated-execution drop its own ^22.1.0 pin for `catalog:`.
  # 23.4.2 (mero-js#239) is the first release that signs namespace ops at schema
  # 21, which core 0.11.0-rc.75 requires: on 23.4.0/23.4.1 every account join,
  # create and governance op against an rc.75 relay is refused.
  # 23.4.3 (mero-js#240): a presence listener added after the context is already
  # subscribed (useSubscription mounted before useEphemeral) still gets the
  # context's current presence.
  # 23.6.0 (mero-js#242): an account's HA claim signs the founding relay
  # (`relay_url`), which the cloud (mdma#418) hands the fleet node as admitter.
  # 23.8.1 (mero-js#245, published as 23.8.1 after #246): getAccountRelays
  # carries the relay's executorAccount and whether the cloud assigned it.
  # 23.8.2 (mero-js#244) signs namespace ops at schema 22 (core#4263 appends
  # GroupOp::SharedWritersRotated and ties core#4453's capability-revoke void
  # rule to the same number). This catalog is paired with core 0.11.0-rc.81,
  # the first release at schema 22. A node refuses any other version, so
  # against an rc.81 relay every account join, create and governance op
  # signed at 21 (23.8.1) is refused, and a 23.8.2 app is refused by an rc.79
  # or rc.80 node the same way. The `merod-image` pin in Cargo.toml and this
  # line move TOGETHER.
  # 23.9.0 (mero-js#247): the delegated account layer (createAccountAdmin,
  # buildDelegatedClient, foundDelegatedNamespace, joinAsAccount, the registry
  # app id and the wallet enrolment helpers) lives in mero-js, so a vanilla-TS
  # app (mero-blocks, merraria) signs in with an account without mero-react.
  # 24.5.0 signs what current core requires: schema 23 namespace ops, account-bound
  # device ids, and warrants naming the executor key and the release they pin.
  # 25.2.0 signs namespace ops at schema 25, which core 0.11.0-rc.87 requires:
  # against an rc.87 node every account join, create and governance op signed
  # at 24 (24.5.0, 25.0.x) is refused with "schema version mismatch: expected
  # 25, got 24". The `merod-image` pin in Cargo.toml and this line move
  # TOGETHER. The 25.0.0 break (#265) is the sealed verifier trusting only the
  # production image profile by default; 25.0.3 (#264) resolves a join's relay
  # from the cloud's list only, so a resolved relay no longer carries `via` or
  # `admitterAddrs`. No app on the catalog used either. mero-react 9.13.2 still
  # declares mero-js ^24.5.0, so the root `pnpm.overrides` entry in package.json
  # (`"@calimero-network/mero-js": "catalog:"`) is what puts it on this line
  # too; without it mero-react bundles its own 24.5.0 and its joins sign at 24.
  # 25.3.1 (mero-js#262) signs a request proof over the path and query under
  # `calimero.auth.request.v2`, the only form merod 0.11.0-rc.89 (core#4549)
  # admits; 25.3.0 signs v1 and its proofs get 401s from rc.89. Exact, not
  # ^: 25.3.2 (mero-js#271) refuses a login callback this page did not begin,
  # which drops the tokens Calimero Desktop opens an app with until
  # mero-react#103 passes `allowUnsolicited` there, and it removes the
  # enrolment `state`/`expectState` options mero-blocks and merraria pass.
  # 26.1.0 (mero-js#287): a refused join names why, so a link already used and
  # a removal by an admin each get their own message (mero-react#113). The
  # mero-react#116 provider passes `allowUnsolicited` inside Calimero Desktop,
  # and mero-blocks and merraria let mero-js keep the enrolment state. The
  # 26.0.0 break (#286) dropped calls to routes core does not serve; no app on
  # the catalog used them.
  # 26.2.1 (mero-js#290) signs namespace ops at schema 26, the only version
  # merod 0.11.0-rc.90 (core#4605) admits, so it moves with the rc.90 pin and
  # `merod-image`: rc.89 refuses 26 and rc.90 refuses 25. 26.2.2 (mero-js#284)
  # binds a cloud link grant to the browser that began the link and makes the
  # handoff async; delegated-execution is the only app that links.
  "@calimero-network/mero-js": 26.9.1
  # mero-react 9.6.0 (#80): the connect dialog has Node and Cloud tabs, so
  # every app on ConnectButton signs in with an account as well as a node, and
  # useMero().admin is the account admin on an account. From 9.3 `mero` is
  # `MeroJs | MeroClient`: an app hands it to a generated client (which takes
  # any ExecuteTransport from abi-codegen 2.4.0) or builds what it needs from
  # `admin` and `mero.rpc`, never assumes a MeroJs. 9.6 depends on mero-js
  # ^23.4.0 itself, so the root override that pinned its mero-js is gone.
  # 9.6.1 (#82): an account can leave or manage a subgroup it did not create,
  # and a MultiContext token holds `context:delete`.
  # 9.6.2 (#83): an account joins as a node joins (an inherited member joins,
  # a direct member's join is a no-op), and leaveContext is refused by name for
  # an account: a node's leave is local, and leaving the group is leaveGroup.
  # 9.6.3 (#84): an account's alias reads are refused by name like its alias
  # writes, and it reads its groups' upgrade and cascade status (core rc.76).
  # 9.6.4 (#85): and its migration status, which core rc.77 (#4400) checks
  # against the caller rather than the relay.
  # 9.7.0 (#86): a brand-new account founds a namespace on a relay whose
  # executor account the app knows (the cloud shows it), without joining one first.
  # 9.7.1 (#87): an account's reads authenticate on a hosted (TDX) relay: the
  # quote verifier loaded under Vite's CommonJS interop, so no session was minted.
  # 9.8.0 (#88): an account that founds a namespace enables HA for it with no
  # cloud session, naming its founding relay; and refuses to mint an invitation
  # the cloud routes to none of its admitters (InvitationNotClaimableError).
  # 9.9.0 (#90): enrolment puts the cloud-assigned relay's executor account on
  # the session, so a brand-new account founds without joining anything first.
  # 9.11.2 (#95): every hook goes through the session's account-aware admin,
  # not the raw client, so an account mints invitations and joins through the
  # relay from any app (the raw route answered 403 on an account token).
  # 9.11.3 (#96): an account's createContext carries `serviceName` and
  # `contextSeed` into the creation warrant; without it the relay created a
  # multi-service bundle's non-default context (mero-docs `registry`) for the
  # default service and the route answered 500.
  # 9.11.4 (#97): memberPublicKey is the account on an account's createContext,
  # invitations fall back to the admitting relay when the cloud has no route,
  # and reads go through the relay's query route instead of warrants.
  # 9.12.0 (#99): inside a Calimero Desktop window the connect dialog has no
  # Cloud tab — the window is already bound to the desktop's node, and the
  # wallet redirect would navigate it off to another origin. Browsers unchanged.
  # 9.13.2 moves with mero-js 25: from 25.0.7 a stored token bundle is bound to
  # the node that issued it (`node_origin`), and 9.12-9.13.1 wrote and read the
  # token store directly, so a login on them stored an unbound bundle, called
  # itself signed in and sent every request without a token. 9.13.2 writes and
  # reads it through the MeroJs for the node. An app or test that seeds
  # `mero-tokens` itself has to stamp `node_origin` the same way.
  # 9.14.0 (#106) carries what the apps' own @calimero-apps/invite and
  # @calimero-apps/join-sync were (link capture, redemption, the post-join
  # sync gate) plus InvitationDialog, the one invitation prompt every app shows.
  # 9.14.1 (#107): useJoinSync hears a join of the namespace a page already
  # shows; on 9.14.0 the dialog sat on "Syncing…" for that invitation.
  # 9.15.0 (#111): LoginModal carries `mero-login-*` classes and
  # `--mero-login-shadow`, which glass.css uses for the connect dialog's float
  # shadow, font and blur.
  # 9.16.0 (#109): InvitationGate, the "You're invited" screen a link opened
  # while logged out lands on instead of the app's landing page.
  # 9.16.1 (#110): a stray click outside the dialog no longer closes it while
  # a join is still syncing.
  # 10.1.2 moves with mero-js 26. 10.0.0 removed `useNamespaceIdentity`, which
  # no app used; 10.1.0 (#113) says when a link was already used or the person
  # was removed; 10.1.2 (#116) signs in an app Calimero Desktop opens, which
  # mero-js 26 otherwise refuses as a login this page did not begin.
  "@calimero-network/mero-react": ^10.3.0
  # 1.5.2 (design-system#26): the RichTextEditor carries one ProseMirror. 1.5.1
  # inlined Tiptap's core but loaded @tiptap/extensions from the app, so every
  # editor mount threw "Adding different instances of a keyed plugin (plugin$)"
  # (mero-chat's journey, on main too).
  "@calimero-network/mero-ui": ^1.5.2
  # The landing template's feature-card and theme-toggle icons. Catalogued
  # because twelve apps now import it; before this, the three that already used
  # it each pinned their own version.
  "@calimero-network/mero-icons": ^0.0.5
  "@calimero-network/mero-platform": ^0.1.0
  "@calimero-network/mero-platform-react": ^0.1.0
  # abi-codegen 2.4.0 (mero-devtools-js#66): a generated client takes any
  # ExecuteTransport, or anything exposing one as `.rpc`, not a concrete MeroJs.
  "@calimero-network/abi-codegen": ^2.4.0

  # ── runtime ────────────────────────────────────────────────────────────────
  react: ^19.2.8
  react-dom: ^19.2.8
  # Invitation payload codec: deflate + base58 keeps a shared link short enough
  # to paste into a chat message.
  bs58: ^6.0.0
  fflate: ^0.8.2

  # Shared by the canvas apps (mero-design, mero-pixart). Listed here rather
  # than per-app because both carry them and they drifted apart in the separate
  # repos — axios was ^1.18.0 in one and ^1.12.0 in the other.
  react-router-dom: ^7.15.1
  zustand: ^5.0.5
  clsx: ^2.1.1
  uuid: ^11.1.0
  axios: ^1.18.0

  # ── build / test ───────────────────────────────────────────────────────────
  typescript: ~5.8.3
  vite: ^6.4.3
  vitest: ^4.1.10
  "@vitejs/plugin-react": ^4.3.4
  "@playwright/test": ^1.62.1
  jsdom: ^25.0.1
  "@vitejs/plugin-react-swc": ^3.9.0
  "@testing-library/react": ^16.3.2
  "@testing-library/jest-dom": ^6.9.1
  # eslint flat-config stack, shared by the canvas apps.
  eslint: ^9.29.0
  "@eslint/js": ^9.29.0
  typescript-eslint: ^8.30.1
  eslint-plugin-react-hooks: ^5.2.0
  eslint-plugin-react-refresh: ^0.4.19
  globals: ^16.0.0

  # ── types ──────────────────────────────────────────────────────────────────
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  "@types/node": ^22.10.0
  "@types/uuid": ^10.0.0

# esbuild's postinstall needs approving explicitly under pnpm 10+; pnpm 11
# renamed the key to `allowBuilds`, so this may need updating with the toolchain.
onlyBuiltDependencies:
  - esbuild
