[package]
name = "mero-meet"
description = "Calimero video-call signaling (control plane)"
# NOT the release version. cargo requires a version field, but
# .github/workflows/deploy-bundle.yml ignores it: the registry owns the number —
# the check job takes the highest published appVersion and increments the patch
# (0.0.1 when nothing is published yet). Bumping this changes nothing about what
# gets released, so do not read a shipped version out of the tree; read it from
# the registry or the workflow's run summary.
version = "0.0.2"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Read by `cargo mero bundle` (core #3374): every field the node and the
# registry render now has a producer here, so nothing hand-writes a
# manifest.json. `appVersion` is deliberately absent — the deploy workflow
# resolves it from the registry with `--bump patch`.
[package.metadata.calimero]
package = "com.calimero.meromeet"
name = "Mero Meet"
description = "Decentralized, peer-to-peer video calling on Calimero. WebRTC media; signaling rides your nodes — no signaling server."
author = "Calimero"
# The desktop resolves a deep link (calimero://<slug>/… and
# https://links.calimero.network/<slug>/…) by Application.package, so the slug
# IS the package id.
slug = "com.calimero.meromeet"
# Embedded into the manifest as a data: URI, which is what gives the app a real
# icon in the registry and — via tauri-app's `ensure_app_launcher_icon` — in the
# macOS Dock. The bundled icon is preferred over fetching the frontend's PWA
# manifest because it is deterministic and works offline. Regenerate with
# `node app/scripts/gen-icons.mjs`.
icon = "../app/public/icon-512.png"
tags = ["video", "calls", "webrtc"]
github = "https://github.com/calimero-network/mero-meet"
# Equal to the SDK tag below, always. This is a claim about the runtime this
# bundle was built and tested against, not a floor someone once guessed: it sat
# at "0.1.0" for three releases, which told every node "any version will do"
# while the wasm was calling host functions no such node has.
min-runtime-version = "0.11.0-rc.25"
frontend = "https://mero-meet.vercel.app/"

[dependencies]
borsh = "1.6.1"
borsh-derive = "1.6.1"
bs58 = "0.5.1"
# Pin a real release tag, never `branch = "master"`: master rides unreleased
# protocol work against nodes that run the release. All SDK crates must share
# the exact same tag (the workspace version at a tag is 0.0.0).
calimero-sdk = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.25" }
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.25" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.25" }
thiserror = "1.0.56"

[dev-dependencies]
# Enables register_crdt_merge + the native mock host so TestHost can drive the
# AccessControl writer-set state under `cargo test`.
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.25", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
