[toolchain]
channel = "1.89.0"
# ^~~ keep this in sync with mero-chat / the merod build toolchain
# rustfmt is required, not optional: CI gates on `cargo fmt --check`, and a
# pinned channel does NOT inherit the components your default toolchain happens
# to have — without it listed the gate fails with "'cargo-fmt' is not installed
# for the toolchain '1.89.0'" on any clean machine.
components = ["cargo", "clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
