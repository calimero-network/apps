# XcodeGen spec for the native iOS Mero PixArt app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroPixart.xcodeproj (not committed)
#   open MeroPixart.xcodeproj
#
# Everything that is not a view (the generated contract client, the native
# compositor, the invitation codec, the view models) is the local SwiftPM
# package PixartCore/, which `swift test --package-path PixartCore` builds and
# tests on macOS.
#
# The swift-sdk is pinned to the `feat/app-session` commit (PR #84) until it
# merges; then move both pins (here and PixartCore/Package.swift) to the merge commit.
name: MeroPixart

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 122bb0d71bb43b823cb9d694c4e70678a2ef8c89
  PixartCore:
    path: PixartCore

targets:
  MeroPixart:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Assets.xcassets
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero PixArt
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          # The wallet returns here after Cloud sign-in (`mero-pixart://enrol#credential=…`).
          - CFBundleURLName: network.calimero.pixart.enrol
            CFBundleURLSchemes: [mero-pixart]
          # Deep links: `calimero://com.calimero.mero-pixart/project?team=…&project=…`
          # and invitations, `calimero://com.calimero.mero-pixart/join?invitation=…`.
          - CFBundleURLName: network.calimero.pixart.links
            CFBundleURLSchemes: [calimero]
        # Where sign-in goes. Empty = the SDK's defaults (the hosted Calimero
        # wallet and Cloud manager). See README.md.
        MeroPixartCallbackScheme: mero-pixart
        MeroPixartCallbackHost: ""
        MeroPixartCallbackPath: /enrol
        MeroCloudBaseURL: ""
        MeroWalletURL: ""
        MeroRegistryURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.pixart
        PRODUCT_NAME: MeroPixart
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: PixartCore
        product: PixartCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

schemes:
  MeroPixart:
    build:
      targets:
        MeroPixart: all
