# XcodeGen spec for the native iOS Mero PixArt app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroPixart.xcodeproj (not committed)
#   open MeroPixart.xcodeproj
#
# Everything that is not a view (the generated contract client, the native
# compositor, the invitation codec, the view models) is the local SwiftPM
# package PixartCore/, which `swift test --package-path PixartCore` builds and
# tests on macOS.
#
# The swift-sdk is pinned to the head of its Calimero 1.0 branch
# (calimero-network/swift-sdk#85, `feat/calimero-1.0`); the pin moves to that
# PR's merge commit once it lands. Keep both pins (here and
# PixartCore/Package.swift) equal.
name: MeroPixart

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: a1ec644130d4405a1bab7547654b1442cc559b49
  PixartCore:
    path: PixartCore

targets:
  MeroPixart:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Assets.xcassets
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero PixArt
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          # The node's consent page returns here (`mero-pixart://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.pixart.consent
            CFBundleURLSchemes: [mero-pixart]
          # Deep links: `calimero://com.calimero.mero-pixart/project?team=…&project=…`
          # and invitations, `calimero://com.calimero.mero-pixart/join?invitation=…`.
          - CFBundleURLName: network.calimero.pixart.links
            CFBundleURLSchemes: [calimero]
        # The Calimero 1.0 cluster. MeroNodeURL: a node from Calimero Cloud's
        # console (empty = sign-in asks for one); MeroNodes: the cluster's other
        # nodes, comma-separated, for failover; MeroAllowMock: YES only for a
        # `merod local` cluster (mock attestation). See ../README.md.
        MeroNodeURL: ""
        MeroNodes: ""
        MeroAllowMock: "NO"
        MeroPackageVersion: ""
        # Where the node's consent page returns to.
        MeroPixartCallbackScheme: mero-pixart
        MeroPixartCallbackHost: ""
        MeroPixartCallbackPath: /consent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.pixart
        PRODUCT_NAME: MeroPixart
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: PixartCore
        product: PixartCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

schemes:
  MeroPixart:
    build:
      targets:
        MeroPixart: all
