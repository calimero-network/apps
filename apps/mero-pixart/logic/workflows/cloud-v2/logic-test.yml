# Ported from logic-test.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
name: Logic Unit Test
description: 'Comprehensive test of MeroPixArt WASM logic. Verifies all core operations: document init,
  member join, role grant, layer CRUD, adjustments, layer reordering, and document update.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3430
accounts:
- calimero-node-1
steps:
- name: Install Application
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_pixart.wasm'
  outputs:
    app_id: hash
  account: calimero-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Namespace
  type: create_org
  org_name: Create Namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Create Project Context
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_pixart.wasm'
  app_name: Create Project Context
  init_args: '{"name": "Test Project", "description": "Logic test project", "width": 800, "height": 600}'
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Get Document
  type: call
  app: '{{context_id}}'
  method: get_document
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    doc_info: rpc
- name: Assert Document Name
  type: assert
  statements:
  - contains({{doc_info}}, 'Test Project')
- name: Join as Alice
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Alice
    avatar: null
    timestamp: 1000000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Get Members
  type: call
  app: '{{context_id}}'
  method: get_members
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    members: rpc
- name: Assert Alice is Member
  type: assert
  statements:
  - contains({{members}}, 'Alice')
- name: Get My Role
  type: call
  app: '{{context_id}}'
  method: my_role
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    my_role: rpc
- name: Assert Creator is Admin
  type: assert
  statements:
  - contains({{my_role}}, 'admin')
- name: Add Raster Layer
  type: call
  app: '{{context_id}}'
  method: add_layer
  args:
    layer:
      id: layer-1
      name: Background
      kind: raster
      layerIndex: 0
      visible: true
      locked: false
      opacity: 100
      blendMode: normal
      x: 0
      y: 0
      width: 800
      height: 600
      rotation: 0
      scaleX: 100
      scaleY: 100
      fill: '#ffffff'
      adjustments:
        brightness: 0
        contrast: 0
        saturation: 0
        hue: 0
        exposure: 0
        blur: 0
        invert: false
      createdBy: alice
      createdAt: 1000001
      updatedAt: 1000001
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Add Text Layer
  type: call
  app: '{{context_id}}'
  method: add_layer
  args:
    layer:
      id: layer-2
      name: Title Text
      kind: text
      layerIndex: 1
      visible: true
      locked: false
      opacity: 100
      blendMode: normal
      x: 50
      y: 50
      width: 300
      height: 80
      rotation: 0
      scaleX: 100
      scaleY: 100
      adjustments:
        brightness: 0
        contrast: 0
        saturation: 0
        hue: 0
        exposure: 0
        blur: 0
        invert: false
      text:
        content: Hello MeroPixArt
        fontFamily: Inter
        fontSize: 48
        color: '#ffffff'
        bold: false
        italic: false
      createdBy: alice
      createdAt: 1000002
      updatedAt: 1000002
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Get All Layers
  type: call
  app: '{{context_id}}'
  method: get_layers
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    all_layers: rpc
- name: Assert Two Layers Exist
  type: assert
  statements:
  - contains({{all_layers}}, 'layer-1')
  - contains({{all_layers}}, 'layer-2')
  - contains({{all_layers}}, 'Background')
  - contains({{all_layers}}, 'Hello MeroPixArt')
- name: Get Single Layer
  type: call
  app: '{{context_id}}'
  method: get_layer
  args:
    id: layer-1
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    single_layer: rpc
- name: Assert Single Layer Data
  type: assert
  statements:
  - contains({{single_layer}}, 'layer-1')
  - contains({{single_layer}}, 'Background')
- name: Update Layer Properties
  type: call
  app: '{{context_id}}'
  method: update_layer
  args:
    id: layer-1
    name: Renamed Background
    visible: false
    locked: null
    opacity: 80
    blend_mode: multiply
    x: 10
    y: 20
    width: null
    height: null
    rotation: null
    scale_x: null
    scale_y: null
    fill: null
    updated_at: 1000010
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Get Updated Layer
  type: call
  app: '{{context_id}}'
  method: get_layer
  args:
    id: layer-1
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    updated_layer: rpc
- name: Assert Updated Values
  type: assert
  statements:
  - contains({{updated_layer}}, 'Renamed Background')
  - contains({{updated_layer}}, 'multiply')
- name: Update Adjustments
  type: call
  app: '{{context_id}}'
  method: update_adjustments
  args:
    id: layer-1
    brightness: 20
    contrast: -10
    saturation: 5
    hue: null
    exposure: null
    blur: null
    invert: true
    curves: null
    updated_at: 1000011
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Get Adjusted Layer
  type: call
  app: '{{context_id}}'
  method: get_layer
  args:
    id: layer-1
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    adjusted_layer: rpc
- name: Assert Adjustments Applied
  type: assert
  statements:
  - contains({{adjusted_layer}}, 'brightness')
  - contains({{adjusted_layer}}, '20')
- name: Bring Layer 1 to Front
  type: call
  app: '{{context_id}}'
  method: bring_to_front
  args:
    id: layer-1
    updated_at: 1000012
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Send Layer 2 to Back
  type: call
  app: '{{context_id}}'
  method: send_to_back
  args:
    id: layer-2
    updated_at: 1000013
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Layers After Reorder
  type: call
  app: '{{context_id}}'
  method: get_layers
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    reordered_layers: rpc
- name: Assert All Still Present After Reorder
  type: assert
  statements:
  - contains({{reordered_layers}}, 'layer-1')
  - contains({{reordered_layers}}, 'layer-2')
- name: Update Document
  type: call
  app: '{{context_id}}'
  method: update_document
  args:
    name: Renamed Project
    description: Updated description
    width: 1024
    height: 768
    background: null
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Verify Document Update
  type: call
  app: '{{context_id}}'
  method: get_document
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    updated_doc: rpc
- name: Assert Document Renamed
  type: assert
  statements:
  - contains({{updated_doc}}, 'Renamed Project')
  - contains({{updated_doc}}, '1024')
- name: Delete Text Layer
  type: call
  app: '{{context_id}}'
  method: delete_layer
  args:
    id: layer-2
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Layers After Delete
  type: call
  app: '{{context_id}}'
  method: get_layers
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    final_layers: rpc
- name: Assert Text Layer Deleted
  type: assert
  statements:
  - contains({{final_layers}}, 'layer-1')
