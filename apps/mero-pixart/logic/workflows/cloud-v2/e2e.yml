# Ported from e2e.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   set_default_capabilities x1: capabilities are v1 governance
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: E2E Two-Node Test
description: 'Full two-node MeroPixArt e2e workflow. Installs app, creates a project, adds layers from
  both nodes, verifies sync.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3410
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_pixart.wasm'
  outputs:
    app_id: hash
  account: calimero-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Namespace
  type: create_org
  org_name: Create Namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Create Project
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_pixart.wasm'
  app_name: Create Project
  init_args: '{"name": "E2E Project", "description": "", "width": 800, "height": 600}'
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Create Identity on Node 2
  type: whoami
  account: calimero-node-2
  outputs:
    public_key_2: publicKey
- name: Invite and Join
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invitation_2: token
- name: Settle before the namespace join (cold-join KeyDelivery)
  type: wait
  seconds: 1.0
- name: Node 2 Joins
  type: redeem_invite
  token: '{{invitation_2}}'
  account: calimero-node-2
- name: Add Layer from Node 1
  type: call
  app: '{{context_id}}'
  method: add_layer
  args:
    layer:
      id: layer-1
      name: Background
      kind: raster
      layerIndex: 0
      visible: true
      locked: false
      opacity: 100
      blendMode: normal
      x: 0
      y: 0
      width: 800
      height: 600
      rotation: 0
      scaleX: 100
      scaleY: 100
      fill: '#ffffff'
      adjustments:
        brightness: 0
        contrast: 0
        saturation: 0
        hue: 0
        exposure: 0
        blur: 0
        invert: false
      createdBy: node1
      createdAt: 1751953010
      updatedAt: 1751953010
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Verify Layers
  type: call
  app: '{{context_id}}'
  method: get_layers
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    layers: rpc
- name: Assert Layer Synced
  type: assert
  statements:
  - contains({{layers}}, 'layer-1')
  - contains({{layers}}, 'Background')
- name: Node 2 (a viewer) tries to delete Node 1's layer
  type: call
  app: '{{context_id}}'
  method: delete_layer
  args:
    id: layer-1
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  expected_failure: true
  outputs:
    viewer_delete_error: error
- name: Node 1 reads its layers after the refused delete
  type: call
  app: '{{context_id}}'
  method: get_layers
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    layers_after_viewer: rpc
- name: Assert the viewer's delete was refused and changed nothing
  type: assert
  statements:
  - is_set({{viewer_delete_error}})
  - contains({{layers_after_viewer}}, 'layer-1')
