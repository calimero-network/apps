# Ported from the v1 workflow integration-setup.yml (`merobox cloud port`).
# v1 nodes are accounts here.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: Integration Test Setup
description: 'Sets up a two-node environment for MeroPixArt integration tests. Creates a project context,
  sets up two members (Alice and Bob), adds a seed layer, then leaves nodes running for Playwright.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3420
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_pixart.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.mero-pixart
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Namespace
  type: create_org
  org_name: Create Namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Set Default Member Capabilities
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 15
  account: calimero-node-1
- name: Create Project Context
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_pixart.wasm'
  app_name: Create Project Context
  init_args: '{"name": "Integration Project", "description": "Playwright test project", "width": 800,
    "height": 600}'
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Create Identity on Node 2
  type: whoami
  account: calimero-node-2
  outputs:
    public_key_2: publicKey
- name: Wait for Identity Setup
  type: wait
  seconds: 1.0
- name: Invite Node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invitation_2: token
- name: Settle before the namespace join (cold-join KeyDelivery)
  type: wait
  seconds: 1.0
- name: Node 2 Joins Namespace
  type: redeem_invite
  token: '{{invitation_2}}'
  account: calimero-node-2
- name: Alice Joins Project
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Alice
    avatar: null
    timestamp: 1751953000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Bob Joins Project
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Bob
    avatar: null
    timestamp: 1751953001
  account: calimero-node-2
  as_key: '{{public_key_2}}'
- name: Alice Adds Seed Layer
  type: call
  app: '{{context_id}}'
  method: add_layer
  args:
    layer:
      id: layer-1
      name: Background
      kind: raster
      layerIndex: 0
      visible: true
      locked: false
      opacity: 100
      blendMode: normal
      x: 0
      y: 0
      width: 800
      height: 600
      rotation: 0
      scaleX: 100
      scaleY: 100
      fill: '#ffffff'
      adjustments:
        brightness: 0
        contrast: 0
        saturation: 0
        hue: 0
        exposure: 0
        blur: 0
        invert: false
      createdBy: node1
      createdAt: 1751953010
      updatedAt: 1751953010
  account: calimero-node-1
  as_key: '{{member_public_key}}'
