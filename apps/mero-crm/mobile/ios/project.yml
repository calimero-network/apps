# XcodeGen spec for the native iOS Mero CRM app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroCRM.xcodeproj (not committed)
#   open MeroCRM.xcodeproj
#
# Everything that is not a view (the generated contract client, the helpers and
# the view models) is the local Swift package in Core/, tested with
# `swift test` on macOS. The swift-sdk is pinned by revision to `feat/app-session`
# (PR #84); it moves to the merge commit once that PR lands. Keep it equal to
# the revision in Core/Package.swift.
name: MeroCRM

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 122bb0d71bb43b823cb9d694c4e70678a2ef8c89
  CrmCore:
    path: Core

targets:
  MeroCRM:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: CRM
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          # The wallet returns here after Cloud sign-in (`mero-crm://enrol#credential=…`).
          - CFBundleURLName: network.calimero.crm.enrol
            CFBundleURLSchemes: [mero-crm]
          # Invitation deep links: `calimero://com.calimero.mero-crm/join?invitation=…`.
          - CFBundleURLName: network.calimero.crm.invite
            CFBundleURLSchemes: [calimero]
        # Where sign-in goes. Empty = the SDK's defaults (the hosted Calimero
        # wallet, Cloud manager and registry). See README.md.
        CrmCallbackScheme: mero-crm
        CrmCallbackHost: ""
        CrmCallbackPath: /enrol
        MeroCloudBaseURL: ""
        MeroWalletURL: ""
        MeroRegistryURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.crm
        PRODUCT_NAME: MeroCRM
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: CrmCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

schemes:
  MeroCRM:
    build:
      targets:
        MeroCRM: all
