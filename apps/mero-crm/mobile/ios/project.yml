# XcodeGen spec for the native iOS Mero CRM app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroCRM.xcodeproj (not committed)
#   open MeroCRM.xcodeproj
#
# Everything that is not a view (the generated contract client, the helpers and
# the view models) is the local Swift package in Core/, tested with
# `swift test` on macOS. The swift-sdk is pinned by revision to the head of its
# Calimero 1.0 port (swift-sdk#85, branch feat/calimero-1.0); it moves to the
# merge commit once that lands. Keep it equal to the revision in Core/Package.swift.
name: MeroCRM

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: a1ec644130d4405a1bab7547654b1442cc559b49
  CrmCore:
    path: Core

targets:
  MeroCRM:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: CRM
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          # The node's consent page returns here (`mero-crm://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.crm.consent
            CFBundleURLSchemes: [mero-crm]
          # Invitation deep links: `calimero://com.calimero.mero-crm/join?invitation=…`.
          - CFBundleURLName: network.calimero.crm.invite
            CFBundleURLSchemes: [calimero]
        # Which cluster sign-in uses (Calimero 1.0). MeroNodeURL: a node of your
        # Calimero Cloud cluster (from the cloud.calimero.network console); empty =
        # the sign-in screen asks. MeroDevNodeURL: what the "Development node"
        # field starts with (`merod local`, mock attestation allowed). See README.
        CrmCallbackScheme: mero-crm
        CrmCallbackHost: ""
        CrmCallbackPath: /consent
        MeroNodeURL: ""
        MeroDevNodeURL: "http://localhost:2501"
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # http only to a node on the local network (localhost, *.local, an IP literal).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # A passkey on a real cluster belongs to its relying party (the node's --rp-id).
    # To sign in with the device's passkey there, add an entitlements file with
    # `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`. A
    # development node uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.crm
        PRODUCT_NAME: MeroCRM
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: CrmCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # The demo tour (Debug, `-MeroDemo YES`): every main screen with named
  # screenshots. Run by apps-capture/ios-capture.sh.
  MeroCRMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: MeroCRM }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.crm.uitests
        TEST_TARGET_NAME: MeroCRM
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  MeroCRM:
    build:
      targets:
        MeroCRM: all
    test:
      config: Debug
      targets: [MeroCRMUITests]
