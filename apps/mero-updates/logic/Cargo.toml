[package]
# Directory == cargo package == npm package (`apps/$APP/logic` and `pnpm -F $APP`).
name = "mero-updates"
description = "Investor updates and investor relations on Calimero, on the component SDK"
# NOT the release version: the release workflow passes the next appVersion to
# `mero-component bundle --app-version`. Cargo requires the field.
version = "0.1.0"
edition = "2021"
authors = ["Calimero Limited <info@calimero.network>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/calimero-network/apps"
publish = false

[lib]
# A `calimero:app` component. No `rlib`: the tests run the BUILT component on
# core's engine (tests/common/mod.rs), not the crate linked natively.
crate-type = ["cdylib"]

# Core at `component-core-tag` (root Cargo.toml), the same tag for every core
# crate; scripts/check-component-pins.py asserts it. A standalone crate cannot
# inherit `[workspace.dependencies]`.
[dependencies]
calimero-sdk = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.20" }
# Posts (sections, metrics), settings, drafts and every result shape that
# carries a list are plain serde structs: a `Record` cannot hold a list field.
serde = { version = "1", features = ["derive"] }

# The harness (`TestApp`, `run_scenario`) and the builder the tests build this
# crate with, for `cargo test` on the host only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-sdk       = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.20", features = ["testing"] }
calimero-app-build = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.20" }
serde_json = "1"

# Read by `mero-component bundle` (tools/component-bundle), with the keys
# `cargo mero bundle` reads for a v1 app.
[package.metadata.calimero]
package = "com.calimero.mero-updates"
name = "Mero Updates"
description = "Investor updates without the platform: categories, KPIs, asks and two-way replies, between a company's team and its investors."
author = "Calimero"
slug = "com.calimero.mero-updates"
# A real icon, not a placeholder (scripts/check-app-icons.py).
# Regenerate with `node app/scripts/gen-icons.mjs`.
icon = "../app/public/icon-512.png"
category = "productivity"
tags = ["investor-updates", "investor-relations", "startups", "newsletter"]
github = "https://github.com/calimero-network/apps"
# `component-min-runtime-version` in the root Cargo.toml.
min-runtime-version = "1.0.0-rc.20"
# The listing's link. NOT where the production frontend runs: a Cloud node
# trusts passkey ceremonies only from frontends it serves from a bundle, so the
# production frontend is the one packed below (docs/COMPONENT-APPS.md).
frontend = "https://mero-updates.vercel.app"
# The built frontend the bundle carries. Build it first: `pnpm -F mero-updates build`.
frontend-dir = "../app/dist"

# Standalone: excluded from the root workspace (root Cargo.toml), its own Cargo.lock.
[workspace]
