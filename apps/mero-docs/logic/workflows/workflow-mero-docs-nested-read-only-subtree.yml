    group_id: '{{g_G3}}'
    member_id: '{{bob_account}}'
    role: Member

  - name: Alice sets Bob's registry role in G3 to Editor
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: set_folder_role
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_G3}}'
      member: '{{bob_account}}'
      role: Editor

  - name: Alice makes Bob core Member in K again
    type: update_member_role
    node: curn-node-1
    group_id: '{{g_K}}'
    member_id: '{{bob_account}}'
    role: Member

  - name: Alice sets Bob's registry role in K to Editor
    type: call
