  - name: Sync G's restored role to Bob
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    group_id: '{{g_G}}'
    timeout: 45

  - name: Sync G2's restored role to Bob
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    group_id: '{{g_G2}}'
    timeout: 45

  - name: Sync G3's restored role to Bob
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    group_id: '{{g_G3}}'
    timeout: 45

  - name: Sync K's restored role to Bob
    type: wait_for_sync
