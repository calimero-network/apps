    method: get_doc
    executor_public_key: '{{a_K}}'
    args:
      id: '{{d_K}}'
    outputs:
      k_ro: result.output.title

  - name: A later and a newly opened sub-folder are Read only too
    type: json_assert
    statements:
      - 'json_equal({{g3_ro}}, "G3 original")'
      - 'json_equal({{k_ro}}, "K original")'

  - name: Alice makes Bob core Member in F again
    type: update_member_role
    node: curn-node-1
    group_id: '{{g_F}}'
    member_id: '{{bob_account}}'
    role: Member

  - name: Alice sets Bob's registry role in F to Editor
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: set_folder_role
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_F}}'
      member: '{{bob_account}}'
      role: Editor

  - name: Alice makes Bob core Member in G again
    type: update_member_role
    node: curn-node-1
    group_id: '{{g_G}}'
    member_id: '{{bob_account}}'
    role: Member

  - name: Alice sets Bob's registry role in G to Editor
    type: call
