  - name: Sync G3 after Bob's write
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    context_id: '{{c_G3}}'
    timeout: 45

  - name: Sync K after Bob's write
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    context_id: '{{c_K}}'
    timeout: 45

  - name: Alice reads the G3 doc (g3_ro)
