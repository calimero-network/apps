    type: call
    node: curn-node-1
    context_id: '{{c_G4}}'
    method: get_doc
    executor_public_key: '{{a_G4}}'
    args:
      id: '{{d_G4}}'
    outputs:
      g4_removed: result.output.title

  - name: Removed from F2, Bob writes no more in its Open sub-folder G4
    type: json_assert
    statements:
      - 'json_equal({{g4_removed}}, "G4 as an Editor")'

  - name: Alice removes Bob from the workspace
    type: remove_group_members
    node: curn-node-1
    group_id: '{{namespace_id}}'
    members:
      - '{{bob_account}}'

  - name: Alice removes Bob's direct row in F, as the sweep does
    type: remove_group_members
    node: curn-node-1
    group_id: '{{g_F}}'
    members:
      - '{{bob_account}}'

  - name: Alice removes Bob's direct row in H, as the sweep does
    type: remove_group_members
    node: curn-node-1
    group_id: '{{g_H}}'
    members:
      - '{{bob_account}}'

  - name: Wait for the removals to reach Bob
    type: wait
    seconds: 10

  - name: Bob renames the F doc to 'F after workspace removal'
    type: call
    node: curn-node-2
    context_id: '{{c_F}}'
    method: edit_doc
    executor_public_key: '{{b_F}}'
    args:
      id: '{{d_F}}'
      title: F after workspace removal
    allow_failure: true

  - name: Bob renames the H doc to 'H after workspace removal'
    type: call
    node: curn-node-2
    context_id: '{{c_H}}'
    method: edit_doc
    executor_public_key: '{{b_H}}'
    args:
      id: '{{d_H}}'
      title: H after workspace removal
    allow_failure: true

  - name: Give a removed member's writes time to sync
    type: wait
    seconds: 10

  - name: Alice reads the F doc (f_gone)
    type: call
    node: curn-node-1
    context_id: '{{c_F}}'
    method: get_doc
    executor_public_key: '{{a_F}}'
    args:
      id: '{{d_F}}'
    outputs:
      f_gone: result.output.title

  - name: Alice reads the H doc (h_gone)
    type: call
    node: curn-node-1
    context_id: '{{c_H}}'
    method: get_doc
    executor_public_key: '{{a_H}}'
    args:
      id: '{{d_H}}'
    outputs:
      h_gone: result.output.title

  - name: Removed from the workspace, Bob writes nowhere
    type: json_assert
    statements:
      - 'json_equal({{f_gone}}, "F original")'
      - 'json_equal({{h_gone}}, "H restored")'

stop_all_nodes: false
