# Ported from the v1 workflow workflow-mero-docs-open-subgroup.yml (`merobox cloud port`).
# v1 nodes are accounts here.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: Mero Docs E2E - Open subgroup inheritance (core PR
description: 'Validates the new flow unlocked by calimero-network/core#2261: namespace members can self-join
  (and read/write) Open subgroups without the legacy app-layer add_group_members cascade. Restricted subgroups
  remain walls until an explicit invite.

  Two nodes: Alice (node-1) creates a namespace, an Open folder with a Docs context + a doc; Bob (node-2)
  joins ONLY the namespace and should still be able to join the Docs context, read the doc, and write
  to it (changes sync back to Alice). Then Alice creates a Restricted folder; Bob''s join_context attempt
  must fail until Alice explicitly add_group_members him; after that, the same join works.

  Sequential per merobox semantics - wait_for_sync hands writes off between writers/readers. wait blocks
  before joins are sized for governance gossip + group-store accept on slow docker networking.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3320
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install Mero Docs bundle on Alice
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.mero-drive-docs
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Alice creates namespace
  type: create_org
  org_name: Alice creates namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Alice creates the per-namespace Registry context
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs_registry.wasm'
  app_name: registry
  org: '{{namespace_id}}'
  outputs:
    registry_ctx: contextId
    alice_key: memberPublicKey
- name: Assert Alice's bootstrap shape
  type: assert
  statements:
  - is_set({{namespace_id}})
  - is_set({{registry_ctx}})
  - is_set({{alice_key}})
- name: Alice creates folder subgroup (Reports)
  type: create_team
  org: '{{namespace_id}}'
  team_name: reports
  join: invite
  outputs:
    reports_group: teamId
  account: calimero-node-1
- name: Mark Reports as Open (PR
  type: team_update
  org: '{{namespace_id}}'
  team: '{{reports_group}}'
  join: everyone
  account: calimero-node-1
- name: Name Reports and colour it (subgroup metadata)
  type: team_update
  org: '{{namespace_id}}'
  team: '{{reports_group}}'
  metadata:
    name: Reports
    data:
      color: '#00aa66'
  account: calimero-node-1
- name: Alice creates the Docs context inside Reports (the folder's one context)
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{reports_group}}'
  outputs:
    reports_docs_ctx: contextId
    alice_docs_key: memberPublicKey
- name: Alice creates the first doc inside Reports
  type: call
  app: '{{reports_docs_ctx}}'
  method: create_doc
  args:
    title: Q3 plan
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  outputs:
    doc_id: result
- name: Assert doc id was returned
  type: assert
  statements:
  - is_set({{doc_id}})
- name: Alice mints a namespace invitation for Bob
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    ns_invite: token
- name: Wait for namespace governance to gossip to Bob's node
  type: wait
  seconds: 1.0
  message: Namespace governance DAG needs to propagate before Bob can join
- name: Bob joins ONLY the namespace (no folder add_group_members)
  type: redeem_invite
  token: '{{ns_invite}}'
  account: calimero-node-2
- type: whoami
  account: calimero-node-2
  outputs:
    bob_identity: publicKey
- name: Assert Bob's namespace identity is set
  type: assert
  statements:
  - is_set({{bob_identity}})
- name: Wait for Open-subgroup inheritance to propagate to Bob
  type: wait
  seconds: 1.0
  message: Reports' Open visibility + parent-walk auth need to land on Bob's node
- name: Bob materialises Reports-folder membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{reports_group}}'
  account: calimero-node-2
  outputs:
    bob_reports_key: memberPublicKey
    bob_was_inherited: wasInherited
- name: Assert was_inherited is true (Bob is a namespace-only member)
  type: json_assert
  statements:
  - json_equal({{bob_was_inherited}}, true)
- name: List Reports-folder members on Bob's node (post-inheritance-join)
  type: team_get
  org: '{{namespace_id}}'
  team: '{{reports_group}}'
  account: calimero-node-2
- name: Bob joins the Reports Docs context (key already local)
  type: whoami
  account: calimero-node-2
  outputs:
    bob_docs_key: publicKey
- type: set
  values:
    reports_docs_ctx_bob: '{{reports_docs_ctx}}'
- name: Assert Bob's Docs context join landed
  type: assert
  statements:
  - is_set({{bob_docs_key}})
  - is_set({{bob_reports_key}})
- name: Bob reads Alice's doc via inherited access
  type: call
  app: '{{reports_docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_id}}'
  account: calimero-node-2
  as_key: '{{bob_docs_key}}'
- name: Bob edits the doc
  type: call
  app: '{{reports_docs_ctx}}'
  method: edit_doc
  args:
    id: '{{doc_id}}'
    title: Q3 plan (edited by Bob)
  account: calimero-node-2
  as_key: '{{bob_docs_key}}'
- name: Alice sees Bob's edit
  type: call
  app: '{{reports_docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_id}}'
  account: calimero-node-1
  as_key: '{{alice_key}}'
- name: Alice creates folder subgroup (Private)
  type: create_team
  org: '{{namespace_id}}'
  team_name: private
  join: invite
  outputs:
    private_group: teamId
  account: calimero-node-1
- name: Mark Private as Restricted (no inheritance)
  type: team_update
  org: '{{namespace_id}}'
  team: '{{private_group}}'
  join: invite
  account: calimero-node-1
- name: Name Private and colour it (subgroup metadata)
  type: team_update
  org: '{{namespace_id}}'
  team: '{{private_group}}'
  metadata:
    name: Private
    data:
      color: '#aa0000'
  account: calimero-node-1
- name: Alice creates a Docs context inside Private
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{private_group}}'
  outputs:
    private_docs_ctx: contextId
    alice_private_key: memberPublicKey
- name: Alice writes a private doc
  type: call
  app: '{{private_docs_ctx}}'
  method: create_doc
  args:
    title: Confidential
  account: calimero-node-1
  as_key: '{{alice_private_key}}'
  outputs:
    private_doc_id: result
- name: Wait for Restricted folder governance to gossip
  type: wait
  seconds: 1.0
  message: Restricted subgroup metadata needs to reach Bob's node before the negative join attempt
- name: Bob tries to join Private - must fail (Restricted wall)
  type: http
  method: get
  path: apps/{{private_docs_ctx}}
  account: calimero-node-2
  expected_failure: true
- name: Alice explicitly adds Bob to Private
  type: team_add
  org: '{{namespace_id}}'
  team: '{{private_group}}'
  members:
  - '{{bob_identity}}'
  role: member
  account: calimero-node-1
- name: Wait for Private membership to propagate to Bob
  type: wait
  seconds: 1.0
  message: Private subgroup membership row needs to land on Bob's node before retry
- name: Bob joins Private Docs context (now permitted)
  type: whoami
  account: calimero-node-2
  outputs:
    bob_private_key: publicKey
- type: set
  values:
    private_docs_ctx_bob: '{{private_docs_ctx}}'
- name: Assert Bob's Private join produced an executor key
  type: assert
  statements:
  - is_set({{bob_private_key}})
- name: Bob reads Alice's private doc after explicit invite
  type: call
  app: '{{private_docs_ctx}}'
  method: get_doc
  args:
    id: '{{private_doc_id}}'
  account: calimero-node-2
  as_key: '{{bob_private_key}}'
