# Ported from the v1 workflow workflow-mero-docs-tags-views.yml (`merobox cloud port`).
# v1 nodes are accounts here.
# Dropped (no release-v2 counterpart):
#   json_assert statement on a dropped step's output x2: checks what the dropped steps did
#   output read during a v1 partition x2: checks what the dropped steps did
#   start_node x4: a user's node going offline has no counterpart in a cluster
#   stop_node x4: a user's node going offline has no counterpart in a cluster
#   wait_for_sync x10: replication is synchronous: a read sees every committed write
name: Mero Docs E2E - Tags and Saved Views
description: "The registry's workspace tags and saved views, driven by two real nodes (Alice and Bob)\
  \ sharing one Registry context:\n\n  set_tag / delete_tag / list_tags\n  save_view / delete_view / list_views\n\
  \nA tag or view written on one node is read on the other. Two nodes that create the same tag key while\
  \ partitioned converge to one record whose colour is the later write. Deleting a tag keeps its row,\
  \ marked deleted, on both nodes, and a rename made on a partitioned node never revives it. Every validation\
  \ error is hit once, and each is shown to have written nothing.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3340
accounts:
- tags-node-1
- tags-node-2
steps:
- name: Install bundle on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  outputs:
    app_id_bundle: hash
  account: tags-node-1
- type: set
  values:
    app_id: com.calimero.mero-drive-docs
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Alice creates namespace
  type: create_org
  org_name: Alice creates namespace
  outputs:
    namespace_id: orgId
  account: tags-node-1
- name: Alice creates the per-namespace Registry context
  type: deploy
  account: tags-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs_registry.wasm'
  app_name: registry
  org: '{{namespace_id}}'
  outputs:
    reg_ctx: contextId
    alice_key: memberPublicKey
- name: Alice reads her account id
  type: call
  app: '{{reg_ctx}}'
  method: get_owner
  args: {}
  account: tags-node-1
  as_key: '{{alice_key}}'
  outputs:
    alice_hex: result
- name: Create namespace invitation for Bob
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: tags-node-1
  outputs:
    ns_invite: token
- name: Wait for namespace gossip to reach Node 2
  type: wait
  seconds: 1.0
- name: Bob joins the namespace
  type: redeem_invite
  token: '{{ns_invite}}'
  account: tags-node-2
- name: Bob joins the Registry context
  type: whoami
  account: tags-node-2
  outputs:
    bob_key: publicKey
- name: Bob lists tags on a new workspace
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-2
  as_key: '{{bob_key}}'
  outputs:
    tags_empty: rpc
- name: Bob lists views on a new workspace
  type: call
  app: '{{reg_ctx}}'
  method: list_views
  args: {}
  account: tags-node-2
  as_key: '{{bob_key}}'
  outputs:
    views_empty: rpc
- name: Assert both lists are empty
  type: json_assert
  statements:
  - 'json_equal({{tags_empty}}, {"output": []})'
  - 'json_equal({{views_empty}}, {"output": []})'
- name: Alice creates tag q3-plan while Bob is offline
  type: call
  app: '{{reg_ctx}}'
  method: set_tag
  args:
    key: q3-plan
    name: Q3 plan
    color: '#00aa66'
  account: tags-node-1
  as_key: '{{alice_key}}'
  allow_failure: true
- name: Bob lists tags before writing
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-2
  as_key: '{{bob_key}}'
  outputs:
    tags_bob_offline: rpc
  allow_failure: true
- name: Bob creates tag q3-plan with another colour while Alice is offline
  type: call
  app: '{{reg_ctx}}'
  method: set_tag
  args:
    key: q3-plan
    name: Q3 plan
    color: '#2266dd'
  account: tags-node-2
  as_key: '{{bob_key}}'
  allow_failure: true
- name: Wait for the nodes to find each other
  type: wait
  seconds: 1.0
- name: Alice lists tags after the partition
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-1
  as_key: '{{alice_key}}'
  outputs:
    tags_q3_alice: result
- name: Bob lists tags after the partition
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-2
  as_key: '{{bob_key}}'
  outputs:
    tags_q3_bob: result
- name: Assert both nodes hold one q3-plan record with the later colour
  type: json_assert
  statements:
  - 'json_equal({{tags_q3_alice}}, [{"key": "q3-plan", "name": "Q3 plan", "color": "#2266dd", "deleted":
    false}])'
  - 'json_equal({{tags_q3_bob}}, [{"key": "q3-plan", "name": "Q3 plan", "color": "#2266dd", "deleted":
    false}])'
- name: Alice creates tag launch
  type: call
  app: '{{reg_ctx}}'
  method: set_tag
  args:
    key: launch
    name: Launch
    color: '#ff0000'
  account: tags-node-1
  as_key: '{{alice_key}}'
- name: Bob lists tags
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-2
  as_key: '{{bob_key}}'
  outputs:
    tags_launch_bob: result
- name: Assert Bob sees Alice's tag
  type: json_assert
  statements:
  - 'json_subset({{tags_launch_bob}}, [{"key": "launch", "name": "Launch", "color": "#ff0000", "deleted":
    false}])'
- name: Bob renames tag launch
  type: call
  app: '{{reg_ctx}}'
  method: set_tag
  args:
    key: launch
    name: Launch v2
    color: '#ff0000'
  account: tags-node-2
  as_key: '{{bob_key}}'
- name: Alice lists tags
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-1
  as_key: '{{alice_key}}'
  outputs:
    tags_renamed_alice: result
- name: Assert Alice sees Bob's rename
  type: json_assert
  statements:
  - 'json_subset({{tags_renamed_alice}}, [{"key": "launch", "name": "Launch v2", "color": "#ff0000", "deleted":
    false}])'
- name: Alice deletes tag launch
  type: call
  app: '{{reg_ctx}}'
  method: delete_tag
  args:
    key: launch
  account: tags-node-1
  as_key: '{{alice_key}}'
- name: Alice lists tags after the delete
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-1
  as_key: '{{alice_key}}'
  outputs:
    tags_deleted_alice: result
- name: Bob lists tags after the delete
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-2
  as_key: '{{bob_key}}'
  outputs:
    tags_deleted_bob: result
- name: Assert both nodes keep the deleted row
  type: json_assert
  statements:
  - 'json_subset({{tags_deleted_alice}}, [{"key": "launch", "name": "Launch v2", "color": "#ff0000", "deleted":
    true}])'
  - 'json_subset({{tags_deleted_bob}}, [{"key": "launch", "name": "Launch v2", "color": "#ff0000", "deleted":
    true}])'
- name: Alice creates tag roadmap
  type: call
  app: '{{reg_ctx}}'
  method: set_tag
  args:
    key: roadmap
    name: Roadmap
    color: '#ffaa00'
  account: tags-node-1
  as_key: '{{alice_key}}'
- name: Bob lists tags before the partition
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-2
  as_key: '{{bob_key}}'
  outputs:
    tags_roadmap_bob: result
- name: Assert Bob sees tag roadmap live
  type: json_assert
  statements:
  - 'json_subset({{tags_roadmap_bob}}, [{"key": "roadmap", "name": "Roadmap", "color": "#ffaa00", "deleted":
    false}])'
- name: Alice deletes tag roadmap while Bob is offline
  type: call
  app: '{{reg_ctx}}'
  method: delete_tag
  args:
    key: roadmap
  account: tags-node-1
  as_key: '{{alice_key}}'
  allow_failure: true
- name: Bob lists tags without Alice's delete
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-2
  as_key: '{{bob_key}}'
  outputs:
    tags_roadmap_bob_offline: result
  allow_failure: true
- name: Bob renames and recolours tag roadmap while Alice is offline
  type: call
  app: '{{reg_ctx}}'
  method: set_tag
  args:
    key: roadmap
    name: Roadmap v2
    color: '#8844cc'
  account: tags-node-2
  as_key: '{{bob_key}}'
  allow_failure: true
- name: Wait for the nodes to find each other again
  type: wait
  seconds: 1.0
- name: Alice lists tags after the race
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-1
  as_key: '{{alice_key}}'
  outputs:
    tags_race_alice: result
- name: Bob lists tags after the race
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-2
  as_key: '{{bob_key}}'
  outputs:
    tags_race_bob: result
- name: Assert both nodes keep roadmap deleted with Bob's name and colour
  type: json_assert
  statements:
  - 'json_subset({{tags_race_alice}}, [{"key": "roadmap", "name": "Roadmap v2", "color": "#8844cc", "deleted":
    true}])'
  - 'json_subset({{tags_race_bob}}, [{"key": "roadmap", "name": "Roadmap v2", "color": "#8844cc", "deleted":
    true}])'
- name: Reject set_tag with an uppercase key
  type: call
  app: '{{reg_ctx}}'
  method: set_tag
  args:
    key: Probe
    name: Probe
    color: '#ff0000'
  account: tags-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Reject set_tag with an empty name
  type: call
  app: '{{reg_ctx}}'
  method: set_tag
  args:
    key: probe
    name: '   '
    color: '#ff0000'
  account: tags-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Reject set_tag with a named colour
  type: call
  app: '{{reg_ctx}}'
  method: set_tag
  args:
    key: probe
    name: Probe
    color: red
  account: tags-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Reject set_tag on the deleted key launch
  type: call
  app: '{{reg_ctx}}'
  method: set_tag
  args:
    key: launch
    name: Launch v3
    color: '#00ff00'
  account: tags-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Reject delete_tag on a key never set
  type: call
  app: '{{reg_ctx}}'
  method: delete_tag
  args:
    key: ghost
  account: tags-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Alice lists tags after the rejections
  type: call
  app: '{{reg_ctx}}'
  method: list_tags
  args: {}
  account: tags-node-1
  as_key: '{{alice_key}}'
  outputs:
    tags_after_rejects: result
- name: Assert no rejected tag was written
  type: assert
  statements:
  - not_contains({{tags_after_rejects}}, probe)
  - not_contains({{tags_after_rejects}}, Probe)
  - not_contains({{tags_after_rejects}}, ghost)
- name: Assert launch is still deleted and unchanged
  type: json_assert
  statements:
  - 'json_subset({{tags_after_rejects}}, [{"key": "launch", "name": "Launch v2", "color": "#ff0000", "deleted":
    true}])'
- name: Alice saves a view
  type: call
  app: '{{reg_ctx}}'
  method: save_view
  args:
    id: v-launch
    name: Launch docs
    query: tag:launch
  account: tags-node-1
  as_key: '{{alice_key}}'
- name: Bob lists views
  type: call
  app: '{{reg_ctx}}'
  method: list_views
  args: {}
  account: tags-node-2
  as_key: '{{bob_key}}'
  outputs:
    views_bob: result
- name: Assert Bob sees Alice's view, created by Alice
  type: json_assert
  statements:
  - 'json_equal({{views_bob}}, [{"id": "v-launch", "name": "Launch docs", "query": "tag:launch", "created_by":
    "{{alice_hex}}"}])'
- name: Bob renames the view and changes its query
  type: call
  app: '{{reg_ctx}}'
  method: save_view
  args:
    id: v-launch
    name: Launch work
    query: tag:launch tag:q3-plan
  account: tags-node-2
  as_key: '{{bob_key}}'
- name: Alice lists views
  type: call
  app: '{{reg_ctx}}'
  method: list_views
  args: {}
  account: tags-node-1
  as_key: '{{alice_key}}'
  outputs:
    views_alice: result
- name: Assert Alice sees Bob's edit and is still the creator
  type: json_assert
  statements:
  - 'json_equal({{views_alice}}, [{"id": "v-launch", "name": "Launch work", "query": "tag:launch tag:q3-plan",
    "created_by": "{{alice_hex}}"}])'
- name: Bob deletes the view
  type: call
  app: '{{reg_ctx}}'
  method: delete_view
  args:
    id: v-launch
  account: tags-node-2
  as_key: '{{bob_key}}'
- name: Alice lists views after the delete
  type: call
  app: '{{reg_ctx}}'
  method: list_views
  args: {}
  account: tags-node-1
  as_key: '{{alice_key}}'
  outputs:
    views_deleted_alice: rpc
- name: Assert the view is gone on Alice's node
  type: json_assert
  statements:
  - 'json_equal({{views_deleted_alice}}, {"output": []})'
- name: Reject save_view with a space in the id
  type: call
  app: '{{reg_ctx}}'
  method: save_view
  args:
    id: probe view
    name: Probe
    query: ''
  account: tags-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Reject save_view with an empty name
  type: call
  app: '{{reg_ctx}}'
  method: save_view
  args:
    id: probe-view
    name: '   '
    query: ''
  account: tags-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Reject save_view with a query over 1000 characters
  type: call
  app: '{{reg_ctx}}'
  method: save_view
  args:
    id: probe-view
    name: Probe
    query: 
  account: tags-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Reject delete_view on an unknown id
  type: call
  app: '{{reg_ctx}}'
  method: delete_view
  args:
    id: v-launch
  account: tags-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Alice lists views after the rejections
  type: call
  app: '{{reg_ctx}}'
  method: list_views
  args: {}
  account: tags-node-1
  as_key: '{{alice_key}}'
  outputs:
    views_after_rejects: rpc
- name: Assert no rejected view was written
  type: json_assert
  statements:
  - 'json_equal({{views_after_rejects}}, {"output": []})'
