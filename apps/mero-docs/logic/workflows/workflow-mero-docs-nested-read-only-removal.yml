name: Mero Docs - folder removal and restore across nested folders
description: >
  Removed from Open G, Bob is also removed from its Open child G2: he cannot
  rejoin by inheritance, and Alice's Restore (an admin add) lets him back.
  Restoring him to F does not let him into HB2, an Open folder inside
  Restricted HB he is not in. In Restricted F2, Read only and back leaves a
  direct row in its Open sub-folder G4, which a removal from F2 must clear.

e2e_mode: true

nodes:
  count: 2
  mdns: true
  image: ghcr.io/calimero-network/merod:0.11.0-rc.81
  prefix: curn-node
  base_port: 4040
  base_rpc_port: 4044

steps:
  - name: Install the bundle on Alice
    type: install_application
    node: curn-node-1
    path: dist/com.calimero.mero-drive-docs.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Install the bundle on Bob
    type: install_application
    node: curn-node-2
    path: dist/com.calimero.mero-drive-docs.mpk
    dev: true

  - name: Settle before the first admin call
    type: wait
    seconds: 5

  - name: Alice creates the namespace
    type: create_namespace
    node: curn-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Alice creates the Registry context
    type: create_context
    node: curn-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    service_name: registry
    outputs:
      reg_ctx: contextId
      alice_key: memberPublicKey

  - name: Alice creates folder F
    type: create_group_in_namespace
    node: curn-node-1
    namespace_id: '{{namespace_id}}'
    group_name: f
    outputs:
      g_F: groupId

  - name: Mark F Open
    type: set_subgroup_visibility
    node: curn-node-1
    group_id: '{{g_F}}'
    visibility: Open

  - name: Register F
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{g_F}}'
      parent_id: null
      color: null
      alias: F

  - name: Alice creates F's Docs context
    type: create_context
    node: curn-node-1
    application_id: '{{app_id}}'
    group_id: '{{g_F}}'
    service_name: docs
    outputs:
      c_F: contextId
      a_F: memberPublicKey

  - name: Bind F
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: bind_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_F}}'
      context_id: '{{c_F}}'

  - name: Alice creates a doc in F
    type: call
    node: curn-node-1
    context_id: '{{c_F}}'
    method: create_doc
    executor_public_key: '{{a_F}}'
    args:
      title: F original
    outputs:
      d_F: result.output

  - name: Alice creates folder G
    type: create_group_in_namespace
    node: curn-node-1
    namespace_id: '{{namespace_id}}'
    group_name: g
    outputs:
      g_G: groupId

  - name: Nest G under F
    type: reparent_group
    node: curn-node-1
    child_group_id: '{{g_G}}'
    new_parent_id: '{{g_F}}'

  - name: Mark G Open
    type: set_subgroup_visibility
    node: curn-node-1
    group_id: '{{g_G}}'
    visibility: Open

  - name: Register G
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{g_G}}'
      parent_id: '{{g_F}}'
      color: null
      alias: G

  - name: Alice creates G's Docs context
    type: create_context
    node: curn-node-1
    application_id: '{{app_id}}'
    group_id: '{{g_G}}'
    service_name: docs
    outputs:
      c_G: contextId
      a_G: memberPublicKey

  - name: Bind G
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: bind_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_G}}'
      context_id: '{{c_G}}'

  - name: Alice creates a doc in G
    type: call
    node: curn-node-1
    context_id: '{{c_G}}'
    method: create_doc
    executor_public_key: '{{a_G}}'
    args:
      title: G original
    outputs:
      d_G: result.output

  - name: Alice creates folder G2
    type: create_group_in_namespace
    node: curn-node-1
    namespace_id: '{{namespace_id}}'
    group_name: g2
    outputs:
      g_G2: groupId

  - name: Nest G2 under G
    type: reparent_group
    node: curn-node-1
    child_group_id: '{{g_G2}}'
    new_parent_id: '{{g_G}}'

  - name: Mark G2 Open
    type: set_subgroup_visibility
    node: curn-node-1
    group_id: '{{g_G2}}'
    visibility: Open

  - name: Register G2
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{g_G2}}'
      parent_id: '{{g_G}}'
      color: null
      alias: G2

  - name: Alice creates G2's Docs context
    type: create_context
    node: curn-node-1
    application_id: '{{app_id}}'
    group_id: '{{g_G2}}'
    service_name: docs
    outputs:
      c_G2: contextId
      a_G2: memberPublicKey

  - name: Bind G2
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: bind_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_G2}}'
      context_id: '{{c_G2}}'

  - name: Alice creates a doc in G2
    type: call
    node: curn-node-1
    context_id: '{{c_G2}}'
    method: create_doc
    executor_public_key: '{{a_G2}}'
    args:
      title: G2 original
    outputs:
      d_G2: result.output

  - name: Alice creates folder HB
    type: create_group_in_namespace
    node: curn-node-1
    namespace_id: '{{namespace_id}}'
    group_name: hb
    outputs:
      g_HB: groupId

  - name: Nest HB under F
    type: reparent_group
    node: curn-node-1
    child_group_id: '{{g_HB}}'
    new_parent_id: '{{g_F}}'

  - name: Mark HB Restricted
    type: set_subgroup_visibility
    node: curn-node-1
    group_id: '{{g_HB}}'
    visibility: Restricted

  - name: Register HB
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{g_HB}}'
      parent_id: '{{g_F}}'
      color: null
      alias: HB

  - name: Alice creates HB's Docs context
    type: create_context
    node: curn-node-1
    application_id: '{{app_id}}'
    group_id: '{{g_HB}}'
    service_name: docs
    outputs:
      c_HB: contextId
      a_HB: memberPublicKey

  - name: Bind HB
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: bind_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_HB}}'
      context_id: '{{c_HB}}'

  - name: Alice creates a doc in HB
    type: call
    node: curn-node-1
    context_id: '{{c_HB}}'
    method: create_doc
    executor_public_key: '{{a_HB}}'
    args:
      title: HB original
    outputs:
      d_HB: result.output

  - name: Alice creates folder HB2
    type: create_group_in_namespace
    node: curn-node-1
    namespace_id: '{{namespace_id}}'
    group_name: hb2
    outputs:
      g_HB2: groupId

  - name: Nest HB2 under HB
    type: reparent_group
    node: curn-node-1
    child_group_id: '{{g_HB2}}'
    new_parent_id: '{{g_HB}}'

  - name: Mark HB2 Open
    type: set_subgroup_visibility
    node: curn-node-1
    group_id: '{{g_HB2}}'
    visibility: Open

  - name: Register HB2
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{g_HB2}}'
      parent_id: '{{g_HB}}'
      color: null
      alias: HB2

  - name: Alice creates HB2's Docs context
    type: create_context
    node: curn-node-1
    application_id: '{{app_id}}'
    group_id: '{{g_HB2}}'
    service_name: docs
    outputs:
      c_HB2: contextId
      a_HB2: memberPublicKey

  - name: Bind HB2
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: bind_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_HB2}}'
      context_id: '{{c_HB2}}'

  - name: Alice creates a doc in HB2
    type: call
    node: curn-node-1
    context_id: '{{c_HB2}}'
    method: create_doc
    executor_public_key: '{{a_HB2}}'
    args:
      title: HB2 original
    outputs:
      d_HB2: result.output

  - name: Alice creates folder F2
    type: create_group_in_namespace
    node: curn-node-1
    namespace_id: '{{namespace_id}}'
    group_name: f2
    outputs:
      g_F2: groupId

  - name: Mark F2 Restricted
    type: set_subgroup_visibility
    node: curn-node-1
    group_id: '{{g_F2}}'
    visibility: Restricted

  - name: Register F2
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{g_F2}}'
      parent_id: null
      color: null
      alias: F2

  - name: Alice creates F2's Docs context
    type: create_context
    node: curn-node-1
    application_id: '{{app_id}}'
    group_id: '{{g_F2}}'
    service_name: docs
    outputs:
      c_F2: contextId
      a_F2: memberPublicKey

  - name: Bind F2
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: bind_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_F2}}'
      context_id: '{{c_F2}}'

  - name: Alice creates a doc in F2
    type: call
    node: curn-node-1
    context_id: '{{c_F2}}'
    method: create_doc
    executor_public_key: '{{a_F2}}'
    args:
      title: F2 original
    outputs:
      d_F2: result.output

  - name: Alice creates folder G4
    type: create_group_in_namespace
    node: curn-node-1
    namespace_id: '{{namespace_id}}'
    group_name: g4
    outputs:
      g_G4: groupId

  - name: Nest G4 under F2
    type: reparent_group
    node: curn-node-1
    child_group_id: '{{g_G4}}'
    new_parent_id: '{{g_F2}}'

  - name: Mark G4 Open
    type: set_subgroup_visibility
    node: curn-node-1
    group_id: '{{g_G4}}'
    visibility: Open

  - name: Register G4
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{g_G4}}'
      parent_id: '{{g_F2}}'
      color: null
      alias: G4

  - name: Alice creates G4's Docs context
    type: create_context
    node: curn-node-1
    application_id: '{{app_id}}'
    group_id: '{{g_G4}}'
    service_name: docs
    outputs:
      c_G4: contextId
      a_G4: memberPublicKey

  - name: Bind G4
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: bind_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_G4}}'
      context_id: '{{c_G4}}'

  - name: Alice creates a doc in G4
    type: call
    node: curn-node-1
    context_id: '{{c_G4}}'
    method: create_doc
    executor_public_key: '{{a_G4}}'
    args:
      title: G4 original
    outputs:
      d_G4: result.output

  - name: Alice invites Bob to the namespace
    type: create_namespace_invitation
    node: curn-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      ns_invite: invitation

  - name: Settle before Bob joins the namespace
    type: wait
    seconds: 10

  - name: Bob joins the namespace
    type: join_namespace
    node: curn-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{ns_invite}}'
    outputs:
      bob_account: memberAccount

  - name: Sync the namespace to Bob
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    group_id: '{{namespace_id}}'
    timeout: 45

  - name: Wait until Bob's node sees F Open
    type: assert_api_response
    node: curn-node-2
    path: /admin-api/groups/{{g_F}}
    match:
      data.subgroupVisibility: open
    retries: 60
    interval: 1

  - name: Bob joins F by inheritance
    type: join_subgroup_inheritance
    node: curn-node-2
    group_id: '{{g_F}}'

  - name: Bob joins F's Docs context
    type: join_context
    node: curn-node-2
    context_id: '{{c_F}}'
    outputs:
      b_F: memberPublicKey

  - name: Wait until Bob's node sees G Open
    type: assert_api_response
    node: curn-node-2
    path: /admin-api/groups/{{g_G}}
    match:
      data.subgroupVisibility: open
    retries: 60
    interval: 1

  - name: Bob joins G by inheritance
    type: join_subgroup_inheritance
    node: curn-node-2
    group_id: '{{g_G}}'

  - name: Bob joins G's Docs context
    type: join_context
    node: curn-node-2
    context_id: '{{c_G}}'
    outputs:
      b_G: memberPublicKey

  - name: Wait until Bob's node sees G2 Open
    type: assert_api_response
    node: curn-node-2
    path: /admin-api/groups/{{g_G2}}
    match:
      data.subgroupVisibility: open
    retries: 60
    interval: 1

  - name: Bob joins G2 by inheritance
    type: join_subgroup_inheritance
    node: curn-node-2
    group_id: '{{g_G2}}'

  - name: Bob joins G2's Docs context
    type: join_context
    node: curn-node-2
    context_id: '{{c_G2}}'
    outputs:
      b_G2: memberPublicKey

  - name: Alice removes Bob from G
    type: remove_group_members
    node: curn-node-1
    group_id: '{{g_G}}'
    members:
      - '{{bob_account}}'

  - name: Alice removes Bob from G2, the Open sub-folder of G, as the app does
    type: remove_group_members
    node: curn-node-1
    group_id: '{{g_G2}}'
    members:
      - '{{bob_account}}'

  - name: Sync G's removal to Bob
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    group_id: '{{g_G}}'
    timeout: 45

  - name: Sync G2's removal to Bob
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    group_id: '{{g_G2}}'
    timeout: 45

  - name: Bob tries to rejoin G by inheritance
    type: join_subgroup_inheritance
    node: curn-node-2
    group_id: '{{g_G}}'
    expected_failure: true

  - name: Bob renames the G doc to 'G after removal'
    type: call
    node: curn-node-2
    context_id: '{{c_G}}'
    method: edit_doc
    executor_public_key: '{{b_G}}'
    args:
      id: '{{d_G}}'
      title: G after removal
    allow_failure: true

  - name: Bob renames the G2 doc to 'G2 after removal'
    type: call
    node: curn-node-2
    context_id: '{{c_G2}}'
    method: edit_doc
    executor_public_key: '{{b_G2}}'
    args:
      id: '{{d_G2}}'
      title: G2 after removal
    allow_failure: true

  - name: Give a removed member's writes time to sync
    type: wait
    seconds: 5

  - name: Alice reads the G doc (g_removed)
    type: call
    node: curn-node-1
    context_id: '{{c_G}}'
    method: get_doc
    executor_public_key: '{{a_G}}'
    args:
      id: '{{d_G}}'
    outputs:
      g_removed: result.output.title

  - name: Alice reads the G2 doc (g2_removed)
    type: call
    node: curn-node-1
    context_id: '{{c_G2}}'
    method: get_doc
    executor_public_key: '{{a_G2}}'
    args:
      id: '{{d_G2}}'
    outputs:
      g2_removed: result.output.title

  - name: Removed from G, Bob writes in neither G nor G2
    type: json_assert
    statements:
      - 'json_equal({{g_removed}}, "G original")'
      - 'json_equal({{g2_removed}}, "G2 original")'

  - name: Alice restores Bob to G
    type: add_group_members
    node: curn-node-1
    group_id: '{{g_G}}'
    members:
      - identity: '{{bob_account}}'
        role: Member

  - name: Sync G's restore to Bob
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    group_id: '{{g_G}}'
    timeout: 45

  - name: Bob renames the G doc to 'G after restore'
    type: call
    node: curn-node-2
    context_id: '{{c_G}}'
    method: edit_doc
    executor_public_key: '{{b_G}}'
    args:
      id: '{{d_G}}'
      title: G after restore

  - name: Sync G after the restore
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    context_id: '{{c_G}}'
    timeout: 45

  - name: Alice reads the G doc (g_restored)
    type: call
    node: curn-node-1
    context_id: '{{c_G}}'
    method: get_doc
    executor_public_key: '{{a_G}}'
    args:
      id: '{{d_G}}'
    outputs:
      g_restored: result.output.title

  - name: Restore lets Bob back into G
    type: json_assert
    statements:
      - 'json_equal({{g_restored}}, "G after restore")'

  - name: Alice removes Bob from F
    type: remove_group_members
    node: curn-node-1
    group_id: '{{g_F}}'
    members:
      - '{{bob_account}}'

  - name: Alice removes Bob from G, reached through F, as the app does
    type: remove_group_members
    node: curn-node-1
    group_id: '{{g_G}}'
    members:
      - '{{bob_account}}'

  - name: Alice restores Bob to F
    type: add_group_members
    node: curn-node-1
    group_id: '{{g_F}}'
    members:
      - identity: '{{bob_account}}'
        role: Member

  - name: Sync F's restore to Bob
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    group_id: '{{g_F}}'
    timeout: 45

  - name: HB2 does not list Bob
    type: assert_api_response
    node: curn-node-1
    path: /admin-api/groups/{{g_HB2}}/members
    where:
      identity: '{{bob_account}}'
    expect_no_match: true

  - name: Alice adds Bob to F2
    type: add_group_members
    node: curn-node-1
    group_id: '{{g_F2}}'
    members:
      - identity: '{{bob_account}}'
        role: Member

  - name: Alice keeps Bob's join bit in F2
    type: set_member_capabilities
    node: curn-node-1
    group_id: '{{g_F2}}'
    member_id: '{{bob_account}}'
    capabilities: 4

  - name: Sync the namespace to Bob after the F2 add
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    group_id: '{{namespace_id}}'
    timeout: 45

  - name: Sync F2's membership to Bob
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    group_id: '{{g_F2}}'
    timeout: 45

  - name: Bob joins F2's Docs context
    type: join_context
    node: curn-node-2
    context_id: '{{c_F2}}'
    outputs:
      b_F2: memberPublicKey

  - name: Wait until Bob's node sees G4 Open
    type: assert_api_response
    node: curn-node-2
    path: /admin-api/groups/{{g_G4}}
    match:
      data.subgroupVisibility: open
    retries: 60
    interval: 1

  - name: Bob joins G4 by inheritance
    type: join_subgroup_inheritance
    node: curn-node-2
    group_id: '{{g_G4}}'

  - name: Bob joins G4's Docs context
    type: join_context
    node: curn-node-2
    context_id: '{{c_G4}}'
    outputs:
      b_G4: memberPublicKey

  - name: Alice makes Bob core ReadOnly in F2
    type: update_member_role
    node: curn-node-1
    group_id: '{{g_F2}}'
    member_id: '{{bob_account}}'
    role: ReadOnly

  - name: Alice keeps Bob's join bit in F2
    type: set_member_capabilities
    node: curn-node-1
    group_id: '{{g_F2}}'
    member_id: '{{bob_account}}'
    capabilities: 4

  - name: Alice sets Bob's registry role in F2 to Viewer
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: set_folder_role
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_F2}}'
      member: '{{bob_account}}'
      role: Viewer

  - name: Alice adds a direct ReadOnly row for Bob in G4
    type: add_group_members
    node: curn-node-1
    group_id: '{{g_G4}}'
    members:
      - identity: '{{bob_account}}'
        role: ReadOnly

  - name: Alice keeps Bob's join bit in G4
    type: set_member_capabilities
    node: curn-node-1
    group_id: '{{g_G4}}'
    member_id: '{{bob_account}}'
    capabilities: 4

  - name: Alice sets Bob's registry role in G4 to Viewer
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: set_folder_role
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_G4}}'
      member: '{{bob_account}}'
      role: Viewer

  - name: Alice makes Bob core Member in F2 again
    type: update_member_role
    node: curn-node-1
    group_id: '{{g_F2}}'
    member_id: '{{bob_account}}'
    role: Member

  - name: Alice sets Bob's registry role in F2 to Editor
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: set_folder_role
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_F2}}'
      member: '{{bob_account}}'
      role: Editor

  - name: Alice makes Bob core Member in G4 again
    type: update_member_role
    node: curn-node-1
    group_id: '{{g_G4}}'
    member_id: '{{bob_account}}'
    role: Member

  - name: Alice sets Bob's registry role in G4 to Editor
    type: call
    node: curn-node-1
    context_id: '{{reg_ctx}}'
    method: set_folder_role
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{g_G4}}'
      member: '{{bob_account}}'
      role: Editor

  - name: Sync F2's roles to Bob
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    group_id: '{{g_F2}}'
    timeout: 45

  - name: Sync G4's roles to Bob
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    group_id: '{{g_G4}}'
    timeout: 45

  - name: Bob renames the G4 doc to 'G4 as an Editor'
    type: call
    node: curn-node-2
    context_id: '{{c_G4}}'
    method: edit_doc
    executor_public_key: '{{b_G4}}'
    args:
      id: '{{d_G4}}'
      title: G4 as an Editor

  - name: Sync G4 after Bob's write
    type: wait_for_sync
    nodes: [curn-node-1, curn-node-2]
    context_id: '{{c_G4}}'
    timeout: 45

  - name: Alice reads the G4 doc (g4_editor)
    type: call
    node: curn-node-1
    context_id: '{{c_G4}}'
    method: get_doc
    executor_public_key: '{{a_G4}}'
    args:
      id: '{{d_G4}}'
    outputs:
      g4_editor: result.output.title

  - name: Back to Editor, Bob writes in G4
    type: json_assert
    statements:
      - 'json_equal({{g4_editor}}, "G4 as an Editor")'

  - name: Alice removes Bob from F2
    type: remove_group_members
    node: curn-node-1
    group_id: '{{g_F2}}'
    members:
      - '{{bob_account}}'

  - name: Alice removes Bob from G4, his direct row, as the app does after a removal from F2
    type: remove_group_members
    node: curn-node-1
    group_id: '{{g_G4}}'
    members:
      - '{{bob_account}}'

  - name: Let the removal from F2 reach Bob
    type: wait
    seconds: 5

  - name: Bob renames the G4 doc to 'G4 after removal from F2'
    type: call
    node: curn-node-2
    context_id: '{{c_G4}}'
    method: edit_doc
    executor_public_key: '{{b_G4}}'
    args:
      id: '{{d_G4}}'
      title: G4 after removal from F2
    allow_failure: true

  - name: Give a removed member's write time to sync
    type: wait
    seconds: 5

  - name: Alice reads the G4 doc (g4_removed)
    type: call
    node: curn-node-1
    context_id: '{{c_G4}}'
    method: get_doc
    executor_public_key: '{{a_G4}}'
    args:
      id: '{{d_G4}}'
    outputs:
      g4_removed: result.output.title

  - name: Removed from F2, Bob writes no more in its Open sub-folder G4
    type: json_assert
    statements:
      - 'json_equal({{g4_removed}}, "G4 as an Editor")'

stop_all_nodes: false
