# Ported from the v1 workflow workflow-mero-docs-nested-read-only-sweep.yml (`merobox cloud port`).
# v1 nodes are accounts here.
# Dropped (no release-v2 counterpart):
#   assert_api_response x2: v1 admin API
#   wait_for_sync x6: replication is synchronous: a read sees every committed write
name: Mero Docs - workspace removal sweeps nested folder rows
description: 'After Read only and back, Bob holds direct rows in Open F and G and in Restricted H. A workspace
  removal plus the app''s parents-first sweep of his direct rows leaves him unable to write anywhere.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3290
accounts:
- curn-node-1
- curn-node-2
steps:
- name: Install the bundle on Alice
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  outputs:
    app_id_bundle: hash
  account: curn-node-1
- type: set
  values:
    app_id: com.calimero.mero-drive-docs
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Alice creates the namespace
  type: create_org
  org_name: Alice creates the namespace
  outputs:
    namespace_id: orgId
  account: curn-node-1
- name: Alice creates the Registry context (workspace-level data only; folders live in core)
  type: deploy
  account: curn-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs_registry.wasm'
  app_name: registry
  org: '{{namespace_id}}'
  outputs:
    reg_ctx: contextId
    alice_key: memberPublicKey
- name: Alice creates folder F
  type: create_team
  org: '{{namespace_id}}'
  team_name: f
  join: invite
  outputs:
    g_F: teamId
  account: curn-node-1
- name: Mark F Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{g_F}}'
  join: everyone
  account: curn-node-1
- name: Name F in its subgroup metadata
  type: team_update
  org: '{{namespace_id}}'
  team: '{{g_F}}'
  metadata:
    name: F
    data: {}
  account: curn-node-1
- name: Alice creates F's Docs context
  type: deploy
  account: curn-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{g_F}}'
  outputs:
    c_F: contextId
    a_F: memberPublicKey
- name: Alice creates a doc in F
  type: call
  app: '{{c_F}}'
  method: create_doc
  args:
    title: F original
  account: curn-node-1
  as_key: '{{a_F}}'
  outputs:
    d_F: result
- name: Alice creates folder G
  type: create_team
  org: '{{namespace_id}}'
  team_name: g
  join: invite
  outputs:
    g_G: teamId
  account: curn-node-1
- name: Nest G under F
  type: team_update
  org: '{{namespace_id}}'
  team: '{{g_G}}'
  parent: '{{g_F}}'
  account: curn-node-1
- name: Mark G Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{g_G}}'
  join: everyone
  account: curn-node-1
- name: Name G in its subgroup metadata
  type: team_update
  org: '{{namespace_id}}'
  team: '{{g_G}}'
  metadata:
    name: G
    data: {}
  account: curn-node-1
- name: Alice creates G's Docs context
  type: deploy
  account: curn-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{g_G}}'
  outputs:
    c_G: contextId
    a_G: memberPublicKey
- name: Alice creates a doc in G
  type: call
  app: '{{c_G}}'
  method: create_doc
  args:
    title: G original
  account: curn-node-1
  as_key: '{{a_G}}'
  outputs:
    d_G: result
- name: Alice creates folder H
  type: create_team
  org: '{{namespace_id}}'
  team_name: h
  join: invite
  outputs:
    g_H: teamId
  account: curn-node-1
- name: Nest H under F
  type: team_update
  org: '{{namespace_id}}'
  team: '{{g_H}}'
  parent: '{{g_F}}'
  account: curn-node-1
- name: Mark H Restricted
  type: team_update
  org: '{{namespace_id}}'
  team: '{{g_H}}'
  join: invite
  account: curn-node-1
- name: Name H in its subgroup metadata
  type: team_update
  org: '{{namespace_id}}'
  team: '{{g_H}}'
  metadata:
    name: H
    data: {}
  account: curn-node-1
- name: Alice creates H's Docs context
  type: deploy
  account: curn-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{g_H}}'
  outputs:
    c_H: contextId
    a_H: memberPublicKey
- name: Alice creates a doc in H
  type: call
  app: '{{c_H}}'
  method: create_doc
  args:
    title: H original
  account: curn-node-1
  as_key: '{{a_H}}'
  outputs:
    d_H: result
- name: Alice invites Bob to the namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: curn-node-1
  outputs:
    ns_invite: token
- name: Settle before Bob joins the namespace
  type: wait
  seconds: 1.0
- name: Bob joins the namespace
  type: redeem_invite
  token: '{{ns_invite}}'
  account: curn-node-2
- type: whoami
  account: curn-node-2
  outputs:
    bob_account: publicKey
- name: Bob joins F by inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{g_F}}'
  account: curn-node-2
- name: Bob joins F's Docs context
  type: whoami
  account: curn-node-2
  outputs:
    b_F: publicKey
- name: Bob joins G by inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{g_G}}'
  account: curn-node-2
- name: Bob joins G's Docs context
  type: whoami
  account: curn-node-2
  outputs:
    b_G: publicKey
- name: Alice adds Bob to H
  type: team_add
  org: '{{namespace_id}}'
  team: '{{g_H}}'
  members:
  - '{{bob_account}}'
  role: member
  account: curn-node-1
- name: Alice keeps Bob's join bit in H
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 4
  account: curn-node-1
  member: '{{bob_account}}'
  team: '{{g_H}}'
- name: Bob joins H's Docs context
  type: whoami
  account: curn-node-2
  outputs:
    b_H: publicKey
- name: Alice adds a direct ReadOnly row for Bob in F
  type: team_add
  org: '{{namespace_id}}'
  team: '{{g_F}}'
  members:
  - '{{bob_account}}'
  role: readOnly
  account: curn-node-1
- name: Alice keeps Bob's join bit in F
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 4
  account: curn-node-1
  member: '{{bob_account}}'
  team: '{{g_F}}'
- name: Alice adds a direct ReadOnly row for Bob in G
  type: team_add
  org: '{{namespace_id}}'
  team: '{{g_G}}'
  members:
  - '{{bob_account}}'
  role: readOnly
  account: curn-node-1
- name: Alice keeps Bob's join bit in G
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 4
  account: curn-node-1
  member: '{{bob_account}}'
  team: '{{g_G}}'
- name: Alice makes Bob core Member in F again
  type: team_add
  org: '{{namespace_id}}'
  team: '{{g_F}}'
  members:
  - '{{bob_account}}'
  role: member
  account: curn-node-1
- name: Alice makes Bob core Member in G again
  type: team_add
  org: '{{namespace_id}}'
  team: '{{g_G}}'
  members:
  - '{{bob_account}}'
  role: member
  account: curn-node-1
- name: Bob renames the G doc to 'G restored'
  type: call
  app: '{{c_G}}'
  method: edit_doc
  args:
    id: '{{d_G}}'
    title: G restored
  account: curn-node-2
  as_key: '{{b_G}}'
- name: Alice reads the G doc (g_back)
  type: call
  app: '{{c_G}}'
  method: get_doc
  args:
    id: '{{d_G}}'
  account: curn-node-1
  as_key: '{{a_G}}'
  outputs:
    g_back: result.title
- name: Bob writes in G before the removal
  type: json_assert
  statements:
  - json_equal({{g_back}}, "G restored")
- name: Alice removes Bob from the workspace
  type: remove_member
  org: '{{namespace_id}}'
  member: '{{bob_account}}'
  account: curn-node-1
- name: Alice removes Bob from F's direct row, as the sweep does (parents first)
  type: team_remove
  org: '{{namespace_id}}'
  team: '{{g_F}}'
  members:
  - '{{bob_account}}'
  account: curn-node-1
- name: Alice removes Bob from G's direct row, as the sweep does (parents first)
  type: team_remove
  org: '{{namespace_id}}'
  team: '{{g_G}}'
  members:
  - '{{bob_account}}'
  account: curn-node-1
- name: Alice removes Bob from H's direct row, as the sweep does (parents first)
  type: team_remove
  org: '{{namespace_id}}'
  team: '{{g_H}}'
  members:
  - '{{bob_account}}'
  account: curn-node-1
- name: Let the workspace removal reach Bob
  type: wait
  seconds: 1.0
- name: Bob renames the F doc to 'F after workspace removal'
  type: call
  app: '{{c_F}}'
  method: edit_doc
  args:
    id: '{{d_F}}'
    title: F after workspace removal
  account: curn-node-2
  as_key: '{{b_F}}'
  allow_failure: true
- name: Bob renames the G doc to 'G after workspace removal'
  type: call
  app: '{{c_G}}'
  method: edit_doc
  args:
    id: '{{d_G}}'
    title: G after workspace removal
  account: curn-node-2
  as_key: '{{b_G}}'
  allow_failure: true
- name: Bob renames the H doc to 'H after workspace removal'
  type: call
  app: '{{c_H}}'
  method: edit_doc
  args:
    id: '{{d_H}}'
    title: H after workspace removal
  account: curn-node-2
  as_key: '{{b_H}}'
  allow_failure: true
- name: Give a removed member's writes time to sync
  type: wait
  seconds: 1.0
- name: Alice reads the F doc (f_gone)
  type: call
  app: '{{c_F}}'
  method: get_doc
  args:
    id: '{{d_F}}'
  account: curn-node-1
  as_key: '{{a_F}}'
  outputs:
    f_gone: result.title
- name: Alice reads the G doc (g_gone)
  type: call
  app: '{{c_G}}'
  method: get_doc
  args:
    id: '{{d_G}}'
  account: curn-node-1
  as_key: '{{a_G}}'
  outputs:
    g_gone: result.title
- name: Alice reads the H doc (h_gone)
  type: call
  app: '{{c_H}}'
  method: get_doc
  args:
    id: '{{d_H}}'
  account: curn-node-1
  as_key: '{{a_H}}'
  outputs:
    h_gone: result.title
- name: Removed from the workspace, Bob writes nowhere
  type: json_assert
  statements:
  - json_equal({{f_gone}}, "F original")
  - json_equal({{g_gone}}, "G restored")
  - json_equal({{h_gone}}, "H original")
