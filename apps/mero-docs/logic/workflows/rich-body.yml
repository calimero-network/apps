# Ported from the v1 workflow rich-body.yml (`merobox cloud port`).
# v1 nodes are accounts here.
# Dropped (no release-v2 counterpart):
#   assert_log_absent x1: v1 node logs
#   start_node x1: a user's node going offline has no counterpart in a cluster
#   stop_node x1: a user's node going offline has no counterpart in a cluster
#   wait_for_sync x4: replication is synchronous: a read sees every committed write
name: Mero Docs - Rich Title and Body
description: 'The document title (FugueText) and body (RichDocument) driven over JSON-RPC by three real
  nodes. Every body and title method is called here, and the two convergence cases edit DISJOINT positions
  so the converged value is one literal whichever order the deltas arrive in.

  The concurrent window runs with Node 3 stopped, so its catch-up is a real offline replay rather than
  a race: partition_peers is a no-op outside Docker.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3190
accounts:
- drive-node-1
- drive-node-2
- drive-node-3
steps:
- name: Install the bundle on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  outputs:
    app_id_bundle: hash
  account: drive-node-1
- type: set
  values:
    app_id: com.calimero.mero-drive-docs
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Alice creates the namespace
  type: create_org
  org_name: Alice creates the namespace
  outputs:
    namespace_id: orgId
  account: drive-node-1
- name: Alice creates the folder group
  type: create_team
  org: '{{namespace_id}}'
  team_name: notes
  join: invite
  outputs:
    notes_group: teamId
  account: drive-node-1
- name: Alice creates the docs context bound to the folder group
  type: deploy
  account: drive-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{notes_group}}'
  outputs:
    docs_ctx: contextId
    alice_key: memberPublicKey
- name: Create a namespace invitation for Bob
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: drive-node-1
  outputs:
    bob_invite: token
- name: Create a namespace invitation for Carol
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: drive-node-1
  outputs:
    carol_invite: token
- name: Wait for namespace gossip to reach the other nodes
  type: wait
  seconds: 1.0
- name: Bob joins the namespace
  type: redeem_invite
  token: '{{bob_invite}}'
  account: drive-node-2
- type: whoami
  account: drive-node-2
  outputs:
    bob_identity: publicKey
- name: Settle before Carol joins the namespace
  type: wait
  seconds: 1.0
- name: Carol joins the namespace
  type: redeem_invite
  token: '{{carol_invite}}'
  account: drive-node-3
- type: whoami
  account: drive-node-3
  outputs:
    carol_identity: publicKey
- name: Alice adds Bob and Carol to the folder group
  type: team_add
  org: '{{namespace_id}}'
  team: '{{notes_group}}'
  members:
  - '{{bob_identity}}'
  role: member
  account: drive-node-1
- name: Alice adds Bob and Carol to the folder group
  type: team_add
  org: '{{namespace_id}}'
  team: '{{notes_group}}'
  members:
  - '{{carol_identity}}'
  role: member
  account: drive-node-1
- name: Wait for folder subgroup membership to propagate
  type: wait
  seconds: 1.0
- name: Bob joins the docs context
  type: whoami
  account: drive-node-2
  outputs:
    bob_key: publicKey
- name: Carol joins the docs context
  type: whoami
  account: drive-node-3
  outputs:
    carol_key: publicKey
- name: Alice creates the title document
  type: call
  app: '{{docs_ctx}}'
  method: create_doc
  args:
    title: core
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    title_doc: result
- name: Alice creates the body document
  type: call
  app: '{{docs_ctx}}'
  method: create_doc
  args:
    title: Notes
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    body_doc: result
- name: The seeded title reads back
  type: call
  app: '{{docs_ctx}}'
  method: get_title
  args:
    doc: '{{title_doc}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    seeded_title: rpc
- name: Assert the seeded title
  type: json_assert
  statements:
  - 'json_equal({{seeded_title}}, {"output": "core"})'
- name: Alice types a suffix onto the title document
  type: call
  app: '{{docs_ctx}}'
  method: title_apply_delta
  args:
    doc: '{{title_doc}}'
    ops:
    - retain: 4
    - insert: ' draft'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    title_undo_token: result
- name: The suffix landed
  type: call
  app: '{{docs_ctx}}'
  method: get_title
  args:
    doc: '{{title_doc}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    title_after_suffix: rpc
- name: Assert the suffix
  type: json_assert
  statements:
  - 'json_equal({{title_after_suffix}}, {"output": "core draft"})'
- name: The title reads back with an id for each of its characters
  type: call
  app: '{{docs_ctx}}'
  method: get_title_state
  args:
    doc: '{{title_doc}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    title_state: rpc
    title_state_ids: result.ids
- name: Assert the title state
  type: json_assert
  statements:
  - 'json_subset({{title_state}}, {"output": {"text": "core draft"}})'
- name: Assert the title carries ids
  type: assert
  statements:
  - is_set({{title_state_ids}})
- name: Alice takes the suffix back
  type: call
  app: '{{docs_ctx}}'
  method: title_undo
  args:
    doc: '{{title_doc}}'
    token: '{{title_undo_token}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    title_redo_token: result
- name: Assert the undo restored the seeded title
  type: assert
  statements:
  - is_set({{title_redo_token}})
- name: A title write diffed against a stale base is refused
  type: call
  app: '{{docs_ctx}}'
  method: title_apply_delta_on
  args:
    doc: '{{title_doc}}'
    base: cor
    ops:
    - retain: 3
    - insert: X
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    refused_title: rpc
- name: Assert the refusal hands back the title unchanged
  type: json_assert
  statements:
  - 'json_subset({{refused_title}}, {"output": {"applied": false, "token": null, "text": "core", "anchor":
    null, "anchor_pos": null}})'
- name: A title write diffed against the current title applies
  type: call
  app: '{{docs_ctx}}'
  method: title_apply_delta_on
  args:
    doc: '{{title_doc}}'
    base: core
    ops:
    - retain: 4
    - insert: '!'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    guarded_title: rpc
    guarded_title_token: result.token
    guarded_title_anchor: result.anchor
- name: Assert the guarded title write landed, anchored after its last letter
  type: json_assert
  statements:
  - 'json_subset({{guarded_title}}, {"output": {"applied": true, "text": "core!", "anchor_pos": 5}})'
- name: A refused title write sent with that anchor
  type: call
  app: '{{docs_ctx}}'
  method: title_apply_delta_on
  args:
    doc: '{{title_doc}}'
    base: core
    ops:
    - retain: 4
    - insert: '?'
    anchor: '{{guarded_title_anchor}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    anchored_title: rpc
- name: Assert the refusal hands back where the anchor sits now
  type: json_assert
  statements:
  - 'json_subset({{anchored_title}}, {"output": {"applied": false, "token": null, "text": "core!", "anchor":
    "{{guarded_title_anchor}}", "anchor_pos": 5}})'
- name: Alice undoes the guarded title write
  type: call
  app: '{{docs_ctx}}'
  method: title_undo
  args:
    doc: '{{title_doc}}'
    token: '{{guarded_title_token}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Read the title after undoing the guarded write
  type: call
  app: '{{docs_ctx}}'
  method: get_title
  args:
    doc: '{{title_doc}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    guarded_title_undone: rpc
- name: Assert the title is back to the seed
  type: json_assert
  statements:
  - 'json_equal({{guarded_title_undone}}, {"output": "core"})'
- name: Alice anchors the gap before the third character of the title
  type: call
  app: '{{docs_ctx}}'
  method: title_anchor_at
  args:
    doc: '{{title_doc}}'
    position: 2
    before: true
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    title_anchor: result
- name: Resolve Alice's title anchor
  type: call
  app: '{{docs_ctx}}'
  method: title_resolve
  args:
    doc: '{{title_doc}}'
    anchors:
    - '{{title_anchor}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    title_positions: rpc
- name: Assert the title anchor resolves where it was placed
  type: json_assert
  statements:
  - 'json_equal({{title_positions}}, {"output": [2]})'
- name: Alice adds the first block
  type: call
  app: '{{docs_ctx}}'
  method: insert_block
  args:
    doc: '{{body_doc}}'
    after: null
    kind: paragraph
    depth: 0
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    block: result
- name: Alice types into the first block
  type: call
  app: '{{docs_ctx}}'
  method: apply_delta
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    ops:
    - insert: fox
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Read the block back as text
  type: call
  app: '{{docs_ctx}}'
  method: get_text
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    block_text: rpc
- name: Assert the block text
  type: json_assert
  statements:
  - 'json_equal({{block_text}}, {"output": "fox"})'
- name: List the blocks
  type: call
  app: '{{docs_ctx}}'
  method: list_blocks
  args:
    doc: '{{body_doc}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    block_ids: rpc
- name: Assert the document holds exactly the one block
  type: json_assert
  statements:
  - 'json_equal({{block_ids}}, {"output": ["{{block}}"]})'
- name: Read one block
  type: call
  app: '{{docs_ctx}}'
  method: get_block
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    one_block: rpc
- name: Assert the block renders its kind, depth and text
  type: json_assert
  statements:
  - 'json_subset({{one_block}}, {"output": {"id": "{{block}}", "kind": "paragraph", "depth": 0, "attrs":
    {}, "spans": [{"text": "fox"}]}})'
- name: Read the whole document
  type: call
  app: '{{docs_ctx}}'
  method: get_document
  args:
    doc: '{{body_doc}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    whole_document: rpc
    first_block: result.0
- name: Assert the whole document is that one block
  type: json_assert
  statements:
  - 'json_subset({{first_block}}, {"id": "{{block}}", "kind": "paragraph", "depth": 0, "attrs": {}, "spans":
    [{"text": "fox"}]})'
- name: Alice bolds the word
  type: call
  app: '{{docs_ctx}}'
  method: mark
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    start: 0
    end: 3
    key: bold
    value: 'true'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    bold_mark: result
- name: Assert the mark was minted
  type: assert
  statements:
  - is_set({{bold_mark}})
- name: Read the block's rendered spans
  type: call
  app: '{{docs_ctx}}'
  method: get_block_delta
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    bold_spans: rpc
- name: Assert the whole word is one bold span
  type: json_assert
  statements:
  - 'json_equal({{bold_spans}}, {"output": [{"text": "fox", "attributes": {"bold": true}}]})'
- name: Alice takes the bold back off
  type: call
  app: '{{docs_ctx}}'
  method: mark
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    start: 0
    end: 3
    key: bold
    value: null
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Alice makes the block a heading, indents it and aligns it
  type: call
  app: '{{docs_ctx}}'
  method: set_kind
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    kind: heading
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Indent the heading
  type: call
  app: '{{docs_ctx}}'
  method: set_depth
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    depth: 1
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Align the heading
  type: call
  app: '{{docs_ctx}}'
  method: set_attr
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    key: align
    value: end
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Read the structured digest
  type: call
  app: '{{docs_ctx}}'
  method: get_state_digest
  args:
    doc: '{{body_doc}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    structured_digest: rpc
- name: Assert the kind, depth and attribute all render
  type: json_assert
  statements:
  - 'json_equal({{structured_digest}}, {"output": "heading/1[align=end]{:fox};"})'
- name: Drop the alignment
  type: call
  app: '{{docs_ctx}}'
  method: set_attr
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    key: align
    value: null
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Unindent the block
  type: call
  app: '{{docs_ctx}}'
  method: set_depth
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    depth: 0
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Make the block a paragraph again
  type: call
  app: '{{docs_ctx}}'
  method: set_kind
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    kind: paragraph
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Alice splits the block
  type: call
  app: '{{docs_ctx}}'
  method: split_block
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    at: 1
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    tail_block: result
- name: Read the split digest
  type: call
  app: '{{docs_ctx}}'
  method: get_state_digest
  args:
    doc: '{{body_doc}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    split_digest: rpc
- name: Assert the split produced two blocks
  type: json_assert
  statements:
  - 'json_equal({{split_digest}}, {"output": "paragraph/0{:f};paragraph/0{:ox};"})'
- name: Alice merges the halves back
  type: call
  app: '{{docs_ctx}}'
  method: merge_blocks
  args:
    doc: '{{body_doc}}'
    first: '{{block}}'
    second: '{{tail_block}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Read the merged digest
  type: call
  app: '{{docs_ctx}}'
  method: get_state_digest
  args:
    doc: '{{body_doc}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    merged_digest: rpc
- name: Assert the merge restored the one block
  type: json_assert
  statements:
  - 'json_equal({{merged_digest}}, {"output": "paragraph/0{:fox};"})'
- name: Alice appends a sentence, then takes it back
  type: call
  app: '{{docs_ctx}}'
  method: apply_delta
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    ops:
    - retain: 3
    - insert: ' jumped.'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    body_undo_token: result
- name: Count the appended passage
  type: call
  app: '{{docs_ctx}}'
  method: passage_count
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    needle: fox jumped.
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    passages: rpc
- name: Assert the sentence appears exactly once
  type: json_assert
  statements:
  - 'json_equal({{passages}}, {"output": 1})'
- name: Alice undoes the append
  type: call
  app: '{{docs_ctx}}'
  method: undo
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    token: '{{body_undo_token}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Read the digest after the undo
  type: call
  app: '{{docs_ctx}}'
  method: get_state_digest
  args:
    doc: '{{body_doc}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    undone_digest: rpc
- name: Assert the undo restored the previous digest
  type: json_assert
  statements:
  - 'json_equal({{undone_digest}}, {"output": "paragraph/0{:fox};"})'
- name: A body write diffed against a stale base is refused
  type: call
  app: '{{docs_ctx}}'
  method: apply_delta_on
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    base: fx
    ops:
    - retain: 3
    - insert: '!'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    refused_write: rpc
- name: Assert the refusal hands back the block unchanged
  type: json_assert
  statements:
  - 'json_subset({{refused_write}}, {"output": {"applied": false, "token": null, "spans": [{"text": "fox"}],
    "anchor": null, "anchor_pos": null}})'
- name: A body write diffed against the current text applies
  type: call
  app: '{{docs_ctx}}'
  method: apply_delta_on
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    base: fox
    ops:
    - retain: 3
    - insert: '!'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    guarded_write: rpc
    guarded_token: result.token
    guarded_anchor: result.anchor
- name: Assert the guarded write landed, anchored after its last letter
  type: json_assert
  statements:
  - 'json_subset({{guarded_write}}, {"output": {"applied": true, "spans": [{"text": "fox!"}], "anchor_pos":
    4}})'
- name: A refused body write sent with that anchor
  type: call
  app: '{{docs_ctx}}'
  method: apply_delta_on
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    base: fox
    ops:
    - retain: 3
    - insert: '?'
    anchor: '{{guarded_anchor}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    anchored_write: rpc
- name: Assert the refusal hands back where the anchor sits now
  type: json_assert
  statements:
  - 'json_subset({{anchored_write}}, {"output": {"applied": false, "token": null, "spans": [{"text": "fox!"}],
    "anchor": "{{guarded_anchor}}", "anchor_pos": 4}})'
- name: Alice undoes the guarded write
  type: call
  app: '{{docs_ctx}}'
  method: undo
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    token: '{{guarded_token}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Read the digest after undoing the guarded write
  type: call
  app: '{{docs_ctx}}'
  method: get_state_digest
  args:
    doc: '{{body_doc}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    guarded_undone_digest: rpc
- name: Assert the block is back to the word
  type: json_assert
  statements:
  - 'json_equal({{guarded_undone_digest}}, {"output": "paragraph/0{:fox};"})'
- name: Alice anchors the gap before the last character of the word
  type: call
  app: '{{docs_ctx}}'
  method: anchor_at
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    position: 2
    before: true
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    body_anchor: result
- name: Resolve that anchor
  type: call
  app: '{{docs_ctx}}'
  method: resolve_ids
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    anchors:
    - '{{body_anchor}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    body_positions: rpc
- name: Assert the body anchor resolves where it was placed
  type: json_assert
  statements:
  - 'json_equal({{body_positions}}, {"output": [2]})'
- name: Alice adds a list item after the paragraph
  type: call
  app: '{{docs_ctx}}'
  method: insert_block
  args:
    doc: '{{body_doc}}'
    after: '{{block}}'
    kind: bulletListItem
    depth: 0
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    item_block: result
- name: Type into the list item
  type: call
  app: '{{docs_ctx}}'
  method: apply_delta
  args:
    doc: '{{body_doc}}'
    block: '{{item_block}}'
    ops:
    - insert: item
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Alice moves the list item to the top
  type: call
  app: '{{docs_ctx}}'
  method: move_block
  args:
    doc: '{{body_doc}}'
    block: '{{item_block}}'
    after: null
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Read the reordered digest
  type: call
  app: '{{docs_ctx}}'
  method: get_state_digest
  args:
    doc: '{{body_doc}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
  outputs:
    reordered_digest: rpc
- name: Assert the list item now comes first
  type: json_assert
  statements:
  - 'json_equal({{reordered_digest}}, {"output": "bulletListItem/0{:item};paragraph/0{:fox};"})'
- name: Alice deletes the list item
  type: call
  app: '{{docs_ctx}}'
  method: delete_block
  args:
    doc: '{{body_doc}}'
    block: '{{item_block}}'
  account: drive-node-1
  as_key: '{{alice_key}}'
- name: Settle after Node 3 goes down
  type: wait
  seconds: 1.0
- name: Bob appends to the title
  type: call
  app: '{{docs_ctx}}'
  method: title_apply_delta
  args:
    doc: '{{title_doc}}'
    ops:
    - retain: 4
    - insert: ' team'
  account: drive-node-2
  as_key: '{{bob_key}}'
  allow_failure: true
- name: Alice prepends to the same title
  type: call
  app: '{{docs_ctx}}'
  method: title_apply_delta
  args:
    doc: '{{title_doc}}'
    ops:
    - insert: 'the '
  account: drive-node-1
  as_key: '{{alice_key}}'
  allow_failure: true
- name: Bob appends to the shared block
  type: call
  app: '{{docs_ctx}}'
  method: apply_delta
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    ops:
    - retain: 3
    - insert: ' jumped.'
  account: drive-node-2
  as_key: '{{bob_key}}'
  allow_failure: true
- name: Alice prepends to the same block
  type: call
  app: '{{docs_ctx}}'
  method: apply_delta
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    ops:
    - insert: 'The '
  account: drive-node-1
  as_key: '{{alice_key}}'
  allow_failure: true
- name: Wait for Node 3 to rejoin the mesh
  type: wait
  seconds: 1.0
- name: Neither sentence was interleaved
  type: call
  app: '{{docs_ctx}}'
  method: passage_count
  args:
    doc: '{{body_doc}}'
    block: '{{block}}'
    needle: The fox jumped.
  account: drive-node-3
  as_key: '{{carol_key}}'
  outputs:
    converged_passages: rpc
- name: Assert the sentence reads once, end to end
  type: json_assert
  statements:
  - 'json_equal({{converged_passages}}, {"output": 1})'
