# Ported from the v1 workflow workflow-mero-docs-metadata-records.yml (`merobox cloud port`).
# v1 nodes are accounts here.
# Dropped (no release-v2 counterpart):
#   assert statement on a dropped step's output x8: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   get_group_metadata (on a namespace) x3: checks what the dropped steps did
#   get_member_metadata x5: member metadata is v1 governance
#   set_group_metadata (on a namespace) x2: checks what the dropped steps did
#   set_member_metadata x5: member metadata is v1 governance
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: Mero Docs E2E - Metadata records (#2338)
description: "Covers the metadata-records surface introduced by core PR #2338 (and the merobox v0.6.11\
  \ step replacement of group-alias → metadata-records) across group and member scopes. Two nodes: Alice\
  \ (calimero-node-1, namespace creator + admin) and Bob (calimero-node-2, default-cap member). Asserts:\n\
  \n  1. Alice sets a name on the namespace; Bob joins and reads it.\n  2. Alice creates a folder subgroup,\
  \ names it; Bob's Open-folder\n     inheritance picks up the name on read.\n  3. Alice sets her own\
  \ display name; Bob reads it via\n     get_member_metadata.\n  4. Bob sets HIS own display name; Alice\
  \ reads it.\n  5. Bob tries to rename Alice's display name → expected_failure\n     (Bob lacks CAN_MANAGE_METADATA).\
  \ Alice grants the cap → Bob\n     retries → succeeds; Alice reads the override on node 1.\n  6. Rename\
  \ round trip: Alice renames the namespace, the folder,\n     and her own member record; Bob reads each\
  \ renamed value\n     after sync.\n  7. Registry managers: Alice (the registry owner) grants and\n \
  \    revokes Bob as a manager (add_manager/remove_manager/\n     list_managers), and Bob joins the Registry\
  \ context through\n     namespace-root membership. No folder data is stored there:\n     folders are\
  \ core subgroups named by their metadata.\n\nStep types used: install_application, create_namespace,\
  \ create_context, create_group_in_namespace, set_subgroup_visibility, set_default_capabilities, set_member_capabilities,\
  \ create_namespace_invitation, join_namespace, join_context, wait, wait_for_sync, set_group_metadata,\
  \ get_group_metadata, set_member_metadata, get_member_metadata, call, assert, json_assert, delete_namespace.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3250
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install bundle on Alice
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.mero-drive-docs
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Alice creates the namespace
  type: create_org
  org_name: Alice creates the namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Alice sets default member caps (37 = JOIN_OPEN|CREATE_SUBGROUP|CREATE_CONTEXT)
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 37
  account: calimero-node-1
- name: Alice creates folder (Shared)
  type: create_team
  org: '{{namespace_id}}'
  team_name: shared
  join: invite
  outputs:
    folder_id: teamId
  account: calimero-node-1
- name: Mark folder Open (namespace members inherit access)
  type: team_update
  org: '{{namespace_id}}'
  team: '{{folder_id}}'
  join: everyone
  account: calimero-node-1
- name: Alice names the folder
  type: team_update
  org: '{{namespace_id}}'
  team: '{{folder_id}}'
  metadata:
    name: Shared (Q3 plan)
    data:
      color: '#1f8a4c'
  account: calimero-node-1
- name: Alice reads folder metadata
  type: team_get
  org: '{{namespace_id}}'
  team: '{{folder_id}}'
  account: calimero-node-1
  outputs:
    folder_name: name
- name: Assert folder name set
  type: assert
  statements:
  - equal({{folder_name}}, 'Shared (Q3 plan)')
- name: Alice creates the per-namespace Registry context
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs_registry.wasm'
  app_name: registry
  org: '{{namespace_id}}'
  outputs:
    reg_ctx: contextId
    alice_key: memberPublicKey
- name: Read Alice's account
  type: whoami
  outputs:
    alice_account: publicKey
  account: calimero-node-1
- name: Alice mints invite
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    ns_invite: token
- name: Wait for governance gossip
  type: wait
  seconds: 1.0
  message: Namespace governance DAG needs to propagate before Bob can join
- name: Bob joins namespace
  type: redeem_invite
  token: '{{ns_invite}}'
  account: calimero-node-2
- type: whoami
  account: calimero-node-2
  outputs:
    bob_account: publicKey
- name: Wait for metadata + group rows to propagate to Bob
  type: wait
  seconds: 1.0
  message: Bob's node needs metadata + Open-folder rows propagated
- name: Bob reads folder name
  type: team_get
  org: '{{namespace_id}}'
  team: '{{folder_id}}'
  account: calimero-node-2
  outputs:
    folder_name_bob: name
- name: Assert folder name visible to Bob
  type: assert
  statements:
  - equal({{folder_name_bob}}, 'Shared (Q3 plan)')
- name: list_managers is empty before any grant
  type: call
  app: '{{reg_ctx}}'
  method: list_managers
  args: {}
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    managers_before: result
- name: Assert no managers yet
  type: json_assert
  statements:
  - json_equal({{managers_before}}, [])
- name: Alice adds Bob as a registry manager
  type: call
  app: '{{reg_ctx}}'
  method: add_manager
  args:
    member: '{{bob_account}}'
  account: calimero-node-1
  as_key: '{{alice_key}}'
- name: list_managers shows Bob after the grant
  type: call
  app: '{{reg_ctx}}'
  method: list_managers
  args: {}
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    managers_after_add: result
- name: Assert Bob is listed as a manager
  type: json_assert
  statements:
  - json_equal({{managers_after_add}}, ["{{bob_account}}"])
- name: Bob joins the Registry context via namespace-root membership
  type: whoami
  account: calimero-node-2
  outputs:
    bob_reg_key: publicKey
- name: Assert Bob's Registry-context join produced an executor key
  type: assert
  statements:
  - is_set({{bob_reg_key}})
- name: Alice removes Bob as a registry manager
  type: call
  app: '{{reg_ctx}}'
  method: remove_manager
  args:
    member: '{{bob_account}}'
  account: calimero-node-1
  as_key: '{{alice_key}}'
- name: list_managers is empty again after the removal
  type: call
  app: '{{reg_ctx}}'
  method: list_managers
  args: {}
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    managers_after_remove: result
- name: Assert Bob was dropped from the manager list
  type: json_assert
  statements:
  - json_equal({{managers_after_remove}}, [])
- name: Wait for member-metadata gossip
  type: wait
  seconds: 1.0
- name: Alice grants Bob CAN_MANAGE_METADATA (293 = 37|256)
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 293
  account: calimero-node-1
  member: '{{bob_account}}'
- name: Wait for cap propagation
  type: wait
  seconds: 1.0
- name: Wait for the cross-node rename to gossip
  type: wait
  seconds: 1.0
- name: Alice renames the folder
  type: team_update
  org: '{{namespace_id}}'
  team: '{{folder_id}}'
  metadata:
    name: Shared (Q4 plan)
    data:
      color: '#1f8a4c'
  account: calimero-node-1
- name: Wait for renames to gossip
  type: wait
  seconds: 1.0
- name: Bob reads folder name (renamed)
  type: team_get
  org: '{{namespace_id}}'
  team: '{{folder_id}}'
  account: calimero-node-2
  outputs:
    folder_renamed_bob: name
- name: Assert all renames visible to Bob
  type: assert
  statements:
  - equal({{folder_renamed_bob}}, 'Shared (Q4 plan)')
