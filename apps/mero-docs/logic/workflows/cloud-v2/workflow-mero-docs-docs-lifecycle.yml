# Ported from workflow-mero-docs-docs-lifecycle.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   start_node x2: a user's node going offline has no counterpart in a cluster
#   stop_node x2: a user's node going offline has no counterpart in a cluster
#   wait_for_sync x11: replication is synchronous: a read sees every committed write
name: Mero Docs E2E - Docs Service Full Lifecycle
description: "End-to-end coverage for the DocsClient WASM surface - the editor loop that Phase 8-D shipped.\
  \ The main workflow-mero-docs-e2e.yml exercises the registry service thoroughly but skips the docs service;\
  \ this workflow closes that gap.\nTwo nodes (Alice + Bob). Alice creates a namespace and a folder with\
  \ its own Docs context, invites Bob, Bob joins, and then every public DocsClient method is exercised\
  \ with cross-node sync assertions:\n\n  create_doc / list_docs / get_doc / edit_doc\n  archive_doc /\
  \ unarchive_doc / delete_doc\n  add_tag / remove_tag\n\nNegative paths: edit unknown doc, delete unknown\
  \ doc, tag keys that are empty, uppercase, spaced or too long, list_docs with / without include_archived.\n\
  Tags merge per key: adds and removes made on both nodes while partitioned all hold. A doc records who\
  \ created it and who changed it last.\nMatches the user flow in DocumentEditor + DocumentList: a folder\
  \ with multiple docs, open one, rename via title, archive out of view, delete with confirmation. Each\
  \ DocsClient method the app can call is hit here with both happy and error paths.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3210
accounts:
- docs-node-1
- docs-node-2
steps:
- name: Install bundle on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  outputs:
    app_id: hash
  account: docs-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Alice creates namespace
  type: create_org
  org_name: Alice creates namespace
  outputs:
    namespace_id: orgId
  account: docs-node-1
- name: Alice creates top-level folder group
  type: create_team
  org: '{{namespace_id}}'
  team_name: notes
  outputs:
    notes_group: teamId
  account: docs-node-1
- name: Alice creates the docs context bound to the folder group
  type: deploy
  account: docs-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  outputs:
    docs_ctx: contextId
    alice_key: memberPublicKey
- name: Create namespace invitation for Bob
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: docs-node-1
  outputs:
    ns_invite: token
- name: Wait for namespace gossip to reach Node 2
  type: wait
  seconds: 1.0
- name: Bob joins the namespace
  type: redeem_invite
  token: '{{ns_invite}}'
  account: docs-node-2
- type: whoami
  account: docs-node-2
  outputs:
    bob_identity: publicKey
- name: Alice adds Bob to the folder group (so he can join its docs context)
  type: team_add
  org: '{{namespace_id}}'
  team: '{{notes_group}}'
  members:
  - '{{bob_identity}}'
  account: docs-node-1
- name: Wait for folder subgroup membership to propagate
  type: wait
  seconds: 1.0
- name: Bob joins the docs context
  type: whoami
  account: docs-node-2
  outputs:
    bob_key: publicKey
- name: list_docs on empty docs context returns empty list
  type: call
  app: '{{docs_ctx}}'
  method: list_docs
  args:
    include_archived: false
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Bob also sees an empty list (cross-node read)
  type: call
  app: '{{docs_ctx}}'
  method: list_docs
  args:
    include_archived: false
  account: docs-node-2
  as_key: '{{bob_key}}'
- name: Alice creates the first doc
  type: call
  app: '{{docs_ctx}}'
  method: create_doc
  args:
    title: Meeting notes
  account: docs-node-1
  as_key: '{{alice_key}}'
  outputs:
    doc_a: result
- name: Alice creates the second doc
  type: call
  app: '{{docs_ctx}}'
  method: create_doc
  args:
    title: Shopping list
  account: docs-node-1
  as_key: '{{alice_key}}'
  outputs:
    doc_b: result
- name: Alice creates the third doc (will be archived later)
  type: call
  app: '{{docs_ctx}}'
  method: create_doc
  args:
    title: Old notes
  account: docs-node-1
  as_key: '{{alice_key}}'
  outputs:
    doc_c: result
- name: Assert all three doc ids were captured
  type: assert
  statements:
  - is_set({{doc_a}})
  - is_set({{doc_b}})
  - is_set({{doc_c}})
- name: Bob lists docs - sees all three
  type: call
  app: '{{docs_ctx}}'
  method: list_docs
  args:
    include_archived: false
  account: docs-node-2
  as_key: '{{bob_key}}'
- name: Alice adds a block to doc_b
  type: call
  app: '{{docs_ctx}}'
  method: insert_block
  args:
    doc: '{{doc_b}}'
    after: null
    kind: paragraph
    depth: 0
  account: docs-node-1
  as_key: '{{alice_key}}'
  outputs:
    search_block: result
- name: Alice types into it
  type: call
  app: '{{docs_ctx}}'
  method: apply_delta
  args:
    doc: '{{doc_b}}'
    block: '{{search_block}}'
    ops:
    - insert: oat milk and zucchini
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Let Bob's indexer catch up
  type: wait
  seconds: 1.0
- name: Bob searches a title word as it is being typed
  type: call
  app: '{{docs_ctx}}'
  method: search_docs
  args:
    query: meet
    include_archived: false
    cursor: null
    limit: null
  account: docs-node-2
  as_key: '{{bob_key}}'
  outputs:
    title_total: result.total
    title_hit: result.hits.0.id
    title_hit_title: result.hits.0.title
- name: Bob searches a word inside a document body
  type: call
  app: '{{docs_ctx}}'
  method: search_docs
  args:
    query: zucchini
    include_archived: false
    cursor: null
    limit: null
  account: docs-node-2
  as_key: '{{bob_key}}'
  outputs:
    body_total: result.total
    body_hit: result.hits.0.id
    body_snippet: result.hits.0.snippet
- name: Bob searches a word no document holds
  type: call
  app: '{{docs_ctx}}'
  method: search_docs
  args:
    query: xylophone
    include_archived: false
    cursor: null
    limit: null
  account: docs-node-2
  as_key: '{{bob_key}}'
  outputs:
    no_hits: result.hits
- name: Assert the index found the title and the body, and nothing else
  type: assert
  statements:
  - equal({{title_hit}}, {{doc_a}})
  - equal({{body_hit}}, {{doc_b}})
  - contains({{body_snippet}}, '<b>zucchini</b>')
- name: Assert one hit each, and none for a missing word
  type: json_assert
  statements:
  - json_equal({{title_total}}, 1)
  - json_equal({{body_total}}, 1)
  - json_equal({{title_hit_title}}, "Meeting notes")
  - json_equal({{no_hits}}, [])
- name: Reject a search query over the length cap
  type: call
  app: '{{docs_ctx}}'
  method: search_docs
  args:
    query: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    include_archived: false
    cursor: null
    limit: null
  account: docs-node-2
  as_key: '{{bob_key}}'
  expected_failure: true
- name: Alice reads doc_a
  type: call
  app: '{{docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_a}}'
  account: docs-node-1
  as_key: '{{alice_key}}'
  outputs:
    doc_a_read: result
    alice_hex: result.created_by
    doc_a_updated_by_before: result.updated_by
- name: Assert the read returned something, created and last changed by Alice
  type: assert
  statements:
  - is_set({{doc_a_read}})
  - regex({{alice_hex}}, '^[0-9a-f]{64}$')
  - equal({{doc_a_updated_by_before}}, {{alice_hex}})
- name: Bob also reads doc_a (cross-node)
  type: call
  app: '{{docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_a}}'
  account: docs-node-2
  as_key: '{{bob_key}}'
  outputs:
    bob_can_delete_doc_a: result.can_delete
- name: Reject get_doc on unknown id
  type: call
  app: '{{docs_ctx}}'
  method: get_doc
  args:
    id: '00000000000000000000000000000000'
  account: docs-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Alice renames doc_a
  type: call
  app: '{{docs_ctx}}'
  method: edit_doc
  args:
    id: '{{doc_a}}'
    title: Meeting notes (renamed)
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Alice renames doc_a again
  type: call
  app: '{{docs_ctx}}'
  method: edit_doc
  args:
    id: '{{doc_a}}'
    title: Revised draft
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Alice renames doc_b
  type: call
  app: '{{docs_ctx}}'
  method: edit_doc
  args:
    id: '{{doc_b}}'
    title: Groceries
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Bob reads the renamed doc_a
  type: call
  app: '{{docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_a}}'
  account: docs-node-2
  as_key: '{{bob_key}}'
- name: Reject edit_doc on unknown id
  type: call
  app: '{{docs_ctx}}'
  method: edit_doc
  args:
    id: '00000000000000000000000000000000'
    title: Ghost
  account: docs-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Alice adds "important" tag to doc_a
  type: call
  app: '{{docs_ctx}}'
  method: add_tag
  args:
    id: '{{doc_a}}'
    tag: important
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Alice adds "meeting" tag to doc_a (multiple tags)
  type: call
  app: '{{docs_ctx}}'
  method: add_tag
  args:
    id: '{{doc_a}}'
    tag: meeting
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Alice removes "meeting" tag from doc_a
  type: call
  app: '{{docs_ctx}}'
  method: remove_tag
  args:
    id: '{{doc_a}}'
    tag: meeting
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Reject add_tag with empty tag
  type: call
  app: '{{docs_ctx}}'
  method: add_tag
  args:
    id: '{{doc_a}}'
    tag: ''
  account: docs-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Reject add_tag with an uppercase key
  type: call
  app: '{{docs_ctx}}'
  method: add_tag
  args:
    id: '{{doc_a}}'
    tag: Launch
  account: docs-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Reject add_tag with a space in the key
  type: call
  app: '{{docs_ctx}}'
  method: add_tag
  args:
    id: '{{doc_a}}'
    tag: q3 plan
  account: docs-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Reject add_tag with a 65-character key
  type: call
  app: '{{docs_ctx}}'
  method: add_tag
  args:
    id: '{{doc_a}}'
    tag: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  account: docs-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Alice reads doc_a tags after the rejected keys
  type: call
  app: '{{docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_a}}'
  account: docs-node-1
  as_key: '{{alice_key}}'
  outputs:
    tags_a_after_rejects: result.tags
- name: Assert only the valid tag is on doc_a
  type: json_assert
  statements:
  - json_equal({{tags_a_after_rejects}}, ["important"])
- name: Reject add_tag on unknown doc
  type: call
  app: '{{docs_ctx}}'
  method: add_tag
  args:
    id: '00000000000000000000000000000000'
    tag: anything
  account: docs-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: remove_tag for a tag not present is a success no-op
  type: call
  app: '{{docs_ctx}}'
  method: remove_tag
  args:
    id: '{{doc_a}}'
    tag: never-added
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Alice archives doc_c
  type: call
  app: '{{docs_ctx}}'
  method: archive_doc
  args:
    id: '{{doc_c}}'
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: list_docs without include_archived - archived doc_c hidden
  type: call
  app: '{{docs_ctx}}'
  method: list_docs
  args:
    include_archived: false
  account: docs-node-2
  as_key: '{{bob_key}}'
- name: list_docs with include_archived - archived doc_c visible
  type: call
  app: '{{docs_ctx}}'
  method: list_docs
  args:
    include_archived: true
  account: docs-node-2
  as_key: '{{bob_key}}'
- name: Alice unarchives doc_c
  type: call
  app: '{{docs_ctx}}'
  method: unarchive_doc
  args:
    id: '{{doc_c}}'
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: list_docs without include_archived - doc_c visible again
  type: call
  app: '{{docs_ctx}}'
  method: list_docs
  args:
    include_archived: false
  account: docs-node-2
  as_key: '{{bob_key}}'
- name: Reject archive_doc on unknown id
  type: call
  app: '{{docs_ctx}}'
  method: archive_doc
  args:
    id: '00000000000000000000000000000000'
  account: docs-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Alice deletes doc_b
  type: call
  app: '{{docs_ctx}}'
  method: delete_doc
  args:
    id: '{{doc_b}}'
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Bob can't find doc_b anymore (deleted)
  type: call
  app: '{{docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_b}}'
  account: docs-node-2
  as_key: '{{bob_key}}'
  expected_failure: true
- name: Reject delete_doc on already-deleted id
  type: call
  app: '{{docs_ctx}}'
  method: delete_doc
  args:
    id: '{{doc_b}}'
  account: docs-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
- name: Final list_docs - only doc_a + doc_c remain
  type: call
  app: '{{docs_ctx}}'
  method: list_docs
  args:
    include_archived: false
  account: docs-node-2
  as_key: '{{bob_key}}'
- name: Bob renames doc_a
  type: call
  app: '{{docs_ctx}}'
  method: edit_doc
  args:
    id: '{{doc_a}}'
    title: Bob was here
  account: docs-node-2
  as_key: '{{bob_key}}'
- name: Alice reads Bob's edit
  type: call
  app: '{{docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_a}}'
  account: docs-node-1
  as_key: '{{alice_key}}'
  outputs:
    doc_a_created_by: result.created_by
    doc_a_updated_by: result.updated_by
- name: Bob creates a doc of his own
  type: call
  app: '{{docs_ctx}}'
  method: create_doc
  args:
    title: Bob's notes
  account: docs-node-2
  as_key: '{{bob_key}}'
  outputs:
    doc_bob: result
- name: Bob reads his doc
  type: call
  app: '{{docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_bob}}'
  account: docs-node-2
  as_key: '{{bob_key}}'
  outputs:
    bob_hex: result.created_by
    bob_can_delete_doc_bob: result.can_delete
- name: Assert Bob may delete his own doc but not Alice's
  type: json_assert
  statements:
  - json_equal({{bob_can_delete_doc_bob}}, true)
  - json_equal({{bob_can_delete_doc_a}}, false)
- name: Assert doc_a was created by Alice and last changed by Bob
  type: assert
  statements:
  - regex({{bob_hex}}, '^[0-9a-f]{64}$')
  - not_equal({{alice_hex}}, {{bob_hex}})
  - equal({{doc_a_created_by}}, {{alice_hex}})
  - equal({{doc_a_updated_by}}, {{bob_hex}})
  - not_equal({{doc_a_created_by}}, {{doc_a_updated_by}})
- name: Alice comments on doc_a
  type: call
  app: '{{docs_ctx}}'
  method: add_comment
  args:
    doc_id: '{{doc_a}}'
    body: Looks good to me.
  account: docs-node-1
  as_key: '{{alice_key}}'
  outputs:
    comment_id: result
- name: Alice reads her comment back
  type: call
  app: '{{docs_ctx}}'
  method: get_comment
  args:
    id: '{{comment_id}}'
  account: docs-node-1
  as_key: '{{alice_key}}'
  outputs:
    comment_doc: result.doc_id
    comment_body: result.body
- name: Assert the comment kept its document and body
  type: assert
  statements:
  - '"{{comment_doc}}" == "{{doc_a}}"'
  - '{{comment_body}} == "Looks good to me."'
- name: Bob counts the comments
  type: call
  app: '{{docs_ctx}}'
  method: comment_count
  args: {}
  account: docs-node-2
  as_key: '{{bob_key}}'
  outputs:
    comments_on_node2: rpc
- name: Assert the comment reached Bob
  type: json_assert
  statements:
  - 'json_equal({{comments_on_node2}}, {"output": 1})'
- name: Alice adds tag w to doc_c
  type: call
  app: '{{docs_ctx}}'
  method: add_tag
  args:
    id: '{{doc_c}}'
    tag: w
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Alice adds tag x to doc_c while Bob is offline
  type: call
  app: '{{docs_ctx}}'
  method: add_tag
  args:
    id: '{{doc_c}}'
    tag: x
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Alice removes tag w from doc_c while Bob is offline
  type: call
  app: '{{docs_ctx}}'
  method: remove_tag
  args:
    id: '{{doc_c}}'
    tag: w
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Bob reads doc_c before writing
  type: call
  app: '{{docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_c}}'
  account: docs-node-2
  as_key: '{{bob_key}}'
  outputs:
    tags_c_bob_offline: result.tags
- name: Assert Bob has neither of Alice's offline edits
  type: json_assert
  statements:
  - json_equal({{tags_c_bob_offline}}, ["w"])
- name: Bob adds tag y to doc_c while Alice is offline
  type: call
  app: '{{docs_ctx}}'
  method: add_tag
  args:
    id: '{{doc_c}}'
    tag: y
  account: docs-node-2
  as_key: '{{bob_key}}'
- name: Wait for the nodes to find each other
  type: wait
  seconds: 1.0
- name: Alice reads doc_c tags after the partition
  type: call
  app: '{{docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_c}}'
  account: docs-node-1
  as_key: '{{alice_key}}'
  outputs:
    tags_c_alice: result.tags
- name: Bob reads doc_c tags after the partition
  type: call
  app: '{{docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_c}}'
  account: docs-node-2
  as_key: '{{bob_key}}'
  outputs:
    tags_c_bob: result.tags
- name: Assert both nodes list x and y
  type: json_assert
  statements:
  - json_equal({{tags_c_alice}}, ["x", "y"])
  - json_equal({{tags_c_bob}}, ["x", "y"])
- name: Alice removes tag w again
  type: call
  app: '{{docs_ctx}}'
  method: remove_tag
  args:
    id: '{{doc_c}}'
    tag: w
  account: docs-node-1
  as_key: '{{alice_key}}'
- name: Alice reads doc_c tags after the repeated remove
  type: call
  app: '{{docs_ctx}}'
  method: get_doc
  args:
    id: '{{doc_c}}'
  account: docs-node-1
  as_key: '{{alice_key}}'
  outputs:
    tags_c_after_repeat: result.tags
- name: Assert the repeated remove changed nothing
  type: json_assert
  statements:
  - json_equal({{tags_c_after_repeat}}, ["x", "y"])
