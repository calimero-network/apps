# Ported from workflow-mero-docs-nested-read-only-removal.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_api_response x5: v1 admin API
#   join_subgroup_inheritance x5: subgroup inheritance is v1 governance
#   remove_group_members (team) x6: not supported by the port
#   reparent_group x5: reparenting is v1 governance
#   set_group_metadata x7: group metadata is v1 governance
#   set_member_capabilities x3: capabilities are v1 governance
#   set_subgroup_visibility x7: subgroup visibility is v1 governance
#   wait_for_sync x11: replication is synchronous: a read sees every committed write
name: Mero Docs - folder removal and restore across nested folders
description: 'Removed from Open G, Bob is also removed from its Open child G2: he cannot rejoin by inheritance,
  and Alice''s Restore (an admin add) lets him back. Restoring him to F does not let him into HB2, an
  Open folder inside Restricted HB he is not in. In Restricted F2, Read only and back leaves a direct
  row in its Open sub-folder G4, which a removal from F2 must clear.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3270
accounts:
- curn-node-1
- curn-node-2
steps:
- name: Install the bundle on Alice
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  outputs:
    app_id: hash
  account: curn-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Alice creates the namespace
  type: create_org
  org_name: Alice creates the namespace
  outputs:
    namespace_id: orgId
  account: curn-node-1
- name: Alice creates the Registry context (workspace-level data only; folders live in core)
  type: deploy
  account: curn-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs_registry.wasm'
  app_name: registry
  org: '{{namespace_id}}'
  outputs:
    reg_ctx: appId
    alice_key: memberPublicKey
- name: Alice creates folder F
  type: create_team
  org: '{{namespace_id}}'
  team_name: f
  outputs:
    g_F: teamId
  account: curn-node-1
- name: Alice creates F's Docs context
  type: deploy
  account: curn-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  outputs:
    c_F: appId
    a_F: memberPublicKey
- name: Alice creates a doc in F
  type: call
  app: '{{c_F}}'
  method: create_doc
  args:
    title: F original
  account: curn-node-1
  as_key: '{{a_F}}'
  outputs:
    d_F: result
- name: Alice creates folder G
  type: create_team
  org: '{{namespace_id}}'
  team_name: g
  outputs:
    g_G: teamId
  account: curn-node-1
- name: Alice creates G's Docs context
  type: deploy
  account: curn-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  outputs:
    c_G: appId
    a_G: memberPublicKey
- name: Alice creates a doc in G
  type: call
  app: '{{c_G}}'
  method: create_doc
  args:
    title: G original
  account: curn-node-1
  as_key: '{{a_G}}'
  outputs:
    d_G: result
- name: Alice creates folder G2
  type: create_team
  org: '{{namespace_id}}'
  team_name: g2
  outputs:
    g_G2: teamId
  account: curn-node-1
- name: Alice creates G2's Docs context
  type: deploy
  account: curn-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  outputs:
    c_G2: appId
    a_G2: memberPublicKey
- name: Alice creates a doc in G2
  type: call
  app: '{{c_G2}}'
  method: create_doc
  args:
    title: G2 original
  account: curn-node-1
  as_key: '{{a_G2}}'
  outputs:
    d_G2: result
- name: Alice creates folder HB
  type: create_team
  org: '{{namespace_id}}'
  team_name: hb
  outputs:
    g_HB: teamId
  account: curn-node-1
- name: Alice creates HB's Docs context
  type: deploy
  account: curn-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  outputs:
    c_HB: appId
    a_HB: memberPublicKey
- name: Alice creates a doc in HB
  type: call
  app: '{{c_HB}}'
  method: create_doc
  args:
    title: HB original
  account: curn-node-1
  as_key: '{{a_HB}}'
  outputs:
    d_HB: result
- name: Alice creates folder HB2
  type: create_team
  org: '{{namespace_id}}'
  team_name: hb2
  outputs:
    g_HB2: teamId
  account: curn-node-1
- name: Alice creates HB2's Docs context
  type: deploy
  account: curn-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  outputs:
    c_HB2: appId
    a_HB2: memberPublicKey
- name: Alice creates a doc in HB2
  type: call
  app: '{{c_HB2}}'
  method: create_doc
  args:
    title: HB2 original
  account: curn-node-1
  as_key: '{{a_HB2}}'
  outputs:
    d_HB2: result
- name: Alice creates folder F2
  type: create_team
  org: '{{namespace_id}}'
  team_name: f2
  outputs:
    g_F2: teamId
  account: curn-node-1
- name: Alice creates F2's Docs context
  type: deploy
  account: curn-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  outputs:
    c_F2: appId
    a_F2: memberPublicKey
- name: Alice creates a doc in F2
  type: call
  app: '{{c_F2}}'
  method: create_doc
  args:
    title: F2 original
  account: curn-node-1
  as_key: '{{a_F2}}'
  outputs:
    d_F2: result
- name: Alice creates folder G4
  type: create_team
  org: '{{namespace_id}}'
  team_name: g4
  outputs:
    g_G4: teamId
  account: curn-node-1
- name: Alice creates G4's Docs context
  type: deploy
  account: curn-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  outputs:
    c_G4: appId
    a_G4: memberPublicKey
- name: Alice creates a doc in G4
  type: call
  app: '{{c_G4}}'
  method: create_doc
  args:
    title: G4 original
  account: curn-node-1
  as_key: '{{a_G4}}'
  outputs:
    d_G4: result
- name: Alice invites Bob to the namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: curn-node-1
  outputs:
    ns_invite: token
- name: Settle before Bob joins the namespace
  type: wait
  seconds: 1.0
- name: Bob joins the namespace
  type: redeem_invite
  token: '{{ns_invite}}'
  account: curn-node-2
- type: whoami
  account: curn-node-2
  outputs:
    bob_account: publicKey
- name: Bob joins F's Docs context
  type: whoami
  account: curn-node-2
  outputs:
    b_F: publicKey
- name: Bob joins G's Docs context
  type: whoami
  account: curn-node-2
  outputs:
    b_G: publicKey
- name: Bob joins G2's Docs context
  type: whoami
  account: curn-node-2
  outputs:
    b_G2: publicKey
- name: Bob renames the G doc to 'G after removal'
  type: call
  app: '{{c_G}}'
  method: edit_doc
  args:
    id: '{{d_G}}'
    title: G after removal
  account: curn-node-2
  as_key: '{{b_G}}'
  allow_failure: true
- name: Bob renames the G2 doc to 'G2 after removal'
  type: call
  app: '{{c_G2}}'
  method: edit_doc
  args:
    id: '{{d_G2}}'
    title: G2 after removal
  account: curn-node-2
  as_key: '{{b_G2}}'
  allow_failure: true
- name: Give a removed member's writes time to sync
  type: wait
  seconds: 1.0
- name: Alice reads the G doc (g_removed)
  type: call
  app: '{{c_G}}'
  method: get_doc
  args:
    id: '{{d_G}}'
  account: curn-node-1
  as_key: '{{a_G}}'
  outputs:
    g_removed: result.title
- name: Alice reads the G2 doc (g2_removed)
  type: call
  app: '{{c_G2}}'
  method: get_doc
  args:
    id: '{{d_G2}}'
  account: curn-node-1
  as_key: '{{a_G2}}'
  outputs:
    g2_removed: result.title
- name: Removed from G, Bob writes in neither G nor G2
  type: json_assert
  statements:
  - json_equal({{g_removed}}, "G original")
  - json_equal({{g2_removed}}, "G2 original")
- name: Alice restores Bob to G
  type: team_add
  org: '{{namespace_id}}'
  team: '{{g_G}}'
  members:
  - '{{bob_account}}'
  account: curn-node-1
- name: Bob renames the G doc to 'G after restore'
  type: call
  app: '{{c_G}}'
  method: edit_doc
  args:
    id: '{{d_G}}'
    title: G after restore
  account: curn-node-2
  as_key: '{{b_G}}'
- name: Alice reads the G doc (g_restored)
  type: call
  app: '{{c_G}}'
  method: get_doc
  args:
    id: '{{d_G}}'
  account: curn-node-1
  as_key: '{{a_G}}'
  outputs:
    g_restored: result.title
- name: Restore lets Bob back into G
  type: json_assert
  statements:
  - json_equal({{g_restored}}, "G after restore")
- name: Alice restores Bob to F
  type: team_add
  org: '{{namespace_id}}'
  team: '{{g_F}}'
  members:
  - '{{bob_account}}'
  account: curn-node-1
- name: Alice adds Bob to F2
  type: team_add
  org: '{{namespace_id}}'
  team: '{{g_F2}}'
  members:
  - '{{bob_account}}'
  account: curn-node-1
- name: Bob joins F2's Docs context
  type: whoami
  account: curn-node-2
  outputs:
    b_F2: publicKey
- name: Bob joins G4's Docs context
  type: whoami
  account: curn-node-2
  outputs:
    b_G4: publicKey
- name: Alice makes Bob core ReadOnly in F2
  type: set_role
  org: '{{namespace_id}}'
  member: '{{bob_account}}'
  role: guest
  account: curn-node-1
- name: Alice adds a direct ReadOnly row for Bob in G4
  type: team_add
  org: '{{namespace_id}}'
  team: '{{g_G4}}'
  members:
  - '{{bob_account}}'
  account: curn-node-1
- name: Alice makes Bob core Member in F2 again
  type: set_role
  org: '{{namespace_id}}'
  member: '{{bob_account}}'
  role: member
  account: curn-node-1
- name: Alice makes Bob core Member in G4 again
  type: set_role
  org: '{{namespace_id}}'
  member: '{{bob_account}}'
  role: member
  account: curn-node-1
- name: Bob renames the G4 doc to 'G4 as an Editor'
  type: call
  app: '{{c_G4}}'
  method: edit_doc
  args:
    id: '{{d_G4}}'
    title: G4 as an Editor
  account: curn-node-2
  as_key: '{{b_G4}}'
- name: Alice reads the G4 doc (g4_editor)
  type: call
  app: '{{c_G4}}'
  method: get_doc
  args:
    id: '{{d_G4}}'
  account: curn-node-1
  as_key: '{{a_G4}}'
  outputs:
    g4_editor: result.title
- name: Back to Editor, Bob writes in G4
  type: json_assert
  statements:
  - json_equal({{g4_editor}}, "G4 as an Editor")
- name: Let the removal from F2 reach Bob
  type: wait
  seconds: 1.0
- name: Bob renames the G4 doc to 'G4 after removal from F2'
  type: call
  app: '{{c_G4}}'
  method: edit_doc
  args:
    id: '{{d_G4}}'
    title: G4 after removal from F2
  account: curn-node-2
  as_key: '{{b_G4}}'
  allow_failure: true
- name: Give a removed member's write time to sync
  type: wait
  seconds: 1.0
- name: Alice reads the G4 doc (g4_removed)
  type: call
  app: '{{c_G4}}'
  method: get_doc
  args:
    id: '{{d_G4}}'
  account: curn-node-1
  as_key: '{{a_G4}}'
  outputs:
    g4_removed: result.title
- name: Removed from F2, Bob writes no more in its Open sub-folder G4
  type: json_assert
  statements:
  - json_equal({{g4_removed}}, "G4 as an Editor")
