# Ported from workflow-mero-docs-e2e.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert statement on a dropped step's output x7: checks what the dropped steps did
#   delete_group x4: v1 group deletion
#   get_group_metadata x2: group metadata is v1 governance
#   list_subgroups x7: v1 group listing
#   reparent_group x6: reparenting is v1 governance
#   set_group_metadata x6: group metadata is v1 governance
#   set_subgroup_visibility x1: subgroup visibility is v1 governance
#   wait_for_sync x5: replication is synchronous: a read sees every committed write
name: Mero Docs E2E - Namespace + Folders + Docs Multi-Service
description: 'Full end-to-end coverage for the mero-docs multi-service bundle. Two nodes: node-1 (Alice)
  creates a namespace, a Registry context, and a nested folder tree with its own Docs context; node-2
  (Bob) joins the namespace and the same contexts. Folders are core subgroups: their name and colour are
  subgroup metadata (`data.color`), the tree is the group tree (`reparent_group` / `list_subgroups`),
  a folder''s docs context is the one context in its subgroup, and deleting a folder is one `delete_group`
  that cascades. The registry holds no folder data. The workflow exercises the docs service''s public
  methods, including the error paths (missing ids, empty tag, etc.), and asserts cross-node replication
  at key sync points.

  Merobox workflows execute sequentially - concurrent-write CRDT merges (two nodes writing the same key
  simultaneously then converging) are covered by the Rust unit tests, not here. Everything here is single-
  writer-at-a-time with `wait_for_sync` to hand the write off to the other node''s reader.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3220
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install Mero Docs bundle on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  outputs:
    app_id: hash
  account: calimero-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Alice creates namespace
  type: create_org
  org_name: Alice creates namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Alice creates the per-namespace Registry context
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs_registry.wasm'
  app_name: registry
  org: '{{namespace_id}}'
  outputs:
    registry_ctx: contextId
    alice_key: memberPublicKey
- name: Assert Registry bootstrap shape
  type: assert
  statements:
  - is_set({{namespace_id}})
  - is_set({{registry_ctx}})
  - is_set({{alice_key}})
- name: Create namespace invitation for Bob
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    ns_invite: token
- name: Wait for namespace gossip to reach Node 2
  type: wait
  seconds: 1.0
  message: Namespace governance DAG needs to propagate before Bob can join
- name: Bob joins the namespace
  type: redeem_invite
  token: '{{ns_invite}}'
  account: calimero-node-2
- type: whoami
  account: calimero-node-2
  outputs:
    bob_identity: publicKey
- name: Bob joins the Registry context
  type: whoami
  account: calimero-node-2
  outputs:
    bob_key: publicKey
- type: set
  values:
    registry_ctx_bob: '{{registry_ctx}}'
- name: Assert Bob is on the Registry context
  type: assert
  statements:
  - is_set({{bob_identity}})
  - is_set({{bob_key}})
- name: Create top-level folder group (Engineering)
  type: create_team
  org: '{{namespace_id}}'
  team_name: eng
  outputs:
    eng_group: teamId
  account: calimero-node-1
- name: Assert eng_group allocated
  type: assert
  statements:
  - is_set({{eng_group}})
- name: Simulate app-cascade - add Bob to Engineering subgroup
  type: team_add
  org: '{{namespace_id}}'
  team: '{{eng_group}}'
  members:
  - '{{bob_identity}}'
  account: calimero-node-1
- name: Wait for Engineering subgroup membership to propagate
  type: wait
  seconds: 1.0
  message: Engineering subgroup governance needs to reach Bob before he joins the docs context
- name: Create Docs context inside the Engineering group
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  outputs:
    eng_docs_ctx: contextId
    alice_docs_key: memberPublicKey
- name: Create nested folder group (Engineering/Backend)
  type: create_team
  org: '{{namespace_id}}'
  team_name: eng-backend
  outputs:
    backend_group: teamId
  account: calimero-node-1
- name: Create sibling nested folder (Engineering/Frontend)
  type: create_team
  org: '{{namespace_id}}'
  team_name: eng-frontend
  outputs:
    frontend_group: teamId
  account: calimero-node-1
- name: Create second top-level folder group (Design)
  type: create_team
  org: '{{namespace_id}}'
  team_name: design
  outputs:
    design_group: teamId
  account: calimero-node-1
- name: Create subteam group (initially a direct child of namespace root)
  type: create_team
  org: '{{namespace_id}}'
  team_name: eng-subteam
  outputs:
    subteam_group: teamId
  account: calimero-node-1
- name: Simulate inherit cascade - add Bob to the new nested subteam
  type: team_add
  org: '{{namespace_id}}'
  team: '{{subteam_group}}'
  members:
  - '{{bob_identity}}'
  account: calimero-node-1
- name: Wait for the nested subgroup to propagate to Bob
  type: wait
  seconds: 1.0
  message: Group-tree governance needs to reach Bob's node
- name: Wait for folder metadata to propagate to Bob
  type: wait
  seconds: 1.0
  message: Subgroup metadata needs to reach Bob's node
- name: Wait for docs context gossip to reach Bob
  type: wait
  seconds: 1.0
  message: Docs context membership needs to propagate
- name: Bob joins Engineering docs context
  type: whoami
  account: calimero-node-2
  outputs:
    bob_docs_key: publicKey
- type: set
  values:
    eng_docs_ctx_bob: '{{eng_docs_ctx}}'
- name: list_docs on empty docs context returns []
  type: call
  app: '{{eng_docs_ctx}}'
  method: list_docs
  args:
    include_archived: false
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
- name: create_doc - "Roadmap"
  type: call
  app: '{{eng_docs_ctx}}'
  method: create_doc
  args:
    title: Roadmap
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  outputs:
    roadmap_id: result
- name: Assert doc id allocated
  type: assert
  statements:
  - is_set({{roadmap_id}})
- name: create_doc - an empty title is allowed
  type: call
  app: '{{eng_docs_ctx}}'
  method: create_doc
  args:
    title: Scratchpad
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  outputs:
    scratch_id: result
- name: get_doc returns the created doc
  type: call
  app: '{{eng_docs_ctx}}'
  method: get_doc
  args:
    id: '{{roadmap_id}}'
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  outputs:
    roadmap_dto: result
- name: Assert roadmap DTO populated
  type: assert
  statements:
  - is_set({{roadmap_dto}})
- name: Reject get_doc on unknown id
  type: call
  app: '{{eng_docs_ctx}}'
  method: get_doc
  args:
    id: doc-does-not-exist
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  expected_failure: true
- name: edit_doc title only
  type: call
  app: '{{eng_docs_ctx}}'
  method: edit_doc
  args:
    id: '{{roadmap_id}}'
    title: Roadmap (v2)
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
- name: edit_doc renames again
  type: call
  app: '{{eng_docs_ctx}}'
  method: edit_doc
  args:
    id: '{{roadmap_id}}'
    title: Q1 and Q2 plan
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
- name: edit_doc renames to the final title
  type: call
  app: '{{eng_docs_ctx}}'
  method: edit_doc
  args:
    id: '{{roadmap_id}}'
    title: Roadmap (final)
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
- name: edit_doc can clear the title to an empty string
  type: call
  app: '{{eng_docs_ctx}}'
  method: edit_doc
  args:
    id: '{{scratch_id}}'
    title: ''
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
- name: Reject edit_doc on unknown id
  type: call
  app: '{{eng_docs_ctx}}'
  method: edit_doc
  args:
    id: doc-does-not-exist
    title: x
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  expected_failure: true
- name: add_tag - "planning"
  type: call
  app: '{{eng_docs_ctx}}'
  method: add_tag
  args:
    id: '{{roadmap_id}}'
    tag: planning
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
- name: add_tag - duplicate is idempotent (no-op on a set)
  type: call
  app: '{{eng_docs_ctx}}'
  method: add_tag
  args:
    id: '{{roadmap_id}}'
    tag: planning
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
- name: add_tag - second tag "urgent"
  type: call
  app: '{{eng_docs_ctx}}'
  method: add_tag
  args:
    id: '{{roadmap_id}}'
    tag: urgent
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
- name: Reject add_tag with empty string
  type: call
  app: '{{eng_docs_ctx}}'
  method: add_tag
  args:
    id: '{{roadmap_id}}'
    tag: ''
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  expected_failure: true
- name: Reject add_tag on unknown doc
  type: call
  app: '{{eng_docs_ctx}}'
  method: add_tag
  args:
    id: doc-does-not-exist
    tag: planning
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  expected_failure: true
- name: remove_tag - drop "urgent"
  type: call
  app: '{{eng_docs_ctx}}'
  method: remove_tag
  args:
    id: '{{roadmap_id}}'
    tag: urgent
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
- name: Reject remove_tag on unknown doc
  type: call
  app: '{{eng_docs_ctx}}'
  method: remove_tag
  args:
    id: doc-does-not-exist
    tag: whatever
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  expected_failure: true
- name: archive_doc hides Scratchpad from default list
  type: call
  app: '{{eng_docs_ctx}}'
  method: archive_doc
  args:
    id: '{{scratch_id}}'
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
- name: list_docs default excludes archived
  type: call
  app: '{{eng_docs_ctx}}'
  method: list_docs
  args:
    include_archived: false
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  outputs:
    docs_default: result
- name: Assert default list returned
  type: assert
  statements:
  - is_set({{docs_default}})
- name: list_docs include_archived=true shows archived
  type: call
  app: '{{eng_docs_ctx}}'
  method: list_docs
  args:
    include_archived: true
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  outputs:
    docs_all: result
- name: Assert include-archived list returned
  type: assert
  statements:
  - is_set({{docs_all}})
- name: unarchive_doc restores Scratchpad
  type: call
  app: '{{eng_docs_ctx}}'
  method: unarchive_doc
  args:
    id: '{{scratch_id}}'
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
- name: Reject archive_doc on unknown doc
  type: call
  app: '{{eng_docs_ctx}}'
  method: archive_doc
  args:
    id: doc-does-not-exist
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  expected_failure: true
- name: Reject unarchive_doc on unknown doc
  type: call
  app: '{{eng_docs_ctx}}'
  method: unarchive_doc
  args:
    id: doc-does-not-exist
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  expected_failure: true
- name: Bob reads list_docs (Alice's creates + edits + tags)
  type: call
  app: '{{eng_docs_ctx}}'
  method: list_docs
  args:
    include_archived: false
  account: calimero-node-2
  as_key: '{{bob_docs_key}}'
  outputs:
    docs_bob: result
- name: Assert Bob sees Alice's docs
  type: assert
  statements:
  - is_set({{docs_bob}})
- name: Bob reads Roadmap by id (cross-node get_doc)
  type: call
  app: '{{eng_docs_ctx}}'
  method: get_doc
  args:
    id: '{{roadmap_id}}'
  account: calimero-node-2
  as_key: '{{bob_docs_key}}'
  outputs:
    roadmap_dto_bob: result
- name: Assert Bob sees Roadmap with merged state
  type: assert
  statements:
  - is_set({{roadmap_dto_bob}})
- name: Bob cannot delete Alice's Roadmap
  type: call
  app: '{{eng_docs_ctx}}'
  method: delete_doc
  args:
    id: '{{roadmap_id}}'
  account: calimero-node-2
  as_key: '{{bob_docs_key}}'
  expected_failure: true
- name: Bob creates his own doc
  type: call
  app: '{{eng_docs_ctx}}'
  method: create_doc
  args:
    title: Bob's Notes
  account: calimero-node-2
  as_key: '{{bob_docs_key}}'
  outputs:
    bob_doc_id: result
- name: Alice reads Bob's doc (CRDT convergence)
  type: call
  app: '{{eng_docs_ctx}}'
  method: get_doc
  args:
    id: '{{bob_doc_id}}'
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  outputs:
    bob_doc_from_alice: result
- name: Assert Bob's doc visible to Alice
  type: assert
  statements:
  - is_set({{bob_doc_from_alice}})
- name: delete_doc - remove Scratchpad
  type: call
  app: '{{eng_docs_ctx}}'
  method: delete_doc
  args:
    id: '{{scratch_id}}'
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
- name: Reject delete_doc on already-deleted id (not found)
  type: call
  app: '{{eng_docs_ctx}}'
  method: delete_doc
  args:
    id: '{{scratch_id}}'
  account: calimero-node-1
  as_key: '{{alice_docs_key}}'
  expected_failure: true
- name: Bob's list_docs reflects the delete
  type: call
  app: '{{eng_docs_ctx}}'
  method: list_docs
  args:
    include_archived: true
  account: calimero-node-2
  as_key: '{{bob_docs_key}}'
  outputs:
    docs_bob_after_delete: result
- name: Assert post-delete list returned
  type: assert
  statements:
  - is_set({{docs_bob_after_delete}})
- name: Add Bob to Backend, so he may see where it goes
  type: team_add
  org: '{{namespace_id}}'
  team: '{{backend_group}}'
  members:
  - '{{bob_identity}}'
  account: calimero-node-1
- name: Wait for the move to propagate to Bob
  type: wait
  seconds: 1.0
  message: Group-tree governance needs to reach Bob's node
- name: Create restricted subgroup (no Bob cascade)
  type: create_team
  org: '{{namespace_id}}'
  team_name: private-alice
  outputs:
    private_group: teamId
  account: calimero-node-1
- name: Create docs context inside restricted subgroup
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  app_name: docs
  org: '{{namespace_id}}'
  outputs:
    private_docs_ctx: contextId
    alice_private_key: memberPublicKey
- name: Alice writes a doc into the private folder
  type: call
  app: '{{private_docs_ctx}}'
  method: create_doc
  args:
    title: Private note
  account: calimero-node-1
  as_key: '{{alice_private_key}}'
- name: Wait for the restricted folder governance to reach Bob
  type: wait
  seconds: 1.0
  message: Group governance needs to reach Bob's node before his join attempt
- name: Bob attempts to join the restricted docs context (must be rejected)
  type: http
  method: get
  path: apps/{{private_docs_ctx}}
  account: calimero-node-2
  expected_failure: true
