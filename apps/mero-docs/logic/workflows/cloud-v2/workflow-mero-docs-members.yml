# Ported from workflow-mero-docs-members.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert statement on a dropped step's output x7: checks what the dropped steps did
#   get_member_capabilities x8: capabilities are v1 governance
#   set_default_capabilities (on a subgroup) x1: checks what the dropped steps did
#   set_default_visibility x2: subgroup visibility is v1 governance
name: Mero Docs E2E - Member Management + Role Changes
description: 'Coverage for the Phase 8-E surface: adding/removing members, changing their roles, and mutating
  capability bitmasks directly. Maps to the NamespaceMembersPanel + FolderSharingPanel user flows. The
  main workflow-mero-docs-e2e.yml only does a one-shot member add; this workflow exercises the full member
  lifecycle.

  Two nodes (Alice = namespace admin, Bob = member). Alice invites Bob, changes his role (update_member_role),
  sets precise capabilities (set_member_capabilities), verifies via get_member_capabilities, and finally
  removes him. Negative paths cover: non-admin attempting admin ops, removing non-member, setting caps
  on non-member.

  Also exercises the namespace-level membership root (i.e. namespaceId-as-rootGroupId) so the NamespaceMembersPanel''s
  useFolderMembership(rootGroupId) + useMemberCaps(rootGroupId, identity) binding has backend coverage.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3240
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install bundle on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_docs.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.mero-drive-docs
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Alice creates namespace
  type: create_org
  org_name: Alice creates namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Create namespace invitation for Bob
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    ns_invite: token
- name: Wait for namespace gossip to reach Node 2
  type: wait
  seconds: 1.0
- name: Bob joins the namespace
  type: redeem_invite
  token: '{{ns_invite}}'
  account: calimero-node-2
- type: whoami
  account: calimero-node-2
  outputs:
    bob_account: publicKey
- name: list_group_members on the namespace root
  type: team_list
  org: '{{namespace_id}}'
  account: calimero-node-1
- name: Alice creates a subgroup (folder)
  type: create_team
  org: '{{namespace_id}}'
  team_name: shared-folder
  join: invite
  outputs:
    folder_group: teamId
  account: calimero-node-1
- name: Alice adds Bob to the folder subgroup
  type: team_add
  org: '{{namespace_id}}'
  team: '{{folder_group}}'
  members:
  - '{{bob_account}}'
  role: member
  account: calimero-node-1
- name: list_group_members on the subgroup - Bob is in
  type: team_get
  org: '{{namespace_id}}'
  team: '{{folder_group}}'
  account: calimero-node-1
- name: Alice promotes Bob to Admin
  type: team_add
  org: '{{namespace_id}}'
  team: '{{folder_group}}'
  members:
  - '{{bob_account}}'
  role: lead
  account: calimero-node-1
- name: Alice demotes Bob back to Member
  type: team_add
  org: '{{namespace_id}}'
  team: '{{folder_group}}'
  members:
  - '{{bob_account}}'
  role: member
  account: calimero-node-1
- name: Set Bob to Viewer preset (CAN_JOIN_OPEN_SUBGROUPS = 4)
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 4
  account: calimero-node-1
  member: '{{bob_account}}'
  team: '{{folder_group}}'
- name: Set Bob to Editor preset (CAN_JOIN_OPEN_SUBGROUPS|CAN_CREATE_SUBGROUP|CAN_CREATE_CONTEXT = 37)
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 37
  account: calimero-node-1
  member: '{{bob_account}}'
  team: '{{folder_group}}'
- name: Set Bob to Manager preset (Editor + CAN_INVITE_MEMBERS|MANAGE_MEMBERS|CAN_MANAGE_VISIBILITY|CAN_DELETE_SUBGROUP|CAN_MANAGE_METADATA
    = 495)
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 495
  account: calimero-node-1
  member: '{{bob_account}}'
  team: '{{folder_group}}'
- name: Set Bob to a non-preset bitmask (CAN_MANAGE_METADATA = 256 only)
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 256
  account: calimero-node-1
  member: '{{bob_account}}'
  team: '{{folder_group}}'
- name: Wait for cap change to propagate to Bob's node
  type: wait
  seconds: 1.0
- name: Alice removes Bob from the subgroup
  type: team_remove
  org: '{{namespace_id}}'
  team: '{{folder_group}}'
  members:
  - '{{bob_account}}'
  account: calimero-node-1
- name: list_group_members - Bob no longer in the subgroup
  type: team_get
  org: '{{namespace_id}}'
  team: '{{folder_group}}'
  account: calimero-node-1
- name: delete_group - tear down the subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{folder_group}}'
  account: calimero-node-1
