[package]
# The DIRECTORY, cargo package and npm package must be one value (publish-bundle.yml
# uses it as both `apps/$APP/logic` and `pnpm -F $APP`). The registry PACKAGE id
# below predates the rename and must not follow it: a new id publishes a separate app.
name        = "mero-docs"
version     = "10.1.3"
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.calimero]
package     = "com.calimero.mero-drive-docs"
name        = "Mero Docs"
description = "Namespace-based document workspace - registry + docs multi-service bundle."
author      = "Calimero"
slug        = "com.calimero.mero-drive-docs"
license     = "MIT"
category = "productivity"
tags        = ["productivity", "documents", "collaboration"]
github      = "https://github.com/calimero-network/apps"
docs        = "https://docs.calimero.network"
# Relative to the directory of the table that supplied the metadata — this
# package's own dir, so logic/assets/icon-512x512.png.
icon        = "assets/icon-512x512.png"
# ⚠️ WAS "0.1.0" — cargo-mero's placeholder floor, which nobody verified. This
# contract is built against rc.26, and a node older than that installs the bundle
# happily and then dies at context creation with `link error: unknown import`.
# check-app-metadata.sh now asserts this equals the workspace value.
min-runtime-version = "0.11.0-rc.47"
frontend    = "https://mero-drive.vercel.app"

# Two services, ONE bundle. Declared at PACKAGE level, which cargo-mero supports
# for "a crate that cannot declare a workspace table of its own (e.g. a member of
# a larger workspace)" — `[workspace.metadata.calimero]` is unusable here because
# cargo-mero REPLACES an app's package table with the workspace one, masking every
# other app in the repo.
#
# Service NAMES are unchanged (`docs`, `registry`): they are what the frontend and
# every scenario pass as `serviceName` at context creation, and a mismatch against
# the bundle's services list fails with a bare 500.
[[package.metadata.calimero.services]]
name  = "docs"
crate = "mero-docs"

[[package.metadata.calimero.services]]
name  = "registry"
crate = "mero-docs-registry"

[dependencies]
mero-docs-types        = { path = "crates/types" }
bs58                    = { workspace = true }
calimero-sdk            = { workspace = true }
calimero-storage        = { workspace = true }
calimero-storage-macros = { workspace = true }

[dev-dependencies]
calimero-storage = { workspace = true, features = ["testing"] }
serial_test      = "3.2"

# NOTE: no [profile.*] — cargo ignores profiles in a workspace member and
# `cargo mero build` then fails with `profile 'app-release' is not defined`.
