# XcodeGen spec for the native iOS Mero Docs app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroDocs.xcodeproj (not committed)
#   open MeroDocs.xcodeproj
#
# Everything that is not a view (the generated contract client, the document
# reader, comment threads, the view models) is the local SwiftPM package DocsCore/, which
# `swift test --package-path DocsCore` builds and tests on macOS.
#
# The swift-sdk is pinned to the head of its Calimero 1.0 port (swift-sdk#85,
# branch feat/calimero-1.0); it moves to the merge commit once that lands. Keep
# both pins (here and DocsCore/Package.swift) equal.
name: MeroDocs

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: a1ec644130d4405a1bab7547654b1442cc559b49
  DocsCore:
    path: DocsCore

targets:
  MeroDocs:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Assets.xcassets
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Docs
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          # The node's consent page returns here (`mero-docs://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.docs.consent
            CFBundleURLSchemes: [mero-docs]
        # Which cluster sign-in uses (Calimero 1.0). MeroNodeURL: a node of your
        # Calimero Cloud cluster (from the cloud.calimero.network console);
        # empty = the sign-in screen asks. MeroDevNodeURL: what the "Development
        # node" field starts with (`merod local`, mock attestation allowed).
        # See ../README.md.
        MeroDocsCallbackScheme: mero-docs
        MeroDocsCallbackHost: ""
        MeroDocsCallbackPath: /consent
        MeroNodeURL: ""
        MeroDevNodeURL: "http://localhost:2501"
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # http only to a node on the local network (localhost, *.local, an IP literal).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # A passkey on a real cluster belongs to its relying party (the node's
    # --rp-id). To sign in with the device's passkey there, add an entitlements
    # file with `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`.
    # A development node uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.docs
        PRODUCT_NAME: MeroDocs
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: DocsCore
        product: DocsCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # The demo tour (`-MeroDemo YES`, Debug only): every main screen and sheet
  # on fixture data, with a named screenshot at each stop.
  MeroDocsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MeroDocs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.docs.uitests
        TEST_TARGET_NAME: MeroDocs
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  MeroDocs:
    build:
      targets:
        MeroDocs: all
    test:
      config: Debug
      targets: [MeroDocsUITests]
