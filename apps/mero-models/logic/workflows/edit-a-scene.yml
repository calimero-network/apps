name: Mero Models E2E
description: >
  Two nodes share one 3D scene and converge on it.

  Walks the loop a production session takes: the creator adds a cube and a
  mesh object, uploads the mesh's vertices and a texture as BLOBS and points
  the scene at them, and the second node fetches both blobs from the first —
  the part a reference in state cannot prove on its own. The second member is
  refused as a viewer, granted the editor role, checks the mesh out (and the
  first node is then refused a new version of it), saves a named version,
  checks it back in, and every change — objects, versions, check-outs — is
  read back on the OTHER node.

force_pull_image: false
nuke_on_start: true
near_devnet: false

# Clears merod's default public bootstrap nodes so the two containers find
# each other instead of dialling the devnet until the join times out.
e2e_mode: true

nodes:
  count: 2
  # Matched to the SDK tag in the root Cargo.toml (asserted by
  # scripts/check-app-metadata.sh): an older node dies at context creation
  # with `unknown import`.
  image: ghcr.io/calimero-network/merod:0.11.0-rc.90
  prefix: models-node
  # mDNS is opt-in since core rc.26 and merobox does not pass the flag.
  mdns: true

steps:
  - name: Install application on models-node-1
    type: install_application
    node: models-node-1
    path: dist/com.calimero.mero-models.mpk
    dev: true
    outputs:
      app_id: applicationId

  # Installed on EVERY node: a peer does not serve bytecode to a joiner.
  - name: Install application on models-node-2
    type: install_application
    node: models-node-2
    path: dist/com.calimero.mero-models.mpk
    dev: true

  - name: Assert application installed
    type: assert
    statements:
      - "is_set({{app_id}})"

  # `create_mesh` joins internally and races the KeyDelivery window; 12s is
  # what scaffolding-e2e's late-joiner scenario found to be enough.
  - name: Settle before the mesh joins
    type: wait
    seconds: 12

  - name: Create mesh with node-2
    type: create_mesh
    context_node: models-node-1
    application_id: "{{app_id}}"
    nodes:
      - models-node-2
    # `init(name)` takes an argument, so the context cannot be created without
    # it — an omitted params is a bare 500 at context creation.
    params: '{"name": "Two nodes"}'
    outputs:
      context_id: contextId
      node1_key: memberPublicKey

  - name: Verify mesh keys are populated
    type: assert
    statements:
      - "is_set({{context_id}})"
      - "is_set({{node1_key}})"
      - "is_set({{public_key_models-node-2}})"

  # ─── the creator builds something ─────────────────────────────────────────

  - name: node-1 joins as Ada
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: join
    args:
      name: "Ada"
      now: 1700000001000

  - name: node-1 adds a cube and a mesh object under it
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: put_objects
    args:
      now: 1700000002000
      objects:
        - id: "cube-1"
          name: "Body"
          kind: "cube"
          parent: ""
          position: { x: 0, y: 0.5, z: 0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
          visible: true
          material: { color: "#c8ccd4", metalness: 0, roughness: 0.6, opacity: 1, emissive: "#000000", wireframe: false, flat_shading: false, base_color_map: "", normal_map: "", normal_scale: 1, orm_map: "", emissive_map: "" }
          segments: 32
          intensity: 0
          created_by: ""
          created_at: 0
          updated_at: 0
        - id: "tri-1"
          name: "Fin"
          kind: "mesh"
          parent: "cube-1"
          position: { x: 0, y: 1, z: 0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
          visible: true
          material: { color: "#e07a2f", metalness: 0, roughness: 0.5, opacity: 1, emissive: "#000000", wireframe: false, flat_shading: true, base_color_map: "", normal_map: "", normal_scale: 1, orm_map: "", emissive_map: "" }
          segments: 3
          intensity: 0
          created_by: ""
          created_at: 0
          updated_at: 0

  # The vertices live in a blob: a real mesh in the app's own format
  # (test-files/fin.mmsh, written by meshcodec.ts — 36 bytes, one triangle
  # with UVs). The upload carries the context id, so it is announced to
  # node-2 at once; the contract only stores the reference.
  - name: node-1 uploads the fin's mesh blob
    type: upload_blob
    node: models-node-1
    context_id: "{{context_id}}"
    file_path: workflows/test-files/fin.mmsh
    outputs:
      fin_blob: blob_id

  - name: node-1 points the mesh object at the blob
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: put_mesh
    args:
      now: 1700000003000
      mesh:
        id: "tri-1"
        blob_id: "{{fin_blob}}"
        size: 36
        vertex_count: 3
        triangle_count: 1
        has_uvs: true
        author: ""
        message: "blockout"
        updated_at: 0

  - name: node-1 uploads a texture image
    type: upload_blob
    node: models-node-1
    context_id: "{{context_id}}"
    file_path: workflows/test-files/fin-albedo.png
    outputs:
      tex_blob: blob_id

  - name: node-1 adds the texture
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: put_texture
    args:
      now: 1700000003500
      texture:
        id: "tex-fin"
        name: "Fin albedo"
        blob_id: "{{tex_blob}}"
        size: 1729
        width: 192
        height: 192
        mime: "image/png"
        color_space: "srgb"
        author: ""
        message: ""
        updated_at: 0

  - name: node-1 names the scene and sets its background
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: set_environment
    args:
      now: 1700000004000
      environment:
        name: "Robot"
        background: "#101418"
        ambient_color: "#ffffff"
        ambient_intensity: 0.5
        updated_at: 0

  - name: Wait for the scene to reach node-2
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - models-node-1
      - models-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  # ─── the second member arrives as a viewer ────────────────────────────────

  - name: node-2 joins as Bea
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: join
    args:
      name: "Bea"
      now: 1700000005000

  - name: node-2 reads the scene
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: get_scene
    args: {}
    outputs:
      n2_scene: result
      # The account the CONTRACT says node-2 is — the id a grant has to name.
      n2_account: result.output.me

  - name: Assert node-2 sees the creator's scene, as a viewer
    type: json_assert
    statements:
      - 'json_subset({{n2_scene}}, {"output": {"name": "Robot", "object_count": 2, "mesh_count": 1, "texture_count": 1, "my_role": "viewer"}})'
      - 'json_subset({{n2_scene}}, {"output": {"environment": {"background": "#101418"}}})'

  - name: node-2 reads the objects
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: get_objects_by_ids
    args:
      ids: ["tri-1"]
    # Fields by path: merobox's json_subset matches a LIST element only when
    # the whole element is equal, so a partial object inside an array never
    # matches.
    outputs:
      n2_tri_id: result.output.0.id
      n2_tri_parent: result.output.0.parent
      n2_tri_kind: result.output.0.kind

  - name: Assert the hierarchy replicated
    type: assert
    statements:
      - "{{n2_tri_id}} == tri-1"
      - "{{n2_tri_parent}} == cube-1"
      - "{{n2_tri_kind}} == mesh"

  - name: node-2 lists the mesh references
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: list_meshes
    args: {}
    outputs:
      n2_ref_id: result.output.0.id
      n2_ref_blob: result.output.0.blob_id
      n2_ref_vertices: result.output.0.vertex_count
      n2_ref_triangles: result.output.0.triangle_count

  - name: Assert the reference names node-1's blob
    type: assert
    statements:
      - "{{n2_ref_id}} == tri-1"
      - "{{n2_ref_blob}} == {{fin_blob}}"
      - "{{n2_ref_vertices}} == 3"
      - "{{n2_ref_triangles}} == 1"

  # The bytes themselves, fetched by node-2 from the context's peers — the
  # one thing a reference in state cannot prove on its own.
  - name: node-2 fetches the mesh blob from node-1
    type: download_blob
    node: models-node-2
    context_id: "{{context_id}}"
    blob_id: "{{fin_blob}}"
    expected_size: 36

  - name: node-2 fetches the texture blob from node-1
    type: download_blob
    node: models-node-2
    context_id: "{{context_id}}"
    blob_id: "{{tex_blob}}"
    expected_size: 1729

  - name: node-2 lists the textures
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: list_textures
    args: {}
    outputs:
      n2_tex_id: result.output.0.id
      n2_tex_blob: result.output.0.blob_id
      n2_tex_width: result.output.0.width

  - name: Assert the texture replicated
    type: assert
    statements:
      - "{{n2_tex_id}} == tex-fin"
      - "{{n2_tex_blob}} == {{tex_blob}}"
      - "{{n2_tex_width}} == 192"

  - name: node-2 reads the fin's history
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: list_history
    args:
      asset_id: "tri-1"
    outputs:
      n2_v1_number: result.output.0.number
      n2_v1_current: result.output.0.current
      n2_v1_message: result.output.0.message

  - name: Assert one version, current, with its note
    type: assert
    statements:
      - "{{n2_v1_number}} == 1"
      - "{{n2_v1_current}} == True"
      - "{{n2_v1_message}} == blockout"

  - name: node-2 tries to check the fin out as a viewer
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: check_out
    args:
      ids: ["tri-1"]
      hours: 1
      now: 1700000005500
    expected_failure: true
    outputs:
      viewer_checkout_error: error

  - name: Assert a viewer cannot check out
    type: assert
    statements:
      - "is_set({{viewer_checkout_error}})"

  - name: node-2 asks its own role
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: my_role
    args: {}
    outputs:
      n2_role_before: result

  - name: Assert node-2 is a viewer
    type: json_assert
    statements:
      - 'json_subset({{n2_role_before}}, {"output": "viewer"})'

  # A viewer's write is refused. The flag alone only marks the step
  # allowed-to-fail, so the error is captured and asserted.
  - name: node-2 tries to move the cube before it may
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: delete_objects
    args:
      ids: ["cube-1"]
      now: 1700000006000
    expected_failure: true
    outputs:
      viewer_error: error

  - name: Assert the viewer was refused
    type: assert
    statements:
      - "is_set({{viewer_error}})"

  - name: node-2 tries to clear the scene
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: clear_scene
    args: {}
    expected_failure: true
    outputs:
      clear_error: error

  - name: Assert only an admin clears
    type: assert
    statements:
      - "is_set({{clear_error}})"

  # ─── the creator makes them an editor ─────────────────────────────────────

  - name: Wait for node-2's profile to reach node-1
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - models-node-1
      - models-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: node-1 grants node-2 the editor role
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: grant_editor
    args:
      member: "{{n2_account}}"

  - name: node-1 lists the members
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: get_members
    args: {}
    # Oldest first: Ada joined before Bea.
    outputs:
      n1_m0_name: result.output.0.name
      n1_m0_role: result.output.0.role
      n1_m1_name: result.output.1.name
      n1_m1_role: result.output.1.role

  - name: Assert both members, with their roles
    type: assert
    statements:
      - "{{n1_m0_name}} == Ada"
      - "{{n1_m0_role}} == admin"
      - "{{n1_m1_name}} == Bea"
      - "{{n1_m1_role}} == editor"

  - name: Wait for the grant to reach node-2
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - models-node-1
      - models-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  # ─── a check-out holds on the other node ──────────────────────────────────

  - name: node-2 checks the fin out
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: check_out
    args:
      ids: ["tri-1"]
      hours: 8
      now: 1700000008000

  - name: Wait for the check-out to reach node-1
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - models-node-1
      - models-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: node-1 lists the check-outs
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: list_locks
    args:
      now: 1700000009000
    outputs:
      n1_lock_asset: result.output.0.asset_id
      n1_lock_holder: result.output.0.holder
      n1_lock_mine: result.output.0.mine

  - name: Assert node-1 sees node-2 holding the fin
    type: assert
    statements:
      - "{{n1_lock_asset}} == tri-1"
      - "{{n1_lock_holder}} == {{n2_account}}"
      - "{{n1_lock_mine}} == False"

  - name: node-1 tries to give the fin a new version while it is checked out
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: put_mesh
    args:
      now: 1700000009500
      mesh:
        id: "tri-1"
        blob_id: "{{fin_blob}}"
        size: 36
        vertex_count: 3
        triangle_count: 1
        has_uvs: true
        author: ""
        message: "not mine to change"
        updated_at: 0
    expected_failure: true
    outputs:
      locked_error: error

  - name: Assert the check-out held on node-1
    type: assert
    statements:
      - "is_set({{locked_error}})"

  # ─── both edit ────────────────────────────────────────────────────────────

  - name: node-2 moves the fin out from under the cube
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: put_objects
    args:
      now: 1700000010000
      objects:
        - id: "tri-1"
          name: "Fin"
          kind: "mesh"
          parent: ""
          position: { x: 3, y: 0, z: 0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 2, y: 2, z: 2 }
          visible: true
          material: { color: "#e07a2f", metalness: 0, roughness: 0.5, opacity: 1, emissive: "#000000", wireframe: false, flat_shading: true, base_color_map: "", normal_map: "", normal_scale: 1, orm_map: "", emissive_map: "" }
          segments: 3
          intensity: 0
          created_by: ""
          created_at: 0
          updated_at: 0

  - name: node-2 saves a named version of the fin
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: put_mesh
    args:
      now: 1700000010500
      mesh:
        id: "tri-1"
        blob_id: "{{fin_blob}}"
        size: 36
        vertex_count: 3
        triangle_count: 1
        has_uvs: true
        author: ""
        message: "approved"
        updated_at: 0

  - name: node-2 checks the fin back in
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: check_in
    args:
      ids: ["tri-1"]

  - name: Wait for node-2's edit to reach node-1
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - models-node-1
      - models-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: node-1 reads every object
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: get_objects
    args: {}
    # Ordered by creation, then id: both were created in one call, and
    # "cube-1" sorts before "tri-1".
    outputs:
      n1_o0_id: result.output.0.id
      n1_o1_id: result.output.1.id
      n1_o1_parent: result.output.1.parent
      n1_o1_x: result.output.1.position.x
      n1_o1_scale: result.output.1.scale.x
      n1_o1_created: result.output.1.created_at

  # Re-parented and moved by the OTHER node; `created_at` kept from node-1's
  # first write, whatever node-2 sent.
  - name: Assert node-1 sees node-2's edit
    type: assert
    statements:
      - "{{n1_o0_id}} == cube-1"
      - "{{n1_o1_id}} == tri-1"
      - "{{n1_o1_x}} == 3.0"
      - "{{n1_o1_scale}} == 2.0"
      - "{{n1_o1_created}} == 1700000002000"

  - name: Assert the fin left the cube
    type: json_assert
    statements:
      - 'json_equal({{n1_o1_parent}}, "")'

  - name: node-1 reads the fin's history
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: list_history
    args:
      asset_id: "tri-1"
    outputs:
      n1_v2_number: result.output.1.number
      n1_v2_message: result.output.1.message
      n1_v2_author: result.output.1.author
      n1_v2_current: result.output.1.current

  - name: Assert node-2's version is on node-1, by node-2
    type: assert
    statements:
      - "{{n1_v2_number}} == 2"
      - "{{n1_v2_message}} == approved"
      - "{{n1_v2_author}} == {{n2_account}}"
      - "{{n1_v2_current}} == True"

  - name: node-1 lists the check-outs after the check-in
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: list_locks
    args:
      now: 1700000011500
    outputs:
      n1_locks_after: result

  - name: Assert nothing is checked out
    type: json_assert
    statements:
      - 'json_equal({{n1_locks_after}}, {"output": []})'

  - name: node-1 deletes the texture
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: delete_textures
    args:
      ids: ["tex-fin"]
      now: 1700000011800

  - name: node-1 deletes the cube
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: delete_objects
    args:
      ids: ["cube-1"]
      now: 1700000012000

  - name: Wait for the delete to reach node-2
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - models-node-1
      - models-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: node-2 reads the scene after the delete
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: get_scene
    args: {}
    outputs:
      n2_after_delete: result

  - name: Assert one object is left and node-2 is an editor
    type: json_assert
    statements:
      - 'json_subset({{n2_after_delete}}, {"output": {"object_count": 1, "mesh_count": 1, "texture_count": 0, "my_role": "editor"}})'

  # ─── and the creator takes it back ────────────────────────────────────────

  - name: node-1 revokes node-2's editor role
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: revoke_editor
    args:
      member: "{{n2_account}}"

  - name: node-1 clears the scene
    type: call
    node: models-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{node1_key}}"
    method: clear_scene
    args: {}

  - name: Wait for the revoke and the clear to reach node-2
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - models-node-1
      - models-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: node-2 reads the scene after the clear
    type: call
    node: models-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_models-node-2}}"
    method: get_scene
    args: {}
    outputs:
      n2_cleared: result

  - name: Assert the scene is empty and node-2 is a viewer again
    type: json_assert
    statements:
      - 'json_subset({{n2_cleared}}, {"output": {"object_count": 0, "mesh_count": 0, "texture_count": 0, "my_role": "viewer"}})'
