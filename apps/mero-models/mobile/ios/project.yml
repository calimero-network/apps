# XcodeGen spec for the native iOS Mero Models app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroModels.xcodeproj (not committed)
#   open MeroModels.xcodeproj
#
# Everything that is not a view (the generated contract client, the invitation
# format, the view models) is the local SwiftPM package ModelsCore/, which
# `swift test --package-path ModelsCore` builds and tests on macOS.
#
# The 3D viewport is ../viewer/dist/viewer.html, bundled as a resource: the web
# studio's own three.js drawing code, built into one local file (no CDN).
#
# The swift-sdk is pinned to its `main` merge commit of PR #84; keep both pins
# (here and ModelsCore/Package.swift) equal.
name: MeroModels

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: c9ca1a06ea3b04c24d943cbb0e1d9b30eb4c5a8f
  ModelsCore:
    path: ModelsCore

targets:
  MeroModels:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Assets.xcassets
      - path: ../viewer/dist/viewer.html
        buildPhase: resources
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Models
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          # The wallet returns here after Cloud sign-in (`mero-models://enrol#credential=…`).
          - CFBundleURLName: network.calimero.models.enrol
            CFBundleURLSchemes: [mero-models]
          # Invitations in the desktop launcher's form: `calimero://com.calimero.mero-models/join?invitation=…`.
          - CFBundleURLName: network.calimero.models.links
            CFBundleURLSchemes: [calimero]
        # Where sign-in goes. Empty = the SDK's defaults (the hosted Calimero
        # wallet and Cloud manager). See README.md.
        MeroModelsCallbackScheme: mero-models
        MeroModelsCallbackHost: ""
        MeroModelsCallbackPath: /enrol
        MeroCloudBaseURL: ""
        MeroWalletURL: ""
        MeroRegistryURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.models
        PRODUCT_NAME: MeroModels
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ModelsCore
        product: ModelsCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

schemes:
  MeroModels:
    build:
      targets:
        MeroModels: all
