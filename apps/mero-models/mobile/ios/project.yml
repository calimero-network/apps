# XcodeGen spec for the native iOS Mero Models app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroModels.xcodeproj (not committed)
#   open MeroModels.xcodeproj
#
# Everything that is not a view (the generated contract client, the invitation
# format, the view models) is the local SwiftPM package ModelsCore/, which
# `swift test --package-path ModelsCore` builds and tests on macOS.
#
# The 3D viewport is ../viewer/dist/viewer.html, bundled as a resource: the web
# studio's own three.js drawing code, built into one local file (no CDN).
#
# The swift-sdk is pinned to the head of its Calimero 1.0 branch
# (calimero-network/swift-sdk#85, `feat/calimero-1.0`); the pin moves to that
# PR's merge commit once it lands. Keep both pins (here and
# ModelsCore/Package.swift) equal.
name: MeroModels

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: a1ec644130d4405a1bab7547654b1442cc559b49
  ModelsCore:
    path: ModelsCore

targets:
  MeroModels:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Assets.xcassets
      - path: ../viewer/dist/viewer.html
        buildPhase: resources
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Models
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          # The node's consent page returns here (`mero-models://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.models.consent
            CFBundleURLSchemes: [mero-models]
          # Invitations in the desktop launcher's form: `calimero://com.calimero.mero-models/join?invitation=…`.
          - CFBundleURLName: network.calimero.models.links
            CFBundleURLSchemes: [calimero]
        # The Calimero 1.0 cluster. MeroNodeURL: a node from Calimero Cloud's
        # console (empty = sign-in asks for one); MeroNodes: the cluster's other
        # nodes, comma-separated, for failover; MeroAllowMock: YES only for a
        # `merod local` cluster (mock attestation). See ../README.md.
        MeroNodeURL: ""
        MeroNodes: ""
        MeroAllowMock: "NO"
        MeroPackageVersion: ""
        # Where the node's consent page returns to.
        MeroModelsCallbackScheme: mero-models
        MeroModelsCallbackHost: ""
        MeroModelsCallbackPath: /consent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.models
        PRODUCT_NAME: MeroModels
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ModelsCore
        product: ModelsCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

schemes:
  MeroModels:
    build:
      targets:
        MeroModels: all
