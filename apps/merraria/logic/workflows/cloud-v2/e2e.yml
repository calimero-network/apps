# Ported from e2e.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   set_default_capabilities x1: capabilities are v1 governance
#   sync_group x1: replication is synchronous
#   wait_for_sync x5: replication is synchronous: a read sees every committed write
name: Merraria — shared 2D mining world (2-node e2e)
description: 'Proves the core thesis of merraria: a Calimero context carries a whole 2D multiplayer mining
  world as nothing but a tile-override diff + presence.

  Two nodes join one world (context). Both players join, Alice builds a plank shelter with a torch, Bob
  sees it via get_overrides, Bob digs one tile out (an explicit t=0 override — never a map-remove), Alice
  sees the dig, and the roster shows both miners online. Terrain (hills, caves, ores, lakes) never crosses
  the network — every client regenerates it from the seed.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3600
accounts:
- calimero-node-1
- calimero-node-2
- calimero-node-2-id1
steps:
- name: Install application on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/merraria.wasm'
  outputs:
    app_id: hash
  account: calimero-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create namespace
  type: create_org
  org_name: Create namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Generate identity for Node 2
  type: whoami
  account: calimero-node-2-id1
  outputs:
    bob_identity: publicKey
- name: Wait for identity propagation
  type: wait
  seconds: 1.0
- name: Node 1 creates invitation for Node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invite_bob: token
- name: Settle before the namespace join (cold-join KeyDelivery)
  type: wait
  seconds: 1.0
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{invite_bob}}'
  account: calimero-node-2
- name: Settle after namespace join
  type: wait
  seconds: 1.0
- name: Node 1 creates the world
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/merraria.wasm'
  app_name: Node 1 creates the world
  init_args: '{"name": "surface", "seed": 42, "now": 1752264000}'
  org: '{{namespace_id}}'
  outputs:
    world_id: appId
    alice_key: memberPublicKey
- name: Settle after sync
  type: wait
  seconds: 1.0
- name: Bob joins the world context
  type: whoami
  account: calimero-node-2
  outputs:
    bob_key: publicKey
- name: Bob reads world meta (seed + shared day clock)
  type: call
  app: '{{world_id}}'
  method: world_meta
  args: {}
  account: calimero-node-2
  as_key: '{{bob_key}}'
  outputs:
    meta_bob: rpc
- name: Assert the seed replicated to Node 2
  type: assert
  statements:
  - contains({{meta_bob}}, "42")
  - contains({{meta_bob}}, "surface")
- name: Alice joins the world
  type: call
  app: '{{world_id}}'
  method: join
  args:
    name: Alice
    now: 1752264001
  account: calimero-node-1
  as_key: '{{alice_key}}'
- name: Bob joins the world
  type: call
  app: '{{world_id}}'
  method: join
  args:
    name: Bob
    now: 1752264002
  account: calimero-node-2
  as_key: '{{bob_key}}'
- name: Alice reads the roster
  type: call
  app: '{{world_id}}'
  method: get_players
  args:
    now: 1752264005
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    roster_alice: rpc
- name: Assert both miners are in the roster
  type: assert
  statements:
  - contains({{roster_alice}}, "Alice")
  - contains({{roster_alice}}, "Bob")
- name: Alice builds a plank shelter with a torch
  type: call
  app: '{{world_id}}'
  method: set_tiles
  args:
    edits:
    - x: 210
      y: 55
      t: 7
    - x: 211
      y: 55
      t: 7
    - x: 212
      y: 54
      t: 8
    now: 1752264010
  account: calimero-node-1
  as_key: '{{alice_key}}'
- name: Bob pulls the override diff
  type: call
  app: '{{world_id}}'
  method: get_overrides
  args: {}
  account: calimero-node-2
  as_key: '{{bob_key}}'
  outputs:
    overrides_bob: rpc
- name: Assert Bob received Alice's tiles
  type: assert
  statements:
  - contains({{overrides_bob}}, "210")
  - contains({{overrides_bob}}, "211")
  - contains({{overrides_bob}}, "212")
- name: Bob digs out a wall tile (t=0, never a map-remove)
  type: call
  app: '{{world_id}}'
  method: set_tiles
  args:
    edits:
    - x: 211
      y: 55
      t: 0
    now: 1752264020
  account: calimero-node-2
  as_key: '{{bob_key}}'
- name: Alice pulls the override diff
  type: call
  app: '{{world_id}}'
  method: get_overrides
  args: {}
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    overrides_alice: rpc
- name: Assert the dig converged (all 3 keys still present, LWW upsert)
  type: assert
  statements:
  - contains({{overrides_alice}}, "211")
  - contains({{overrides_alice}}, "210")
  - contains({{overrides_alice}}, "212")
- name: Alice heartbeats while mining at x=305
  type: call
  app: '{{world_id}}'
  method: heartbeat
  args:
    t:
      name: Alice
      x: 305
      y: 66
      dir: 1
      sel: 0
      action: mining
    now: 1752264030
  account: calimero-node-1
  as_key: '{{alice_key}}'
- name: Bob heartbeats while building at x=317
  type: call
  app: '{{world_id}}'
  method: heartbeat
  args:
    t:
      name: Bob
      x: 317
      y: 48
      dir: -1
      sel: 2
      action: building
    now: 1752264031
  account: calimero-node-2
  as_key: '{{bob_key}}'
- name: Bob polls the roster (as the frontend does every 500ms)
  type: call
  app: '{{world_id}}'
  method: get_players
  args:
    now: 1752264035
  account: calimero-node-2
  as_key: '{{bob_key}}'
  outputs:
    roster_bob_moves: rpc
- name: Assert Bob sees Alice's live position and action
  type: assert
  statements:
  - contains({{roster_bob_moves}}, "305")
  - contains({{roster_bob_moves}}, "mining")
- name: Alice polls the roster
  type: call
  app: '{{world_id}}'
  method: get_players
  args:
    now: 1752264036
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    roster_alice_moves: rpc
- name: Assert Alice sees Bob's live position and action
  type: assert
  statements:
  - contains({{roster_alice_moves}}, "317")
  - contains({{roster_alice_moves}}, "building")
