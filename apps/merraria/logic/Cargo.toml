[package]
name = "merraria"
description = "Calimero voxel world state (tile overrides + player presence)"
# NOT the release version. cargo requires a version field, but
# .github/workflows/deploy-bundle.yml ignores it: the registry owns the number —
# the check job takes the highest published appVersion and increments the patch
# (0.0.1 when nothing is published yet). Bumping this changes nothing about what
# gets released, so do not read a shipped version out of the tree; read it from
# the registry or the workflow's run summary.
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Read by `cargo mero bundle` (core #3374): every field the node and the
# registry actually render now has a producer here, so nothing is hand-written
# into a manifest.json any more. `appVersion` is deliberately absent — the
# deploy workflow resolves it from the registry.
[package.metadata.calimero]
package = "com.calimero.merraria"
name = "Merraria"
description = "Terraria-style P2P mining sandbox. The world is a Calimero context: seed + tile-edit diff + player presence, no game server."
author = "Calimero"
# The desktop resolves a deep link (calimero://<slug>/… and
# https://links.calimero.network/<slug>/…) by this slug, so it MUST stay equal
# to the package id the app's invite links carry.
slug = "com.calimero.merraria"
icon = "../app/public/icon-512.png"
tags = ["game", "sandbox", "multiplayer"]
github = "https://github.com/calimero-network/merraria"
# Kept equal to the SDK tag above, the way mero-ar/pixart/stream/scaffolding do
# it — "0.1.0" was cargo-mero's placeholder floor, not a claim anyone verified.
# The bundle does NOT actually need rc.22 host functions (the rc.20 and rc.22
# builds import the same 18 `env.*` symbols); this is the conservative,
# truthful "what it was built and e2e'd against".
min-runtime-version = "0.11.0-rc.22"
frontend = "https://merraria.vercel.app/"

[dependencies]
borsh = "1.6.1"
borsh-derive = "1.6.1"
bs58 = "0.5.1"
# SDK crates are not on crates.io past rc.5 — must be git tag deps, and all
# three must share the exact same tag (workspace version at the tag is 0.0.0).
# Pin a real release tag, never `branch = "master"`: master rides unreleased
# protocol work against nodes that run the release, and `latest` does not exist
# on the remote (it only ever resolves from a warm cargo cache).
calimero-sdk = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.22" }
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.22" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.22" }
thiserror = "1.0.56"

[dev-dependencies]
# "testing" enables the native mock host (TestHost) for `cargo test`
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.22", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
