name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  logic:
    name: Logic (contract tests + WASM build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup picks it up automatically.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: logic
      # fmt and clippy were never gated here, so main drifted out of rustfmt
      # shape unnoticed (14 diffs by the rc.23 migration). Cheap to run, and the
      # only thing that keeps the tree in the state the migration bar asserts.
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Contract unit tests (native, TestHost)
        run: cargo test
      - name: Install cargo-mero
        uses: ./.github/actions/install-cargo-mero

      # `cargo mero build` compiles to wasm32, runs wasm-opt -Oz (bundled, not
      # from PATH) and embeds the ABI as the calimero_abi_v1 section — the
      # section the node reads to plan an upgrade, so the wasm CI publishes has
      # to be built by the same tool the release does.
      - name: WASM build (+ ABI embed)
        run: cargo mero build
      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: logic/res/merraria.wasm

  e2e-mocked:
    name: E2E (Playwright, mocked node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: app/test-results

  e2e-merobox:
    name: E2E (2-node mining world over merobox)
    runs-on: ubuntu-latest
    needs: logic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: logic/res
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install merobox
        # Pinned, and pinned TOGETHER with the merod image in workflows/e2e.yml.
        # merobox talks to the node's admin API directly, so an unpinned merobox
        # silently starts speaking a newer node's payloads and the e2e reds on a
        # commit that changed nothing (0.6.54 dropped upgradePolicy for rc.21).
        run: pip install "merobox==0.6.55" "calimero-client-py==0.6.29" && merobox --version
      - name: Run 2-node world e2e (build → sync → break → converge)
        working-directory: workflows
        run: |
          for attempt in 1 2 3; do
            if merobox bootstrap run e2e.yml; then exit 0; fi
            echo "attempt ${attempt} failed — cleaning up and retrying"
            merobox stop --all || true
            # The node containers run as root, so their data/ is root-owned and a
            # plain rm dies on it — under `bash -e` that killed the job before
            # attempt 2 ever ran, making this loop a no-op on a real failure.
            sudo rm -rf data || true
            sleep 5
          done
          exit 1
      - name: Stop nodes
        if: always()
        run: merobox stop --all || true

