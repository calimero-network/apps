name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck + unit tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  logic:
    name: Logic (contract tests + WASM build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: logic
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup picks it up automatically.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: logic
      # fmt and clippy were never gated here, so main drifted out of rustfmt
      # shape unnoticed (14 diffs by the rc.23 migration). Cheap to run, and the
      # only thing that keeps the tree in the state the migration bar asserts.
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Contract unit tests (native, TestHost)
        run: cargo test
      - name: Install cargo-mero
        uses: ./.github/actions/install-cargo-mero

      # `cargo mero build` compiles to wasm32, runs wasm-opt -Oz (bundled, not
      # from PATH) and embeds the ABI as the calimero_abi_v1 section — the
      # section the node reads to plan an upgrade, so the wasm CI publishes has
      # to be built by the same tool the release does.
      - name: WASM build (+ ABI embed)
        run: cargo mero build
      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: logic/res/merraria.wasm

  e2e-mocked:
    name: E2E (Playwright, mocked node)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: pnpm exec playwright install --with-deps chromium

      # A cache hit restores the browser but not the shared libraries it
      # links against. This is the apt half alone — seconds, and it cannot
      # pull a browser.
      - name: Install browser system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 8
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: app/test-results

  e2e-merobox:
    name: E2E (2-node mining world over merobox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: logic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: logic/res
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # merobox has had a console-verbosity knob since 0.6.30 (merobox#271): `quiet`
      # keeps the banners and the final pass/fail summary and drops the per-step
      # API-response dumps. Day to day that is what you want; to get the full detail
      # back, re-run the job with "Enable debug logging" and GitHub sets runner.debug,
      # which flips this to `verbose`. No second workflow, no flag to remember.
      #
      # It goes through $GITHUB_ENV rather than a workflow-level `env:` because the
      # `runner` context does not exist at workflow or job level — only inside a step.
      - name: Quiet merobox and its nodes on the happy path
        run: |
          # merobox's own console output.
          echo "MEROBOX_LOG_LEVEL=${{ runner.debug == '1' && 'verbose' || 'quiet' }}" >> "$GITHUB_ENV"
          # RUST_LOG for the merod nodes merobox boots. This has to go on the CLI:
          # `bootstrap run --log-level` defaults to "debug", so the value is never
          # None and merobox's `config.get("log_level")` fallback is unreachable — a
          # `log_level:` key in the workflow YAML is silently ignored.
          echo "MEROD_LOG=${{ runner.debug == '1' && 'debug' || 'info' }}" >> "$GITHUB_ENV"
      # calimero-client-py publishes an sdist and no manylinux wheel, so a cold
      # `pip install` compiles its Rust extension on the runner — 92 seconds of a
      # 134-second step, measured. pip stores wheels it builds itself under
      # ~/.cache/pip/wheels and reuses them, so keying this cache on the exact pins
      # makes every run after the first a few seconds. Bump the key with the pins.
      - name: Cache pip (calimero-client-py builds from source)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-merobox-0.6.66-ccpy-0.6.33
      - name: Install merobox
        # Pinned, and pinned TOGETHER with the merod image in workflows/e2e.yml.
        # merobox talks to the node's admin API directly, so an unpinned merobox
        # silently starts speaking a newer node's payloads and the e2e reds on a
        # commit that changed nothing (0.6.54 dropped upgradePolicy for rc.21).
        run: pip install -q --disable-pip-version-check "merobox==0.6.66" "calimero-client-py==0.6.33" && merobox --version
      - name: Run 2-node world e2e (build → sync → break → converge)
        working-directory: workflows
        run: |
          for attempt in 1 2 3; do
            if merobox bootstrap run --log-level "$MEROD_LOG" e2e.yml; then exit 0; fi
            echo "attempt ${attempt} failed — cleaning up and retrying"
            merobox stop --all || true
            # The node containers run as root, so their data/ is root-owned and a
            # plain rm dies on it — under `bash -e` that killed the job before
            # attempt 2 ever ran, making this loop a no-op on a real failure.
            sudo rm -rf data || true
            sleep 5
          done
          exit 1
      - name: Stop nodes
        if: always()
        run: merobox stop --all || true

