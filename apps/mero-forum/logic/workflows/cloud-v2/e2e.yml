# Ported from e2e.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   set_default_capabilities x1: capabilities are v1 governance
#   sync_group x1: replication is synchronous
#   wait_for_sync x8: replication is synchronous: a read sees every committed write
name: Mero Forum — posts, comments and votes across two nodes (2-node e2e)
description: "Proves the properties the rewrite exists for. only-peers kept posts in a bare Vec keyed\
  \ by position and took the comment author as a caller-supplied string, so none of this could hold:\n\
  \n  1. a post written on one node is readable on the other, by a STABLE id;\n  2. the author gate is\
  \ real — a non-author's edit is REJECTED on a signed\n     delta path, which no single-node test can\
  \ exercise;\n  3. votes are one row per account and the tally converges;\n  4. a delete replicates as\
  \ a tombstone rather than vanishing locally;\n  5. only a moderator (the founder, Alice) removes someone\
  \ else's post or\n     comment, and a member cannot appoint themselves.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3360
accounts:
- calimero-node-1
- calimero-node-2
- calimero-node-2-id1
steps:
- name: Install application on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_forum.wasm'
  outputs:
    app_id: hash
  account: calimero-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create namespace
  type: create_org
  org_name: Create namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Generate identity for Node 2
  type: whoami
  account: calimero-node-2-id1
  outputs:
    bob_identity: publicKey
- name: Wait for identity propagation
  type: wait
  seconds: 1.0
- name: Node 1 creates invitation for Node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invite_bob: token
- name: Settle before the namespace join (cold-join KeyDelivery)
  type: wait
  seconds: 1.0
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{invite_bob}}'
  account: calimero-node-2
- name: Settle after namespace join
  type: wait
  seconds: 1.0
- name: Node 1 creates the forum
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_forum.wasm'
  app_name: Node 1 creates the forum
  init_args: '{}'
  org: '{{namespace_id}}'
  outputs:
    forum_id: appId
    alice_key: memberPublicKey
- name: Settle after sync
  type: wait
  seconds: 1.0
- name: Bob joins the forum
  type: whoami
  account: calimero-node-2
  outputs:
    bob_key: publicKey
- name: Alice posts
  type: call
  app: '{{forum_id}}'
  method: create_post
  args:
    title: Namespaces vs contexts
    body: When should an app create a subgroup?
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    post_id: result
- name: Bob reads the feed
  type: call
  app: '{{forum_id}}'
  method: list_posts
  args:
    sort: new
    cursor: null
    limit: 20
  account: calimero-node-2
  as_key: '{{bob_key}}'
  outputs:
    bob_feed: rpc
- name: Assert the post replicated
  type: assert
  statements:
  - contains({{bob_feed}}, "Namespaces vs contexts")
- name: Bob fetches the post by Alice's id
  type: call
  app: '{{forum_id}}'
  method: get_post
  args:
    post_id: '{{post_id}}'
  account: calimero-node-2
  as_key: '{{bob_key}}'
  outputs:
    bob_post: rpc
- name: Assert the id is stable across nodes
  type: assert
  statements:
  - contains({{bob_post}}, "Namespaces vs contexts")
- name: Bob tries to edit Alice's post
  type: call
  app: '{{forum_id}}'
  method: edit_post
  args:
    post_id: '{{post_id}}'
    title: Hijacked
    body: Not mine to edit
  account: calimero-node-2
  as_key: '{{bob_key}}'
  expected_failure: true
  outputs:
    edit_error: error
- name: Assert the non-author edit was rejected
  type: assert
  statements:
  - is_set({{edit_error}})
- name: Alice re-reads her post
  type: call
  app: '{{forum_id}}'
  method: get_post
  args:
    post_id: '{{post_id}}'
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    alice_post: rpc
- name: Assert the title survived the rejected edit
  type: assert
  statements:
  - contains({{alice_post}}, "Namespaces vs contexts")
  - not_contains({{alice_post}}, "Hijacked")
- name: Bob comments
  type: call
  app: '{{forum_id}}'
  method: create_comment
  args:
    post_id: '{{post_id}}'
    body: A namespace per team, a subgroup per topic.
  account: calimero-node-2
  as_key: '{{bob_key}}'
  outputs:
    comment_id: result
- name: Alice reads the thread
  type: call
  app: '{{forum_id}}'
  method: list_comments
  args:
    post_id: '{{post_id}}'
    cursor: null
    limit: 20
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    thread: rpc
- name: Assert the comment replicated
  type: assert
  statements:
  - contains({{thread}}, "A namespace per team")
- name: Alice tries to edit Bob's comment
  type: call
  app: '{{forum_id}}'
  method: edit_comment
  args:
    comment_id: '{{comment_id}}'
    body: Rewritten by someone else
  account: calimero-node-1
  as_key: '{{alice_key}}'
  expected_failure: true
  outputs:
    comment_edit_error: error
- name: Assert a non-author cannot rewrite a comment
  type: assert
  statements:
  - is_set({{comment_edit_error}})
- name: Alice upvotes
  type: call
  app: '{{forum_id}}'
  method: vote
  args:
    post_id: '{{post_id}}'
    value: 1
  account: calimero-node-1
  as_key: '{{alice_key}}'
- name: Bob upvotes
  type: call
  app: '{{forum_id}}'
  method: vote
  args:
    post_id: '{{post_id}}'
    value: 1
  account: calimero-node-2
  as_key: '{{bob_key}}'
- name: Alice reads the score
  type: call
  app: '{{forum_id}}'
  method: get_post
  args:
    post_id: '{{post_id}}'
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    scored: result
- name: Assert two accounts made two points
  type: json_assert
  statements:
  - 'json_subset({{scored}}, {"score": 2, "comment_count": 1})'
- name: Bob upvotes a second time
  type: call
  app: '{{forum_id}}'
  method: vote
  args:
    post_id: '{{post_id}}'
    value: 1
  account: calimero-node-2
  as_key: '{{bob_key}}'
- name: Alice re-reads the score
  type: call
  app: '{{forum_id}}'
  method: get_post
  args:
    post_id: '{{post_id}}'
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    scored_again: result
- name: Assert one account still counts once
  type: json_assert
  statements:
  - 'json_subset({{scored_again}}, {"score": 2})'
- name: Alice deletes her post
  type: call
  app: '{{forum_id}}'
  method: delete_post
  args:
    post_id: '{{post_id}}'
  account: calimero-node-1
  as_key: '{{alice_key}}'
- name: Bob reads the feed again
  type: call
  app: '{{forum_id}}'
  method: list_posts
  args:
    sort: new
    cursor: null
    limit: 20
  account: calimero-node-2
  as_key: '{{bob_key}}'
  outputs:
    feed_after_delete: rpc
- name: Assert the delete reached Node 2
  type: assert
  statements:
  - not_contains({{feed_after_delete}}, "Namespaces vs contexts")
- name: Bob posts spam
  type: call
  app: '{{forum_id}}'
  method: create_post
  args:
    title: Buy cheap tokens
    body: Limited offer
  account: calimero-node-2
  as_key: '{{bob_key}}'
  outputs:
    spam_id: result
- name: Alice reads the moderators
  type: call
  app: '{{forum_id}}'
  method: moderators
  args: {}
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    moderator_list: result
- name: Assert the forum has a moderator
  type: assert
  statements:
  - is_set({{moderator_list}})
- name: Bob tries to appoint himself a moderator
  type: call
  app: '{{forum_id}}'
  method: set_moderators
  args:
    accounts:
    - '{{bob_key}}'
  account: calimero-node-2
  as_key: '{{bob_key}}'
  expected_failure: true
  outputs:
    appoint_error: error
- name: Bob tries to moderate Alice's post
  type: call
  app: '{{forum_id}}'
  method: moderate_post
  args:
    post_id: '{{post_id}}'
  account: calimero-node-2
  as_key: '{{bob_key}}'
  expected_failure: true
  outputs:
    moderate_error: error
- name: Assert a non-moderator can neither appoint nor moderate
  type: assert
  statements:
  - is_set({{appoint_error}})
  - is_set({{moderate_error}})
- name: Alice removes Bob's comment as a moderator
  type: call
  app: '{{forum_id}}'
  method: moderate_comment
  args:
    comment_id: '{{comment_id}}'
  account: calimero-node-1
  as_key: '{{alice_key}}'
- name: Alice removes Bob's spam as a moderator
  type: call
  app: '{{forum_id}}'
  method: moderate_post
  args:
    post_id: '{{spam_id}}'
  account: calimero-node-1
  as_key: '{{alice_key}}'
- name: Bob reads the feed after moderation
  type: call
  app: '{{forum_id}}'
  method: list_posts
  args:
    sort: new
    cursor: null
    limit: 20
  account: calimero-node-2
  as_key: '{{bob_key}}'
  outputs:
    feed_after_moderation: rpc
- name: Assert the removal reached Node 2
  type: assert
  statements:
  - not_contains({{feed_after_moderation}}, "Buy cheap tokens")
