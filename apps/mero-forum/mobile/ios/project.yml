# XcodeGen spec for the native iOS Mero Forum app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroForum.xcodeproj (not committed)
#   open MeroForum.xcodeproj
#
# The logic (generated contract client, view models, invitation codec) lives in
# the local ForumCore package, which builds and tests on macOS with
# `swift test --package-path ForumCore`. The swift-sdk is pinned by revision to
# the feat/app-session branch (swift-sdk#84); the pin moves to the merge commit
# once that PR lands. Keep it identical to ForumCore/Package.swift.
name: MeroForum

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 122bb0d71bb43b823cb9d694c4e70678a2ef8c89
  ForumCore:
    path: ForumCore

targets:
  MeroForum:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Forum
        # Power Grotesk, the web app's display face (app/public/fonts/powerGrotesk).
        UIAppFonts: [PowerGrotesk-Regular.otf, PowerGrotesk-Bold.otf]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          # The wallet returns here after Cloud sign-in (`mero-forum://enrol#credential=…`).
          - CFBundleURLName: network.calimero.forum.enrol
            CFBundleURLSchemes: [mero-forum]
          # Invitation deep links: `calimero://com.calimero.mero-forum/join?invitation=…`.
          - CFBundleURLName: network.calimero.forum.invite
            CFBundleURLSchemes: [calimero]
        # Where sign-in goes. Empty = the SDK's defaults (the hosted Calimero
        # wallet and Cloud manager). See README.md.
        MeroForumCallbackScheme: mero-forum
        MeroCloudBaseURL: ""
        MeroWalletURL: ""
        MeroRegistryURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.forum
        PRODUCT_NAME: MeroForum
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: ForumCore
        product: ForumCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

schemes:
  MeroForum:
    build:
      targets:
        MeroForum: all
