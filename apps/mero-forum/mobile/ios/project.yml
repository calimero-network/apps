# XcodeGen spec for the native iOS Mero Forum app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroForum.xcodeproj (not committed)
#   open MeroForum.xcodeproj
#
# The logic (generated contract client, view models, invitation codec) lives in
# the local ForumCore package, which builds and tests on macOS with
# `swift test --package-path ForumCore`. The swift-sdk is pinned by revision to
# the head of its Calimero 1.0 port (calimero-network/swift-sdk#85, branch
# feat/calimero-1.0); it moves to the merge commit once that lands. Keep it
# identical to ForumCore/Package.swift and ForumCore/Package.resolved.
#
# Calimero 1.0: the app signs in to a cluster with a passkey (Calimero Cloud:
# the cluster's node URL, the device's passkey; development: a `merod local`
# node with mock attestation and a soft passkey) over the sealed channel. A
# space is a Calimero org, a forum a team in it with one app instance.
# Invitation links carry the SDK's OrgInvitation payload
# (`{"invitation":"inv_…","namespaceId","contextId"?,"name"?}` plus the
# forum's kind/forumId/forumName), the token redeemed at
# `POST /invites/{token}/redeem`. Pending approvals (an update of Mero Forum,
# a node release) show on Spaces; "Review" opens the node's consent page in
# the system browser, which returns to `mero-forum://consent`.
name: MeroForum

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 35148e4de782c065f777e80c592d9548acd645cd
  ForumCore:
    path: ForumCore

targets:
  MeroForum:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Forum
        # Power Grotesk, the web app's display face (app/public/fonts/powerGrotesk).
        UIAppFonts: [PowerGrotesk-Regular.otf, PowerGrotesk-Bold.otf]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          # The node's consent page returns here after an approval
          # (`mero-forum://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.forum.consent
            CFBundleURLSchemes: [mero-forum]
          # Invitation deep links: `calimero://com.calimero.mero-forum/join?invitation=…`.
          - CFBundleURLName: network.calimero.forum.invite
            CFBundleURLSchemes: [calimero]
        # The consent page's return scheme.
        MeroForumCallbackScheme: mero-forum
        # The Calimero Cloud cluster to sign in to: a node URL from the
        # console. Empty: the sign-in screen asks for one.
        CalimeroClusterURL: ""
        # The development cluster (`merod local`) the sign-in screen prefills.
        DefaultNodeURL: "http://localhost:2501"
        # The Mero Forum version new forums run. Empty: the latest.
        MeroPackageVersion: ""
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # Plain http only to a node on the local network (merod local --dev);
        # everything else stays https under ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Signing in with the device's passkey on a real cluster needs the
    # cluster's relying party as an associated domain: add an entitlements
    # file with `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`.
    # A development cluster uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.forum
        PRODUCT_NAME: MeroForum
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: ForumCore
        product: ForumCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # The scripted demo tour (`-MeroDemo YES`): screenshots + screen recording.
  # Run with apps-capture's ios-capture.sh, or Cmd-U on the MeroForum scheme.
  MeroForumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MeroForum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.forum.uitests
        TEST_TARGET_NAME: MeroForum
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  MeroForum:
    build:
      targets:
        MeroForum: all
    test:
      config: Debug
      targets:
        - MeroForumUITests
