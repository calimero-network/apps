name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: app
        run: pnpm test

      # `tsc -b`, not `tsc --noEmit`: app/tsconfig.json is a SOLUTION file
      # (`"files": []`, references only), so `--noEmit` type-checks NOTHING and
      # passes genuinely broken code. `-b` walks the referenced projects.
      - name: Type check
        working-directory: app
        run: pnpm exec tsc -b

      - name: Lint
        working-directory: app
        run: pnpm lint

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        working-directory: app
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      # A cache hit restores the browser but not the shared libraries it
      # links against. This is the apt half alone — seconds, and it cannot
      # pull a browser.
      - name: Install browser system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 8
        working-directory: app
        run: pnpm exec playwright install-deps chromium

      - name: Task status table is in sync with the specs
        working-directory: app
        run: node scripts/task-status.mjs --check

      - name: Starter project matches its generator
        working-directory: app
        run: |
          node scripts/build-starter.mjs
          git diff --exit-code src/starter/starter-project.json \
            || (echo "::error::starter-project.json is stale — run pnpm starter" && exit 1)

      - name: E2E — browser
        working-directory: app
        run: pnpm exec playwright test --project=mocked
        env:
          CI: "true"

      - name: E2E — Tauri bridge
        working-directory: app
        run: pnpm exec playwright test --project=tauri
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/e2e-report/
          retention-days: 7

  rust-check:
    name: Rust Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          key: cargo-${{ runner.os }}-${{ hashFiles('logic/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-mero
        uses: ./.github/actions/install-cargo-mero

      # Full `cargo mero build` rather than a bare `cargo check`: the ABI is
      # emitted by a HOST build of the app, so a type that reaches the public API
      # without an `AbiType` impl only fails here — a wasm-only check passes.
      - name: Build Rust (+ ABI emit)
        working-directory: logic
        run: cargo mero build
