# Builds, signs, and publishes the com.calimero.merodesign bundle to the Calimero App
# Registry.
#
# The version is single-sourced from logic/Cargo.toml's [package]
# version, so bumping it on master IS the release: this runs when that file
# lands and the registry does not already have the version. workflow_dispatch
# still allows a manual run, where the input is validated against Cargo.toml
# rather than overriding it.
#
# The REGISTRY, not the git history, decides whether a version is new. That holds
# up under re-runs, reverts and squashed merges, where a diff against the
# previous commit does not.
#
# Signing uses a PRODUCTION mero-sign key held in ORGANIZATION secrets (never the
# dev key — the registry refuses dev signatures). Required secrets:
#   MERO_SIGN_KEY              - full JSON of the production signing key file
#                                ({private_key, public_key, signer_id}). Must be
#                                the key that signed this package's first
#                                version: the registry pins the signer per
#                                package, and the node derives the
#                                ApplicationId from (package, signer), so a
#                                different key publishes a DIFFERENT app.
#   CALIMERO_REGISTRY_API_KEY  - API token from the registry Organizations page
#                                (CLI Access).

name: Deploy Bundle

on:
  push:
    branches:
      - master
    paths:
      - "logic/Cargo.toml"
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version to publish, e.g. 0.2.0 (no leading v). Must equal logic/Cargo.toml."
        required: true
        type: string
      core_rev:
        description: "Require the SDK deps to resolve to this core commit (leave blank to accept whatever the pinned tag resolves to)"
        required: false
        type: string

permissions:
  contents: read

# Serialize releases: the registry rejects a duplicate version, and two pushes
# publishing at once shouldn't interleave. Never cancel in progress — a
# half-finished publish is worse than a queued one.
concurrency:
  group: deploy-bundle
  cancel-in-progress: false

jobs:
  # Cheap gate: reads Cargo.toml and asks the registry, so an unrelated edit to
  # that file does not pay for a Rust build before deciding to do nothing.
  check:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      package: ${{ steps.pkg.outputs.package }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read the package id
        id: pkg
        # logic/Cargo.toml is the only place the package is spelled; a rename
        # there must not leave this workflow verifying and publishing against
        # the old id.
        run: |
          package=$(awk '/^\[package\.metadata\.calimero\]/{f=1; next} /^\[/{f=0} f && /^package/{gsub(/package *= *"|"/,""); print; exit}' logic/Cargo.toml)
          case "$package" in
            "" ) echo "::error::could not read package from logic/Cargo.toml [package.metadata.calimero]"; exit 1 ;;
            *[!a-zA-Z0-9.-]* ) echo "::error::unexpected characters in package id '$package'"; exit 1 ;;
          esac
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "Package: $package"

      - name: Resolve and validate version
        id: ver
        env:
          # Through the environment, never inlined: a template expression is
          # substituted into the script before the shell sees it, so a crafted
          # input would run as code.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # logic/Cargo.toml is the single source of truth. A dispatch input is
          # an intent cross-check, not an override.
          crate_version=$(awk '/^\[package\]/{f=1; next} /^\[/{f=0} f && /^version/{gsub(/version *= *"|"/,""); print; exit}' logic/Cargo.toml)

          # A regex, not a case glob: in a glob `*` spans dots too, so
          # `[0-9]*.[0-9]*.[0-9]*` accepts 1.2.3.4 and anything trailing,
          # including a newline that would forge a second GITHUB_OUTPUT entry.
          if [[ ! "$crate_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::logic/Cargo.toml [package] version must be exactly X.Y.Z (got '$crate_version')"
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_VERSION" != "$crate_version" ]; then
            echo "::error::input version ($INPUT_VERSION) does not match logic/Cargo.toml ($crate_version) — bump logic/Cargo.toml first"
            exit 1
          fi

          echo "version=$crate_version" >> "$GITHUB_OUTPUT"
          echo "Version: $crate_version"

      - name: Has this version already been published?
        id: decide
        env:
          PACKAGE: ${{ steps.pkg.outputs.package }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # An unreachable registry must not read as "not published" — that would
          # republish blind. Only a definite 404 means new.
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 30 \
            "https://apps.calimero.network/api/v2/bundles/$PACKAGE/$VERSION" || echo "000")
          case "$code" in
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$PACKAGE $VERSION is not published yet — releasing"
              ;;
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$PACKAGE $VERSION is already published — nothing to do"
              ;;
            *)
              echo "::error::registry returned $code asking about $PACKAGE $VERSION — refusing to decide blind"
              exit 1
              ;;
          esac

  deploy:
    name: Build, sign & publish bundle
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check required secrets
        env:
          MERO_SIGN_KEY: ${{ secrets.MERO_SIGN_KEY }}
          CALIMERO_REGISTRY_API_KEY: ${{ secrets.CALIMERO_REGISTRY_API_KEY }}
        run: |
          missing=0
          [ -n "$MERO_SIGN_KEY" ] || { echo "::error::MERO_SIGN_KEY secret is not set"; missing=1; }
          [ -n "$CALIMERO_REGISTRY_API_KEY" ] || { echo "::error::CALIMERO_REGISTRY_API_KEY secret is not set"; missing=1; }
          exit $missing

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          key: logic-${{ runner.os }}-${{ hashFiles('logic/Cargo.toml') }}
          restore-keys: logic-${{ runner.os }}-

      # Named to match mero-drive's step; the action DIRECTORY keeps this repo's
      # existing name (install-cargo-mero) rather than being renamed for cosmetic
      # parity — it already pins rc.20, caches, and falls back to building from
      # the tag.
      - name: Setup cargo-mero
        uses: ./.github/actions/install-cargo-mero

      - name: Write signing key
        env:
          MERO_SIGN_KEY: ${{ secrets.MERO_SIGN_KEY }}
        run: |
          umask 077
          printf '%s' "$MERO_SIGN_KEY" > "$RUNNER_TEMP/mero-sign-key.json"

      - name: Verify signer matches the published package
        env:
          # The well-known public dev key's signerId. A dev-signed lineage cannot
          # be continued (the registry refuses dev signatures), so a package still
          # pinned to it is treated as a first real publish.
          DEV_SIGNER: did:key:z6MknF3p5L5FDHJQ7FREUapuX4Wmp4MtF6WrHYaXS2B3eZQd
          PACKAGE: ${{ needs.check.outputs.package }}
        run: |
          local_signer=$(cargo mero key derive-signer-id --key "$RUNNER_TEMP/mero-sign-key.json")

          # An unreachable registry must not look like an unpublished package:
          # that would silently skip the very check this step exists for. Fail the
          # release instead, and only treat a well-formed empty list as a first
          # publish.
          if ! response=$(curl -fsS --retry 3 --retry-delay 2 --max-time 30 \
              "https://apps.calimero.network/api/v2/bundles?package=$PACKAGE"); then
            echo "::error::could not reach the registry to verify the signer — refusing to publish blind"
            exit 1
          fi
          if ! published_signer=$(printf '%s' "$response" | jq -er '.[0].signerId // ""'); then
            echo "::error::registry returned a response this step cannot parse: $response"
            exit 1
          fi

          if [ -z "$published_signer" ]; then
            echo "::notice::no bundles published yet for $PACKAGE — skipping signer check (first publish)"
          elif [ "$published_signer" = "$DEV_SIGNER" ]; then
            echo "::notice::published lineage is dev-key-signed and cannot be continued; publishing under this key mints a NEW application id (one-time identity break — existing installs see a new app, not an upgrade)"
          elif [ "$local_signer" != "$published_signer" ]; then
            echo "::error::key's signerId ($local_signer) does not match the published signerId ($published_signer) — the registry pins the signer per package, so publishing with a different key would land as a new application id instead of an upgrade. Use the key that signed the first published version."
            exit 1
          else
            echo "signer matches published package ($local_signer)"
          fi

      # The SDK deps are pinned to an explicit core release tag, so the revision
      # is already determined — this records WHICH commit that tag resolved to, so
      # a signed release is never traceable only to a moving name, and lets a
      # release optionally require a specific one.
      - name: Resolve and record the core revision
        id: core
        working-directory: logic
        env:
          EXPECTED_CORE_REV: ${{ github.event.inputs.core_rev }}
        run: |
          cargo generate-lockfile --quiet
          rev=$(awk -F'#' '/^source = "git\+https:\/\/github.com\/calimero-network\/core/{print $2; exit}' Cargo.lock | tr -d '"')
          if [ -z "$rev" ]; then
            echo "::error::could not determine which core revision the SDK deps resolved to"
            exit 1
          fi
          if [ -n "$EXPECTED_CORE_REV" ] && [ "$rev" != "$EXPECTED_CORE_REV" ]; then
            echo "::error::core resolved to $rev but this release requested $EXPECTED_CORE_REV"
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "::notice::signing a bundle built against core $rev"

      # --output pins the filename so the publish step never reconstructs a
      # versioned one (the default is dist/<package>-<version>.mpk) and can never
      # pick up a stale .mpk from an earlier build.
      - name: Build & sign bundle
        working-directory: logic
        env:
          PACKAGE: ${{ needs.check.outputs.package }}
        run: cargo mero bundle --key "$RUNNER_TEMP/mero-sign-key.json" --no-icon --output "dist/$PACKAGE.mpk"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mero-sign-key.json"

      - name: Publish to App Registry
        working-directory: logic
        env:
          CALIMERO_API_KEY: ${{ secrets.CALIMERO_REGISTRY_API_KEY }}
          CALIMERO_REGISTRY_URL: https://apps.calimero.network
          PACKAGE: ${{ needs.check.outputs.package }}
        run: cargo mero publish "dist/$PACKAGE.mpk"

      - name: Summary
        env:
          PACKAGE: ${{ needs.check.outputs.package }}
          VERSION: ${{ needs.check.outputs.version }}
          CORE_REV: ${{ steps.core.outputs.rev }}
        run: |
          {
            echo "### Bundle published :rocket:"
            echo ""
            echo "- **Package:** \`$PACKAGE\`"
            echo "- **Version:** \`$VERSION\`"
            echo "- **Core revision:** \`$CORE_REV\`"
            echo "- **Registry:** https://apps.calimero.network"
          } >> "$GITHUB_STEP_SUMMARY"
