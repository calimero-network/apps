[package]
name = "merodesign"
description = "MeroDesign — collaborative design tool on Calimero"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "0.10.3"
borsh-derive = "0.10.3"
calimero-sdk = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.11" }
calimero-storage = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.11" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.11" }
thiserror = "1.0.56"
serde_json = "1.0.113"

[build-dependencies]
calimero-wasm-abi = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.11" }
serde_json = "1.0.113"

[dev-dependencies]
# Enables register_crdt_merge + the native mock host so TestHost can drive
# CRDT state (incl. the permissioned components) under `cargo test`.
calimero-storage = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.11", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
