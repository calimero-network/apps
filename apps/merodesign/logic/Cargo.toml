[package]
name = "merodesign"
description = "MeroDesign — collaborative design tool on Calimero"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "0.10.3"
borsh-derive = "0.10.3"
bs58 = "0.5.1"
calimero-sdk = "0.10.1-rc.46"
calimero-storage = "0.10.1-rc.46"
calimero-storage-macros = "0.10.1-rc.46"
thiserror = "1.0.56"
serde_json = "1.0.113"

[build-dependencies]
calimero-wasm-abi = "0.10.1-rc.46"
serde_json = "1.0.113"

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
