<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Mero Kombat</title>
    <!-- Game-only page for the native apps: no network, no fonts, nothing from a CDN. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0c;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <canvas id="arena" width="480" height="270" role="img" aria-label="Mero Kombat arena"></canvas>
    <script src="game.js"></script>
  </body>
</html>
