# XcodeGen spec for the native iOS Mero Kombat app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroKombat.xcodeproj (not committed)
#   open MeroKombat.xcodeproj
#
# The non-UI layer (generated contract client, view models, the game bridge, the fight pad's input
# mapping, presence) is the local SwiftPM package in KombatCore/, tested on macOS with
# `swift test --package-path KombatCore` (no simulator). The game itself is the web app's engine,
# built by ../scripts/build-web.sh into Resources/Game and shipped in the app bundle.
# The swift-sdk is pinned by revision to its main merge commit of swift-sdk#84. Keep it
# equal to the revision in KombatCore/Package.swift.
name: MeroKombat

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 6c5f1167d1e586f556f59c326de5f51d034e80dd
  KombatCore:
    path: KombatCore

targets:
  MeroKombat:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Assets.xcassets
      - path: Resources/Fonts
        buildPhase: resources
      # The game-only web page, copied as a folder so index.html and game.js keep their layout.
      - path: Resources/Game
        type: folder
        buildPhase: resources
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Kombat
        # Power Grotesk, the web app's display face (app/public/fonts/powerGrotesk).
        UIAppFonts: [PowerGrotesk-Regular.otf, PowerGrotesk-Bold.otf]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        # A fighting game held sideways: landscape only, everywhere.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          # The node's consent page returns here (`mero-kombat://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.kombat.consent
            CFBundleURLSchemes: [mero-kombat]
          # Invitation deep links: `calimero://com.calimero.mero-kombat/join?invitation=…`.
          - CFBundleURLName: network.calimero.kombat.invite
            CFBundleURLSchemes: [calimero]
        # The Calimero 1.0 cluster. MeroNodeURL: a node from Calimero Cloud's
        # console (empty = sign-in asks for one); MeroNodes: the cluster's other
        # nodes, comma-separated, for failover; MeroAllowMock: YES only for a
        # `merod local` cluster (mock attestation). See ../README.md.
        MeroNodeURL: ""
        MeroNodes: ""
        MeroAllowMock: "NO"
        MeroPackageVersion: ""
        # Where the node's consent page returns to.
        MeroKombatCallbackScheme: mero-kombat
        MeroKombatCallbackHost: ""
        MeroKombatCallbackPath: /consent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.kombat
        PRODUCT_NAME: MeroKombat
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    dependencies:
      - package: KombatCore
        product: KombatCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

schemes:
  MeroKombat:
    build:
      targets:
        MeroKombat: all
