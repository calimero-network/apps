# Ported from fight-a-match.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x5: replication is synchronous: a read sees every committed write
name: Mero Kombat E2E
description: 'Two nodes fight a full match through the contract and converge on it.

  Each node takes a corner and throws blows as transactions. After the exchanges, the OTHER node is asked
  for the arena, so a blow that never replicated, or health derived from a divergent action list, fails
  here. Then node-1 lands two knock-outs — rounds the contract derives, nobody writes "K.O." — the match
  ends, and a rematch starts a fresh fight with the score kept.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3380
accounts:
- kombat-node-1
- kombat-node-2
steps:
- name: Install application on kombat-node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_kombat.wasm'
  outputs:
    app_id: hash
  account: kombat-node-1
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Settle before the mesh joins
  type: wait
  seconds: 1.0
- name: Create mesh with node-2
  type: create_org
  account: kombat-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: kombat-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: kombat-node-2
  token: '{{_mesh_invite}}'
- name: Create mesh with node-2
  type: deploy
  account: kombat-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.APPS_WASM_DIR}}/mero_kombat.wasm'
  app_name: Create mesh with node-2
  init_args: '{"title": "Two nodes", "now": 1700000000000}'
  outputs:
    context_id: appId
    node1_key: memberPublicKey
- name: Verify mesh keys are populated
  type: assert
  statements:
  - is_set({{context_id}})
  - is_set({{node1_key}})
  - is_set({{public_key_kombat-node-2}})
- name: node-1 announces itself
  type: call
  app: '{{context_id}}'
  method: join
  args:
    name: Node One
    fighter: cryo
    now: 1700000002000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 switches fighter
  type: call
  app: '{{context_id}}'
  method: pick
  args:
    fighter: kinetic
    now: 1700000003000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 takes the left corner
  type: call
  app: '{{context_id}}'
  method: sit
  args:
    seat: p1
    name: Node One
    fighter: kinetic
    now: 1700000004000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-2 takes the right corner
  type: call
  app: '{{context_id}}'
  method: sit
  args:
    seat: p2
    name: Node Two
    fighter: inferno
    now: 1700000005000
  account: kombat-node-2
  as_key: '{{public_key_kombat-node-2}}'
- name: node-1 reads the arena
  type: call
  app: '{{context_id}}'
  method: arena
  args:
    now: 1700000006000
  account: kombat-node-1
  as_key: '{{node1_key}}'
  outputs:
    n1_ready: rpc
- name: Assert node-1 sees a live fight from the left corner
  type: json_assert
  statements:
  - 'json_subset({{n1_ready}}, {"output": {"status": "fighting", "match_index": 0, "round": 0, "my_seat":
    "p1"}})'
  - 'json_subset({{n1_ready}}, {"output": {"p1": {"name": "Node One", "fighter": "kinetic", "hp": 100},
    "p2": {"name": "Node Two", "fighter": "inferno", "hp": 100}}})'
- name: node-2 tries to take the corner node-1 is in
  type: call
  app: '{{context_id}}'
  method: sit
  args:
    seat: p1
    name: Node Two
    fighter: inferno
    now: 1700000007000
  account: kombat-node-2
  as_key: '{{public_key_kombat-node-2}}'
  expected_failure: true
  outputs:
    corner_taken_error: error
- name: Assert the second claim really was refused
  type: assert
  statements:
  - is_set({{corner_taken_error}})
- name: node-1 throws a jump
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 1
    kind: jump
    hit: false
    blocked: false
    now: 1700000008000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 throws a punch
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 2
    kind: punch
    hit: true
    blocked: false
    now: 1700000009000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 throws a kick
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 3
    kind: kick
    hit: true
    blocked: false
    now: 1700000010000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 throws a uppercut
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 4
    kind: uppercut
    hit: false
    blocked: false
    now: 1700000011000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-2 answers with a block
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 5
    kind: block
    hit: false
    blocked: false
    now: 1700000012000
  account: kombat-node-2
  as_key: '{{public_key_kombat-node-2}}'
- name: node-2 answers with a special
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 6
    kind: special
    hit: true
    blocked: false
    now: 1700000013000
  account: kombat-node-2
  as_key: '{{public_key_kombat-node-2}}'
- name: node-2 answers with a punch
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 7
    kind: punch
    hit: true
    blocked: true
    now: 1700000014000
  account: kombat-node-2
  as_key: '{{public_key_kombat-node-2}}'
- name: node-2 reads the arena
  type: call
  app: '{{context_id}}'
  method: arena
  args:
    now: 1700000015000
  account: kombat-node-2
  as_key: '{{public_key_kombat-node-2}}'
  outputs:
    n2_hurt: rpc
- name: Assert node-2 derived the same health from both nodes' blows
  type: json_assert
  statements:
  - 'json_subset({{n2_hurt}}, {"output": {"my_seat": "p2", "total_actions": 7, "match_actions": 7}})'
  - 'json_subset({{n2_hurt}}, {"output": {"p1": {"hp": 88}, "p2": {"hp": 88}}})'
- name: node-1 uppercut 1 in round one
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 8
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000016000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 2 in round one
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 9
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000017000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 3 in round one
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 10
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000018000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 4 in round one
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 11
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000019000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 5 in round one
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 12
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000020000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 6 in round one
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 13
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000021000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 7 in round one
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 14
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000022000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 sees round one decided
  type: call
  app: '{{context_id}}'
  method: arena
  args:
    now: 1700000023000
  account: kombat-node-1
  as_key: '{{node1_key}}'
  outputs:
    n1_round: rpc
- name: Assert the knock-out was derived and round two began
  type: json_assert
  statements:
  - 'json_subset({{n1_round}}, {"output": {"round": 1, "round_results": ["p1"], "status": "fighting",
    "p2": {"hp": 100, "rounds_won": 0}, "p1": {"rounds_won": 1}}})'
- name: A late blow for the decided round is refused
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 0
    id: 999
    kind: punch
    hit: true
    blocked: false
    now: 1700000024000
  account: kombat-node-2
  as_key: '{{public_key_kombat-node-2}}'
  expected_failure: true
  outputs:
    late_error: error
- name: Assert the late blow really was refused
  type: assert
  statements:
  - is_set({{late_error}})
- name: node-1 uppercut 1 in round two
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 1
    id: 15
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000025000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 2 in round two
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 1
    id: 16
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000026000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 3 in round two
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 1
    id: 17
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000027000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 4 in round two
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 1
    id: 18
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000028000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 5 in round two
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 1
    id: 19
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000029000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 6 in round two
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 1
    id: 20
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000030000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 7 in round two
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 1
    id: 21
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000031000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-1 uppercut 8 in round two
  type: call
  app: '{{context_id}}'
  method: act
  args:
    match_index: 0
    round: 1
    id: 22
    kind: uppercut
    hit: true
    blocked: false
    now: 1700000032000
  account: kombat-node-1
  as_key: '{{node1_key}}'
- name: node-2 reads the result
  type: call
  app: '{{context_id}}'
  method: arena
  args:
    now: 1700000033000
  account: kombat-node-2
  as_key: '{{public_key_kombat-node-2}}'
  outputs:
    n2_over: rpc
- name: Assert node-2 derived the same winner, flawless
  type: json_assert
  statements:
  - 'json_subset({{n2_over}}, {"output": {"status": "finished", "winner": "p1", "flawless": true, "round_results":
    ["p1", "p1"]}})'
  - 'json_subset({{n2_over}}, {"output": {"p1": {"matches_won": 1}}})'
- name: node-2 reads the record
  type: call
  app: '{{context_id}}'
  method: history
  args: {}
  account: kombat-node-2
  as_key: '{{public_key_kombat-node-2}}'
  outputs:
    n2_history: rpc
- name: Assert the record holds the finished match
  type: json_assert
  statements:
  - 'json_equal({{n2_history}}, {"output": [{"index": 0, "started_at": 1700000000000, "winner": "p1",
    "flawless": true, "rounds": ["p1", "p1"], "actions": 22}]})'
- name: node-2 cannot leave a corner it has fought from
  type: call
  app: '{{context_id}}'
  method: stand
  args:
    now: 1700000034000
  account: kombat-node-2
  as_key: '{{public_key_kombat-node-2}}'
  expected_failure: true
  outputs:
    stand_error: error
- name: Assert standing up was refused
  type: assert
  statements:
  - is_set({{stand_error}})
- name: node-2 calls a rematch
  type: call
  app: '{{context_id}}'
  method: rematch
  args:
    now: 1700000035000
  account: kombat-node-2
  as_key: '{{public_key_kombat-node-2}}'
  outputs:
    next_match: rpc
- name: Assert the rematch is match one
  type: json_assert
  statements:
  - 'json_equal({{next_match}}, {"output": 1})'
- name: node-1 reads the new match
  type: call
  app: '{{context_id}}'
  method: arena
  args:
    now: 1700000036000
  account: kombat-node-1
  as_key: '{{node1_key}}'
  outputs:
    n1_rematch: rpc
- name: Assert a fresh fight with the score kept
  type: json_assert
  statements:
  - 'json_subset({{n1_rematch}}, {"output": {"status": "fighting", "match_index": 1, "round": 0, "match_actions":
    0}})'
  - 'json_subset({{n1_rematch}}, {"output": {"p1": {"hp": 100, "matches_won": 1}, "p2": {"hp": 100}}})'
