org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Where the app talks to. Empty means the SDK's defaults (the hosted Calimero cloud manager,
# wallet and app registry). Override per build: ./gradlew assembleDebug -PmeroCloudUrl=https://...
meroCloudUrl=
meroWalletUrl=
meroRegistryUrl=
# Where the wallet sends the person back after approving this device. Its scheme and host are
# also the manifest's intent filter. See README "Sign-in callback".
meroEnrolCallback=mero-vote://enrol
