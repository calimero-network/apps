# XcodeGen spec for the native iOS Mero Vote app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroVote.xcodeproj (not committed)
#   open MeroVote.xcodeproj
#
# The logic (ballot cryptography, generated contract client, view models,
# invitation codec) lives in the local VoteCore package, which builds and tests
# on macOS with `swift test --package-path VoteCore`. The swift-sdk is pinned
# by revision to the feat/app-session branch (swift-sdk#84); the pin moves to
# the merge commit once that PR lands. Keep it identical to VoteCore/Package.swift.
name: MeroVote

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 122bb0d71bb43b823cb9d694c4e70678a2ef8c89
  VoteCore:
    path: VoteCore

targets:
  MeroVote:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Vote
        # Power Grotesk, the fleet's display face (converted from the web's WOFF2).
        UIAppFonts: [PowerGrotesk-Regular.otf, PowerGrotesk-Bold.otf]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          # The wallet returns here after Cloud sign-in (`mero-vote://enrol#credential=…`).
          - CFBundleURLName: network.calimero.vote.enrol
            CFBundleURLSchemes: [mero-vote]
          # Invitation deep links: `calimero://com.calimero.mero-vote/join?invitation=…`.
          - CFBundleURLName: network.calimero.vote.invite
            CFBundleURLSchemes: [calimero]
        # Where sign-in goes. Empty = the SDK's defaults (the hosted Calimero
        # wallet and Cloud manager). See ../README.md.
        MeroVoteCallbackScheme: mero-vote
        MeroCloudBaseURL: ""
        MeroWalletURL: ""
        MeroRegistryURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.vote
        PRODUCT_NAME: MeroVote
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: VoteCore
        product: VoteCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

schemes:
  MeroVote:
    build:
      targets:
        MeroVote: all
