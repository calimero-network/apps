# XcodeGen spec for the native iOS Mero Vote app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroVote.xcodeproj (not committed)
#   open MeroVote.xcodeproj
#
# The logic (ballot cryptography, generated contract client, view models,
# invitation codec) lives in the local VoteCore package, which builds and tests
# on macOS with `swift test --package-path VoteCore`. The swift-sdk is pinned
# by revision to the head of its Calimero 1.0 port (swift-sdk#85, branch
# feat/calimero-1.0), moving to the merge commit once that lands. Keep it
# identical to VoteCore/Package.swift.
name: MeroVote

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 6c5f1167d1e586f556f59c326de5f51d034e80dd
  VoteCore:
    path: VoteCore

targets:
  MeroVote:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Vote
        # Power Grotesk, the fleet's display face (converted from the web's WOFF2).
        UIAppFonts: [PowerGrotesk-Regular.otf, PowerGrotesk-Bold.otf]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          # The node's consent page returns here (`mero-vote://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.vote.consent
            CFBundleURLSchemes: [mero-vote]
          # Invitation deep links: `calimero://com.calimero.mero-vote/join?invitation=…`.
          - CFBundleURLName: network.calimero.vote.invite
            CFBundleURLSchemes: [calimero]
        # Which cluster sign-in uses (Calimero 1.0). MeroNodeURL: a node of your
        # Calimero Cloud cluster (from the cloud.calimero.network console); empty =
        # the sign-in screen asks. MeroDevNodeURL: what the "Development node"
        # field starts with (`merod local`, mock attestation allowed). See README.
        MeroVoteCallbackScheme: mero-vote
        MeroNodeURL: ""
        MeroDevNodeURL: "http://localhost:2501"
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # http only to a node on the local network (localhost, *.local, an IP literal).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # A passkey on a real cluster belongs to its relying party (the node's --rp-id).
    # To sign in with the device's passkey there, add an entitlements file with
    # `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`. A
    # development node uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.vote
        PRODUCT_NAME: MeroVote
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: VoteCore
        product: VoteCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

schemes:
  MeroVote:
    build:
      targets:
        MeroVote: all
