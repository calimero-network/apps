[package]
name        = "mero-vote-crypto"
description = "The ballot cryptography behind mero-vote: exponential ElGamal on ristretto255 and the Sigma-protocol proofs that keep it honest."
version     = "0.0.1"
edition     = "2021"
authors     = ["Calimero Limited <info@calimero.network>"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/calimero-network/apps"
publish     = false

# A member of the contract's own workspace (../../Cargo.toml), not the root one:
# the contract is a standalone component crate, so this crate builds with it for
# both the host (tests) and wasm32-wasip2 (the component).

[dependencies]
# `precomputed-tables` stays off: it buys basepoint speed with ~30 KiB of wasm,
# and a tally is a few thousand multiplications.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc", "zeroize"] }
sha2             = "0.10.8"
hex              = "0.4.3"

[dev-dependencies]
serde_json = "1"
