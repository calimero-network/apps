[package]
# The SPREADSHEET service crate, promoted to logic/ and renamed: `apps/*/logic`
# must be a PACKAGE (a members-glob match cannot be a nested `[workspace]`), and
# the directory / cargo package / npm package must be one value. The SERVICE name
# stays `spreadsheet` — it is what createContext passes.
name        = "mero-sheets"
version     = "0.1.0"
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Moved from `[workspace.metadata.calimero]` on the deleted nested workspace.
# cargo-mero REPLACES an app's package table with the workspace one when both
# exist, which in a many-app workspace masks every other app — so nothing
# calimero-owned may live at workspace level in this repo.
#
# The package id is UNCHANGED and already conforms: com.calimero.mero-sheets. The
# registry has nothing published under it, so this remains a first publish.
[package.metadata.calimero]
package     = "com.calimero.mero-sheets"
name        = "P2P Sheets"
description = "Collaborative peer-to-peer spreadsheet with live cursors, multiple sheet tabs, formula autocomplete, a built-in function help section, and download support"
author      = "Calimero"
slug        = "com.calimero.mero-sheets"
icon        = "../app/public/icon-512.png"
tags        = ["productivity", "spreadsheet", "collaboration"]
github      = "https://github.com/calimero-network/apps"
# ⚠️ The contract was pinned to core 0.11.0-rc.8 — EIGHTEEN releases back. This
# value is the claim that an rc.28 node can run the bundle, and it is only true
# once the port in the PR body is done.
min-runtime-version = "0.11.0-rc.28"
frontend    = "https://mero-sheets.vercel.app"

[[package.metadata.calimero.services]]
name  = "spreadsheet"
crate = "mero-sheets"

[dependencies]
mero-sheets-types        = { path = "crates/types" }
mero-sheets-recalc       = { path = "crates/recalc" }
calimero-sdk            = { workspace = true }
calimero-storage        = { workspace = true }
calimero-storage-macros = { workspace = true }
hex                     = { workspace = true }

[dev-dependencies]
calimero-storage = { workspace = true, features = ["testing"] }
serial_test      = "3"

# NOTE: build.rs and its calimero-wasm-abi [build-dependencies] are GONE. Core
# deleted all 60 per-app ABI build scripts (#3319) and derives the ABI from the
# type system (#3364); `cargo mero build` is the emitter, and calimero-wasm-abi is
# not resolvable as an app dependency at the workspace tag.
#
# NOTE: no [profile.*] — cargo ignores profiles in a workspace member.
