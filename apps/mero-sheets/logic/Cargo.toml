[package]
name = "mero-sheets"
description = "Collaborative spreadsheet: sheets, formulas, comments, notes, roles and protected ranges, on the component SDK"
# NOT the release version: the release workflow takes the next appVersion from
# the registry and passes it to `mero-component bundle --app-version`. Cargo
# requires the field; bundling locally without --app-version uses it.
version = "0.1.0"
edition = "2021"
authors = ["Calimero Limited <info@calimero.network>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/calimero-network/apps"
publish = false

[lib]
# A `calimero:app` component. No `rlib`: the tests run the BUILT component on
# core's engine (tests/common/mod.rs), not the crate linked natively.
crate-type = ["cdylib"]

# Core at `component-core-tag` (root Cargo.toml), the same tag for every core
# crate; scripts/check-component-pins.py asserts it. A standalone crate cannot
# inherit `[workspace.dependencies]`.
[dependencies]
calimero-sdk = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.18" }
mero-sheets-types = { path = "crates/types" }
mero-sheets-recalc = { path = "crates/recalc" }
serde = { version = "1", features = ["derive"] }

# The harness (`TestApp`, `run_scenario`) and the builder the tests build this
# crate with, for `cargo test` on the host only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-sdk       = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.18", features = ["testing"] }
calimero-app-build = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.18" }
serde_json = "1"

# Read by `mero-component bundle` (tools/component-bundle), with the keys
# `cargo mero bundle` reads for a v1 app. The package id is unchanged.
[package.metadata.calimero]
package     = "com.calimero.mero-sheets"
name        = "P2P Sheets"
description = "Collaborative spreadsheet with live cursors, multiple sheet tabs, formula autocomplete, a built-in function help section, and download support"
author      = "Calimero"
slug        = "com.calimero.mero-sheets"
icon        = "../app/public/icon-512.png"
category    = "productivity"
tags        = ["productivity", "spreadsheet", "collaboration"]
github      = "https://github.com/calimero-network/apps"
# `component-min-runtime-version` in the root Cargo.toml: a node compares it
# with its own release.
min-runtime-version = "1.0.0-rc.18"
# The listing's link. NOT where the production frontend runs: a Cloud node
# trusts passkey ceremonies only from frontends it serves from a bundle, so
# the production frontend is the one packed below (docs/COMPONENT-APPS.md).
frontend    = "https://mero-sheets.vercel.app"
# The built frontend the bundle carries. Build it first: `pnpm -F mero-sheets build`.
frontend-dir = "../app/dist"

# Standalone: excluded from the root workspace (root Cargo.toml), its own
# Cargo.lock. The formula engine and the shared types are members, built for
# the host (tests) and wasm32-wasip2 (the component) with the contract.
# `recalc-wasm` (the browser's copy of the engine, built by
# `build-recalc-wasm.sh`) is a member but not a default one.
[workspace]
members = ["crates/types", "crates/recalc", "crates/recalc-wasm"]
default-members = [".", "crates/types", "crates/recalc"]

[profile.release]
codegen-units = 1
lto = true
