# Spec smoke workflow for mero-sheets — exercises all mutate API methods end-to-end
# across two merod nodes. The deterministic floor installs the bundle, bootstraps
# namespace + context, then calls every parameterless view. Mutate steps follow and
# each is paired with a wait_for_sync + view assertion on node 2.
#
# Usage:  merobox bootstrap run test/spec-smoke.workflow.yml
# Pre-flight: `bash logic/build-bundle.sh` must have produced
#   logic/res/mero-sheets-1.0.0.mpk  (appName/appVersion from studio.config.json)

name: mero-sheets spec smoke
description: Smoke-test all spreadsheet service mutate methods across two merod nodes.
log_level: info
nodes:
  count: 2
  prefix: app-node
  image: ghcr.io/calimero-network/merod:0.11.0-rc.28
  base_port: 12428
  base_rpc_port: 12528
nuke_on_start: true
nuke_on_end: true
wait_timeout: 90

steps:
  # ---- Bootstrap: install + namespace + context ----

  - type: install_application
    name: Install mero-sheets bundle on app-node-1
    node: app-node-1
    dev: true
    path: dist/com.calimero.mero-sheets.mpk
    outputs:
      app_id: applicationId

  - type: install_application
    name: Install mero-sheets bundle on app-node-2
    node: app-node-2
    dev: true
    path: dist/com.calimero.mero-sheets.mpk

  - type: create_namespace
    name: Create namespace on app-node-1
    node: app-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - type: create_context
    name: Create spreadsheet context on app-node-1
    node: app-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    service_name: spreadsheet
    outputs:
      spreadsheet_ctx: contextId

  - type: create_namespace_invitation
    name: Issue namespace invitation from app-node-1
    node: app-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  # ⚠️ A join races core's KeyDelivery window: the group key is gossiped with a
  # ~5s budget and, on fresh nodes, mDNS discovery has to complete inside it too.
  # Without a settle the join 500s. 12s, matching every other join in the fleet
  # and the write-up in
  # apps/scaffolding-e2e/logic/workflows/group-late-joiner.yml.
  - type: wait
    seconds: 12

  - type: join_namespace
    name: app-node-2 joins namespace
    node: app-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'

  # ---- Floor: parameterless view calls (baseline assertions) ----

  - type: call
    name: View list_sheets on app-node-1 (baseline)
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: list_sheets
    args: {}
    outputs:
      sheets_baseline: result.output

  - type: json_assert
    name: list_sheets returns empty list initially
    statements:
      - 'json_equal({{sheets_baseline}}, [])'

  - type: call
    name: View get_cursors on app-node-1 (baseline)
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: get_cursors
    args: {}
    outputs:
      cursors_baseline: result.output

  - type: json_assert
    name: get_cursors returns empty list initially
    statements:
      - 'json_equal({{cursors_baseline}}, [])'

  - type: call
    name: View get_functions on app-node-1
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: get_functions
    args: {}
    outputs:
      functions_list: result.output

  - type: call
    name: View search_functions("SU") on app-node-1
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: search_functions
    args:
      prefix: "SU"
    outputs:
      su_functions: result.output

  - type: call
    name: View export_all on app-node-1 (baseline)
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: export_all
    args: {}
    outputs:
      all_sheets_baseline: result.output

  - type: json_assert
    name: export_all returns empty list initially
    statements:
      - 'json_equal({{all_sheets_baseline}}, [])'

  # ---- Mutate: init_project ----

  - type: call
    name: Exercise init_project on app-node-1
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: init_project
    args:
      name: "Q3 Budget"
    outputs:
      project_id: result.output

  - type: wait_for_sync
    name: Wait for sync after init_project
    context_id: '{{spreadsheet_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30
    trigger_sync: true

  # ---- Mutate: create_sheet ----

  - type: call
    name: Exercise create_sheet on app-node-1
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: create_sheet
    args:
      name: "Revenue"
    outputs:
      sheet_id: result.output

  - type: wait_for_sync
    name: Wait for sync after create_sheet
    context_id: '{{spreadsheet_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: Confirm new sheet visible on app-node-2 after create_sheet
    node: app-node-2
    context_id: '{{spreadsheet_ctx}}'
    method: list_sheets
    args: {}
    outputs:
      sheet_0: result.output.0

  - type: json_assert
    name: create_sheet produced a visible Sheet on app-node-2
    statements:
      - 'json_subset({{sheet_0}}, {"name": "Revenue"})'

  # ---- Mutate: set_cell ----

  - type: call
    name: Exercise set_cell on app-node-1
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: set_cell
    args:
      sheet_id: '{{sheet_id}}'
      row: 0
      col: 0
      raw_value: "1500"
    outputs:
      cell_id: result.output

  # ---- Mutate: set_cell_formula ----

  - type: call
    name: Exercise set_cell_formula on app-node-1
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: set_cell_formula
    args:
      sheet_id: '{{sheet_id}}'
      row: 5
      col: 0
      formula: "=SUM(A1:A5)"
    outputs:
      formula_cell_id: result.output

  - type: wait_for_sync
    name: Wait for sync after set_cell operations
    context_id: '{{spreadsheet_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: Confirm cell visible on app-node-2 after set_cell
    node: app-node-2
    context_id: '{{spreadsheet_ctx}}'
    method: get_cells
    args:
      sheet_id: '{{sheet_id}}'
    outputs:
      cell_0: result.output.0

  - type: json_assert
    name: set_cell produced a visible Cell on app-node-2
    statements:
      - 'json_subset({{cell_0}}, {"raw_value": "1500"})'

  # ---- Mutate: update_cursor ----

  - type: call
    name: Exercise update_cursor on app-node-1
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: update_cursor
    args:
      sheet_id: '{{sheet_id}}'
      row: 2
      col: 3

  - type: wait_for_sync
    name: Wait for sync after update_cursor
    context_id: '{{spreadsheet_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: Confirm cursor visible on app-node-2 after update_cursor
    node: app-node-2
    context_id: '{{spreadsheet_ctx}}'
    method: get_cursors
    args: {}
    outputs:
      cursor_0: result.output.0

  - type: json_assert
    name: update_cursor produced a visible Cursor on app-node-2
    statements:
      - 'json_subset({{cursor_0}}, {"row": 2, "col": 3})'

  # ---- Mutate: rename_sheet ----

  - type: call
    name: Exercise rename_sheet on app-node-1
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: rename_sheet
    args:
      sheet_id: '{{sheet_id}}'
      new_name: "Revenue Q3"

  - type: wait_for_sync
    name: Wait for sync after rename_sheet
    context_id: '{{spreadsheet_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: Confirm sheet renamed on app-node-2
    node: app-node-2
    context_id: '{{spreadsheet_ctx}}'
    method: list_sheets
    args: {}
    outputs:
      renamed_sheet: result.output.0

  - type: json_assert
    name: rename_sheet updated the sheet name visible on app-node-2
    statements:
      - 'json_subset({{renamed_sheet}}, {"name": "Revenue Q3"})'

  # ---- Mutate: clear_cell ----

  - type: call
    name: Exercise clear_cell on app-node-1
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: clear_cell
    args:
      sheet_id: '{{sheet_id}}'
      row: 0
      col: 0

  # ---- Mutate: remove_cursor ----

  - type: call
    name: Exercise remove_cursor on app-node-1
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: remove_cursor
    args: {}

  - type: wait_for_sync
    name: Wait for sync after clear_cell and remove_cursor
    context_id: '{{spreadsheet_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: Confirm cursor list empty on app-node-2 after remove_cursor
    node: app-node-2
    context_id: '{{spreadsheet_ctx}}'
    method: get_cursors
    args: {}
    outputs:
      cursors_after_remove: result.output

  - type: json_assert
    name: remove_cursor cleared the cursor list on app-node-2
    statements:
      - 'json_equal({{cursors_after_remove}}, [])'

  # ---- Mutate: delete_sheet ----

  - type: call
    name: Exercise delete_sheet on app-node-1
    node: app-node-1
    context_id: '{{spreadsheet_ctx}}'
    method: delete_sheet
    args:
      sheet_id: '{{sheet_id}}'

  - type: wait_for_sync
    name: Wait for sync after delete_sheet
    context_id: '{{spreadsheet_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: Confirm sheet list empty on app-node-2 after delete_sheet
    node: app-node-2
    context_id: '{{spreadsheet_ctx}}'
    method: list_sheets
    args: {}
    outputs:
      sheets_after_delete: result.output

  - type: json_assert
    name: delete_sheet cleared the sheet list on app-node-2
    statements:
      - 'json_equal({{sheets_after_delete}}, [])'
