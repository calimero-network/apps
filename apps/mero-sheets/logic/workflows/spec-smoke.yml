# Spec smoke for mero-sheets: every shared-state method, called by a real node
# over the wire, with the result read back on the OTHER node after sync.
#
# app-node-1 creates the workbook; app-node-2 joins the namespace and is the
# second member. Private sheets are asserted NOT to reach node 2; roles and
# protected ranges are asserted to refuse node 2's writes. The cross-workbook
# (xcall) methods need two contexts on one node and live in links.yml.
#
# Run by hand from logic/ once `cargo mero bundle` has written
# dist/com.calimero.mero-sheets.mpk:
#
#   merobox bootstrap run workflows/spec-smoke.yml

name: mero-sheets spec smoke
description: Every shared-state method across two merod nodes, read back after sync.
log_level: info
# ⚠️ REQUIRED. Without it, `merod init`'s default `bootstrap.nodes` survives (the
# public devnet boot-node), the containers never find each other, and the
# namespace join dies on `KeyDelivery timed out`. `e2e_mode` clears it, turns on
# multicast discovery and tightens the sync intervals.
e2e_mode: true

nodes:
  count: 2
  prefix: app-node
  image: ghcr.io/calimero-network/merod:0.11.0-rc.49
  base_port: 12428
  base_rpc_port: 12528
nuke_on_start: true
nuke_on_end: true
wait_timeout: 90

steps:
  # ---- Bootstrap: install, namespace, context, second member ----

  - type: install_application
    name: Install mero-sheets bundle on app-node-1
    node: app-node-1
    dev: true
    path: dist/com.calimero.mero-sheets.mpk
    outputs:
      app_id: applicationId

  - type: install_application
    name: Install mero-sheets bundle on app-node-2
    node: app-node-2
    dev: true
    path: dist/com.calimero.mero-sheets.mpk

  # ⚠️ Container health is not readiness: on a cold host the first admin call
  # 500s a few seconds in.
  - name: Settle before the first admin call
    type: wait
    seconds: 12

  - type: create_namespace
    name: Create namespace on app-node-1
    node: app-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - type: create_context
    name: Create spreadsheet context on app-node-1
    node: app-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    service_name: spreadsheet
    outputs:
      ctx: contextId

  - type: create_namespace_invitation
    name: Issue namespace invitation from app-node-1
    node: app-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  # ⚠️ The join races core's KeyDelivery window (~5s, with mDNS discovery inside
  # it on fresh nodes). See apps/scaffolding-e2e/logic/workflows/group-late-joiner.yml.
  - type: wait
    seconds: 12

  - type: join_namespace
    name: app-node-2 joins namespace
    node: app-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'


  # ---- Empty workbook: views before anything is written ----


  - type: call
    name: "get_project before init_project"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_project
    args: {}
    outputs:
      project_before: result.output

  - type: json_assert
    name: "no project yet"
    statements:
      - "json_subset({{project_before}}, {\"name\": \"\"})"

  - type: call
    name: "list_sheets is empty"
    node: app-node-1
    context_id: '{{ctx}}'
    method: list_sheets
    args: {}
    outputs:
      sheets_before: result.output

  - type: json_assert
    name: "no sheets yet"
    statements:
      - "json_equal({{sheets_before}}, [])"

  - type: call
    name: "get_functions"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_functions
    args: {}
    outputs:
      fn_sum: result.output

  - type: assert
    name: "the catalog has SUM and IF"
    statements:
      - "contains({{fn_sum}}, 'SUM')"
      - "contains({{fn_sum}}, 'IF')"

  - type: call
    name: "search_functions by prefix"
    node: app-node-1
    context_id: '{{ctx}}'
    method: search_functions
    args:
      prefix: "AVER"
    outputs:
      fn_aver: result.output.0.name

  - type: assert
    name: "AVER finds AVERAGE first"
    statements:
      - "equal({{fn_aver}}, 'AVERAGE')"


  # ---- Project, members, sheets ----


  - type: call
    name: "init_project"
    node: app-node-1
    context_id: '{{ctx}}'
    method: init_project
    args:
      name: "Q3 Budget"
    outputs:
      project_id: result.output

  - type: call
    name: "node 1 joins as Ada"
    node: app-node-1
    context_id: '{{ctx}}'
    method: join
    args:
      nickname: "Ada"

  - type: call
    name: "whoami on node 1"
    node: app-node-1
    context_id: '{{ctx}}'
    method: whoami
    args: {}
    outputs:
      ada: result.output

  - type: call
    name: "create_sheet"
    node: app-node-1
    context_id: '{{ctx}}'
    method: create_sheet
    args:
      name: "Revenue"
    outputs:
      sheet: result.output

  - type: wait_for_sync
    name: "sync the project and sheet"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "node 2 joins as Bob"
    node: app-node-2
    context_id: '{{ctx}}'
    method: join
    args:
      nickname: "Bob"

  - type: call
    name: "whoami on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: whoami
    args: {}
    outputs:
      bob: result.output

  - type: call
    name: "get_project on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_project
    args: {}
    outputs:
      project_after: result.output

  - type: json_assert
    name: "node 2 sees the project"
    statements:
      - "json_subset({{project_after}}, {\"name\": \"Q3 Budget\"})"

  - type: wait_for_sync
    name: "sync Bob's join"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "get_members on node 1"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_members
    args: {}
    outputs:
      members: result.output

  - type: assert
    name: "both members are on the roster"
    statements:
      - "contains({{members}}, 'Ada')"
      - "contains({{members}}, 'Bob')"

  - type: call
    name: "rename_sheet"
    node: app-node-1
    context_id: '{{ctx}}'
    method: rename_sheet
    args:
      sheet_id: '{{sheet}}'
      new_name: "Income"


  # ---- Cells: values, formulas, formats, batches ----


  - type: call
    name: "set_cell A1"
    node: app-node-1
    context_id: '{{ctx}}'
    method: set_cell
    args:
      sheet_id: '{{sheet}}'
      row_id: "0"
      col_id: "0"
      raw_value: "1500"

  - type: call
    name: "set_cell A2 to a formula"
    node: app-node-1
    context_id: '{{ctx}}'
    method: set_cell
    args:
      sheet_id: '{{sheet}}'
      row_id: "1"
      col_id: "0"
      raw_value: "=A1*2"

  - type: call
    name: "set_cell_format A1"
    node: app-node-1
    context_id: '{{ctx}}'
    method: set_cell_format
    args:
      sheet_id: '{{sheet}}'
      row_id: "0"
      col_id: "0"
      format: "currency"

  - type: call
    name: "apply_cell_ops: set, format and clear in one batch"
    node: app-node-1
    context_id: '{{ctx}}'
    method: apply_cell_ops
    args:
      sheet_id: '{{sheet}}'
      ops: [{"name": "Set", "payload": {"row_id": "0", "col_id": "1", "raw_value": "10"}}, {"name": "Format", "payload": {"row_id": "0", "col_id": "1", "format": "percent"}}, {"name": "Set", "payload": {"row_id": "2", "col_id": "0", "raw_value": "scratch"}}, {"name": "Clear", "payload": {"row_id": "2", "col_id": "0"}}]

  - type: call
    name: "clear_cell B1"
    node: app-node-1
    context_id: '{{ctx}}'
    method: clear_cell
    args:
      sheet_id: '{{sheet}}'
      row_id: "0"
      col_id: "1"

  - type: wait_for_sync
    name: "sync the cell edits"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "get_cells on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_cells
    args:
      sheet_id: '{{sheet}}'
    outputs:
      cell_a1: result.output.0
      cell_a2: result.output.1

  - type: json_assert
    name: "node 2 has A1 with its format"
    statements:
      - "json_subset({{cell_a1}}, {\"row_id\": \"0\", \"col_id\": \"0\", \"raw_value\": \"1500\", \"format\": \"currency\"})"

  - type: json_assert
    name: "node 2 computes A2's formula"
    statements:
      - "json_subset({{cell_a2}}, {\"row_id\": \"1\", \"col_id\": \"0\", \"raw_value\": \"=A1*2\", \"computed_value\": \"3000\"})"

  - type: call
    name: "get_all_cells on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_all_cells
    args: {}
    outputs:
      all_cells: result.output

  - type: assert
    name: "B1 and A3 were cleared, value and format"
    statements:
      - "not_contains({{all_cells}}, 'scratch')"
      - "not_contains({{all_cells}}, 'percent')"


  # ---- Rows and columns by id ----


  - type: call
    name: "apply_axis_ops: insert a row between rows 1 and 2"
    node: app-node-1
    context_id: '{{ctx}}'
    method: apply_axis_ops
    args:
      sheet_id: '{{sheet}}'
      ops: [{"name": "InsertRow", "payload": {"id": "ra", "pos": "50000000005"}}, {"name": "InsertCol", "payload": {"id": "ca", "pos": "50000000005"}}, {"name": "DeleteCol", "payload": {"id": "ca"}}, {"name": "RestoreCol", "payload": {"id": "ca"}}, {"name": "DeleteRow", "payload": {"id": "ra"}}, {"name": "RestoreRow", "payload": {"id": "ra"}}]

  - type: call
    name: "set a value in the inserted row"
    node: app-node-1
    context_id: '{{ctx}}'
    method: set_cell
    args:
      sheet_id: '{{sheet}}'
      row_id: "ra"
      col_id: "0"
      raw_value: "7"

  - type: wait_for_sync
    name: "sync the axis ops"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "get_layouts on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_layouts
    args: {}
    outputs:
      layout: result.output.0

  - type: json_assert
    name: "the inserted row and column are live on node 2"
    statements:
      - "json_subset({{layout}}, {\"sheet_id\": \"{{sheet}}\", \"rows\": [{\"id\": \"ra\", \"pos\": \"50000000005\", \"deleted\": false}], \"cols\": [{\"id\": \"ca\", \"pos\": \"50000000005\", \"deleted\": false}]})"


  # ---- Named ranges ----


  - type: call
    name: "set_named_range"
    node: app-node-1
    context_id: '{{ctx}}'
    method: set_named_range
    args:
      name: "Rate"
      target: "A1"

  - type: call
    name: "use the name in a formula"
    node: app-node-1
    context_id: '{{ctx}}'
    method: set_cell
    args:
      sheet_id: '{{sheet}}'
      row_id: "3"
      col_id: "0"
      raw_value: "=RATE+1"

  - type: wait_for_sync
    name: "sync the named range"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "get_named_ranges on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_named_ranges
    args: {}
    outputs:
      name_0: result.output.0

  - type: json_assert
    name: "node 2 has the name, as it was typed"
    statements:
      - "json_subset({{name_0}}, {\"name\": \"Rate\", \"target\": \"A1\"})"

  - type: call
    name: "get_cells on node 2 after the name"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_cells
    args:
      sheet_id: '{{sheet}}'
    outputs:
      cell_a4: result.output.2

  - type: json_assert
    name: "node 2 evaluates =RATE+1 through the name"
    statements:
      - "json_subset({{cell_a4}}, {\"row_id\": \"3\", \"raw_value\": \"=RATE+1\", \"computed_value\": \"1501\"})"

  - type: call
    name: "delete_named_range (names match case-insensitively)"
    node: app-node-1
    context_id: '{{ctx}}'
    method: delete_named_range
    args:
      name: "RATE"

  - type: call
    name: "get_named_ranges after delete"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_named_ranges
    args: {}
    outputs:
      names_after: result.output

  - type: json_assert
    name: "the name is gone"
    statements:
      - "json_equal({{names_after}}, [])"


  # ---- Comments and notes ----


  - type: call
    name: "add_comment on A1 mentioning Bob"
    node: app-node-1
    context_id: '{{ctx}}'
    method: add_comment
    args:
      sheet_id: '{{sheet}}'
      row_id: "0"
      col_id: "0"
      text: "Is this right, @Bob?"
      parent: ""
    outputs:
      comment: result.output

  - type: wait_for_sync
    name: "sync the comment"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "Bob replies"
    node: app-node-2
    context_id: '{{ctx}}'
    method: add_comment
    args:
      sheet_id: '{{sheet}}'
      row_id: "0"
      col_id: "0"
      text: "Yes"
      parent: '{{comment}}'
    outputs:
      reply: result.output

  - type: call
    name: "Bob cannot edit Ada's comment"
    node: app-node-2
    context_id: '{{ctx}}'
    method: edit_comment
    args:
      id: '{{comment}}'
      text: "hijacked"
    expected_failure: true

  - type: call
    name: "edit_comment by its author"
    node: app-node-1
    context_id: '{{ctx}}'
    method: edit_comment
    args:
      id: '{{comment}}'
      text: "Is this right, @Bob? (Q3)"

  - type: call
    name: "set_comment_resolved"
    node: app-node-1
    context_id: '{{ctx}}'
    method: set_comment_resolved
    args:
      id: '{{comment}}'
      resolved: true

  - type: wait_for_sync
    name: "sync the thread"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "get_comments on node 1"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_comments
    args: {}
    outputs:
      comment_0: result.output.0
      comment_1: result.output.1

  - type: json_assert
    name: "the comment is edited, resolved and mentions Bob"
    statements:
      - "json_subset({{comment_0}}, {\"text\": \"Is this right, @Bob? (Q3)\", \"resolved\": true, \"author\": \"{{ada}}\", \"mentions\": [\"{{bob}}\"]})"

  - type: json_assert
    name: "Bob's reply is in the thread"
    statements:
      - "json_subset({{comment_1}}, {\"text\": \"Yes\", \"parent\": \"{{comment}}\"})"

  - type: call
    name: "delete_comment (the reply, by its author)"
    node: app-node-2
    context_id: '{{ctx}}'
    method: delete_comment
    args:
      id: '{{reply}}'

  - type: call
    name: "edit_note: type into A1's note"
    node: app-node-1
    context_id: '{{ctx}}'
    method: edit_note
    args:
      sheet_id: '{{sheet}}'
      row_id: "0"
      col_id: "0"
      ops: [{"insert": "Includes the Q2 carry-over"}]

  - type: wait_for_sync
    name: "sync the note"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "edit_note on node 2: append"
    node: app-node-2
    context_id: '{{ctx}}'
    method: edit_note
    args:
      sheet_id: '{{sheet}}'
      row_id: "0"
      col_id: "0"
      ops: [{"retain": 26}, {"insert": "."}]

  - type: wait_for_sync
    name: "sync the note edit"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "get_note on node 1"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_note
    args:
      sheet_id: '{{sheet}}'
      row_id: "0"
      col_id: "0"
    outputs:
      note: result.output

  - type: assert
    name: "both edits are in the note"
    statements:
      - "contains({{note}}, 'Includes the Q2 carry-over.')"

  - type: call
    name: "get_noted_cells"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_noted_cells
    args: {}
    outputs:
      noted: result.output.0

  - type: json_assert
    name: "A1 is marked as noted"
    statements:
      - "json_subset({{noted}}, {\"sheet_id\": \"{{sheet}}\", \"row_id\": \"0\", \"col_id\": \"0\"})"


  # ---- Styles, rules, charts, layout ----


  - type: call
    name: "apply_style_ops: bold and a fill on A1"
    node: app-node-1
    context_id: '{{ctx}}'
    method: apply_style_ops
    args:
      sheet_id: '{{sheet}}'
      ops: [{"row_id": "0", "col_id": "0", "field": "bold", "value": "1"}, {"row_id": "0", "col_id": "0", "field": "fill", "value": "#fde68a"}]

  - type: call
    name: "add_rule: conditional format"
    node: app-node-1
    context_id: '{{ctx}}'
    method: add_rule
    args:
      rule: {"sheet_id": "{{sheet}}", "top_row_id": "0", "left_col_id": "0", "bottom_row_id": "1", "right_col_id": "0", "kind": "format", "condition": "gt", "args": ["1000"], "style": {"color": "#b91c1c"}, "strict": false, "recipients": []}
    outputs:
      rule: result.output

  - type: call
    name: "update_rule"
    node: app-node-1
    context_id: '{{ctx}}'
    method: update_rule
    args:
      id: '{{rule}}'
      rule: {"sheet_id": "{{sheet}}", "top_row_id": "0", "left_col_id": "0", "bottom_row_id": "1", "right_col_id": "0", "kind": "format", "condition": "gt", "args": ["2000"], "style": {"color": "#b91c1c"}, "strict": false, "recipients": []}

  - type: call
    name: "add_chart"
    node: app-node-1
    context_id: '{{ctx}}'
    method: add_chart
    args:
      chart: {"sheet_id": "{{sheet}}", "top_row_id": "0", "left_col_id": "0", "bottom_row_id": "1", "right_col_id": "0", "kind": "bar", "title": "Income"}
    outputs:
      chart: result.output

  - type: call
    name: "update_chart"
    node: app-node-1
    context_id: '{{ctx}}'
    method: update_chart
    args:
      id: '{{chart}}'
      chart: {"sheet_id": "{{sheet}}", "top_row_id": "0", "left_col_id": "0", "bottom_row_id": "1", "right_col_id": "0", "kind": "line", "title": "Income by quarter"}

  - type: call
    name: "set_frozen"
    node: app-node-1
    context_id: '{{ctx}}'
    method: set_frozen
    args:
      sheet_id: '{{sheet}}'
      rows: 1
      cols: 1

  - type: call
    name: "set_sizes"
    node: app-node-1
    context_id: '{{ctx}}'
    method: set_sizes
    args:
      sheet_id: '{{sheet}}'
      sizes: [{"axis": "col", "id": "0", "size": 160}, {"axis": "row", "id": "0", "size": 40}]

  - type: call
    name: "add_attachment"
    node: app-node-1
    context_id: '{{ctx}}'
    method: add_attachment
    args:
      sheet_id: '{{sheet}}'
      row_id: "0"
      col_id: "0"
      blob_id: "abc123"
      name: "receipt.pdf"
      size: 2048
      mime: "application/pdf"
    outputs:
      attachment: result.output

  - type: wait_for_sync
    name: "sync styles, rules, charts, layout and attachments"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "get_styles on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_styles
    args: {}
    outputs:
      styles: result.output

  - type: assert
    name: "node 2 has the bold fill"
    statements:
      - "contains({{styles}}, '#fde68a')"

  - type: call
    name: "get_rules on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_rules
    args: {}
    outputs:
      rule_0: result.output.0

  - type: json_assert
    name: "node 2 has the updated rule"
    statements:
      - "json_subset({{rule_0}}, {\"id\": \"{{rule}}\", \"rule\": {\"kind\": \"format\", \"condition\": \"gt\", \"args\": [\"2000\"], \"style\": {\"color\": \"#b91c1c\"}}})"

  - type: call
    name: "get_charts on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_charts
    args: {}
    outputs:
      chart_0: result.output.0

  - type: json_assert
    name: "node 2 has the updated chart"
    statements:
      - "json_subset({{chart_0}}, {\"id\": \"{{chart}}\", \"chart\": {\"kind\": \"line\", \"title\": \"Income by quarter\"}})"

  - type: call
    name: "get_sheet_views on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_sheet_views
    args: {}
    outputs:
      view: result.output.0

  - type: json_assert
    name: "node 2 has the frozen panes"
    statements:
      - "json_subset({{view}}, {\"sheet_id\": \"{{sheet}}\", \"frozen_rows\": 1, \"frozen_cols\": 1})"

  - type: assert
    name: "node 2 has both sizes"
    statements:
      - "contains({{view}}, '160')"
      - "contains({{view}}, '40')"

  - type: call
    name: "get_attachments on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_attachments
    args: {}
    outputs:
      attachment_0: result.output.0

  - type: json_assert
    name: "node 2 has the attachment"
    statements:
      - "json_subset({{attachment_0}}, {\"name\": \"receipt.pdf\", \"blob_id\": \"abc123\", \"size\": 2048})"

  - type: call
    name: "remove_rule"
    node: app-node-1
    context_id: '{{ctx}}'
    method: remove_rule
    args:
      id: '{{rule}}'

  - type: call
    name: "remove_chart"
    node: app-node-1
    context_id: '{{ctx}}'
    method: remove_chart
    args:
      id: '{{chart}}'

  - type: call
    name: "remove_attachment"
    node: app-node-1
    context_id: '{{ctx}}'
    method: remove_attachment
    args:
      id: '{{attachment}}'

  - type: call
    name: "get_rules after remove"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_rules
    args: {}
    outputs:
      rules_after: result.output

  - type: json_assert
    name: "no rules left"
    statements:
      - "json_equal({{rules_after}}, [])"

  - type: call
    name: "get_charts after remove"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_charts
    args: {}
    outputs:
      charts_after: result.output

  - type: json_assert
    name: "no charts left"
    statements:
      - "json_equal({{charts_after}}, [])"

  - type: call
    name: "get_attachments after remove"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_attachments
    args: {}
    outputs:
      att_after: result.output

  - type: json_assert
    name: "no attachments left"
    statements:
      - "json_equal({{att_after}}, [])"


  # ---- Private sheets stay on their node ----


  - type: call
    name: "create_private_sheet"
    node: app-node-1
    context_id: '{{ctx}}'
    method: create_private_sheet
    args:
      name: "What-if"
    outputs:
      private: result.output

  - type: call
    name: "apply_private_cell_ops"
    node: app-node-1
    context_id: '{{ctx}}'
    method: apply_private_cell_ops
    args:
      sheet_id: '{{private}}'
      ops: [{"name": "Set", "payload": {"row_id": "0", "col_id": "0", "raw_value": "secret"}}]

  - type: call
    name: "rename_private_sheet"
    node: app-node-1
    context_id: '{{ctx}}'
    method: rename_private_sheet
    args:
      sheet_id: '{{private}}'
      name: "What-if 2"

  - type: call
    name: "get_private_sheets on node 1"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_private_sheets
    args: {}
    outputs:
      private_1: result.output.0

  - type: json_assert
    name: "node 1 has it, renamed"
    statements:
      - "json_subset({{private_1}}, {\"id\": \"{{private}}\", \"name\": \"What-if 2\"})"

  - type: call
    name: "get_private_cells on node 1"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_private_cells
    args: {}
    outputs:
      pcells_1: result.output.0

  - type: json_assert
    name: "node 1 has its cell"
    statements:
      - "json_subset({{pcells_1}}, {\"sheet_id\": \"{{private}}\", \"raw_value\": \"secret\"})"

  - type: wait_for_sync
    name: "sync (nothing private may travel)"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "get_private_sheets on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_private_sheets
    args: {}
    outputs:
      private_2: result.output

  - type: json_assert
    name: "node 2 has no private sheets"
    statements:
      - "json_equal({{private_2}}, [])"

  - type: call
    name: "get_private_cells on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_private_cells
    args: {}
    outputs:
      pcells_2: result.output

  - type: json_assert
    name: "node 2 has no private cells"
    statements:
      - "json_equal({{pcells_2}}, [])"

  - type: call
    name: "export_all on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: export_all
    args: {}
    outputs:
      export_2: result.output

  - type: assert
    name: "the export has no private sheet"
    statements:
      - "not_contains({{export_2}}, 'What-if')"

  - type: call
    name: "delete_private_sheet"
    node: app-node-1
    context_id: '{{ctx}}'
    method: delete_private_sheet
    args:
      sheet_id: '{{private}}'


  # ---- Roles and protected ranges ----


  - type: call
    name: "set_role: Bob becomes a viewer"
    node: app-node-1
    context_id: '{{ctx}}'
    method: set_role
    args:
      member_id: '{{bob}}'
      role: "viewer"

  - type: wait_for_sync
    name: "sync the role"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "a viewer's write is refused"
    node: app-node-2
    context_id: '{{ctx}}'
    method: set_cell
    args:
      sheet_id: '{{sheet}}'
      row_id: "5"
      col_id: "0"
      raw_value: "nope"
    expected_failure: true

  - type: call
    name: "set_role: Bob is an editor again"
    node: app-node-1
    context_id: '{{ctx}}'
    method: set_role
    args:
      member_id: '{{bob}}'
      role: "editor"

  - type: wait_for_sync
    name: "sync Bob's editor role"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "an editor cannot change roles (owners only)"
    node: app-node-2
    context_id: '{{ctx}}'
    method: set_role
    args:
      member_id: '{{ada}}'
      role: "viewer"
    expected_failure: true

  - type: call
    name: "protect_range A1:A2, Ada only"
    node: app-node-1
    context_id: '{{ctx}}'
    method: protect_range
    args:
      sheet_id: '{{sheet}}'
      top_row_id: "0"
      left_col_id: "0"
      bottom_row_id: "1"
      right_col_id: "0"
      description: "Totals"
      editors: []
    outputs:
      protection: result.output

  - type: call
    name: "update_protection"
    node: app-node-1
    context_id: '{{ctx}}'
    method: update_protection
    args:
      id: '{{protection}}'
      description: "Totals (locked)"
      editors: []

  - type: wait_for_sync
    name: "sync the role and protection"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "get_protections on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_protections
    args: {}
    outputs:
      protection_0: result.output.0

  - type: json_assert
    name: "node 2 has the protection"
    statements:
      - "json_subset({{protection_0}}, {\"id\": \"{{protection}}\", \"description\": \"Totals (locked)\"})"

  - type: call
    name: "Bob's write inside the range is refused"
    node: app-node-2
    context_id: '{{ctx}}'
    method: set_cell
    args:
      sheet_id: '{{sheet}}'
      row_id: "0"
      col_id: "0"
      raw_value: "0"
    expected_failure: true

  - type: call
    name: "Bob's write outside it lands"
    node: app-node-2
    context_id: '{{ctx}}'
    method: set_cell
    args:
      sheet_id: '{{sheet}}'
      row_id: "5"
      col_id: "0"
      raw_value: "42"

  - type: call
    name: "remove_protection"
    node: app-node-1
    context_id: '{{ctx}}'
    method: remove_protection
    args:
      id: '{{protection}}'

  - type: wait_for_sync
    name: "sync Bob's edit and the removal"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "get_cells on node 1"
    node: app-node-1
    context_id: '{{ctx}}'
    method: get_cells
    args:
      sheet_id: '{{sheet}}'
    outputs:
      final_a1: result.output.0
      final_a6: result.output.3

  - type: json_assert
    name: "the protected cell kept its value"
    statements:
      - "json_subset({{final_a1}}, {\"row_id\": \"0\", \"col_id\": \"0\", \"raw_value\": \"1500\"})"

  - type: json_assert
    name: "Bob's edit outside the range reached node 1"
    statements:
      - "json_subset({{final_a6}}, {\"row_id\": \"5\", \"col_id\": \"0\", \"raw_value\": \"42\", \"last_editor\": \"{{bob}}\"})"


  # ---- History ----


  - type: call
    name: "get_activity on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: get_activity
    args:
      since: 0
      limit: 200
    outputs:
      activity: result.output

  - type: assert
    name: "both members' edits are in the log"
    statements:
      - "contains({{activity}}, '{{ada}}')"
      - "contains({{activity}}, '{{bob}}')"

  - type: call
    name: "export_all on node 1"
    node: app-node-1
    context_id: '{{ctx}}'
    method: export_all
    args: {}
    outputs:
      export: result.output

  - type: assert
    name: "the export carries the sheet"
    statements:
      - "contains({{export}}, 'Income')"

  - type: call
    name: "delete_sheet"
    node: app-node-1
    context_id: '{{ctx}}'
    method: delete_sheet
    args:
      sheet_id: '{{sheet}}'

  - type: wait_for_sync
    name: "sync the delete"
    context_id: '{{ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 60
    trigger_sync: true

  - type: call
    name: "list_sheets on node 2"
    node: app-node-2
    context_id: '{{ctx}}'
    method: list_sheets
    args: {}
    outputs:
      sheets_final: result.output

  - type: assert
    name: "the sheet is gone on node 2"
    statements:
      - "not_contains({{sheets_final}}, 'Income')"
