# Ported from spec-smoke.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x16: replication is synchronous: a read sees every committed write
name: mero-sheets spec smoke
description: Every shared-state method across two merod nodes, read back after sync.
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3450
accounts:
- app-node-1
- app-node-2
steps:
- name: Install mero-sheets bundle on app-node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_sheets.wasm'
  outputs:
    app_id_bundle: hash
  account: app-node-1
- type: set
  values:
    app_id: com.calimero.mero-sheets
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create namespace on app-node-1
  type: create_org
  org_name: Create namespace on app-node-1
  outputs:
    namespace_id: orgId
  account: app-node-1
- name: Create spreadsheet context on app-node-1
  type: deploy
  account: app-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_sheets.wasm'
  app_name: spreadsheet
  org: '{{namespace_id}}'
  outputs:
    ctx: contextId
- name: Issue namespace invitation from app-node-1
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-node-1
  outputs:
    invitation: token
- type: wait
  seconds: 1.0
- name: app-node-2 joins namespace
  type: redeem_invite
  token: '{{invitation}}'
  account: app-node-2
- name: get_project before init_project
  type: call
  app: '{{ctx}}'
  method: get_project
  args: {}
  account: app-node-1
  outputs:
    project_before: result
- type: json_assert
  name: no project yet
  statements:
  - 'json_subset({{project_before}}, {"name": ""})'
- name: list_sheets is empty
  type: call
  app: '{{ctx}}'
  method: list_sheets
  args: {}
  account: app-node-1
  outputs:
    sheets_before: result
- type: json_assert
  name: no sheets yet
  statements:
  - json_equal({{sheets_before}}, [])
- name: get_functions
  type: call
  app: '{{ctx}}'
  method: get_functions
  args: {}
  account: app-node-1
  outputs:
    fn_sum: result
- type: assert
  name: the catalog has SUM and IF
  statements:
  - contains({{fn_sum}}, 'SUM')
  - contains({{fn_sum}}, 'IF')
- name: search_functions by prefix
  type: call
  app: '{{ctx}}'
  method: search_functions
  args:
    prefix: AVER
  account: app-node-1
  outputs:
    fn_aver: result.0.name
- type: assert
  name: AVER finds AVERAGE first
  statements:
  - equal({{fn_aver}}, 'AVERAGE')
- name: init_project
  type: call
  app: '{{ctx}}'
  method: init_project
  args:
    name: Q3 Budget
  account: app-node-1
  outputs:
    project_id: result
- name: node 1 joins as Ada
  type: call
  app: '{{ctx}}'
  method: join
  args:
    nickname: Ada
  account: app-node-1
- name: whoami on node 1
  type: call
  app: '{{ctx}}'
  method: whoami
  args: {}
  account: app-node-1
  outputs:
    ada: result
- name: create_sheet
  type: call
  app: '{{ctx}}'
  method: create_sheet
  args:
    name: Revenue
  account: app-node-1
  outputs:
    sheet: result
- name: node 2 joins as Bob
  type: call
  app: '{{ctx}}'
  method: join
  args:
    nickname: Bob
  account: app-node-2
- name: whoami on node 2
  type: call
  app: '{{ctx}}'
  method: whoami
  args: {}
  account: app-node-2
  outputs:
    bob: result
- name: get_project on node 2
  type: call
  app: '{{ctx}}'
  method: get_project
  args: {}
  account: app-node-2
  outputs:
    project_after: result
- type: json_assert
  name: node 2 sees the project
  statements:
  - 'json_subset({{project_after}}, {"name": "Q3 Budget"})'
- name: get_members on node 1
  type: call
  app: '{{ctx}}'
  method: get_members
  args: {}
  account: app-node-1
  outputs:
    members: result
- type: assert
  name: both members are on the roster
  statements:
  - contains({{members}}, 'Ada')
  - contains({{members}}, 'Bob')
- name: rename_sheet
  type: call
  app: '{{ctx}}'
  method: rename_sheet
  args:
    sheet_id: '{{sheet}}'
    new_name: Income
  account: app-node-1
- name: set_cell A1
  type: call
  app: '{{ctx}}'
  method: set_cell
  args:
    sheet_id: '{{sheet}}'
    row_id: '0'
    col_id: '0'
    raw_value: '1500'
  account: app-node-1
- name: set_cell A2 to a formula
  type: call
  app: '{{ctx}}'
  method: set_cell
  args:
    sheet_id: '{{sheet}}'
    row_id: '1'
    col_id: '0'
    raw_value: =A1*2
  account: app-node-1
- name: set_cell_format A1
  type: call
  app: '{{ctx}}'
  method: set_cell_format
  args:
    sheet_id: '{{sheet}}'
    row_id: '0'
    col_id: '0'
    format: currency
  account: app-node-1
- name: 'apply_cell_ops: set, format and clear in one batch'
  type: call
  app: '{{ctx}}'
  method: apply_cell_ops
  args:
    sheet_id: '{{sheet}}'
    ops:
    - name: Set
      payload:
        row_id: '0'
        col_id: '1'
        raw_value: '10'
    - name: Format
      payload:
        row_id: '0'
        col_id: '1'
        format: percent
    - name: Set
      payload:
        row_id: '2'
        col_id: '0'
        raw_value: scratch
    - name: Clear
      payload:
        row_id: '2'
        col_id: '0'
  account: app-node-1
- name: clear_cell B1
  type: call
  app: '{{ctx}}'
  method: clear_cell
  args:
    sheet_id: '{{sheet}}'
    row_id: '0'
    col_id: '1'
  account: app-node-1
- name: get_cells on node 2
  type: call
  app: '{{ctx}}'
  method: get_cells
  args:
    sheet_id: '{{sheet}}'
  account: app-node-2
  outputs:
    cell_a1: result.0
    cell_a2: result.1
- type: json_assert
  name: node 2 has A1 with its format
  statements:
  - 'json_subset({{cell_a1}}, {"row_id": "0", "col_id": "0", "raw_value": "1500", "format": "currency"})'
- type: json_assert
  name: node 2 computes A2's formula
  statements:
  - 'json_subset({{cell_a2}}, {"row_id": "1", "col_id": "0", "raw_value": "=A1*2", "computed_value": "3000"})'
- name: get_all_cells on node 2
  type: call
  app: '{{ctx}}'
  method: get_all_cells
  args: {}
  account: app-node-2
  outputs:
    all_cells: result
- type: assert
  name: B1 and A3 were cleared, value and format
  statements:
  - not_contains({{all_cells}}, 'scratch')
  - not_contains({{all_cells}}, 'percent')
- name: 'apply_axis_ops: insert a row between rows 1 and 2'
  type: call
  app: '{{ctx}}'
  method: apply_axis_ops
  args:
    sheet_id: '{{sheet}}'
    ops:
    - name: InsertRow
      payload:
        id: ra
        pos: '50000000005'
    - name: InsertCol
      payload:
        id: ca
        pos: '50000000005'
    - name: DeleteCol
      payload:
        id: ca
    - name: RestoreCol
      payload:
        id: ca
    - name: DeleteRow
      payload:
        id: ra
    - name: RestoreRow
      payload:
        id: ra
  account: app-node-1
- name: set a value in the inserted row
  type: call
  app: '{{ctx}}'
  method: set_cell
  args:
    sheet_id: '{{sheet}}'
    row_id: ra
    col_id: '0'
    raw_value: '7'
  account: app-node-1
- name: get_layouts on node 2
  type: call
  app: '{{ctx}}'
  method: get_layouts
  args: {}
  account: app-node-2
  outputs:
    layout: result.0
- type: json_assert
  name: the inserted row and column are live on node 2
  statements:
  - 'json_subset({{layout}}, {"sheet_id": "{{sheet}}", "rows": [{"id": "ra", "pos": "50000000005", "deleted":
    false}], "cols": [{"id": "ca", "pos": "50000000005", "deleted": false}]})'
- name: set_named_range
  type: call
  app: '{{ctx}}'
  method: set_named_range
  args:
    name: Rate
    target: A1
  account: app-node-1
- name: use the name in a formula
  type: call
  app: '{{ctx}}'
  method: set_cell
  args:
    sheet_id: '{{sheet}}'
    row_id: '3'
    col_id: '0'
    raw_value: =RATE+1
  account: app-node-1
- name: get_named_ranges on node 2
  type: call
  app: '{{ctx}}'
  method: get_named_ranges
  args: {}
  account: app-node-2
  outputs:
    name_0: result.0
- type: json_assert
  name: node 2 has the name, as it was typed
  statements:
  - 'json_subset({{name_0}}, {"name": "Rate", "target": "A1"})'
- name: get_cells on node 2 after the name
  type: call
  app: '{{ctx}}'
  method: get_cells
  args:
    sheet_id: '{{sheet}}'
  account: app-node-2
  outputs:
    cell_a4: result.2
- type: json_assert
  name: node 2 evaluates =RATE+1 through the name
  statements:
  - 'json_subset({{cell_a4}}, {"row_id": "3", "raw_value": "=RATE+1", "computed_value": "1501"})'
- name: delete_named_range (names match case-insensitively)
  type: call
  app: '{{ctx}}'
  method: delete_named_range
  args:
    name: RATE
  account: app-node-1
- name: get_named_ranges after delete
  type: call
  app: '{{ctx}}'
  method: get_named_ranges
  args: {}
  account: app-node-1
  outputs:
    names_after: result
- type: json_assert
  name: the name is gone
  statements:
  - json_equal({{names_after}}, [])
- name: add_comment on A1 mentioning Bob
  type: call
  app: '{{ctx}}'
  method: add_comment
  args:
    sheet_id: '{{sheet}}'
    row_id: '0'
    col_id: '0'
    text: Is this right, @Bob?
    parent: ''
  account: app-node-1
  outputs:
    comment: result
- name: Bob replies
  type: call
  app: '{{ctx}}'
  method: add_comment
  args:
    sheet_id: '{{sheet}}'
    row_id: '0'
    col_id: '0'
    text: 'Yes'
    parent: '{{comment}}'
  account: app-node-2
  outputs:
    reply: result
- name: Bob cannot edit Ada's comment
  type: call
  app: '{{ctx}}'
  method: edit_comment
  args:
    id: '{{comment}}'
    text: hijacked
  account: app-node-2
  expected_failure: true
- name: edit_comment by its author
  type: call
  app: '{{ctx}}'
  method: edit_comment
  args:
    id: '{{comment}}'
    text: Is this right, @Bob? (Q3)
  account: app-node-1
- name: set_comment_resolved
  type: call
  app: '{{ctx}}'
  method: set_comment_resolved
  args:
    id: '{{comment}}'
    resolved: true
  account: app-node-1
- name: get_comments on node 1
  type: call
  app: '{{ctx}}'
  method: get_comments
  args: {}
  account: app-node-1
  outputs:
    comment_0: result.0
    comment_1: result.1
- type: json_assert
  name: the comment is edited, resolved and mentions Bob
  statements:
  - 'json_subset({{comment_0}}, {"text": "Is this right, @Bob? (Q3)", "resolved": true, "author": "{{ada}}",
    "mentions": ["{{bob}}"]})'
- type: json_assert
  name: Bob's reply is in the thread
  statements:
  - 'json_subset({{comment_1}}, {"text": "Yes", "parent": "{{comment}}"})'
- name: Bob cannot delete Ada's comment (its author or an owner only)
  type: call
  app: '{{ctx}}'
  method: delete_comment
  args:
    id: '{{comment}}'
  account: app-node-2
  expected_failure: true
- name: delete_comment (the reply, by its author)
  type: call
  app: '{{ctx}}'
  method: delete_comment
  args:
    id: '{{reply}}'
  account: app-node-2
- name: 'edit_note: type into A1''s note'
  type: call
  app: '{{ctx}}'
  method: edit_note
  args:
    sheet_id: '{{sheet}}'
    row_id: '0'
    col_id: '0'
    ops:
    - insert: Includes the Q2 carry-over
  account: app-node-1
- name: 'edit_note on node 2: append'
  type: call
  app: '{{ctx}}'
  method: edit_note
  args:
    sheet_id: '{{sheet}}'
    row_id: '0'
    col_id: '0'
    ops:
    - retain: 26
    - insert: .
  account: app-node-2
- name: get_note on node 1
  type: call
  app: '{{ctx}}'
  method: get_note
  args:
    sheet_id: '{{sheet}}'
    row_id: '0'
    col_id: '0'
  account: app-node-1
  outputs:
    note: result
- type: assert
  name: both edits are in the note
  statements:
  - contains({{note}}, 'Includes the Q2 carry-over.')
- name: get_noted_cells
  type: call
  app: '{{ctx}}'
  method: get_noted_cells
  args: {}
  account: app-node-1
  outputs:
    noted: result.0
- type: json_assert
  name: A1 is marked as noted
  statements:
  - 'json_subset({{noted}}, {"sheet_id": "{{sheet}}", "row_id": "0", "col_id": "0"})'
- name: 'apply_style_ops: bold and a fill on A1'
  type: call
  app: '{{ctx}}'
  method: apply_style_ops
  args:
    sheet_id: '{{sheet}}'
    ops:
    - row_id: '0'
      col_id: '0'
      field: bold
      value: '1'
    - row_id: '0'
      col_id: '0'
      field: fill
      value: '#fde68a'
  account: app-node-1
- name: 'add_rule: conditional format'
  type: call
  app: '{{ctx}}'
  method: add_rule
  args:
    rule:
      sheet_id: '{{sheet}}'
      top_row_id: '0'
      left_col_id: '0'
      bottom_row_id: '1'
      right_col_id: '0'
      kind: format
      condition: gt
      args:
      - '1000'
      style:
        color: '#b91c1c'
      strict: false
      recipients: []
  account: app-node-1
  outputs:
    rule: result
- name: update_rule
  type: call
  app: '{{ctx}}'
  method: update_rule
  args:
    id: '{{rule}}'
    rule:
      sheet_id: '{{sheet}}'
      top_row_id: '0'
      left_col_id: '0'
      bottom_row_id: '1'
      right_col_id: '0'
      kind: format
      condition: gt
      args:
      - '2000'
      style:
        color: '#b91c1c'
      strict: false
      recipients: []
  account: app-node-1
- name: add_chart
  type: call
  app: '{{ctx}}'
  method: add_chart
  args:
    chart:
      sheet_id: '{{sheet}}'
      top_row_id: '0'
      left_col_id: '0'
      bottom_row_id: '1'
      right_col_id: '0'
      kind: bar
      title: Income
  account: app-node-1
  outputs:
    chart: result
- name: update_chart
  type: call
  app: '{{ctx}}'
  method: update_chart
  args:
    id: '{{chart}}'
    chart:
      sheet_id: '{{sheet}}'
      top_row_id: '0'
      left_col_id: '0'
      bottom_row_id: '1'
      right_col_id: '0'
      kind: line
      title: Income by quarter
  account: app-node-1
- name: set_frozen
  type: call
  app: '{{ctx}}'
  method: set_frozen
  args:
    sheet_id: '{{sheet}}'
    rows: 1
    cols: 1
  account: app-node-1
- name: set_sizes
  type: call
  app: '{{ctx}}'
  method: set_sizes
  args:
    sheet_id: '{{sheet}}'
    sizes:
    - axis: col
      id: '0'
      size: 160
    - axis: row
      id: '0'
      size: 40
  account: app-node-1
- name: add_attachment
  type: call
  app: '{{ctx}}'
  method: add_attachment
  args:
    sheet_id: '{{sheet}}'
    row_id: '0'
    col_id: '0'
    blob_id: abc123
    name: receipt.pdf
    size: 2048
    mime: application/pdf
  account: app-node-1
  outputs:
    attachment: result
- name: get_styles on node 2
  type: call
  app: '{{ctx}}'
  method: get_styles
  args: {}
  account: app-node-2
  outputs:
    styles: result
- type: assert
  name: node 2 has the bold fill
  statements:
  - contains({{styles}}, '#fde68a')
- name: get_rules on node 2
  type: call
  app: '{{ctx}}'
  method: get_rules
  args: {}
  account: app-node-2
  outputs:
    rule_0: result.0
- type: json_assert
  name: node 2 has the updated rule
  statements:
  - 'json_subset({{rule_0}}, {"id": "{{rule}}", "rule": {"kind": "format", "condition": "gt", "args":
    ["2000"], "style": {"color": "#b91c1c"}}})'
- name: get_charts on node 2
  type: call
  app: '{{ctx}}'
  method: get_charts
  args: {}
  account: app-node-2
  outputs:
    chart_0: result.0
- type: json_assert
  name: node 2 has the updated chart
  statements:
  - 'json_subset({{chart_0}}, {"id": "{{chart}}", "chart": {"kind": "line", "title": "Income by quarter"}})'
- name: get_sheet_views on node 2
  type: call
  app: '{{ctx}}'
  method: get_sheet_views
  args: {}
  account: app-node-2
  outputs:
    view: result.0
- type: json_assert
  name: node 2 has the frozen panes
  statements:
  - 'json_subset({{view}}, {"sheet_id": "{{sheet}}", "frozen_rows": 1, "frozen_cols": 1})'
- type: assert
  name: node 2 has both sizes
  statements:
  - contains({{view}}, '160')
  - contains({{view}}, '40')
- name: get_attachments on node 2
  type: call
  app: '{{ctx}}'
  method: get_attachments
  args: {}
  account: app-node-2
  outputs:
    attachment_0: result.0
- type: json_assert
  name: node 2 has the attachment
  statements:
  - 'json_subset({{attachment_0}}, {"name": "receipt.pdf", "blob_id": "abc123", "size": 2048})'
- name: remove_rule
  type: call
  app: '{{ctx}}'
  method: remove_rule
  args:
    id: '{{rule}}'
  account: app-node-1
- name: remove_chart
  type: call
  app: '{{ctx}}'
  method: remove_chart
  args:
    id: '{{chart}}'
  account: app-node-1
- name: remove_attachment
  type: call
  app: '{{ctx}}'
  method: remove_attachment
  args:
    id: '{{attachment}}'
  account: app-node-1
- name: get_rules after remove
  type: call
  app: '{{ctx}}'
  method: get_rules
  args: {}
  account: app-node-1
  outputs:
    rules_after: result
- type: json_assert
  name: no rules left
  statements:
  - json_equal({{rules_after}}, [])
- name: get_charts after remove
  type: call
  app: '{{ctx}}'
  method: get_charts
  args: {}
  account: app-node-1
  outputs:
    charts_after: result
- type: json_assert
  name: no charts left
  statements:
  - json_equal({{charts_after}}, [])
- name: get_attachments after remove
  type: call
  app: '{{ctx}}'
  method: get_attachments
  args: {}
  account: app-node-1
  outputs:
    att_after: result
- type: json_assert
  name: no attachments left
  statements:
  - json_equal({{att_after}}, [])
- name: create_private_sheet
  type: call
  app: '{{ctx}}'
  method: create_private_sheet
  args:
    name: What-if
  account: app-node-1
  outputs:
    private: result
- name: apply_private_cell_ops
  type: call
  app: '{{ctx}}'
  method: apply_private_cell_ops
  args:
    sheet_id: '{{private}}'
    ops:
    - name: Set
      payload:
        row_id: '0'
        col_id: '0'
        raw_value: secret
  account: app-node-1
- name: rename_private_sheet
  type: call
  app: '{{ctx}}'
  method: rename_private_sheet
  args:
    sheet_id: '{{private}}'
    name: What-if 2
  account: app-node-1
- name: get_private_sheets on node 1
  type: call
  app: '{{ctx}}'
  method: get_private_sheets
  args: {}
  account: app-node-1
  outputs:
    private_1: result.0
- type: json_assert
  name: node 1 has it, renamed
  statements:
  - 'json_subset({{private_1}}, {"id": "{{private}}", "name": "What-if 2"})'
- name: get_private_cells on node 1
  type: call
  app: '{{ctx}}'
  method: get_private_cells
  args: {}
  account: app-node-1
  outputs:
    pcells_1: result.0
- type: json_assert
  name: node 1 has its cell
  statements:
  - 'json_subset({{pcells_1}}, {"sheet_id": "{{private}}", "raw_value": "secret"})'
- name: get_private_sheets on node 2
  type: call
  app: '{{ctx}}'
  method: get_private_sheets
  args: {}
  account: app-node-2
  outputs:
    private_2: result
- type: json_assert
  name: node 2 has no private sheets
  statements:
  - json_equal({{private_2}}, [])
- name: get_private_cells on node 2
  type: call
  app: '{{ctx}}'
  method: get_private_cells
  args: {}
  account: app-node-2
  outputs:
    pcells_2: result
- type: json_assert
  name: node 2 has no private cells
  statements:
  - json_equal({{pcells_2}}, [])
- name: export_all on node 2
  type: call
  app: '{{ctx}}'
  method: export_all
  args: {}
  account: app-node-2
  outputs:
    export_2: result
- type: assert
  name: the export has no private sheet
  statements:
  - not_contains({{export_2}}, 'What-if')
- name: delete_private_sheet
  type: call
  app: '{{ctx}}'
  method: delete_private_sheet
  args:
    sheet_id: '{{private}}'
  account: app-node-1
- name: 'set_role: Bob becomes a viewer'
  type: call
  app: '{{ctx}}'
  method: set_role
  args:
    member_id: '{{bob}}'
    role: viewer
  account: app-node-1
- name: a viewer's write is refused
  type: call
  app: '{{ctx}}'
  method: set_cell
  args:
    sheet_id: '{{sheet}}'
    row_id: '5'
    col_id: '0'
    raw_value: nope
  account: app-node-2
  expected_failure: true
- name: 'set_role: Bob is an editor again'
  type: call
  app: '{{ctx}}'
  method: set_role
  args:
    member_id: '{{bob}}'
    role: editor
  account: app-node-1
- name: an editor cannot change roles (owners only)
  type: call
  app: '{{ctx}}'
  method: set_role
  args:
    member_id: '{{ada}}'
    role: viewer
  account: app-node-2
  expected_failure: true
- name: protect_range A1:A2, Ada only
  type: call
  app: '{{ctx}}'
  method: protect_range
  args:
    sheet_id: '{{sheet}}'
    top_row_id: '0'
    left_col_id: '0'
    bottom_row_id: '1'
    right_col_id: '0'
    description: Totals
    editors: []
  account: app-node-1
  outputs:
    protection: result
- name: update_protection
  type: call
  app: '{{ctx}}'
  method: update_protection
  args:
    id: '{{protection}}'
    description: Totals (locked)
    editors: []
  account: app-node-1
- name: get_protections on node 2
  type: call
  app: '{{ctx}}'
  method: get_protections
  args: {}
  account: app-node-2
  outputs:
    protection_0: result.0
- type: json_assert
  name: node 2 has the protection
  statements:
  - 'json_subset({{protection_0}}, {"id": "{{protection}}", "description": "Totals (locked)"})'
- name: Bob's write inside the range is refused
  type: call
  app: '{{ctx}}'
  method: set_cell
  args:
    sheet_id: '{{sheet}}'
    row_id: '0'
    col_id: '0'
    raw_value: '0'
  account: app-node-2
  expected_failure: true
- name: Bob's write outside it lands
  type: call
  app: '{{ctx}}'
  method: set_cell
  args:
    sheet_id: '{{sheet}}'
    row_id: '5'
    col_id: '0'
    raw_value: '42'
  account: app-node-2
- name: an editor cannot remove a protection (owners only)
  type: call
  app: '{{ctx}}'
  method: remove_protection
  args:
    id: '{{protection}}'
  account: app-node-2
  expected_failure: true
- name: remove_protection
  type: call
  app: '{{ctx}}'
  method: remove_protection
  args:
    id: '{{protection}}'
  account: app-node-1
- name: get_cells on node 1
  type: call
  app: '{{ctx}}'
  method: get_cells
  args:
    sheet_id: '{{sheet}}'
  account: app-node-1
  outputs:
    final_a1: result.0
    final_a6: result.3
- type: json_assert
  name: the protected cell kept its value
  statements:
  - 'json_subset({{final_a1}}, {"row_id": "0", "col_id": "0", "raw_value": "1500"})'
- type: json_assert
  name: Bob's edit outside the range reached node 1
  statements:
  - 'json_subset({{final_a6}}, {"row_id": "5", "col_id": "0", "raw_value": "42", "last_editor": "{{bob}}"})'
- name: get_activity on node 2
  type: call
  app: '{{ctx}}'
  method: get_activity
  args:
    since: 0
    limit: 200
  account: app-node-2
  outputs:
    activity: result
- type: assert
  name: both members' edits are in the log
  statements:
  - contains({{activity}}, '{{ada}}')
  - contains({{activity}}, '{{bob}}')
- name: export_all on node 1
  type: call
  app: '{{ctx}}'
  method: export_all
  args: {}
  account: app-node-1
  outputs:
    export: result
- type: assert
  name: the export carries the sheet
  statements:
  - contains({{export}}, 'Income')
- name: delete_sheet
  type: call
  app: '{{ctx}}'
  method: delete_sheet
  args:
    sheet_id: '{{sheet}}'
  account: app-node-1
- name: list_sheets on node 2
  type: call
  app: '{{ctx}}'
  method: list_sheets
  args: {}
  account: app-node-2
  outputs:
    sheets_final: result
- type: assert
  name: the sheet is gone on node 2
  statements:
  - not_contains({{sheets_final}}, 'Income')
