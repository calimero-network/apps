# Ported from links.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
name: mero-sheets linked workbooks
description: A range pushed between two workbooks over xcall, kept up to date, then unlinked.
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3440
accounts:
- link-node-1
steps:
- name: Install mero-sheets bundle
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_sheets.wasm'
  outputs:
    app_id: hash
  account: link-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create namespace
  type: create_org
  org_name: Create namespace
  outputs:
    namespace_id: orgId
  account: link-node-1
- name: Create the source workbook
  type: deploy
  account: link-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_sheets.wasm'
  app_name: spreadsheet
  org: '{{namespace_id}}'
  outputs:
    src: appId
- name: Create the target workbook
  type: deploy
  account: link-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_sheets.wasm'
  app_name: spreadsheet
  org: '{{namespace_id}}'
  outputs:
    dst: appId
- name: init_project on the source
  type: call
  app: '{{src}}'
  method: init_project
  args:
    name: FX desk
  account: link-node-1
- name: join the source
  type: call
  app: '{{src}}'
  method: join
  args:
    nickname: Ada
  account: link-node-1
- name: init_project on the target
  type: call
  app: '{{dst}}'
  method: init_project
  args:
    name: Budget
  account: link-node-1
- name: join the target
  type: call
  app: '{{dst}}'
  method: join
  args:
    nickname: Ada
  account: link-node-1
- name: create the source sheet
  type: call
  app: '{{src}}'
  method: create_sheet
  args:
    name: Rates
  account: link-node-1
  outputs:
    rates: result
- name: 'A1: a rate'
  type: call
  app: '{{src}}'
  method: set_cell
  args:
    sheet_id: '{{rates}}'
    row_id: '0'
    col_id: '0'
    raw_value: '1.08'
  account: link-node-1
- name: 'B1: a formula on it'
  type: call
  app: '{{src}}'
  method: set_cell
  args:
    sheet_id: '{{rates}}'
    row_id: '0'
    col_id: '1'
    raw_value: =A1*100
  account: link-node-1
- name: a workbook cannot link to itself
  type: call
  app: '{{src}}'
  method: publish_range
  args:
    sheet_id: '{{rates}}'
    top_row_id: '0'
    left_col_id: '0'
    bottom_row_id: '0'
    right_col_id: '1'
    target_context: '{{src}}'
    name: Rates
  account: link-node-1
  expected_failure: true
- name: publish_range
  type: call
  app: '{{src}}'
  method: publish_range
  args:
    sheet_id: '{{rates}}'
    top_row_id: '0'
    left_col_id: '0'
    bottom_row_id: '0'
    right_col_id: '1'
    target_context: '{{dst}}'
    name: Rates
  account: link-node-1
  outputs:
    publication: result
- type: wait
  seconds: 1.0
- name: get_publications on the source
  type: call
  app: '{{src}}'
  method: get_publications
  args: {}
  account: link-node-1
  outputs:
    pub_0: result.0
- type: json_assert
  name: the source records the link
  statements:
  - 'json_subset({{pub_0}}, {"id": "{{publication}}", "target_context": "{{dst}}", "name": "Rates"})'
- name: get_links on the target
  type: call
  app: '{{dst}}'
  method: get_links
  args: {}
  account: link-node-1
  outputs:
    link_0: result.0
    link_id: result.0.id
- type: json_assert
  name: the target received the range, computed
  statements:
  - 'json_subset({{link_0}}, {"name": "Rates", "source_name": "FX desk", "rows": 1, "cols": 2})'
- name: the linked sheet is listed on the target
  type: call
  app: '{{dst}}'
  method: list_sheets
  args: {}
  account: link-node-1
  outputs:
    dst_sheets: result
- type: assert
  name: the target lists the linked sheet
  statements:
  - contains({{dst_sheets}}, '{{link_id}}')
  - contains({{dst_sheets}}, 'FX desk')
- name: the target's formulas can read it
  type: call
  app: '{{dst}}'
  method: create_sheet
  args:
    name: Plan
  account: link-node-1
  outputs:
    plan: result
- name: a formula over the linked sheet
  type: call
  app: '{{dst}}'
  method: set_cell
  args:
    sheet_id: '{{plan}}'
    row_id: '0'
    col_id: '0'
    raw_value: =[{{link_id}}]!B1+1
  account: link-node-1
- name: get_cells on the plan
  type: call
  app: '{{dst}}'
  method: get_cells
  args:
    sheet_id: '{{plan}}'
  account: link-node-1
  outputs:
    plan_a1: result.0
- type: json_assert
  name: the formula computes from the pushed value
  statements:
  - 'json_subset({{plan_a1}}, {"computed_value": "109"})'
- name: change the rate
  type: call
  app: '{{src}}'
  method: set_cell
  args:
    sheet_id: '{{rates}}'
    row_id: '0'
    col_id: '0'
    raw_value: '1.1'
  account: link-node-1
- type: wait
  seconds: 1.0
- name: get_cells on the plan after the change
  type: call
  app: '{{dst}}'
  method: get_cells
  args:
    sheet_id: '{{plan}}'
  account: link-node-1
  outputs:
    plan_a1_after: result.0
- type: json_assert
  name: the target recomputed from the new value
  statements:
  - 'json_subset({{plan_a1_after}}, {"computed_value": "111"})'
- name: push_publication on demand
  type: call
  app: '{{src}}'
  method: push_publication
  args:
    id: '{{publication}}'
  account: link-node-1
- name: a direct receive_link is refused
  type: call
  app: '{{dst}}'
  method: receive_link
  args:
    from_context: '{{src}}'
    publication_id: '{{publication}}'
    name: Rates
    source_name: FX desk
    rows: 1
    cols: 1
    values:
    - forged
  account: link-node-1
  expected_failure: true
- name: a direct drop_link is refused
  type: call
  app: '{{dst}}'
  method: drop_link
  args:
    from_context: '{{src}}'
    publication_id: '{{publication}}'
  account: link-node-1
  expected_failure: true
- name: get_links after the forged calls
  type: call
  app: '{{dst}}'
  method: get_links
  args: {}
  account: link-node-1
  outputs:
    link_after_forge: result.0
- type: json_assert
  name: the link is untouched
  statements:
  - 'json_subset({{link_after_forge}}, {"id": "{{link_id}}", "cols": 2})'
- name: unlink on the target
  type: call
  app: '{{dst}}'
  method: unlink
  args:
    id: '{{link_id}}'
  account: link-node-1
- name: get_links after unlink
  type: call
  app: '{{dst}}'
  method: get_links
  args: {}
  account: link-node-1
  outputs:
    links_after: result
- type: json_assert
  name: the target has no links
  statements:
  - json_equal({{links_after}}, [])
- name: a later push is ignored by the target
  type: call
  app: '{{src}}'
  method: push_publication
  args:
    id: '{{publication}}'
  account: link-node-1
- type: wait
  seconds: 1.0
- name: get_links after the ignored push
  type: call
  app: '{{dst}}'
  method: get_links
  args: {}
  account: link-node-1
  outputs:
    links_still: result
- type: json_assert
  name: the unlinked sheet stays gone
  statements:
  - json_equal({{links_still}}, [])
- name: unpublish on the source
  type: call
  app: '{{src}}'
  method: unpublish
  args:
    id: '{{publication}}'
  account: link-node-1
- name: get_publications after unpublish
  type: call
  app: '{{src}}'
  method: get_publications
  args: {}
  account: link-node-1
  outputs:
    pubs_after: result
- type: json_assert
  name: the source has no publications
  statements:
  - json_equal({{pubs_after}}, [])
