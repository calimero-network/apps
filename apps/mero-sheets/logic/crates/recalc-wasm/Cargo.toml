[package]
name    = "recalc-wasm"
version = "0.1.0"
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# NOT a calimero service — a wasm-bindgen module built by `wasm-pack --target web`
# into app/src/engine/recalc/, so the BROWSER can evaluate formulas with the same
# engine the contract uses. It is a workspace member only so `cargo clippy
# --workspace` and `cargo test --workspace` cover it; `cargo mero build` never
# touches it (it is absent from the services list).
[dependencies]
mero-sheets-recalc = { path = "../recalc" }
wasm-bindgen      = "0.2"
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0.113"
