[package]
name    = "recalc-wasm"
version     = "0.1.0"
edition     = "2021"
authors     = ["Calimero Limited <info@calimero.network>"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/calimero-network/apps"
publish     = false

[lib]
crate-type = ["cdylib", "rlib"]

# NOT part of the component — a wasm-bindgen module built by `wasm-pack --target web`
# into app/src/engine/recalc/, so the BROWSER can evaluate formulas with the same
# engine the contract uses. A member of the contract's own workspace
# (../../Cargo.toml) but not a default member: `cargo test` and the component
# build never compile it; `cargo clippy -p recalc-wasm` and
# `../build-recalc-wasm.sh` do.
[dependencies]
mero-sheets-recalc = { path = "../recalc" }
wasm-bindgen      = "0.2"
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0.113"
