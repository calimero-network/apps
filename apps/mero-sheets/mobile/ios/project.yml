# XcodeGen spec for the native iOS Mero Sheets.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroSheets.xcodeproj (not committed)
#   open MeroSheets.xcodeproj
#
# The non-UI layer (generated contract client, models) is the local SwiftPM
# package in Core/, tested with `swift test` on macOS. The swift-sdk is pinned
# by revision to the head of its Calimero 1.0 port (swift-sdk#85, branch
# feat/calimero-1.0), moving to the merge commit once that lands; keep both
# pins (here and Core/Package.swift) equal.
name: MeroSheets

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 6c5f1167d1e586f556f59c326de5f51d034e80dd
  SheetsCore:
    path: Core

targets:
  MeroSheets:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Sheets
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          # The node's consent page returns here (`mero-sheets://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.sheets.consent
            CFBundleURLSchemes: [mero-sheets]
          # Invitation deep links: `calimero://com.calimero.mero-sheets/join?invitation=…`.
          - CFBundleURLName: network.calimero.sheets.invite
            CFBundleURLSchemes: [calimero]
        # Which cluster sign-in uses (Calimero 1.0). MeroNodeURL: a node of your
        # Calimero Cloud cluster (from the cloud.calimero.network console); empty =
        # the sign-in screen asks. MeroDevNodeURL: what the "Development node"
        # field starts with (`merod local`, mock attestation allowed). See README.
        SheetsCallbackScheme: mero-sheets
        SheetsCallbackHost: ""
        SheetsCallbackPath: /consent
        MeroNodeURL: ""
        MeroDevNodeURL: "http://localhost:2501"
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # http only to a node on the local network (localhost, *.local, an IP literal).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # A passkey on a real cluster belongs to its relying party (the node's --rp-id).
    # To sign in with the device's passkey there, add an entitlements file with
    # `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`. A
    # development node uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.sheets
        PRODUCT_NAME: MeroSheets
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: SheetsCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

schemes:
  MeroSheets:
    build:
      targets:
        MeroSheets: all
