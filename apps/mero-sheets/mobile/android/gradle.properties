org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Which Calimero 1.0 cluster sign-in uses. meroNodeUrl: your Calimero Cloud cluster, by name
# (`eu-shared-1`) or a node URL from the cloud.calimero.network console; empty = the sign-in
# screen asks. meroDevNodeUrl: what the "Development node" field starts with (`merod local`).
# Override per build: ./gradlew assembleDebug -PmeroNodeUrl=eu-shared-1
meroNodeUrl=
meroDevNodeUrl=http://10.0.2.2:2501
# Where the node's consent page sends the person back after an approval. Its scheme and host are
# also the manifest's intent filter.
meroConsentCallback=mero-sheets://consent
