# XcodeGen spec — regenerate MeroTag.xcodeproj with: `xcodegen generate`
# (from this directory) or `make app-gen` from apps/mero-tag.
#
# Everything that is not a view or a location service (the generated contract
# client, the models, the space service and the tracker store) is the local
# Swift package in TagCore/, tested with `swift test --package-path TagCore` on
# macOS (no simulator).
name: MeroTag
options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # The official Calimero Swift SDK (MeroKit + MeroKitUI), shipped from core
  # and versioned with it: `CalimeroClient` over the sealed channel
  # (attestation, passkeys, app calls/views/events, orgs, consent) and
  # `MeroClient` for sign-in state. Pinned to the core release the contract
  # is built against (logic/Cargo.toml), never a branch.
  core:
    url: https://github.com/calimero-network/core
    exactVersion: 1.0.0-rc.38
  # Mero Tag's non-UI layer: the generated contract client, the models, the
  # space service and the tracker store, tested with `swift test` on macOS.
  # Keep its core pin equal to the one above.
  TagCore:
    path: TagCore

targets:
  MeroTag:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    # Calimero Cloud sign-in runs on Mero Tag's served page in the system
    # sign-in sheet, which returns to `mero-tag://signed-in`: no associated
    # domains. A development cluster uses a software passkey.
    entitlements:
      path: MeroTag.entitlements
    # DEVELOPMENT_TEAM (for device builds) comes from Config/Signing.xcconfig:
    # empty by default, so simulator builds need none.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mero Tag
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "Mero Tag shares your live location with people you authorize."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Mero Tag keeps sharing your location in the background so your group always sees where you are."
        # `merod local` development clusters are plain http on the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Mero Tag connects to a development Calimero cluster on your network."
        UIBackgroundModes:
          - location
          - fetch
        CFBundleURLTypes:
          # Invite deep links: merotag://join?invitation=…
          - CFBundleURLName: network.calimero.merotag.join
            CFBundleURLSchemes:
              - merotag
          # Mero Tag's served page returns here: the session after sign-in
          # (`mero-tag://signed-in#…`), a passkey approval
          # (`mero-tag://approved#…`) and the node's consent page decision
          # (`mero-tag://consent?request_id=…`). The sign-in sheet intercepts
          # it itself; registering it also lets `onOpenURL` see a return that
          # arrives outside the sheet.
          - CFBundleURLName: network.calimero.merotag.callback
            CFBundleURLSchemes:
              - mero-tag
        # A Calimero Cloud cluster to sign in on. Empty: Mero Tag's primary
        # cluster.
        MeroTagCluster: ""
        # The Mero Tag release new spaces run. Empty: the latest.
        MeroTagPackageVersion: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.merotag
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5"
    dependencies:
      - package: TagCore
        product: TagCore
      - package: core
        product: MeroKit
      - package: core
        product: MeroKitUI

  MeroTagTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MeroTag
      - package: TagCore
        product: TagCore
      - package: TagCore
        product: TagCoreTestSupport
      - package: core
        product: MeroKit
      - package: core
        product: MeroKitUI

  MeroTagUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        optional: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MeroTag

schemes:
  MeroTag:
    build:
      targets:
        MeroTag: all
    run:
      config: Debug
    test:
      targets:
        - MeroTagTests
        - MeroTagUITests
