[package]
name = "meropixart"
description = "MeroPixArt — collaborative p2p image editor on Calimero"
# NOT the release version. cargo requires a version field, but
# .github/workflows/deploy-bundle.yml ignores it: the registry owns the number —
# the check job takes the highest published appVersion and increments the patch
# (0.0.1 when nothing is published yet). Bumping this changes nothing about what
# gets released, so do not read a shipped version out of the tree; read it from
# the registry or the workflow's run summary.
version = "0.0.2"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Read by `cargo mero bundle` (core #3374): every field the node and the registry
# render now has a producer here, so nothing hand-writes a manifest.json — which
# is how the old build-bundle.sh shipped `"hash": null` and no ABI at all.
# `appVersion` is deliberately absent: the deploy workflow resolves it from the
# registry.
[package.metadata.calimero]
package = "com.calimero.meropixart"
name = "MeroPixArt"
description = "Collaborative p2p image editor on the Calimero network. Photoshop-style layers, masks, and adjustments — your pixels on your nodes."
author = "Calimero"
# The desktop resolves a deep link (calimero://<slug>/… and
# https://links.calimero.network/<slug>/…) by Application.package, so the slug
# IS the package id.
slug = "com.calimero.meropixart"
# Embedded into the manifest as a data: URI, which is what gives the app a real
# icon in the registry and — via tauri-app's `ensure_app_launcher_icon` — in the
# macOS Dock. The bundled icon is preferred over fetching the frontend's PWA
# manifest because it is deterministic and works offline. Regenerate with
# `node app/scripts/gen-icons.mjs`.
icon = "../app/public/icon-512.png"
tags = ["image-editing", "collaboration", "layers"]
github = "https://github.com/calimero-network/mero-pixart"
# The release this contract is BUILT for, not a floor inherited from an older
# template. An rc.23 build imports host functions (e.g. storage_index_meta_clear)
# that earlier merod has no implementation for: claiming 0.1.0 lets such a node
# install the bundle happily and then fail at context creation with "unknown
# import". Keep this equal to the calimero-sdk tag above.
min-runtime-version = "0.11.0-rc.24"
frontend = "https://mero-pixart.vercel.app/"

[dependencies]
borsh = "0.10.3"
borsh-derive = "0.10.3"
# Pin a real release tag, never `branch = "master"`: master rides unreleased
# protocol work against nodes that run the release. All SDK crates must share the
# exact same tag (the workspace version at a tag is 0.0.0, so a version
# requirement cannot match).
calimero-sdk = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.24" }
calimero-storage = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.24" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.24" }
thiserror = "1.0.56"
serde_json = "1.0.113"

[dev-dependencies]
# Enables register_crdt_merge + the native mock host so TestHost can drive
# CRDT state (incl. the permissioned components) under `cargo test`.
calimero-storage = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.24", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
