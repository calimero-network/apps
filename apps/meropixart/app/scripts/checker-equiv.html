<!doctype html>
<!--
  Proves the pattern-based transparency checkerboard draws the SAME pixels as the
  square-by-square loop it replaces. Read by e2e/checker.spec.ts.

  The loop was ~40,000 fillRect calls per frame on a 1400x1800 document, run on
  every pan and zoom; the pattern is one fill. That is only worth doing if the
  output is identical, so this compares them byte for byte at several square
  sizes and zoom levels.
-->
<html>
  <head><meta charset="utf-8" /><title>checkerboard equivalence</title></head>
  <body>
    <script type="module">
      import { createCanvas, ctx2d } from "/src/utils/raster.ts";

      const DARK = "#15191f";
      const LIGHT = "#1d232b";

      /** The original implementation, kept here as the reference. */
      function loopChecker(ctx, w, h, size) {
        const s = Math.max(2, size);
        ctx.save();
        ctx.fillStyle = DARK;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = LIGHT;
        for (let y = 0; y < h; y += s) {
          for (let x = 0; x < w; x += s) {
            if (((Math.floor(x / s)) + (Math.floor(y / s))) % 2 === 0) ctx.fillRect(x, y, s, s);
          }
        }
        ctx.restore();
      }

      const tiles = new Map();
      function checkerTile(s) {
        let tile = tiles.get(s);
        if (!tile) {
          tile = createCanvas(s * 2, s * 2);
          const tctx = ctx2d(tile);
          tctx.fillStyle = DARK;
          tctx.fillRect(0, 0, s * 2, s * 2);
          tctx.fillStyle = LIGHT;
          tctx.fillRect(0, 0, s, s);
          tctx.fillRect(s, s, s, s);
          tiles.set(s, tile);
        }
        return tile;
      }

      /** The replacement, copied from CanvasStage. */
      function patternChecker(ctx, w, h, size) {
        const s = Math.max(2, Math.round(size));
        const pattern = ctx.createPattern(checkerTile(s), "repeat");
        ctx.save();
        const smoothing = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = pattern ?? DARK;
        ctx.fillRect(0, 0, w, h);
        ctx.imageSmoothingEnabled = smoothing;
        ctx.restore();
      }

      function render(fn, w, h, size, zoom, pan) {
        // Same setup CanvasStage.draw() uses: pan, then zoom, then the fill in
        // document space.
        const c = createCanvas(600, 400);
        const ctx = ctx2d(c);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, 600, 400);
        ctx.save();
        ctx.translate(pan, pan);
        ctx.scale(zoom, zoom);
        ctx.imageSmoothingEnabled = zoom < 3;
        fn(ctx, w, h, size);
        ctx.restore();
        return ctx.getImageData(0, 0, 600, 400).data;
      }

      const cases = [];
      for (const size of [2, 8, 16]) {
        for (const zoom of [0.5, 1, 2, 4]) {
          for (const pan of [0, 13]) {
            const a = render(loopChecker, 1400, 1800, size, zoom, pan);
            const b = render(patternChecker, 1400, 1800, size, zoom, pan);
            let diff = 0;
            for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) diff++;
            cases.push({ size, zoom, pan, diffBytes: diff, totalBytes: a.length });
          }
        }
      }

      window.__CHECKER__ = cases;
      window.__CHECKER_READY__ = true;
      document.body.textContent = JSON.stringify(cases, null, 1);
    </script>
  </body>
</html>
