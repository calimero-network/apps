org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The Calimero Cloud cluster the sign-in screen prefills: a cluster name or a node URL. Empty: the
# screen asks. Override per build: ./gradlew assembleDebug -PmeroCluster=eu-shared-1
meroCluster=
# The development node (`merod local`) the sign-in screen prefills; 10.0.2.2 is the host from the emulator.
meroDevNodeUrl=http://10.0.2.2:2501
# Where the node's consent page sends the person back. Its scheme and host are also the manifest's
# intent filter.
meroConsentCallback=mero-chess://consent
