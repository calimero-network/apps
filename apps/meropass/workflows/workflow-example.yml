auth_image: ghcr.io/calimero-network/mero-auth:edge
auth_service: true
description: End-to-end test workflow for MeroPass password manager. Tests all CRUD
  operations, search/filter functionality, cross-node replication, multi-user collaboration,
  and audit logging across a 2-node network.
force_pull_image: false
name: MeroPass E2E Test Workflow
nodes:
  chain_id: testnet-1
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: calimero-node
steps:
- name: Install Application on Node 1
  type: install_application
  node: calimero-node-1
  path: ./logic/res/meropass.wasm
  dev: true
  outputs:
    app_id: applicationId
- name: Create Context on Node 1
  type: create_context
  node: calimero-node-1
  application_id: '{{app_id}}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Create Identity on Node 2
  type: create_identity
  node: calimero-node-2
  outputs:
    public_key: publicKey
- name: Invite Identity
  type: invite_identity
  node: calimero-node-1
  context_id: '{{context_id}}'
  granter_id: '{{member_public_key}}'
  grantee_id: '{{public_key}}'
  capability: member
  outputs:
    invitation: invitation
- name: Join Context from Node 2
  type: join_context
  node: calimero-node-2
  context_id: '{{context_id}}'
  invitee_id: '{{public_key}}'
  invitation: '{{invitation}}'
- name: Test - Add Secret on Node 1
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: add_secret
  args:
    name: "Production Database Password"
    secret_type: "login"
    data: '{"username":"admin","password":"super_secret_123","url":"https://db.example.com"}'
    tags: ["production", "database"]
  executor_public_key: '{{member_public_key}}'
  outputs:
    secret_id_1: result.output
- name: Test - Add Second Secret on Node 1
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: add_secret
  args:
    name: "GitHub SSH Key"
    secret_type: "ssh_key"
    data: '{"private_key":"-----BEGIN OPENSSH PRIVATE KEY-----\nfake_key_data\n-----END OPENSSH PRIVATE KEY-----","public_key":"ssh-ed25519 AAAA... user@host"}'
    tags: ["development", "github"]
  executor_public_key: '{{member_public_key}}'
  outputs:
    secret_id_2: result.output
- name: Test - List All Secrets on Node 1
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: list_secrets
  args: {}
  executor_public_key: '{{member_public_key}}'
  outputs:
    secrets_list: result
- name: Test - Get Specific Secret on Node 1
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: get_secret
  args:
    secret_id: '{{secret_id_1}}'
  executor_public_key: '{{member_public_key}}'
  substitute:
    - secret_id_1
  outputs:
    retrieved_secret: result
- name: Test - Search Secrets on Node 1
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: search_secrets
  args:
    query: "database"
  executor_public_key: '{{member_public_key}}'
  outputs:
    search_results: result
- name: Test - Get Secrets by Tag on Node 1
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: get_secrets_by_tag
  args:
    tag: "production"
  executor_public_key: '{{member_public_key}}'
  outputs:
    tag_results: result
- name: Test - Update Secret on Node 1
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: update_secret
  args:
    secret_id: '{{secret_id_1}}'
    name: "Production Database Password (Updated)"
    data: '{"username":"admin","password":"new_password_456","url":"https://db.example.com"}'
    tags: ["production", "database", "updated"]
  executor_public_key: '{{member_public_key}}'
  substitute:
    - secret_id_1
- name: Test - Verify Update on Node 1
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: get_secret
  args:
    secret_id: '{{secret_id_1}}'
  executor_public_key: '{{member_public_key}}'
  substitute:
    - secret_id_1
  outputs:
    updated_secret: result
- name: Test - Node 2 Can See Secrets
  type: call
  node: calimero-node-2
  context_id: '{{context_id}}'
  method: list_secrets
  args: {}
  executor_public_key: '{{public_key}}'
  outputs:
    node2_secrets: result
- name: Test - Node 2 Can Read Specific Secret
  type: call
  node: calimero-node-2
  context_id: '{{context_id}}'
  method: get_secret
  args:
    secret_id: '{{secret_id_1}}'
  executor_public_key: '{{public_key}}'
  substitute:
    - secret_id_1
  outputs:
    node2_secret: result
- name: Test - Node 2 Can Add Secret
  type: call
  node: calimero-node-2
  context_id: '{{context_id}}'
  method: add_secret
  args:
    name: "AWS Access Key"
    secret_type: "login"
    data: '{"access_key_id":"AKIAIOSFODNN7EXAMPLE","secret_access_key":"wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"}'
    tags: ["aws", "production"]
  executor_public_key: '{{public_key}}'
  outputs:
    secret_id_3: result.output
- name: Test - Node 1 Can See Node 2's Secret
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: get_secret
  args:
    secret_id: '{{secret_id_3}}'
  executor_public_key: '{{member_public_key}}'
  substitute:
    - secret_id_3
  outputs:
    node1_sees_node2_secret: result
- name: Test - Get Audit Logs on Node 1
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: get_audit_logs
  args: {}
  executor_public_key: '{{member_public_key}}'
  outputs:
    audit_logs: result
- name: Test - Delete Secret on Node 1
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: delete_secret
  args:
    secret_id: '{{secret_id_2}}'
  executor_public_key: '{{member_public_key}}'
  substitute:
    - secret_id_2
- name: Test - Verify Deletion on Node 1
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: list_secrets
  args: {}
  executor_public_key: '{{member_public_key}}'
  outputs:
    final_secrets_list: result
- name: Test - Node 2 Confirms Deletion
  type: call
  node: calimero-node-2
  context_id: '{{context_id}}'
  method: list_secrets
  args: {}
  executor_public_key: '{{public_key}}'
  outputs:
    node2_final_secrets: result
- name: Test - Final Audit Logs Check
  type: call
  node: calimero-node-1
  context_id: '{{context_id}}'
  method: get_audit_logs
  args: {}
  executor_public_key: '{{member_public_key}}'
  outputs:
    final_audit_logs: result
stop_all_nodes: false
wait_timeout: 120
