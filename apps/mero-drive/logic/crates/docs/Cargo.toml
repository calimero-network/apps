[package]
name = "mero-drive-docs"
version.workspace = true
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Builds the v2 schema: state version 2 + #[app::migrate] carrying the v1
# state forward. Used to produce the migration-target bundle (9.4.0).
schema_v2 = []

[dependencies]
mero-drive-types = { workspace = true }
calimero-sdk = { workspace = true }
calimero-storage = { workspace = true }
calimero-storage-macros = { workspace = true }

[build-dependencies]
calimero-wasm-abi = { workspace = true }
serde_json = { workspace = true }
# cfg-filter the source before emitting the manifest (see build.rs).
syn = { version = "2", features = ["full"] }
quote = "1"

[dev-dependencies]
# The cross-replica convergence integration test (`tests/collab_convergence.rs`)
# drives the real two-replica `Root::sync` harness, which needs core's storage
# `testing` feature (exposes the native merge registry + `Root`/`env` test
# plumbing) and `serial_test` (the rekey/merge registries are process-global
# with no reset, so these tests must not run concurrently).
calimero-storage = { workspace = true, features = ["testing"] }
serial_test = "3.2"
