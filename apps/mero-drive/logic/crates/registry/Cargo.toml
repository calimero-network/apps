[package]
name    = "mero-drive-registry"
version = "10.1.3"
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# No [package.metadata.calimero]: this is the SECOND service of the mero-drive
# bundle, declared in ../../Cargo.toml's services list. check-app-metadata.sh only
# requires the table for a manifest at `apps/*/logic/Cargo.toml`.
[dependencies]
mero-drive-types        = { path = "../types" }
calimero-sdk            = { workspace = true }
calimero-storage        = { workspace = true }
calimero-storage-macros = { workspace = true }
# Every id this service stores is an ACCOUNT, hex-encoded — the same principal
# `listGroupMembers` rows are keyed by, so a row written from the client and a
# caller checked in the contract name the same person. It stored DEVICE keys
# until the roles pass; see `permissions::caller_account_hex`. core
# 0.11.0-rc.27 removed base58 (core#3691), so hex is the only encoding here.
hex                     = { workspace = true }
