name: Mero Drive E2E — authored comments migration (v1 → v2, two-node)
description: >
  Full-fleet proof that a real mero-drive app migration works through the
  shipped migration-UX surfaces. Two nodes (Alice + Bob):

    1. Alice installs v1 (bundle 9.3.0), creates a namespace + folder + docs
       context, seeds a doc and two authored comments.
    2. Bob joins the namespace + the docs context, syncs, sees Alice's data,
       and adds his own authored comment (so the fleet has comments owned by
       two distinct identities).
    3. Alice installs v2 (bundle 9.4.0, docs schema 2 + #[app::migrate]) and
       cascades the namespace v1 → v2 under lazy-on-access.
    4. Validate, on BOTH nodes, that everything OLD survived (all three
       comments + the doc, content intact) and everything NEW is present
       (the migrated top-level default_sort_order field), and that each
       owner's authored comments re-sign via migrate_my_entries:
         - Alice's count_my_pending: 2 → migrate → 0
         - Bob's   count_my_pending: 1 → migrate → 0

  The docs migrate carries the AuthoredMap byte-for-byte (owner stamps
  preserved per identity); the registry/namespace context no-ops the migrate
  (no such export). This is the SDK-level migration the mero-js/mero-react UX
  consumes, run across a real two-node fleet.

force_pull_image: true

nodes:
  count: 2
  # Stated, not inherited. core rc.26 made mDNS opt-in (core#3620): `merod init`
  # now writes `discovery.mdns = false`. merobox does not pass the flag, so peer
  # discovery changed at the image bump with nothing here changing.
  mdns: true
  image: ghcr.io/calimero-network/merod:0.11.0-rc.28
  prefix: calimero-node

steps:
  # =================================================================
  # Phase A: v1 install + Alice seeds data
  # =================================================================
  - name: Install v1 bundle on Node 1 (9.3.0)
    type: install_application
    node: calimero-node-1
    path: dist/com.calimero.mero-drive-docs-9.3.0.mpk
    dev: true
    outputs:
      app_v1: applicationId

  - name: Install v1 bundle on Node 2 (9.3.0)
    type: install_application
    node: calimero-node-2
    path: dist/com.calimero.mero-drive-docs-9.3.0.mpk
    dev: true

  - name: Alice creates namespace (anchors app_v1)
    type: create_namespace
    node: calimero-node-1
    application_id: '{{app_v1}}'
    outputs:
      namespace_id: namespaceId

  - name: Capture admin key
    type: get_namespace_identity
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      admin_key: publicKey

  - name: Alice creates the folder group
    type: create_group_in_namespace
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    group_name: notes
    outputs:
      notes_group: groupId

  - name: Alice creates the docs context (v1)
    type: create_context
    node: calimero-node-1
    application_id: '{{app_v1}}'
    group_id: '{{notes_group}}'
    service_name: docs
    outputs:
      docs_ctx: contextId
      alice_key: memberPublicKey

  - name: Alice seeds a document
    type: call
    node: calimero-node-1
    context_id: '{{docs_ctx}}'
    method: create_doc
    executor_public_key: '{{alice_key}}'
    args:
      title: spec
      content: hello

  - name: Alice adds comment 1
    type: call
    node: calimero-node-1
    context_id: '{{docs_ctx}}'
    method: add_comment
    executor_public_key: '{{alice_key}}'
    args:
      doc_id: doc-1
      body: alice first comment
    outputs:
      alice_cmt: result.output

  - name: Alice adds comment 2
    type: call
    node: calimero-node-1
    context_id: '{{docs_ctx}}'
    method: add_comment
    executor_public_key: '{{alice_key}}'
    args:
      doc_id: doc-1
      body: alice second comment

  # =================================================================
  # Phase B: Bob joins, syncs, and adds his own authored comment
  # =================================================================
  - name: Create namespace invitation for Bob
    type: create_namespace_invitation
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      ns_invite: invitation

  - name: Wait for namespace gossip
    type: wait
    seconds: 10

  - name: Bob joins the namespace
    type: join_namespace
    node: calimero-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{ns_invite}}'
    outputs:
      bob_identity: memberIdentity

  - name: Alice adds Bob to the folder group
    type: add_group_members
    node: calimero-node-1
    group_id: '{{notes_group}}'
    members:
      - identity: '{{bob_identity}}'
        role: Member

  - name: Wait for folder membership to propagate
    type: wait
    seconds: 10

  - name: Bob joins the docs context
    type: join_context
    node: calimero-node-2
    context_id: '{{docs_ctx}}'
    outputs:
      bob_key: memberPublicKey

  - name: Sync docs context across both nodes
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{docs_ctx}}'
    timeout: 30

  - name: Bob sees Alice's two comments (cross-node authored sync)
    type: call
    node: calimero-node-2
    context_id: '{{docs_ctx}}'
    method: comment_count
    executor_public_key: '{{bob_key}}'
    outputs:
      bob_sees_before: result

  - name: Assert Bob synced both of Alice's comments
    type: json_assert
    statements:
      - 'json_equal({{bob_sees_before}}, {"output": 2})'

  - name: Bob adds his own comment
    type: call
    node: calimero-node-2
    context_id: '{{docs_ctx}}'
    method: add_comment
    executor_public_key: '{{bob_key}}'
    args:
      doc_id: doc-1
      body: bob comment

  - name: Sync Bob's comment back to Alice
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{docs_ctx}}'
    timeout: 30

  - name: Alice sees all three comments before migration
    type: call
    node: calimero-node-1
    context_id: '{{docs_ctx}}'
    method: comment_count
    executor_public_key: '{{alice_key}}'
    outputs:
      count_before: result

  - name: Assert three comments exist fleet-wide before migration
    type: json_assert
    statements:
      - 'json_equal({{count_before}}, {"output": 3})'

  # =================================================================
  # Phase C: install v2 + cascade migration
  # =================================================================
  - name: Install v2 bundle on Node 1 (9.4.0, distinct package)
    type: install_application
    node: calimero-node-1
    path: dist/com.calimero.mero-drive-docs-v2-9.4.0.mpk
    dev: true
    outputs:
      app_v2: applicationId

  - name: Install v2 bundle on Node 2 (so Bob can run the migrated wasm)
    type: install_application
    node: calimero-node-2
    path: dist/com.calimero.mero-drive-docs-v2-9.4.0.mpk
    dev: true

  - name: Set upgrade policy to lazy-on-access
    type: update_group_settings
    node: calimero-node-1
    group_id: '{{namespace_id}}'
    upgrade_policy: lazy_on_access

  - name: Cascade namespace v1 → v2
    type: upgrade_group
    node: calimero-node-1
    group_id: '{{namespace_id}}'
    target_application_id: '{{app_v2}}'
    cascade: true

  - name: Wait for cascade gossip to reach both nodes
    type: wait
    seconds: 15

  # NOTE: no wait_for_sync here. Migration is per-node lazy-on-access — Alice
  # (the initiator) migrated eagerly, but Bob stays on v1 until HE next accesses
  # the context, so the two roots legitimately differ until then and cannot be
  # forced to converge by a sync. Each of Bob's calls below triggers his own
  # lazy migration; the HLC fence keeps the mixed-version nodes from corrupting
  # each other in the meantime.

  # =================================================================
  # Phase D: validate OLD survived + NEW present, on both nodes
  # =================================================================
  - name: OLD — all three comments still present (Alice)
    type: call
    node: calimero-node-1
    context_id: '{{docs_ctx}}'
    method: comment_count
    executor_public_key: '{{alice_key}}'
    outputs:
      count_after: result

  - name: Assert no comment data lost in migration
    type: json_assert
    statements:
      - 'json_equal({{count_after}}, {"output": 3})'

  - name: OLD — a carried comment's body survived intact (Alice)
    type: call
    node: calimero-node-1
    context_id: '{{docs_ctx}}'
    method: get_comment
    executor_public_key: '{{alice_key}}'
    args:
      id: cmt-1
    outputs:
      carried: result

  - name: Assert comment body + doc link survived
    type: json_assert
    statements:
      - 'json_subset({{carried}}, {"output": {"body": "alice first comment", "doc_id": "doc-1"}})'

  - name: NEW — migrated top-level field present (Alice)
    type: call
    node: calimero-node-1
    context_id: '{{docs_ctx}}'
    method: default_sort_order
    executor_public_key: '{{alice_key}}'
    outputs:
      alice_sort: result

  - name: NEW — migrated top-level field present (Bob, cross-node)
    type: call
    node: calimero-node-2
    context_id: '{{docs_ctx}}'
    method: default_sort_order
    executor_public_key: '{{bob_key}}'
    outputs:
      bob_sort: result

  - name: Assert the additive field migrated on both nodes
    type: json_assert
    statements:
      - 'json_equal({{alice_sort}}, {"output": "created"})'
      - 'json_equal({{bob_sort}}, {"output": "created"})'

  # Each owner re-signs only their OWN authored comments.
  - name: Alice's pending authored count (her two comments)
    type: call
    node: calimero-node-1
    context_id: '{{docs_ctx}}'
    method: count_my_pending
    executor_public_key: '{{alice_key}}'
    outputs:
      alice_pending:  result

  - name: Assert Alice has two comments pending signature
    type: json_assert
    statements:
      - 'json_equal({{alice_pending}}, {"output": 2})'

  - name: Bob's pending authored count (his one comment)
    type: call
    node: calimero-node-2
    context_id: '{{docs_ctx}}'
    method: count_my_pending
    executor_public_key: '{{bob_key}}'
    outputs:
      bob_pending: result

  - name: Assert Bob has one comment pending signature
    type: json_assert
    statements:
      - 'json_equal({{bob_pending}}, {"output": 1})'

  - name: Alice re-signs her comments
    type: call
    node: calimero-node-1
    context_id: '{{docs_ctx}}'
    method: migrate_my_entries
    executor_public_key: '{{alice_key}}'
    outputs:
      alice_convert: result

  - name: Assert Alice converted both, none remaining
    type: json_assert
    statements:
      - 'json_equal({{alice_convert}}, {"output": {"converted": 2, "remaining": 0}})'

  - name: Bob re-signs his comment
    type: call
    node: calimero-node-2
    context_id: '{{docs_ctx}}'
    method: migrate_my_entries
    executor_public_key: '{{bob_key}}'
    outputs:
      bob_convert: result

  - name: Assert Bob converted his one, none remaining
    type: json_assert
    statements:
      - 'json_equal({{bob_convert}}, {"output": {"converted": 1, "remaining": 0}})'

  - name: Alice pending now zero
    type: call
    node: calimero-node-1
    context_id: '{{docs_ctx}}'
    method: count_my_pending
    executor_public_key: '{{alice_key}}'
    outputs:
      alice_pending_after: result

  - name: Bob pending now zero
    type: call
    node: calimero-node-2
    context_id: '{{docs_ctx}}'
    method: count_my_pending
    executor_public_key: '{{bob_key}}'
    outputs:
      bob_pending_after: result

  - name: Assert both owners fully migrated
    type: json_assert
    statements:
      - 'json_equal({{alice_pending_after}}, {"output": 0})'
      - 'json_equal({{bob_pending_after}}, {"output": 0})'

  # =================================================================
  # Teardown
  # =================================================================
  - name: Delete context
    type: delete_context
    node: calimero-node-1
    context_id: '{{docs_ctx}}'
    requester: '{{admin_key}}'

  - name: Delete namespace
    type: delete_namespace
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    requester: '{{admin_key}}'

stop_all_nodes: false
