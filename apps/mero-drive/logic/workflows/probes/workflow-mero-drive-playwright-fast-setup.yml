name: Mero Drive Playwright — fast (single-node) setup
description: >
  Single-node merobox bootstrap for the e2e-fast Playwright job
  (landing + single-node projects). Installs the docs+registry mpk
  bundle on node 1 and idles. No namespace, no contexts — every
  user-visible step (create namespace, folder, doc) is a Playwright
  assertion target, so we want a blank slate.

  stop_all_nodes: false keeps the merod container alive after merobox
  exits; the CI harness SIGKILLs merobox once the success line lands
  so docker (separate process tree) outlives the merobox python
  atexit teardown.

force_pull_image: true

# Auth-service ON: node reachable at http://node1.127.0.0.1.nip.io
# through Traefik. Browser origin (Vite :5173) needs merobox >=0.6.9
# for OPTIONS preflight bypass (merobox#228) and >=0.6.11 for the
# rename of `alias` → `name` on CreateNamespaceApiRequest (#235).
auth_service: true

# ⚠️ REQUIRED, and its absence is why namespace joins kept dying on
# `KeyDelivery timed out`.
#
# Without it, `merod init`'s default `bootstrap.nodes` survives — the PUBLIC
# calimero devnet boot-node. Every container then spends its startup dialing
# unreachable public addresses, and the node log fills with
#
#     libp2p_relay: Dropping in-flight connect request because we are at capacity
#     autonat: ✗ Address /ip4/52.226.124.20/udp/... test failed
#
# until the join gives up with
#
#     join_group: direct namespace-join request found no reachable mesh peer
#     join_group: join response contained no group key
#     KeyDelivery timed out for group ContextGroupId(...)
#
# The peers never found each other; it was never a timing race. `e2e_mode`
# clears `bootstrap.nodes`, gives the workflow its own rendezvous namespace,
# turns multicast discovery on (which is what populates the kad table on a
# single Docker bridge) and tightens the sync intervals. merobox's own
# `apply_e2e_defaults` documents measuring this exact failure with it off.
e2e_mode: true

nodes:
  count: 1
  # Stated, not inherited. core rc.26 made mDNS opt-in (core#3620): `merod init`
  # now writes `discovery.mdns = false`. merobox does not pass the flag, so peer
  # discovery changed at the image bump with nothing here changing.
  mdns: true
  image: ghcr.io/calimero-network/merod:0.11.0-rc.32
  prefix: calimero-node

steps:
  - name: Install Mero Drive bundle on Node 1
    type: install_application
    node: calimero-node-1
    path: dist/com.calimero.mero-drive-docs.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Assert app installed
    type: assert
    statements:
      - 'is_set({{app_id}})'

stop_all_nodes: false
