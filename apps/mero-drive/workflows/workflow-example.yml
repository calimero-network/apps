description: Private Docs Application Workflow
name: Private Docs Bootstrap

# Force pull Docker images even if they exist locally
force_pull_image: true
auth_service: true

nodes:
  chain_id: testnet-1
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: docs-node

steps:
  # Step 1: Install the application on the first node
  - name: Install Private Docs Application
    type: install_application
    node: docs-node-1
    path: logic/res/docs_app.wasm
    dev: true
    outputs:
      app_id: applicationId

  # Step 2: Create a context using the installed application
  - name: Create Private Docs Context
    type: create_context
    node: docs-node-1
    application_id: "{{app_id}}"
    outputs:
      context_id: contextId
      member_public_key: memberPublicKey

  # Step 3: Generate an identity on the second node
  - name: Create Identity on Node 2
    type: create_identity
    node: docs-node-2
    outputs:
      public_key: publicKey

  # Step 4: Wait for identity creation to complete
  - name: Wait for Identity Creation
    type: wait
    seconds: 5

  # Step 5: Invite the second node to join the context
  - name: Invite Node 2 to Join
    type: invite_identity
    node: docs-node-1
    context_id: "{{context_id}}"
    grantee_id: "{{public_key}}"
    granter_id: "{{member_public_key}}"
    capability: member
    outputs:
      invitation: invitation

  # Step 6: Join the context from the second node
  - name: Join Context from Node 2
    type: join_context
    node: docs-node-2
    context_id: "{{context_id}}"
    invitee_id: "{{public_key}}"
    invitation: "{{invitation}}"

  # Step 7: Create a sample document
  - name: Create Sample Document
    type: call
    node: docs-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: create_document
    args:
      title: "Welcome to Private Docs"
      content: "This is a sample document created during bootstrapping.\n\nPrivate Docs allows you to create, edit, and organize your documents securely on the Calimero network."
      tags:
        - welcome
        - sample
    outputs:
      doc_id: result

  # Step 8: Wait for document creation
  - name: Wait for Document Creation
    type: wait
    seconds: 3

  # Step 9: Create another sample document
  - name: Create Getting Started Document
    type: call
    node: docs-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: create_document
    args:
      title: "Getting Started Guide"
      content: "# Getting Started with Private Docs\n\n1. Create a new document using the 'New Document' button\n2. Add a title and content\n3. Optionally add tags to organize your documents\n4. Use the search feature to find documents\n5. Archive documents you no longer need"
      tags:
        - guide
        - tutorial
    outputs:
      guide_doc_id: result

  # Step 10: Wait and verify
  - name: Wait for Sync
    type: wait
    seconds: 3

  # Step 11: List documents from Node 2
  - name: List Documents from Node 2
    type: call
    node: docs-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key}}"
    method: list_documents
    args:
      include_archived: false
    outputs:
      documents_list: result

# Configuration options
stop_all_nodes: false
restart: true
nuke: false
wait_timeout: 120
