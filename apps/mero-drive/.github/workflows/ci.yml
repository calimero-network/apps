name: CI

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "logic/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"

  # No `branches:` filter. A base-branch filter silently skips CI for any PR
  # in a stack (whose base is another PR's branch), so those land unlinted and
  # untested. Every pull request gets the same gates regardless of base.
  pull_request:
    paths:
      - "app/**"
      - "logic/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Frontend — Lint, Build, Test
  # ============================================================
  # The app/ directory is currently the pre-migration v8 layer (still
  # uses the hand-written AbiClient / WorkspaceManager / FolderContextManager).
  # Phase 4 of the namespace migration will rewrite it against the new
  # generated clients + mero-react hooks. Until that lands, this job
  # prevents unrelated regressions in the existing app while the
  # backend migration is in flight.
  #
  # `tsc --noEmit` is intentionally NOT run here: the current app has
  # one pre-existing type mismatch against @calimero-network/calimero-client
  # (ConnectionType enum drift) that's unrelated to this migration.
  # Typecheck returns as a required gate once Phase 4 ships the
  # rewritten app layer.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # pnpm caching via `cache: pnpm` requires a committed lockfile.
      # `app/pnpm-lock.yaml` is gitignored in this repo (see .gitignore:
      # "Lock files (deployment generates its own)"), so we skip the
      # lockfile-hash cache and don't use `--frozen-lockfile`. Cold dep
      # installs are ~20-30s on CI; acceptable until lockfile policy
      # changes.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm --dir app install --no-frozen-lockfile

      - name: Lint
        run: pnpm --dir app lint

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm --dir app test

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm --dir app build

      # Asserts the editor stack stays demand-loaded. The lazy() boundary
      # around DocumentEditor reads as correct in source even when chunking
      # has pulled the editor into the entry graph, so this checks the built
      # output rather than the intent.
      # No `!cancelled()` here: it inspects the build output, so running it
      # after a failed build only adds a confusing second failure.
      - name: Bundle budget
        run: pnpm --dir app check:bundle

  # ============================================================
  # Job 2: Logic (Rust) — Format, Clippy, Unit Tests, WASM Build
  # ============================================================
  # Covers the two-crate workspace (registry + docs + shared types)
  # produced by Phases 1–3 of the namespace migration. Runs:
  #   - `cargo fmt --check`            — formatting
  #   - `cargo clippy` (host)          — lint the whole workspace
  #   - `cargo test --workspace`       — 60 unit tests on host
  #   - `cargo build` (wasm32-…)       — produce the `.wasm` artifacts
  #     for both services (registry + docs)
  logic:
    name: Logic (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          # Cargo.lock is gitignored so each fresh checkout re-resolves the
          # `branch = "master"` git deps (calimero-sdk / calimero-storage /
          # calimero-storage-macros / calimero-wasm-abi) to current HEAD.
          # That's intentional: PR e2e runs always exercise the up-to-date
          # runtime ABI. Cache key only hashes Cargo.toml — `restore-keys`
          # still hits when only deps moved, and cargo's own resolution
          # validates whether the cached ~/.cargo/git snapshots are usable.
          key: logic-${{ runner.os }}-${{ hashFiles('logic/Cargo.toml', 'logic/crates/*/Cargo.toml') }}
          restore-keys: logic-${{ runner.os }}-

      - name: Cargo format
        working-directory: logic
        run: cargo fmt --check

      - name: Cargo clippy (workspace, host)
        if: ${{ !cancelled() }}
        working-directory: logic
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test (workspace)
        if: ${{ !cancelled() }}
        working-directory: logic
        run: cargo test --workspace

      - name: Build registry WASM
        if: ${{ !cancelled() }}
        working-directory: logic/crates/registry
        run: cargo build --target wasm32-unknown-unknown --profile app-release

      - name: Build docs WASM
        if: ${{ !cancelled() }}
        working-directory: logic/crates/docs
        run: cargo build --target wasm32-unknown-unknown --profile app-release

  # ============================================================
  # Job 3: Bundle — Build the multi-service .mpk against current core master
  # ============================================================
  # cargo mero bundle builds both services, embeds each ABI, records
  # per-artifact digests, and signs with the dev key (fine for e2e; the
  # registry refuses dev signatures). `--output` keeps the version-free
  # filename (`com.calimero.mero-drive-docs.mpk`) so e2e paths never churn
  # across version bumps. Uploaded as a build artifact so the e2e job below
  # can consume it without rebuilding, and so PR reviewers can download
  # and inspect the actual artifact that would ship.
  #
  # `Cargo.lock` is gitignored, so each fresh checkout resolves the
  # `branch = "master"` git deps for calimero-sdk / calimero-storage /
  # calimero-storage-macros / calimero-wasm-abi to whatever is currently
  # at master HEAD. That is exactly what we want: every PR's e2e run is
  # exercised against the up-to-date runtime ABI. Mirrors battleships'
  # CI policy (their `bundle` job comment).
  #
  # The committed `logic/dist/*.mpk` is for local dev convenience — CI
  # does not consume it. The artifact uploaded here is what the e2e
  # matrix downloads and installs on the merod nodes.
  bundle:
    name: Bundle (.mpk)
    runs-on: ubuntu-latest
    needs: [logic]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          # Cargo.lock is gitignored — see the matching block in the `logic`
          # job above. Same key shape so both jobs share cached registry +
          # git snapshots.
          key: logic-${{ runner.os }}-${{ hashFiles('logic/Cargo.toml', 'logic/crates/*/Cargo.toml') }}
          restore-keys: logic-${{ runner.os }}-

      - name: Setup cargo-mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build bundle
        working-directory: logic
        run: cargo mero bundle --dev --output dist/com.calimero.mero-drive-docs.mpk

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: mero-drive-docs-bundle-${{ github.sha }}
          path: logic/dist/*.mpk
          retention-days: 7
          if-no-files-found: error

  # ============================================================
  # Job 4: E2E — Merobox Matrix (one job per workflow file)
  # ============================================================
  # Each merobox workflow runs in its own matrix cell so they execute
  # in parallel instead of sequentially. Mirrors the structure in
  # calimero-network/core's e2e-rust-apps.yml. Wall-clock time drops
  # roughly 5x on green CI runs because the main + Phase-9 workflows no
  # longer serialize behind each other.
  # fail-fast: false keeps a single workflow failure from hiding
  # regressions in the others.
  #
  # merobox comes from its GitHub release binary, checksum-verified by
  # .github/actions/setup-merobox. There is no apt repo, despite what this
  # comment used to claim.
  #
  # The earlier cold-start sync race on subgroup-owned contexts (the
  # "warmup probe" workaround) was fixed upstream in
  # calimero-network/core#2170 (merged 2026-04-20). The probe has been
  # removed; the workflow now relies on core's corrected namespace-root
  # peer-discovery fallback for the cold-start window.
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [bundle]
    # Each cell orchestrates Docker containers behind a 2-attempt retry
    # loop, so a wedged merod would otherwise sit on the 6h default.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Main multi-service workflow: registry + docs full coverage
          # across two nodes, cross-node sync assertions.
          - name: main
            file: workflow-mero-drive-e2e.yml
          # Phase 9 — docs lifecycle. Every DocsClient method + tag
          # flow + archive flow across two nodes.
          - name: docs-lifecycle
            file: workflow-mero-drive-docs-lifecycle.yml
          # Phase 9 — members. Role/capability transitions, add/remove,
          # defaults.
          - name: members
            file: workflow-mero-drive-members.yml
          # Phase 9 — namespace lifecycle. Rename (set_group_metadata),
          # delete_group, delete_namespace, multi-namespace isolation.
          - name: namespace-lifecycle
            file: workflow-mero-drive-namespace-lifecycle.yml
          # Metadata records (#2338) — namespace / folder / member name
          # round-trips across two nodes, plus the CAN_MANAGE_METADATA
          # negative-cap path now that merobox v0.6.12 honors
          # expected_failure on group_management steps.
          - name: metadata-records
            file: workflow-mero-drive-metadata-records.yml
          # Collaborative op-log (PR #57) — cross-node convergence of the
          # Yjs content_updates set: append_doc_update / get_doc_updates,
          # one-way + concurrent (add-wins union) + idempotent re-delivery.
          # The always-on, non-flaky backend proxy for true 2-person editing
          # (the browser text-merge half is two-node doc-collab.spec.ts).
          - name: collab
            file: workflow-mero-drive-collab.yml
          # NOTE: e2e/workflow-mero-drive-open-restricted-collab.yml (open/
          # restricted folders + registry permissions) is tracked but NOT in
          # the matrix yet — same as workflow-mero-drive-open-subgroup.yml. It
          # runs clean through the new permission paths (verified via
          # workflow_dispatch) but, like the `main` cell, it flakes on
          # `wait_for_sync` over subgroup-owned docs contexts (the core
          # SyncSessionActor wedge tracked in core#2199/#2238). Wire it in once
          # that's resolved and a merobox release ships #214/#236 + #2338's
          # metadata steps (for the two negative-cap steps stubbed inline).
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install merobox
        uses: ./.github/actions/setup-merobox

      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: mero-drive-docs-bundle-${{ github.sha }}
          path: logic/dist

      - name: Prepare log directory
        run: mkdir -p docker-logs

      - name: Run ${{ matrix.name }} workflow
        run: |
          cd e2e
          max_attempts=2
          attempt=1
          success=false

          # In-flight log watcher. Replaces the prior post-hoc
          # `docker logs` collection, which only captured the `-init`
          # containers — `merobox bootstrap run` tears down the
          # runtime merod containers as part of its exit path, so
          # by the time the shell regained control all that was
          # left were the init names. (Tracked upstream in
          # merobox#207 / core#2179.)
          #
          # The watcher polls `docker ps` once a second and starts
          # `docker logs -f <c>` to a per-container file as soon as
          # each runtime container appears. Since the follower runs
          # while the container is alive, the log file survives the
          # post-run cleanup. Pattern lifted verbatim from
          # battleships' CI.
          #
          # The attempt number lives in $ATTEMPT_FILE so a single
          # watcher process keeps running across the retry loop while
          # still namespacing mark files and log paths per attempt.
          # Without this, attempt 2's containers (same names as
          # attempt 1 after `merobox nuke --force` recreates them)
          # would be skipped because the attempt-1 mark files survive
          # the container wipe, and the attempt-1 log file would be
          # clobbered.
          LOGDIR="$GITHUB_WORKSPACE/docker-logs"
          WATCHER_STATE_DIR="$(mktemp -d)"
          ATTEMPT_FILE="$WATCHER_STATE_DIR/.attempt"
          echo 1 > "$ATTEMPT_FILE"
          (
              while [ ! -f "$WATCHER_STATE_DIR/stop" ]; do
                  cur=$(cat "$ATTEMPT_FILE" 2>/dev/null || echo 1)
                  for c in $(docker ps --filter "label=calimero.node=true" --format "{{.Names}}" 2>/dev/null | grep -v -- '-init$' || true); do
                      mark="$WATCHER_STATE_DIR/${c}-attempt${cur}"
                      if [ ! -f "$mark" ]; then
                          touch "$mark"
                          echo "[log-watcher] following $c (attempt $cur)"
                          docker logs -f "$c" > "$LOGDIR/${{ matrix.name }}-attempt${cur}-${c}.log" 2>&1 &
                      fi
                  done
                  sleep 1
              done
          ) &
          WATCHER_PID=$!

          while [ $attempt -le $max_attempts ]; do
            if [ $attempt -gt 1 ]; then
              echo "Retry attempt $attempt for ${{ matrix.name }}..."
              merobox stop --all || true
              merobox nuke --force || true
              sleep 2
            fi
            echo $attempt > "$ATTEMPT_FILE"

            if merobox bootstrap run \
                "${{ matrix.file }}" \
                --e2e-mode; then
              success=true
              break
            else
              attempt=$((attempt + 1))
            fi
          done

          # Signal the watcher to stop and give `docker logs -f`
          # followers a moment to flush their final output.
          touch "$WATCHER_STATE_DIR/stop"
          sleep 2
          kill "$WATCHER_PID" 2>/dev/null || true
          for pid in $(jobs -p); do kill "$pid" 2>/dev/null || true; done
          wait 2>/dev/null || true

          merobox stop --all || true
          merobox nuke --force || true

          if [ "$success" = false ]; then
            echo "::error::${{ matrix.name }} workflow failed after $max_attempts attempts"
            exit 1
          fi

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-docker-logs-${{ matrix.name }}-${{ github.sha }}
          path: docker-logs/
          retention-days: 7
          if-no-files-found: ignore
