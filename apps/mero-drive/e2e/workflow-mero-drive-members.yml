name: Mero Drive E2E — Member Management + Role Changes
description: >
  Coverage for the Phase 8-E surface: adding/removing members,
  changing their roles, and mutating capability bitmasks directly.
  Maps to the NamespaceMembersPanel + FolderSharingPanel user flows.
  The main workflow-mero-drive-e2e.yml only does a one-shot member
  add; this workflow exercises the full member lifecycle.

  Two nodes (Alice = namespace admin, Bob = member). Alice invites
  Bob, changes his role (update_member_role), sets precise
  capabilities (set_member_capabilities), verifies via
  get_member_capabilities, and finally removes him. Negative paths
  cover: non-admin attempting admin ops, removing non-member,
  setting caps on non-member.

  Also exercises the namespace-level membership root (i.e.
  namespaceId-as-rootGroupId) so the NamespaceMembersPanel's
  useFolderMembership(rootGroupId) + useMemberCaps(rootGroupId,
  identity) binding has backend coverage.

force_pull_image: true

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: calimero-node

steps:
  # =================================================================
  # Phase A: Bootstrap
  # =================================================================

  - name: Install bundle on Node 1
    type: install_application
    node: calimero-node-1
    path: ../logic/dist/com.calimero.mero-drive-docs-9.1.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Install bundle on Node 2
    type: install_application
    node: calimero-node-2
    path: ../logic/dist/com.calimero.mero-drive-docs-9.1.0.mpk
    dev: true

  - name: Alice creates namespace
    type: create_namespace
    node: calimero-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Create namespace invitation for Bob
    type: create_namespace_invitation
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      ns_invite: invitation

  - name: Wait for namespace gossip to reach Node 2
    type: wait
    seconds: 10

  - name: Bob joins the namespace
    type: join_namespace
    node: calimero-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{ns_invite}}'
    outputs:
      bob_identity: memberIdentity

  # =================================================================
  # Phase B: List members — baseline shape
  #
  # The namespace root itself is a group (namespaceId IS rootGroupId
  # at the admin-API layer — see NamespaceSwitcher's file header).
  # Listing members on the namespace id gets us the namespace-wide
  # member roster the NamespaceMembersPanel renders.
  # =================================================================

  - name: list_group_members on the namespace root
    type: list_group_members
    node: calimero-node-1
    group_id: '{{namespace_id}}'

  # =================================================================
  # Phase C: Create a subgroup for testing per-folder membership
  #
  # Mirrors the FolderSharingPanel flow: invite users to a subgroup
  # (folder), not just the namespace root.
  # =================================================================

  - name: Alice creates a subgroup (folder)
    type: create_group_in_namespace
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    group_name: shared-folder
    outputs:
      folder_group: groupId

  - name: Alice adds Bob to the folder subgroup
    type: add_group_members
    node: calimero-node-1
    group_id: '{{folder_group}}'
    members:
      - identity: '{{bob_identity}}'
        role: Member

  - name: list_group_members on the subgroup — Bob is in
    type: list_group_members
    node: calimero-node-1
    group_id: '{{folder_group}}'

  # =================================================================
  # Phase D: get_member_capabilities — read the bitmask
  #
  # This is the path useMemberCaps hits on every permission hook
  # render. The MemberRoleSelect PRESETS (Viewer / Editor / Manager)
  # all match specific bit combinations — tested below.
  # =================================================================

  # Baseline: capture Bob's per-member capability bitmask as soon as
  # he joins with role=Member. core/admin/handlers/groups/
  # get_member_capabilities.rs returns `response.capabilities`, which
  # is the EXPLICIT per-member override (a separate field from
  # `role`). A newly-added member with no override returns 0 — that's
  # correct, and the effective permissions come from the role. We
  # capture this baseline so the role-transition steps below can
  # assert update_member_role doesn't mutate the override.
  - name: get_member_capabilities for Bob (initial role=Member) — capture
    type: get_member_capabilities
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    outputs:
      initial_member_caps: capabilities

  # =================================================================
  # Phase E: update_member_role — string role transitions
  #
  # Covers the API mero-react exposes via useUpdateMemberRole. Role
  # and the per-member capability override are SEPARATE fields on the
  # admin-API side: `update_member_role` only touches `role`, and
  # `get_member_capabilities` returns the untouched per-member
  # override bitmask — not a role-derived effective mask.
  #
  # So the assertion here is the invariant: the override bitmask is
  # unchanged after promote-then-demote. A backend bug where
  # update_member_role leaked into the override (or cleared it) would
  # flip this assertion. The role-to-effective-permission mapping
  # itself is enforced server-side and would need a separate
  # "try-privileged-op-as-Bob" test to cover, which belongs in the
  # permissions e2e rather than here.
  # =================================================================

  - name: Alice promotes Bob to Admin
    type: update_member_role
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    role: Admin

  - name: Capture Bob's override after role promote
    type: get_member_capabilities
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    outputs:
      promoted_override_caps: capabilities

  - name: Assert role change didn't touch the per-member override
    type: assert
    statements:
      - '{{promoted_override_caps}} == {{initial_member_caps}}'

  - name: Alice demotes Bob back to Member
    type: update_member_role
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    role: Member

  - name: Capture Bob's override after role demote
    type: get_member_capabilities
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    outputs:
      demoted_override_caps: capabilities

  - name: Assert role round-trip left the override bitmask unchanged
    type: assert
    statements:
      - '{{demoted_override_caps}} == {{initial_member_caps}}'

  # =================================================================
  # Phase F: set_member_capabilities — precise bitmask writes
  #
  # Matches MemberRoleSelect + NamespaceMemberRow's preset
  # application. Capability bit layout — core's `MemberCapabilities`,
  # re-exported as CAPABILITIES from constants/config.ts:
  #   CAN_CREATE_CONTEXT=1, CAN_INVITE_MEMBERS=2,
  #   CAN_JOIN_OPEN_SUBGROUPS=4, MANAGE_MEMBERS=8,
  #   MANAGE_APPLICATION=16, CAN_CREATE_SUBGROUP=32,
  #   CAN_DELETE_SUBGROUP=64, CAN_MANAGE_VISIBILITY=128,
  #   CAN_MANAGE_METADATA=256
  # Namespace-level presets (design spec §5.3):
  #   Viewer  = 4    (CAN_JOIN_OPEN_SUBGROUPS)
  #   Editor  = 37   (CAN_JOIN_OPEN_SUBGROUPS|CAN_CREATE_SUBGROUP|CAN_CREATE_CONTEXT)
  #   Manager = 495  (Editor + CAN_INVITE_MEMBERS|MANAGE_MEMBERS|
  #                   CAN_MANAGE_VISIBILITY|CAN_DELETE_SUBGROUP|CAN_MANAGE_METADATA)
  # ("Admin" = the core group-admin *role*, which bypasses the
  # bitmask entirely — covered by the update_member_role steps above.)
  # =================================================================

  # Each verify step captures the returned bitmask into a uniquely-
  # named output variable, and an `assert` step immediately after
  # compares the value. Without the equal() assertion a backend bug
  # that silently stored a different bitmask would pass these tests.
  - name: Set Bob to Viewer preset (CAN_JOIN_OPEN_SUBGROUPS = 4)
    type: set_member_capabilities
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    capabilities: 4

  - name: Verify Viewer bitmask — capture
    type: get_member_capabilities
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    outputs:
      viewer_caps: capabilities

  # NB. Use the `A == B` operator form, not `equal(A, B)` — the
  # operator path in merobox's assert DSL coerces to float for numeric
  # comparison, whereas `equal()` does strict Python `==` and fails
  # when the captured value is int but the literal is parsed as str.
  - name: Assert Viewer bitmask == 4
    type: assert
    statements:
      - '{{viewer_caps}} == 4'

  - name: Set Bob to Editor preset (CAN_JOIN_OPEN_SUBGROUPS|CAN_CREATE_SUBGROUP|CAN_CREATE_CONTEXT = 37)
    type: set_member_capabilities
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    capabilities: 37

  - name: Verify Editor bitmask — capture
    type: get_member_capabilities
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    outputs:
      editor_caps: capabilities

  - name: Assert Editor bitmask == 37
    type: assert
    statements:
      - '{{editor_caps}} == 37'

  - name: Set Bob to Manager preset (Editor + CAN_INVITE_MEMBERS|MANAGE_MEMBERS|CAN_MANAGE_VISIBILITY|CAN_DELETE_SUBGROUP|CAN_MANAGE_METADATA = 495)
    type: set_member_capabilities
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    capabilities: 495

  - name: Verify Manager bitmask — capture
    type: get_member_capabilities
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    outputs:
      manager_caps: capabilities

  - name: Assert Manager bitmask == 495
    type: assert
    statements:
      - '{{manager_caps}} == 495'

  # Also test a non-preset "Custom" mask so the MemberRoleSelect
  # "Custom" branch has backend coverage (CAN_MANAGE_METADATA alone —
  # not a preset). Store-verbatim is the key guarantee here: the
  # backend must not coerce unusual bitmasks.
  - name: Set Bob to a non-preset bitmask (CAN_MANAGE_METADATA = 256 only)
    type: set_member_capabilities
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    capabilities: 256

  - name: Verify the non-preset bitmask — capture
    type: get_member_capabilities
    node: calimero-node-1
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    outputs:
      custom_caps: capabilities

  - name: Assert non-preset bitmask stored verbatim == 256
    type: assert
    statements:
      - '{{custom_caps}} == 256'

  # Cross-node propagation check: Bob's own node should see the same
  # capability bitmask that Alice just wrote. Validates the namespace
  # gossip layer, not just the admin-API write path.
  # Match the 8-10s wait the rest of the e2e workflows use for
  # governance gossip; the 5s we had before was half the norm and
  # occasionally flaked on slow CI runners before the assertion.
  - name: Wait for cap change to propagate to Bob's node
    type: wait
    seconds: 10

  - name: Bob reads his own caps from node 2 — capture
    type: get_member_capabilities
    node: calimero-node-2
    group_id: '{{folder_group}}'
    member_id: '{{bob_identity}}'
    outputs:
      bob_view_caps: capabilities

  - name: Assert Bob's node agrees with Alice's node (== 256)
    type: assert
    statements:
      - '{{bob_view_caps}} == 256'

  # =================================================================
  # Phase G: set_default_capabilities + set_default_visibility
  #
  # Backend for the namespace-level default-caps / default-visibility
  # that new members inherit. No app UI calls these yet (Phase 8-E
  # stops short of admin defaults), but exercising them now means
  # when the UI lands the backend path is proven.
  # =================================================================

  - name: Set default member capabilities (Editor preset = 37)
    type: set_default_capabilities
    node: calimero-node-1
    group_id: '{{folder_group}}'
    capabilities: 37

  - name: Set default visibility to Restricted
    type: set_default_visibility
    node: calimero-node-1
    group_id: '{{folder_group}}'
    visibility: Restricted

  # set_default_visibility only accepts Open / Restricted — there's
  # no Inherit literal at the admin-API layer. Flip back to Open to
  # exercise the second branch of the enum.
  - name: Revert default visibility to Open
    type: set_default_visibility
    node: calimero-node-1
    group_id: '{{folder_group}}'
    visibility: Open

  # =================================================================
  # Phase H: Member removal
  # =================================================================

  - name: Alice removes Bob from the subgroup
    type: remove_group_members
    node: calimero-node-1
    group_id: '{{folder_group}}'
    members:
      - '{{bob_identity}}'

  - name: list_group_members — Bob no longer in the subgroup
    type: list_group_members
    node: calimero-node-1
    group_id: '{{folder_group}}'

  # =================================================================
  # Phase I: Negative paths — BLOCKED ON MEROBOX
  #
  # We'd ideally cover: get_member_capabilities, set_member_capabilities,
  # remove_group_members, update_member_role — all invoked on a
  # non-member identity and asserted to fail. All four step types live
  # in merobox/commands/bootstrap/steps/group_management.py, which does
  # not call `self._is_expected_failure()` — the base-class helper is
  # available but those step classes don't opt in, so
  # `expected_failure: true` is silently ignored and any exception
  # stops the workflow.
  #
  # Tracked in calimero-network/merobox#214. When merobox wires
  # `_is_expected_failure` into group_management.py's step classes,
  # these negative steps land back here.
  #
  # =================================================================
  # Phase J: Cleanup
  # =================================================================

  - name: delete_group — tear down the subgroup
    type: delete_group
    node: calimero-node-1
    group_id: '{{folder_group}}'

# Leave containers up for the CI log-watcher / retry loop. The outer
# shell in .github/workflows/ci.yml calls `merobox nuke --force` on
# attempt boundaries; merobox shouldn't stop nodes on workflow success.
stop_all_nodes: false
