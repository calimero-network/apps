name: Mero Drive E2E — Namespace + Registry + Docs Multi-Service
description: >
  Full end-to-end coverage for the mero-drive v9 multi-service bundle.
  Two nodes: node-1 (Alice) creates a namespace, a Registry context, and
  a nested folder group with its own Docs context; node-2 (Bob) joins the
  namespace and the same contexts. The workflow exercises every public
  method on both services (registry + docs), including the error paths
  (duplicate registration, rebinding, missing ids, empty tag, etc.), and
  asserts cross-node replication at key sync points.

  Merobox workflows execute sequentially — concurrent-write CRDT merges
  (two nodes writing the same key simultaneously then converging) are
  covered by the Rust unit tests, not here. Everything here is single-
  writer-at-a-time with `wait_for_sync` to hand the write off to the
  other node's reader.

force_pull_image: true

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: calimero-node

steps:
  # =================================================================
  # Phase A: Bootstrap — install, namespace, registry context join
  # =================================================================

  - name: Install Mero Drive bundle on Node 1
    type: install_application
    node: calimero-node-1
    path: ../logic/dist/com.calimero.mero-drive-docs-9.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Install Mero Drive bundle on Node 2
    type: install_application
    node: calimero-node-2
    path: ../logic/dist/com.calimero.mero-drive-docs-9.0.0.mpk
    dev: true

  - name: Alice creates namespace
    type: create_namespace
    node: calimero-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Alice creates the per-namespace Registry context
    type: create_context
    node: calimero-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    service_name: registry
    outputs:
      registry_ctx: contextId
      alice_key: memberPublicKey

  - name: Assert Registry bootstrap shape
    type: assert
    statements:
      - 'is_set({{namespace_id}})'
      - 'is_set({{registry_ctx}})'
      - 'is_set({{alice_key}})'

  - name: Create namespace invitation for Bob
    type: create_namespace_invitation
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      ns_invite: invitation

  - name: Wait for namespace gossip to reach Node 2
    type: wait
    seconds: 10
    message: Namespace governance DAG needs to propagate before Bob can join

  - name: Bob joins the namespace
    type: join_namespace
    node: calimero-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{ns_invite}}'
    outputs:
      bob_identity: memberIdentity

  - name: Bob joins the Registry context
    type: join_context
    node: calimero-node-2
    context_id: '{{registry_ctx}}'
    outputs:
      registry_ctx_bob: contextId
      bob_key: memberPublicKey

  - name: Assert Bob is on the Registry context
    type: assert
    statements:
      - 'is_set({{bob_identity}})'
      - 'is_set({{bob_key}})'

  - name: Sync Registry context across nodes
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{registry_ctx}}'
    timeout: 30

  # =================================================================
  # Phase B: Registry — empty state, register top-level folder,
  #                     read-back shape, color + visibility mutations.
  # =================================================================

  # The call succeeding (no `expected_failure`) is the assertion — an
  # `is_set` on an intentionally empty list would fail because merobox's
  # `is_set` treats `[]` as unset.
  - name: get_folders on empty registry returns empty list
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: get_folders
    executor_public_key: '{{alice_key}}'

  # Top-level folder: the frontend creates a namespace subgroup for it so
  # that folder membership = group membership. We mirror that flow here
  # and then register the group id in the registry with a color.
  - name: Create top-level folder group (Engineering)
    type: create_group_in_namespace
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    group_alias: eng
    outputs:
      eng_group: groupId

  - name: Assert eng_group allocated
    type: assert
    statements:
      - 'is_set({{eng_group}})'

  # Simulate the frontend's app-level cascade. In the real app,
  # `useFolderOperations.create()` handles inherit-mode cascade: after the
  # subgroup is created, it iterates parent members and calls
  # `addGroupMember(newGroup, identity, caps & DEFAULT_CHILD_CAP_MASK)`
  # for each. Neither the registry nor docs WASM does this — by design,
  # both services are admin-API-adjacent and know nothing about
  # membership policy (see design spec → Cascade Rules).
  #
  # A merobox workflow has no React client to run the cascade, so we
  # reproduce its effect with `add_group_members`. This workflow covers
  # ABI surface for every registry/docs method; the cascade *boundary*
  # (restricted folders correctly wall off members) is covered by
  # the frontend Vitest suite + the restricted-visibility e2e workflow.
  - name: Simulate app-cascade — add Bob to Engineering subgroup
    type: add_group_members
    node: calimero-node-1
    group_id: '{{eng_group}}'
    members:
      - identity: '{{bob_identity}}'
        role: Member

  # Subgroup governance (Bob added to eng_group) needs to:
  #   1. propagate from Alice to Bob via namespace gossip
  #   2. be accepted into Bob's local group store
  #   3. be re-gossiped so Alice's runtime knows Bob is confirmed
  # Before (2) and (3) complete, any docs-context sync request Bob sends
  # to Alice can be dropped at the membership-check gate. 10s gives the
  # three-phase handshake enough headroom across slow docker networking.
  - name: Wait for Engineering subgroup membership to propagate
    type: wait
    seconds: 10
    message: Engineering subgroup governance needs to reach Bob before he joins the docs context

  - name: register_folder Engineering with red color
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{eng_group}}'
      parent_id: null
      color: '#ff0000'

  - name: Reject duplicate register_folder
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{eng_group}}'
      parent_id: null
      color: null
    expected_failure: true

  - name: Reject register_folder with empty id
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: ''
      parent_id: null
      color: null
    expected_failure: true

  - name: get_folder returns the record
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: get_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{eng_group}}'
    outputs:
      eng_folder_dto: result.output

  - name: Assert eng folder DTO populated
    type: assert
    statements:
      - 'is_set({{eng_folder_dto}})'

  - name: Reject get_folder on unknown id
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: get_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: 'ghost-folder-id'
    expected_failure: true

  - name: set_color overwrites (LWW) — red → green
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: set_color
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{eng_group}}'
      color: '#00ff00'

  - name: set_color empty string clears the color
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: set_color
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{eng_group}}'
      color: ''

  - name: set_color on unknown folder is rejected
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: set_color
    executor_public_key: '{{alice_key}}'
    args:
      id: 'ghost-folder-id'
      color: '#112233'
    expected_failure: true

  - name: set_visibility Engineering to Restricted
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: set_visibility
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{eng_group}}'
      visibility: Restricted

  - name: set_visibility back to Inherit
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: set_visibility
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{eng_group}}'
      visibility: Inherit

  - name: set_visibility on unknown folder is rejected
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: set_visibility
    executor_public_key: '{{alice_key}}'
    args:
      id: 'ghost-folder-id'
      visibility: Restricted
    expected_failure: true

  # =================================================================
  # Phase C: Registry — bind a Docs context to the folder
  # =================================================================

  - name: Create Docs context bound to Engineering group
    type: create_context
    node: calimero-node-1
    application_id: '{{app_id}}'
    group_id: '{{eng_group}}'
    service_name: docs
    outputs:
      eng_docs_ctx: contextId
      alice_docs_key: memberPublicKey

  - name: bind_folder_context links Engineering to its docs ctx
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: bind_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{eng_group}}'
      context_id: '{{eng_docs_ctx}}'

  - name: Reject second bind on same folder (conflict)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: bind_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{eng_group}}'
      context_id: '{{eng_docs_ctx}}'
    expected_failure: true

  - name: Reject bind_folder_context on unknown folder
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: bind_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: 'ghost-folder-id'
      context_id: '{{eng_docs_ctx}}'
    expected_failure: true

  - name: get_folder_context returns the binding
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: get_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{eng_group}}'
    outputs:
      eng_binding: result.output

  - name: Assert binding present
    type: assert
    statements:
      - 'is_set({{eng_binding}})'

  # =================================================================
  # Phase D: Registry — nested folders, reorder, move, sort order
  # =================================================================

  - name: Create nested folder group (Engineering/Backend)
    type: create_group_in_namespace
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    group_alias: eng-backend
    outputs:
      backend_group: groupId

  - name: register_folder Backend under Engineering
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{backend_group}}'
      parent_id: '{{eng_group}}'
      color: null

  - name: Create sibling nested folder (Engineering/Frontend)
    type: create_group_in_namespace
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    group_alias: eng-frontend
    outputs:
      frontend_group: groupId

  - name: register_folder Frontend under Engineering
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{frontend_group}}'
      parent_id: '{{eng_group}}'
      color: '#0000ff'

  - name: reorder Engineering children — Frontend first, Backend second
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: reorder
    executor_public_key: '{{alice_key}}'
    args:
      parent_id: '{{eng_group}}'
      folder_ids:
        - '{{frontend_group}}'
        - '{{backend_group}}'

  - name: get_sort_order returns the stored order
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: get_sort_order
    executor_public_key: '{{alice_key}}'
    args:
      parent_id: '{{eng_group}}'
    outputs:
      eng_sort: result.output

  - name: Assert sort order set
    type: assert
    statements:
      - 'is_set({{eng_sort}})'

  - name: reorder is LWW — swap the two children back
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: reorder
    executor_public_key: '{{alice_key}}'
    args:
      parent_id: '{{eng_group}}'
      folder_ids:
        - '{{backend_group}}'
        - '{{frontend_group}}'

  - name: Reject reorder with id not under the requested parent
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: reorder
    executor_public_key: '{{alice_key}}'
    args:
      parent_id: null
      folder_ids:
        - '{{backend_group}}'
    expected_failure: true

  - name: Reject reorder with unknown id in the list
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: reorder
    executor_public_key: '{{alice_key}}'
    args:
      parent_id: '{{eng_group}}'
      folder_ids:
        - '{{backend_group}}'
        - 'ghost-folder-id'
    expected_failure: true

  # Same rationale as the "empty registry" read above — call-succeeds IS
  # the assertion; an unset parent's sort_order is `[]` and `is_set([])` fails.
  - name: get_sort_order on unset parent returns empty list
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: get_sort_order
    executor_public_key: '{{alice_key}}'
    args:
      parent_id: '{{frontend_group}}'

  # Move Backend to a new parent — for this we spin up a second top-level
  # folder and reparent Backend under it, then back to Engineering.
  - name: Create second top-level folder group (Design)
    type: create_group_in_namespace
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    group_alias: design
    outputs:
      design_group: groupId

  - name: register_folder Design as top-level
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{design_group}}'
      parent_id: null
      color: '#ff00ff'

  - name: move_folder Backend under Design
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: move_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{backend_group}}'
      new_parent: '{{design_group}}'

  - name: move_folder Backend back under Engineering
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: move_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{backend_group}}'
      new_parent: '{{eng_group}}'

  - name: move_folder to top-level (new_parent=null)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: move_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{backend_group}}'
      new_parent: null

  - name: move_folder back under Engineering (restore)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: move_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{backend_group}}'
      new_parent: '{{eng_group}}'

  # =================================================================
  # Phase D3: True admin-API nesting via reparent_group
  #
  # The existing Phase D exercises the REGISTRY's view of parent/child
  # (`move_folder` updates the registry's `parent_id` index). The
  # authoritative tree shape actually lives at the admin-API governance
  # layer. This phase builds a truly nested subgroup (admin-API parent
  # = eng_group, not namespace root), uses `list_subgroups` to assert
  # the admin-API view, and re-parents it back to top-level. Mirrors
  # the "Create Nested Subfolder" and "Delete Folder (and Subtree)"
  # flows in the design spec's Data Flow section; the client calls
  # reparent_group alongside registry.register_folder /
  # unregister_folder.
  #
  # The earlier `unnest_group` + `nest_group` pair was dropped upstream
  # (core#2200 — strict group-tree invariant + cascade delete) in
  # favour of a single atomic `reparent_group` edge-swap. Removing the
  # transient-orphan state also removed the delete-on-orphaned-group
  # usability gap that required re-nesting before delete_group.
  # =================================================================

  - name: Create subteam group (initially a direct child of namespace root)
    type: create_group_in_namespace
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    group_alias: eng-subteam
    outputs:
      subteam_group: groupId

  # `create_group_in_namespace` places the new group as a direct child
  # of the namespace root. Re-parent it under eng_group in one atomic
  # step (pre-#2200 this was two steps — unnest + nest — with a
  # transient orphan state in between).
  - name: reparent_group — move subteam from namespace root under eng_group
    type: reparent_group
    node: calimero-node-1
    child_group_id: '{{subteam_group}}'
    new_parent_id: '{{eng_group}}'

  - name: list_subgroups on eng_group — admin-API now shows subteam as child
    type: list_subgroups
    node: calimero-node-1
    group_id: '{{eng_group}}'
    outputs:
      eng_children_after_nest: subgroups

  - name: Assert admin-API sees subteam under eng_group
    type: assert
    statements:
      - 'is_set({{eng_children_after_nest}})'

  - name: register_folder subteam in registry (parent=eng_group to match admin)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{subteam_group}}'
      parent_id: '{{eng_group}}'
      color: '#888888'

  # Simulate the frontend's cascade: for an Inherit subfolder, the
  # parent's members get added to the child with DEFAULT_CHILD_CAP_MASK.
  # Bob is already in eng_group, so cascade would add him to subteam
  # with READ | WRITE | CREATE_GROUP (= 7).
  - name: Simulate inherit cascade — add Bob to the new nested subteam
    type: add_group_members
    node: calimero-node-1
    group_id: '{{subteam_group}}'
    members:
      - identity: '{{bob_identity}}'
        role: Member

  - name: Sync Registry after nested-folder registration
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{registry_ctx}}'
    timeout: 30

  - name: Bob reads subteam and sees parent=eng_group
    type: call
    node: calimero-node-2
    context_id: '{{registry_ctx}}'
    method: get_folder
    executor_public_key: '{{bob_key}}'
    args:
      id: '{{subteam_group}}'
    outputs:
      subteam_dto_bob: result.output

  - name: Assert Bob sees the nested structure
    type: assert
    statements:
      - 'is_set({{subteam_dto_bob}})'

  # Reverse flow: reparent subteam from eng_group back to the
  # namespace root, then update registry to match. Mirrors the
  # delete-folder subtree flow where the client re-parents before
  # the registry + admin-API delete.
  #
  # Pre-#2200 this was two steps (unnest from eng_group → re-nest
  # under namespace) with the re-nest required to restore
  # namespace-identity resolution before delete_group. With strict
  # group-tree invariant, the group always has a parent — the edge
  # swap is atomic and delete_group can resolve the namespace chain
  # unconditionally.
  - name: reparent_group — move subteam from eng_group back to namespace root
    type: reparent_group
    node: calimero-node-1
    child_group_id: '{{subteam_group}}'
    new_parent_id: '{{namespace_id}}'

  # After the reparent, eng_group has no remaining children — the
  # list is `[]`. merobox's `is_set` macro treats empty collections
  # as "not set" and would fail an `is_set` assertion, even though
  # an empty list IS the correct post-reparent state. The step call
  # succeeding without `expected_failure: true` is the real
  # assertion; if the reparent had failed, `list_subgroups` would
  # still show subteam under eng_group and Phase D3's cleanup below
  # would then fail on the subsequent delete. So the reparent is
  # indirectly validated. Same pattern used for the empty-registry
  # read in Phase B.
  - name: list_subgroups on eng_group — subteam should no longer appear
    type: list_subgroups
    node: calimero-node-1
    group_id: '{{eng_group}}'

  - name: move_folder subteam to top-level in registry (match admin)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: move_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{subteam_group}}'
      new_parent: null

  # Registry cleanup so Phase H's cascade sees the same tree shape.
  - name: unregister_folder subteam (registry cleanup)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: unregister_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{subteam_group}}'

  - name: delete_group subteam (admin-API cleanup — full lifecycle)
    type: delete_group
    node: calimero-node-1
    group_id: '{{subteam_group}}'

  # =================================================================
  # Phase E: Registry — cross-node replication sanity
  # =================================================================

  - name: Sync Registry after all mutations
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{registry_ctx}}'
    timeout: 30

  - name: Bob reads the full folder list
    type: call
    node: calimero-node-2
    context_id: '{{registry_ctx}}'
    method: get_folders
    executor_public_key: '{{bob_key}}'
    outputs:
      folders_bob: result.output

  - name: Assert Bob sees folders after sync
    type: assert
    statements:
      - 'is_set({{folders_bob}})'

  - name: Bob reads Engineering's sort order (sees Alice's last reorder)
    type: call
    node: calimero-node-2
    context_id: '{{registry_ctx}}'
    method: get_sort_order
    executor_public_key: '{{bob_key}}'
    args:
      parent_id: '{{eng_group}}'
    outputs:
      eng_sort_bob: result.output

  - name: Assert sort order replicated to Bob
    type: assert
    statements:
      - 'is_set({{eng_sort_bob}})'

  - name: Bob reads Engineering → Docs binding
    type: call
    node: calimero-node-2
    context_id: '{{registry_ctx}}'
    method: get_folder_context
    executor_public_key: '{{bob_key}}'
    args:
      folder_id: '{{eng_group}}'
    outputs:
      eng_binding_bob: result.output

  - name: Assert binding replicated to Bob
    type: assert
    statements:
      - 'is_set({{eng_binding_bob}})'

  # =================================================================
  # Phase F: Docs service — CRUD on the Engineering docs context
  # =================================================================

  - name: Wait for docs context gossip to reach Bob
    type: wait
    seconds: 8
    message: Docs context membership needs to propagate

  - name: Bob joins Engineering docs context
    type: join_context
    node: calimero-node-2
    context_id: '{{eng_docs_ctx}}'
    outputs:
      eng_docs_ctx_bob: contextId
      bob_docs_key: memberPublicKey

  - name: Sync docs context across nodes
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{eng_docs_ctx}}'
    timeout: 30

  # Empty list_docs — no `is_set` because `is_set([])` fails.
  - name: list_docs on empty docs context returns []
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: list_docs
    executor_public_key: '{{alice_docs_key}}'
    args:
      include_archived: false

  - name: create_doc — "Roadmap" with body
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: create_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      title: Roadmap
      content: Q1 plan goes here
    outputs:
      roadmap_id: result.output

  - name: Assert doc id allocated
    type: assert
    statements:
      - 'is_set({{roadmap_id}})'

  - name: create_doc — empty content is allowed
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: create_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      title: Scratchpad
      content: ''
    outputs:
      scratch_id: result.output

  - name: get_doc returns the created doc
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: get_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{roadmap_id}}'
    outputs:
      roadmap_dto: result.output

  - name: Assert roadmap DTO populated
    type: assert
    statements:
      - 'is_set({{roadmap_dto}})'

  - name: Reject get_doc on unknown id
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: get_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: doc-does-not-exist
    expected_failure: true

  - name: edit_doc title only
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: edit_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{roadmap_id}}'
      title: Roadmap (v2)
      content: null

  - name: edit_doc content only
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: edit_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{roadmap_id}}'
      title: null
      content: Q1 and Q2 plan

  - name: edit_doc both title and content
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: edit_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{roadmap_id}}'
      title: Roadmap (final)
      content: Shipping next week.

  - name: edit_doc can clear content to empty string
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: edit_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{scratch_id}}'
      title: null
      content: ''

  - name: Reject edit_doc on unknown id
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: edit_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: doc-does-not-exist
      title: x
      content: null
    expected_failure: true

  - name: add_tag — "planning"
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: add_tag
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{roadmap_id}}'
      tag: planning

  - name: add_tag — duplicate is idempotent (no-op on a set)
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: add_tag
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{roadmap_id}}'
      tag: planning

  - name: add_tag — second tag "urgent"
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: add_tag
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{roadmap_id}}'
      tag: urgent

  - name: Reject add_tag with empty string
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: add_tag
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{roadmap_id}}'
      tag: ''
    expected_failure: true

  - name: Reject add_tag on unknown doc
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: add_tag
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: doc-does-not-exist
      tag: planning
    expected_failure: true

  - name: remove_tag — drop "urgent"
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: remove_tag
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{roadmap_id}}'
      tag: urgent

  - name: Reject remove_tag on unknown doc
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: remove_tag
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: doc-does-not-exist
      tag: whatever
    expected_failure: true

  - name: archive_doc hides Scratchpad from default list
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: archive_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{scratch_id}}'

  - name: list_docs default excludes archived
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: list_docs
    executor_public_key: '{{alice_docs_key}}'
    args:
      include_archived: false
    outputs:
      docs_default: result.output

  - name: Assert default list returned
    type: assert
    statements:
      - 'is_set({{docs_default}})'

  - name: list_docs include_archived=true shows archived
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: list_docs
    executor_public_key: '{{alice_docs_key}}'
    args:
      include_archived: true
    outputs:
      docs_all: result.output

  - name: Assert include-archived list returned
    type: assert
    statements:
      - 'is_set({{docs_all}})'

  - name: unarchive_doc restores Scratchpad
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: unarchive_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{scratch_id}}'

  - name: Reject archive_doc on unknown doc
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: archive_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: doc-does-not-exist
    expected_failure: true

  - name: Reject unarchive_doc on unknown doc
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: unarchive_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: doc-does-not-exist
    expected_failure: true

  # =================================================================
  # Phase G: Docs — cross-node convergence + Bob writes
  # =================================================================

  - name: Sync docs ctx before Bob reads Alice's state
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{eng_docs_ctx}}'
    timeout: 30

  - name: Bob reads list_docs (Alice's creates + edits + tags)
    type: call
    node: calimero-node-2
    context_id: '{{eng_docs_ctx}}'
    method: list_docs
    executor_public_key: '{{bob_docs_key}}'
    args:
      include_archived: false
    outputs:
      docs_bob: result.output

  - name: Assert Bob sees Alice's docs
    type: assert
    statements:
      - 'is_set({{docs_bob}})'

  - name: Bob reads Roadmap by id (cross-node get_doc)
    type: call
    node: calimero-node-2
    context_id: '{{eng_docs_ctx}}'
    method: get_doc
    executor_public_key: '{{bob_docs_key}}'
    args:
      id: '{{roadmap_id}}'
    outputs:
      roadmap_dto_bob: result.output

  - name: Assert Bob sees Roadmap with merged state
    type: assert
    statements:
      - 'is_set({{roadmap_dto_bob}})'

  - name: Bob creates his own doc
    type: call
    node: calimero-node-2
    context_id: '{{eng_docs_ctx}}'
    method: create_doc
    executor_public_key: '{{bob_docs_key}}'
    args:
      title: Bob's Notes
      content: Synced from node 2
    outputs:
      bob_doc_id: result.output

  - name: Sync docs ctx before Alice reads Bob's doc
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{eng_docs_ctx}}'
    timeout: 30

  - name: Alice reads Bob's doc (CRDT convergence)
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: get_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{bob_doc_id}}'
    outputs:
      bob_doc_from_alice: result.output

  - name: Assert Bob's doc visible to Alice
    type: assert
    statements:
      - 'is_set({{bob_doc_from_alice}})'

  - name: delete_doc — remove Scratchpad
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: delete_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{scratch_id}}'

  - name: Reject delete_doc on already-deleted id (not found)
    type: call
    node: calimero-node-1
    context_id: '{{eng_docs_ctx}}'
    method: delete_doc
    executor_public_key: '{{alice_docs_key}}'
    args:
      id: '{{scratch_id}}'
    expected_failure: true

  - name: Sync after delete
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{eng_docs_ctx}}'
    timeout: 30

  - name: Bob's list_docs reflects the delete
    type: call
    node: calimero-node-2
    context_id: '{{eng_docs_ctx}}'
    method: list_docs
    executor_public_key: '{{bob_docs_key}}'
    args:
      include_archived: true
    outputs:
      docs_bob_after_delete: result.output

  - name: Assert post-delete list returned
    type: assert
    statements:
      - 'is_set({{docs_bob_after_delete}})'

  # =================================================================
  # Phase G2: Cross-node move_folder propagation
  #
  # Earlier move_folder calls in Phase D all happened on Alice with a
  # single sync at the end. This phase exercises the stronger invariant:
  # Alice issues move_folder mid-session, and Bob (reading on a separate
  # node) must see the new parent after one sync pass.
  # =================================================================

  - name: Alice moves Backend under Design (cross-session)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: move_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{backend_group}}'
      new_parent: '{{design_group}}'

  - name: Sync Registry after cross-node move
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{registry_ctx}}'
    timeout: 30

  - name: Bob reads Backend and sees new parent
    type: call
    node: calimero-node-2
    context_id: '{{registry_ctx}}'
    method: get_folder
    executor_public_key: '{{bob_key}}'
    args:
      id: '{{backend_group}}'
    outputs:
      backend_after_move_bob: result.output

  - name: Assert Bob sees move result
    type: assert
    statements:
      - 'is_set({{backend_after_move_bob}})'

  # Restore Backend under Engineering so Phase H's cascade deletes
  # the tree in the same shape the earlier assertions rely on.
  - name: Restore Backend under Engineering
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: move_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{backend_group}}'
      new_parent: '{{eng_group}}'

  - name: Sync after restore
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{registry_ctx}}'
    timeout: 30

  # =================================================================
  # Phase G3: Divergent-write LWW convergence
  #
  # Merobox workflows are sequential, so we can't *literally* write
  # simultaneously. But we can write on Alice and immediately on Bob
  # without an intervening sync — both writes will land in each node's
  # local state at different HLC timestamps. After forcing sync, both
  # sides must agree on a single deterministic winner (HLC + node-id
  # tie-break). This catches the "both nodes diverge and never
  # reconcile" failure mode that bit the RGA content field earlier.
  #
  # Absolute value of the winner doesn't matter — convergence does.
  # =================================================================

  - name: Alice sets Engineering color red
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: set_color
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{eng_group}}'
      color: '#ff0000'

  # No sync between the two writes — each node observes its own write
  # and will learn about the other's only after the wait_for_sync below.
  - name: Bob sets Engineering color green (no intervening sync)
    type: call
    node: calimero-node-2
    context_id: '{{registry_ctx}}'
    method: set_color
    executor_public_key: '{{bob_key}}'
    args:
      id: '{{eng_group}}'
      color: '#00ff00'

  - name: Force sync to converge divergent writes
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{registry_ctx}}'
    timeout: 30

  - name: Alice reads Engineering color
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: get_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{eng_group}}'
    outputs:
      eng_color_alice_after: result.output

  - name: Bob reads Engineering color
    type: call
    node: calimero-node-2
    context_id: '{{registry_ctx}}'
    method: get_folder
    executor_public_key: '{{bob_key}}'
    args:
      id: '{{eng_group}}'
    outputs:
      eng_color_bob_after: result.output

  # Both DTOs must be present (sync completed) and — per `wait_for_sync`
  # having returned OK — the root hashes already match, which implies
  # the underlying LwwRegister states agree. The DTO assertions here
  # are belt-and-braces: prove the read path still works on both sides
  # post-convergence. Equality of the two `color` fields is proven by
  # the root-hash match; we could also compare with an extra assert
  # step that string-compares, but merobox's assert DSL doesn't express
  # cross-variable equality cleanly, and root-hash convergence already
  # subsumes field-equality.
  - name: Assert both sides returned a folder DTO after convergence
    type: assert
    statements:
      - 'is_set({{eng_color_alice_after}})'
      - 'is_set({{eng_color_bob_after}})'

  # =================================================================
  # Phase G4: Restricted-visibility wall
  #
  # Per the design spec's Cascade Rules: "When a folder's visibility is
  # Restricted, cascade does not descend through it. Members must be
  # added explicitly."
  #
  # Real-world scenario: Alice creates a private folder inside the
  # shared workspace. Bob can see the folder EXISTS in the registry
  # (metadata replicates, it's in the shared namespace-level registry
  # context) but cannot access its documents because he isn't a
  # member of its subgroup. This is what every "this folder is
  # restricted" UX in the app will depend on.
  #
  # We prove:
  #   1. Bob sees the folder in `get_folders` after sync (metadata
  #      does replicate).
  #   2. Bob's `join_context` on the restricted docs context is
  #      rejected (admin-API refuses — he's not in the subgroup).
  # =================================================================

  - name: Create restricted subgroup (no Bob cascade)
    type: create_group_in_namespace
    node: calimero-node-1
    namespace_id: '{{namespace_id}}'
    group_alias: private-alice
    outputs:
      private_group: groupId

  - name: register_folder private-alice as Restricted
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: register_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{private_group}}'
      parent_id: null
      color: '#000000'

  - name: set_visibility Restricted (explicit wall)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: set_visibility
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{private_group}}'
      visibility: Restricted

  # NOT calling add_group_members — this is the whole point of the
  # restricted-wall test. Bob is deliberately NOT in `private_group`.

  - name: Create docs context inside restricted subgroup
    type: create_context
    node: calimero-node-1
    application_id: '{{app_id}}'
    group_id: '{{private_group}}'
    service_name: docs
    outputs:
      private_docs_ctx: contextId
      alice_private_key: memberPublicKey

  - name: bind_folder_context for private_group
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: bind_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{private_group}}'
      context_id: '{{private_docs_ctx}}'

  - name: Alice writes a doc into the private folder
    type: call
    node: calimero-node-1
    context_id: '{{private_docs_ctx}}'
    method: create_doc
    executor_public_key: '{{alice_private_key}}'
    args:
      title: Private note
      content: only Alice can see this

  - name: Sync Registry so Bob learns the restricted folder exists
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{registry_ctx}}'
    timeout: 30

  - name: Bob sees the restricted folder metadata in the registry
    type: call
    node: calimero-node-2
    context_id: '{{registry_ctx}}'
    method: get_folder
    executor_public_key: '{{bob_key}}'
    args:
      id: '{{private_group}}'
    outputs:
      private_dto_bob: result.output

  - name: Assert Bob can READ the metadata (replication works) but below we prove he can't ACCESS the docs
    type: assert
    statements:
      - 'is_set({{private_dto_bob}})'

  # The wall. Bob is not a member of private_group; the admin-API
  # membership gate at `core/crates/context/src/handlers/join_context.rs`
  # should reject this join attempt with "identity is not a member of
  # the group".
  - name: Bob attempts to join the restricted docs context (must be rejected)
    type: join_context
    node: calimero-node-2
    context_id: '{{private_docs_ctx}}'
    expected_failure: true

  # Clean up so Phase H's cascade doesn't have to know about this
  # separate subgroup.
  - name: unregister_folder private-alice (cleanup)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: unregister_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{private_group}}'

  # =================================================================
  # Phase H: Registry — unregister folder cascade and final cleanup
  # =================================================================

  - name: unregister_folder Frontend (leaf first)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: unregister_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{frontend_group}}'

  - name: Reject unregister_folder on already-unregistered id
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: unregister_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{frontend_group}}'
    expected_failure: true

  - name: unregister_folder Backend (sibling leaf)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: unregister_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{backend_group}}'

  - name: unregister_folder Engineering (parent — also clears its binding)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: unregister_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{eng_group}}'

  # After the unregister, `get_folder_context` returns Ok(None) which
  # serializes to `null`. `is_set` on a null output would fail — so we skip
  # the assertion and just confirm the call itself doesn't panic. The fact
  # that `get_folders` below returns without the folder proves the cascade.
  - name: After unregister, get_folder_context no longer finds the binding
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: get_folder_context
    executor_public_key: '{{alice_key}}'
    args:
      folder_id: '{{eng_group}}'

  - name: Sync Registry after cascade
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{registry_ctx}}'
    timeout: 30

  - name: Bob sees the reduced folder set
    type: call
    node: calimero-node-2
    context_id: '{{registry_ctx}}'
    method: get_folders
    executor_public_key: '{{bob_key}}'
    outputs:
      folders_after_cascade_bob: result.output

  - name: Assert Bob's view matches Alice's after cascade
    type: assert
    statements:
      - 'is_set({{folders_after_cascade_bob}})'

  # Design was never bound to a docs context — confirm this is OK and
  # unregistering it still succeeds (idempotent cleanup of unbound folder).
  - name: unregister_folder Design (unbound top-level, clean path)
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: unregister_folder
    executor_public_key: '{{alice_key}}'
    args:
      id: '{{design_group}}'

  # Final state — everything unregistered, list is `[]`. Skip `is_set`.
  - name: Final get_folders is empty again
    type: call
    node: calimero-node-1
    context_id: '{{registry_ctx}}'
    method: get_folders
    executor_public_key: '{{alice_key}}'

stop_all_nodes: false
