# XcodeGen spec for the native iOS Mero Pass app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroPass.xcodeproj (not committed)
#   open MeroPass.xcodeproj
#
# The logic (vault crypto, vault session, generated contract client, view
# models) lives in the local PassCore package, which builds and tests on macOS
# with `swift test --package-path PassCore`. The swift-sdk is pinned by
# revision to the head of its Calimero 1.0 port (swift-sdk#85, branch
# feat/calimero-1.0), moving to the merge commit once that lands. Keep it
# identical to PassCore/Package.swift.
name: MeroPass

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 6c5f1167d1e586f556f59c326de5f51d034e80dd
  PassCore:
    path: PassCore

targets:
  MeroPass:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Pass
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        # Unlocking the device key asks for Face ID (or Touch ID / the passcode).
        NSFaceIDUsageDescription: Mero Pass uses Face ID to unlock your vaults on this phone.
        CFBundleURLTypes:
          # The node's consent page returns here (`mero-pass://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.pass.consent
            CFBundleURLSchemes: [mero-pass]
          # Invitation deep links: `calimero://com.calimero.mero-pass/join?invitation=…`.
          - CFBundleURLName: network.calimero.pass.invite
            CFBundleURLSchemes: [calimero]
        # Which cluster sign-in uses (Calimero 1.0). MeroNodeURL: a node of your
        # Calimero Cloud cluster (from the cloud.calimero.network console); empty =
        # the sign-in screen asks. MeroDevNodeURL: what the "Development node"
        # field starts with (`merod local`, mock attestation allowed). See README.
        MeroPassCallbackScheme: mero-pass
        MeroNodeURL: ""
        MeroDevNodeURL: "http://localhost:2501"
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # http only to a node on the local network (localhost, *.local, an IP literal).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # A passkey on a real cluster belongs to its relying party (the node's --rp-id).
    # To sign in with the device's passkey there, add an entitlements file with
    # `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`. A
    # development node uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.pass
        PRODUCT_NAME: MeroPass
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: PassCore
        product: PassCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

schemes:
  MeroPass:
    build:
      targets:
        MeroPass: all
