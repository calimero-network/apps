<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mero Pass</title>
    <meta
      name="description"
      content="A peer-to-peer secret manager: keep credentials in a vault on your own nodes and share them with namespace members."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#131215" />
    <link
      rel="preload"
      href="/fonts/powerGrotesk/PowerGrotesk-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/powerGrotesk/PowerGrotesk-Black.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Before first paint, so a light-mode choice never flashes charcoal.
         Same key and rules as src/lib/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem('mero-pass:theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#f5f5f0');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
