<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Mero Blocks</title>
    <style>
      :root {
        --lime: #a5ff11;
        --ink: #0b0b0c;
        --glass: rgba(11, 11, 12, 0.42);
        --glass-down: rgba(11, 11, 12, 0.62);
        --edge: rgba(255, 255, 255, 0.28);
        --inset-top: 0px;
        --inset-left: 0px;
        --inset-bottom: 0px;
        --inset-right: 0px;
        --pad-l: max(16px, var(--inset-left));
        --pad-r: max(16px, var(--inset-right));
        --pad-b: max(12px, var(--inset-bottom));
        --pad-t: max(12px, var(--inset-top));
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #87c4eb;
        font-family: -apple-system, system-ui, Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
      }
      #controls {
        position: fixed;
        inset: 0;
        z-index: 10;
        color: #fff;
        touch-action: none;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        background:
          linear-gradient(#fff, #fff) center / 2px 18px no-repeat,
          linear-gradient(#fff, #fff) center / 18px 2px no-repeat;
        filter: drop-shadow(0 0 1.5px rgba(0, 0, 0, 0.7));
        opacity: 0.9;
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        padding: 0;
        margin: 0;
        background: none;
        touch-action: none;
      }
      .round {
        position: absolute;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--glass);
        border: 1px solid var(--edge);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        transition: transform 80ms ease, background 80ms ease;
      }
      .round.down {
        background: var(--glass-down);
        transform: scale(0.93);
      }
      .round.big {
        width: 74px;
        height: 74px;
      }
      .round.small {
        width: 44px;
        height: 44px;
      }
      #menu-btn {
        left: var(--pad-l);
        top: var(--pad-t);
      }
      #players-chip {
        position: absolute;
        right: var(--pad-r);
        top: var(--pad-t);
        height: 32px;
        padding: 0 12px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 600;
        background: var(--glass);
        border: 1px solid var(--edge);
        pointer-events: none;
      }
      #jump-btn {
        right: var(--pad-r);
        bottom: var(--pad-b);
      }
      #break-btn {
        right: calc(var(--pad-r) + 7px);
        bottom: calc(var(--pad-b) + 88px);
      }
      #place-btn {
        right: calc(var(--pad-r) + 86px);
        bottom: calc(var(--pad-b) + 64px);
      }
      #hotbar {
        position: absolute;
        left: 50%;
        bottom: var(--pad-b);
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 14px;
        background: var(--glass);
        border: 1px solid var(--edge);
      }
      .slot {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid transparent;
      }
      .slot.sel {
        border-color: var(--lime);
        background: rgba(165, 255, 17, 0.18);
      }
      .swatch {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
      }
      #stick-base {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: rgba(11, 11, 12, 0.25);
        border: 1px solid var(--edge);
        display: none;
        pointer-events: none;
      }
      #stick-base.on {
        display: block;
      }
      #stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        transform: translate(-50%, -50%);
      }
      #toasts {
        position: absolute;
        left: 50%;
        top: var(--pad-t);
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        pointer-events: none;
      }
      .toast {
        background: rgba(11, 11, 12, 0.7);
        padding: 6px 14px;
        border-radius: 14px;
        font-size: 13px;
        font-weight: 500;
        animation: fade 3.6s forwards;
      }
      @keyframes fade {
        0%,
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #status {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f5f6f3;
        color: var(--ink);
      }
      #status p {
        margin: 0;
        font-size: 15px;
        color: #3a3b40;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(11, 11, 12, 0.12);
        border-top-color: var(--ink);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status"><div class="spinner"></div><p>Starting…</p></div>
    <script src="./game.js"></script>
  </body>
</html>
