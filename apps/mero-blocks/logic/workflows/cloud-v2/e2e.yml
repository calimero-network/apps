# Ported from e2e.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   sync_group x1: replication is synchronous
#   wait_for_sync x4: replication is synchronous: a read sees every committed write
name: Mero Blocks — shared voxel world (2-node e2e)
description: 'Proves the core thesis of mero-blocks: a Calimero context can carry a whole multiplayer
  voxel world as nothing but an override diff + presence.

  Two nodes join one world (context). Both players join, Alice places blocks, Bob sees them via get_overrides,
  Bob breaks one (an explicit b=0 override — never a map-remove), Alice sees the break, and the roster
  shows both players online. Terrain itself never crosses the network — every client regenerates it from
  the seed in world_meta.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3050
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install application on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_blocks.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.mero-blocks
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create namespace
  type: create_org
  org_name: Create namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Set default member capabilities
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 15
  account: calimero-node-1
- name: Generate identity for Node 2
  type: whoami
  account: calimero-node-2
  outputs:
    bob_identity: publicKey
- name: Wait for identity propagation
  type: wait
  seconds: 1.0
- name: Node 1 creates invitation for Node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invite_bob: token
- name: Settle before the namespace join (cold-join KeyDelivery)
  type: wait
  seconds: 1.0
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{invite_bob}}'
  account: calimero-node-2
- name: Settle after namespace join
  type: wait
  seconds: 1.0
- name: Node 1 creates the world
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_blocks.wasm'
  app_name: Node 1 creates the world
  init_args: '{"name": "overworld", "seed": 1337, "now": 1752264000}'
  org: '{{namespace_id}}'
  outputs:
    world_id: contextId
    alice_key: memberPublicKey
- name: Settle after sync
  type: wait
  seconds: 1.0
- name: Bob joins the world context
  type: whoami
  account: calimero-node-2
  outputs:
    bob_key: publicKey
- name: Bob reads world meta (seed + shared day clock)
  type: call
  app: '{{world_id}}'
  method: world_meta
  args: {}
  account: calimero-node-2
  as_key: '{{bob_key}}'
  outputs:
    meta_bob: rpc
- name: Assert the seed replicated to Node 2
  type: assert
  statements:
  - contains({{meta_bob}}, "1337")
  - contains({{meta_bob}}, "overworld")
- name: Alice joins the world
  type: call
  app: '{{world_id}}'
  method: join
  args:
    name: Alice
    now: 1752264001
  account: calimero-node-1
  as_key: '{{alice_key}}'
- name: Bob joins the world
  type: call
  app: '{{world_id}}'
  method: join
  args:
    name: Bob
    now: 1752264002
  account: calimero-node-2
  as_key: '{{bob_key}}'
- name: Alice reads the roster
  type: call
  app: '{{world_id}}'
  method: get_players
  args:
    now: 1752264005
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    roster_alice: rpc
- name: Assert both players are in the roster
  type: assert
  statements:
  - contains({{roster_alice}}, "Alice")
  - contains({{roster_alice}}, "Bob")
- name: Alice places a glowstone tower
  type: call
  app: '{{world_id}}'
  method: set_blocks
  args:
    edits:
    - x: 33
      y: 44
      z: 55
      b: 12
    - x: 33
      y: 45
      z: 55
      b: 12
    - x: 33
      y: 46
      z: 55
      b: 3
    now: 1752264010
  account: calimero-node-1
  as_key: '{{alice_key}}'
- name: Bob pulls the override diff
  type: call
  app: '{{world_id}}'
  method: get_overrides
  args: {}
  account: calimero-node-2
  as_key: '{{bob_key}}'
  outputs:
    overrides_bob: rpc
- name: Assert Bob received Alice's blocks (the whole world in 3 entries)
  type: assert
  statements:
  - contains({{overrides_bob}}, "44")
  - contains({{overrides_bob}}, "45")
  - contains({{overrides_bob}}, "46")
- name: Bob breaks the top block (b=0, never a map-remove)
  type: call
  app: '{{world_id}}'
  method: set_blocks
  args:
    edits:
    - x: 33
      y: 46
      z: 55
      b: 0
    now: 1752264020
  account: calimero-node-2
  as_key: '{{bob_key}}'
- name: Alice pulls the override diff
  type: call
  app: '{{world_id}}'
  method: get_overrides
  args: {}
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    overrides_alice: rpc
- name: Assert the break converged as an explicit air override (key kept)
  type: assert
  statements:
  - contains({{overrides_alice}}, "46")
  - contains({{overrides_alice}}, "44")
- name: Alice counts overrides (still 3 keys — LWW upsert, no duplicates)
  type: call
  app: '{{world_id}}'
  method: override_count
  args: {}
  account: calimero-node-1
  as_key: '{{alice_key}}'
  outputs:
    count_alice: rpc
- name: Assert override count is exactly 3
  type: assert
  statements:
  - contains({{count_alice}}, "3")
