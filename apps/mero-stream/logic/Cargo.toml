[package]
name = "mero-stream"
description = "Streaming media over Calimero — in-WASM codec capacity probe (Task 3)"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "1.6.1"
borsh-derive = "1.6.1"
bs58 = "0.5.1"
calimero-sdk = { git = "https://github.com/calimero-network/core.git", branch = "master" }
calimero-storage = { git = "https://github.com/calimero-network/core.git", branch = "master" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core.git", branch = "master" }
thiserror = "1.0.56"

[build-dependencies]
calimero-wasm-abi = { git = "https://github.com/calimero-network/core.git", branch = "master" }
serde_json = "1.0.113"

[dev-dependencies]
# Enables the native mock host so TestHost can drive contract state under
# `cargo test` (same as mero-meet).
calimero-storage = { git = "https://github.com/calimero-network/core.git", branch = "master", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
