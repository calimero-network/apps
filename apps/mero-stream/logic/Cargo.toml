[package]
name = "mero-stream"
description = "Streaming media over Calimero — in-WASM codec capacity probe (Task 3)"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Core is pinned to an explicit RELEASE TAG, matched to the merod image the e2e
# runs (`workflows/e2e.yml`) so contract and node always agree.
#
# Two tempting alternatives are both wrong here:
#
#   branch = "master"  — what this file used to say. It rides UNRELEASED protocol
#     work against a released merod image. Post-rc.19 master already carries the
#     account-identity primitive (#3320), writer sets naming accounts instead of
#     keys (#3344), and the alpha back-compat shims dropped with the migration
#     gate now enforced (#3359). None of that is in any image we can pull.
#
#   tag = "latest"  — the moving-tag convention other contract repos use
#     (core#3273). It does NOT work against core today: the remote has 166 tags
#     and none of them is `latest`. A warm cargo git cache can still resolve a
#     stale local `latest` (it resolved to rc.15 here) and build green, so this
#     fails only on a cold cache — i.e. on CI. Revisit if/when core republishes
#     the moving tag; until then an explicit rc is the honest pin.
#
# Bumping = edit these four tags + the e2e image together, then `cargo update`.
[dependencies]
borsh = "1.6.1"
borsh-derive = "1.6.1"
bs58 = "0.5.1"
calimero-sdk = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.19" }
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.19" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.19" }
thiserror = "1.0.56"

# NOTE: there is deliberately no `[build-dependencies]` section. This crate has
# no build.rs, so the `calimero-wasm-abi` + `serde_json` build-deps that used to
# sit here were dead weight — they compiled on every build and emitted nothing.
# Core has since moved ABI emission out of per-app build scripts entirely
# (#3319 deleted all 60 of them; #3364 derives the ABI from the type system), so
# the replacement is `cargo mero build`, which embeds the `calimero_abi_v1`
# section for us. That migration is a tracked follow-up, not this change: a
# module with no ABI section installs fine (the identity-downgrade gate
# fail-opens, and only fires on migration upgrades anyway), we just don't get
# meroctl/devtools introspection until then.

[dev-dependencies]
# Enables the native mock host so TestHost can drive contract state under
# `cargo test` (same as mero-meet).
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.19", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
