[package]
name = "mero-stream"
description = "Streaming media over Calimero — in-WASM codec capacity probe (Task 3)"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Consumed by `cargo mero build` / `cargo mero bundle` (core rc.19
# `tools/cargo-mero`). This table is what lets the tool derive manifest.json from
# the node's own canonical `BundleManifest` type instead of us hand-writing JSON
# that mirrors it — which is how the old build-bundle.sh shipped `"hash": null`
# and unwritable `license` / `tags` / `links` slots.
#
# The table is parsed with `deny_unknown_fields` and kebab-case keys, so a
# snake_case typo is a loud error rather than a silently-ignored field. `package`
# is the only required key; it must be a reverse-DNS id and is validated as
# path-safe because it becomes `dist/<package>.mpk`.
[package.metadata.calimero]
package = "com.calimero.merostream"
name = "Mero Stream"
description = "Capacity probe: streaming media OVER Calimero. /stream runs a toy codec inside the WASM app (approach 3); /live stores opaque browser-encoded H.264 (approach 2). Experimental; not shippable media."
author = "Calimero"
min-runtime-version = "0.11.0-rc.19"
frontend = "https://mero-stream.vercel.app/"

# Core is pinned to an explicit RELEASE TAG, matched to the merod image the e2e
# runs (`workflows/e2e.yml`) so contract and node always agree.
#
# Two tempting alternatives are both wrong here:
#
#   branch = "master"  — what this file used to say. It rides UNRELEASED protocol
#     work against a released merod image. Post-rc.19 master already carries the
#     account-identity primitive (#3320), writer sets naming accounts instead of
#     keys (#3344), and the alpha back-compat shims dropped with the migration
#     gate now enforced (#3359). None of that is in any image we can pull.
#
#   tag = "latest"  — the moving-tag convention other contract repos use
#     (core#3273). It does NOT work against core today: the remote has 166 tags
#     and none of them is `latest`. A warm cargo git cache can still resolve a
#     stale local `latest` (it resolved to rc.15 here) and build green, so this
#     fails only on a cold cache — i.e. on CI. Revisit if/when core republishes
#     the moving tag; until then an explicit rc is the honest pin.
#
# Bumping = edit these four tags + the e2e image together, then `cargo update`.
[dependencies]
base64 = "0.22"
borsh = "1.6.1"
borsh-derive = "1.6.1"
bs58 = "0.5.1"
calimero-sdk = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.19" }
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.19" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.19" }
thiserror = "1.0.56"

# NOTE: there is deliberately no `[build-dependencies]` section, and this crate
# has no build.rs. Core moved ABI emission out of per-app build scripts entirely
# (#3319 deleted all 60 of them; #3364 derives the ABI from the type system), so
# the emitter now lives in `cargo mero build` — it reads this crate's `src/*.rs`
# directly, writes `res/abi.json` + `res/state-schema.json`, and embeds the
# canonicalized ABI as the wasm `calimero_abi_v1` section. That migration is DONE
# here (see build.sh / build-bundle.sh); the ABI section is what gives
# meroctl/devtools introspection and what the identity-downgrade gate reads on a
# migration upgrade.

[dev-dependencies]
# Enables the native mock host so TestHost can drive contract state under
# `cargo test` (same as mero-meet).
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.19", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# `cargo mero build --profiling` / `cargo mero bundle --profiling` select this
# profile instead, and the tool errors if it is absent. Keeps debug info and skips
# wasm-opt, which is what you want when reading a flamegraph of `encode_frame`
# rather than shipping — the approach-3 WASM-CPU numbers came from a build like
# this. Note core gates app wasm size in CI (#3370), so a profiling build is for
# local measurement, not for install-on-a-shared-node.
[profile.app-profiling]
inherits = "release"
debug = true
strip = false
panic = "abort"
overflow-checks = true
