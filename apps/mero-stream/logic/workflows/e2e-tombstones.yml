# Ported from the v1 workflow e2e-tombstones.yml (`merobox cloud port`).
# v1 nodes are accounts here.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x4: replication is synchronous: a read sees every committed write
name: Mero Stream — pruning + tombstones across the wire (C3)
description: 'The C3 regression, cross-node. `e2e.yml` proves ONE frame crosses and decodes bit-identically.
  This proves the property that actually decides whether a long-running stream survives: after enough
  frames to force pruning, the peer still decodes recent frames correctly.

  Why that is not obvious. A CRDT remove leaves a tombstone that permanently shadows any later insert
  under the same key. Pruning the live window emits one tombstone per removed fragment, so a contract
  that reused fragment keys would see later frames silently swallowed — on the RECEIVING node, after replication,
  which is exactly where a unit test cannot look. The contract''s defence is globally monotone `frag-{seq}-{chunk}`
  keys that are never reused; this scenario is what proves that defence holds through gossip.

  FRAME_WINDOW is 30, so 40 frames guarantees pruning has happened.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3550
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install application on calimero-node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_stream.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.mero-stream
- name: Settle before the mesh joins
  type: wait
  seconds: 1.0
- name: Create the stream mesh
  type: create_org
  account: calimero-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: calimero-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: calimero-node-2
  token: '{{_mesh_invite}}'
- name: Create the stream mesh
  type: deploy
  account: calimero-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.APPS_WASM_DIR}}/mero_stream.wasm'
  app_name: Create the stream mesh
  init_args: '{"name": "tombstones"}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- type: set
  values:
    public_key: '{{public_key_calimero-node-2}}'
- name: Alice joins
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Alice
    now: 1751955000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Bob joins
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Bob
    now: 1751955001
  account: calimero-node-2
  as_key: '{{public_key}}'
- name: Alice streams 40 frames, paced
  type: repeat
  count: 40
  steps:
  - name: encode one frame
    type: call
    app: '{{context_id}}'
    method: encode_frame
    args:
      raw:
      - 0
      - 17
      - 34
      - 51
      - 68
      - 85
      - 102
      - 119
      - 136
      - 153
      - 170
      - 187
      - 204
      - 221
      - 238
      - 255
      width: 4
      height: 4
      track: 0
      now: 1751955010000
    account: calimero-node-1
    as_key: '{{member_public_key}}'
  - name: pace the stream
    type: wait
    seconds: 1.0
- name: Sender stats
  type: call
  app: '{{context_id}}'
  method: get_stats
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    alice_stats: rpc
- name: Receiver stats
  type: call
  app: '{{context_id}}'
  method: get_stats
  args: {}
  account: calimero-node-2
  as_key: '{{public_key}}'
  outputs:
    bob_stats: rpc
- name: Assert pruning happened, and identically on both nodes
  type: json_assert
  statements:
  - 'json_subset({{alice_stats}}, {"output": {"nextSeq": 40, "prunedFrames": 9, "oldestLiveSeq": 10, "liveFragments":
    31}})'
  - 'json_subset({{bob_stats}}, {"output": {"nextSeq": 40, "prunedFrames": 9, "oldestLiveSeq": 10, "liveFragments":
    31}})'
- name: Alice sends one more frame after the prunes
  type: call
  app: '{{context_id}}'
  method: encode_frame
  args:
    raw:
    - 255
    - 238
    - 221
    - 204
    - 187
    - 170
    - 153
    - 136
    - 119
    - 102
    - 85
    - 68
    - 51
    - 34
    - 17
    - 0
    width: 4
    height: 4
    track: 0
    now: 1751955020000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    post_prune_seq: result
- name: Alice checksums the post-prune frame
  type: call
  app: '{{context_id}}'
  method: frame_checksum
  args:
    seq: '{{post_prune_seq}}'
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    alice_post: result
- name: Bob checksums the post-prune frame
  type: call
  app: '{{context_id}}'
  method: frame_checksum
  args:
    seq: '{{post_prune_seq}}'
  account: calimero-node-2
  as_key: '{{public_key}}'
  outputs:
    bob_post: result
- name: Assert a post-prune frame is NOT shadowed by prune tombstones
  type: assert
  statements:
  - '{{post_prune_seq}} == 41'
  - is_set({{alice_post}})
  - is_set({{bob_post}})
  - '{{alice_post}} == {{bob_post}}'
- name: Assert a pruned frame reads as absent, not as corrupt
  type: call
  app: '{{context_id}}'
  method: frame_checksum
  args:
    seq: 1
  account: calimero-node-2
  as_key: '{{public_key}}'
  outputs:
    bob_pruned: result
- name: Frame 1 is long gone from the live window
  type: assert
  statements:
  - is_empty({{bob_pruned}})
