# Ported from e2e.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: Mero Stream — fragment round-trip over Calimero (2-node e2e)
description: 'Phase P2. Proves approach 3: a node encodes a raw luma frame INSIDE the WASM contract, the
  compressed fragment gossips to a second node, and the second node reconstructs the frame in WASM. The
  raw pixels are a mutation argument on node 1 only — just the compressed fragment crosses the wire.

  Bit-identity (C1) is asserted by having BOTH nodes independently decode the frame and hash the decoded
  pixels in WASM (`frame_checksum`), then comparing the two scalars. See the assertion block for why this
  is done with a checksum rather than by comparing pixel arrays directly.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3560
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install application on calimero-node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_stream.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.mero-stream
- name: Settle before the mesh joins
  type: wait
  seconds: 1.0
- name: Create the stream mesh (namespace + context + Node 2 joins)
  type: create_org
  account: calimero-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: calimero-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: calimero-node-2
  token: '{{_mesh_invite}}'
- name: Create the stream mesh (namespace + context + Node 2 joins)
  type: deploy
  account: calimero-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.APPS_WASM_DIR}}/mero_stream.wasm'
  app_name: Create the stream mesh (namespace + context + Node 2 joins)
  init_args: '{"name": "probe"}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- type: set
  values:
    public_key: '{{public_key_calimero-node-2}}'
- name: Alice joins the stream
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Alice
    now: 1751955000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Bob joins the stream
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Bob
    now: 1751955001
  account: calimero-node-2
  as_key: '{{public_key}}'
- name: Alice encodes a 4x4 frame IN WASM
  type: call
  app: '{{context_id}}'
  method: encode_frame
  args:
    raw:
    - 0
    - 17
    - 34
    - 51
    - 68
    - 85
    - 102
    - 119
    - 136
    - 153
    - 170
    - 187
    - 204
    - 221
    - 238
    - 255
    width: 4
    height: 4
    track: 0
    now: 1751955010000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    frame_seq: result
- name: Alice checksums her decode
  type: call
  app: '{{context_id}}'
  method: frame_checksum
  args:
    seq: '{{frame_seq}}'
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    alice_checksum: result
- name: Bob checksums HIS decode (the far side of the wire)
  type: call
  app: '{{context_id}}'
  method: frame_checksum
  args:
    seq: '{{frame_seq}}'
  account: calimero-node-2
  as_key: '{{public_key}}'
  outputs:
    bob_checksum: result
- name: Assert Bob decoded EXACTLY what Alice encoded (C1 across the wire)
  type: assert
  statements:
  - is_set({{alice_checksum}})
  - is_set({{bob_checksum}})
  - '{{alice_checksum}} == {{bob_checksum}}'
- name: Bob reconstructs the frame IN WASM
  type: call
  app: '{{context_id}}'
  method: get_frame
  args:
    after_seq: 0
  account: calimero-node-2
  as_key: '{{public_key}}'
  outputs:
    bob_frames: rpc
- name: Assert Bob's decode carries the right geometry and a real payload
  type: assert
  statements:
  - is_set({{bob_frames}})
  - contains({{bob_frames}}, "width")
  - contains({{bob_frames}}, "createdAt")
- name: Bob reads the stream stats (§4 instrumentation surface)
  type: call
  app: '{{context_id}}'
  method: get_stats
  args: {}
  account: calimero-node-2
  as_key: '{{public_key}}'
  outputs:
    bob_stats: rpc
- name: Assert the fragment is live and counted on the receiving node
  type: assert
  statements:
  - contains({{bob_stats}}, "liveFragments")
  - contains({{bob_stats}}, "nextSeq")
  - '{{frame_seq}} == 1'
