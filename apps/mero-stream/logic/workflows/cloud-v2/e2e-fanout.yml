# Ported from e2e-fanout.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: Mero Stream — gossip fan-out to two peers (3 nodes)
description: '§4 asks where fan-out saturates "across K peers", and §6 ranks gossip fan-out among the
  likely failure modes. Both `e2e.yml` and `e2e-tombstones.yml` run K=1, where a single mesh link carries
  everything and a fan-out problem cannot show up at all. This runs K=2.

  What it establishes: one node encodes a frame in WASM, and BOTH peers independently decode it to the
  same checksum. That is a stronger claim than two runs of the K=1 scenario — it exercises the sender
  publishing to a mesh with more than one subscriber, which is where co-located dev nodes have historically
  had trouble forming a usable gossipsub mesh.

  Kept to a single frame on purpose: this scenario is about reach, not load. The load curve is `scripts/load-curve.py`.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3530
accounts:
- calimero-node-1
- calimero-node-2
- calimero-node-3
steps:
- name: Install application on calimero-node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_stream.wasm'
  outputs:
    app_id: hash
  account: calimero-node-1
- name: Settle before the mesh joins
  type: wait
  seconds: 1.0
- name: Create the stream mesh with TWO joining nodes
  type: create_org
  account: calimero-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: calimero-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: calimero-node-2
  token: '{{_mesh_invite}}'
- type: invite
  account: calimero-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: calimero-node-3
  token: '{{_mesh_invite}}'
- name: Create the stream mesh with TWO joining nodes
  type: deploy
  account: calimero-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.APPS_WASM_DIR}}/mero_stream.wasm'
  app_name: Create the stream mesh with TWO joining nodes
  init_args: '{"name": "fanout"}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Alice joins
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Alice
    now: 1751955000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Bob joins
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Bob
    now: 1751955001
  account: calimero-node-2
  as_key: '{{public_key_calimero-node-2}}'
- name: Carol joins
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Carol
    now: 1751955002
  account: calimero-node-3
  as_key: '{{public_key_calimero-node-3}}'
- name: Carol reads the roster
  type: call
  app: '{{context_id}}'
  method: get_stats
  args: {}
  account: calimero-node-3
  as_key: '{{public_key_calimero-node-3}}'
  outputs:
    carol_stats: rpc
- name: The furthest node sees all three members
  type: json_assert
  statements:
  - 'json_subset({{carol_stats}}, {"output": {"memberCount": 3, "name": "fanout"}})'
- name: Alice encodes a frame IN WASM
  type: call
  app: '{{context_id}}'
  method: encode_frame
  args:
    raw:
    - 0
    - 17
    - 34
    - 51
    - 68
    - 85
    - 102
    - 119
    - 136
    - 153
    - 170
    - 187
    - 204
    - 221
    - 238
    - 255
    width: 4
    height: 4
    track: 0
    now: 1751955010000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    frame_seq: result
- name: Alice checksums her own decode
  type: call
  app: '{{context_id}}'
  method: frame_checksum
  args:
    seq: '{{frame_seq}}'
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    alice_checksum: result
- name: Bob checksums his decode
  type: call
  app: '{{context_id}}'
  method: frame_checksum
  args:
    seq: '{{frame_seq}}'
  account: calimero-node-2
  as_key: '{{public_key_calimero-node-2}}'
  outputs:
    bob_checksum: result
- name: Carol checksums her decode
  type: call
  app: '{{context_id}}'
  method: frame_checksum
  args:
    seq: '{{frame_seq}}'
  account: calimero-node-3
  as_key: '{{public_key_calimero-node-3}}'
  outputs:
    carol_checksum: result
- name: Assert the fragment reached BOTH peers and decoded identically
  type: assert
  statements:
  - is_set({{alice_checksum}})
  - is_set({{bob_checksum}})
  - is_set({{carol_checksum}})
  - '{{alice_checksum}} == {{bob_checksum}}'
  - '{{alice_checksum}} == {{carol_checksum}}'
