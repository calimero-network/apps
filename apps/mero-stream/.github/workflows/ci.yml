name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint + typecheck + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm build

  logic:
    name: Logic (contract tests + WASM build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup picks it up automatically.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: logic
      - name: Contract unit tests (native, TestHost — determinism C1..C3)
        run: cargo test
      - name: WASM build
        run: ./build.sh

  # NOTE: the merobox 2-node fragment-streaming e2e is Phase P2 and lives in
  # workflows/e2e.yml as a DRAFT. It is intentionally NOT wired into CI yet —
  # it needs the frontend load path and the §4 instrumentation asserts finished
  # first. Enable this job once workflows/e2e.yml is validated locally.
  #
  # e2e:
  #   name: E2E (2-node fragment round-trip over merobox)
  #   runs-on: ubuntu-latest
  #   needs: logic
  #   steps: ...
