name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter, deliberately. Filtering to `[main]` means a stacked PR
  # — one based on another open PR's branch, which is how this work is being
  # reviewed — gets NO checks at all and reports as green-by-absence. Running on
  # every PR base costs one extra run per stack and makes each layer verifiable
  # on its own.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint + typecheck + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Formatting (prettier)
        run: pnpm prettier
      # `tsc -b`, NOT `tsc --noEmit`. app/tsconfig.json is a solution file
      # (`"files": []` + references), so `--noEmit` resolves it, finds no files and
      # exits 0 having checked NOTHING — this step passed green for three commits
      # while `pnpm build` below failed on two real type errors. Both referenced
      # projects set `noEmit: true`, so build mode writes only .tsbuildinfo.
      - name: Typecheck
        run: pnpm exec tsc -b --force
      - run: pnpm exec vitest run
      - run: pnpm build

  logic:
    name: Logic (fmt + clippy + contract tests + WASM build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup picks it up automatically.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: logic
      - name: Formatting (rustfmt)
        run: cargo fmt --check
      # -D warnings because a contract's warnings are rarely cosmetic: unused
      # results and lossy casts are how state-handling bugs enter.
      - name: Lints (clippy)
        run: cargo clippy --all-targets -- -D warnings
      - name: Contract unit tests (native, TestHost — determinism C1..C3)
        run: cargo test
      - name: WASM build
        run: ./build.sh

  scripts:
    name: Scripts (load generator syntax + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The load generator is the P3 deliverable's driver and is stdlib-only, so
      # there is nothing to install — but a syntax error in it would only surface
      # at the start of a 30–60 minute measurement run.
      - name: Byte-compile
        run: python3 -m compileall -q scripts/
      # Pinned. An unpinned `pip install ruff` means any ruff release that adds a
      # rule turns a green PR red with no change to this repo — which already
      # happened here: 0.16.1 added PLW1510 and failed a run the local (older)
      # ruff had passed.
      - name: Lint
        run: |
          pip install "ruff==0.16.1"
          ruff check scripts/

  # P2: the fragment actually crosses the gossip layer between real nodes, and the
  # far node's in-WASM decode is proven bit-identical to the input. Every scenario
  # here was validated locally against merod 0.11.0-rc.20 before being enabled.
  #
  # Separate jobs rather than one long workflow: each scenario gets its own
  # runner, so a fan-out failure and a tombstone failure are distinguishable at a
  # glance, and one flaking scenario doesn't mask the others. The port bases in
  # the three files are deliberately distinct anyway, so they also compose if run
  # together locally.
  e2e:
    name: "E2E: ${{ matrix.scenario.name }}"
    runs-on: ubuntu-latest
    needs: logic
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: 2-node bit-identity (C1)
            file: e2e.yml
          - name: pruning + tombstones (C3)
            file: e2e-tombstones.yml
          - name: 3-node gossip fan-out
            file: e2e-fanout.yml
          - name: approach 2 opaque chunks
            file: e2e-live-chunks.yml
          - name: approach 1 ephemeral frames
            file: e2e-ephemeral-frames.yml
          # MEASURES the broadcaster cap rather than asserting it. Its own
          # assertions are deliberately weak (the rig, not the answer), so a rung
          # that degrades reports a number instead of reddening the build — read
          # the printed table, and the uploaded results.json.
          - name: capacity ladder (1-4 authors)
            file: e2e-capacity-ladder.yml
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: logic
      # The workflow installs logic/res/mero_stream.wasm into both nodes, so the
      # wasm has to exist before merobox runs.
      - name: Build the contract WASM
        working-directory: logic
        run: ./build.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The ephemeral scenario's `script` step shells out to `node` (presence has
      # no read endpoint, so its assertions are an SSE subscriber). Pinned rather
      # than left to the runner image's default, which drifts: the script uses
      # global fetch + ReadableStream, and a silent downgrade to an older Node
      # would fail it for a reason that has nothing to do with the transport.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Floor, not an exact pin: the scenarios rely on `create_mesh` publishing its
      # default {{context_id}}/{{member_public_key}}/{{public_key}} names, on
      # `result.output` dotted-path extraction, and on the `repeat` step. 0.6.49 is
      # the version they were validated against.
      # merobox has had a console-verbosity knob since 0.6.30 (merobox#271): `quiet`
      # keeps the banners and the final pass/fail summary and drops the per-step
      # API-response dumps. Day to day that is what you want; to get the full detail
      # back, re-run the job with "Enable debug logging" and GitHub sets runner.debug,
      # which flips this to `verbose`. No second workflow, no flag to remember.
      #
      # It goes through $GITHUB_ENV rather than a workflow-level `env:` because the
      # `runner` context does not exist at workflow or job level — only inside a step.
      - name: Quiet merobox and its nodes on the happy path
        run: |
          # merobox's own console output.
          echo "MEROBOX_LOG_LEVEL=${{ runner.debug == '1' && 'verbose' || 'quiet' }}" >> "$GITHUB_ENV"
          # RUST_LOG for the merod nodes merobox boots. This has to go on the CLI:
          # `bootstrap run --log-level` defaults to "debug", so the value is never
          # None and merobox's `config.get("log_level")` fallback is unreachable — a
          # `log_level:` key in the workflow YAML is silently ignored.
          echo "MEROD_LOG=${{ runner.debug == '1' && 'debug' || 'info' }}" >> "$GITHUB_ENV"
      # calimero-client-py publishes an sdist and no manylinux wheel, so a cold
      # `pip install` compiles its Rust extension on the runner — 92 seconds of a
      # 134-second step, measured. pip stores wheels it builds itself under
      # ~/.cache/pip/wheels and reuses them, so keying this cache on the exact pins
      # makes every run after the first a few seconds. Bump the key with the pins.
      - name: Cache pip (calimero-client-py builds from source)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-merobox-0.6.55-ccpy-0.6.33
      - name: Install merobox
        run: pip install -q --disable-pip-version-check "merobox==0.6.55" "calimero-client-py==0.6.33"

      - name: Run ${{ matrix.scenario.file }}
        working-directory: workflows
        run: merobox bootstrap run --log-level "$MEROD_LOG" ${{ matrix.scenario.file }}

      # merobox dumps each container's log here on failure; without them a red
      # run tells you only which step failed, not why the node rejected it.
      - name: Upload node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Unique per matrix leg — upload-artifact v4 refuses to merge same-named
          # artifacts across jobs, so a shared name would fail the upload on the
          # second failing scenario and lose exactly the logs we need.
          name: merobox-node-logs-${{ strategy.job-index }}
          path: workflows/data/container-logs/
          if-no-files-found: ignore

      # The capacity ladder's whole output is a measurement, so it has to survive
      # the job even when the job passes. `if: always()` rather than `failure()`
      # for exactly that reason, and `if-no-files-found: ignore` because every
      # other scenario in the matrix writes nothing here.
      - name: Upload capacity-ladder results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-ladder-${{ strategy.job-index }}
          path: data/capacity-ladder/
          if-no-files-found: ignore

      - name: Stop nodes
        if: always()
        run: merobox stop --all || true
