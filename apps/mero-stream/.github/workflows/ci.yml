name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint + typecheck + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm build

  logic:
    name: Logic (contract tests + WASM build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup picks it up automatically.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: logic
      - name: Contract unit tests (native, TestHost — determinism C1..C3)
        run: cargo test
      - name: WASM build
        run: ./build.sh

  # P2: the fragment actually crosses the gossip layer between two real nodes,
  # and the far node's in-WASM decode is proven bit-identical to the input.
  # Validated locally against merod 0.11.0-rc.19 before being enabled here.
  e2e:
    name: E2E (2-node fragment round-trip over merobox)
    runs-on: ubuntu-latest
    needs: logic
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: logic
      # The workflow installs logic/res/mero_stream.wasm into both nodes, so the
      # wasm has to exist before merobox runs.
      - name: Build the contract WASM
        working-directory: logic
        run: ./build.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Floor, not an exact pin: e2e.yml relies on `create_mesh` publishing its
      # default {{context_id}}/{{member_public_key}}/{{public_key}} names and on
      # `result.output` dotted-path extraction. 0.6.49 is the version the
      # scenario was validated against.
      - name: Install merobox
        run: pip install "merobox>=0.6.49"

      - name: 2-node fragment round-trip
        working-directory: workflows
        run: merobox bootstrap run e2e.yml

      # merobox dumps each container's log here on failure; without them a red
      # run tells you only which step failed, not why the node rejected it.
      - name: Upload node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merobox-node-logs
          path: workflows/data/container-logs/
          if-no-files-found: ignore

      - name: Stop nodes
        if: always()
        run: merobox stop --all || true
