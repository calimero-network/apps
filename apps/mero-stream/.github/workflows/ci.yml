name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter, deliberately. Filtering to `[main]` means a stacked PR
  # — one based on another open PR's branch, which is how this work is being
  # reviewed — gets NO checks at all and reports as green-by-absence. Running on
  # every PR base costs one extra run per stack and makes each layer verifiable
  # on its own.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint + typecheck + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Formatting (prettier)
        run: pnpm prettier
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm build

  logic:
    name: Logic (fmt + clippy + contract tests + WASM build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup picks it up automatically.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: logic
      - name: Formatting (rustfmt)
        run: cargo fmt --check
      # -D warnings because a contract's warnings are rarely cosmetic: unused
      # results and lossy casts are how state-handling bugs enter.
      - name: Lints (clippy)
        run: cargo clippy --all-targets -- -D warnings
      - name: Contract unit tests (native, TestHost — determinism C1..C3)
        run: cargo test
      - name: WASM build
        run: ./build.sh

  scripts:
    name: Scripts (load generator syntax + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The load generator is the P3 deliverable's driver and is stdlib-only, so
      # there is nothing to install — but a syntax error in it would only surface
      # at the start of a 30–60 minute measurement run.
      - name: Byte-compile
        run: python3 -m compileall -q scripts/
      # Pinned. An unpinned `pip install ruff` means any ruff release that adds a
      # rule turns a green PR red with no change to this repo — which already
      # happened here: 0.16.1 added PLW1510 and failed a run the local (older)
      # ruff had passed.
      - name: Lint
        run: |
          pip install "ruff==0.16.1"
          ruff check scripts/

  # P2: the fragment actually crosses the gossip layer between real nodes, and the
  # far node's in-WASM decode is proven bit-identical to the input. Every scenario
  # here was validated locally against merod 0.11.0-rc.19 before being enabled.
  #
  # Separate jobs rather than one long workflow: each scenario gets its own
  # runner, so a fan-out failure and a tombstone failure are distinguishable at a
  # glance, and one flaking scenario doesn't mask the others. The port bases in
  # the three files are deliberately distinct anyway, so they also compose if run
  # together locally.
  e2e:
    name: "E2E: ${{ matrix.scenario.name }}"
    runs-on: ubuntu-latest
    needs: logic
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: 2-node bit-identity (C1)
            file: e2e.yml
          - name: pruning + tombstones (C3)
            file: e2e-tombstones.yml
          - name: 3-node gossip fan-out
            file: e2e-fanout.yml
          - name: approach 2 opaque chunks
            file: e2e-live-chunks.yml
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: logic
      # The workflow installs logic/res/mero_stream.wasm into both nodes, so the
      # wasm has to exist before merobox runs.
      - name: Build the contract WASM
        working-directory: logic
        run: ./build.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Floor, not an exact pin: the scenarios rely on `create_mesh` publishing its
      # default {{context_id}}/{{member_public_key}}/{{public_key}} names, on
      # `result.output` dotted-path extraction, and on the `repeat` step. 0.6.49 is
      # the version they were validated against.
      - name: Install merobox
        run: pip install "merobox>=0.6.49"

      - name: Run ${{ matrix.scenario.file }}
        working-directory: workflows
        run: merobox bootstrap run ${{ matrix.scenario.file }}

      # merobox dumps each container's log here on failure; without them a red
      # run tells you only which step failed, not why the node rejected it.
      - name: Upload node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Unique per matrix leg — upload-artifact v4 refuses to merge same-named
          # artifacts across jobs, so a shared name would fail the upload on the
          # second failing scenario and lose exactly the logs we need.
          name: merobox-node-logs-${{ strategy.job-index }}
          path: workflows/data/container-logs/
          if-no-files-found: ignore

      - name: Stop nodes
        if: always()
        run: merobox stop --all || true
