name: Mero Stream — fragment round-trip over Calimero (2-node e2e)
description: >
  DRAFT (Phase P2). Proves approach 3: a node encodes a raw luma frame INSIDE
  the WASM contract, the compressed fragment gossips to a second node, and the
  second node reconstructs the frame in WASM via `get_frame`. The raw pixels are
  a mutation argument on node 1 only — just the compressed fragment crosses the
  wire. Node 2 must decode back to the exact input (determinism, C1).

  This is the skeleton for the §4 instrumentation run; the bootstrap half mirrors
  mero-meet's proven 2-node signaling workflow. Validate locally
  (`make workflows`) before wiring into CI.

force_pull_image: true

nodes:
  chain_id: testnet-1
  count: 2
  image: ghcr.io/calimero-network/merod:0.11.0-rc.9
  prefix: calimero-node
  # Off the default 2428/2528 and off mero-meet's 2740 to avoid collisions.
  base_port: 2760
  base_rpc_port: 2660

steps:
  # ── Bootstrap (install + namespace + invite + context) ─────────────────────
  - name: Install application on Node 1
    type: install_application
    node: calimero-node-1
    path: "../logic/res/mero_stream.wasm"
    dev: true
    outputs:
      app_id: applicationId

  - name: Install application on Node 2
    type: install_application
    node: calimero-node-2
    path: "../logic/res/mero_stream.wasm"
    dev: true

  - name: Create namespace
    type: create_namespace
    node: calimero-node-1
    application_id: "{{app_id}}"
    outputs:
      namespace_id: namespaceId

  - name: Set default member capabilities
    type: set_default_capabilities
    node: calimero-node-1
    group_id: "{{namespace_id}}"
    capabilities: 15

  - name: Generate identity for Node 2
    type: create_identity
    node: calimero-node-2
    outputs:
      bob_identity: publicKey

  - name: Wait for identity propagation
    type: wait
    seconds: 3

  - name: Node 1 creates invitation for Node 2
    type: create_namespace_invitation
    node: calimero-node-1
    group_id: "{{namespace_id}}"
    outputs:
      invite_bob: invitation

  - name: Node 2 joins namespace
    type: join_namespace
    node: calimero-node-2
    group_id: "{{namespace_id}}"
    invitation: "{{invite_bob}}"

  - name: Settle after namespace join
    type: wait
    seconds: 5

  - name: Admin creates the stream context
    type: create_context
    node: calimero-node-1
    application_id: "{{app_id}}"
    group_id: "{{namespace_id}}"
    params: '{"name": "probe"}'
    outputs:
      stream_id: contextId
      alice_key: memberPublicKey

  - name: Force Node 2 to sync namespace state
    type: sync_group
    node: calimero-node-2
    group_id: "{{namespace_id}}"

  - name: Settle after sync
    type: wait
    seconds: 5

  - name: Bob joins the stream context
    type: join_context
    node: calimero-node-2
    context_id: "{{stream_id}}"
    outputs:
      bob_key: memberPublicKey

  - name: Wait for context sync
    type: wait_for_sync
    context_id: "{{stream_id}}"
    nodes: [calimero-node-1, calimero-node-2]
    timeout: 60
    check_interval: 2
    trigger_sync: true

  # ── Membership ───────────────────────────────────────────────────────────
  - name: Alice joins the stream
    type: call
    node: calimero-node-1
    context_id: "{{stream_id}}"
    method: join
    args: { username: "Alice", now: 1751955000 }
    executor_public_key: "{{alice_key}}"

  - name: Bob joins the stream
    type: call
    node: calimero-node-2
    context_id: "{{stream_id}}"
    method: join
    args: { username: "Bob", now: 1751955001 }
    executor_public_key: "{{bob_key}}"

  - name: Sync membership
    type: wait_for_sync
    context_id: "{{stream_id}}"
    nodes: [calimero-node-1, calimero-node-2]
    timeout: 60
    check_interval: 2
    trigger_sync: true

  # ── The probe: encode on node 1, decode on node 2 ─────────────────────────
  # A 4x4 (16-byte) luma frame whose values are all of the form (q<<4)|q, so
  # quantize→reconstruct is the identity and node 2 must decode back to EXACTLY
  # this array (C1). Tiny so it stays inline-writable here.
  - name: Alice encodes a 4x4 frame IN WASM
    type: call
    node: calimero-node-1
    context_id: "{{stream_id}}"
    method: encode_frame
    args:
      raw: [0, 17, 34, 51, 68, 85, 102, 119, 136, 153, 170, 187, 204, 221, 238, 255]
      width: 4
      height: 4
      track: 0
      now: 1751955010
    executor_public_key: "{{alice_key}}"
    outputs:
      frame_seq: output

  - name: Sync the fragment to node 2
    type: wait_for_sync
    context_id: "{{stream_id}}"
    nodes: [calimero-node-1, calimero-node-2]
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Bob reconstructs the frame IN WASM
    type: call
    node: calimero-node-2
    context_id: "{{stream_id}}"
    method: get_frame
    args: { after_seq: 0 }
    executor_public_key: "{{bob_key}}"
    outputs:
      bob_frames: result

  - name: Assert Bob decoded the exact frame node 1 encoded (C1 across the wire)
    type: assert
    statements:
      # The decoded pixels must contain the original luma sequence, proving the
      # in-WASM codec is bit-identical on a second node.
      - 'contains({{bob_frames}}, "255")'
      - 'contains({{bob_frames}}, "17")'

  - name: Bob reads the stream stats (§4 metrics surface)
    type: call
    node: calimero-node-2
    context_id: "{{stream_id}}"
    method: get_stats
    args: {}
    executor_public_key: "{{bob_key}}"
    outputs:
      bob_stats: result

  - name: Assert the fragment is live and counted
    type: assert
    statements:
      - 'contains({{bob_stats}}, "liveFragments")'
