# XcodeGen spec for the native iOS Battleships app.
#
#   brew install xcodegen
#   xcodegen generate          # writes Battleships.xcodeproj (not committed)
#   open Battleships.xcodeproj
#
# The logic (the two generated contract clients, the board and its commit-reveal, the invitation
# codec, the view models) lives in the local BattleshipsCore package, which builds and tests on
# macOS with `swift test --package-path BattleshipsCore`. The swift-sdk is pinned by revision to
# the head of its Calimero 1.0 port (swift-sdk#85, branch feat/calimero-1.0); it moves to the merge
# commit once that lands. Keep it identical to BattleshipsCore/Package.swift.
name: Battleships

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: a1ec644130d4405a1bab7547654b1442cc559b49
  BattleshipsCore:
    path: BattleshipsCore

targets:
  Battleships:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Battleships
        # Figtree, the web app's face (packages/glass; SIL Open Font License, Resources/Fonts/OFL.txt).
        UIAppFonts: [Figtree-Variable.ttf]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          # The node's consent page returns here (`battleships://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.battleships.consent
            CFBundleURLSchemes: [battleships]
          # Invitation deep links: `calimero://com.calimero.battleships/join?invitation=…`.
          - CFBundleURLName: network.calimero.battleships.invite
            CFBundleURLSchemes: [calimero]
        # Which cluster sign-in uses (Calimero 1.0). MeroNodeURL: a node of your Calimero Cloud
        # cluster (from the cloud.calimero.network console); empty = the sign-in screen asks.
        # MeroDevNodeURL: what the "Development node" field starts with (`merod local`'s first
        # node, mock attestation allowed). See ../README.md.
        BattleshipsCallbackScheme: battleships
        MeroNodeURL: ""
        MeroDevNodeURL: "http://localhost:2501"
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # http only to a node on the local network (localhost, *.local, an IP literal).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # A passkey on a real cluster belongs to its relying party (the node's --rp-id). To sign in with
    # the device's passkey there, add an entitlements file with
    # `com.apple.developer.associated-domains: [webcredentials:<rp-id>]` (served
    # apple-app-site-association). A development node uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.battleships
        PRODUCT_NAME: Battleships
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: BattleshipsCore
        product: BattleshipsCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # The demo tour (UITests/TourTests.swift): launches with `-MeroDemo YES` (Debug only) and
  # screenshots every main screen on fixture data.
  BattleshipsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Battleships
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.battleships.uitests
        TEST_TARGET_NAME: Battleships
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  Battleships:
    build:
      targets:
        Battleships: all
    test:
      config: Debug
      targets:
        - BattleshipsUITests
