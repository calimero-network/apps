org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Which Calimero 1.0 cluster sign-in uses. meroCluster: your Calimero Cloud cluster's name (looked
# up in the Calimero directory) or one of its node URLs; empty = the sign-in screen asks.
# meroDevNodeUrl: what the "Development node" field starts with (`merod local` from the emulator).
# Override per build: ./gradlew assembleDebug -PmeroCluster=eu-shared-1
meroCluster=
meroDevNodeUrl=http://10.0.2.2:2501
# Where the node's consent page sends the person back. Its scheme and host are also the
# manifest's intent filter.
meroConsentCallback=battleships://consent
