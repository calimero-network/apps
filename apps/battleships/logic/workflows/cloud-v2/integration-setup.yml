# Ported from integration-setup.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: Battleships Integration Setup — Namespace + Lobby + Two Members
description: 'Slim merobox setup for Playwright integration tests. Brings up two nodes, installs the battleships
  app, creates a namespace and lobby context on node-1, and joins node-2 via a namespace invitation. Stops
  short of match creation — Playwright drives matches and gameplay through the UI.

  stop_all_nodes: false keeps the merod containers alive after merobox exits so the Playwright job can
  reach the admin/RPC API on each node.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3010
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install application on calimero-node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/battleships.wasm'
  outputs:
    app_id: hash
  account: calimero-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Namespace on Node 1
  type: create_org
  org_name: Create Namespace on Node 1
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Create Lobby Context in Namespace
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/battleships.wasm'
  app_name: lobby
  org: '{{namespace_id}}'
  outputs:
    lobby_ctx_id: contextId
    p1_key: memberPublicKey
- name: Assert Lobby Context Created
  type: assert
  statements:
  - is_set({{lobby_ctx_id}})
  - is_set({{p1_key}})
- name: Create Namespace Invitation
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invitation: token
- name: Wait for Namespace Gossip Propagation
  type: wait
  seconds: 1.0
  message: Waiting for namespace gossip to reach node 2
- name: Settle before the namespace join (cold-join KeyDelivery)
  type: wait
  seconds: 1.0
- name: Node 2 Joins Namespace
  type: redeem_invite
  token: '{{invitation}}'
  account: calimero-node-2
- type: whoami
  account: calimero-node-2
  outputs:
    p2_identity: publicKey
- name: Node 2 Joins Lobby Context
  type: whoami
  account: calimero-node-2
  outputs:
    p2_key: publicKey
- type: set
  values:
    lobby_ctx_id_node2: '{{lobby_ctx_id}}'
- name: Assert Node 2 Joined
  type: assert
  statements:
  - is_set({{p2_key}})
  - is_set({{p2_identity}})
