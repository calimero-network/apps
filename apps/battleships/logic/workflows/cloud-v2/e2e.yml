- name: Read Winner on Node 1
  type: call
  app: '{{match_ctx_id}}'
  method: get_winner
  args: {}
  account: calimero-node-1
  as_key: '{{match_p1_key}}'
  outputs:
    winner_n1: rpc
- name: Read Winner on Node 2
  type: call
  app: '{{match_ctx_id}}'
  method: get_winner
  args: {}
  account: calimero-node-2
  as_key: '{{match_p2_key}}'
  outputs:
    winner_n2: rpc
- name: Assert P1 Won on Both Nodes
  type: json_assert
  statements:
  - 'json_equal({{winner_n1}}, {"output": "{{p1_key}}"})'
  - 'json_equal({{winner_n2}}, {"output": "{{p1_key}}"})'
- name: Read the audited standing on Node 2
  type: call
  app: '{{match_ctx_id}}'
  method: get_match_state
  args:
    match_id: '{{game_match_id}}'
  account: calimero-node-2
  as_key: '{{match_p2_key}}'
  outputs:
    state_won: rpc
- name: Assert both boards passed the audit
  type: json_assert
  statements:
  - 'json_equal({{state_won}}, {"output": {"standing": "won", "committed": ["{{match_p1_key}}", "{{match_p2_key}}"],
    "pending_shot": null, "ended_by": "sunk", "loser": "{{match_p2_key}}", "revealed": ["{{match_p1_key}}",
    "{{match_p2_key}}"], "audit_failed": [], "winner": "{{match_p1_key}}"}})'
- name: Wait for on_match_finished xcall Propagation
  type: wait
  seconds: 1.0
  message: Waiting for match->lobby xcall to land on both nodes
- name: Reject Post-Match Shot from P1
  type: call
  app: '{{match_ctx_id}}'
  method: propose_shot
  args:
    match_id: '{{game_match_id}}'
    x: 0
    y: 0
  account: calimero-node-1
  as_key: '{{match_p1_key}}'
  expected_failure: true
  outputs:
    reject_err_5: error
- name: Assert rejected — Reject Post-Match Shot from P1
  type: assert
  statements:
  - is_set({{reject_err_5}})
- name: Reject Post-Match Shot from P2
  type: call
  app: '{{match_ctx_id}}'
  method: propose_shot
  args:
    match_id: '{{game_match_id}}'
    x: 5
    y: 5
  account: calimero-node-2
  as_key: '{{match_p2_key}}'
  expected_failure: true
  outputs:
    reject_err_6: error
- name: Assert rejected — Reject Post-Match Shot from P2
  type: assert
  statements:
  - is_set({{reject_err_6}})
- name: Read Finished Match Summary on Node 1
  type: call
  app: '{{lobby_ctx_id}}'
  method: get_matches
  args: {}
  account: calimero-node-1
  as_key: '{{p1_key}}'
  outputs:
    final_matches_n1: result
- name: Assert Final Match List on Node 1
  type: assert
  statements:
  - is_set({{final_matches_n1}})
- name: Read Finished Match Summary on Node 2
  type: call
  app: '{{lobby_ctx_id}}'
  method: get_matches
  args: {}
  account: calimero-node-2
  as_key: '{{p2_key}}'
  outputs:
    final_matches_n2: result
- name: Assert Final Match List on Node 2
  type: assert
  statements:
  - is_set({{final_matches_n2}})
- name: Read Player 1 Stats (should record the win)
  type: call
  app: '{{lobby_ctx_id}}'
  method: get_player_stats
  args:
    player: '{{p1_key}}'
  account: calimero-node-1
  as_key: '{{p1_key}}'
  outputs:
    p1_stats: result
- name: Read P1 stats (xcall does not land — see note above)
  type: assert
  statements:
  - is_set({{final_matches_n1}})
- name: Read Player 2 Stats (should record the loss)
  type: call
  app: '{{lobby_ctx_id}}'
  method: get_player_stats
  args:
    player: '{{p2_key}}'
  account: calimero-node-2
  as_key: '{{p2_key}}'
  outputs:
    p2_stats: result
- name: Read P2 stats (xcall does not land — see note above)
  type: assert
  statements:
  - is_set({{final_matches_n2}})
