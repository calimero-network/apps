  account: calimero-node-1
  as_key: '{{match_p1_key}}'
  expected_failure: true
  outputs:
    reveal_err: error
- name: Assert rejected — Reject Mid-Game Reveal by P1
  type: assert
  statements:
  - is_set({{reveal_err}})
- name: Reject Re-Link of Active Match
  type: call
  app: '{{lobby_ctx_id}}'
  method: set_match_context_id
  args:
    match_id: '{{match_id}}'
    context_id: '{{match_ctx_id}}'
  account: calimero-node-1
  as_key: '{{p1_key}}'
  expected_failure: true
  outputs:
    reject_err_4: error
- name: Assert rejected — Reject Re-Link of Active Match
  type: assert
  statements:
  - is_set({{reject_err_4}})
- name: Verify Match List on Node 1 (Lobby)
  type: call
  app: '{{lobby_ctx_id}}'
  method: get_matches
  args: {}
  account: calimero-node-1
  as_key: '{{p1_key}}'
  outputs:
    matches_n1: result
- name: Verify Match List on Node 2 (Lobby)
  type: call
  app: '{{lobby_ctx_id}}'
  method: get_matches
  args: {}
  account: calimero-node-2
  as_key: '{{p2_key}}'
  outputs:
    matches_n2: result
- name: Assert Matches Exist on Both Nodes
  type: assert
  statements:
  - is_set({{matches_n1}})
  - is_set({{matches_n2}})
- name: Turn 2 — P2 shot (0,0) [hit on P1 destroyer]
  type: call
  app: '{{match_ctx_id}}'
  method: propose_shot
  args:
    match_id: '{{game_match_id}}'
    x: 0
    y: 0
  account: calimero-node-2
  as_key: '{{match_p2_key}}'
- name: Turn 2 — P1 answers hit
  type: call
  app: '{{match_ctx_id}}'
  method: acknowledge_shot
  args:
    match_id: '{{game_match_id}}'
    shot_id: 1
    hit: true
  account: calimero-node-1
  as_key: '{{match_p1_key}}'
  outputs:
    answer_2: rpc
- name: Assert turn 2 answer
  type: json_assert
  statements:
  - 'json_equal({{answer_2}}, {"output": "hit"})'
- name: Turn 3 — P1 shot (9,0) [hit, sinks P2 destroyer]
  type: call
  app: '{{match_ctx_id}}'
  method: propose_shot
  args:
    match_id: '{{game_match_id}}'
    x: 9
    y: 0
  account: calimero-node-1
  as_key: '{{match_p1_key}}'
- name: Turn 3 — P2 answers hit
  type: call
  app: '{{match_ctx_id}}'
  method: acknowledge_shot
  args:
    match_id: '{{game_match_id}}'
    shot_id: 2
    hit: true
  account: calimero-node-2
  as_key: '{{match_p2_key}}'
  outputs:
    answer_3: rpc
- name: Assert turn 3 answer
  type: json_assert
  statements:
  - 'json_equal({{answer_3}}, {"output": "hit"})'
- name: Turn 4 — P2 shot (1,0) [hit, sinks P1 destroyer]
  type: call
  app: '{{match_ctx_id}}'
  method: propose_shot
  args:
    match_id: '{{game_match_id}}'
    x: 1
    y: 0
  account: calimero-node-2
  as_key: '{{match_p2_key}}'
- name: Turn 4 — P1 answers hit
  type: call
  app: '{{match_ctx_id}}'
  method: acknowledge_shot
  args:
    match_id: '{{game_match_id}}'
    shot_id: 3
    hit: true
  account: calimero-node-1
  as_key: '{{match_p1_key}}'
  outputs:
    answer_4: rpc
- name: Assert turn 4 answer
  type: json_assert
  statements:
  - 'json_equal({{answer_4}}, {"output": "hit"})'
- name: Turn 5 — P1 shot (5,8) [hit on carrier, jumps rows]
  type: call
  app: '{{match_ctx_id}}'
  method: propose_shot
  args:
    match_id: '{{game_match_id}}'
    x: 5
    y: 8
  account: calimero-node-1
  as_key: '{{match_p1_key}}'
- name: Turn 5 — P2 answers hit
  type: call
  app: '{{match_ctx_id}}'
  method: acknowledge_shot
  args:
    match_id: '{{game_match_id}}'
    shot_id: 4
    hit: true
  account: calimero-node-2
  as_key: '{{match_p2_key}}'
  outputs:
    answer_5: rpc
- name: Assert turn 5 answer
  type: json_assert
  statements:
  - 'json_equal({{answer_5}}, {"output": "hit"})'
- name: Turn 6 — P2 shot (5,5) [miss]
  type: call
  app: '{{match_ctx_id}}'
  method: propose_shot
  args:
    match_id: '{{game_match_id}}'
    x: 5
    y: 5
  account: calimero-node-2
  as_key: '{{match_p2_key}}'
- name: Turn 6 — P1 answers miss
  type: call
  app: '{{match_ctx_id}}'
  method: acknowledge_shot
  args:
    match_id: '{{game_match_id}}'
    shot_id: 5
    hit: false
  account: calimero-node-1
  as_key: '{{match_p1_key}}'
  outputs:
    answer_6: rpc
- name: Assert turn 6 answer
  type: json_assert
  statements:
  - 'json_equal({{answer_6}}, {"output": "miss"})'
- name: Turn 7 — P1 shot (7,2) [hit on P2 cruiser]
  type: call
  app: '{{match_ctx_id}}'
  method: propose_shot
  args:
    match_id: '{{game_match_id}}'
    x: 7
    y: 2
  account: calimero-node-1
  as_key: '{{match_p1_key}}'
- name: Turn 7 — P2 answers hit
  type: call
  app: '{{match_ctx_id}}'
  method: acknowledge_shot
  args:
    match_id: '{{game_match_id}}'
    shot_id: 6
    hit: true
  account: calimero-node-2
  as_key: '{{match_p2_key}}'
  outputs:
    answer_7: rpc
- name: Assert turn 7 answer
  type: json_assert
  statements:
  - 'json_equal({{answer_7}}, {"output": "hit"})'
- name: Turn 8 — P2 shot (0,2) [hit on P1 cruiser]
