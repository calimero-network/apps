  - name: Verify Match List on Node 2 (Lobby)
    type: call
    node: calimero-node-2
    context_id: '{{lobby_ctx_id}}'
    method: get_matches
    executor_public_key: '{{p2_key}}'
    outputs:
      matches_n2: result.output

  - name: Assert Matches Exist on Both Nodes
    type: assert
    statements:
      - 'is_set({{matches_n1}})'
      - 'is_set({{matches_n2}})'

  # ============================================================
  # Phase F: Complete the Game — 32 more turns, each shot answered
  # ============================================================
  # The same 33-turn script as app/e2e/match.spec.ts. Every shot is followed
  # by the defender's `acknowledge_shot` (what the client does automatically
  # from the board on its device) and a sync, because each answer flips the
  # turn and the next propose_shot is refused on stale state.
  #   - P1 needs 17 hits on P2 ship cells to win; turn 1 was the first.
  #   - P2 takes 16 shots between P1's: 12 hits and 4 misses on varied cells,
  #     so P1 still has ≥ 1 unhit cell when the match ends.

  - name: Turn 2 — P2 shot (0,0) [hit on P1 destroyer]
    type: call
    node: calimero-node-2
    context_id: '{{match_ctx_id}}'
    method: propose_shot
    executor_public_key: '{{match_p2_key}}'
    args: { match_id: '{{game_match_id}}', x: 0, y: 0 }

  - name: Sync turn 2 shot
    type: wait_for_sync
    nodes: [calimero-node-1, calimero-node-2]
    context_id: '{{match_ctx_id}}'
    timeout: 30

  # The defender's client answers from the board on its device: here the
  # answer is scripted from the fleet above, and `shot_id` is the turn index
  # the pending shot carries in `get_match_state`.
  - name: Turn 2 — P1 answers hit
    type: call
    node: calimero-node-1
    context_id: '{{match_ctx_id}}'
    method: acknowledge_shot
    executor_public_key: '{{match_p1_key}}'
    args: { match_id: '{{game_match_id}}', shot_id: 1, hit: true }
    outputs:
      answer_2: result

  - name: Assert turn 2 answer
    type: json_assert
    statements:
      - 'json_equal({{answer_2}}, {"output": "hit"})'

  - name: Sync turn 2 answer
