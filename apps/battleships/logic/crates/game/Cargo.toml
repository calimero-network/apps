[package]
name    = "battleships-game"
version = "0.3.2"
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# No [package.metadata.calimero]: this is the SECOND service of the battleships
# bundle, declared in ../../Cargo.toml's services list. check-app-metadata.sh only
# requires the table for a manifest at `apps/*/logic/Cargo.toml`.
[dependencies]
battleships-types       = { path = "../types" }
calimero-sdk            = { workspace = true }
calimero-storage        = { workspace = true }
calimero-storage-macros = { workspace = true }
# `hex`, not `bs58`: core rc.27 removed base58 from ids entirely.
hex                     = { workspace = true }
sha2                    = { workspace = true }
