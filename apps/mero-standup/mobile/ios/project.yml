# XcodeGen spec for the native iOS Mero Standup app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroStandup.xcodeproj (not committed)
#   open MeroStandup.xcodeproj
#
# Everything that is not a view (the generated contract client, the helpers and
# the view models) is the local Swift package in Core/, tested with
# `swift test` on macOS. The swift-sdk is pinned by revision to the head of its
# Calimero 1.0 port (calimero-network/swift-sdk#85, branch feat/calimero-1.0);
# it moves to the merge commit once that lands. Keep it equal to the revision
# in Core/Package.swift.
name: MeroStandup

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 35148e4de782c065f777e80c592d9548acd645cd
  StandupCore:
    path: Core

targets:
  MeroStandup:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Standup
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          # The node's consent page returns here after an approval
          # (`mero-standup://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.standup.consent
            CFBundleURLSchemes: [mero-standup]
          # Invitation deep links: `calimero://com.calimero.mero-standup/join?invitation=…`.
          - CFBundleURLName: network.calimero.standup.invite
            CFBundleURLSchemes: [calimero]
        # The consent page's return. An https host (Associated Domains, iOS
        # 17.4+) replaces the scheme when set.
        StandupCallbackScheme: mero-standup
        StandupCallbackHost: ""
        StandupCallbackPath: /consent
        # The Calimero Cloud cluster to sign in to: a node URL from the
        # console. Empty: the sign-in screen asks for one. See README.md.
        CalimeroClusterURL: ""
        # The development cluster (`merod local`) the sign-in screen prefills.
        DefaultNodeURL: "http://localhost:2501"
        # The Mero Standup version new teams run. Empty: the latest.
        MeroPackageVersion: ""
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # Plain http only to a node on the local network (merod local --dev);
        # everything else stays https under ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Signing in with the device's passkey on a real cluster needs the
    # cluster's relying party as an associated domain: add an entitlements
    # file with `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`.
    # A development cluster uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.standup
        PRODUCT_NAME: MeroStandup
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: StandupCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # The scripted demo tour (`-MeroDemo YES`): screenshots + screen recording.
  # Run with apps-capture's ios-capture.sh, or Cmd-U on the MeroStandup scheme.
  MeroStandupUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MeroStandup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.standup.uitests
        TEST_TARGET_NAME: MeroStandup
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  MeroStandup:
    build:
      targets:
        MeroStandup: all
    test:
      config: Debug
      targets:
        - MeroStandupUITests
