# XcodeGen spec for the native iOS Mero Standup app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroStandup.xcodeproj (not committed)
#   open MeroStandup.xcodeproj
#
# Everything that is not a view (the generated contract client, the helpers and
# the view models) is the local Swift package in Core/, tested with
# `swift test` on macOS. The swift-sdk is pinned by revision to the `main` merge
# commit of PR #84. Keep it equal to the revision in Core/Package.swift.
name: MeroStandup

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: c9ca1a06ea3b04c24d943cbb0e1d9b30eb4c5a8f
  StandupCore:
    path: Core

targets:
  MeroStandup:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Standup
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          # The wallet returns here after Cloud sign-in (`mero-standup://enrol#credential=…`).
          - CFBundleURLName: network.calimero.standup.enrol
            CFBundleURLSchemes: [mero-standup]
          # Invitation deep links: `calimero://com.calimero.mero-standup/join?invitation=…`.
          - CFBundleURLName: network.calimero.standup.invite
            CFBundleURLSchemes: [calimero]
        # Where sign-in goes. Empty = the SDK's defaults (the hosted Calimero
        # wallet, Cloud manager and registry). See README.md.
        StandupCallbackScheme: mero-standup
        StandupCallbackHost: ""
        StandupCallbackPath: /enrol
        MeroCloudBaseURL: ""
        MeroWalletURL: ""
        MeroRegistryURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.standup
        PRODUCT_NAME: MeroStandup
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: StandupCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # The scripted demo tour (`-MeroDemo YES`): screenshots + screen recording.
  # Run with apps-capture's ios-capture.sh, or Cmd-U on the MeroStandup scheme.
  MeroStandupUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MeroStandup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.standup.uitests
        TEST_TARGET_NAME: MeroStandup
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  MeroStandup:
    build:
      targets:
        MeroStandup: all
    test:
      config: Debug
      targets:
        - MeroStandupUITests
