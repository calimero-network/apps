[package]
# Directory == cargo package == npm package, which publish-bundle.yml relies on
# (it uses one value as both `apps/$APP/logic` and `pnpm -F $APP`).
name        = "mero-standup"
description = "Async standups and a decision log for a small team, replicated between its members' own nodes"
version     = "0.1.0"
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
publish = false

[lib]
# `rlib` beside cdylib so the TestHost tests in src/tests.rs can link the crate.
crate-type = ["cdylib", "rlib"]

# Read by `cargo mero build` / `cargo mero bundle`. `appVersion` is absent on
# purpose: the release workflow resolves it from the registry.
#
# None of this can be inherited from the workspace (`[package.metadata]` is not
# on cargo's inheritable list); scripts/check-app-metadata.sh asserts the
# fleet-wide values match `[workspace.metadata.mero-apps]` instead.
[package.metadata.calimero]
package     = "com.calimero.mero-standup"
name        = "Mero Standup"
description = "Async standups and a decision log for a small team: post what you did, what is next and what blocks you, and record what the team decided and why. Replicated between the members' own nodes."
author      = "Calimero"
# The slug IS the package id: a deep link resolves by `Application.package`.
slug        = "com.calimero.mero-standup"
# A real icon, not cargo-mero's "default" placeholder (check-app-icons.py).
# Regenerate with `node app/scripts/gen-icons.mjs`.
icon        = "../app/public/icon-512.png"
category    = "productivity"
tags        = ["standup", "decisions", "team", "productivity"]
github      = "https://github.com/calimero-network/apps"
# Asserted equal to [workspace.metadata.mero-apps] in CI.
min-runtime-version = "0.12.0-rc.2"
# The registered login callback origin, compared by EXACT origin, so no
# trailing slash. ⚠️ Resolves to nothing until the Vercel project exists:
# Root Directory `apps/mero-standup/app`, project named `mero-standup`.
frontend    = "https://mero-standup.vercel.app"

# ⚠️ Keep the dependency tables AFTER the calimero table: the landing generator
# reads that table up to the next `[` header and finds nothing at end of file.
[dependencies]
calimero-sdk            = { workspace = true }
calimero-storage        = { workspace = true }
calimero-storage-macros = { workspace = true }
# Decision ids are 16 random bytes from the host, rendered as hex.
hex                     = { workspace = true }

[dev-dependencies]
# The native mock host, so TestHost can drive real CRDT state under cargo test.
calimero-storage = { workspace = true, features = ["testing"] }

# NOTE: no [profile.*] — cargo ignores profiles in a workspace member and
# `cargo mero build` then fails with `profile 'app-release' is not defined`.

# `cargo mero` sets `calimero_abi` when it extracts the ABI; src/tests.rs keeps
# the v1 migration tests out of that build.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(calimero_abi)"] }
