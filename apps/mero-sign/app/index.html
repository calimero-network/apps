<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>Mero Sign</title>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Theme before first paint: light unless the person picked dark
         (src/theme.ts owns the key and does the same at runtime). -->
    <script>
      (function () {
        var dark = false;
        try {
          dark = localStorage.getItem('mero-sign:theme') === 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#0b0e18');
        }
      })();
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
