# Ported from bootstrap.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   invite_open x1: v1 open invitations
#   join_open x1: v1 open invitations
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: MeroSign Bootstrap Workflow
description: Bootstrap workflow for MeroSign e-signature platform
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3470
accounts:
- merosign-node-1
- merosign-node-2
steps:
- name: Install MeroSign Application on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_sign.wasm'
  outputs:
    app_id: hash
  account: merosign-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Identity on Node 1
  type: whoami
  account: merosign-node-1
  outputs:
    node1_public_key: publicKey
- name: Create Identity on Node 2
  type: whoami
  account: merosign-node-2
  outputs:
    node2_public_key: publicKey
- name: Wait for Identity Creation
  type: wait
  seconds: 1.0
- name: Create Default Context on Node 1
  type: deploy
  account: merosign-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_sign.wasm'
  app_name: Create Default Context on Node 1
  init_args: '{"is_private": true, "context_name": "default"}'
  access:
    kind: accounts
    accounts:
    - merosign-node-1
    - merosign-node-2
  outputs:
    default_context_id: contextId
    admin_public_key: memberPublicKey
- name: Create Default Context on Node 2
  type: deploy
  account: merosign-node-2
  wasm: '{{env.APPS_WASM_DIR}}/mero_sign.wasm'
  app_name: Create Default Context on Node 2
  init_args: '{"is_private": true, "context_name": "default"}'
  access:
    kind: accounts
    accounts:
    - merosign-node-1
    - merosign-node-2
- name: Wait for Default Context Sync
  type: wait
  seconds: 1.0
- name: Create Agreement Context from Node 1
  type: deploy
  account: merosign-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_sign.wasm'
  app_name: Create Agreement Context from Node 1
  init_args: '{"is_private": false, "context_name": "contract_agreement_001"}'
  access:
    kind: accounts
    accounts:
    - merosign-node-1
    - merosign-node-2
  outputs:
    agreement_context_id: contextId
    agreement_admin_key: memberPublicKey
- name: Add Node 2 as Participant with Sign Permission
  type: call
  app: '{{agreement_context_id}}'
  method: add_participant
  args:
    user_id_str: '{{node2_public_key}}'
    permission: Sign
  account: merosign-node-1
  as_key: '{{agreement_admin_key}}'
- name: List Participants from Node 2
  type: call
  app: '{{agreement_context_id}}'
  method: list_participants
  args: {}
  account: merosign-node-2
  as_key: '{{node2_public_key}}'
- name: Get Context Details from Node 1
  type: call
  app: '{{agreement_context_id}}'
  method: get_context_details
  args:
    context_id_str: '{{agreement_context_id}}'
  account: merosign-node-1
  as_key: '{{agreement_admin_key}}'
