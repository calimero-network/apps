org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Which Calimero 1.0 cluster sign-in offers. meroCluster: your Calimero Cloud cluster's name (its
# nodes come from the node directory) or a node URL; empty = the sign-in screen asks.
# meroDevNodeUrl: what the "Development node" field starts with (`merod local` from the emulator).
meroCluster=
meroDevNodeUrl=http://10.0.2.2:2501
# Where the node's consent page sends the person back after an approval. Its scheme and host are
# also the manifest's intent filter.
meroConsentCallback=mero-sign://consent
