# XcodeGen spec for the native iOS Mero Sign app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroSign.xcodeproj (not committed)
#   open MeroSign.xcodeproj
#
# The logic (generated contract client, private store and identity mapping,
# PDF stamping, signature ink, view models) lives in the local SignCore
# package, which builds and tests on macOS with `swift test --package-path SignCore`.
# The swift-sdk is pinned by revision to the head of its Calimero 1.0 branch
# (swift-sdk#85, `feat/calimero-1.0`); the pin moves to that PR's merge commit
# once it lands. Keep it identical to SignCore/Package.swift (and Package.resolved).
name: MeroSign

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 35148e4de782c065f777e80c592d9548acd645cd
  SignCore:
    path: SignCore

targets:
  MeroSign:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Sign
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          # The node's consent page returns here (`mero-sign://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.sign.consent
            CFBundleURLSchemes: [mero-sign]
          # Invitation deep links: `calimero://com.calimero.mero-sign/join?invitation=…`.
          - CFBundleURLName: network.calimero.sign.invite
            CFBundleURLSchemes: [calimero]
        # The Calimero 1.0 cluster. MeroNodeURL: a node from Calimero Cloud's
        # console (empty = sign-in asks for one); MeroNodes: the cluster's other
        # nodes, comma-separated, for failover; MeroAllowMock: YES only for a
        # `merod local` cluster (mock attestation). See ../README.md.
        MeroNodeURL: ""
        MeroNodes: ""
        MeroAllowMock: "NO"
        MeroPackageVersion: ""
        # Where the node's consent page returns to.
        MeroSignCallbackScheme: mero-sign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.sign
        PRODUCT_NAME: MeroSign
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: SignCore
        product: SignCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI
      - sdk: PDFKit.framework

schemes:
  MeroSign:
    build:
      targets:
        MeroSign: all
