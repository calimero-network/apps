# XcodeGen spec for the native iOS Hyperfeed Sign app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroSign.xcodeproj (not committed)
#   open MeroSign.xcodeproj
#
# The logic (generated contract client, private store and identity mapping, PDF stamping,
# signature ink, view models) lives in the local SignCore package, which builds and tests on
# macOS with `swift test --package-path SignCore`. The Swift SDK (MeroKit, from
# calimero-network/core) is pinned to a core release (Calimero 1.0); bump `exactVersion` for a
# new release. Keep it identical to SignCore/Package.swift (and Package.resolved).
name: MeroSign

# Staging: a Debug build that reaches Calimero Cloud's staging and trusts its
# debug node images (MeroKit's CloudEnvironment.staging), through the
# MERO_STAGING compilation condition, which only this configuration sets.
# Release, the build people install from the App Store, is always production.
configs:
  Debug: debug
  Staging: debug
  Release: release

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/core
    exactVersion: 1.0.0-rc.38
  SignCore:
    path: SignCore

targets:
  MeroSign:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Hyperfeed Sign
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          # The node's consent page returns here (`mero-sign://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.sign.consent
            CFBundleURLSchemes: [mero-sign]
          # Invitation deep links: `calimero://com.calimero.mero-sign/join?invitation=…`.
          - CFBundleURLName: network.calimero.sign.invite
            CFBundleURLSchemes: [calimero]
        # The Calimero 1.0 cluster. MeroNodeURL: a node from Calimero Cloud's
        # console (empty = sign-in asks for one); MeroNodes: the cluster's other
        # nodes, comma-separated, for failover; MeroAllowMock: YES only for a
        # `merod local` cluster (mock attestation). See ../README.md.
        MeroNodeURL: ""
        MeroNodes: ""
        MeroAllowMock: "NO"
        MeroPackageVersion: ""
        # Where the node's consent page returns to.
        MeroSignCallbackScheme: mero-sign
    settings:
      configs:
        Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MERO_STAGING"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.sign
        PRODUCT_NAME: MeroSign
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: SignCore
        product: SignCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI
      - sdk: PDFKit.framework

schemes:
  # Runs the Staging configuration: Calimero Cloud's staging (see `configs`).
  MeroSign Staging:
    build:
      targets:
        MeroSign: all
    run:
      config: Staging

  MeroSign:
    build:
      targets:
        MeroSign: all
