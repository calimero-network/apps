name: Server - Tests, Lint & Format

# Runs tests, ESLint, and Prettier checks for sync-test-server.

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths:
      - "sync-test-server/**"
      - ".github/workflows/server-tests-lint.yml"

  pull_request:
    branches: [main, master]
    paths:
      - "sync-test-server/**"
      - ".github/workflows/server-tests-lint.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint:
    name: Test, Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sync-test-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync-test-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
