name: Fuzzy Benchmark - Long Running Load Test

# Runs a fuzzy load test against the scaffolding-e2e app covering all CRDT
# types, handlers, user storage, and sync-time verification. Separate from
# the correctness e2e-merobox.yml workflow — this one runs long to surface
# race conditions, sync latency regressions, and memory growth.

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths:
      - "logic/**"
      - ".github/workflows/fuzzy-benchmark.yml"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      duration_override:
        description: "Override test duration in minutes. Empty = default (15 normally, 60 for nightly)."
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: logic -> logic/target

      # build.sh is a wrapper around `cargo mero build` now — it also emits the
      # ABI, which used to come from a build.rs that re-parsed the source.
      - name: Setup cargo-mero
        uses: ./.github/actions/install-cargo-mero

      - name: Build WASM
        run: |
          cd logic
          ./build.sh

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuzzy-benchmark-wasm
          path: logic/res/scaffolding_e2e.wasm
          retention-days: 1

  fuzzy-test:
    name: Run Fuzzy Load Test
    needs: build-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: fuzzy-benchmark-wasm
          path: logic/res

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # From PyPI — the old apt repo at calimero-network.github.io/merobox no
      # longer serves a Release file. See e2e-merobox.yml.
      - name: Install merobox
        run: pip install "merobox>=0.6.49" && merobox --version

      - name: Pull merod image
        run: docker pull ghcr.io/calimero-network/merod:0.11.0-rc.20

      - name: Override test duration
        run: |
          if [ -n "${{ github.event.inputs.duration_override }}" ]; then
            DURATION="${{ github.event.inputs.duration_override }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            DURATION="60"
          else
            DURATION="15"
          fi
          echo "Using duration: ${DURATION} minutes (trigger: ${{ github.event_name }})"
          cd logic
          sed -i "s/\(duration_minutes: \)[0-9]*/\1$DURATION/" workflows/fuzzy-test.yml

      - name: Create log directories
        run: mkdir -p fuzzy-test-logs/docker-logs

      - name: Run fuzzy load test
        id: fuzzy-test
        run: |
          LOGDIR="$GITHUB_WORKSPACE/fuzzy-test-logs/docker-logs"
          WATCHER_STATE_DIR="$(mktemp -d)"
          (
            while [ ! -f "$WATCHER_STATE_DIR/stop" ]; do
              for c in $(docker ps --filter "label=calimero.node=true" \
                                   --format "{{.Names}}" 2>/dev/null \
                         | grep -v -- '-init$' || true); do
                mark="$WATCHER_STATE_DIR/${c}"
                if [ ! -f "$mark" ]; then
                  touch "$mark"
                  echo "[log-watcher] following $c"
                  docker logs -f --timestamps "$c" \
                    > "$LOGDIR/${c}.log" 2>&1 &
                fi
              done
              sleep 1
            done
          ) &
          WATCHER_PID=$!

          sudo rm -rf logic/data/ || true

          set +e
          set -o pipefail
          cd logic
          merobox bootstrap run \
              workflows/fuzzy-test.yml \
              --e2e-mode \
              --verbose 2>&1 | tee ../fuzzy-test-logs/merobox-output.log

          exit_code=$?
          set +o pipefail

          touch "$WATCHER_STATE_DIR/stop"
          sleep 2
          kill "$WATCHER_PID" 2>/dev/null || true
          for pid in $(jobs -p); do kill "$pid" 2>/dev/null || true; done
          wait 2>/dev/null || true

          merobox stop --all || true
          merobox nuke --force || true
          sudo rm -rf logic/data/ || true

          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzy-benchmark-logs-${{ github.run_number }}-${{ github.run_id }}
          path: fuzzy-test-logs/
          retention-days: 14
          compression-level: 6

      - name: Write summary
        if: always()
        run: |
          if [ -n "${{ github.event.inputs.duration_override }}" ]; then
            RUN_KIND="Manual override (${{ github.event.inputs.duration_override }} min)"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            RUN_KIND="Nightly soak (60 min)"
          else
            RUN_KIND="Routine (15 min)"
          fi
          echo "## Fuzzy Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run kind:** ${RUN_KIND}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.fuzzy-test.outputs.exit_code }}" = "0" ]; then
            echo "**Result: PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result: FAILED** (exit code: ${{ steps.fuzzy-test.outputs.exit_code }})" >> $GITHUB_STEP_SUMMARY
          fi
