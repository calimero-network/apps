name: E2E - Merobox Workflows

# Runs all merobox workflow tests against the scaffolding-e2e WASM app.
# Build: WASM compiled from Rust source, then all workflows run in parallel.
# Uses ghcr.io/calimero-network/merod:0.11.0-rc.24 — pinned RC for reproducibility.

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths:
      - "logic/**"
      - ".github/workflows/e2e-merobox.yml"

  pull_request:
    branches: [main, master]
    paths:
      - "logic/**"
      - ".github/workflows/e2e-merobox.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Build WASM app ────────────────────────────────────────────────────────────
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: logic -> logic/target

      # build.sh is a wrapper around `cargo mero build` now — it also emits the
      # ABI, which used to come from a build.rs that re-parsed the source.
      - name: Setup cargo-mero
        uses: ./.github/actions/install-cargo-mero

      - name: Build WASM
        run: |
          cd logic
          ./build.sh

      - name: Build multi-service bundle
        run: |
          cd logic
          ./build-multi-service-bundle.sh

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: scaffolding-e2e-wasm
          path: |
            logic/res/scaffolding_e2e.wasm
            logic/res/abi.json
            logic/res/state-schema.json
            logic/res/*.mpk
          retention-days: 1

  # ── Test: run each workflow in parallel ───────────────────────────────────────
  test:
    name: Test (${{ matrix.workflow }})
    needs: build-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - workflow: e2e
            file: workflows/e2e.yml
          - workflow: groups
            file: workflows/groups.yml
          - workflow: group-3node
            file: workflows/group-3node.yml
          - workflow: group-context-isolation
            file: workflows/group-context-isolation.yml
          - workflow: group-late-joiner
            file: workflows/group-late-joiner.yml
          - workflow: group-membership
            file: workflows/group-membership.yml
          - workflow: group-multi-service
            file: workflows/group-multi-service.yml
          - workflow: group-subgroup
            file: workflows/group-subgroup.yml
          - workflow: group-subgroup-cold-sync
            file: workflows/group-subgroup-cold-sync.yml
          - workflow: group-capabilities
            file: workflows/group-capabilities.yml
          - workflow: group-nesting
            file: workflows/group-nesting.yml
          - workflow: handler-test
            file: workflows/handler-test.yml
          - workflow: simple-sync
            file: workflows/simple-sync.yml
          - workflow: authored-shared
            file: workflows/authored-shared.yml
          - workflow: workspace-registry
            file: workflows/workspace-registry.yml
          - workflow: sorted-collections
            file: workflows/sorted-collections.yml
          - workflow: access-control
            file: workflows/access-control.yml
          - workflow: host-logging
            file: workflows/host-logging.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: scaffolding-e2e-wasm
          path: logic/res

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # merobox comes from PyPI, like every other Calimero app repo installs it.
      # It used to be an apt repo at calimero-network.github.io/merobox, which
      # stopped serving a Release file and took every job in this matrix down
      # with a 404 from `apt-get update` — before any of them reached a test.
      #
      # EXACTLY pinned, and pinned TOGETHER with the merod image below. merobox
      # drives the node's admin API directly, so an unpinned merobox silently
      # starts speaking a newer node's payloads and the e2e reds on a commit
      # that changed nothing. That is not hypothetical: merobox 0.6.55 dropped
      # `upgradePolicy` to match rc.21 (core#3393), and against the rc.20 image
      # this file used to pin, every `create_namespace` died with
      # `HTTP 400: missing field 'upgradePolicy'`. Move these two together.
      - name: Install merobox
        run: pip install "merobox==0.6.55" "calimero-client-py==0.6.29" && merobox --version

      - name: Pull merod image
        run: docker pull ghcr.io/calimero-network/merod:0.11.0-rc.24

      # Schema-checks the scenario without starting a node: a misspelled step
      # type or a missing required field fails here in a second instead of
      # 40 minutes into a run, or — worse — silently doing nothing.
      - name: Validate ${{ matrix.workflow }}
        run: cd logic && merobox bootstrap validate ${{ matrix.file }}

      - name: Run ${{ matrix.workflow }}
        run: |
          mkdir -p docker-logs
          cd logic
          max_attempts=2
          attempt=1
          success=false

          # Background watcher: stream docker logs from live containers to disk.
          # Post-run `docker logs` is unreliable because merobox tears down
          # containers on exit. The watcher captures logs while containers are
          # still alive so cleanup can't race against log collection.
          LOGDIR="$GITHUB_WORKSPACE/docker-logs"
          WATCHER_STATE_DIR="$(mktemp -d)"
          echo "1" > "$WATCHER_STATE_DIR/attempt"
          (
            while [ ! -f "$WATCHER_STATE_DIR/stop" ]; do
              cur_attempt=$(cat "$WATCHER_STATE_DIR/attempt" 2>/dev/null || echo 1)
              for c in $(docker ps --filter "label=calimero.node=true" --format "{{.Names}}" 2>/dev/null | grep -v -- '-init$' || true); do
                mark="$WATCHER_STATE_DIR/attempt${cur_attempt}-${c}"
                if [ ! -f "$mark" ]; then
                  touch "$mark"
                  docker logs -f "$c" > "$LOGDIR/${{ matrix.workflow }}-attempt${cur_attempt}-${c}.log" 2>&1 &
                fi
              done
              sleep 1
            done
          ) &
          WATCHER_PID=$!

          # Docker containers run as root; sudo needed to remove their files.
          sudo rm -rf data/ || true

          while [ $attempt -le $max_attempts ]; do
            if [ $attempt -gt 1 ]; then
              merobox stop --all || true
              merobox nuke --force || true
              sudo rm -rf data/
              sleep 2
            fi
            echo "$attempt" > "$WATCHER_STATE_DIR/attempt"

            if merobox bootstrap run "${{ matrix.file }}" --e2e-mode; then
              success=true
              break
            fi
            attempt=$((attempt + 1))
          done

          touch "$WATCHER_STATE_DIR/stop"
          sleep 2
          kill "$WATCHER_PID" 2>/dev/null || true
          for pid in $(jobs -p); do kill "$pid" 2>/dev/null || true; done
          wait 2>/dev/null || true

          merobox stop --all || true
          merobox nuke --force || true
          sudo rm -rf data/

          if [ "$success" = false ]; then
            echo "::error::${{ matrix.workflow }} failed after $max_attempts attempts"
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.workflow }}-${{ github.sha }}
          path: docker-logs/${{ matrix.workflow }}*
          retention-days: 7
          if-no-files-found: ignore
