[package]
name = "scaffolding-e2e"
version = "0.10.1-rc.34"
authors = ["Calimero Limited <info@calimero.network>"]
edition = "2021"
repository = "https://github.com/calimero-network/core"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
calimero-sdk            = { git = "https://github.com/calimero-network/core", branch = "master" }
calimero-storage        = { git = "https://github.com/calimero-network/core", branch = "master" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core", branch = "master" }
thiserror = "1.0.56"
sha2      = "0.10.8"
hex       = "0.4.3"
bs58      = "0.5.0"

[build-dependencies]
calimero-wasm-abi = { git = "https://github.com/calimero-network/core", branch = "master" }
serde_json        = "1.0.113"

[profile.app-release]
inherits          = "release"
codegen-units     = 1
opt-level         = "z"
lto               = true
debug             = false
strip             = "symbols"
panic             = "abort"
overflow-checks   = true

[profile.app-profiling]
inherits          = "release"
codegen-units     = 1
opt-level         = 2
lto               = true
debug             = true
