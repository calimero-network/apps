[package]
name = "scaffolding-e2e"
description = "Calimero Scaffolding E2E — the SDK test bench, on the component SDK"
# NOT the release version: the release workflow takes the next appVersion from
# the registry and passes it to `mero-component bundle --app-version`. Cargo
# requires the field; bundling locally without --app-version uses it.
version = "0.0.2"
edition = "2021"
authors = ["Calimero Limited <info@calimero.network>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/calimero-network/apps"
publish = false

[lib]
# A `calimero:app` component. No `rlib`: the tests run the BUILT component on
# core's engine (tests/common/mod.rs), not the crate linked natively.
crate-type = ["cdylib"]

# Core at `component-core-tag` (root Cargo.toml), the same tag for every core
# crate; scripts/check-component-pins.py asserts it. A standalone crate cannot
# inherit `[workspace.dependencies]`.
[dependencies]
calimero-sdk = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.20" }
serde = { version = "1", features = ["derive"] }
# The secrets game publishes SHA-256(secret), as v1 did.
sha2 = "0.10.8"

# The harness (`TestApp`, `run_scenario`) and the builder the tests build this
# crate with, for `cargo test` on the host only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-sdk       = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.20", features = ["testing"] }
calimero-app-build = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.20" }
serde_json = "1"

# Read by `mero-component bundle` (tools/component-bundle), with the keys
# `cargo mero bundle` reads for a v1 app.
[package.metadata.calimero]
package = "com.calimero.scaffolding-e2e"
name = "Scaffolding E2E"
description = "Calimero full-stack scaffold — KV, collections, per-user, frozen and shared storage, roles and a workspace directory, with an interactive test suite."
author = "Calimero"
license = "MIT OR Apache-2.0"
# The slug IS the package id: deep links resolve by `Application.package`.
slug = "com.calimero.scaffolding-e2e"
# The frontend's own favicon rasterized to 512x512 (`logic/gen-icon.sh`).
icon = "res/icon-512.png"
category = "developer-tools"
tags = ["scaffold", "example", "testing"]
github = "https://github.com/calimero-network/apps"
# `component-min-runtime-version` in the root Cargo.toml: a node compares it
# with its own release.
min-runtime-version = "1.0.0-rc.20"
# The listing's link, and an origin the node may send a person back to from
# its consent page. NOT where the production frontend runs: a Cloud node trusts
# passkey ceremonies only from frontends it serves from a bundle, so the
# production frontend is the one packed below (docs/COMPONENT-APPS.md).
frontend = "https://scaffolding-e2e-application.vercel.app/"
# The built frontend the bundle carries; the cluster serves it from the
# package's own origin. Build it first: `pnpm -F scaffolding-e2e build`.
frontend-dir = "../app/dist"

# Standalone: excluded from the root workspace (root Cargo.toml), its own
# Cargo.lock, as core's component apps are.
[workspace]
