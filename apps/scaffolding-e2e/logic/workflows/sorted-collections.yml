# Ported from the v1 workflow sorted-collections.yml (`merobox cloud port`).
# v1 nodes are accounts here.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x9: replication is synchronous: a read sees every committed write
name: Sorted Collections E2E
description: 'SortedMap and SortedSet across two nodes. These are the only collections in this app that
  maintain the WASM host''s ordered index, so they are the only coverage of `storage_index_set`/`storage_index_scan`
  — a regression in that host path would show up in no other scenario here. Also covers `shared_rotate_writers`,
  which is the only way to REVOKE a writer.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3780
accounts:
- e2e-node-1
- e2e-node-2
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Settle before the mesh joins
  type: wait
  seconds: 1.0
- name: Create mesh with node-2
  type: create_org
  account: e2e-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: e2e-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: e2e-node-2
  token: '{{_mesh_invite}}'
- name: Create mesh with node-2
  type: deploy
  account: e2e-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create mesh with node-2
  outputs:
    context_id: contextId
    node1_key: memberPublicKey
- name: Verify mesh keys are populated
  type: assert
  statements:
  - is_set({{node1_key}})
  - is_set({{public_key_e2e-node-2}})
- name: node-1 writes key c
  type: call
  app: '{{context_id}}'
  method: sorted_set
  args:
    key: city_c
    value: chicago
  account: e2e-node-1
  as_key: '{{node1_key}}'
- name: node-1 writes key a
  type: call
  app: '{{context_id}}'
  method: sorted_set
  args:
    key: city_a
    value: amsterdam
  account: e2e-node-1
  as_key: '{{node1_key}}'
- name: node-1 writes key b
  type: call
  app: '{{context_id}}'
  method: sorted_set
  args:
    key: city_b
    value: berlin
  account: e2e-node-1
  as_key: '{{node1_key}}'
- name: node-2 reads the key listing
  type: call
  app: '{{context_id}}'
  method: sorted_keys
  args: {}
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    n2_keys: rpc
- name: Assert node-2 sees the keys in ascending order
  type: json_assert
  statements:
  - 'json_equal({{n2_keys}}, {"output": ["city_a", "city_b", "city_c"]})'
- name: node-2 reads a range
  type: call
  app: '{{context_id}}'
  method: sorted_range
  args:
    start: city_a
    end: city_c
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    n2_range: rpc
- name: Assert the range is half-open
  type: json_assert
  statements:
  - 'json_equal({{n2_range}}, {"output": {"city_a": "amsterdam", "city_b": "berlin"}})'
- name: node-2 reads the largest key
  type: call
  app: '{{context_id}}'
  method: sorted_last_key
  args: {}
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    n2_last: rpc
- name: Assert last_key is the largest, not the newest
  type: json_assert
  statements:
  - 'json_equal({{n2_last}}, {"output": "city_c"})'
- name: node-2 writes a key of its own
  type: call
  app: '{{context_id}}'
  method: sorted_set
  args:
    key: city_bb
    value: brussels
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
- name: node-1 reads the listing after node-2's write
  type: call
  app: '{{context_id}}'
  method: sorted_keys
  args: {}
  account: e2e-node-1
  as_key: '{{node1_key}}'
  outputs:
    n1_keys_merged: rpc
- name: Assert the merged listing is still ordered
  type: json_assert
  statements:
  - 'json_equal({{n1_keys_merged}}, {"output": ["city_a", "city_b", "city_bb", "city_c"]})'
- name: node-1 removes a key
  type: call
  app: '{{context_id}}'
  method: sorted_remove
  args:
    key: city_b
  account: e2e-node-1
  as_key: '{{node1_key}}'
  outputs:
    removed: rpc
- name: Assert the remove reported the key was present
  type: json_assert
  statements:
  - 'json_equal({{removed}}, {"output": true})'
- name: node-2 reads the listing after the removal
  type: call
  app: '{{context_id}}'
  method: sorted_keys
  args: {}
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    n2_keys_after_remove: rpc
- name: Assert the removed key left the index
  type: json_assert
  statements:
  - 'json_equal({{n2_keys_after_remove}}, {"output": ["city_a", "city_bb", "city_c"]})'
- name: node-2 reads the length
  type: call
  app: '{{context_id}}'
  method: sorted_len
  args: {}
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    n2_len: rpc
- name: Assert the length matches the listing
  type: json_assert
  statements:
  - 'json_equal({{n2_len}}, {"output": 3})'
- name: node-2 reads a removed key
  type: call
  app: '{{context_id}}'
  method: sorted_get
  args:
    key: city_b
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    n2_removed_get: rpc
- name: Assert the removed key reads as null
  type: json_assert
  statements:
  - 'json_equal({{n2_removed_get}}, {"output": null})'
- name: node-1 adds tag red
  type: call
  app: '{{context_id}}'
  method: sorted_tag_add
  args:
    tag: red
  account: e2e-node-1
  as_key: '{{node1_key}}'
  outputs:
    tag_red_added: rpc
- name: Assert a new element reports true
  type: json_assert
  statements:
  - 'json_equal({{tag_red_added}}, {"output": true})'
- name: node-1 adds tag red again
  type: call
  app: '{{context_id}}'
  method: sorted_tag_add
  args:
    tag: red
  account: e2e-node-1
  as_key: '{{node1_key}}'
  outputs:
    tag_red_again: rpc
- name: Assert a repeat add reports false
  type: json_assert
  statements:
  - 'json_equal({{tag_red_again}}, {"output": false})'
- name: node-1 adds tag blue
  type: call
  app: '{{context_id}}'
  method: sorted_tag_add
  args:
    tag: blue
  account: e2e-node-1
  as_key: '{{node1_key}}'
- name: node-2 adds tag green
  type: call
  app: '{{context_id}}'
  method: sorted_tag_add
  args:
    tag: green
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
- name: node-1 reads all tags
  type: call
  app: '{{context_id}}'
  method: sorted_tags_all
  args: {}
  account: e2e-node-1
  as_key: '{{node1_key}}'
  outputs:
    n1_tags: rpc
- name: Assert tags from both nodes merge in order
  type: json_assert
  statements:
  - 'json_equal({{n1_tags}}, {"output": ["blue", "green", "red"]})'
- name: node-2 reads a tag range
  type: call
  app: '{{context_id}}'
  method: sorted_tags_range
  args:
    start: blue
    end: red
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    n2_tag_range: rpc
- name: Assert the tag range is half-open
  type: json_assert
  statements:
  - 'json_equal({{n2_tag_range}}, {"output": ["blue", "green"]})'
- name: node-2 reads the largest tag
  type: call
  app: '{{context_id}}'
  method: sorted_tags_last
  args: {}
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    n2_tag_last: rpc
- name: Assert tags_last is the largest element
  type: json_assert
  statements:
  - 'json_equal({{n2_tag_last}}, {"output": "red"})'
- name: node-1 removes tag green
  type: call
  app: '{{context_id}}'
  method: sorted_tag_remove
  args:
    tag: green
  account: e2e-node-1
  as_key: '{{node1_key}}'
  outputs:
    tag_removed: rpc
- name: Assert the remove reported the element was present
  type: json_assert
  statements:
  - 'json_equal({{tag_removed}}, {"output": true})'
- name: node-2 checks the removed tag is gone
  type: call
  app: '{{context_id}}'
  method: sorted_tag_contains
  args:
    tag: green
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    n2_contains_removed: rpc
- name: Assert the removal propagated
  type: json_assert
  statements:
  - 'json_equal({{n2_contains_removed}}, {"output": false})'
- name: node-2 re-adds the removed tag
  type: call
  app: '{{context_id}}'
  method: sorted_tag_add
  args:
    tag: green
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    tag_readded: rpc
- name: Assert the re-add reports it as newly added
  type: json_assert
  statements:
  - 'json_equal({{tag_readded}}, {"output": true})'
- name: node-1 reads all tags after the re-add
  type: call
  app: '{{context_id}}'
  method: sorted_tags_all
  args: {}
  account: e2e-node-1
  as_key: '{{node1_key}}'
  outputs:
    n1_tags_readded: rpc
- name: Assert the re-added element survived the merge
  type: json_assert
  statements:
  - 'json_equal({{n1_tags_readded}}, {"output": ["blue", "green", "red"]})'
- name: node-1 reports its own account id
  type: call
  app: '{{context_id}}'
  method: whoami
  args: {}
  account: e2e-node-1
  as_key: '{{node1_key}}'
  outputs:
    n1_account: result.account_id
- name: node-2 reports its own account id
  type: call
  app: '{{context_id}}'
  method: whoami
  args: {}
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    n2_account: result.account_id
- name: Assert both accounts are populated
  type: assert
  statements:
  - is_set({{n1_account}})
  - is_set({{n2_account}})
- name: node-1 rotates the writer set to both accounts
  type: call
  app: '{{context_id}}'
  method: shared_rotate_writers
  args:
    account_hexes:
    - '{{n1_account}}'
    - '{{n2_account}}'
  account: e2e-node-1
  as_key: '{{node1_key}}'
- name: node-2 checks it is now a writer
  type: call
  app: '{{context_id}}'
  method: shared_is_writer
  args:
    account_hex: '{{n2_account}}'
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    n2_is_writer: rpc
- name: Assert the rotation granted node-2
  type: json_assert
  statements:
  - 'json_equal({{n2_is_writer}}, {"output": true})'
- name: node-2 writes the shared value
  type: call
  app: '{{context_id}}'
  method: shared_set
  args:
    value: written_after_rotation
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
- name: node-1 reads the shared value
  type: call
  app: '{{context_id}}'
  method: shared_get
  args: {}
  account: e2e-node-1
  as_key: '{{node1_key}}'
  outputs:
    shared_after_rotation: rpc
- name: Assert the newly granted writer's write landed
  type: json_assert
  statements:
  - 'json_equal({{shared_after_rotation}}, {"output": "written_after_rotation"})'
- name: node-1 rotates node-2 back out
  type: call
  app: '{{context_id}}'
  method: shared_rotate_writers
  args:
    account_hexes:
    - '{{n1_account}}'
  account: e2e-node-1
  as_key: '{{node1_key}}'
- name: node-2 checks whether it is still a writer
  type: call
  app: '{{context_id}}'
  method: shared_is_writer
  args:
    account_hex: '{{n2_account}}'
  account: e2e-node-2
  as_key: '{{public_key_e2e-node-2}}'
  outputs:
    n2_is_writer_after_revoke: rpc
- name: Assert the revocation propagated
  type: json_assert
  statements:
  - 'json_equal({{n2_is_writer_after_revoke}}, {"output": false})'
- name: node-1 reads the writer set
  type: call
  app: '{{context_id}}'
  method: shared_get_writers
  args: {}
  account: e2e-node-1
  as_key: '{{node1_key}}'
  outputs:
    writers_final: rpc
- name: Assert only node-1 is left in the writer set
  type: json_assert
  statements:
  - 'json_equal({{writers_final}}, {"output": ["{{n1_account}}"]})'
