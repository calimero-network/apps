name: Host Logging E2E
description: >
  Proves the SDK's `tracing` subscriber is actually compiled into this build,
  and that `set_log_level` retunes a live filter.

  This is the only coverage of the `tracing` cargo feature. Without it the
  macros are no-ops: the call still SUCCEEDS and returns the same empty output,
  and the only symptom is that nothing was logged. So an assertion on the call's
  result proves nothing here — the real assertions are all log greps.

  The SDK's default level is WARN, so the default probe emits the warn line ONLY
  and both info and debug are filtered out inside the guest. Raising to DEBUG
  surfaces the app's debug line and `calimero_storage`'s own output. Same
  expectations as core's `crates/runtime/tests/tracing_logs.rs`.  Since core
  0.11.0-rc.85 the node logs each guest line's length and not its text, so
  the steps below tell the lines apart by length.

  Also covers `my_account`, which exists to be spelled the same as in core's
  copy of this scaffold (`apps/scaffolding-e2e`) so a scenario stays portable
  between the two.

force_pull_image: false
nuke_on_start: true
near_devnet: false

# Single node on purpose: nothing here is about replication. Two nodes would
# double the runtime and test nothing extra.
# ⚠️ REQUIRED, and its absence is why namespace joins kept dying on
# `KeyDelivery timed out`.
#
# Without it, `merod init`'s default `bootstrap.nodes` survives — the PUBLIC
# calimero devnet boot-node. Every container then spends its startup dialing
# unreachable public addresses, and the node log fills with
#
#     libp2p_relay: Dropping in-flight connect request because we are at capacity
#     autonat: ✗ Address /ip4/52.226.124.20/udp/... test failed
#
# until the join gives up with
#
#     join_group: direct namespace-join request found no reachable mesh peer
#     join_group: join response contained no group key
#     KeyDelivery timed out for group ContextGroupId(...)
#
# The peers never found each other; it was never a timing race. `e2e_mode`
# clears `bootstrap.nodes`, gives the workflow its own rendezvous namespace,
# turns multicast discovery on (which is what populates the kad table on a
# single Docker bridge) and tightens the sync intervals. merobox's own
# `apply_e2e_defaults` documents measuring this exact failure with it off.
e2e_mode: true

nodes:
  count: 1
  # rc.25, matching the calimero-sdk tag in logic/Cargo.toml. The other
  # workflows in this directory still say rc.24 — they predate the SDK bump in
  # #21 and are being brought forward separately.
  image: ghcr.io/calimero-network/merod:0.12.0-rc.2
  # rc.26 made mDNS opt-in (core#3620) and merobox does not pass the flag,
  # so discovery changed at the image bump. Stated, not inherited.
  mdns: true
  prefix: e2e-node

steps:
  - name: Install application on node-1
    type: install_application
    node: e2e-node-1
    path: dist/com.calimero.scaffolding-e2e.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Assert application installed
    type: assert
    statements:
      - "is_set({{app_id}})"

  # A context has to live in a namespace since rc.21; `create_context` requires
  # `group_id` and there is no bare-context path any more.
  # ⚠️ The nodes must be UP before the first admin call. merobox waits for
  # container health, which is not the same as ready: on a genuinely cold
  # host `create_namespace` returns 500 about four seconds into the run.
  # This was masked while the teardown left the previous scenario's
  # containers behind, because the nodes were then already warm.
  - name: Settle before the first admin call
    type: wait
    seconds: 12

  - name: Create namespace on node-1
    type: create_namespace
    node: e2e-node-1
    application_id: "{{app_id}}"
    outputs:
      namespace_id: namespaceId

  - name: Assert namespace created
    type: assert
    statements:
      - "is_set({{namespace_id}})"

  - name: Create context in the namespace
    type: create_context
    node: e2e-node-1
    application_id: "{{app_id}}"
    group_id: "{{namespace_id}}"
    outputs:
      context_id: contextId
      member_key: memberPublicKey

  - name: Assert the context and member key are populated
    type: assert
    statements:
      - "is_set({{context_id}})"
      - "is_set({{member_key}})"

  # ─── my_account agrees with whoami ────────────────────────────────────────

  - name: Read the account through whoami
    type: call
    node: e2e-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_key}}"
    method: whoami
    args: {}
    outputs:
      account_via_whoami: result.output.account_id

  - name: Read the account through my_account
    type: call
    node: e2e-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_key}}"
    method: my_account
    args: {}
    outputs:
      account_via_my_account: result.output

  - name: Assert both accounts are populated
    type: assert
    statements:
      - "is_set({{account_via_whoami}})"
      - "is_set({{account_via_my_account}})"

  # Two names for one value is a drift risk, and the drift would be silent: a
  # grant built from one while the UI shows the other authorizes a different
  # subject, and every `shared_set` then fails its writer check for no visible
  # reason. `equal`, not `is_set` on each — the point is that they MATCH.
  - name: Assert my_account returns exactly whoami's account_id
    type: assert
    statements:
      - "equal({{account_via_my_account}}, {{account_via_whoami}})"

  # ─── the tracing subscriber ───────────────────────────────────────────────
  #
  # Asserted against the NODE'S LOG: the JSON-RPC reply carries the return value
  # and nothing else (no `logs` field), so no RPC client can observe them.
  #
  # Since core 0.11.0-rc.85 (core#4560) a node logs a guest line's SHAPE at
  # info and never its text: guest output is written by app code over app
  # state, and a node operator is not the audience for it. Each line becomes
  #
  #     INFO runtime::guest::log: guest log interesting=false total_logs=1 message_len=47
  #
  # and the text is only at `trace` under `runtime::guest::log`, which CI's
  # `--log-level info` leaves off. So these steps tell the probe's lines apart
  # by length, measured with core's `crates/runtime/tests/tracing_logs.rs`
  # against this same probe:
  #
  #     47  " WARN scaffolding_e2e: tracing_probe: warn line"
  #     58  " INFO scaffolding_e2e: tracing_probe: info line probe=true"
  #     59  "DEBUG scaffolding_e2e: tracing_probe: debug line probe=true"
  #
  # `init`'s own `app::log!` line is 25 bytes, and nothing else in this
  # workflow logs before the probe, so no other line is 47, 58 or 59.
  # Renaming the crate, or changing those messages, moves the lengths.
  #
  # Regex, because merod's log colours a field name: `message_len` and its `=`
  # can each sit inside ANSI codes, and merobox matches the raw line.

  - name: Probe tracing at the default level
    type: call
    node: e2e-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_key}}"
    method: tracing_probe
    args:
      debug: false
    outputs:
      default_probe: result

  # The call returning `unit` is NOT evidence of anything: with the `tracing`
  # feature off the macros are no-ops and this succeeds identically. It is here
  # only to prove the call itself did not error.
  - name: Assert the probe call succeeded
    type: json_assert
    statements:
      - 'json_equal({{default_probe}}, {"output": null})'

  # THIS is the assertion that the `tracing` feature is compiled in: without it
  # the subscriber is never installed, the probe logs nothing, and no 47-byte
  # guest line exists.
  #
  # WARN only. The SDK's default level is WARN, not INFO: `calimero_storage`
  # logs routine operations at INFO, so an INFO default would flood every
  # execution. core's own `tracing_logs.rs` asserts exactly this: at the
  # default, warn passes and info + debug are both filtered out.
  - name: Assert the warn line reached the node log
    type: assert_log_present
    nodes:
      - e2e-node-1
    regex: true
    patterns:
      - 'guest log .*message_len(?:\x1b\[[0-9;]*m)*=(?:\x1b\[[0-9;]*m)*47(?![0-9])'

  # The negative half, and it MUST come before the DEBUG probe below: once the
  # level is raised both lines appear, and these assertions would then be
  # checking the wrong execution.
  - name: Assert info and debug were filtered out at the default level
    type: assert_log_absent
    nodes:
      - e2e-node-1
    regex: true
    patterns:
      - 'guest log .*message_len(?:\x1b\[[0-9;]*m)*=(?:\x1b\[[0-9;]*m)*58(?![0-9])'
      - 'guest log .*message_len(?:\x1b\[[0-9;]*m)*=(?:\x1b\[[0-9;]*m)*59(?![0-9])'

  # And the guarantee core#4560 added: the node logs that a guest line was
  # written, never what it says.
  - name: Assert the probe's text stayed out of the node log
    type: assert_log_absent
    nodes:
      - e2e-node-1
    patterns:
      - "tracing_probe:"

  # Last, because `set_log_level` mutates a static that lives as long as the WASM
  # instance, and DEBUG on calimero-storage is loud.
  - name: Probe tracing with the level raised to DEBUG
    type: call
    node: e2e-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_key}}"
    method: tracing_probe
    args:
      debug: true

  - name: Assert the app's debug line appears once the level is raised
    type: assert_log_present
    nodes:
      - e2e-node-1
    regex: true
    patterns:
      - 'guest log .*message_len(?:\x1b\[[0-9;]*m)*=(?:\x1b\[[0-9;]*m)*59(?![0-9])'

  # The imported-dependency case, and the reason the probe writes a KV entry at
  # all: `calimero_storage`'s OWN tracing only shows up if the subscriber is
  # process-wide rather than scoped to the app crate. Its lines have no fixed
  # length (they carry ids and hashes), so this counts them instead: the app's
  # three lines alone are 3, and core measures 24 for this probe with
  # storage's included. At least 10 cannot come from the app crate alone.
  - name: Assert the storage crate's own tracing came through too
    type: assert_log_present
    nodes:
      - e2e-node-1
    regex: true
    patterns:
      - 'execution logs .*lines(?:\x1b\[[0-9;]*m)*=(?:\x1b\[[0-9;]*m)*[1-9][0-9]+(?![0-9])'

  # Raising the level reaches the guest, not the node: the text still stays out.
  - name: Assert the raised level kept the text out of the node log
    type: assert_log_absent
    nodes:
      - e2e-node-1
    patterns:
      - "tracing_probe:"

  # The probe writes a KV entry so calimero-storage's own instrumentation runs
  # through the same subscriber. Reading it back confirms the write happened
  # rather than the whole call being a no-op that logged.
  - name: Read back the key the probe wrote
    type: call
    node: e2e-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_key}}"
    method: get
    args:
      key: "probe_key"
    outputs:
      probe_value: result

  - name: Assert the probe's KV write landed
    type: json_assert
    statements:
      - 'json_equal({{probe_value}}, {"output": "probe_value"})'

stop_all_nodes: false
restart: false
wait_timeout: 180
