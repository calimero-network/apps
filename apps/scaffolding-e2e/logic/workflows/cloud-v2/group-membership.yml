# Ported from group-membership.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   get_group_info x1: v1 group info
#   list_group_members x3: v1 group listing
#   remove_group_members (team) x1: not supported by the port
#   set_subgroup_visibility x1: subgroup visibility is v1 governance
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: E2E KV Store - Group Membership
description: 'Tests group membership operations: adding members to a subgroup, verifying member lists,
  removing members, and verifying removed members lose access. This is the core scenario for the namespace
  signing key hierarchy fix.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3680
accounts:
- e2e-node-1
- e2e-node-2
- e2e-node-3
steps:
- name: Install application on e2e-node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id: hash
  account: e2e-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: e2e-node-1
- name: Invite node-2 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite_node2: token
- name: Settle before node-2 joins the namespace
  type: wait
  seconds: 1.0
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{invite_node2}}'
  account: e2e-node-2
- type: whoami
  account: e2e-node-2
  outputs:
    identity_node2: publicKey
    account_node2: publicKey
- name: Invite node-3 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite_node3: token
- name: Settle before node-3 joins the namespace
  type: wait
  seconds: 1.0
- name: Node-3 joins namespace
  type: redeem_invite
  token: '{{invite_node3}}'
  account: e2e-node-3
- type: whoami
  account: e2e-node-3
  outputs:
    account_node3: publicKey
- name: Assert namespace has members
  type: assert
  statements:
  - is_set({{ns_members}})
- name: Create subgroup
  type: create_team
  org: '{{namespace_id}}'
  team_name: test-subgroup
  outputs:
    subgroup_id: teamId
  account: e2e-node-1
- name: Assert subgroup created
  type: assert
  statements:
  - is_set({{subgroup_id}})
- name: Add node-2 to subgroup
  type: team_add
  org: '{{namespace_id}}'
  team: '{{subgroup_id}}'
  members:
  - '{{identity_node2}}'
  account: e2e-node-1
- name: Assert subgroup has members
  type: assert
  statements:
  - is_set({{subgroup_members}})
- name: Create context in subgroup
  type: deploy
  account: e2e-node-1
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context in subgroup
  org: '{{namespace_id}}'
  outputs:
    sub_ctx_id: appId
- name: Assert subgroup context created
  type: assert
  statements:
  - is_set({{sub_ctx_id}})
- name: Node-2 joins subgroup context
  type: whoami
  account: e2e-node-2
  outputs:
    sub_ctx_key_node2: publicKey
- name: Node-1 writes to subgroup context
  type: call
  app: '{{sub_ctx_id}}'
  method: set
  args:
    key: subgroup_key
    value: from_subgroup
  account: e2e-node-1
- name: Node-2 reads subgroup context value
  type: call
  app: '{{sub_ctx_id}}'
  method: get
  args:
    key: subgroup_key
  account: e2e-node-2
  outputs:
    subgroup_read: rpc
- name: Assert subgroup context synced
  type: json_assert
  statements:
  - 'json_equal({{subgroup_read}}, {"output": "from_subgroup"})'
- name: Node-3 calls subgroup context (should fail - not a subgroup member)
  type: call
  app: '{{sub_ctx_id}}'
  method: set
  args:
    key: node3_key
    value: should_not_work
  account: e2e-node-3
  expected_failure: true
  outputs:
    node3_denied_error: error
- name: Assert node-3 was actually refused
  type: assert
  statements:
  - is_set({{node3_denied_error}})
- name: Assert subgroup still has admin member
  type: assert
  statements:
  - is_set({{subgroup_members_after}})
- name: Node-2 writes to subgroup context after removal (should fail)
  type: call
  app: '{{sub_ctx_id}}'
  method: set
  args:
    key: revoked_key
    value: should_not_work
  account: e2e-node-2
  expected_failure: true
  outputs:
    node2_revoked_error: error
- name: Assert the removal actually revoked write access
  type: assert
  statements:
  - is_set({{node2_revoked_error}})
- name: Node-1 confirms the revoked write never landed
  type: call
  app: '{{sub_ctx_id}}'
  method: get
  args:
    key: revoked_key
  account: e2e-node-1
  outputs:
    revoked_key_value: rpc
- name: Assert no value was written by the removed member
  type: json_assert
  statements:
  - 'json_equal({{revoked_key_value}}, {"output": null})'
- name: Assert group info returned
  type: assert
  statements:
  - is_set({{group_id_echo}})
  - is_set({{group_member_count}})
