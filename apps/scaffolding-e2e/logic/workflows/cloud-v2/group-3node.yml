# Ported from group-3node.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: E2E KV Store - Group 3-Node Convergence
description: 'Tests that three nodes can all join the same namespace and converge on shared state. Each
  node writes a distinct key and all three verify they see every write — covering the multi-party sync
  path that the 2-node test misses.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3640
accounts:
- e2e-node-1
- e2e-node-2
- e2e-node-3
steps:
- name: Install application on e2e-node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id: hash
  account: e2e-node-1
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: e2e-node-1
- name: Assert namespace created
  type: assert
  statements:
  - is_set({{namespace_id}})
- name: Create context in namespace on node-1
  type: deploy
  account: e2e-node-1
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context in namespace on node-1
  org: '{{namespace_id}}'
  outputs:
    ctx_id: contextId
- name: Assert context created
  type: assert
  statements:
  - is_set({{ctx_id}})
- name: Create namespace invitation for node-2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite_node2: token
- name: Settle before node-2 joins the namespace
  type: wait
  seconds: 1.0
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{invite_node2}}'
  account: e2e-node-2
- name: Create namespace invitation for node-3
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite_node3: token
- name: Settle before node-3 joins the namespace
  type: wait
  seconds: 1.0
- name: Node-3 joins namespace
  type: redeem_invite
  token: '{{invite_node3}}'
  account: e2e-node-3
- name: Node-1 writes key-A
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: key_a
    value: from_node1
  account: e2e-node-1
- name: Node-2 reads key-A
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: key_a
  account: e2e-node-2
  outputs:
    key_a_node2: rpc
- name: Assert key-A on node-2
  type: json_assert
  statements:
  - 'json_equal({{key_a_node2}}, {"output": "from_node1"})'
- name: Node-3 reads key-A
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: key_a
  account: e2e-node-3
  outputs:
    key_a_node3: rpc
- name: Assert key-A on node-3
  type: json_assert
  statements:
  - 'json_equal({{key_a_node3}}, {"output": "from_node1"})'
- name: Node-2 writes key-B
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: key_b
    value: from_node2
  account: e2e-node-2
- name: Node-1 reads key-B
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: key_b
  account: e2e-node-1
  outputs:
    key_b_node1: rpc
- name: Assert key-B on node-1
  type: json_assert
  statements:
  - 'json_equal({{key_b_node1}}, {"output": "from_node2"})'
- name: Node-3 reads key-B
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: key_b
  account: e2e-node-3
  outputs:
    key_b_node3: rpc
- name: Assert key-B on node-3
  type: json_assert
  statements:
  - 'json_equal({{key_b_node3}}, {"output": "from_node2"})'
- name: Node-3 writes key-C
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: key_c
    value: from_node3
  account: e2e-node-3
- name: Node-1 reads key-C
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: key_c
  account: e2e-node-1
  outputs:
    key_c_node1: rpc
- name: Assert key-C on node-1
  type: json_assert
  statements:
  - 'json_equal({{key_c_node1}}, {"output": "from_node3"})'
- name: Node-2 reads key-C
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: key_c
  account: e2e-node-2
  outputs:
    key_c_node2: rpc
- name: Assert key-C on node-2
  type: json_assert
  statements:
  - 'json_equal({{key_c_node2}}, {"output": "from_node3"})'
- name: Node-1 reads all entries
  type: call
  app: '{{ctx_id}}'
  method: entries
  args: {}
  account: e2e-node-1
  outputs:
    entries_node1: rpc
- name: Node-2 reads all entries
  type: call
  app: '{{ctx_id}}'
  method: entries
  args: {}
  account: e2e-node-2
  outputs:
    entries_node2: rpc
- name: Node-3 reads all entries
  type: call
  app: '{{ctx_id}}'
  method: entries
  args: {}
  account: e2e-node-3
  outputs:
    entries_node3: rpc
- name: Assert all nodes see same entry count
  type: json_assert
  statements:
  - json_equal({{entries_node1}}, {{entries_node2}})
  - json_equal({{entries_node2}}, {{entries_node3}})
