# Ported from fuzzy-test.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   fuzzy_test x1: v1 fuzzy runner
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: Scaffolding E2E Fuzzy Load Test
description: Long-running fuzzy load test for the comprehensive scaffolding-e2e application
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3770
accounts:
- fuzzy-e2e-node-1
- fuzzy-e2e-node-2
- fuzzy-e2e-node-3
- fuzzy-e2e-node-4
steps:
- name: Install Scaffolding E2E on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    e2e_app_id: hash
  account: fuzzy-e2e-node-1
- name: Settle before the mesh joins
  type: wait
  seconds: 1.0
- name: Create the namespace on node-1
  type: create_org
  org_name: Create the namespace on node-1
  outputs:
    ns_id: orgId
  account: fuzzy-e2e-node-1
- name: Create the context on node-1
  type: deploy
  account: fuzzy-e2e-node-1
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create the context on node-1
  org: '{{ns_id}}'
  outputs:
    e2e_context_id: contextId
    node1_key: memberPublicKey
- name: Invitation for node-2
  type: invite
  org: '{{ns_id}}'
  role: member
  account: fuzzy-e2e-node-1
  outputs:
    invite_2: token
- name: Settle before node-2 joins
  type: wait
  seconds: 1.0
- name: Node-2 joins the namespace
  type: redeem_invite
  token: '{{invite_2}}'
  account: fuzzy-e2e-node-2
- name: Node-2 joins the context
  type: whoami
  account: fuzzy-e2e-node-2
  outputs:
    public_key_fuzzy-e2e-node-2: publicKey
- name: Invitation for node-3
  type: invite
  org: '{{ns_id}}'
  role: member
  account: fuzzy-e2e-node-1
  outputs:
    invite_3: token
- name: Settle before node-3 joins
  type: wait
  seconds: 1.0
- name: Node-3 joins the namespace
  type: redeem_invite
  token: '{{invite_3}}'
  account: fuzzy-e2e-node-3
- name: Node-3 joins the context
  type: whoami
  account: fuzzy-e2e-node-3
  outputs:
    public_key_fuzzy-e2e-node-3: publicKey
- name: Invitation for node-4
  type: invite
  org: '{{ns_id}}'
  role: member
  account: fuzzy-e2e-node-1
  outputs:
    invite_4: token
- name: Settle before node-4 joins
  type: wait
  seconds: 1.0
- name: Node-4 joins the namespace
  type: redeem_invite
  token: '{{invite_4}}'
  account: fuzzy-e2e-node-4
- name: Node-4 joins the context
  type: whoami
  account: fuzzy-e2e-node-4
  outputs:
    public_key_fuzzy-e2e-node-4: publicKey
- name: Verify all nodes synced
  type: assert
  statements:
  - is_set({{e2e_context_id}})
  - is_set({{node1_key}})
  - is_set({{public_key_fuzzy-e2e-node-2}})
  - is_set({{public_key_fuzzy-e2e-node-3}})
  - is_set({{public_key_fuzzy-e2e-node-4}})
- name: Seed initial KV data
  type: repeat
  count: 10
  steps:
  - type: call
    app: '{{e2e_context_id}}'
    method: set
    args:
      key: seed_key_{{seed_idx}}
      value: seed_value_{{seed_idx}}
    account: fuzzy-e2e-node-1
    as_key: '{{node1_key}}'
- name: Seed initial CRDT counters
  type: repeat
  count: 5
  steps:
  - type: call
    app: '{{e2e_context_id}}'
    method: increment_g_counter
    args:
      key: perf_counter_{{cnt_idx}}
    account: fuzzy-e2e-node-1
    as_key: '{{node1_key}}'
- name: Seed initial metrics vector
  type: repeat
  count: 3
  steps:
  - type: call
    app: '{{e2e_context_id}}'
    method: push_metric
    args:
      value: 1
    account: fuzzy-e2e-node-1
    as_key: '{{node1_key}}'
- name: Seed AuthoredMap entry 0
  type: call
  app: '{{e2e_context_id}}'
  method: authored_insert
  args:
    key: authored_seed_0
    value: authored_val_0
  account: fuzzy-e2e-node-1
  as_key: '{{node1_key}}'
- name: Seed AuthoredMap entry 1
  type: call
  app: '{{e2e_context_id}}'
  method: authored_insert
  args:
    key: authored_seed_1
    value: authored_val_1
  account: fuzzy-e2e-node-1
  as_key: '{{node1_key}}'
- name: Seed AuthoredMap entry 2
  type: call
  app: '{{e2e_context_id}}'
  method: authored_insert
  args:
    key: authored_seed_2
    value: authored_val_2
  account: fuzzy-e2e-node-1
  as_key: '{{node1_key}}'
- name: Seed AuthoredMap entry 3
  type: call
  app: '{{e2e_context_id}}'
  method: authored_insert
  args:
    key: authored_seed_3
    value: authored_val_3
  account: fuzzy-e2e-node-1
  as_key: '{{node1_key}}'
- name: Seed AuthoredMap entry 4
  type: call
  app: '{{e2e_context_id}}'
  method: authored_insert
  args:
    key: authored_seed_4
    value: authored_val_4
  account: fuzzy-e2e-node-1
  as_key: '{{node1_key}}'
- name: node-2 reports its own account id
  type: call
  app: '{{e2e_context_id}}'
  method: whoami
  args: {}
  account: fuzzy-e2e-node-2
  as_key: '{{public_key_fuzzy-e2e-node-2}}'
  outputs:
    n2_account: result.account_id
- name: node-3 reports its own account id
  type: call
  app: '{{e2e_context_id}}'
  method: whoami
  args: {}
  account: fuzzy-e2e-node-3
  as_key: '{{public_key_fuzzy-e2e-node-3}}'
  outputs:
    n3_account: result.account_id
- name: node-4 reports its own account id
  type: call
  app: '{{e2e_context_id}}'
  method: whoami
  args: {}
  account: fuzzy-e2e-node-4
  as_key: '{{public_key_fuzzy-e2e-node-4}}'
  outputs:
    n4_account: result.account_id
- name: Add node-2 as shared writer
  type: call
  app: '{{e2e_context_id}}'
  method: shared_add_writer
  args:
    account_hex: '{{n2_account}}'
  account: fuzzy-e2e-node-1
  as_key: '{{node1_key}}'
- name: Add node-3 as shared writer
  type: call
  app: '{{e2e_context_id}}'
  method: shared_add_writer
  args:
    account_hex: '{{n3_account}}'
  account: fuzzy-e2e-node-1
  as_key: '{{node1_key}}'
- name: Add node-4 as shared writer
  type: call
  app: '{{e2e_context_id}}'
  method: shared_add_writer
  args:
    account_hex: '{{n4_account}}'
  account: fuzzy-e2e-node-1
  as_key: '{{node1_key}}'
- name: Seed initial shared storage value
  type: call
  app: '{{e2e_context_id}}'
  method: shared_set
  args:
    value: shared_initial
  account: fuzzy-e2e-node-1
  as_key: '{{node1_key}}'
- name: Get final KV entry count
  type: call
  app: '{{e2e_context_id}}'
  method: len
  args: {}
  account: fuzzy-e2e-node-1
  as_key: '{{node1_key}}'
  outputs:
    final_kv_count: rpc
- name: Get final handler execution count
  type: call
  app: '{{e2e_context_id}}'
  method: get_handler_execution_count
  args: {}
  account: fuzzy-e2e-node-1
  as_key: '{{node1_key}}'
  outputs:
    final_handler_count: rpc
- name: Log final statistics
  type: assert
  statements:
  - is_set({{final_kv_count}})
  - is_set({{final_handler_count}})
