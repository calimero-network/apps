# Ported from group-nesting.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert statement on a dropped step's output x3: checks what the dropped steps did
#   list_subgroups x3: v1 group listing
#   reparent_group x2: reparenting is v1 governance
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: E2E KV Store - Group Nesting
description: "Tests subgroup tree-shape operations using the strict-tree reparent_group primitive. The\
  \ old nest_group / unnest_group steps were removed because orphan state was reachable through them;\
  \ reparent_group is the single atomic edge swap that replaces both.\n\n  1. Create child group via create_group_in_namespace,\
  \ verify in listing\n  2. Create a sibling group, then reparent the child under it (\"unnest\"\n   \
  \  from namespace), verify the child is no longer a namespace child\n  3. Reparent the child back under\
  \ the namespace (\"re-nest\"), verify it\n     reappears in the namespace's subgroup list\n  4. Verify\
  \ namespace root context is unaffected through all transitions\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3700
accounts:
- e2e-node-1
- e2e-node-2
steps:
- name: Install application on e2e-node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id: hash
  account: e2e-node-1
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create namespace (parent group)
  type: create_org
  org_name: Create namespace (parent group)
  outputs:
    parent_id: orgId
  account: e2e-node-1
- name: Assert namespace created
  type: assert
  statements:
  - is_set({{parent_id}})
- name: Invite node-2
  type: invite
  org: '{{parent_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite: token
- name: Settle before node-2 joins the namespace
  type: wait
  seconds: 1.0
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{invite}}'
  account: e2e-node-2
- name: Create root context
  type: deploy
  account: e2e-node-1
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create root context
  org: '{{parent_id}}'
  outputs:
    root_ctx_id: contextId
- name: Write baseline to root context
  type: call
  app: '{{root_ctx_id}}'
  method: set
  args:
    key: baseline
    value: before_nesting
  account: e2e-node-1
- name: Node-2 reads baseline
  type: call
  app: '{{root_ctx_id}}'
  method: get
  args:
    key: baseline
  account: e2e-node-2
  outputs:
    baseline_read: rpc
- name: Assert baseline synced
  type: json_assert
  statements:
  - 'json_equal({{baseline_read}}, {"output": "before_nesting"})'
- name: Create child group via namespace
  type: create_team
  org: '{{parent_id}}'
  team_name: nestable-child
  outputs:
    child_id: teamId
  account: e2e-node-1
- name: Assert child group created
  type: assert
  statements:
  - is_set({{child_id}})
- name: Create sibling group under namespace
  type: create_team
  org: '{{parent_id}}'
  team_name: sibling
  outputs:
    sibling_id: teamId
  account: e2e-node-1
- name: Assert sibling created
  type: assert
  statements:
  - is_set({{sibling_id}})
- name: Write after nest/unnest cycle
  type: call
  app: '{{root_ctx_id}}'
  method: set
  args:
    key: after_nesting
    value: still_works
  account: e2e-node-1
- name: Node-2 reads after nesting cycle
  type: call
  app: '{{root_ctx_id}}'
  method: get
  args:
    key: after_nesting
  account: e2e-node-2
  outputs:
    after_nest_read: rpc
- name: Assert root context works after nest/unnest
  type: json_assert
  statements:
  - 'json_equal({{after_nest_read}}, {"output": "still_works"})'
