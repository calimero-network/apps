# Ported from group-capabilities.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   get_member_capabilities x2: capabilities are v1 governance
#   json_assert statement on a dropped step's output x2: checks what the dropped steps did
#   set_default_capabilities x1: capabilities are v1 governance
#   set_default_visibility x1: subgroup visibility is v1 governance
#   set_member_capabilities x1: capabilities are v1 governance
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: E2E KV Store - Group Capabilities
description: "Tests the capability API (set/get/override):\n  1. Set default capabilities (bitmask 7 =\
  \ all) before inviting members\n  2. Invite member, verify inherited capabilities via get (json_equal\
  \ 7)\n  3. Override individual member capabilities to 1, verify (json_equal 1)\n  4. Set default visibility\
  \ to open, verify context sync still works\n\nNOTE: This tests the capability API (store/retrieve values),\
  \ not capability enforcement (server rejecting unauthorized operations).\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3650
accounts:
- e2e-node-1
- e2e-node-2
steps:
- name: Install application on e2e-node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id: hash
  account: e2e-node-1
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: e2e-node-1
- name: Assert namespace created
  type: assert
  statements:
  - is_set({{namespace_id}})
- name: Invite node-2 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite_node2: token
- name: Settle before node-2 joins the namespace
  type: wait
  seconds: 1.0
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{invite_node2}}'
  account: e2e-node-2
- type: whoami
  account: e2e-node-2
  outputs:
    account_node2: publicKey
- name: Create context in namespace
  type: deploy
  account: e2e-node-1
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context in namespace
  org: '{{namespace_id}}'
  outputs:
    ctx_id: contextId
- name: Assert context created
  type: assert
  statements:
  - is_set({{ctx_id}})
- name: Node-1 writes to context
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: caps_test
    value: caps_work
  account: e2e-node-1
- name: Node-2 reads from context
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: caps_test
  account: e2e-node-2
  outputs:
    caps_read: rpc
- name: Assert context works after capability and visibility changes
  type: json_assert
  statements:
  - 'json_equal({{caps_read}}, {"output": "caps_work"})'
