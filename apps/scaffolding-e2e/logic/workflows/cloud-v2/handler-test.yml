# Ported from handler-test.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: E2E KV Store - Event Handler Dispatch
description: "Tests the app::emit! / insert_handler path in the namespace model. set_with_handler emits\
  \ an event that merod dispatches back to all context members as an execute call. The test verifies:\n\
  \  1. set_with_handler writes the value and fires the event.\n  2. The handler-inserted value syncs\
  \ to both nodes via CRDT.\n  3. get_handler_execution_count reflects handler invocations.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3740
accounts:
- e2e-node-1
- e2e-node-2
steps:
- name: Install application on e2e-node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: e2e-node-1
- name: Assert namespace created
  type: assert
  statements:
  - is_set({{namespace_id}})
- name: Create context in namespace on node-1
  type: deploy
  account: e2e-node-1
  wasm: '{{env.APPS_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context in namespace on node-1
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    ctx_key_node1: memberPublicKey
- name: Assert context created
  type: assert
  statements:
  - is_set({{context_id}})
- name: Create namespace invitation for node-2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    namespace_invitation: token
- name: Settle before node-2 joins the namespace
  type: wait
  seconds: 1.0
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: e2e-node-2
- name: Node-2 joins context via namespace membership
  type: whoami
  account: e2e-node-2
  outputs:
    ctx_key_node2: publicKey
- name: Node-1 calls set_with_handler
  type: call
  app: '{{context_id}}'
  method: set_with_handler
  args:
    key: test_key
    value: test_value
  account: e2e-node-1
- name: Node-2 reads the handler-written value
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: test_key
  account: e2e-node-2
  outputs:
    read_result: rpc
- name: Assert handler value synced to node-2
  type: json_assert
  statements:
  - 'json_equal({{read_result}}, {"output": "test_value"})'
- name: Node-1 reads back handler-written value
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: test_key
  account: e2e-node-1
  outputs:
    read_result_node1: rpc
- name: Assert handler value present on node-1
  type: json_assert
  statements:
  - 'json_equal({{read_result_node1}}, {"output": "test_value"})'
- name: Node-1 gets handler execution count
  type: call
  app: '{{context_id}}'
  method: get_handler_execution_count
  args: {}
  account: e2e-node-1
  outputs:
    handler_count_node1: rpc
- name: Assert handler was executed at least once on node-1
  type: assert
  statements:
  - is_set({{handler_count_node1}})
- name: Node-2 gets handler execution count
  type: call
  app: '{{context_id}}'
  method: get_handler_execution_count
  args: {}
  account: e2e-node-2
  outputs:
    handler_count_node2: rpc
- name: Assert handler was executed at least once on node-2
  type: assert
  statements:
  - is_set({{handler_count_node2}})
- name: Node-2 calls set_with_handler a second time
  type: call
  app: '{{context_id}}'
  method: set_with_handler
  args:
    key: test_key2
    value: second_value
  account: e2e-node-2
- name: Node-1 reads second handler-written value
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: test_key2
  account: e2e-node-1
  outputs:
    second_read: rpc
- name: Assert second handler value synced to node-1
  type: json_assert
  statements:
  - 'json_equal({{second_read}}, {"output": "second_value"})'
- name: Read the handler count before the direct calls
  type: call
  app: '{{context_id}}'
  method: get_handler_execution_count
  args: {}
  account: e2e-node-1
  outputs:
    count_before_direct: result
- name: Call insert_handler directly
  type: call
  app: '{{context_id}}'
  method: insert_handler
  args:
    key: direct_key
    value: direct_value
  account: e2e-node-1
- name: Call update_handler directly
  type: call
  app: '{{context_id}}'
  method: update_handler
  args:
    key: direct_key
    value: direct_value_2
  account: e2e-node-1
- name: Call remove_handler directly
  type: call
  app: '{{context_id}}'
  method: remove_handler
  args:
    key: direct_key
  account: e2e-node-1
- name: Call clear_handler directly
  type: call
  app: '{{context_id}}'
  method: clear_handler
  args: {}
  account: e2e-node-1
- name: Read the handler count after the direct calls
  type: call
  app: '{{context_id}}'
  method: get_handler_execution_count
  args: {}
  account: e2e-node-1
  outputs:
    count_after_direct: result
- name: Assert all four direct handler calls were counted
  type: assert
  statements:
  - is_set({{count_before_direct}})
  - '{{count_after_direct}} > {{count_before_direct}}'
- name: Node-2 sees the same handler count
  type: call
  app: '{{context_id}}'
  method: get_handler_execution_count
  args: {}
  account: e2e-node-2
  outputs:
    count_node2_after: result
- name: Assert the counter converged across nodes
  type: assert
  statements:
  - '{{count_node2_after}} == {{count_after_direct}}'
