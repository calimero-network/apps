name: E2E KV Store - Group Lifecycle Tests
description: >
  Tests group creation, group invitation, join group, join group context,
  multi-context groups, and context invitation within groups.

force_pull_image: false
nuke_on_start: true
near_devnet: false

# ⚠️ REQUIRED, and its absence is why namespace joins kept dying on
# `KeyDelivery timed out`.
#
# Without it, `merod init`'s default `bootstrap.nodes` survives — the PUBLIC
# calimero devnet boot-node. Every container then spends its startup dialing
# unreachable public addresses, and the node log fills with
#
#     libp2p_relay: Dropping in-flight connect request because we are at capacity
#     autonat: ✗ Address /ip4/52.226.124.20/udp/... test failed
#
# until the join gives up with
#
#     join_group: direct namespace-join request found no reachable mesh peer
#     join_group: join response contained no group key
#     KeyDelivery timed out for group ContextGroupId(...)
#
# The peers never found each other; it was never a timing race. `e2e_mode`
# clears `bootstrap.nodes`, gives the workflow its own rendezvous namespace,
# turns multicast discovery on (which is what populates the kad table on a
# single Docker bridge) and tightens the sync intervals. merobox's own
# `apply_e2e_defaults` documents measuring this exact failure with it off.
e2e_mode: true

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:0.11.0-rc.28
  # rc.26 made mDNS opt-in (core#3620) and merobox does not pass the flag,
  # so discovery changed at the image bump. Stated, not inherited.
  mdns: true
  prefix: e2e-node

steps:
  # --- SCENARIO 1: Full namespace lifecycle ---

  - name: Install application on node-1
    type: install_application
    node: e2e-node-1
    path: res/scaffolding_e2e.wasm
    dev: true
    outputs:
      app_id: applicationId

  - name: Assert application installed
    type: assert
    statements:
      - "is_set({{app_id}})"

  # ⚠️ The nodes must be UP before the first admin call. merobox waits for
  # container health, which is not the same as ready: on a genuinely cold
  # host `create_namespace` returns 500 about four seconds into the run.
  # This was masked while the teardown left the previous scenario's
  # containers behind, because the nodes were then already warm.
  - name: Settle before the first admin call
    type: wait
    seconds: 12

  - name: Create namespace on node-1
    type: create_namespace
    node: e2e-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Assert namespace created
    type: assert
    statements:
      - "is_set({{namespace_id}})"

  - name: Create context 1 in namespace on node-1
    type: create_context
    node: e2e-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      ctx1_id: contextId
      ctx1_key_node1: memberPublicKey

  - name: Create namespace invitation on node-1
    type: create_namespace_invitation
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      namespace_invitation: invitation

  # Settle so peer discovery is done before the join. Core gives the group key
  # 5s to arrive over gossip (join_group.rs:557) and answers a miss with a bare
  # HTTP 500; without this, that budget also has to cover finding the peer. See
  # group-late-joiner.yml for the full write-up.
  - name: Settle before node-2 joins the namespace
    type: wait
    seconds: 12

  - name: Node-2 joins namespace
    type: join_namespace
    node: e2e-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{namespace_invitation}}'
    outputs:
      member_identity_node2: memberIdentity

  - name: Node-1 writes to context 1
    type: call
    node: e2e-node-1
    context_id: '{{ctx1_id}}'
    method: set
    args:
      key: "group_key1"
      value: "from_node1"

  - name: Wait for sync - context 1
    type: wait_for_sync
    context_id: '{{ctx1_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Node-2 reads from context 1
    type: call
    node: e2e-node-2
    context_id: '{{ctx1_id}}'
    method: get
    args:
      key: "group_key1"
    outputs:
      get_result_1: result

  - name: Assert node-1 value synced to node-2
    type: json_assert
    statements:
      - 'json_equal({{get_result_1}}, {"output": "from_node1"})'

  - name: Node-2 writes to context 1
    type: call
    node: e2e-node-2
    context_id: '{{ctx1_id}}'
    method: set
    args:
      key: "group_key2"
      value: "from_node2"

  - name: Wait for sync - context 1 reverse
    type: wait_for_sync
    context_id: '{{ctx1_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Node-1 reads node-2 value
    type: call
    node: e2e-node-1
    context_id: '{{ctx1_id}}'
    method: get
    args:
      key: "group_key2"
    outputs:
      get_result_2: result

  - name: Assert node-2 value synced to node-1
    type: json_assert
    statements:
      - 'json_equal({{get_result_2}}, {"output": "from_node2"})'


  # --- SCENARIO 2 : Context invitation within namespace ---

  - name: Create context 3 in same namespace
    type: create_context
    node: e2e-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      ctx3_id: contextId
      ctx3_key_node1: memberPublicKey

  - name: Node-2 joins context 3 via group membership
    type: join_context
    node: e2e-node-2
    context_id: '{{ctx3_id}}'
    outputs:
      ctx3_key_node2: memberPublicKey

  - name: Wait for sync - context 3
    type: wait_for_sync
    context_id: '{{ctx3_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Node-2 writes to context 3
    type: call
    node: e2e-node-2
    context_id: '{{ctx3_id}}'
    method: set
    args:
      key: "ctx3_test"
      value: "invite_join_works"

  - name: Wait for sync - context 3 write
    type: wait_for_sync
    context_id: '{{ctx3_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Node-1 reads from context 3
    type: call
    node: e2e-node-1
    context_id: '{{ctx3_id}}'
    method: get
    args:
      key: "ctx3_test"
    outputs:
      ctx3_get_result: result

  - name: Assert context invitation join works
    type: json_assert
    statements:
      - 'json_equal({{ctx3_get_result}}, {"output": "invite_join_works"})'

stop_all_nodes: false
