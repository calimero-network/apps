name: E2E KV Store - Group 3-Node Convergence
description: >
  Tests that three nodes can all join the same namespace and converge on shared
  state. Each node writes a distinct key and all three verify they see every
  write — covering the multi-party sync path that the 2-node test misses.

force_pull_image: false
nuke_on_start: true
near_devnet: false

# ⚠️ REQUIRED, and its absence is why namespace joins kept dying on
# `KeyDelivery timed out`.
#
# Without it, `merod init`'s default `bootstrap.nodes` survives — the PUBLIC
# calimero devnet boot-node. Every container then spends its startup dialing
# unreachable public addresses, and the node log fills with
#
#     libp2p_relay: Dropping in-flight connect request because we are at capacity
#     autonat: ✗ Address /ip4/52.226.124.20/udp/... test failed
#
# until the join gives up with
#
#     join_group: direct namespace-join request found no reachable mesh peer
#     join_group: join response contained no group key
#     KeyDelivery timed out for group ContextGroupId(...)
#
# The peers never found each other; it was never a timing race. `e2e_mode`
# clears `bootstrap.nodes`, gives the workflow its own rendezvous namespace,
# turns multicast discovery on (which is what populates the kad table on a
# single Docker bridge) and tightens the sync intervals. merobox's own
# `apply_e2e_defaults` documents measuring this exact failure with it off.
e2e_mode: true

nodes:
  count: 3
  image: ghcr.io/calimero-network/merod:0.11.0-rc.32
  # rc.26 made mDNS opt-in (core#3620) and merobox does not pass the flag,
  # so discovery changed at the image bump. Stated, not inherited.
  mdns: true
  prefix: e2e-node

steps:
  # --- Setup ---

  - name: Install application on node-1
    type: install_application
    node: e2e-node-1
    path: res/scaffolding_e2e.wasm
    dev: true
    outputs:
      app_id: applicationId

  - name: Assert application installed
    type: assert
    statements:
      - "is_set({{app_id}})"

  # ⚠️ The nodes must be UP before the first admin call. merobox waits for
  # container health, which is not the same as ready: on a genuinely cold
  # host `create_namespace` returns 500 about four seconds into the run.
  # This was masked while the teardown left the previous scenario's
  # containers behind, because the nodes were then already warm.
  - name: Settle before the first admin call
    type: wait
    seconds: 12

  - name: Create namespace on node-1
    type: create_namespace
    node: e2e-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Assert namespace created
    type: assert
    statements:
      - "is_set({{namespace_id}})"

  - name: Create context in namespace on node-1
    type: create_context
    node: e2e-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      ctx_id: contextId

  - name: Assert context created
    type: assert
    statements:
      - "is_set({{ctx_id}})"

  # --- Node-2 joins ---

  - name: Create namespace invitation for node-2
    type: create_namespace_invitation
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node2: invitation

  # Settle so peer discovery is done before the join. Core gives the group key
  # 5s to arrive over gossip (join_group.rs:557) and answers a miss with a bare
  # HTTP 500; without this, that budget also has to cover finding the peer. See
  # group-late-joiner.yml for the full write-up.
  - name: Settle before node-2 joins the namespace
    type: wait
    seconds: 12

  - name: Node-2 joins namespace
    type: join_namespace
    node: e2e-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node2}}'

  - name: Node-2 joins context via group membership
    type: join_context
    node: e2e-node-2
    context_id: '{{ctx_id}}'

  # --- Node-3 joins ---

  - name: Create namespace invitation for node-3
    type: create_namespace_invitation
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node3: invitation

  # Settle so peer discovery is done before the join. Core gives the group key
  # 5s to arrive over gossip (join_group.rs:557) and answers a miss with a bare
  # HTTP 500; without this, that budget also has to cover finding the peer. See
  # group-late-joiner.yml for the full write-up.
  - name: Settle before node-3 joins the namespace
    type: wait
    seconds: 12

  - name: Node-3 joins namespace
    type: join_namespace
    node: e2e-node-3
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node3}}'

  - name: Node-3 joins context via group membership
    type: join_context
    node: e2e-node-3
    context_id: '{{ctx_id}}'

  # --- SCENARIO 1: node-1 writes, all three converge ---

  - name: Node-1 writes key-A
    type: call
    node: e2e-node-1
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "key_a"
      value: "from_node1"

  - name: Wait for sync after node-1 write
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
      - e2e-node-3
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Node-2 reads key-A
    type: call
    node: e2e-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "key_a"
    outputs:
      key_a_node2: result

  - name: Assert key-A on node-2
    type: json_assert
    statements:
      - 'json_equal({{key_a_node2}}, {"output": "from_node1"})'

  - name: Node-3 reads key-A
    type: call
    node: e2e-node-3
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "key_a"
    outputs:
      key_a_node3: result

  - name: Assert key-A on node-3
    type: json_assert
    statements:
      - 'json_equal({{key_a_node3}}, {"output": "from_node1"})'

  # --- SCENARIO 2: node-2 writes, node-1 and node-3 converge ---

  - name: Node-2 writes key-B
    type: call
    node: e2e-node-2
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "key_b"
      value: "from_node2"

  - name: Wait for sync after node-2 write
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
      - e2e-node-3
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Node-1 reads key-B
    type: call
    node: e2e-node-1
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "key_b"
    outputs:
      key_b_node1: result

  - name: Assert key-B on node-1
    type: json_assert
    statements:
      - 'json_equal({{key_b_node1}}, {"output": "from_node2"})'

  - name: Node-3 reads key-B
    type: call
    node: e2e-node-3
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "key_b"
    outputs:
      key_b_node3: result

  - name: Assert key-B on node-3
    type: json_assert
    statements:
      - 'json_equal({{key_b_node3}}, {"output": "from_node2"})'

  # --- SCENARIO 3: node-3 writes, node-1 and node-2 converge ---

  - name: Node-3 writes key-C
    type: call
    node: e2e-node-3
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "key_c"
      value: "from_node3"

  - name: Wait for sync after node-3 write
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
      - e2e-node-3
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Node-1 reads key-C
    type: call
    node: e2e-node-1
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "key_c"
    outputs:
      key_c_node1: result

  - name: Assert key-C on node-1
    type: json_assert
    statements:
      - 'json_equal({{key_c_node1}}, {"output": "from_node3"})'

  - name: Node-2 reads key-C
    type: call
    node: e2e-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "key_c"
    outputs:
      key_c_node2: result

  - name: Assert key-C on node-2
    type: json_assert
    statements:
      - 'json_equal({{key_c_node2}}, {"output": "from_node3"})'

  # --- SCENARIO 4: verify full state visibility on all nodes ---

  - name: Node-1 reads all entries
    type: call
    node: e2e-node-1
    context_id: '{{ctx_id}}'
    method: entries
    outputs:
      entries_node1: result

  - name: Node-2 reads all entries
    type: call
    node: e2e-node-2
    context_id: '{{ctx_id}}'
    method: entries
    outputs:
      entries_node2: result

  - name: Node-3 reads all entries
    type: call
    node: e2e-node-3
    context_id: '{{ctx_id}}'
    method: entries
    outputs:
      entries_node3: result

  - name: Assert all nodes see same entry count
    type: json_assert
    statements:
      - 'json_equal({{entries_node1}}, {{entries_node2}})'
      - 'json_equal({{entries_node2}}, {{entries_node3}})'

stop_all_nodes: false
