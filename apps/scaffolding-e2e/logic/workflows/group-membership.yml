name: E2E KV Store - Group Membership
description: >
  Tests group membership operations: adding members to a subgroup,
  verifying member lists, removing members, and verifying removed
  members lose access. This is the core scenario for the namespace
  signing key hierarchy fix.

force_pull_image: false
nuke_on_start: true
near_devnet: false

# ⚠️ REQUIRED, and its absence is why namespace joins kept dying on
# `KeyDelivery timed out`.
#
# Without it, `merod init`'s default `bootstrap.nodes` survives — the PUBLIC
# calimero devnet boot-node. Every container then spends its startup dialing
# unreachable public addresses, and the node log fills with
#
#     libp2p_relay: Dropping in-flight connect request because we are at capacity
#     autonat: ✗ Address /ip4/52.226.124.20/udp/... test failed
#
# until the join gives up with
#
#     join_group: direct namespace-join request found no reachable mesh peer
#     join_group: join response contained no group key
#     KeyDelivery timed out for group ContextGroupId(...)
#
# The peers never found each other; it was never a timing race. `e2e_mode`
# clears `bootstrap.nodes`, gives the workflow its own rendezvous namespace,
# turns multicast discovery on (which is what populates the kad table on a
# single Docker bridge) and tightens the sync intervals. merobox's own
# `apply_e2e_defaults` documents measuring this exact failure with it off.
e2e_mode: true

nodes:
  count: 3
  image: ghcr.io/calimero-network/merod:0.11.0-rc.28
  # rc.26 made mDNS opt-in (core#3620) and merobox does not pass the flag,
  # so discovery changed at the image bump. Stated, not inherited.
  mdns: true
  prefix: e2e-node

steps:
  # --- Setup: install app, create namespace, invite all nodes ---

  - name: Install application on node-1
    type: install_application
    node: e2e-node-1
    path: res/scaffolding_e2e.wasm
    dev: true
    outputs:
      app_id: applicationId

  # ⚠️ The nodes must be UP before the first admin call. merobox waits for
  # container health, which is not the same as ready: on a genuinely cold
  # host `create_namespace` returns 500 about four seconds into the run.
  # This was masked while the teardown left the previous scenario's
  # containers behind, because the nodes were then already warm.
  - name: Settle before the first admin call
    type: wait
    seconds: 20

  - name: Create namespace on node-1
    type: create_namespace
    node: e2e-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Invite node-2 to namespace
    type: create_namespace_invitation
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node2: invitation

  # Settle so peer discovery is done before the join. Core gives the group key
  # 5s to arrive over gossip (join_group.rs:557) and answers a miss with a bare
  # HTTP 500; without this, that budget also has to cover finding the peer. See
  # group-late-joiner.yml for the full write-up.
  - name: Settle before node-2 joins the namespace
    type: wait
    seconds: 12

  - name: Node-2 joins namespace
    type: join_namespace
    node: e2e-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node2}}'
    outputs:
      # BOTH halves, because the two membership endpoints disagree about which
      # one they take — verified against a real rc.24 node:
      #   * `add_group_members`    wants the base58 DEVICE key. An account gets
      #     `invalid identity: InvalidPublicKey(DecodeError(BufferTooSmall))`.
      #   * `remove_group_members` wants the 64-hex ACCOUNT. A device key gets
      #     `Invalid members JSON — members are accounts, 64 hex characters`.
      # Passing one where the other belongs fails loudly, which is the only
      # mercy here. Do not "simplify" these to a single variable.
      identity_node2: memberIdentity
      account_node2: memberAccount

  - name: Invite node-3 to namespace
    type: create_namespace_invitation
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node3: invitation

  # Settle so peer discovery is done before the join. Core gives the group key
  # 5s to arrive over gossip (join_group.rs:557) and answers a miss with a bare
  # HTTP 500; without this, that budget also has to cover finding the peer. See
  # group-late-joiner.yml for the full write-up.
  - name: Settle before node-3 joins the namespace
    type: wait
    seconds: 12

  - name: Node-3 joins namespace
    type: join_namespace
    node: e2e-node-3
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node3}}'
    outputs:
      account_node3: memberAccount

  # --- SCENARIO 1: List namespace members ---

  - name: List namespace members on node-1
    type: list_group_members
    node: e2e-node-1
    group_id: '{{namespace_id}}'
    outputs:
      ns_members: members

  - name: Assert namespace has members
    type: assert
    statements:
      - "is_set({{ns_members}})"

  # --- SCENARIO 2: Create subgroup and add member via add_group_members ---
  # This is the exact scenario that triggered the signing key bug:
  # create_group_in_namespace + add_group_members on the child group.

  - name: Create subgroup
    type: create_group_in_namespace
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    group_name: test-subgroup
    outputs:
      subgroup_id: groupId

  - name: Assert subgroup created
    type: assert
    statements:
      - "is_set({{subgroup_id}})"

  - name: Add node-2 to subgroup
    type: add_group_members
    node: e2e-node-1
    group_id: '{{subgroup_id}}'
    members:
      # Device key: see the capture note on the join step above.
      - identity: '{{identity_node2}}'
        role: Member

  # --- SCENARIO 3: Verify subgroup membership ---

  - name: List subgroup members
    type: list_group_members
    node: e2e-node-1
    group_id: '{{subgroup_id}}'
    outputs:
      subgroup_members: members

  - name: Assert subgroup has members
    type: assert
    statements:
      - "is_set({{subgroup_members}})"

  # --- SCENARIO 4: Create context in subgroup and verify it works ---

  - name: Create context in subgroup
    type: create_context
    node: e2e-node-1
    application_id: '{{app_id}}'
    group_id: '{{subgroup_id}}'
    outputs:
      sub_ctx_id: contextId

  - name: Assert subgroup context created
    type: assert
    statements:
      - "is_set({{sub_ctx_id}})"

  - name: Node-2 joins subgroup context
    type: join_context
    node: e2e-node-2
    context_id: '{{sub_ctx_id}}'
    outputs:
      sub_ctx_key_node2: memberPublicKey

  - name: Node-1 writes to subgroup context
    type: call
    node: e2e-node-1
    context_id: '{{sub_ctx_id}}'
    method: set
    args:
      key: "subgroup_key"
      value: "from_subgroup"

  - name: Wait for subgroup sync
    type: wait_for_sync
    context_id: '{{sub_ctx_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Node-2 reads subgroup context value
    type: call
    node: e2e-node-2
    context_id: '{{sub_ctx_id}}'
    method: get
    args:
      key: "subgroup_key"
    outputs:
      subgroup_read: result

  - name: Assert subgroup context synced
    type: json_assert
    statements:
      - 'json_equal({{subgroup_read}}, {"output": "from_subgroup"})'

  # --- SCENARIO 5: Node-3 (namespace member, NOT in subgroup) cannot call subgroup context ---
  # Node-3 joined the namespace but was never added to the subgroup.
  # A call to the subgroup context should fail.

  - name: Node-3 calls subgroup context (should fail - not a subgroup member)
    type: call
    node: e2e-node-3
    context_id: '{{sub_ctx_id}}'
    method: set
    args:
      key: "node3_key"
      value: "should_not_work"
    expected_failure: true
    outputs:
      node3_denied_error: error

  - name: Assert node-3 was actually refused
    type: assert
    statements:
      # `expected_failure: true` on its own can NEVER fail this run — it marks the
      # step allowed-to-fail, so a `set` that SUCCEEDED would pass just as
      # quietly. That is the wrong way round for an authorization test: the whole
      # regression being guarded is a non-member being ALLOWED to write, and this
      # step was the only thing standing in front of it.
      #
      # Capturing the error and asserting it is set is what turns
      # "we tolerated a failure" into "a failure was required".
      - "is_set({{node3_denied_error}})"

  # --- SCENARIO 6: Remove node-2 from subgroup and verify access revoked ---

  - name: Remove node-2 from subgroup
    type: remove_group_members
    node: e2e-node-1
    group_id: '{{subgroup_id}}'
    members:
      - '{{account_node2}}'

  - name: List subgroup members after removal
    type: list_group_members
    node: e2e-node-1
    group_id: '{{subgroup_id}}'
    outputs:
      subgroup_members_after: members

  # Node-2 was removed but node-1 (admin) should still be there
  - name: Assert subgroup still has admin member
    type: assert
    statements:
      - "is_set({{subgroup_members_after}})"

  # Verify node-2 can no longer write to the subgroup context
  - name: Node-2 writes to subgroup context after removal (should fail)
    type: call
    node: e2e-node-2
    context_id: '{{sub_ctx_id}}'
    method: set
    args:
      key: "revoked_key"
      value: "should_not_work"
    expected_failure: true
    outputs:
      node2_revoked_error: error

  - name: Assert the removal actually revoked write access
    type: assert
    statements:
      # Same trap, and the higher-stakes one: without this assertion a
      # `remove_group_members` that did not take effect leaves node-2 able to
      # write, the `set` succeeds, and `expected_failure` waves it through. The
      # test would report that access was revoked while it demonstrably was not.
      - "is_set({{node2_revoked_error}})"

  - name: Node-1 confirms the revoked write never landed
    type: call
    node: e2e-node-1
    context_id: '{{sub_ctx_id}}'
    method: get
    args:
      key: "revoked_key"
    outputs:
      revoked_key_value: result

  - name: Assert no value was written by the removed member
    type: json_assert
    statements:
      # The other half of the property, read from a node that IS still a member:
      # "the call errored" and "nothing was written" are different claims, and a
      # partial write that errors on the response path would satisfy only the
      # first.
      - 'json_equal({{revoked_key_value}}, {"output": null})'

  # --- SCENARIO 7: Get group info ---

  - name: Get subgroup info
    type: get_group_info
    node: e2e-node-1
    group_id: '{{subgroup_id}}'
    outputs:
      # There is no `data` field to capture: merobox hands back the group info
      # unwrapped, so the response IS the record — appKey, contextCount,
      # defaultCapabilities, groupId, groupStateHash, memberCount,
      # subgroupVisibility, targetApplicationId, upgradePolicy. Capture real
      # fields; `data` was the old envelope and is gone.
      group_id_echo: groupId
      group_member_count: memberCount

  - name: Assert group info returned
    type: assert
    statements:
      - "is_set({{group_id_echo}})"
      - "is_set({{group_member_count}})"

stop_all_nodes: false
