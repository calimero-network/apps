name: E2E KV Store - Group Late Joiner State Catch-Up
description: >
  Tests that a node joining a namespace after data already exists in a context
  correctly catches up to the pre-existing state. Node-1 writes several keys
  before node-2 joins, then node-2 joins and must see all pre-existing data as
  well as new writes after joining.

force_pull_image: false
nuke_on_start: true
near_devnet: false

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:0.11.0-rc.28
  # rc.26 made mDNS opt-in (core#3620) and merobox does not pass the flag,
  # so discovery changed at the image bump. Stated, not inherited.
  mdns: true
  prefix: e2e-node

steps:
  # --- Setup: node-1 alone creates namespace and context ---

  - name: Install application on node-1
    type: install_application
    node: e2e-node-1
    path: res/scaffolding_e2e.wasm
    dev: true
    outputs:
      app_id: applicationId

  - name: Assert application installed
    type: assert
    statements:
      - "is_set({{app_id}})"

  - name: Create namespace on node-1
    type: create_namespace
    node: e2e-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Create context in namespace on node-1
    type: create_context
    node: e2e-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      ctx_id: contextId

  # --- SCENARIO 1: node-1 writes data before anyone else joins ---

  - name: Node-1 writes pre-join key-1
    type: call
    node: e2e-node-1
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "pre_join_1"
      value: "written_before_join"

  - name: Node-1 writes pre-join key-2
    type: call
    node: e2e-node-1
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "pre_join_2"
      value: "also_before_join"

  - name: Node-1 writes pre-join key-3
    type: call
    node: e2e-node-1
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "pre_join_3"
      value: "third_before_join"

  # --- Node-2 joins after data exists ---

  - name: Create namespace invitation for node-2
    type: create_namespace_invitation
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      namespace_invitation: invitation

  # Let the two nodes actually find each other before the join.
  #
  # This is the fix for an intermittent HTTP 500 on the step below, whose node
  # side reads:
  #
  #   KeyDelivery timed out for group ContextGroupId(..): no group key arrived
  #   within 5s via the gossip fallback path; join cannot proceed without a
  #   usable group key                              (join_group.rs:557)
  #
  # Note what that error is NOT: the accompanying log line says
  # `projected=Some(Member) live=Some(Member)`, so the membership is fine. Only
  # the group KEY missed its window — and core allows exactly 5s for it to
  # arrive over gossip. Before this wait, node-2 was never touched by any
  # earlier step: `join_namespace` was its FIRST action, issued milliseconds
  # after the invitation was minted, so those 5s had to cover cold peer
  # discovery as well as the key transfer. On an unloaded machine they do, which
  # is why this passed locally and failed on busy runners — and it fails as a
  # bare 500 that reads like a contract or permission problem rather than a
  # timing one.
  #
  # MEASURED, on the run that failed handler-test.yml the same way:
  #
  #   12:03:11.95  node-2 container starts
  #   12:03:17.61  invitation created
  #   12:03:17.61  join_namespace issued   <- node-2 is 5.7s old
  #        +5s     KeyDelivery times out
  #
  # Every scenario boots fresh nodes, and the steps before the join (install,
  # create namespace, create context) take only a few seconds — so mDNS
  # discovery AND the key transfer had under 6 seconds between them. mDNS is
  # already on (`mdns: true`, required since rc.26 made it opt-in via
  # core#3620), so this is discovery LATENCY, not discovery being disabled.
  #
  # 12s and not 5s, because 5s merely doubled a budget that was already too
  # small; the total cost is ~12s x 15 joins against a 22-minute job. There is
  # no better instrument available today: merobox steps take no retry config,
  # and `api_assertion` asserts once rather than polling, so a genuine
  # wait-for-peer-connectivity gate does not exist. If joins still flake at 12s,
  # stop widening this and fix core — the 5s KeyDelivery fallback window in
  # join_group.rs is not reachable from a workflow.
  - name: Settle before node-2 joins
    type: wait
    seconds: 12

  - name: Node-2 joins namespace
    type: join_namespace
    node: e2e-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{namespace_invitation}}'

  # The context was created before node-2 knew the namespace existed, so pull
  # namespace state explicitly rather than hoping the join carried it. Without
  # this, join_context below can fail with "context not found" — the same race
  # one level down.
  - name: Force node-2 to sync namespace state
    type: sync_group
    node: e2e-node-2
    group_id: '{{namespace_id}}'

  - name: Settle after namespace sync
    type: wait
    seconds: 5

  - name: Node-2 joins context via group membership
    type: join_context
    node: e2e-node-2
    context_id: '{{ctx_id}}'

  - name: Wait for node-2 to catch up to existing state
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 90
    check_interval: 3
    trigger_sync: true

  # --- Verify node-2 sees all pre-existing state ---

  - name: Node-2 reads pre-join key-1
    type: call
    node: e2e-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "pre_join_1"
    outputs:
      pre1_node2: result

  - name: Assert pre-join key-1 on node-2
    type: json_assert
    statements:
      - 'json_equal({{pre1_node2}}, {"output": "written_before_join"})'

  - name: Node-2 reads pre-join key-2
    type: call
    node: e2e-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "pre_join_2"
    outputs:
      pre2_node2: result

  - name: Assert pre-join key-2 on node-2
    type: json_assert
    statements:
      - 'json_equal({{pre2_node2}}, {"output": "also_before_join"})'

  - name: Node-2 reads pre-join key-3
    type: call
    node: e2e-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "pre_join_3"
    outputs:
      pre3_node2: result

  - name: Assert pre-join key-3 on node-2
    type: json_assert
    statements:
      - 'json_equal({{pre3_node2}}, {"output": "third_before_join"})'

  # --- SCENARIO 2: writes after join sync normally ---

  - name: Node-1 writes post-join key
    type: call
    node: e2e-node-1
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "post_join"
      value: "written_after_join"

  - name: Wait for post-join sync
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Node-2 reads post-join key
    type: call
    node: e2e-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "post_join"
    outputs:
      post_join_node2: result

  - name: Assert post-join key on node-2
    type: json_assert
    statements:
      - 'json_equal({{post_join_node2}}, {"output": "written_after_join"})'

  - name: Node-2 writes after joining
    type: call
    node: e2e-node-2
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "node2_post_join"
      value: "node2_wrote_this"

  - name: Wait for node-2 post-join write to sync
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Node-1 reads node-2 post-join key
    type: call
    node: e2e-node-1
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "node2_post_join"
    outputs:
      node2_post_join_node1: result

  - name: Assert node-2 post-join write visible on node-1
    type: json_assert
    statements:
      - 'json_equal({{node2_post_join_node1}}, {"output": "node2_wrote_this"})'

  # --- SCENARIO 3: verify full entry count matches across both nodes ---

  - name: Node-1 reads entry count
    type: call
    node: e2e-node-1
    context_id: '{{ctx_id}}'
    method: len
    outputs:
      len_node1: result

  - name: Node-2 reads entry count
    type: call
    node: e2e-node-2
    context_id: '{{ctx_id}}'
    method: len
    outputs:
      len_node2: result

  - name: Assert both nodes see same entry count
    type: json_assert
    statements:
      - 'json_equal({{len_node1}}, {{len_node2}})'

stop_all_nodes: false
