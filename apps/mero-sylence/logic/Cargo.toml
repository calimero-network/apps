[package]
name = "mero-sylence"
description = "Meeting transcripts and action items a browser extension records, on the component SDK"
# NOT the release version: the release workflow takes the next appVersion from
# the registry and passes it to `meroctl app pack --app-version`.
version = "0.1.0"
edition = "2021"
authors = ["Calimero Limited <info@calimero.network>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/calimero-network/apps"
publish = false

[lib]
# A `calimero:app` component; the tests run the BUILT component on core's engine.
crate-type = ["cdylib"]

# Core at `component-core-tag` (root Cargo.toml); scripts/check-component-pins.py asserts it.
[dependencies]
calimero-sdk = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.37" }
serde = { version = "1", features = ["derive"] }
# Meeting and action ids are random bytes from the host, rendered as hex.
hex = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-sdk       = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.37", features = ["testing"] }
calimero-app-build = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.37" }
serde_json = "1"

# Read by `meroctl app pack`.
[package.metadata.calimero]
package = "com.calimero.mero-sylence"
name = "Sylence"
description = "Transcribe your calls on Google Meet, Zoom and Teams with a browser extension. Speech is turned into text on your own laptop, and the transcript and action items are kept in your workspace."
author = "Calimero"
# The slug IS the package id: a deep link resolves by `Application.package`.
slug = "com.calimero.mero-sylence"
# A real icon, not a placeholder (check-app-icons.py).
icon = "../app/public/icon-512.png"
category = "productivity"
tags = ["meetings", "transcription", "notes", "action items", "productivity"]
github = "https://github.com/calimero-network/apps"
# `component-min-runtime-version` in the root Cargo.toml.
min-runtime-version = "1.0.0-rc.37"
# The listing's link. The production frontend is the one packed below: a Cloud
# node trusts passkey ceremonies only from frontends it serves from a bundle.
frontend = "https://mero-sylence.vercel.app"
# The built frontend the bundle carries. Build it first: `pnpm -F mero-sylence build`.
frontend-dir = "../app/dist"

# Standalone: excluded from the root workspace (root Cargo.toml), its own Cargo.lock.
[workspace]
