  type: call
  app: '{{context_id}}'
  method: record_action
  args:
    input:
      app: chat
      source_context: ctx-dm
      source_label: DM · Jordan
      method: send_message
      category: ''
      writes: true
      undoable: true
      title: Reply to Jordan with the terms
      body: ''
      why: Jordan asked for the terms.
      outcome: proposed
      intent_hash: ''
      executor: ''
      note: ''
      chain: ''
      ask:
        kind: reply
        prompt: Send to Jordan
        options: []
        draft: 'Terms attached: 12 months, net 30.'
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    default_id: result.id
    default_chain: result.chain
- name: The agent proposes a second one, which the owner will stop
  type: call
  app: '{{context_id}}'
  method: record_action
  args:
    input:
      app: chat
      source_context: ctx-dm
      source_label: DM · Priya
      method: send_message
      category: ''
      writes: true
      undoable: true
      title: Reply to Priya about the budget
      body: ''
      why: Priya asked.
      outcome: proposed
      intent_hash: ''
      executor: ''
      note: ''
      chain: ''
      ask:
        kind: reply
        prompt: Send to Priya
        options: []
        draft: Budget is fine.
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    stopped_default_id: result.id
- name: A lease on the reply's chain gives a time 15 s ahead
  type: call
  app: '{{context_id}}'
  method: claim_chain
  args:
    chain: '{{default_chain}}'
    session: clock
    ttl_ms: 15000
    agent: mero-bot@studio
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    default_at: result.expires_at
- name: The agent sets the reply to go ahead then
  type: call
  app: '{{context_id}}'
  method: schedule_autorun
  args:
    id: '{{default_id}}'
    at: '{{default_at}}'
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    default_scheduled: rpc
- name: The agent sets the second one too
  type: call
  app: '{{context_id}}'
  method: schedule_autorun
  args:
    id: '{{stopped_default_id}}'
    at: '{{default_at}}'
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    second_scheduled: rpc
- name: node-2 cannot stop a default
  type: call
  app: '{{context_id}}'
  method: stop_autorun
  args:
    id: '{{stopped_default_id}}'
  account: feed-node-2
  as_key: '{{public_key_feed-node-2}}'
  expected_failure: true
  outputs:
    intruder_stop_error: error
- name: The owner stops the second one
  type: call
  app: '{{context_id}}'
  method: stop_autorun
  args:
    id: '{{stopped_default_id}}'
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    default_stopped: rpc
- name: The reply does not go ahead before its time
  type: call
  app: '{{context_id}}'
  method: fire_autorun
  args:
    id: '{{default_id}}'
  account: feed-node-1
  as_key: '{{owner_key}}'
  expected_failure: true
  outputs:
    early_fire_error: error
- name: Let the time come
  type: wait
  seconds: 18.0
- name: The runtime fires the reply
  type: call
  app: '{{context_id}}'
  method: fire_autorun
  args:
    id: '{{default_id}}'
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    default_fired: rpc
- name: The stopped one never goes ahead
  type: call
  app: '{{context_id}}'
  method: fire_autorun
  args:
    id: '{{stopped_default_id}}'
  account: feed-node-1
  as_key: '{{owner_key}}'
  expected_failure: true
  outputs:
    stopped_fire_error: error
- name: Let the defaults reach node-2
  type: wait
  seconds: 1.0
- name: node-2 reads the defaults
  type: call
  app: '{{context_id}}'
  method: autoruns
  args: {}
  account: feed-node-2
  as_key: '{{public_key_feed-node-2}}'
  outputs:
    autoruns_on_2: rpc
- name: Assert the defaults
  type: json_assert
  statements:
  - 'json_subset({{default_scheduled}}, {"output": {"id": "{{default_id}}", "status": "waiting"}})'
  - 'json_subset({{second_scheduled}}, {"output": {"status": "waiting"}})'
  - 'json_subset({{default_stopped}}, {"output": {"id": "{{stopped_default_id}}", "status": "stopped"}})'
  - 'json_subset({{default_fired}}, {"output": {"id": "{{default_id}}", "status": "approved", "note":
    "Terms attached: 12 months, net 30."}})'
- name: Assert the refused defaults
  type: assert
  statements:
  - is_set({{intruder_stop_error}})
  - is_set({{early_fire_error}})
  - is_set({{stopped_fire_error}})
  - is_set({{autoruns_on_2}})
