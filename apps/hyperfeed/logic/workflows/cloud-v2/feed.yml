# Ported from feed.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: Hyperfeed E2E
description: 'The owner''s node records what their agent did and what their apps sent, then approves,
  undoes and mutes from it; a second node in the same context reads the same feed and is refused every
  write.

  The Rust tests cover the rules in-process. This covers what they cannot: every method called over the
  wire on a real merod (argument names, the `input` wrappers, a guard that turns a proposal pending),
  the feed converging on a second node, and the owner check holding for a node that is not the owner''s.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3020
accounts:
- feed-node-1
- feed-node-2
steps:
- name: Install application on feed-node-1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/hyperfeed.wasm'
  outputs:
    app_id_bundle: hash
  account: feed-node-1
- type: set
  values:
    app_id: com.calimero.hyperfeed
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Settle before the mesh joins
  type: wait
  seconds: 1.0
- name: Create mesh with node-2
  type: create_org
  account: feed-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: feed-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: feed-node-2
  token: '{{_mesh_invite}}'
- name: Create mesh with node-2
  type: deploy
  account: feed-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.APPS_WASM_DIR}}/hyperfeed.wasm'
  app_name: Create mesh with node-2
  init_args: '{}'
  outputs:
    context_id: contextId
    owner_key: memberPublicKey
- name: Verify mesh keys are populated
  type: assert
  statements:
  - is_set({{context_id}})
  - is_set({{owner_key}})
  - is_set({{public_key_feed-node-2}})
- name: Owner lets the agent act in chat
  type: call
  app: '{{context_id}}'
  method: set_policy
  args:
    app_key: chat
    agent: act
    notifications: push
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: Owner turns the "invite" guard on
  type: call
  app: '{{context_id}}'
  method: set_guard
  args:
    category: invite
    enabled: true
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: Owner sets what mero-bot may reach
  type: call
  app: '{{context_id}}'
  method: set_access
  args:
    agent: mero-bot@laptop
    folders:
    - path: ~/workspace
      write: true
    - path: /srv/specs
      write: false
    shell: false
    web: true
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: The agent reports what it can reach
  type: call
  app: '{{context_id}}'
  method: agent_reach
  args:
    name: mero-bot@laptop
    lines:
    - serves: default
      profile: near
      model: glm
      attested: true
      folders: []
      shell: false
      web: false
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: Owner assigns code to the laptop's agent
  type: call
  app: '{{context_id}}'
  method: set_assignment
  args:
    app_key: mero-bot
    agent: mero-bot@laptop
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: Owner reads the settings
  type: call
  app: '{{context_id}}'
  method: settings
  args: {}
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    settings_1: rpc
    access_1: result.access.0
    reach_1: result.reach.0
    reach_line_1: result.reach.0.lines.0
    assignment_1: result.assignments.0
- name: Assert the policy and the guard are stored
  type: json_assert
  statements:
  - 'json_subset({{settings_1}}, {"output": {"paused": false, "policies": [{"app": "chat", "agent": "act",
    "notifications": "push"}], "message_modes": []}})'
  - 'json_subset({{assignment_1}}, {"app": "mero-bot", "agent": "mero-bot@laptop"})'
  - 'json_subset({{access_1}}, {"agent": "mero-bot@laptop", "folders": [{"path": "~/workspace", "write":
    true}, {"path": "/srv/specs", "write": false}], "shell": false, "web": true})'
  - 'json_subset({{reach_1}}, {"agent": "mero-bot@laptop"})'
  - 'json_subset({{reach_line_1}}, {"serves": "default", "profile": "near", "attested": true, "folders":
    [], "shell": false, "web": false})'
- name: Owner adds a cloud agent's own account
  type: call
  app: '{{context_id}}'
  method: add_agent_account
  args:
    account: cloud-agent-account
    name: cloud
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: A second account cannot take the same name
  type: call
  app: '{{context_id}}'
  method: add_agent_account
  args:
    account: another-account
    name: cloud
  account: feed-node-1
  as_key: '{{owner_key}}'
  expected_failure: true
  outputs:
    agent_name_error: error
- name: Owner reads the agent accounts
  type: call
  app: '{{context_id}}'
  method: settings
  args: {}
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    agent_account_1: result.agent_accounts.0
- name: Assert the cloud agent is listed under its name
  type: json_assert
  statements:
  - 'json_subset({{agent_account_1}}, {"account": "cloud-agent-account", "name": "cloud"})'
- name: Assert the name stayed with its account
  type: assert
  statements:
  - is_set({{agent_name_error}})
- name: Owner removes the cloud agent
  type: call
  app: '{{context_id}}'
  method: remove_agent_account
  args:
    account: cloud-agent-account
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: Owner reads the agent accounts again
  type: call
  app: '{{context_id}}'
  method: settings
  args: {}
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    settings_no_agents: rpc
- name: Assert no agent account is left
  type: json_assert
  statements:
  - 'json_subset({{settings_no_agents}}, {"output": {"agent_accounts": []}})'
- name: The agent checks before acting in chat
  type: call
  app: '{{context_id}}'
  method: check_action
  args:
    app_key: chat
    category: ''
    writes: true
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    verdict_chat: rpc
- name: The agent checks before signing
  type: call
  app: '{{context_id}}'
  method: check_action
  args:
    app_key: sign
    category: sign
    writes: true
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    verdict_sign: rpc
- name: Assert chat is act and signing needs you
  type: json_assert
  statements:
  - 'json_subset({{verdict_chat}}, {"output": {"decision": "act"}})'
  - 'json_subset({{verdict_sign}}, {"output": {"decision": "ask"}})'
- name: The agent proposes the actions it learned for Issues
  type: call
  app: '{{context_id}}'
  method: propose_actions
  args:
    app_key: issues
    application_id: issues-app-1
    summary: Reading and closing issues
    actions:
    - id: read
      label: Read issues
      description: ''
      category: ''
      writes: false
      methods:
      - get_issue
    - id: close
      label: Close issues
      description: ''
      category: ''
      writes: true
      methods:
      - close_issue
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    actions_proposed: rpc
- name: Owner approves them
  type: call
  app: '{{context_id}}'
  method: decide_actions
  args:
    app_key: issues
    application_id: issues-app-1
    decision: approve
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    actions_approved: rpc
- name: Owner lets the agent close issues without asking
  type: call
  app: '{{context_id}}'
  method: set_action_mode
  args:
    app_key: issues
    action: close
    mode: act
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: The agent checks before closing an issue
  type: call
  app: '{{context_id}}'
  method: check_action
  args:
    app_key: issues
    category: ''
    writes: true
    method: close_issue
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    verdict_close: rpc
- name: The agent checks before a call no action names
  type: call
  app: '{{context_id}}'
  method: check_action
  args:
    app_key: issues
    category: ''
    writes: false
    method: drop_board
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    verdict_unnamed: rpc
- name: Owner lists the actions
  type: call
  app: '{{context_id}}'
  method: action_sets
  args: {}
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    actions_1: result.0
- name: Assert the actions decide, and your setting for one applies
  type: json_assert
  statements:
  - 'json_subset({{actions_proposed}}, {"output": {"app": "issues", "status": "proposed"}})'
  - 'json_subset({{actions_approved}}, {"output": {"status": "approved"}})'
  - 'json_subset({{verdict_close}}, {"output": {"decision": "act"}})'
  - 'json_subset({{verdict_unnamed}}, {"output": {"decision": "ask"}})'
  - 'json_subset({{actions_1}}, {"app": "issues", "application_id": "issues-app-1", "status": "approved"})'
- name: The agent records the stand-up it posted
  type: call
  app: '{{context_id}}'
  method: record_action
  args:
    input:
      app: chat
      source_context: ctx-standup
      source_label: '#eng-standup'
      method: send_message
      category: ''
      writes: true
      undoable: true
      title: Posted your stand-up
      body: ''
      why: Daily routine you set up.
      outcome: done
      intent_hash: a91f3c07
      executor: relay-account
      note: ''
      chain: ''
      ask:
        kind: ''
        prompt: ''
        options: []
        draft: ''
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    standup_id: result.id
    standup: rpc
- name: Assert the stand-up is done and clean
  type: json_assert
  statements:
  - 'json_subset({{standup}}, {"output": {"kind": "action", "status": "done", "breach": "", "needs_you":
    false}})'
- name: The agent proposes a signature
  type: call
  app: '{{context_id}}'
  method: record_action
  args:
    input:
      app: sign
      source_context: ctx-legal
      source_label: Acme · Legal
      method: request_signature
      category: sign
      writes: true
      undoable: false
      title: Prepared the vendor NDA for your signature
      body: ''
      why: 'Asked for in #launch.'
      outcome: proposed
      intent_hash: ''
      executor: ''
      note: ''
      chain: ''
      ask:
        kind: ''
        prompt: ''
        options: []
        draft: ''
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    nda_id: result.id
    nda: rpc
- name: Assert the signature waits for you
  type: json_assert
  statements:
  - 'json_subset({{nda}}, {"output": {"status": "pending", "needs_you": true}})'
- name: The client records a mention
  type: call
  app: '{{context_id}}'
  method: record_notification
  args:
    input:
      key: ctx-launch:root-1:0
      app: chat
      source_context: ctx-launch
      source_label: '#launch'
      from: Maya
      title: Mentioned you
      body: Can your agent pull the numbers?
      event: MessageSent
      needs_you: true
      chain: ''
      ask:
        kind: ''
        prompt: ''
        options: []
        draft: ''
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: The client records a poll that closes soon
  type: call
  app: '{{context_id}}'
  method: record_notification
  args:
    input:
      key: ctx-offsite:root-7:0
      app: vote
      source_context: ctx-offsite
      source_label: Team offsite
      from: Priya
      title: Poll closes tomorrow
      body: ''
      event: PollClosingSoon
      needs_you: false
      chain: ''
      ask:
        kind: ''
        prompt: ''
        options: []
        draft: ''
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: Owner reads what needs them
  type: call
  app: '{{context_id}}'
  method: feed
  args:
    filter: needs_you
    app_key: ''
    limit: 0
    before: 0
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    needs_1: rpc
- name: Assert the signature and the mention need the owner
  type: json_assert
  statements:
  - 'json_subset({{needs_1}}, {"output": {"counts": {"all": 4, "agent": 2, "notifications": 2, "needs_you":
    2}}})'
- name: Owner approves the signature
  type: call
  app: '{{context_id}}'
  method: resolve_action
  args:
    id: '{{nda_id}}'
    decision: approve
    answer: ''
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: The agent reports the signature done
  type: call
  app: '{{context_id}}'
  method: complete_action
  args:
    id: '{{nda_id}}'
    outcome: done
    note: signed
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: Owner asks for the stand-up to be undone
  type: call
  app: '{{context_id}}'
  method: resolve_action
  args:
    id: '{{standup_id}}'
    decision: undo
    answer: ''
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: Owner reads the stand-up
  type: call
  app: '{{context_id}}'
  method: item
  args:
    id: '{{standup_id}}'
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    standup_after: rpc
- name: Assert the undo is waiting on the agent
  type: json_assert
  statements:
  - 'json_subset({{standup_after}}, {"output": {"status": "undo_requested"}})'
- name: Owner marks the mention seen
  type: call
  app: '{{context_id}}'
  method: mark_seen
  args:
    ids:
    - ctx-launch:root-1:0
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: Owner marks everything else seen
  type: call
  app: '{{context_id}}'
  method: mark_all_seen
  args: {}
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: Owner mutes vote
  type: call
  app: '{{context_id}}'
  method: set_policy
  args:
    app_key: vote
    agent: 'off'
    notifications: mute
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: Owner pauses the agent
  type: call
  app: '{{context_id}}'
  method: set_paused
  args:
    paused: true
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: The client records a mention you can reply to
  type: call
  app: '{{context_id}}'
  method: record_notification
  args:
    input:
      key: ctx-launch:r1>r2:0
      app: chat
      source_context: ctx-launch
      source_label: '#launch'
      from: Maya
      title: Mentioned you
      body: Can your agent pull the numbers?
      event: MessageSent
      needs_you: true
      chain: ''
      ask:
        kind: reply
        prompt: 'Reply in #launch'
        options:
        - On it
        - After 2pm
        draft: ''
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    mention_id: result.id
- name: The agent continues that chain with a proposal that offers a choice
  type: call
  app: '{{context_id}}'
  method: record_action
  args:
    input:
      app: calendar
      source_context: ctx-cal
      source_label: Design team
      method: create_event
      category: ''
      writes: true
      undoable: true
      title: Book a slot to go through the numbers with Maya
      body: ''
      why: Maya asked for the numbers before 2.
      outcome: proposed
      intent_hash: ''
      executor: ''
      note: ''
      chain: '{{mention_id}}'
      ask:
        kind: choose
        prompt: Pick a slot
        options:
        - Thu 15:00
        - Fri 10:00
        draft: ''
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    slot_id: result.id
- name: Owner reads the feed as chains
  type: call
  app: '{{context_id}}'
  method: chain
  args:
    chain: '{{mention_id}}'
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    flow_first: result.0
    flow_second: result.1
- name: Assert the mention and the proposal are one flow, oldest first
  type: json_assert
  statements:
  - 'json_subset({{flow_first}}, {"kind": "notification", "chain_len": 2, "status": "received"})'
  - 'json_subset({{flow_second}}, {"kind": "action", "chain_len": 2, "status": "pending"})'
- name: Owner picks a slot
  type: call
  app: '{{context_id}}'
  method: resolve_action
  args:
    id: '{{slot_id}}'
    decision: approve
    answer: Fri 10:00
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    slot_after: rpc
- name: Owner replies to Maya from the feed
  type: call
  app: '{{context_id}}'
  method: answer_notification
  args:
    id: '{{mention_id}}'
    answer: Numbers are in the deck, slide 4.
  account: feed-node-1
  as_key: '{{owner_key}}'
- name: The agent reports the reply delivered
  type: call
  app: '{{context_id}}'
  method: complete_answer
  args:
    id: '{{mention_id}}'
    outcome: delivered
    note: 'Sent in #launch'
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    mention_after: rpc
- name: Assert the slot carries your pick and the reply was delivered
  type: json_assert
  statements:
  - 'json_subset({{slot_after}}, {"output": {"status": "approved", "note": "Fri 10:00"}})'
  - 'json_subset({{mention_after}}, {"output": {"status": "delivered", "needs_you": false}})'
- name: Owner asks the agent about the mention's chain
  type: call
  app: '{{context_id}}'
  method: say
  args:
    chain: '{{mention_id}}'
    text: Which numbers did you send Maya?
    mode: private
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    question_id: result.id
    question_posted: rpc
- name: Assert the question says how private it is
  type: json_assert
  statements:
  - 'json_subset({{question_posted}}, {"output": {"from": "you", "mode": "private"}})'
- name: The agent's open questions hold it
  type: call
  app: '{{context_id}}'
  method: open_questions
  args: {}
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    open_first: result.0
- name: The agent takes the question up
  type: call
  app: '{{context_id}}'
  method: agent_ack
  args:
    id: '{{question_id}}'
    status: thinking
    note: ''
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    thinking: rpc
- name: The agent reports its latest step while it works
  type: call
  app: '{{context_id}}'
  method: agent_progress
  args:
    id: '{{question_id}}'
    doing: Reading the deck
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    working: rpc
- name: Assert the step shows on the message, not as a step in its history
  type: json_assert
  statements:
  - 'json_subset({{working}}, {"output": {"status": "thinking", "doing": "Reading the deck"}})'
- name: The agent attaches its steps and the answer so far to the message
  type: call
  app: '{{context_id}}'
  method: agent_work
  args:
    id: '{{question_id}}'
    steps:
    - id: t1
      title: Reading the deck
      status: done
      at: 1
    draft: Q3 revenue
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    worked: rpc
- name: Assert the steps and the draft show on the message, with no row of their own
  type: json_assert
  statements:
  - 'json_subset({{worked}}, {"output": {"status": "thinking", "draft": "Q3 revenue"}})'
  - 'json_subset({{worked}}, {"output": {"steps": [{"id": "t1", "title": "Reading the deck", "status":
    "done", "at": 1}]}})'
- name: The agent answers in the same chain
  type: call
  app: '{{context_id}}'
  method: agent_say
  args:
    chain: '{{mention_id}}'
    reply_to: '{{question_id}}'
    text: Q3 revenue and churn, slide 4.
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    answer: rpc
- name: Owner reads the question after the answer
  type: call
  app: '{{context_id}}'
  method: item
  args:
    id: '{{question_id}}'
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    question_after: rpc
- name: Assert the conversation went waiting, thinking, answered
  type: json_assert
  statements:
  - 'json_subset({{open_first}}, {"kind": "message", "from": "you", "status": "waiting"})'
  - 'json_subset({{thinking}}, {"output": {"status": "thinking"}})'
  - 'json_subset({{answer}}, {"output": {"kind": "message", "from": "agent", "chain": "{{mention_id}}",
    "reply_to": "{{question_id}}"}})'
  - 'json_subset({{question_after}}, {"output": {"status": "answered"}})'
- name: The agent adds a long note with a headline, which titles its row
  type: call
  app: '{{context_id}}'
  method: agent_say
  args:
    chain: '{{mention_id}}'
    reply_to: ''
    text: 'The numbers, slide by slide: revenue, churn, pipeline, and what changed since Q2.'
    headline: The Q3 numbers
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    headlined: rpc
- name: Assert the headline is the row's title, the text its body
  type: json_assert
  statements:
  - 'json_subset({{headlined}}, {"output": {"kind": "message", "headline": "The Q3 numbers", "title":
    "The Q3 numbers", "status": "said"}})'
  - 'json_subset({{answer}}, {"output": {"headline": ""}})'
- name: The agent asks the owner something back
  type: call
  app: '{{context_id}}'
  method: agent_ask
  args:
    chain: '{{mention_id}}'
    reply_to: ''
    text: Send Maya the deck too?
    ask:
      kind: choose
      prompt: Send the deck?
      options:
      - Send it
      - Not now
      draft: ''
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    agent_question: rpc
    agent_question_id: result.id
- name: The owner answers in the chain
  type: call
  app: '{{context_id}}'
  method: say
  args:
    chain: '{{mention_id}}'
    text: Send it
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    owner_answer: rpc
- name: Owner reads the agent's question after the answer
  type: call
  app: '{{context_id}}'
  method: item
  args:
    id: '{{agent_question_id}}'
  account: feed-node-1
  as_key: '{{owner_key}}'
  outputs:
    agent_question_after: rpc
- name: Assert the agent's question went asked, then answered by the owner's words
  type: json_assert
  statements:
  - 'json_subset({{agent_question}}, {"output": {"kind": "message", "from": "agent", "status": "asked",
    "ask": {"kind": "choose"}}})'
