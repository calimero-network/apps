    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_pr
    args:
      input: { chain: "{{mention_id}}", repo: "calimero-network/apps", pr: 430, title: "Stacked follow-up", state: "open", draft: false, base: "mero-bot/chain-429", default_branch: "master", conflicts: false, head_sha: "def456", checks: "green", checks_total: 5, checks_passed: 5, checks_pending: 0, failing: [], stacked_on: 429, stacked_merged: false }
    outputs:
      stacked_pr: result

  - name: The PR card reads the chain's PRs
    type: call
