name: Hyperfeed E2E
description: >
  The owner's node records what their agent did and what their apps sent, then
  approves, undoes and mutes from it; a second node in the same context reads
  the same feed and is refused every write.

  The Rust tests cover the rules in-process. This covers what they cannot:
  every method called over the wire on a real merod (argument names, the
  `input` wrappers, a guard that turns a proposal pending), the feed converging
  on a second node, and the owner check holding for a node that is not the
  owner's.

force_pull_image: false
nuke_on_start: true
near_devnet: false

# Clears the public devnet bootstrap nodes and turns local discovery on; without
# it the mesh join dies on `KeyDelivery timed out`.
e2e_mode: true

nodes:
  count: 2
  # Matched to the calimero-sdk tag in the root Cargo.toml.
  image: ghcr.io/calimero-network/merod:0.11.0-rc.83
  prefix: feed-node
  mdns: true

steps:
  - name: Install application on feed-node-1
    type: install_application
    node: feed-node-1
    path: dist/com.calimero.hyperfeed.mpk
    dev: true
    outputs:
      app_id: applicationId

  # A node does not serve bytecode to its peers, so every node installs it.
  - name: Install application on feed-node-2
    type: install_application
    node: feed-node-2
    path: dist/com.calimero.hyperfeed.mpk
    dev: true

  - name: Assert application installed
    type: assert
    statements:
      - "is_set({{app_id}})"

  # `create_mesh` joins internally and races the KeyDelivery window.
  - name: Settle before the mesh joins
    type: wait
    seconds: 12

  - name: Create mesh with node-2
    type: create_mesh
    context_node: feed-node-1
    application_id: "{{app_id}}"
    nodes:
      - feed-node-2
    params: "{}"
    outputs:
      context_id: contextId
      owner_key: memberPublicKey

  - name: Verify mesh keys are populated
    type: assert
    statements:
      - "is_set({{context_id}})"
      - "is_set({{owner_key}})"
      - "is_set({{public_key_feed-node-2}})"

  # ─── your rules ───────────────────────────────────────────────────────────

  - name: Owner lets the agent act in chat
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: set_policy
    args: { app_key: "chat", agent: "act", notifications: "push" }

  - name: Owner turns the "invite" guard on
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: set_guard
    args: { category: "invite", enabled: true }

  - name: Owner reads the settings
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: settings
    args: {}
    outputs:
      settings_1: result

  - name: Assert the policy and the guard are stored
    type: json_assert
    statements:
      - 'json_subset({{settings_1}}, {"output": {"paused": false, "policies": [{"app": "chat", "agent": "act", "notifications": "push"}], "message_modes": ["private", "public"]}})'

  - name: The agent checks before acting in chat
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: check_action
    args: { app_key: "chat", category: "", writes: true }
    outputs:
      verdict_chat: result

  - name: The agent checks before signing
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: check_action
    args: { app_key: "sign", category: "sign", writes: true }
    outputs:
      verdict_sign: result

  - name: Assert chat is act and signing needs you
    type: json_assert
    statements:
      - 'json_subset({{verdict_chat}}, {"output": {"decision": "act"}})'
      - 'json_subset({{verdict_sign}}, {"output": {"decision": "ask"}})'

  # ─── what the agent did ───────────────────────────────────────────────────

  - name: The agent records the stand-up it posted
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_action
    args:
      input:
        app: "chat"
        source_context: "ctx-standup"
        source_label: "#eng-standup"
        method: "send_message"
        category: ""
        writes: true
        undoable: true
        title: "Posted your stand-up"
        body: ""
        why: "Daily routine you set up."
        outcome: "done"
        intent_hash: "a91f3c07"
        executor: "relay-account"
        note: ""
        chain: ""
        ask: { kind: "", prompt: "", options: [], draft: "" }
    outputs:
      standup_id: result.output.id
      standup: result

  - name: Assert the stand-up is done and clean
    type: json_assert
    statements:
      - 'json_subset({{standup}}, {"output": {"kind": "action", "status": "done", "breach": "", "needs_you": false}})'

  - name: The agent proposes a signature
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_action
    args:
      input:
        app: "sign"
        source_context: "ctx-legal"
        source_label: "Acme · Legal"
        method: "request_signature"
        category: "sign"
        writes: true
        undoable: false
        title: "Prepared the vendor NDA for your signature"
        body: ""
        why: "Asked for in #launch."
        outcome: "proposed"
        intent_hash: ""
        executor: ""
        note: ""
        chain: ""
        ask: { kind: "", prompt: "", options: [], draft: "" }
    outputs:
      nda_id: result.output.id
      nda: result

  - name: Assert the signature waits for you
    type: json_assert
    statements:
      - 'json_subset({{nda}}, {"output": {"status": "pending", "needs_you": true}})'

  # ─── what the apps sent ───────────────────────────────────────────────────

  - name: The client records a mention
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_notification
    args:
      input:
        key: "ctx-launch:root-1:0"
        app: "chat"
        source_context: "ctx-launch"
        source_label: "#launch"
        from: "Maya"
        title: "Mentioned you"
        body: "Can your agent pull the numbers?"
        event: "MessageSent"
        needs_you: true
        chain: ""
        ask: { kind: "", prompt: "", options: [], draft: "" }

  - name: The client records a poll that closes soon
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_notification
    args:
      input:
        key: "ctx-offsite:root-7:0"
        app: "vote"
        source_context: "ctx-offsite"
        source_label: "Team offsite"
        from: "Priya"
        title: "Poll closes tomorrow"
        body: ""
        event: "PollClosingSoon"
        needs_you: false
        chain: ""
        ask: { kind: "", prompt: "", options: [], draft: "" }

  - name: Owner reads what needs them
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: feed
    args: { filter: "needs_you", app_key: "", limit: 0, before: 0 }
    outputs:
      needs_1: result

  - name: Assert the signature and the mention need the owner
    type: json_assert
    statements:
      - 'json_subset({{needs_1}}, {"output": {"counts": {"all": 4, "agent": 2, "notifications": 2, "needs_you": 2}}})'

  # ─── the owner decides ────────────────────────────────────────────────────

  - name: Owner approves the signature
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: resolve_action
    args: { id: "{{nda_id}}", decision: "approve", answer: "" }

  - name: The agent reports the signature done
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: complete_action
    args: { id: "{{nda_id}}", outcome: "done", note: "signed" }

  - name: Owner asks for the stand-up to be undone
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: resolve_action
    args: { id: "{{standup_id}}", decision: "undo", answer: "" }

  - name: Owner reads the stand-up
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: item
    args: { id: "{{standup_id}}" }
    outputs:
      standup_after: result

  - name: Assert the undo is waiting on the agent
    type: json_assert
    statements:
      - 'json_subset({{standup_after}}, {"output": {"status": "undo_requested"}})'

  - name: Owner marks the mention seen
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: mark_seen
    args: { ids: ["ctx-launch:root-1:0"] }

  - name: Owner marks everything else seen
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: mark_all_seen
    args: {}

  - name: Owner mutes vote
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: set_policy
    args: { app_key: "vote", agent: "off", notifications: "mute" }

  - name: Owner pauses the agent
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: set_paused
    args: { paused: true }

  # ─── chains and answers ───────────────────────────────────────────────────

  - name: The client records a mention you can reply to
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_notification
    args:
      input:
        key: "ctx-launch:r1>r2:0"
        app: "chat"
        source_context: "ctx-launch"
        source_label: "#launch"
        from: "Maya"
        title: "Mentioned you"
        body: "Can your agent pull the numbers?"
        event: "MessageSent"
        needs_you: true
        chain: ""
        ask: { kind: "reply", prompt: "Reply in #launch", options: ["On it", "After 2pm"], draft: "" }
    outputs:
      mention_id: result.output.id

  - name: The agent continues that chain with a proposal that offers a choice
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_action
    args:
      input:
        app: "calendar"
        source_context: "ctx-cal"
        source_label: "Design team"
        method: "create_event"
        category: ""
        writes: true
        undoable: true
        title: "Book a slot to go through the numbers with Maya"
        body: ""
        why: "Maya asked for the numbers before 2."
        outcome: "proposed"
        intent_hash: ""
        executor: ""
        note: ""
        chain: "{{mention_id}}"
        ask: { kind: "choose", prompt: "Pick a slot", options: ["Thu 15:00", "Fri 10:00"], draft: "" }
    outputs:
      slot_id: result.output.id

  - name: Owner reads the feed as chains
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: chain
    args: { chain: "{{mention_id}}" }
    outputs:
      # `json_subset` compares lists whole, so each step of the flow is pulled
      # out and checked on its own.
      flow_first: result.output.0
      flow_second: result.output.1

  - name: Assert the mention and the proposal are one flow, oldest first
    type: json_assert
    statements:
      - 'json_subset({{flow_first}}, {"kind": "notification", "chain_len": 2, "status": "received"})'
      - 'json_subset({{flow_second}}, {"kind": "action", "chain_len": 2, "status": "pending"})'

  - name: Owner picks a slot
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: resolve_action
    args: { id: "{{slot_id}}", decision: "approve", answer: "Fri 10:00" }
    outputs:
      slot_after: result

  - name: Owner replies to Maya from the feed
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: answer_notification
    args: { id: "{{mention_id}}", answer: "Numbers are in the deck, slide 4." }

  - name: The agent reports the reply delivered
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: complete_answer
    args: { id: "{{mention_id}}", outcome: "delivered", note: "Sent in #launch" }
    outputs:
      mention_after: result

  - name: Assert the slot carries your pick and the reply was delivered
    type: json_assert
    statements:
      - 'json_subset({{slot_after}}, {"output": {"status": "approved", "note": "Fri 10:00"}})'
      - 'json_subset({{mention_after}}, {"output": {"status": "delivered", "needs_you": false}})'

  # ─── talking to the agent about a chain ───────────────────────────────────

  - name: Owner asks the agent about the mention's chain
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: say
    args: { chain: "{{mention_id}}", text: "Which numbers did you send Maya?", mode: "private" }
    outputs:
      question_id: result.output.id
      question_posted: result

  - name: Assert the question says how private it is
    type: json_assert
    statements:
      - 'json_subset({{question_posted}}, {"output": {"from": "you", "mode": "private"}})'

  - name: The agent's open questions hold it
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: open_questions
    args: {}
    outputs:
      open_first: result.output.0

  - name: The agent takes the question up
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: agent_ack
    args: { id: "{{question_id}}", status: "thinking", note: "" }
    outputs:
      thinking: result

  - name: The agent reports its latest step while it works
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: agent_progress
    args: { id: "{{question_id}}", doing: "Reading the deck" }
    outputs:
      working: result

  - name: Assert the step shows on the message, not as a step in its history
    type: json_assert
    statements:
      - 'json_subset({{working}}, {"output": {"status": "thinking", "doing": "Reading the deck"}})'

  - name: The agent attaches its steps and the answer so far to the message
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: agent_work
    args:
      id: "{{question_id}}"
      steps: [{ id: "t1", title: "Reading the deck", status: "done", at: 1 }]
      draft: "Q3 revenue"
    outputs:
      worked: result

  - name: Assert the steps and the draft show on the message, with no row of their own
    type: json_assert
    statements:
      - 'json_subset({{worked}}, {"output": {"status": "thinking", "draft": "Q3 revenue"}})'
      - 'json_subset({{worked}}, {"output": {"steps": [{"id": "t1", "title": "Reading the deck", "status": "done", "at": 1}]}})'

  - name: The agent answers in the same chain
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: agent_say
    args: { chain: "{{mention_id}}", reply_to: "{{question_id}}", text: "Q3 revenue and churn, slide 4." }
    outputs:
      answer: result

  - name: Owner reads the question after the answer
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: item
    args: { id: "{{question_id}}" }
    outputs:
      question_after: result

  - name: Assert the conversation went waiting, thinking, answered
    type: json_assert
    statements:
      - 'json_subset({{open_first}}, {"kind": "message", "from": "you", "status": "waiting"})'
      - 'json_subset({{thinking}}, {"output": {"status": "thinking"}})'
      - 'json_subset({{answer}}, {"output": {"kind": "message", "from": "agent", "chain": "{{mention_id}}", "reply_to": "{{question_id}}"}})'
      - 'json_subset({{question_after}}, {"output": {"status": "answered"}})'

  - name: The agent adds a long note with a headline, which titles its row
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: agent_say
    args:
      chain: "{{mention_id}}"
      reply_to: ""
      text: "The numbers, slide by slide: revenue, churn, pipeline, and what changed since Q2."
      headline: "The Q3 numbers"
    outputs:
      headlined: result

  - name: Assert the headline is the row's title, the text its body
    type: json_assert
    statements:
      - 'json_subset({{headlined}}, {"output": {"kind": "message", "headline": "The Q3 numbers", "title": "The Q3 numbers", "status": "said"}})'
      - 'json_subset({{answer}}, {"output": {"headline": ""}})'

  - name: The agent asks the owner something back
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: agent_ask
    args:
      chain: "{{mention_id}}"
      reply_to: ""
      text: "Send Maya the deck too?"
      ask: { kind: "choose", prompt: "Send the deck?", options: ["Send it", "Not now"], draft: "" }
    outputs:
      agent_question: result
      agent_question_id: result.output.id

  - name: The owner answers in the chain
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: say
    args: { chain: "{{mention_id}}", text: "Send it" }
    outputs:
      owner_answer: result

  - name: Owner reads the agent's question after the answer
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: item
    args: { id: "{{agent_question_id}}" }
    outputs:
      agent_question_after: result

  - name: Assert the agent's question went asked, then answered by the owner's words
    type: json_assert
    statements:
      - 'json_subset({{agent_question}}, {"output": {"kind": "message", "from": "agent", "status": "asked", "ask": {"kind": "choose"}}})'
      - 'json_subset({{agent_question_after}}, {"output": {"status": "answered", "note": "Send it"}})'

  # Stale questions: the agent asks twice before the owner answers. The first
  # question is replaced by the second; an answer that still reaches it (a
  # screen that had not caught up) goes to the agent flagged, and the second
  # question stays open until it is answered from its own buttons.
  - name: The agent asks a first question
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: agent_ask
    args:
      chain: "{{mention_id}}"
      reply_to: ""
      text: "Share the deck with the whole channel?"
      ask: { kind: "choose", prompt: "Share it?", options: ["Share", "Only Maya"], draft: "" }
    outputs:
      stale_question_id: result.output.id

  - name: The agent asks again before the owner answers
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: agent_ask
    args:
      chain: "{{mention_id}}"
      reply_to: ""
      text: "Maya left the channel. DM her the deck instead?"
      ask: { kind: "choose", prompt: "DM it?", options: ["DM her", "Not now"], draft: "" }
    outputs:
      newer_question_id: result.output.id

  - name: Owner reads the first question after the second
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: item
    args: { id: "{{stale_question_id}}" }
    outputs:
      stale_question: result

  - name: An answer still reaches the replaced question
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: answer_ask
    args: { id: "{{stale_question_id}}", text: "Share" }
    outputs:
      stale_answer: result

  - name: Owner reads the newer question after the stale answer
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: item
    args: { id: "{{newer_question_id}}" }
    outputs:
      newer_question: result

  - name: Owner answers the newer question from its buttons
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: answer_ask
    args: { id: "{{newer_question_id}}", text: "DM her" }
    outputs:
      current_answer: result

  - name: Assert the first question was replaced and its late answer is flagged
    type: json_assert
    statements:
      - 'json_subset({{stale_question}}, {"output": {"status": "asked", "needs_you": false, "superseded_by": "{{newer_question_id}}"}})'
      - 'json_subset({{stale_answer}}, {"output": {"from": "you", "status": "waiting", "answers": "{{stale_question_id}}", "answers_superseded": true}})'
      - 'json_subset({{newer_question}}, {"output": {"status": "asked", "needs_you": true, "superseded_by": ""}})'
      - 'json_subset({{current_answer}}, {"output": {"from": "you", "answers": "{{newer_question_id}}", "answers_superseded": false}})'

  # Stop: the owner asks something, the agent takes it up, the owner presses
  # Stop. The request is kept on the message for the agent, which ends its
  # turn and closes the message "Stopped by you".
  - name: Owner asks for something long
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: say
    args: { chain: "{{mention_id}}", text: "Rewrite the whole deck" }
    outputs:
      long_id: result.output.id

  - name: The agent takes the long one up
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: agent_ack
    args: { id: "{{long_id}}", status: "thinking", note: "" }

  - name: The owner presses Stop
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: stop
    args: { id: "{{long_id}}" }
    outputs:
      stop_asked: result

  - name: The agent ends its turn, stopped by the owner
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: agent_ack
    args: { id: "{{long_id}}", status: "failed", note: "Stopped by you" }
    outputs:
      stopped: result

  - name: Assert the stop was kept for the agent, and the message closed stopped by you
    type: json_assert
    statements:
      - 'json_subset({{stop_asked}}, {"output": {"status": "thinking"}})'
      - 'json_subset({{stopped}}, {"output": {"status": "failed", "note": "Stopped by you"}})'

  # ─── lenses and typed notifications ──────────────────────────────────────

  - name: The agent proposes a lens it learned for Chat
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: propose_lens
    args:
      app_key: "chat"
      application_id: "chat-app-1"
      spec: '{"events":{"MessageSent":{"type":"message"},"TextChanged":"ignore"}}'
      summary: "DMs and mentions of you; answers with send_message"
    outputs:
      proposed: result

  - name: Owner approves it
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: decide_lens
    args: { app_key: "chat", application_id: "chat-app-1", decision: "approve" }
    outputs:
      approved: result

  - name: Owner lists the lenses
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: lenses
    args: {}
    outputs:
      lens_1: result.output.0

  # Vote is muted, so this typed row stays out of the feed's counts below.
  - name: The client records a typed notification a lens made
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_notification
    args:
      input:
        key: "ctx-vote:r1>r2:0"
        app: "vote"
        source_context: "ctx-vote"
        source_label: "Team offsite"
        from: "Priya"
        title: "Offsite location"
        body: ""
        event: "PollCreated"
        needs_you: false
        chain: ""
        ask: { kind: "", prompt: "", options: [], draft: "" }
        item_type: "poll"
        fields: '{"question":"Offsite location","options":["Lisbon","Berlin"]}'
        reply_call: ""
    outputs:
      poll_id: result.output.id

  - name: Owner reads the typed row
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: item
    args: { id: "{{poll_id}}" }
    outputs:
      poll_row: result

  - name: Assert the lens was approved and the row kept its type
    type: json_assert
    statements:
      - 'json_subset({{proposed}}, {"output": {"app": "chat", "status": "proposed"}})'
      - 'json_subset({{approved}}, {"output": {"status": "approved"}})'
      - 'json_subset({{lens_1}}, {"app": "chat", "application_id": "chat-app-1", "status": "approved"})'
      - 'json_subset({{poll_row}}, {"output": {"item_type": "poll", "fields": "{\"question\":\"Offsite location\",\"options\":[\"Lisbon\",\"Berlin\"]}"}})'

  # ─── the second node ──────────────────────────────────────────────────────

  - name: Wait for the feed to converge
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - feed-node-1
      - feed-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: node-2 reads the feed
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: feed
    args: { filter: "all", app_key: "", limit: 0, before: 0 }
    outputs:
      feed_2: result

  - name: node-2 reads the settings
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: settings
    args: {}
    outputs:
      settings_2: result

  # Vote is muted, so four chains: the stand-up, the NDA, the first mention,
  # and the mention with its slot proposal and conversation. Nothing needs the
  # owner any more.
  - name: Assert node-2 sees the owner's feed and rules
    type: json_assert
    statements:
      - 'json_subset({{feed_2}}, {"output": {"counts": {"all": 4, "needs_you": 0}}})'
      - 'json_subset({{settings_2}}, {"output": {"paused": true}})'

  # Images: the owner sends a screenshot with no text. Only the blob's id,
  # name, type and size are stored; the bytes stay a blob on the node.
  - name: Owner sends an image with no text
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: say_with
    args:
      chain: "{{mention_id}}"
      text: ""
      attachments: [{ blob_id: "bafyimage01", name: "deck.png", mime: "image/png", size: 48213 }]
    outputs:
      image_sent: result
      image_id: result.output.id

  - name: Owner reads the image message back
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: item
    args: { id: "{{image_id}}" }
    outputs:
      image_back: result
      image_first: result.output.attachments.0

  - name: Owner tries to send a PDF as an image
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: say_with
    args:
      chain: "{{mention_id}}"
      text: "the contract"
      attachments: [{ blob_id: "bafypdf01", name: "contract.pdf", mime: "application/pdf", size: 1200 }]
    expected_failure: true
    outputs:
      pdf_error: error

  - name: Assert the image travels with its message
    type: json_assert
    statements:
      - 'json_subset({{image_sent}}, {"output": {"kind": "message", "from": "you", "status": "waiting", "title": "Sent an image"}})'
      - 'json_subset({{image_back}}, {"output": {"id": "{{image_id}}", "body": ""}})'
      - 'json_subset({{image_first}}, {"blob_id": "bafyimage01", "name": "deck.png", "mime": "image/png", "size": 48213})'

  - name: Assert the PDF was refused
    type: assert
    statements:
      - "is_set({{pdf_error}})"

  - name: node-2 tries to record an action in someone else's feed
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: record_action
    args:
      input:
        app: "chat"
        source_context: ""
        source_label: ""
        method: "send_message"
        category: ""
        writes: true
        undoable: false
        title: "Forged"
        body: ""
        why: ""
        outcome: "done"
        intent_hash: ""
        executor: ""
        note: ""
        chain: ""
        ask: { kind: "", prompt: "", options: [], draft: "" }
    expected_failure: true
    outputs:
      forged_error: error

  - name: node-2 tries to unpause the agent in someone else's feed
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: set_paused
    args: { paused: false }
    expected_failure: true
    outputs:
      unpause_error: error

  - name: node-2 tries to talk to the agent in someone else's feed
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: say
    args: { chain: "", text: "Forged question" }
    expected_failure: true
    outputs:
      say_error: error

  - name: node-2 tries to approve a lens in someone else's feed
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: decide_lens
    args: { app_key: "chat", application_id: "chat-app-1", decision: "reject" }
    expected_failure: true
    outputs:
      lens_error: error

  - name: node-2 reads the lenses
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: lenses
    args: {}
    outputs:
      lens_2: result.output.0

  - name: Assert every write was refused
    type: assert
    statements:
      - "is_set({{forged_error}})"
      - "is_set({{unpause_error}})"
      - "is_set({{say_error}})"
      - "is_set({{lens_error}})"

  - name: Assert node-2 holds the approved lens
    type: json_assert
    statements:
      - 'json_subset({{lens_2}}, {"app": "chat", "status": "approved"})'

  # ── Put things away, and know the agent is there ─────────────────────────
  - name: Owner archives the stand-up chain
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: archive
    args: { chains: ["{{standup_id}}"], until: 0 }
    outputs:
      archived_count: result.output

  - name: Owner reads what is archived
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: feed
    args: { filter: "archived", app_key: "", limit: 10, before: 0 }
    outputs:
      archived_first: result.output.items.0

  - name: The agent reports in
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: agent_seen
    args: { name: "mero-bot@ci" }

  - name: Let the archive and presence reach node-2
    type: wait
    seconds: 6

  - name: node-2 sees the agent
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: settings
    args: {}
    outputs:
      agent_2: result.output.agents.0

  - name: node-2 cannot unarchive
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: unarchive
    args: { chains: ["{{standup_id}}"] }
    expected_failure: true
    outputs:
      unarchive_error: error

  - name: Assert archive and presence
    type: json_assert
    statements:
      - 'json_equal({{archived_count}}, 1)'
      - 'json_subset({{archived_first}}, {"id": "{{standup_id}}"})'
      - 'json_subset({{agent_2}}, {"name": "mero-bot@ci"})'

  - name: Assert node-2 was refused
    type: assert
    statements:
      - "is_set({{unarchive_error}})"

  # ── Chain leases: one agent session per chain, across machines ──────────
  - name: A session claims the mention's chain
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: claim_chain
    args: { chain: "{{mention_id}}", session: "studio-1", ttl_ms: 120000, agent: "mero-bot@studio" }
    outputs:
      lease: result

  - name: A second session is refused the chain
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: claim_chain
    args: { chain: "{{mention_id}}", session: "laptop-1", ttl_ms: 120000, agent: "mero-bot@laptop" }
    expected_failure: true
    outputs:
      second_claim_error: error

  - name: The holder renews its lease
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: renew_chain
    args: { chain: "{{mention_id}}", session: "studio-1", ttl_ms: 120000 }
    outputs:
      renewed: result

  - name: Owner reads who holds the chain
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: chain_lease
    args: { chain: "{{mention_id}}" }
    outputs:
      held: result

  - name: The holder releases it
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: release_chain
    args: { chain: "{{mention_id}}", session: "studio-1" }
    outputs:
      released: result.output

  - name: The second session claims it once released
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: claim_chain
    args: { chain: "{{mention_id}}", session: "laptop-1", ttl_ms: 120000, agent: "mero-bot@laptop" }
    outputs:
      second_lease: result

  - name: node-2 cannot claim a chain
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: claim_chain
    args: { chain: "{{mention_id}}", session: "intruder", ttl_ms: 120000, agent: "x" }
    expected_failure: true
    outputs:
      intruder_claim_error: error

  - name: Assert the lease rules
    type: json_assert
    statements:
      - 'json_subset({{lease}}, {"output": {"chain": "{{mention_id}}", "session": "studio-1", "agent": "mero-bot@studio"}})'
      - 'json_subset({{renewed}}, {"output": {"session": "studio-1"}})'
      - 'json_subset({{held}}, {"output": {"session": "studio-1", "agent": "mero-bot@studio"}})'
      - 'json_equal({{released}}, true)'
      - 'json_subset({{second_lease}}, {"output": {"session": "laptop-1"}})'

  - name: Assert the refused claims
    type: assert
    statements:
      - "is_set({{second_claim_error}})"
      - "is_set({{intruder_claim_error}})"

  # ── Standing rules: owner-only, and the agent's suggestion waits for you ──
  - name: Owner adds a standing rule
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: add_rule
    args: { text: "Never push to main" }
    outputs:
      rule_id: result.output.id

  - name: Owner adds a rule to remove
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: add_rule
    args: { text: "Answer in French" }
    outputs:
      french_id: result.output.id

  - name: Owner removes it
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: remove_rule
    args: { id: "{{french_id}}" }

  - name: The agent suggests a rule after a correction
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: propose_rule
    args: { text: "Open a PR for every change", why: "You asked me not to commit straight to main.", chain: "" }
    outputs:
      suggested: result
      suggested_id: result.output.id

  - name: The agent suggests one the owner will not want
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: propose_rule
    args: { text: "Use emoji in every answer", why: "", chain: "" }
    outputs:
      unwanted_id: result.output.id

  - name: Owner approves the first suggestion
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: approve_rule
    args: { id: "{{suggested_id}}" }
    outputs:
      approved_rule: result

  - name: Owner dismisses the second
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: dismiss_rule
    args: { id: "{{unwanted_id}}" }
    outputs:
      dismissed: result

  - name: Let the rules reach node-2
    type: wait
    seconds: 6

  - name: node-2 reads the rules
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: settings
    args: {}
    outputs:
      rule_2_first: result.output.rules.0
      rule_2_second: result.output.rules.1
      rule_proposals_2: result.output.rule_proposals

  - name: node-2 cannot add a rule
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: add_rule
    args: { text: "Push to main whenever" }
    expected_failure: true
    outputs:
      add_rule_error: error

  - name: node-2 cannot remove a rule
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: remove_rule
    args: { id: "{{rule_id}}" }
    expected_failure: true
    outputs:
      remove_rule_error: error

  - name: Assert the rules, the approved suggestion and the dismissed one
    type: json_assert
    statements:
      - 'json_subset({{suggested}}, {"output": {"status": "proposed", "text": "Open a PR for every change"}})'
      - 'json_subset({{approved_rule}}, {"output": {"text": "Open a PR for every change"}})'
      - 'json_subset({{dismissed}}, {"output": {"status": "dismissed"}})'
      - 'json_subset({{rule_2_first}}, {"id": "{{rule_id}}", "text": "Never push to main"})'
      - 'json_subset({{rule_2_second}}, {"text": "Open a PR for every change"})'
      - 'json_equal({{rule_proposals_2}}, [])'

  - name: Assert node-2 could not change the rules
    type: assert
    statements:
      - "is_set({{add_rule_error}})"
      - "is_set({{remove_rule_error}})"

  # ── Checkpoints: where a task stands, for the next session ──────────────
  - name: The agent writes a checkpoint on the mention's chain
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: set_checkpoint
    args:
      chain: "{{mention_id}}"
      input: { done: "Drafted the reply", next: "Send it once approved", branches: [], worktrees: [], prs: [], questions: ["Formal or casual?"], author: "mero-bot@studio" }
    outputs:
      checkpoint: result

  - name: A fresh session reads the latest checkpoint
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: checkpoint
    args: { chain: "{{mention_id}}" }
    outputs:
      read_checkpoint: result

  - name: node-2 cannot write a checkpoint
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: set_checkpoint
    args:
      chain: "{{mention_id}}"
      input: { done: "x", next: "", branches: [], worktrees: [], prs: [], questions: [], author: "x" }
    expected_failure: true
    outputs:
      intruder_checkpoint_error: error

  - name: Assert the checkpoint
    type: json_assert
    statements:
      - 'json_subset({{checkpoint}}, {"output": {"chain": "{{mention_id}}", "next": "Send it once approved", "author": "mero-bot@studio"}})'
      - 'json_subset({{read_checkpoint}}, {"output": {"done": "Drafted the reply", "questions": ["Formal or casual?"]}})'

  - name: Assert the refused checkpoint
    type: assert
    statements:
      - "is_set({{intruder_checkpoint_error}})"

  # ── Watches: "when X, do Y", fired once by the agent's runtime ──────────
  - name: The agent sets a merge-when-green watch on the mention's chain
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: add_watch
    args:
      input: { chain: "{{mention_id}}", condition: "pr_green", repo: "calimero-network/apps", pr: 434, branch: "", action: "merge", text: "", agent: "mero-bot@studio" }
    outputs:
      watch_id: result.output.id
      watch: result

  - name: The runtime notes where the checks stand
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: watch_seen
    args: { id: "{{watch_id}}", seen: "3 of 5 checks passed, 2 running" }
    outputs:
      watch_seen: result

  - name: The runtime fires it once its checks are green
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: fire_watch
    args: { id: "{{watch_id}}", session: "studio-1" }
    outputs:
      fired: result

  - name: Another session is refused the same watch
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: fire_watch
    args: { id: "{{watch_id}}", session: "laptop-1" }
    expected_failure: true
    outputs:
      second_fire_error: error

  - name: The runtime reports the merge
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: finish_watch
    args: { id: "{{watch_id}}", outcome: "done", note: "Merged #434 into main" }
    outputs:
      finished: result

  - name: Owner reads the chain's watches
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: watches
    args: { chain: "{{mention_id}}" }
    outputs:
      listed_watch: result.output.0

  - name: The agent sets a notify-on-merge watch
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: add_watch
    args:
      input: { chain: "{{mention_id}}", condition: "pr_merged", repo: "calimero-network/apps", pr: 435, branch: "", action: "notify", text: "#435 merged", agent: "mero-bot@studio" }
    outputs:
      notify_watch_id: result.output.id

  - name: Owner cancels the notify watch
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: cancel_watch
    args: { id: "{{notify_watch_id}}", note: "No longer needed" }
    outputs:
      cancelled: result

  - name: A watch that already fired cannot be cancelled
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: cancel_watch
    args: { id: "{{watch_id}}" }
    expected_failure: true
    outputs:
      cancel_fired_error: error

  - name: node-2 cannot set a watch
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: add_watch
    args:
      input: { chain: "{{mention_id}}", condition: "pr_merged", repo: "calimero-network/apps", pr: 434, branch: "", action: "notify", text: "x", agent: "x" }
    expected_failure: true
    outputs:
      intruder_watch_error: error

  - name: Assert the watch fired once
    type: json_assert
    statements:
      - 'json_subset({{watch}}, {"output": {"chain": "{{mention_id}}", "condition": "pr_green", "action": "merge", "status": "watching"}})'
      - 'json_subset({{watch_seen}}, {"output": {"seen": "3 of 5 checks passed, 2 running"}})'
      - 'json_subset({{fired}}, {"output": {"status": "firing", "fired_by": "studio-1"}})'
      - 'json_subset({{finished}}, {"output": {"status": "done", "note": "Merged #434 into main"}})'
      - 'json_subset({{listed_watch}}, {"id": "{{watch_id}}", "status": "done"})'
      - 'json_subset({{cancelled}}, {"output": {"id": "{{notify_watch_id}}", "status": "cancelled"}})'

  - name: Assert the refused watch calls
    type: assert
    statements:
      - "is_set({{second_fire_error}})"
      - "is_set({{cancel_fired_error}})"
      - "is_set({{intruder_watch_error}})"

  # ── PRs: what the runtime saw on GitHub, for the PR card's merge button ─
  - name: The runtime records a PR the mention's chain links to, checks red
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_pr
    args:
      input: { chain: "{{mention_id}}", repo: "calimero-network/apps", pr: 429, title: "Safe merge button", state: "open", draft: false, base: "master", default_branch: "master", conflicts: false, head_sha: "abc123", checks: "red", checks_total: 5, checks_passed: 4, checks_pending: 0, failing: ["E2E (hyperfeed / feed)"], stacked_on: 0, stacked_merged: false }
    outputs:
      recorded_pr: result

  - name: The runtime records a PR stacked on it
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_pr
    args:
      input: { chain: "{{mention_id}}", repo: "calimero-network/apps", pr: 430, title: "Stacked follow-up", state: "open", draft: false, base: "mero-bot/chain-429", default_branch: "master", conflicts: false, head_sha: "def456", checks: "green", checks_total: 5, checks_passed: 5, checks_pending: 0, failing: [], stacked_on: 429, stacked_merged: false }
    outputs:
      stacked_pr: result

  - name: The PR card reads the chain's PRs
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: prs
    args: { chain: "{{mention_id}}" }
    outputs:
      listed_pr: result.output.0
      listed_pr_2: result.output.1

  - name: node-2 cannot record a PR
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: record_pr
    args:
      input: { chain: "", repo: "calimero-network/apps", pr: 431, title: "x", state: "open", draft: false, base: "master", default_branch: "master", conflicts: false, head_sha: "", checks: "green", checks_total: 0, checks_passed: 0, checks_pending: 0, failing: [], stacked_on: 0, stacked_merged: false }
    expected_failure: true
    outputs:
      intruder_pr_error: error

  - name: Assert the recorded PRs
    type: json_assert
    statements:
      - 'json_subset({{recorded_pr}}, {"output": {"chain": "{{mention_id}}", "pr": 429, "checks": "red", "failing": ["E2E (hyperfeed / feed)"]}})'
      - 'json_subset({{stacked_pr}}, {"output": {"pr": 430, "base": "mero-bot/chain-429", "stacked_on": 429, "stacked_merged": false}})'
      - 'json_subset({{listed_pr}}, {"repo": "calimero-network/apps", "chain": "{{mention_id}}"})'
      - 'json_subset({{listed_pr_2}}, {"repo": "calimero-network/apps", "chain": "{{mention_id}}"})'

  - name: Assert the refused PR record
    type: assert
    statements:
      - "is_set({{intruder_pr_error}})"

  # ── One thread per task: a teammate's comment joins the task that touched the issue ──

  - name: The agent starts a task
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_notification
    args:
      input:
        key: "mero-bot:subject-task"
        app: "mero-bot"
        source_context: ""
        source_label: ""
        from: ""
        title: "Fix the sync bug"
        body: ""
        event: "Prompt"
        needs_you: false
        chain: ""
        ask: { kind: "", prompt: "", options: [], draft: "" }
    outputs:
      subject_task: result.output.id

  - name: The task moves an issue, naming it as its subject
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_action
    args:
      input:
        app: "issue-tracker"
        source_context: "ctx-repo"
        source_label: ""
        method: "set_status"
        category: ""
        writes: true
        undoable: false
        title: "Moved the sync bug to In progress"
        body: ""
        why: ""
        outcome: "done"
        intent_hash: ""
        executor: ""
        note: ""
        chain: "{{subject_task}}"
        ask: { kind: "", prompt: "", options: [], draft: "" }
        subject: "issue-tracker:ctx-repo:issue-7"
    outputs:
      subject_write: result.output

  - name: The client records a teammate's comment on that issue
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_notification
    args:
      input:
        key: "ctx-repo:s1>s2:0"
        app: "issue-tracker"
        source_context: "ctx-repo"
        source_label: ""
        from: "Xabi"
        title: "Commented on your issue Sync bug"
        body: ""
        event: "CommentAdded"
        needs_you: false
        chain: ""
        ask: { kind: "reply", prompt: "Reply in the thread", options: [], draft: "" }
        item_type: "message"
        fields: '{"text":"Repro attached"}'
        reply_call: '{"method":"add_comment","args":{"issue_id":"issue-7","body":"=answer"}}'
    outputs:
      subject_comment: result.output

  - name: A step of the task's turn touches a doc, with no row of its own
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: touch_subject
    args:
      chain: "{{subject_task}}"
      subject: "drive-docs:ctx-docs:doc-1"

  - name: The client records a teammate's comment on that doc
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: record_notification
    args:
      input:
        key: "ctx-docs:d1>d2:0"
        app: "drive-docs"
        source_context: "ctx-docs"
        source_label: ""
        from: "Maya"
        title: "Commented on your doc"
        body: ""
        event: "CommentAdded"
        needs_you: false
        chain: ""
        ask: { kind: "reply", prompt: "Reply in the doc", options: [], draft: "" }
        item_type: "message"
        fields: '{"text":"Typo in section 2"}'
        reply_call: '{"method":"add_comment","args":{"doc_id":"doc-1","body":"=answer"}}'
    outputs:
      touched_comment: result.output

  - name: node-2 cannot touch a subject
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: touch_subject
    args:
      chain: "{{subject_task}}"
      subject: "drive-docs:ctx-docs:doc-1"
    expected_failure: true
    outputs:
      intruder_touch_error: error

  - name: Assert the comment joined the task's chain
    type: json_assert
    statements:
      - 'json_subset({{subject_write}}, {"chain": "{{subject_task}}", "subject": "issue-tracker:ctx-repo:issue-7"})'
      - 'json_subset({{subject_comment}}, {"chain": "{{subject_task}}", "subject": "issue-tracker:ctx-repo:issue-7"})'
      - 'json_subset({{touched_comment}}, {"chain": "{{subject_task}}", "subject": "drive-docs:ctx-docs:doc-1"})'

  - name: Assert the refused touch
    type: assert
    statements:
      - "is_set({{intruder_touch_error}})"

  # ── A task's links: chips for the things it works on ──

  - name: You link a board to the task by hand
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: add_link
    args:
      chain: "{{subject_task}}"
      input: { subject: "design:ctx-board", label: "Feed redesign", by: "you" }
    outputs:
      board_link: result.output

  - name: The task's links read back, the agent's and yours
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: links
    args: { chain: "{{subject_task}}" }
    outputs:
      link_first: result.output.0
      link_last: result.output.2

  - name: You take the board off the task
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: remove_link
    args: { chain: "{{subject_task}}", subject: "design:ctx-board" }

  - name: node-2 cannot link anything
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: add_link
    args:
      chain: "{{subject_task}}"
      input: { subject: "chat:ctx-launch", label: "", by: "you" }
    expected_failure: true
    outputs:
      intruder_link_error: error

  - name: Assert the links
    type: json_assert
    statements:
      - 'json_subset({{board_link}}, {"subject": "design:ctx-board", "app": "design", "context": "ctx-board", "item": "", "label": "Feed redesign", "by": "you"})'
      - 'json_subset({{link_first}}, {"subject": "issue-tracker:ctx-repo:issue-7", "by": "agent", "activity": 1})'
      - 'json_subset({{link_last}}, {"subject": "design:ctx-board", "by": "you"})'

  - name: Assert the refused link
    type: assert
    statements:
      - "is_set({{intruder_link_error}})"

  - name: You start a task from the chat, in a chain of its own
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: start_task
    args:
      from: "{{subject_task}}"
      text: "Build safe merge: merge only green PRs on main."
      headline: "Safe merge"
    outputs:
      started_task: result.output
      started_chain: result.output.chain

  - name: The task links back to the chat it came from
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: links
    args: { chain: "{{started_chain}}" }
    outputs:
      started_back: result.output.0

  - name: node-2 cannot start a task
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: start_task
    args: { from: "{{subject_task}}", text: "Not yours", headline: null }
    expected_failure: true
    outputs:
      intruder_task_error: error

  - name: Assert the started task
    type: json_assert
    statements:
      - 'json_subset({{started_task}}, {"kind": "message", "from": "you", "status": "waiting"})'
      - 'json_subset({{started_back}}, {"app": "hyperfeed", "context": "from", "item": "{{subject_task}}", "by": "you"})'

  - name: Assert the refused task
    type: assert
    statements:
      - "is_set({{intruder_task_error}})"

  # ── Push to your phone: the runtime's key, and the devices it wakes ──

  - name: Your agent's runtime keeps its push key
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: set_push_key
    args: { public_key: "BKey-runtime_1", by: "mero-bot" }

  - name: Your phone subscribes with it
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: add_push_device
    args:
      input:
        endpoint: "https://push.example.com/send/phone-1"
        p256dh: "BPhonePublicKey"
        auth: "phoneAuth"
        name: "Phone"
        quiet: false
        key: "BKey-runtime_1"
    outputs:
      push_device: result.output

  - name: The key and the devices read back
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: push_key
    outputs:
      push_key_view: result.output

  - name: The devices to push to
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: push_devices
    outputs:
      push_first: result.output.0

  - name: You take the phone off
    type: call
    node: feed-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{owner_key}}"
    method: remove_push_device
    args: { endpoint: "https://push.example.com/send/phone-1" }

  - name: node-2 cannot add a device
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: add_push_device
    args:
      input:
        endpoint: "https://push.example.com/send/intruder"
        p256dh: "BIntruder"
        auth: "intruderAuth"
        name: ""
        quiet: false
        key: "BKey-runtime_1"
    expected_failure: true
    outputs:
      intruder_push_error: error

  - name: node-2 cannot set the push key
    type: call
    node: feed-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_feed-node-2}}"
    method: set_push_key
    args: { public_key: "BIntruderKey", by: "intruder" }
    expected_failure: true
    outputs:
      intruder_push_key_error: error

  - name: Assert push
    type: json_assert
    statements:
      - 'json_subset({{push_device}}, {"endpoint": "https://push.example.com/send/phone-1", "name": "Phone", "quiet": false})'
      - 'json_subset({{push_key_view}}, {"public_key": "BKey-runtime_1", "by": "mero-bot"})'
      - 'json_subset({{push_first}}, {"endpoint": "https://push.example.com/send/phone-1", "p256dh": "BPhonePublicKey", "auth": "phoneAuth"})'

  - name: Assert the refused push writes
    type: assert
    statements:
      - "is_set({{intruder_push_error}})"
      - "is_set({{intruder_push_key_error}})"
