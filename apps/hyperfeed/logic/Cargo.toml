[package]
name = "hyperfeed"
description = "Hyperfeed — one feed for everything your agent did and every notification your apps sent, on the component SDK"
# NOT the release version: the release workflow takes the next appVersion from
# the registry and passes it to `mero-component bundle --app-version`. Cargo
# requires the field; bundling locally without --app-version uses it.
version = "0.0.1"
edition = "2021"
authors = ["Calimero Limited <info@calimero.network>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/calimero-network/apps"
publish = false

[lib]
# A `calimero:app` component. No `rlib`: the tests run the BUILT component on
# core's engine (tests/common/mod.rs), not the crate linked natively.
crate-type = ["cdylib"]

# Core at `component-core-tag` (root Cargo.toml), the same tag for every core
# crate; scripts/check-component-pins.py asserts it. A standalone crate cannot
# inherit `[workspace.dependencies]`.
[dependencies]
calimero-sdk = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The harness (`TestApp`, `run_scenario`) and the builder the tests build this
# crate with, for `cargo test` on the host only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-sdk       = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.12", features = ["testing"] }
calimero-app-build = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.12" }

# Read by `mero-component bundle` (tools/component-bundle), with the keys
# `cargo mero bundle` reads for a v1 app.
[package.metadata.calimero]
package = "com.calimero.hyperfeed"
name = "Hyperfeed"
description = "One feed for your agent and your apps: every action your agent took on your behalf, with its provenance, beside every notification the apps it uses sent you. Approvals, undo and per-app agent permissions live in a context only you write to."
author = "Calimero"
# The slug IS the package id: a deep link resolves by `Application.package`.
slug = "com.calimero.hyperfeed"
# REQUIRED: `cargo mero bundle` refuses to run without an icon decision.
# Regenerate with `node app/scripts/gen-icons.mjs`.
icon = "../app/public/icon-512.png"
category = "productivity"
tags = ["agent", "notifications", "feed", "approvals", "delegated-execution"]
github = "https://github.com/calimero-network/apps"
# `component-min-runtime-version` in the root Cargo.toml: a node compares it
# with its own release.
min-runtime-version = "1.0.0-rc.12"
# Doubles as the registered login callback origin, compared by exact origin:
# without it a hosted login dies on "Login callback destination is not allowed".
# Hyperfeed's own domain, served by the `hyperfeed` Vercel project (Root
# Directory `apps/hyperfeed/app`); www.hyperfeed.me should redirect here, since
# only this exact origin is a registered callback. Calimero Desktop and the
# node's sign-in page trust Hyperfeed with full access at this origin
# (`TRUSTED_APPS` in tauri-app and auth-frontend): change them together.
frontend = "https://hyperfeed.me"
# Also trusted for the login callback, never opened: www (should redirect here,
# but a login started there must still land), and the vercel.app origin
# Hyperfeed was served at before, for nodes still opening a bundle that names it.
frontend-aliases = ["https://www.hyperfeed.me", "https://hyperfeed-two.vercel.app"]
# The built frontend `cargo mero bundle` packs, so the node serves it from the app's own origin.
frontend-dir = "../app/dist"
# Shown to an agent by mero-mcp the first time it meets this app: how to report,
# ask and carry out the user's decisions through the feed.
guide = "GUIDE.md"

# Standalone: excluded from the root workspace (root Cargo.toml), its own
# Cargo.lock, as core's component apps are.
[workspace]
