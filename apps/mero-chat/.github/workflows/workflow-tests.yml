# Runs merobox workflow tests when logic or workflow files change.
# Builds curb.wasm, then validates all merobox workflow definitions against
# real merod nodes (e2e.yml = 3-node comprehensive, integration-setup.yml =
# 2-node setup for Playwright).

name: Workflow Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'logic/**'
      - 'workflows/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'logic/**'
      - 'workflows/**'

concurrency:
  group: workflow-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-tests:
    name: merobox Workflow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          key: cargo-${{ runner.os }}-${{ hashFiles('logic/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-mero
        uses: ./.github/actions/setup-cargo-mero

      # Builds res/curb.wasm (ABI embedded, wasm-opt'd) AND the .mpk, so the
      # nodes below run the same artifact a release publishes.
      - name: Build curb WASM and bundle
        working-directory: logic
        run: cargo mero bundle --dev

      - name: Install merobox
      # ⚠️ calimero-client-py MUST be pinned, not just merobox. It is the layer
      # that actually builds the admin-API request, merobox only requires a
      # floor, and it tracks core master — so an unpinned install silently picks
      # up whatever landed today.
      #
      # That is not hypothetical here. Leaving it unpinned resolved to 0.6.33,
      # which expects rc.25's renamed `namespaceId`, against the rc.24 node these
      # scenarios start:
      #
      #     Join namespace failed: Client error: missing field `namespaceId`
      #
      # 0.6.29 is the version the rest of the fleet ran green against rc.24
      # nodes. Moving the node to rc.25 means moving BOTH pins and migrating the
      # scenario schema (see logic/Cargo.toml's min-runtime-version note).
        run: pip install merobox==0.6.66 calimero-client-py==0.6.30 && merobox --version

      - name: Run E2E workflow (3-node)
        working-directory: workflows
        run: |
          max_attempts=2
          attempt=1
          success=false
          while [ $attempt -le $max_attempts ]; do
            if [ $attempt -gt 1 ]; then
              merobox stop --all || true
              merobox nuke --force || true
              sleep 2
            fi
            if merobox bootstrap run e2e.yml; then
              success=true
              break
            fi
            attempt=$((attempt + 1))
          done
          merobox stop --all || true
          merobox nuke --force || true
          [ "$success" = true ] || exit 1

      - name: Run integration-setup workflow (2-node)
        working-directory: workflows
        run: |
          max_attempts=2
          attempt=1
          success=false
          while [ $attempt -le $max_attempts ]; do
            if [ $attempt -gt 1 ]; then
              merobox stop --all || true
              merobox nuke --force || true
              sleep 2
            fi
            if merobox bootstrap run integration-setup.yml; then
              success=true
              break
            fi
            attempt=$((attempt + 1))
          done
          merobox stop --all || true
          merobox nuke --force || true
          [ "$success" = true ] || exit 1
