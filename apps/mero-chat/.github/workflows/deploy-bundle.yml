# Builds, signs, and publishes the com.calimero.chat logic bundle to the
# Calimero App Registry. The release trigger is `[package] version` in
# logic/Cargo.toml: bump it on master and that version publishes. Any other
# edit to that file is a no-op, and workflow_dispatch republishes whatever
# the manifest currently says.
#
# Signing uses a PRODUCTION mero-sign key held in ORGANIZATION secrets (never a
# dev key). Required org (or repo) secrets:
#   MERO_SIGN_KEY              — full JSON of the production mero-sign key file
#                                ({private_key, public_key, signer_id}). Must be
#                                the key that signed com.calimero.chat's first
#                                version — the signer is pinned per package — or
#                                any key linked to the owning org in the registry.
#   CALIMERO_REGISTRY_API_KEY  — API token from the registry Organizations page
#                                (CLI Access), whose owner is in the package's org.

name: Deploy Bundle

on:
  push:
    branches: [master]
    paths:
      - 'logic/Cargo.toml'
  workflow_dispatch:

# Serialize releases: the registry rejects a duplicate version, and two
# publishes at once shouldn't interleave.
concurrency:
  group: deploy-bundle
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the release on the version having actually moved: this workflow also
  # wakes for a dependency bump or a metadata edit in the same file.
  check:
    name: Version changed?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.ver.outputs.publish }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
        with:
          fetch-depth: 2

      - name: Compare manifest version against the previous commit
        id: ver
        run: |
          pkg_version() {
            awk '/^\[/ { p = ($0 == "[package]") }
                 p && /^version[[:space:]]*=/ {
                   match($0, /"[^"]*"/)
                   print substr($0, RSTART + 1, RLENGTH - 2); exit }'
          }

          v="$(pkg_version < logic/Cargo.toml)"
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::logic/Cargo.toml [package] version must be X.Y.Z (got '$v')"; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "manual run — publishing $v"
            exit 0
          fi

          prev="$(git show HEAD^:logic/Cargo.toml 2>/dev/null | pkg_version || true)"
          if [ "$v" = "$prev" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version unchanged at $v — nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version ${prev:-none} -> $v — publishing"
          fi

  deploy:
    name: Build, sign & publish bundle
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check required secrets
        env:
          MERO_SIGN_KEY: ${{ secrets.MERO_SIGN_KEY }}
          CALIMERO_REGISTRY_API_KEY: ${{ secrets.CALIMERO_REGISTRY_API_KEY }}
        run: |
          missing=0
          [ -n "$MERO_SIGN_KEY" ] || { echo "::error::MERO_SIGN_KEY secret is not set"; missing=1; }
          [ -n "$CALIMERO_REGISTRY_API_KEY" ] || { echo "::error::CALIMERO_REGISTRY_API_KEY secret is not set"; missing=1; }
          exit $missing

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07
        with:
          toolchain: "1.89.0"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deploy-${{ runner.os }}-${{ hashFiles('logic/Cargo.lock') }}
          restore-keys: cargo-deploy-${{ runner.os }}-

      - name: Install wasm-opt
        run: sudo apt-get update -q && sudo apt-get install -y -q binaryen

      - name: Install cargo-mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Write signing key
        env:
          MERO_SIGN_KEY_CONTENTS: ${{ secrets.MERO_SIGN_KEY }}
        run: |
          umask 077
          printf '%s' "$MERO_SIGN_KEY_CONTENTS" > "$RUNNER_TEMP/mero-sign-key.json"
          echo "MERO_SIGN_KEY=$RUNNER_TEMP/mero-sign-key.json" >> "$GITHUB_ENV"

      # No --app-version: the tool reads `[package] version`, which is the same
      # value the gate compared, so the two cannot drift.
      - name: Build & sign bundle
        id: bundle
        working-directory: logic
        run: |
          MPK="$(cargo mero bundle --key "$MERO_SIGN_KEY" --print-output-path | tail -1)"
          echo "mpk=$MPK" >> "$GITHUB_OUTPUT"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mero-sign-key.json"

      - name: Publish to App Registry
        working-directory: logic
        env:
          CALIMERO_API_KEY: ${{ secrets.CALIMERO_REGISTRY_API_KEY }}
          CALIMERO_REGISTRY_URL: https://apps.calimero.network
        run: cargo mero publish "${{ steps.bundle.outputs.mpk }}"

      - name: Summary
        run: |
          {
            echo "### Bundle published :rocket:"
            echo ""
            echo "- **Package:** \`com.calimero.chat\`"
            echo "- **Version:** \`${{ needs.check.outputs.version }}\`"
            echo "- **Registry:** https://apps.calimero.network"
          } >> "$GITHUB_STEP_SUMMARY"
