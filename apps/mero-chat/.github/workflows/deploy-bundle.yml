# Builds, signs, and publishes the com.calimero.chat logic bundle to the
# Calimero App Registry — triggered by pushing a release tag `vX.Y.Z`. The
# version comes FROM THE TAG (new tag → new version); there is no registry
# auto-bump. Manual runs via workflow_dispatch take an explicit `version` input.
#
# Signing uses a PRODUCTION mero-sign key held in ORGANIZATION secrets (never a
# dev key). Required org (or repo) secrets:
#   MERO_SIGN_KEY              — full JSON of the production mero-sign key file
#                                ({private_key, public_key, signer_id}). Must be
#                                the key that signed com.calimero.chat's first
#                                version — the signer is pinned per package — or
#                                any key linked to the owning org in the registry.
#   CALIMERO_REGISTRY_API_KEY  — API token from the registry Organizations page
#                                (CLI Access), whose owner is in the package's org.

name: Deploy Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version to publish, e.g. 0.1.1 (no leading v)'
        required: true
        type: string

# Serialize releases: the registry rejects a duplicate version, and two tags
# publishing at once shouldn't interleave.
concurrency:
  group: deploy-bundle
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Commit the 0.11.0-rc.13 tag points to in calimero-network/core — pinned to
  # the SHA (not the tag) so a moved tag can't change what gets compiled.
  # Keep in sync with the calimero-sdk tag in logic/Cargo.toml.
  MERO_SIGN_REV: 64c17161102cc68c226c5c051315802b95583143
  REGISTRY_CLI_VERSION: 1.15.2

jobs:
  deploy:
    name: Build, sign & publish bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check required secrets
        env:
          MERO_SIGN_KEY: ${{ secrets.MERO_SIGN_KEY }}
          CALIMERO_REGISTRY_API_KEY: ${{ secrets.CALIMERO_REGISTRY_API_KEY }}
        run: |
          missing=0
          [ -n "$MERO_SIGN_KEY" ] || { echo "::error::MERO_SIGN_KEY secret is not set"; missing=1; }
          [ -n "$CALIMERO_REGISTRY_API_KEY" ] || { echo "::error::CALIMERO_REGISTRY_API_KEY secret is not set"; missing=1; }
          exit $missing

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07
        with:
          toolchain: "1.89.0"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deploy-${{ runner.os }}-${{ hashFiles('logic/Cargo.lock') }}
          restore-keys: cargo-deploy-${{ runner.os }}-

      - name: Install wasm-opt
        run: sudo apt-get update -q && sudo apt-get install -y -q binaryen

      - name: Cache mero-sign
        id: cache-mero-sign
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.1
        with:
          path: ~/.cargo/bin/mero-sign
          key: mero-sign-${{ runner.os }}-${{ env.MERO_SIGN_REV }}

      - name: Install mero-sign
        if: steps.cache-mero-sign.outputs.cache-hit != 'true'
        run: |
          cargo install mero-sign --locked \
            --git https://github.com/calimero-network/core \
            --rev "$MERO_SIGN_REV"

      - name: Write signing key
        env:
          MERO_SIGN_KEY: ${{ secrets.MERO_SIGN_KEY }}
        run: |
          umask 077
          printf '%s' "$MERO_SIGN_KEY" > "$RUNNER_TEMP/mero-sign-key.json"

      - name: Resolve version (from tag or dispatch input)
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"   # tag vX.Y.Z -> X.Y.Z
          fi
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::version must be X.Y.Z (got '$v' from ref '$GITHUB_REF_NAME')"; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing version $v"

      - name: Build & sign bundle
        env:
          MERO_SIGN_KEY_FILE: ${{ runner.temp }}/mero-sign-key.json
          APP_VERSION_OVERRIDE: ${{ steps.ver.outputs.version }}
        run: ./logic/build-bundle.sh

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mero-sign-key.json"

      - name: Install calimero-registry CLI
        run: npm install -g --ignore-scripts "@calimero-network/registry-cli@$REGISTRY_CLI_VERSION"

      - name: Publish to App Registry
        env:
          CALIMERO_API_KEY: ${{ secrets.CALIMERO_REGISTRY_API_KEY }}
          CALIMERO_REGISTRY_URL: https://apps.calimero.network
        run: |
          mpk="logic/res/chat-${{ steps.ver.outputs.version }}.mpk"
          if [ ! -f "$mpk" ]; then
            echo "::error::expected bundle not found: $mpk"; ls -la logic/res || true; exit 1
          fi
          echo "Publishing $mpk"
          calimero-registry bundle push "$mpk" --remote

      - name: Summary
        run: |
          {
            echo "### Bundle published :rocket:"
            echo ""
            echo "- **Package:** \`com.calimero.chat\`"
            echo "- **Version:** \`${{ steps.ver.outputs.version }}\`"
            echo "- **Registry:** https://apps.calimero.network"
          } >> "$GITHUB_STEP_SUMMARY"
