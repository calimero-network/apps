# Full-stack integration CI: builds curb.wasm, starts real merod nodes via
# merobox, installs the app onto the nodes, seeds test data, then runs the
# Playwright "integration" project against the live stack.

name: Integration Tests (Full Stack)

on:
  push:
    branches: [main, master]
    paths:
      - "logic/**"
      - "app/**"
      - "workflows/**"
      - "scripts/**"
  pull_request:
    branches: [main, master]
    paths:
      - "logic/**"
      - "app/**"
      - "workflows/**"
      - "scripts/**"

concurrency:
  group: integration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Full-Stack Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # ── Build curb WASM ───────────────────────────────────────────────────────

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          key: cargo-${{ runner.os }}-${{ hashFiles('logic/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-mero
        uses: ./.github/actions/setup-cargo-mero

      # Builds res/curb.wasm (ABI embedded, wasm-opt'd) AND the signed .mpk, then
      # stages the .mpk at the fixed `logic/dist/curb.mpk` the scenarios install
      # from. `cargo mero bundle` alone is NOT enough any more: it names the file
      # after `[package] version`, and since rc.41 the node refuses a raw
      # `res/curb.wasm` outright ("not a signed application bundle"), which
      # merobox reports as a bare 500 on the install step. See logic/stage-bundle.sh.
      - name: Build curb WASM and stage the bundle
        working-directory: logic
        run: ./stage-bundle.sh

      # ── Install merobox ───────────────────────────────────────────────────────

      - name: Install merobox
      # ⚠️ calimero-client-py MUST be pinned, not just merobox. It is the layer
      # that actually builds the admin-API request, merobox only requires a
      # floor, and it tracks core master — so an unpinned install silently picks
      # up whatever landed today.
      #
      # That is not hypothetical here. Leaving it unpinned resolved to 0.6.33,
      # which expects rc.25's renamed `namespaceId`, against the rc.24 node these
      # scenarios started:
      #
      #     Join namespace failed: Client error: missing field `namespaceId`
      #
      # 0.6.66/0.6.33 is the pair that ran green against rc.26 nodes. The rc.41
      # node below needs 0.6.75/0.7.0, which is the pair mero-ar and mero-tag run
      # against rc.38+ — 0.6.33 predates client-py #102/#105, which stopped the
      # client dropping `admitters` and the admitter addresses from an invitation
      # on re-encode, and rc.29 made `admitters` non-empty. A dropped `admitters`
      # is refused by the node, so the two-node join in integration-setup.yml
      # cannot pass on the old pair whatever the scenario says.
      #
      # Bump BOTH together and in this order: client-py 0.7.0 dropped a kwarg
      # older merobox passes, so 0.6.66 + 0.7.0 does not work either.
        run: pip install merobox==0.6.75 calimero-client-py==0.7.0 && merobox --version

      # ── Start nodes + install curb app + create context + seed messages ───────
      # integration-setup.yml sets stop_all_nodes: false so nodes stay running.

      - name: Run integration-setup workflow (merobox)
        working-directory: workflows
        run: |
          merobox stop --all 2>/dev/null || true
          merobox nuke --force 2>/dev/null || true
          # ⚠️ `nuke` reports "Deleting N data directory(ies)... No data
          # directories were deleted." The rocksdb under
          # `workflows/data/calimero-node-N` is written by the container as
          # root, so the runner user cannot remove it and it survives. A node
          # that boots onto a previous run's database 500s on namespace
          # creation with "failed to mint this node's account" — which reads as
          # a flaky node, not as leftover state. `sudo` is what makes the wipe
          # happen. This job caches nothing between runs, but a re-run on the
          # same runner, or a cancelled run, leaves the directory behind.
          sudo rm -rf data
          # --e2e-mode: without it merod keeps its DEFAULT bootstrap nodes, so
          # these containers join the public network, discover each other's
          # public and relay addresses through the shared rendezvous, and dial
          # those instead of the local ones — 'Failed to negotiate transport
          # protocol(s): Handshake with the remote timed out'. It passed or
          # failed depending on whether the local path won that race, which is
          # why it read as flake. It also gives the run its own rendezvous
          # namespace, so concurrent CI runs stop finding each other's nodes.
          merobox bootstrap run integration-setup.yml --e2e-mode

      # ── Bootstrap JWT auth + discover IDs + write app/.env.integration ────────

      - name: Bootstrap auth and write env file
        run: |
          set -euo pipefail
          NODE_1_URL="http://localhost:2528"
          NODE_2_URL="http://localhost:2529"

          echo "Running containers:"
          docker ps -a 2>/dev/null || true
          echo "Waiting for both nodes to be healthy…"
          for i in $(seq 1 90); do
            if curl -sf "${NODE_1_URL}/admin-api/health" >/dev/null 2>&1 && \
               curl -sf "${NODE_2_URL}/admin-api/health" >/dev/null 2>&1; then
              echo "Both nodes healthy (attempt ${i})"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Nodes not healthy after 180 s — dumping logs"
              docker ps -a 2>/dev/null || true
              docker logs calimero-node-1 2>/dev/null | tail -30 || true
              docker logs calimero-node-2 2>/dev/null | tail -30 || true
              exit 1
            fi
            sleep 2
          done

          # merobox starts containers without --auth-mode embedded, so
          # /auth/token is unavailable and the admin API is open (no auth
          # required). Generate a placeholder JWT so integrationEnvAvailable()
          # returns true; the node ignores Bearer tokens in open-auth mode.
          _hdr=$(printf '{"alg":"HS256","typ":"JWT"}' \
            | base64 | tr -d '=' | tr '/+' '_-' | tr -d '\n')
          _pay=$(printf '{"sub":"ci","iss":"calimero-auth","aud":"calimero-auth","exp":9999999999,"iat":0,"jti":"ci","permissions":["admin"],"node_url":""}' \
            | base64 | tr -d '=' | tr '/+' '_-' | tr -d '\n')
          PLACEHOLDER_JWT="${_hdr}.${_pay}.ci-placeholder"
          ACCESS_TOKEN_1="$PLACEHOLDER_JWT"
          REFRESH_TOKEN_1="$PLACEHOLDER_JWT"
          ACCESS_TOKEN_2="$PLACEHOLDER_JWT"
          REFRESH_TOKEN_2="$PLACEHOLDER_JWT"

          # BOTH ids come from `GET /admin-api/contexts`, in one call.
          #
          # There is no `GET /admin-api/groups` on rc.41 — the router has
          # `POST /groups` (create) and `GET /groups/{group_id}` (fetch one),
          # and nothing that lists them. The old code called it anyway and
          # `curl -sf` did not reject the answer, which came back as the bare
          # token `1001`; `jq` saw a number rather than an array or object,
          # took its `else empty end` branch, and produced an EMPTY GROUP_ID
          # with no error anywhere.
          #
          # That matters more than the route does. `integrationEnvAvailable()`
          # requires a group id, and every integration test calls `test.skip()`
          # without one — so on rc.41 this step would have written an env file
          # that skipped the ENTIRE suite while the job reported success. The
          # guard below is what turned that into a red build instead. (MEASURED
          # on this branch; whether the older route answered properly on the
          # rc.26 nodes master runs was not checked — those logs have expired.)
          #
          # The context row already carries `groupId`, and it is the better
          # source anyway: it is by construction the group that owns the
          # context the tests use, which a separate listing could not promise.
          CTXS=$(curl -sf "${NODE_1_URL}/admin-api/contexts" \
            2>/dev/null) || CTXS="{}"
          CTX=$(echo "$CTXS" | jq -c '
            (.data // .) |
            if type == "array" then .[0]
            elif type == "object" then (.contexts[0] // .items[0])
            else empty end' 2>/dev/null || echo "null")
          CONTEXT_ID=$(echo "$CTX" | jq -r '(.id // .contextId) // empty' 2>/dev/null || echo "")
          GROUP_ID=$(echo "$CTX" | jq -r '(.groupId // .group_id) // empty' 2>/dev/null || echo "")
          GROUPS="(not queried — rc.41 has no GET /admin-api/groups)"

          MEMBER_KEY=""
          if [ -n "$CONTEXT_ID" ]; then
            IDENTS=$(curl -sf \
              "${NODE_1_URL}/admin-api/contexts/${CONTEXT_ID}/identities-owned" \
              2>/dev/null) || IDENTS="{}"
            MEMBER_KEY=$(echo "$IDENTS" | jq -r '
              (.data // .) |
              if type == "array" then .[0]
              elif type == "object" then (.identities[0] // .items[0])
              else empty end' 2>/dev/null || echo "")
          fi

          echo "GROUP_ID:   ${GROUP_ID:-<not found>}"
          echo "CONTEXT_ID: ${CONTEXT_ID:-<not found>}"

          # Fail here rather than let the suite skip itself.
          #
          # `integrationEnvAvailable()` requires all four of node url, token,
          # group id and context id, and every integration test calls
          # `test.skip()` when one is missing. So a discovery step that quietly
          # produced an empty id gives a GREEN job that ran nothing — the job
          # name says "Full-Stack Integration Tests" and the report says zero
          # failures, which is indistinguishable from the suite passing.
          if [ -z "${GROUP_ID}" ] || [ -z "${CONTEXT_ID}" ]; then
            echo "::error::Could not discover the group/context the merobox setup created."
            echo "  /admin-api/groups   → ${GROUPS}"
            echo "  /admin-api/contexts → ${CTXS}"
            echo "Without both, every integration test skips and the job passes vacuously."
            exit 1
          fi

          cat > app/.env.integration << ENVEOF
          E2E_NODE_URL=${NODE_1_URL}
          E2E_NODE_URL_2=${NODE_2_URL}
          E2E_ACCESS_TOKEN=${ACCESS_TOKEN_1}
          E2E_REFRESH_TOKEN=${REFRESH_TOKEN_1}
          E2E_ACCESS_TOKEN_2=${ACCESS_TOKEN_2}
          E2E_REFRESH_TOKEN_2=${REFRESH_TOKEN_2}
          E2E_GROUP_ID=${GROUP_ID:-}
          E2E_CONTEXT_ID=${CONTEXT_ID:-}
          E2E_MEMBER_KEY=${MEMBER_KEY:-}
          ENVEOF
          echo "app/.env.integration written"

      # ── Frontend setup ────────────────────────────────────────────────────────

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: app
        run: pnpm exec playwright install chromium --with-deps

      # ── Run integration Playwright tests ──────────────────────────────────────

      - name: Run integration tests
        working-directory: app
        run: pnpm exec playwright test --project=integration
        env:
          CI: "true"
          # Tells global-setup.ts to skip browser auth — integration tests
          # inject tokens directly via injectRealTokens() per test.
          INTEGRATION_MODE: "true"

      # ── Cleanup ───────────────────────────────────────────────────────────────

      - name: Stop nodes
        if: always()
        run: |
          merobox stop --all 2>/dev/null || true
          merobox nuke --force 2>/dev/null || true
          # See the note on the setup step: nuke leaves the root-owned rocksdb.
          sudo rm -rf workflows/data

      # ── Artifacts ─────────────────────────────────────────────────────────────

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-playwright-report
          path: app/e2e-report/
          retention-days: 7
