[package]
name = "curb"
description = "Calimero chat"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
borsh = "1.6.1"
borsh-derive = "1.6.1"
bs58 = "0.5.1"
# Pinned to a commit, not `branch = "master"`: a floating branch isn't a pin
# — a CI run and a local build could silently resolve different commits.
calimero-sdk = { git = "https://github.com/calimero-network/core.git", rev = "50f26c2c5d11e15b00079ad182f0cc4397c72a38" }
calimero-storage = { git = "https://github.com/calimero-network/core.git", rev = "50f26c2c5d11e15b00079ad182f0cc4397c72a38" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core.git", rev = "50f26c2c5d11e15b00079ad182f0cc4397c72a38" }
thiserror = "1.0.56"

# ABI description is a host-build concern: the manifest is extracted by running
# the app natively. Linking it into the wasm only bloats the module.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
calimero-wasm-abi = { git = "https://github.com/calimero-network/core.git", rev = "50f26c2c5d11e15b00079ad182f0cc4397c72a38" }

[build-dependencies]
calimero-wasm-abi = { git = "https://github.com/calimero-network/core.git", rev = "50f26c2c5d11e15b00079ad182f0cc4397c72a38" }
serde_json = "1.0.113"

[dev-dependencies]
# Enables register_crdt_merge + the native mock host so TestHost can drive the
# AccessControl writer-set state under `cargo test`.
calimero-storage = { git = "https://github.com/calimero-network/core.git", rev = "50f26c2c5d11e15b00079ad182f0cc4397c72a38", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.calimero]
package     = "com.calimero.chat"
name        = "Mero Chat"
description = "Mero Chat v2 - group-based context management. Each context is one channel or DM."
author      = "Calimero"
icon        = "../app/public/icons/icon-512x512.png"
frontend    = "https://mero-chat-pwa.vercel.app/"
slug        = "com.calimero.chat"
