[package]
name = "curb"
description = "Calimero chat"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
borsh = "1.6.1"
borsh-derive = "1.6.1"
bs58 = "0.5.1"
# Pinned to a core master commit, not a tag: 0.11.0-rc.19 predates the
# AccountId identity change and no release has shipped since. Re-pin to a
# tag once core cuts one containing both this and the ABI machinery below.
calimero-sdk = { git = "https://github.com/calimero-network/core.git", rev = "50f26c2c5d11e15b00079ad182f0cc4397c72a38" }
calimero-storage = { git = "https://github.com/calimero-network/core.git", rev = "50f26c2c5d11e15b00079ad182f0cc4397c72a38" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core.git", rev = "50f26c2c5d11e15b00079ad182f0cc4397c72a38" }
# Direct dependency (not just a build-dependency): the ABI self-description
# macro below uses the absolute path ::calimero_wasm_abi::..., which only
# resolves a direct dependency.
calimero-wasm-abi = { git = "https://github.com/calimero-network/core.git", rev = "50f26c2c5d11e15b00079ad182f0cc4397c72a38" }
thiserror = "1.0.56"

[build-dependencies]
calimero-wasm-abi = { git = "https://github.com/calimero-network/core.git", rev = "50f26c2c5d11e15b00079ad182f0cc4397c72a38" }
serde_json = "1.0.113"

[dev-dependencies]
# Enables register_crdt_merge + the native mock host so TestHost can drive the
# AccessControl writer-set state under `cargo test`.
calimero-storage = { git = "https://github.com/calimero-network/core.git", rev = "50f26c2c5d11e15b00079ad182f0cc4397c72a38", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

