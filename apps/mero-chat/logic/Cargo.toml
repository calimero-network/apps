[package]
name = "curb"
description = "Calimero chat"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23.0"
borsh = "1.6.1"
borsh-derive = "1.6.1"
bs58 = "0.5.1"
# Message ids are a digest, not a transcript — see `get_message_id`. Already in
# the tree via the SDK, so this adds no code to the wasm.
sha2 = { version = "0.10", default-features = false }
# Tracks core master; Cargo.lock is what actually pins the commit, so a bump
# is a deliberate `cargo update`, reviewed as its own diff.
calimero-sdk = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.24" }
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.24" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.24" }
thiserror = "1.0.56"

# ABI description is a host-build concern: the manifest is extracted by running
# the app natively. Linking it into the wasm only bloats the module.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
calimero-wasm-abi = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.24" }

[dev-dependencies]
# Enables register_crdt_merge + the native mock host so TestHost can drive the
# AccessControl writer-set state under `cargo test`.
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.24", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.calimero]
package     = "com.calimero.chat"
name        = "Mero Chat"
description = "Mero Chat v2 - group-based context management. Each context is one channel or DM."
author      = "Calimero"
icon        = "../app/public/icons/icon-512x512.png"
frontend    = "https://mero-chat-pwa.vercel.app/"
slug        = "com.calimero.chat"
