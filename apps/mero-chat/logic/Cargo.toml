[package]
name = "curb"
description = "Calimero chat"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
borsh = "1.6.1"
borsh-derive = "1.6.1"
bs58 = "0.5.1"
calimero-sdk = "0.11.0-rc.5"
calimero-storage = "0.11.0-rc.5"
calimero-storage-macros = "0.11.0-rc.5"
thiserror = "1.0.56"

[build-dependencies]
calimero-wasm-abi = "0.11.0-rc.5"
serde_json = "1.0.113"

[dev-dependencies]
# Enables register_crdt_merge + the native mock host so TestHost can drive the
# AccessControl writer-set state under `cargo test`.
calimero-storage = { version = "0.11.0-rc.5", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

