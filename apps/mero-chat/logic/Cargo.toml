[package]
name = "curb"
description = "Calimero chat"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23.0"
borsh = "1.6.1"
borsh-derive = "1.6.1"
bs58 = "0.5.1"
# Message ids are a digest, not a transcript — see `get_message_id`. Already in
# the tree via the SDK, so this adds no code to the wasm.
sha2 = { version = "0.10", default-features = false }
# Pinned to a real release TAG — this does NOT track master, whatever the old
# comment here said. Cargo.lock records which commit the tag resolved to, so a
# bump is a deliberate `cargo update` reviewed as its own diff.
calimero-sdk = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.25" }
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.25" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.25" }
thiserror = "1.0.56"

# ABI description is a host-build concern: the manifest is extracted by running
# the app natively. Linking it into the wasm only bloats the module.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
calimero-wasm-abi = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.25" }

[dev-dependencies]
# Enables register_crdt_merge + the native mock host so TestHost can drive the
# AccessControl writer-set state under `cargo test`.
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.25", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.calimero]
package     = "com.calimero.chat"
name        = "Mero Chat"
description = "Mero Chat v2 - group-based context management. Each context is one channel or DM."
author      = "Calimero"
icon        = "../app/public/icons/icon-512x512.png"
frontend    = "https://mero-chat-pwa.vercel.app/"
slug        = "com.calimero.chat"
# Equal to the SDK tag above, always. Absent until now, which is why the
# registry advertises `minRuntimeVersion: 0.1.0` for this package: that is
# cargo-mero's placeholder floor, and it tells every node "any version will do"
# while the wasm calls host functions an old node does not have.
#
# NOTE the deliberate mismatch with the e2e: `workflows/*.yml` still start a
# merod 0.11.0-rc.24 node. Moving them to rc.25 requires merobox >= 0.6.59 (rc.25
# renamed the namespace-join response field `groupId` -> `namespaceId`), and this
# repo pins merobox 0.6.24 — 42 releases back, with a scenario schema 0.6.66
# rejects in three places. That migration is its own piece of work; see the PR
# that added this line. The mismatch is safe in the meantime: `crates/sys`, the
# host-function surface, is unchanged between rc.24 and rc.25, so the wasm's
# import set cannot have outgrown an rc.24 node.
min-runtime-version = "0.11.0-rc.25"
