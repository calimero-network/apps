name: Mero Chat mobile - delegated relay
description: >
  One real relay for the native apps' live tests (mobile/ios, mobile/android).

  The phone apps run no node: they hold a device key an account certified, and
  reach a relay that serves delegated access. This boots exactly that relay and
  nothing else, then leaves it running for the platform tests:

    - embedded auth, so the node checks every token itself and `/auth/challenge`
      serves the `account_proof` provider (`--device-key-login`);
    - `--delegated-access`, so `/contexts/{id}/intents`, the context and
      governance intents and `/presence-intents` are served with the warrant
      (or signed statement) as the credential;
    - the mero-chat bundle installed, so a namespace founded through the relay
      can target it.

  The relay must be a merod built with `mock-attestation`: founding through a
  relay attests it afresh, a plain non-TEE merod has no quote to give, and the
  SDKs accept a mock quote only from a loopback relay. It must also carry
  calimero-network/core#4611 (`/admit` without a credential) — see
  `run-relay.sh` for the pinned core commit.

  Everything account-side (minting the account, founding, channels, messages,
  invitations, joins) is the platform tests' own work, through the SDKs. This
  file only provides the node.

force_pull_image: false
no_docker: true
nuke_on_start: true
stop_all_nodes: false
restart: false
wait_timeout: 120
auth_mode: embedded

nodes:
  count: 1
  prefix: chat-relay
  # At init, not by a later `merod config`: merobox's start_node re-initialises
  # a node and rewrites config.toml, discarding an edit made before a restart.
  init_args:
    chat-relay-1:
      - --device-key-login
      - --delegated-access
      # IPv4 only: merod's defaults also bind `::`, which fails outright on a
      # host without IPv6 (some CI sandboxes), and the tests reach the relay on
      # 127.0.0.1 anyway.
      - --swarm-host
      - 0.0.0.0
      - --server-host
      - 127.0.0.1

steps:
  # Into `merod run --mock-tee`. A per-node `mock_tee: true` in the node table
  # would boot it mock from the start, but that form needs every node named,
  # and merobox then reads `init_args` as a second node to start. One node has
  # no mesh for a restart to disturb, so the restart is the cleaner of the two.
  - name: Stop the relay
    type: stop_node
    nodes: chat-relay-1

  - name: Start the relay with a mock TEE
    type: start_node
    nodes: chat-relay-1
    mock_tee: true
    wait_for_ready: true

  - name: Login on the relay
    type: login
    node: chat-relay-1
    username: dev
    password: dev-password

  - name: Install mero-chat on the relay
    type: install_application
    node: chat-relay-1
    # Relative to this file; run-relay.sh puts the bundle here.
    path: res/com.calimero.chat.mpk
    dev: true
    outputs:
      app_id: applicationId
