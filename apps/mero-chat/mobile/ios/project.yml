# XcodeGen spec for the native iOS Mero Chat app and its unit tests.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroChat.xcodeproj (not committed)
#   open MeroChat.xcodeproj
#
# The SDK is consumed from GitHub, pinned by revision to the head of its
# Calimero 1.0 port (calimero-network/swift-sdk#85, branch feat/calimero-1.0);
# it moves to the merge commit once that lands. To bump it, change `revision`
# below and regenerate.
name: MeroChat

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: a1ec644130d4405a1bab7547654b1442cc559b49

targets:
  MeroChat:
    type: application
    platform: iOS
    sources:
      - Sources/Core
      - Sources/App
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Chat
        # Figtree, the web app's face (SIL Open Font License, Resources/Fonts/OFL.txt).
        UIAppFonts: [Figtree-Variable.ttf]
        UILaunchScreen: {}
        CFBundleURLTypes:
          # The node's consent page returns here after an approval
          # (`mero-chat://consent?request_id=…&result=…`).
          # ASWebAuthenticationSession intercepts it itself; registering it also
          # lets `onOpenURL` see a return that arrives outside the sheet.
          - CFBundleURLName: network.calimero.chat.consent
            CFBundleURLSchemes: [mero-chat]
          # Invitation deep links: `calimero://com.calimero.chat/join?invitation=…`.
          - CFBundleURLName: network.calimero.chat.invite
            CFBundleURLSchemes: [calimero]
        # The consent page's return. An https host (Associated Domains, iOS
        # 17.4+) replaces the scheme when set.
        MeroChatCallbackScheme: mero-chat
        MeroChatCallbackHost: ""
        MeroChatCallbackPath: /consent
        # The Calimero Cloud cluster to sign in to: a node URL from the
        # console. Empty: the sign-in screen asks for one. See README.md.
        CalimeroClusterURL: ""
        # The development node (`merod local`) the sign-in screen prefills.
        DefaultNodeURL: "http://localhost:2501"
        # The Mero Chat version new channels run. Empty: the latest.
        MeroPackageVersion: ""
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # Plain http only to a node on the local network (merod local --dev);
        # everything else stays https under ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Signing in with the device's passkey on a real cluster needs the
    # cluster's relying party as an associated domain: add an entitlements
    # file with `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`.
    # A development node uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.chat
        PRODUCT_NAME: MeroChat
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # Logic tests: the chat layer (Sources/Core) compiled straight into the test
  # bundle, with no host app, so MeroKit is linked exactly once and the SDK's
  # test doubles (MeroKitTestSupport) sit beside it.
  MeroChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Sources/Core
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.chat.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitTestSupport

  # Live tests: the same chat layer against a REAL Calimero 1.0 development
  # node (`merod local`). Their own target, not MeroChatTests: they drive the
  # session the app's SessionModel builds (MeroKitUI's MeroClient and
  # CloudAppBackend), while the logic tests deliberately link no UI module.
  # Every case skips itself unless MERO_E2E_NODE_URL is set (see
  # LiveTests/LiveRig.swift), so running the whole scheme offline stays green.
  MeroChatLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Sources/Core
      - LiveTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.chat.livetests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # Snapshot tests: every screen drawn with sample data in a window inside the
  # app (hosted), light and dark. They assert each screen draws; with
  # TEST_RUNNER_MERO_SNAPSHOT_DIR set they also write PNGs there.
  MeroChatSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SnapshotTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.chat.snapshots
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: MeroChat
      # The host app already carries MeroKit; linking it again would load two copies.
      - package: MeroKit
        product: MeroKit
        link: false

schemes:
  MeroChat:
    build:
      targets:
        MeroChat: all
        MeroChatTests: [test]
        MeroChatLiveTests: [test]
        MeroChatSnapshotTests: [test]
    test:
      targets:
        - MeroChatTests
        - MeroChatLiveTests
        - MeroChatSnapshotTests
