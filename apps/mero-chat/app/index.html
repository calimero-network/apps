<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, safe-area-inset-top" />
    <title>Hyperfeed Chat</title>
    <meta name="description" content="Private team chat: channels, threads and direct messages only your team can read. Passkey sign-in, no passwords.">
    <meta name="keywords" content="Hyperfeed Chat, Hyperfeed, team chat, private chat, messaging, Calimero">
    <meta name="author" content="Calimero">
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="google" content="notranslate">

    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hyperfeed Chat" />
    <meta property="og:title" content="Hyperfeed Chat" />
    <meta property="og:description" content="Private team chat: channels, threads and direct messages only your team can read. Passkey sign-in, no passwords." />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hyperfeed Chat: private team chat" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hyperfeed Chat" />
    <meta name="twitter:description" content="Private team chat: channels, threads and direct messages only your team can read. Passkey sign-in, no passwords." />
    <meta name="twitter:image" content="./og-image.png" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Hyperfeed Chat" />
    <meta name="msapplication-TileColor" content="#f6f7fb" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileImage" content="./icons/icon-144x144.png" />
    <meta name="msapplication-config" content="./browserconfig.xml" />

    <!-- Theme before first paint: light unless the person picked dark
         (src/theme/theme.ts owns the key and does the same at runtime). -->
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script src="./boot.js"></script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
