name: Mero Leads — a form key's leads and the team's pipeline across two nodes (2-node e2e)
description: >
  The access rules the contract is built on, on real nodes over a signed delta
  path, which no single-node test can exercise:

    1. a member who is not on the team (a form key, here Bob) can submit a
       lead and cannot read one;
    2. the admin sees it on the other node, attributed to the account that
       signed it, and the form key's register counts it;
    3. once added to the team, Bob reads every lead and his pipeline edits
       reach the admin's node: the pipeline's writer set followed the roles;
    4. edits lay over the submission and never rewrite it;
    5. removed from the team, Bob loses the inbox again.

force_pull_image: true

# Required: clears the public boot-node from `bootstrap.nodes`, turns on
# multicast discovery and tightens sync. Without it namespace joins die on
# `KeyDelivery timed out` (see mero-forum's scenario for the full story).
e2e_mode: true

nodes:
  chain_id: testnet-1
  count: 2
  # Must match the `calimero-*` tag in the root Cargo.toml. check-app-metadata.sh
  # asserts this against [workspace.metadata.mero-apps].merod-image.
  image: ghcr.io/calimero-network/merod:0.11.0-rc.90
  prefix: calimero-node
  # rc.26 made mDNS opt-in and merobox does not pass the flag.
  mdns: true
  # Off every other app's pair so this can run beside another scenario.
  base_port: 3160
  base_rpc_port: 3260

steps:
  # ── Bootstrap ───────────────────────────────────────────────────────────────
  - name: Install application on Node 1
    type: install_application
    node: calimero-node-1
    path: dist/com.calimero.mero-leads.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Install application on Node 2
    type: install_application
    node: calimero-node-2
    path: dist/com.calimero.mero-leads.mpk
    dev: true

  # Container health is not readiness: on a cold host the first admin call
  # 500s a few seconds in.
  - name: Settle before the first admin call
    type: wait
    seconds: 12

  - name: Create namespace
    type: create_namespace
    node: calimero-node-1
    application_id: "{{app_id}}"
    outputs:
      namespace_id: namespaceId

  - name: Set default member capabilities
    type: set_default_capabilities
    node: calimero-node-1
    group_id: "{{namespace_id}}"
    capabilities: 15

  - name: Generate identity for Node 2
    type: create_identity
    node: calimero-node-2
    outputs:
      bob_identity: publicKey

  - name: Wait for identity propagation
    type: wait
    seconds: 3

  - name: Node 1 creates invitation for Node 2
    type: create_namespace_invitation
    node: calimero-node-1
    group_id: "{{namespace_id}}"
    outputs:
      invite_bob: invitation

  # The group key's gossip window has to cover peer discovery on a loaded
  # runner too. Without this the join 500s intermittently.
  - name: Settle before the namespace join (cold-join KeyDelivery)
    type: wait
    seconds: 12

  - name: Node 2 joins namespace
    type: join_namespace
    node: calimero-node-2
    group_id: "{{namespace_id}}"
    invitation: "{{invite_bob}}"

  - name: Settle after namespace join
    type: wait
    seconds: 5

  - name: Node 1 creates the inbox
    type: create_context
    node: calimero-node-1
    application_id: "{{app_id}}"
    group_id: "{{namespace_id}}"
    params: '{}'
    outputs:
      inbox_id: contextId
      alice_key: memberPublicKey

  - name: Force Node 2 to sync namespace state
    type: sync_group
    node: calimero-node-2
    group_id: "{{namespace_id}}"

  - name: Settle after sync
    type: wait
    seconds: 5

  - name: Bob joins the inbox
    type: join_context
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    outputs:
      bob_key: memberPublicKey

  - name: Wait for inbox sync
    type: wait_for_sync
    context_id: "{{inbox_id}}"
    nodes: [calimero-node-1, calimero-node-2]
    timeout: 60
    check_interval: 2
    trigger_sync: true

  # ── Who is who ──────────────────────────────────────────────────────────────
  - name: Alice learns her account
    type: call
    node: calimero-node-1
    context_id: "{{inbox_id}}"
    method: my_account
    args: {}
    executor_public_key: "{{alice_key}}"
    outputs:
      alice_account: result.output

  - name: Bob learns his account
    type: call
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    method: my_account
    args: {}
    executor_public_key: "{{bob_key}}"
    outputs:
      bob_account: result.output

  - name: Alice checks she is an admin
    type: call
    node: calimero-node-1
    context_id: "{{inbox_id}}"
    method: am_i_admin
    args: {}
    executor_public_key: "{{alice_key}}"
    outputs:
      alice_admin: result.output

  - name: Bob checks whether he is on the team
    type: call
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    method: am_i_team
    args: {}
    executor_public_key: "{{bob_key}}"
    outputs:
      bob_team_before: result.output

  - name: Read the pipeline's statuses
    type: call
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    method: statuses
    args: {}
    executor_public_key: "{{bob_key}}"
    outputs:
      statuses: result

  - name: Assert the installer is the admin and Bob starts outside the team
    type: json_assert
    statements:
      - 'json_equal({{alice_admin}}, true)'
      - 'json_equal({{bob_team_before}}, false)'

  - name: Assert the pipeline's statuses
    type: assert
    statements:
      - 'contains({{statuses}}, "qualified")'

  # ── 1. A form key submits and cannot read ───────────────────────────────────
  - name: Alice registers Bob's account as a form key
    type: call
    node: calimero-node-1
    context_id: "{{inbox_id}}"
    method: register_form_key
    args:
      account: "{{bob_account}}"
      label: "Contact page"
    executor_public_key: "{{alice_key}}"

  - name: Bob submits a lead, as the website would
    type: call
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    method: submit_lead
    args:
      name: "Ada Lovelace"
      email: "ada@example.com"
      company: "Analytical Engines"
      message: "We would like a demo."
      source: "/contact/"
    executor_public_key: "{{bob_key}}"
    outputs:
      lead_id: result.output

  # ⚠️ `expected_failure: true` can NEVER fail the run by itself, so the error
  # is captured and asserted present.
  - name: Bob tries to read the leads
    type: call
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    method: list_leads
    args: {}
    executor_public_key: "{{bob_key}}"
    expected_failure: true
    outputs:
      bob_read_error: error

  - name: Bob tries to name the inbox
    type: call
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    method: set_inbox_name
    args:
      name: "Not yours"
    executor_public_key: "{{bob_key}}"
    expected_failure: true
    outputs:
      bob_name_error: error

  - name: Assert a form key can write a lead and nothing else
    type: assert
    statements:
      - "is_set({{lead_id}})"
      - "is_set({{bob_read_error}})"
      - "is_set({{bob_name_error}})"

  # ── 2. The admin sees it on the other node ──────────────────────────────────
  - name: Sync the submission
    type: wait_for_sync
    context_id: "{{inbox_id}}"
    nodes: [calimero-node-1, calimero-node-2]
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Alice reads the leads
    type: call
    node: calimero-node-1
    context_id: "{{inbox_id}}"
    method: list_leads
    args: {}
    executor_public_key: "{{alice_key}}"
    outputs:
      alice_leads: result

  - name: Alice reads the form keys
    type: call
    node: calimero-node-1
    context_id: "{{inbox_id}}"
    method: list_form_keys
    args: {}
    executor_public_key: "{{alice_key}}"
    outputs:
      alice_key_row: result.output.0

  - name: Assert the lead reached Node 1, new and attributed to the form key
    type: assert
    statements:
      - 'contains({{alice_leads}}, "Ada Lovelace")'
      - 'contains({{alice_leads}}, {{lead_id}})'
      - 'contains({{alice_leads}}, {{bob_account}})'
      - 'contains({{alice_leads}}, "new")'
      - 'contains({{alice_key_row}}, {{bob_account}})'

  - name: Assert the form key's register counts the lead
    type: json_assert
    statements:
      - 'json_subset({{alice_key_row}}, {"label": "Contact page", "leads": 1})'

  # ── 3. Bob joins the team and works the lead from his own node ──────────────
  # A form key is never offered the team, so Alice forgets the key first.
  - name: Alice forgets Bob's form key
    type: call
    node: calimero-node-1
    context_id: "{{inbox_id}}"
    method: forget_form_key
    args:
      account: "{{bob_account}}"
    executor_public_key: "{{alice_key}}"

  - name: Alice adds Bob to the team
    type: call
    node: calimero-node-1
    context_id: "{{inbox_id}}"
    method: add_team_member
    args:
      who: "{{bob_account}}"
    executor_public_key: "{{alice_key}}"

  - name: Alice names the inbox
    type: call
    node: calimero-node-1
    context_id: "{{inbox_id}}"
    method: set_inbox_name
    args:
      name: "Sales inbox"
    executor_public_key: "{{alice_key}}"

  - name: Sync the team change
    type: wait_for_sync
    context_id: "{{inbox_id}}"
    nodes: [calimero-node-1, calimero-node-2]
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Bob reads the team
    type: call
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    method: list_team
    args: {}
    executor_public_key: "{{bob_key}}"
    outputs:
      bob_team: result

  - name: Bob reads the inbox's name
    type: call
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    method: inbox_name
    args: {}
    executor_public_key: "{{bob_key}}"
    outputs:
      bob_inbox_name: result.output

  - name: Bob moves the lead to contacted
    type: call
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    method: set_status
    args:
      id: "{{lead_id}}"
      status: "contacted"
    executor_public_key: "{{bob_key}}"

  - name: Bob corrects the company and adds a note
    type: call
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    method: update_lead
    args:
      id: "{{lead_id}}"
      changes:
        status: "qualified"
        notes: "Call booked for Thursday"
        owner: "{{bob_account}}"
        name: null
        email: null
        company: "Lovelace & Co"
    executor_public_key: "{{bob_key}}"

  - name: Bob tries a status the pipeline does not have
    type: call
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    method: set_status
    args:
      id: "{{lead_id}}"
      status: "maybe"
    executor_public_key: "{{bob_key}}"
    expected_failure: true
    outputs:
      bad_status_error: error

  - name: Assert Bob is on the team, sees the name and is held to real statuses
    type: assert
    statements:
      - 'contains({{bob_team}}, {{bob_account}})'
      - 'contains({{bob_team}}, {{alice_account}})'
      - 'equal({{bob_inbox_name}}, "Sales inbox")'
      - "is_set({{bad_status_error}})"

  - name: Sync Bob's edits
    type: wait_for_sync
    context_id: "{{inbox_id}}"
    nodes: [calimero-node-1, calimero-node-2]
    timeout: 60
    check_interval: 2
    trigger_sync: true

  # ── 4. Edits lay over the submission ────────────────────────────────────────
  - name: Alice reads the lead
    type: call
    node: calimero-node-1
    context_id: "{{inbox_id}}"
    method: get_lead
    args:
      id: "{{lead_id}}"
    executor_public_key: "{{alice_key}}"
    outputs:
      alice_lead: result

  - name: Assert Bob's edits reached Node 1 and the original stands beside them
    type: assert
    statements:
      - 'contains({{alice_lead}}, "qualified")'
      - 'contains({{alice_lead}}, "Call booked for Thursday")'
      - 'contains({{alice_lead}}, "Lovelace & Co")'
      - 'contains({{alice_lead}}, "Analytical Engines")'
      - 'contains({{alice_lead}}, {{bob_account}})'

  # ── 5. Removed, Bob loses the inbox ─────────────────────────────────────────
  - name: Alice removes Bob from the team
    type: call
    node: calimero-node-1
    context_id: "{{inbox_id}}"
    method: remove_team_member
    args:
      who: "{{bob_account}}"
    executor_public_key: "{{alice_key}}"

  - name: Sync the removal
    type: wait_for_sync
    context_id: "{{inbox_id}}"
    nodes: [calimero-node-1, calimero-node-2]
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Bob tries to read the lead again
    type: call
    node: calimero-node-2
    context_id: "{{inbox_id}}"
    method: get_lead
    args:
      id: "{{lead_id}}"
    executor_public_key: "{{bob_key}}"
    expected_failure: true
    outputs:
      bob_removed_error: error

  - name: Assert the inbox is closed to Bob again
    type: assert
    statements:
      - "is_set({{bob_removed_error}})"
