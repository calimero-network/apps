name: release (publish bundle)

# Build, prod-sign, and (once wired) publish the .mpk application bundle to the
# Calimero App Registry. Triggered by a version tag (v*) or manually.
#
# Signing uses the PROJECT signing key — a generated Ed25519 key stored as the
# MERO_SIGN_KEY repo secret (NOT the Studio prod key). Its signerId owns the
# `com.calimero.mero-sheets` package in the registry.
#
# Publish is wired to the registry's multipart `push-file` endpoint, mirroring
# Studio's worker (registryPublish.js). Auth is an OPTIONAL Bearer token from the
# CALIMERO_API_KEY secret; if unset, the push is attempted unauthenticated (the
# prod registry has historically accepted that).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + sign only; skip the (stubbed) registry publish step'
        type: boolean
        default: false

permissions:
  contents: read

# Never run two publishes concurrently — the registry rejects duplicate
# versions, and build-bundle.sh auto-bumps off the registry's latest.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The App Registry this bundle publishes to AND that build-bundle.sh queries
  # for its version auto-bump. Keep them identical to avoid 409 version
  # collisions between the bump-lookup and the publish target.
  CALIMERO_REGISTRY_URL: https://apps.calimero.network

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Rust toolchain (wasm32)
        run: rustup target add wasm32-unknown-unknown

      # mero-sign is the bundle signer (calimero-network/core/tools/mero-sign).
      # Installed from source so the release is reproducible; pin with a tag/rev
      # here if you need a fixed signer version.
      - name: Install mero-sign
        run: cargo install --git https://github.com/calimero-network/core mero-sign --locked

      # Materialize the project signing key from the secret into a temp file
      # (0600), and point build-bundle.sh at it via MERO_SIGN_KEY. The key JSON
      # is the full output of `mero-sign generate-key`.
      - name: Materialize signing key
        env:
          MERO_SIGN_KEY_JSON: ${{ secrets.MERO_SIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MERO_SIGN_KEY_JSON:-}" ]; then
            echo "::error::MERO_SIGN_KEY secret is not set. Add the project signing key JSON (from 'mero-sign generate-key') as a repo secret." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$MERO_SIGN_KEY_JSON" > "$RUNNER_TEMP/mero-sign.key.json"
          echo "MERO_SIGN_KEY=$RUNNER_TEMP/mero-sign.key.json" >> "$GITHUB_ENV"

      # build-bundle.sh --release: auto-bumps appVersion off the registry,
      # builds each service's wasm+abi, composes manifest.json, signs it with
      # $MERO_SIGN_KEY, and tars the signed .mpk into logic/res/.
      - name: Build + sign bundle (release)
        env:
          REGISTRY_URL: ${{ env.CALIMERO_REGISTRY_URL }}
        run: bash logic/build-bundle.sh --release

      - name: Locate the built bundle
        id: mpk
        run: |
          set -euo pipefail
          mpk="$(ls -t logic/res/*.mpk | head -n1)"
          test -n "$mpk"
          echo "path=$mpk" >> "$GITHUB_OUTPUT"
          echo "Built signed bundle: $mpk"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-mpk
          path: ${{ steps.mpk.outputs.path }}
          if-no-files-found: error

      # Publish: multipart upload of the whole signed .mpk to push-file. The
      # server extracts manifest.json and verifies it AS-IS (preserving
      # services[]). This is push-file, NOT the JSON /push — the latter drops
      # services[] and breaks multi-service signature checks (per registryPublish.js).
      - name: Publish bundle to the registry
        if: ${{ !inputs.dry_run }}
        env:
          CALIMERO_API_KEY: ${{ secrets.CALIMERO_API_KEY }}
        run: |
          set -euo pipefail
          MPK="${{ steps.mpk.outputs.path }}"
          ENDPOINT="${CALIMERO_REGISTRY_URL%/}/api/v2/bundles/push-file"
          echo "Publishing $MPK -> $ENDPOINT"

          AUTH=()
          if [ -n "${CALIMERO_API_KEY:-}" ]; then
            AUTH=(-H "Authorization: Bearer $CALIMERO_API_KEY")
          else
            echo "::warning::CALIMERO_API_KEY not set — pushing unauthenticated (the prod registry has historically accepted this)."
          fi

          http_code="$(curl -sS -o push-resp.json -w '%{http_code}' \
            -X POST "$ENDPOINT" \
            "${AUTH[@]}" \
            -F "bundle=@${MPK};type=application/octet-stream;filename=bundle.mpk")"

          echo "HTTP $http_code"; cat push-resp.json 2>/dev/null || true; echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::registry push-file failed (HTTP $http_code)"; exit 1
          fi
          # The server can return a 2xx with an {error:...} body — treat that as
          # a failure too (mirrors registryPublish.js). Non-JSON 2xx = success.
          if jq -e '.error // empty' push-resp.json >/dev/null 2>&1; then
            echo "::error::registry push-file returned an error body"; exit 1
          fi
          echo "Published $(jq -r '.package // "?"' push-resp.json)@$(jq -r '.version // "?"' push-resp.json) to $CALIMERO_REGISTRY_URL"
