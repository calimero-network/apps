# Two-node smoke test for the neutral item-registry foundation service.
#
# Exercises the parts the v2 generator most often breaks, end-to-end on real
# nodes (what the in-process TestHost / converge harness can't cover):
#   - the `service` crate installed + a context created for it from a bundle
#   - registry state (UnorderedMap<String, Item> with a nested LwwRegister)
#     replicating across two peers
#   - the AuthoredMap owner-gate: a non-owner `delete` is rejected on a real
#     signed-delta path (the gate the bare converge harness can't verify)
#
# Usage (run from the chat project root, after a dev bundle has been built):
#   merobox bootstrap run test/smoke.workflow.yml
#
# Pre-flight: `bash logic/build-bundle.sh` must have produced
# `logic/res/foundation-1.0.0.mpk` (appName/appVersion from studio.config.json).

name: Foundation item-registry smoke
description: Verify the item-registry service replicates state and owner-gates delete across two nodes.
log_level: info
nodes:
  count: 2
  prefix: foundation-node
  # ponytail: pinned off `:edge` to the rc.8-matching tag so the verify merod
  # matches the SDK the logic pins (0.11.0-rc.8). Bump in lockstep with
  # logic/Cargo.toml's SDK tag, or bootstrap skews. ASSUMPTION: ghcr publishes
  # an image tag matching the core git tag `0.11.0-rc.8`; if the registry uses a
  # different naming scheme, correct this tag (and verifierWorkflow.js).
  image: ghcr.io/calimero-network/merod:0.11.0-rc.8
  # High base ports to avoid colliding with a host-native merod on the
  # defaults (2428 P2P / 2528 RPC). Each node gets base + i.
  base_port: 12428      # P2P / swarm
  base_rpc_port: 12528  # JSON-RPC / admin API
nuke_on_start: true
nuke_on_end: true
wait_timeout: 90

steps:
  # --- Bootstrap application + namespace ---

  - type: install_application
    name: Install foundation bundle on node 1
    node: foundation-node-1
    dev: true
    path: ./logic/res/foundation-1.0.0.mpk
    outputs:
      app_id: applicationId

  - type: install_application
    name: Install foundation bundle on node 2
    node: foundation-node-2
    dev: true
    path: ./logic/res/foundation-1.0.0.mpk

  - type: create_namespace
    name: Create namespace on node 1
    node: foundation-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - type: create_context
    name: Create service context on node 1
    node: foundation-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    service_name: service
    outputs:
      ctx: contextId

  - type: create_namespace_invitation
    name: Issue namespace invitation
    node: foundation-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  - type: join_namespace
    name: Node 2 joins namespace
    node: foundation-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'

  # --- Registry state replicates across peers ---

  - type: call
    name: Node 1 adds an item
    node: foundation-node-1
    context_id: '{{ctx}}'
    method: add
    args:
      label: widget
      value: v1
    outputs:
      item_id: result

  - type: wait_for_sync
    name: Wait for the add to sync across both nodes
    context_id: '{{ctx}}'
    nodes: [foundation-node-1, foundation-node-2]
    timeout: 30
    trigger_sync: true

  # Both nodes must see the same single-item list — replication of the
  # UnorderedMap<String, Item> (incl. the nested LwwRegister value).
  - type: call
    name: List items from node 1
    node: foundation-node-1
    context_id: '{{ctx}}'
    method: list
    args: {}
    outputs:
      list_n1: result

  - type: call
    name: List items from node 2
    node: foundation-node-2
    context_id: '{{ctx}}'
    method: list
    args: {}
    outputs:
      list_n2: result

  - type: json_assert
    name: Both nodes see the same item list
    statements:
      - 'equal({{list_n1}}, {{list_n2}})'

  # --- Owner-gated delete (AuthoredMap) ---
  # Node 2 is not the owner of the item node 1 added, so its delete must be
  # rejected. This is the per-entry authorization the bare converge harness
  # cannot test (it needs the signed-delta apply path).
  - type: call
    name: Non-owner delete from node 2 must be rejected
    node: foundation-node-2
    context_id: '{{ctx}}'
    method: delete
    args:
      id: '{{item_id}}'
    expect_error: true

  # The owner (node 1) can delete it.
  - type: call
    name: Owner delete from node 1 succeeds
    node: foundation-node-1
    context_id: '{{ctx}}'
    method: delete
    args:
      id: '{{item_id}}'

  - type: wait_for_sync
    name: Wait for the delete to sync across both nodes
    context_id: '{{ctx}}'
    nodes: [foundation-node-1, foundation-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: Node 2 sees the empty registry
    node: foundation-node-2
    context_id: '{{ctx}}'
    method: count
    args: {}
    outputs:
      count_n2: result

  - type: json_assert
    name: Registry is empty on node 2 after the owner delete
    statements:
      - 'equal({{count_n2}}, 0)'
