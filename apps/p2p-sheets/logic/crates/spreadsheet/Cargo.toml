[package]
name = "p2p-sheets-spreadsheet"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` for the WASM artifact the bundle ships; `rlib` so the in-process
# `TestHost` unit tests and the `tests/converge.rs` integration binary can link
# the crate as a normal Rust library.
crate-type = ["cdylib", "rlib"]

[dependencies]
p2p-sheets-types = { workspace = true }
calimero-sdk = { workspace = true }
calimero-storage = { workspace = true }
calimero-storage-macros = { workspace = true }
bs58 = { workspace = true }

[build-dependencies]
calimero-wasm-abi = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Enables `register_crdt_merge` + the native mock host so `TestHost` and
# `converge_app` can drive CRDT state under `cargo test`.
calimero-storage = { workspace = true, features = ["testing"] }
# Convergence tests are serial: `converge_app` clears/repopulates the
# process-global merge registry per run.
serial_test = { workspace = true }
