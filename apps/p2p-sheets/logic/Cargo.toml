[workspace]
members = [
    "crates/types",
    "crates/spreadsheet"
]
resolver = "2"

[workspace.dependencies]
# Pinned to the 0.11.0-rc.8 node release so the scaffolded logic stays in
# lockstep with the merod the verify pipeline runs. Bump this tag (not to
# `branch = "master"`) when adopting a newer RC — and only to a tag that
# actually exists in core. Confirm the verify merod / merobox image matches
# before bumping, or bootstrap will skew.
calimero-sdk = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.8" }
calimero-storage = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.8" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.8" }
calimero-wasm-abi = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.8" }
thiserror = "1.0.56"
bs58 = "0.4"
serde_json = "1.0.113"
serial_test = "3"
p2p-sheets-types = { path = "crates/types" }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
