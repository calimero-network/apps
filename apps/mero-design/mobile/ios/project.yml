# XcodeGen spec for the native iOS Mero Design app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroDesign.xcodeproj (not committed)
#   open MeroDesign.xcodeproj
#
# Everything that is not a view (the generated contract client, the scene
# builder, the view models) is the local SwiftPM package DesignCore/, which
# `swift test --package-path DesignCore` builds and tests on macOS.
#
# The swift-sdk is pinned to the `feat/app-session` commit (PR #84) until it
# merges; then move both pins (here and DesignCore/Package.swift) to the merge commit.
name: MeroDesign

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 122bb0d71bb43b823cb9d694c4e70678a2ef8c89
  DesignCore:
    path: DesignCore

targets:
  MeroDesign:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Assets.xcassets
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Design
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          # The wallet returns here after Cloud sign-in (`mero-design://enrol#credential=…`).
          - CFBundleURLName: network.calimero.design.enrol
            CFBundleURLSchemes: [mero-design]
          # Deep links: `calimero://com.calimero.mero-design/board?team=…&board=…`.
          - CFBundleURLName: network.calimero.design.links
            CFBundleURLSchemes: [calimero]
        # Where sign-in goes. Empty = the SDK's defaults (the hosted Calimero
        # wallet and Cloud manager). See README.md.
        MeroDesignCallbackScheme: mero-design
        MeroDesignCallbackHost: ""
        MeroDesignCallbackPath: /enrol
        MeroCloudBaseURL: ""
        MeroWalletURL: ""
        MeroRegistryURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.design
        PRODUCT_NAME: MeroDesign
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: DesignCore
        product: DesignCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

schemes:
  MeroDesign:
    build:
      targets:
        MeroDesign: all
