# XcodeGen spec for the native iOS Mero Design app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroDesign.xcodeproj (not committed)
#   open MeroDesign.xcodeproj
#
# Everything that is not a view (the generated contract client, the scene
# builder, the view models) is the local SwiftPM package DesignCore/, which
# `swift test --package-path DesignCore` builds and tests on macOS.
#
# The swift-sdk is pinned by revision to the head of its Calimero 1.0 port
# (calimero-network/swift-sdk#85, branch feat/calimero-1.0); it moves to the
# merge commit once that lands. Keep the pins here, in DesignCore/Package.swift
# and in DesignCore/Package.resolved equal.
#
# Sign-in (Calimero 1.0): the person enters the cluster's node URL (or it is
# baked in as CalimeroClusterURL) and signs in with the device's passkey, or
# connects to a `merod local` development node with mock attestation allowed
# (a software passkey kept per node). Invitation links are redeemed in the app
# (POST /invites/{token}/redeem); approvals open the node's consent page in the
# system browser, which returns to mero-design://consent.
name: MeroDesign

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: a1ec644130d4405a1bab7547654b1442cc559b49
  DesignCore:
    path: DesignCore

targets:
  MeroDesign:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Assets.xcassets
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Design
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          # The node's consent page returns here after an approval
          # (`mero-design://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.design.consent
            CFBundleURLSchemes: [mero-design]
          # Deep links: `calimero://com.calimero.mero-design/board?team=…&board=…`
          # and invitations `calimero://com.calimero.mero-design/join?invitation=…`.
          - CFBundleURLName: network.calimero.design.links
            CFBundleURLSchemes: [calimero]
        # The consent page's return. An https host (Associated Domains, iOS
        # 17.4+) replaces the scheme when set.
        MeroDesignCallbackScheme: mero-design
        MeroDesignCallbackHost: ""
        MeroDesignCallbackPath: /consent
        # The Calimero Cloud cluster to sign in to: a node URL from the
        # console. Empty: the sign-in screen asks for one.
        CalimeroClusterURL: ""
        # The development cluster (`merod local`) the sign-in screen prefills.
        DefaultNodeURL: "http://localhost:2501"
        # The Mero Design version new app instances run. Empty: the latest.
        MeroPackageVersion: ""
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # Plain http only to a node on the local network (merod local --dev);
        # everything else stays https under ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Signing in with the device's passkey on a real cluster needs the
    # cluster's relying party as an associated domain: add an entitlements
    # file with `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`.
    # A development cluster uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.design
        PRODUCT_NAME: MeroDesign
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: DesignCore
        product: DesignCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # The scripted demo tour (Debug, `-MeroDemo YES`): see UITests/TourTests.swift.
  MeroDesignUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MeroDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.design.uitests
        TEST_TARGET_NAME: MeroDesign
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  MeroDesign:
    build:
      targets:
        MeroDesign: all
    test:
      config: Debug
      targets:
        - MeroDesignUITests
