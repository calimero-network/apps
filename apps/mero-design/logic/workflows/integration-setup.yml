# Ported from the v1 workflow integration-setup.yml (`merobox cloud port`).
# v1 nodes are accounts here.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: Integration Test Setup
description: 'Sets up a two-node environment for MeroDesign integration tests. Creates a board context,
  sets up two members (Alice and Bob), adds seed elements, then leaves nodes running for Playwright.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3170
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_design.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.mero-design
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Namespace
  type: create_org
  org_name: Create Namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Set Default Member Capabilities
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 15
  account: calimero-node-1
- name: Create Board Context
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_design.wasm'
  app_name: Create Board Context
  init_args: '{"name": "Integration Board", "description": "Playwright test board"}'
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Create Identity on Node 2
  type: whoami
  account: calimero-node-2
  outputs:
    public_key_2: publicKey
- name: Wait for Identity Setup
  type: wait
  seconds: 1.0
- name: Invite Node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invitation_2: token
- name: Settle before the namespace join (cold-join KeyDelivery)
  type: wait
  seconds: 1.0
- name: Node 2 Joins Namespace
  type: redeem_invite
  token: '{{invitation_2}}'
  account: calimero-node-2
- name: Alice Joins Board
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Alice
    avatar: null
    timestamp: 1751953000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Bob Joins Board
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Bob
    avatar: null
    timestamp: 1751953001
  account: calimero-node-2
  as_key: '{{public_key_2}}'
