name: E2E Two-Node Test
description: >
  Full two-node MeroDesign e2e workflow. Installs app, creates a board,
  adds elements from both nodes, verifies sync.

stop_all_nodes: true
restart: false
wait_timeout: 120

nodes:
  chain_id: testnet-1
  count: 2
  image: ghcr.io/calimero-network/merod:0.11.0-rc.28
  # rc.26 made mDNS opt-in (core#3620) and merobox does not pass the flag,
  # so discovery changed at the image bump. Stated, not inherited.
  mdns: true
  prefix: calimero-node

steps:
  - name: Install Application on Node 1
    type: install_application
    node: calimero-node-1
    path: res/mero_design.wasm
    dev: true
    outputs:
      app_id: applicationId

  - name: Install Application on Node 2
    type: install_application
    node: calimero-node-2
    path: res/mero_design.wasm
    dev: true

  # `create_namespace`, not `create_group`: merobox renamed the namespace verbs
  # once namespaces stopped being "a group that happens to have no parent".
  # The PARAMETER is still `group_id` — a namespace IS a root group — so only
  # the step type moves.
  - name: Create Namespace
    type: create_namespace
    node: calimero-node-1
    application_id: "{{app_id}}"
    outputs:
      namespace_id: namespaceId

  # Namespaces are RESTRICTED by default: without this, node 2 joins and then
  # 403s on its first `call`, which reads as a sync failure rather than a
  # permission one. 15 = the full read/write/execute/manage-member bits.
  - name: Set Default Member Capabilities
    type: set_default_capabilities
    node: calimero-node-1
    group_id: "{{namespace_id}}"
    capabilities: 15

  - name: Create Board
    type: create_context
    node: calimero-node-1
    application_id: "{{app_id}}"
    group_id: "{{namespace_id}}"
    params: '{"name": "E2E Board", "description": ""}'
    outputs:
      context_id: contextId
      member_public_key: memberPublicKey

  # Mints an identity on node 2 so it has something to accept the invitation
  # WITH. Its `publicKey` is deliberately NOT captured: the key that authorizes
  # a `call` is the CONTEXT member key returned by join_context below, and using
  # the raw identity key as executor_public_key produces an authorization error
  # that reads like the contract rejecting the caller.
  - name: Create Identity on Node 2
    type: create_identity
    node: calimero-node-2

  - name: Wait for Identity Propagation
    type: wait
    seconds: 3

  - name: Invite Node 2
    type: create_namespace_invitation
    node: calimero-node-1
    group_id: "{{namespace_id}}"
    outputs:
      invitation_2: invitation

  - name: Settle before the namespace join (cold-join KeyDelivery)
    type: wait
    seconds: 12

  - name: Node 2 Joins Namespace
    type: join_namespace
    node: calimero-node-2
    group_id: "{{namespace_id}}"
    invitation: "{{invitation_2}}"

  - name: Settle After Namespace Join
    type: wait
    seconds: 5

  # The board was created BEFORE node 2 was invited, but node 2 still has to be
  # told it exists. Without this explicit pull, join_context below fails with
  # "context not found" — a race that passes locally on a warm mesh and fails on
  # a cold CI runner.
  - name: Force Node 2 to Sync Namespace State
    type: sync_group
    node: calimero-node-2
    group_id: "{{namespace_id}}"

  - name: Settle After Sync
    type: wait
    seconds: 5

  # The CONTEXT member key, which is what authorizes node 2's calls below.
  - name: Node 2 Joins Context
    type: join_context
    node: calimero-node-2
    context_id: "{{context_id}}"
    outputs:
      public_key_2: memberPublicKey

  - name: Sync
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes: [calimero-node-1, calimero-node-2]
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Add Rect from Node 1
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: add_element
    args:
      element:
        id: "elem-rect-1"
        data: { kind: "rect" }
        x: 100
        y: 100
        width: 200
        height: 150
        rotation: 0
        fill: "#ffffff"
        stroke: "#000000"
        strokeWidth: 2
        opacity: 100
        layerIndex: 0
        createdBy: "node1"
        createdAt: 1751953010
        updatedAt: 1751953010

  - name: Sync after rect
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes: [calimero-node-1, calimero-node-2]
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Verify Elements
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    executor_public_key: "{{public_key_2}}"
    method: get_elements
    args: {}
    outputs:
      elements: result

  - name: Assert Element Synced
    type: assert
    statements:
      - "contains({{elements}}, 'elem-rect-1')"
      - "contains({{elements}}, 'rect')"
