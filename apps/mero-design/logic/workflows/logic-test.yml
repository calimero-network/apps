name: Logic Unit Test
description: >
  Comprehensive test of MeroDesign WASM logic. Verifies all core operations:
  board init, member join, element CRUD, layer reordering, and board update.

stop_all_nodes: true
restart: false
wait_timeout: 120

# ⚠️ REQUIRED, and its absence is why namespace joins kept dying on
# `KeyDelivery timed out`.
#
# Without it, `merod init`'s default `bootstrap.nodes` survives — the PUBLIC
# calimero devnet boot-node. Every container then spends its startup dialing
# unreachable public addresses, and the node log fills with
#
#     libp2p_relay: Dropping in-flight connect request because we are at capacity
#     autonat: ✗ Address /ip4/52.226.124.20/udp/... test failed
#
# until the join gives up with
#
#     join_group: direct namespace-join request found no reachable mesh peer
#     join_group: join response contained no group key
#     KeyDelivery timed out for group ContextGroupId(...)
#
# The peers never found each other; it was never a timing race. `e2e_mode`
# clears `bootstrap.nodes`, gives the workflow its own rendezvous namespace,
# turns multicast discovery on (which is what populates the kad table on a
# single Docker bridge) and tightens the sync intervals. merobox's own
# `apply_e2e_defaults` documents measuring this exact failure with it off.
e2e_mode: true

nodes:
  chain_id: testnet-1
  count: 1
  image: ghcr.io/calimero-network/merod:0.11.0-rc.32
  # rc.26 made mDNS opt-in (core#3620) and merobox does not pass the flag,
  # so discovery changed at the image bump. Stated, not inherited.
  mdns: true
  prefix: calimero-node

steps:
  # ── Bootstrap ─────────────────────────────────────────────────────────────
  - name: Install Application
    type: install_application
    node: calimero-node-1
    path: res/mero_design.wasm
    dev: true
    outputs:
      app_id: applicationId

  # ⚠️ The nodes must be UP before the first admin call. merobox waits for
  # container health, which is not the same as ready: on a genuinely cold
  # host `create_namespace` returns 500 about four seconds into the run.
  # This was masked while the teardown left the previous scenario's
  # containers behind, because the nodes were then already warm.
  - name: Settle before the first admin call
    type: wait
    seconds: 12

  - name: Create Namespace
    type: create_namespace
    node: calimero-node-1
    application_id: "{{app_id}}"
    outputs:
      namespace_id: namespaceId

  - name: Create Board Context
    type: create_context
    node: calimero-node-1
    application_id: "{{app_id}}"
    group_id: "{{namespace_id}}"
    params: '{"name": "Test Board", "description": "Logic test board"}'
    outputs:
      context_id: contextId
      member_public_key: memberPublicKey

  # ── Board info ─────────────────────────────────────────────────────────────
  - name: Get Board
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_board
    args: {}
    outputs:
      board_info: result

  - name: Assert Board Name
    type: assert
    statements:
      - "contains({{board_info}}, 'Test Board')"

  # ── Members ────────────────────────────────────────────────────────────────
  - name: Join as Alice
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: join
    args:
      # member id is derived server-side from the signer (env::executor_id);
      # no client-supplied member_id.
      username: "Alice"
      avatar: null
      timestamp: 1000000

  - name: Get Members
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_members
    args: {}
    outputs:
      members: result

  - name: Assert Alice is Member
    type: assert
    statements:
      - "contains({{members}}, 'Alice')"

  # ── Elements: Add ──────────────────────────────────────────────────────────
  - name: Add Rect Element
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: add_element
    args:
      element:
        id: "rect-1"
        data: { kind: "rect" }
        x: 100
        y: 100
        width: 200
        height: 150
        rotation: 0
        fill: "#ff0000"
        stroke: "#000000"
        strokeWidth: 2
        opacity: 100
        layerIndex: 0
        createdBy: "alice"
        createdAt: 1000001
        updatedAt: 1000001

  - name: Add Circle Element
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: add_element
    args:
      element:
        id: "circle-1"
        data: { kind: "circle" }
        x: 400
        y: 200
        width: 100
        height: 100
        rotation: 0
        fill: "#0000ff"
        stroke: "#000000"
        strokeWidth: 1
        opacity: 80
        layerIndex: 1
        createdBy: "alice"
        createdAt: 1000002
        updatedAt: 1000002

  - name: Add Text Element
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: add_element
    args:
      element:
        id: "text-1"
        data:
          kind: "text"
          content: "Hello MeroDesign"
          fontSize: 24
          fontFamily: "sans-serif"
          bold: false
          italic: false
        x: 50
        y: 50
        width: 300
        height: 40
        rotation: 0
        fill: "#111111"
        stroke: "transparent"
        strokeWidth: 0
        opacity: 100
        layerIndex: 2
        createdBy: "alice"
        createdAt: 1000003
        updatedAt: 1000003

  - name: Get All Elements
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_elements
    args: {}
    outputs:
      all_elements: result

  - name: Assert Three Elements Exist
    type: assert
    statements:
      - "contains({{all_elements}}, 'rect-1')"
      - "contains({{all_elements}}, 'circle-1')"
      - "contains({{all_elements}}, 'text-1')"
      - "contains({{all_elements}}, 'Hello MeroDesign')"

  # ── Elements: Get Single ──────────────────────────────────────────────────
  - name: Get Single Element
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_element
    args:
      id: "rect-1"
    outputs:
      single_el: result

  - name: Assert Single Element Data
    type: assert
    statements:
      - "contains({{single_el}}, 'rect-1')"
      - "contains({{single_el}}, '#ff0000')"

  # ── Elements: Update ──────────────────────────────────────────────────────
  - name: Update Rect Position
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: update_element
    args:
      id: "rect-1"
      x: 250
      y: 300
      width: null
      height: null
      rotation: null
      fill: "#00ff00"
      stroke: null
      stroke_width: null
      opacity: null
      updated_at: 1000010

  - name: Get Updated Element
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_element
    args:
      id: "rect-1"
    outputs:
      updated_el: result

  - name: Assert Updated Values
    type: assert
    statements:
      - "contains({{updated_el}}, '#00ff00')"

  # ── Text Content Update ───────────────────────────────────────────────────
  - name: Update Text Content
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: update_text_style
    args:
      id: "text-1"
      content: "Updated text content"
      font_family: null
      font_size: null
      bold: null
      italic: null
      text_align: null
      vertical_align: null
      updated_at: 1000011

  - name: Verify Text Update
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_element
    args:
      id: "text-1"
    outputs:
      text_el: result

  - name: Assert Text Updated
    type: assert
    statements:
      - "contains({{text_el}}, 'Updated text content')"

  # ── Layer Operations ──────────────────────────────────────────────────────
  - name: Bring Circle to Front
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: bring_to_front
    args:
      id: "circle-1"

  - name: Send Rect to Back
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: send_to_back
    args:
      id: "rect-1"

  - name: Elements After Layer Ops
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_elements
    args: {}
    outputs:
      layered_elements: result

  - name: Assert All Still Present After Layer Ops
    type: assert
    statements:
      - "contains({{layered_elements}}, 'rect-1')"
      - "contains({{layered_elements}}, 'circle-1')"
      - "contains({{layered_elements}}, 'text-1')"

  # ── Board Update ──────────────────────────────────────────────────────────
  - name: Update Board Name
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: update_board
    args:
      name: "Renamed Board"
      description: "Updated description"

  - name: Verify Board Update
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_board
    args: {}
    outputs:
      updated_board: result

  - name: Assert Board Renamed
    type: assert
    statements:
      - "contains({{updated_board}}, 'Renamed Board')"

  # ── Delete ────────────────────────────────────────────────────────────────
  - name: Delete Circle
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: delete_element
    args:
      id: "circle-1"

  - name: Elements After Delete
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_elements
    args: {}
    outputs:
      final_elements: result

  - name: Assert Circle Deleted
    type: assert
    statements:
      - "contains({{final_elements}}, 'rect-1')"
      - "contains({{final_elements}}, 'text-1')"
