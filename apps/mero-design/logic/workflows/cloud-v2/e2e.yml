# Ported from e2e.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   set_default_capabilities x1: capabilities are v1 governance
#   sync_group x1: replication is synchronous
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: E2E Two-Node Test
description: 'Full two-node MeroDesign e2e workflow. Installs app, creates a board, adds elements from
  both nodes, verifies sync.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3160
accounts:
- calimero-node-1
- calimero-node-2
- calimero-node-2-id1
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_design.wasm'
  outputs:
    app_id: hash
  account: calimero-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Namespace
  type: create_org
  org_name: Create Namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Create Board
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_design.wasm'
  app_name: Create Board
  init_args: '{"name": "E2E Board", "description": ""}'
  org: '{{namespace_id}}'
  outputs:
    context_id: appId
    member_public_key: memberPublicKey
- name: Create Identity on Node 2
  type: whoami
  account: calimero-node-2-id1
  outputs: {}
- name: Wait for Identity Propagation
  type: wait
  seconds: 1.0
- name: Invite Node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invitation_2: token
- name: Settle before the namespace join (cold-join KeyDelivery)
  type: wait
  seconds: 1.0
- name: Node 2 Joins Namespace
  type: redeem_invite
  token: '{{invitation_2}}'
  account: calimero-node-2
- name: Settle After Namespace Join
  type: wait
  seconds: 1.0
- name: Settle After Sync
  type: wait
  seconds: 1.0
- name: Node 2 Joins Context
  type: whoami
  account: calimero-node-2
  outputs:
    public_key_2: publicKey
- name: Add Rect from Node 1
  type: call
  app: '{{context_id}}'
  method: add_element
  args:
    element:
      id: elem-rect-1
      data:
        kind: rect
      x: 100
      y: 100
      width: 200
      height: 150
      rotation: 0
      fill: '#ffffff'
      stroke: '#000000'
      strokeWidth: 2
      opacity: 100
      layerIndex: 0
      createdBy: node1
      createdAt: 1751953010
      updatedAt: 1751953010
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Verify Elements
  type: call
  app: '{{context_id}}'
  method: get_elements
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    elements: rpc
- name: Assert Element Synced
  type: assert
  statements:
  - contains({{elements}}, 'elem-rect-1')
  - contains({{elements}}, 'rect')
