# Ported from logic-test.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
name: Logic Unit Test
description: 'Comprehensive test of MeroDesign WASM logic. Verifies all core operations: board init, member
  join, element CRUD, layer reordering, and board update.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3180
accounts:
- calimero-node-1
steps:
- name: Install Application
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_design.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.mero-design
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Namespace
  type: create_org
  org_name: Create Namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Create Board Context
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_design.wasm'
  app_name: Create Board Context
  init_args: '{"name": "Test Board", "description": "Logic test board"}'
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Get Board
  type: call
  app: '{{context_id}}'
  method: get_board
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    board_info: rpc
- name: Assert Board Name
  type: assert
  statements:
  - contains({{board_info}}, 'Test Board')
- name: Join as Alice
  type: call
  app: '{{context_id}}'
  method: join
  args:
    username: Alice
    avatar: null
    timestamp: 1000000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Get Members
  type: call
  app: '{{context_id}}'
  method: get_members
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    members: rpc
- name: Assert Alice is Member
  type: assert
  statements:
  - contains({{members}}, 'Alice')
- name: Add Rect Element
  type: call
  app: '{{context_id}}'
  method: add_element
  args:
    element:
      id: rect-1
      data:
        kind: rect
      x: 100
      y: 100
      width: 200
      height: 150
      rotation: 0
      fill: '#ff0000'
      stroke: '#000000'
      strokeWidth: 2
      opacity: 100
      layerIndex: 0
      createdBy: alice
      createdAt: 1000001
      updatedAt: 1000001
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Add Circle Element
  type: call
  app: '{{context_id}}'
  method: add_element
  args:
    element:
      id: circle-1
      data:
        kind: circle
      x: 400
      y: 200
      width: 100
      height: 100
      rotation: 0
      fill: '#0000ff'
      stroke: '#000000'
      strokeWidth: 1
      opacity: 80
      layerIndex: 1
      createdBy: alice
      createdAt: 1000002
      updatedAt: 1000002
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Add Text Element
  type: call
  app: '{{context_id}}'
  method: add_element
  args:
    element:
      id: text-1
      data:
        kind: text
        content: Hello MeroDesign
        fontSize: 24
        fontFamily: sans-serif
        bold: false
        italic: false
      x: 50
      y: 50
      width: 300
      height: 40
      rotation: 0
      fill: '#111111'
      stroke: transparent
      strokeWidth: 0
      opacity: 100
      layerIndex: 2
      createdBy: alice
      createdAt: 1000003
      updatedAt: 1000003
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Get All Elements
  type: call
  app: '{{context_id}}'
  method: get_elements
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    all_elements: rpc
- name: Assert Three Elements Exist
  type: assert
  statements:
  - contains({{all_elements}}, 'rect-1')
  - contains({{all_elements}}, 'circle-1')
  - contains({{all_elements}}, 'text-1')
  - contains({{all_elements}}, 'Hello MeroDesign')
- name: Get Single Element
  type: call
  app: '{{context_id}}'
  method: get_element
  args:
    id: rect-1
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    single_el: rpc
- name: Assert Single Element Data
  type: assert
  statements:
  - contains({{single_el}}, 'rect-1')
  - contains({{single_el}}, '#ff0000')
- name: Update Rect Position
  type: call
  app: '{{context_id}}'
  method: update_element
  args:
    id: rect-1
    x: 250
    y: 300
    width: null
    height: null
    rotation: null
    fill: '#00ff00'
    stroke: null
    stroke_width: null
    opacity: null
    updated_at: 1000010
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Get Updated Element
  type: call
  app: '{{context_id}}'
  method: get_element
  args:
    id: rect-1
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    updated_el: rpc
- name: Assert Updated Values
  type: assert
  statements:
  - contains({{updated_el}}, '#00ff00')
- name: Update Text Content
  type: call
  app: '{{context_id}}'
  method: update_text_style
  args:
    id: text-1
    content: Updated text content
    font_family: null
    font_size: null
    bold: null
    italic: null
    text_align: null
    vertical_align: null
    updated_at: 1000011
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Verify Text Update
  type: call
  app: '{{context_id}}'
  method: get_element
  args:
    id: text-1
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    text_el: rpc
- name: Assert Text Updated
  type: assert
  statements:
  - contains({{text_el}}, 'Updated text content')
- name: Bring Circle to Front
  type: call
  app: '{{context_id}}'
  method: bring_to_front
  args:
    id: circle-1
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Send Rect to Back
  type: call
  app: '{{context_id}}'
  method: send_to_back
  args:
    id: rect-1
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Elements After Layer Ops
  type: call
  app: '{{context_id}}'
  method: get_elements
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    layered_elements: rpc
- name: Assert All Still Present After Layer Ops
  type: assert
  statements:
  - contains({{layered_elements}}, 'rect-1')
  - contains({{layered_elements}}, 'circle-1')
  - contains({{layered_elements}}, 'text-1')
- name: Update Board Name
  type: call
  app: '{{context_id}}'
  method: update_board
  args:
    name: Renamed Board
    description: Updated description
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Verify Board Update
  type: call
  app: '{{context_id}}'
  method: get_board
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    updated_board: rpc
- name: Assert Board Renamed
  type: assert
  statements:
  - contains({{updated_board}}, 'Renamed Board')
- name: Batch Add Two Elements
  type: call
  app: '{{context_id}}'
  method: add_elements
  args:
    elements:
    - id: batch-a
      data:
        kind: rect
      x: 10
      y: 10
      width: 50
      height: 50
      rotation: 0
      fill: '#aaaaaa'
      stroke: '#000000'
      strokeWidth: 1
      opacity: 100
      layerIndex: 3
      createdBy: alice
      createdAt: 1000020
      updatedAt: 1000020
    - id: batch-b
      data:
        kind: circle
      x: 70
      y: 10
      width: 50
      height: 50
      rotation: 0
      fill: '#bbbbbb'
      stroke: '#000000'
      strokeWidth: 1
      opacity: 100
      layerIndex: 4
      createdBy: alice
      createdAt: 1000021
      updatedAt: 1000021
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    batch_added: rpc
- name: Assert Batch Add Returned Both Ids
  type: assert
  statements:
  - contains({{batch_added}}, 'batch-a')
  - contains({{batch_added}}, 'batch-b')
- name: Batch Update Fills
  type: call
  app: '{{context_id}}'
  method: update_elements
  args:
    patches:
    - id: batch-a
      fill: '#123456'
    - id: batch-b
      fill: '#654321'
      stroke_width: 3
    updated_at: 1000022
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Batch Set Labels
  type: call
  app: '{{context_id}}'
  method: update_element_labels
  args:
    labels:
    - id: batch-a
      label: batch-label-a
    - id: batch-b
      label: batch-label-b
    updated_at: 1000023
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Set One Label
  type: call
  app: '{{context_id}}'
  method: update_element_label
  args:
    id: rect-1
    label: single-label-rect
    updated_at: 1000024
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Read Labelled Rect
  type: call
  app: '{{context_id}}'
  method: get_element
  args:
    id: rect-1
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    labelled_rect: rpc
- name: Assert Single Label Landed
  type: assert
  statements:
  - contains({{labelled_rect}}, 'single-label-rect')
- name: Read Batch Elements By Id
  type: call
  app: '{{context_id}}'
  method: get_elements_by_ids
  args:
    ids:
    - batch-a
    - batch-b
    - no-such-id
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    batch_read: rpc
- name: Assert Batch Patches And Labels Landed
  type: assert
  statements:
  - contains({{batch_read}}, '#123456')
  - contains({{batch_read}}, '#654321')
  - contains({{batch_read}}, 'batch-label-a')
  - contains({{batch_read}}, 'batch-label-b')
- name: Batch Delete
  type: call
  app: '{{context_id}}'
  method: delete_elements
  args:
    ids:
    - batch-a
    - batch-b
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Elements After Batch Delete
  type: call
  app: '{{context_id}}'
  method: get_elements
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    after_batch_delete: rpc
- name: Assert Batch Elements Gone, Others Kept
  type: assert
  statements:
  - not_contains({{after_batch_delete}}, 'batch-a')
  - not_contains({{after_batch_delete}}, 'batch-b')
  - contains({{after_batch_delete}}, 'rect-1')
- name: Delete Circle
  type: call
  app: '{{context_id}}'
  method: delete_element
  args:
    id: circle-1
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Elements After Delete
  type: call
  app: '{{context_id}}'
  method: get_elements
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    final_elements: rpc
- name: Assert Circle Deleted
  type: assert
  statements:
  - contains({{final_elements}}, 'rect-1')
  - contains({{final_elements}}, 'text-1')
