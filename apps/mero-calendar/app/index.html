<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>Mero Calendar</title>
    <!-- Served from public/, so these resolve at the site root. The repo used to
         carry a favicon.ico under src/assets/, where Vite never serves it as
         /favicon.ico — which is why the app showed the browser's default. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css"
      integrity="sha256-WAgYcAck1C1/zEl5sBl5cfyhxtLgKGdpI3oKyJffVRI="
      crossorigin="anonymous"
    />
    <!-- No webfont link: Figtree is self-hosted by @calimero-apps/glass
         (glass.css imports its fonts.css), so there is no Google Fonts
         request to block first paint. -->
    <!-- Font Awesome was here for 8 glyphs; they are inline SVG now
         (src/components/common/icons/Icons.tsx). Do not re-add a
         render-blocking icon CDN for a handful of shapes. -->
    <!-- Theme before first paint: light unless the person picked dark
         (src/providers/ThemeProvider owns the key and does the same at
         runtime). -->
    <script>
      (function () {
        var dark = false;
        try {
          dark = localStorage.getItem('mc-theme') === 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#0b0e18');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
