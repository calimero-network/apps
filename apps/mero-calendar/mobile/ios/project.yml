# XcodeGen spec for the native iOS Mero Calendar app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroCalendar.xcodeproj (not committed)
#   open MeroCalendar.xcodeproj
#
# Everything that is not SwiftUI (the generated contract client, the calendar
# layer and the view models) is the local package in Core/, which `swift test`
# checks on macOS. The swift-sdk is pinned by revision to the main merge commit
# of calimero-network/swift-sdk#84. Keep it equal to the one in Core/Package.swift.
name: MeroCalendar

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: c9ca1a06ea3b04c24d943cbb0e1d9b30eb4c5a8f
  CalendarCore:
    path: Core

targets:
  MeroCalendar:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Calendar
        UILaunchScreen: {}
        CFBundleURLTypes:
          # The wallet returns here after Cloud sign-in (`mero-calendar://enrol#credential=…`).
          - CFBundleURLName: network.calimero.calendar.enrol
            CFBundleURLSchemes: [mero-calendar]
          # Invitation deep links: `calimero://com.calimero.mero-calendar/join?invitation=…`.
          - CFBundleURLName: network.calimero.calendar.invite
            CFBundleURLSchemes: [calimero]
        # Where sign-in goes. Empty = the SDK's defaults (the hosted Calimero
        # wallet, Cloud manager and registry). See README.md.
        MeroCalendarCallbackScheme: mero-calendar
        MeroCalendarCallbackHost: ""
        MeroCalendarCallbackPath: /enrol
        MeroCloudBaseURL: ""
        MeroWalletURL: ""
        MeroRegistryURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.calendar
        PRODUCT_NAME: MeroCalendar
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: CalendarCore
        product: CalendarCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # The scripted demo tour (Debug, `-MeroDemo YES`): see UITests/TourTests.swift.
  MeroCalendarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MeroCalendar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.calendar.uitests
        TEST_TARGET_NAME: MeroCalendar
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  MeroCalendar:
    build:
      targets:
        MeroCalendar: all
    test:
      config: Debug
      targets:
        - MeroCalendarUITests
