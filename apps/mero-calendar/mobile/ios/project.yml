# XcodeGen spec for the native iOS Mero Calendar app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroCalendar.xcodeproj (not committed)
#   open MeroCalendar.xcodeproj
#
# Everything that is not SwiftUI (the generated contract client, the calendar
# layer and the view models) is the local package in Core/, which `swift test`
# checks on macOS. The swift-sdk is pinned by revision to the head of its
# Calimero 1.0 port (calimero-network/swift-sdk#85, branch feat/calimero-1.0);
# it moves to the merge commit once that lands. Keep it equal to the one in
# Core/Package.swift (and Core/Package.resolved).
name: MeroCalendar

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: a1ec644130d4405a1bab7547654b1442cc559b49
  CalendarCore:
    path: Core

targets:
  MeroCalendar:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Mero Calendar
        UILaunchScreen: {}
        CFBundleURLTypes:
          # The node's consent page returns here after an approval
          # (`mero-calendar://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.calendar.consent
            CFBundleURLSchemes: [mero-calendar]
          # Invitation deep links: `calimero://com.calimero.mero-calendar/join?invitation=…`.
          - CFBundleURLName: network.calimero.calendar.invite
            CFBundleURLSchemes: [calimero]
        # The consent page's return. An https host (Associated Domains, iOS
        # 17.4+) replaces the scheme when set.
        MeroCalendarCallbackScheme: mero-calendar
        MeroCalendarCallbackHost: ""
        MeroCalendarCallbackPath: /consent
        # The Calimero Cloud cluster to sign in to: a node URL from the
        # console. Empty: the sign-in screen asks for one. See README.md.
        CalimeroClusterURL: ""
        # The development cluster (`merod local`) the sign-in screen prefills.
        DefaultNodeURL: "http://localhost:2501"
        # The Mero Calendar version new calendars run. Empty: the latest.
        MeroPackageVersion: ""
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # Plain http only to a node on the local network (merod local --dev);
        # everything else stays https under ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Signing in with the device's passkey on a real cluster needs the
    # cluster's relying party as an associated domain: add an entitlements
    # file with `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`.
    # A development cluster uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.calendar
        PRODUCT_NAME: MeroCalendar
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: CalendarCore
        product: CalendarCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # The scripted demo tour (Debug, `-MeroDemo YES`): see UITests/TourTests.swift.
  MeroCalendarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MeroCalendar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.calendar.uitests
        TEST_TARGET_NAME: MeroCalendar
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  MeroCalendar:
    build:
      targets:
        MeroCalendar: all
    test:
      config: Debug
      targets:
        - MeroCalendarUITests
