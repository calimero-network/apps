# XcodeGen spec for the native iOS Hyperfeed Calendar app.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroCalendar.xcodeproj (not committed)
#   open MeroCalendar.xcodeproj
#
# Everything that is not SwiftUI (the generated contract client, the calendar layer and the
# view models) is the local package in CalendarCore/, which `swift test` checks on macOS. The
# Swift SDK (MeroKit, from calimero-network/core) is pinned to a core release
# (`exactVersion`). Keep it equal to the one in CalendarCore/Package.swift (and
# CalendarCore/Package.resolved).
name: MeroCalendar

# Staging: a Debug build that reaches Calimero Cloud's staging and trusts its
# debug node images (MeroKit's CloudEnvironment.staging), through the
# MERO_STAGING compilation condition, which only this configuration sets.
# Release, the build people install from the App Store, is always production.
configs:
  Debug: debug
  Staging: debug
  Release: release

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/core
    exactVersion: 1.0.0-rc.37
  CalendarCore:
    path: CalendarCore

targets:
  MeroCalendar:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Hyperfeed Calendar
        UILaunchScreen: {}
        CFBundleURLTypes:
          # The node's consent page returns here after an approval
          # (`mero-calendar://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.calendar.consent
            CFBundleURLSchemes: [mero-calendar]
          # Invitation deep links: `calimero://com.calimero.mero-calendar/join?invitation=…`.
          - CFBundleURLName: network.calimero.calendar.invite
            CFBundleURLSchemes: [calimero]
        # The consent page's return. An https host (Associated Domains, iOS
        # 17.4+) replaces the scheme when set.
        MeroCalendarCallbackScheme: mero-calendar
        MeroCalendarCallbackHost: ""
        MeroCalendarCallbackPath: /consent
        # The Calimero Cloud cluster to sign in to: a node URL from the
        # console. Empty: the sign-in screen asks for one. See README.md.
        CalimeroClusterURL: ""
        # The development cluster (`merod local`) the sign-in screen prefills.
        DefaultNodeURL: "http://localhost:2501"
        # The Hyperfeed Calendar version new calendars run. Empty: the latest.
        MeroPackageVersion: ""
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # Plain http only to a node on the local network (merod local --dev);
        # everything else stays https under ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Signing in with the device's passkey on a real cluster needs the
    # cluster's relying party as an associated domain: add an entitlements
    # file with `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`.
    # A development cluster uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.calendar
        PRODUCT_NAME: MeroCalendar
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MERO_STAGING"
    dependencies:
      - package: CalendarCore
        product: CalendarCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # The scripted demo tour (Debug, `-MeroDemo YES`): see UITests/TourTests.swift.
  MeroCalendarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MeroCalendar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.calendar.uitests
        TEST_TARGET_NAME: MeroCalendar
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  # Runs the Staging configuration: Calimero Cloud's staging (see `configs`).
  MeroCalendar Staging:
    build:
      targets:
        MeroCalendar: all
    run:
      config: Staging

  MeroCalendar:
    build:
      targets:
        MeroCalendar: all
    test:
      config: Debug
      targets:
        - MeroCalendarUITests
