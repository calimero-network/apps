# Ported from private-routing.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   set_default_capabilities x1: capabilities are v1 governance
#   sync_group x1: replication is synchronous
#   wait_for_sync x6: replication is synchronous: a read sees every committed write
name: Events route by peer list, and promote when peers arrive
description: "Where a calendar event LIVES is decided by its peer list, and this scenario is the only\
  \ thing that proves it across two nodes.\nprivate-events.yml covers the explicitly private methods.\
  \ It cannot cover this, because the routing happens inside `create_event` — the SHARED entry point.\
  \ An event created with no peers is nobody's business but its author's, so it is written to `#[app::private]`\
  \ storage and never enters the DAG; name a peer and it goes to the shared state where that peer can\
  \ actually see it.\nThe two directions are not symmetric, and both halves are asserted here:\n\n  -\
  \ adding a peer to a private event PROMOTES it — same id, moved into the\n    shared state, and removed\
  \ from private storage so the frontend's merged\n    view cannot show it twice.\n  - removing every\
  \ peer from a shared event does NOT demote it. The DAG is\n    append-only; the write is already replicated\
  \ and cannot be recalled. What\n    does change is who can read it, because `get_events` gates on\n\
  \    owner-or-peer — so the ex-peer stops seeing it while the owner does not.\n\nAsserting only the\
  \ promotion would leave the frontend free to assume a symmetry the contract does not have.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3110
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_calendar.wasm'
  outputs:
    app_id: hash
  account: calimero-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Namespace
  type: create_org
  org_name: Create Namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Create Calendar Context
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_calendar.wasm'
  app_name: Create Calendar Context
  init_args: '{}'
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Create Identity on Node 2
  type: whoami
  account: calimero-node-2
  outputs: {}
- name: Wait for Identity Propagation
  type: wait
  seconds: 1.0
- name: Invite Node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invitation_2: token
- name: Settle before the namespace join (cold-join KeyDelivery)
  type: wait
  seconds: 1.0
- name: Node 2 Joins Namespace
  type: redeem_invite
  token: '{{invitation_2}}'
  account: calimero-node-2
- name: Settle After Namespace Join
  type: wait
  seconds: 1.0
- name: Settle After Sync
  type: wait
  seconds: 1.0
- name: Node 2 Joins Context
  type: whoami
  account: calimero-node-2
  outputs:
    public_key_2: publicKey
- name: Node 2 registers Bob
  type: call
  app: '{{context_id}}'
  method: set_username
  args:
    username: bob
    timestamp: 3000001
  account: calimero-node-2
  as_key: '{{public_key_2}}'
- name: Node 2 reads its own member row
  type: call
  app: '{{context_id}}'
  method: get_members
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    bob_user_id: result.0.id
    members_seen_by_node2: rpc
- name: Node 1 reads members
  type: call
  app: '{{context_id}}'
  method: get_members
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    members_seen_by_node1: rpc
- name: Assert the mesh is live and Bob's id was captured
  type: assert
  statements:
  - contains({{members_seen_by_node1}}, bob)
  - contains({{members_seen_by_node2}}, bob)
  - is_set({{bob_user_id}})
- name: Node 1 creates an event with nobody in it
  type: call
  app: '{{context_id}}'
  method: create_event
  args:
    event_data:
      title: solo-alice
      description: no peers, so this must stay on node 1
      start: '2026-07-03T09:00:00'
      end: '2026-07-03T10:00:00'
      event_type: event
      color: rgb(213, 0, 0)
      peers: []
    timestamp: 3000002
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    solo_id: result
- name: Node 1 reads its shared calendar
  type: call
  app: '{{context_id}}'
  method: get_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    n1_shared_after_solo: rpc
- name: Node 1 reads its private events
  type: call
  app: '{{context_id}}'
  method: get_private_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    n1_private_after_solo: rpc
- name: Node 2 reads its shared calendar
  type: call
  app: '{{context_id}}'
  method: get_events
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    n2_shared_after_solo: rpc
- name: Assert a peerless event went to private storage, not the DAG
  type: assert
  statements:
  - not_contains({{n1_shared_after_solo}}, solo-alice)
  - contains({{n1_private_after_solo}}, solo-alice)
  - not_contains({{n2_shared_after_solo}}, solo-alice)
- name: Node 1 creates an event with Bob in it
  type: call
  app: '{{context_id}}'
  method: create_event
  args:
    event_data:
      title: shared-with-bob
      description: has a peer, so this must replicate
      start: '2026-07-03T11:00:00'
      end: '2026-07-03T12:00:00'
      event_type: event
      color: rgb(0, 121, 213)
      peers:
      - '{{bob_user_id}}'
    timestamp: 3000003
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    shared_id: result
- name: Node 2 reads the shared calendar
  type: call
  app: '{{context_id}}'
  method: get_events
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    n2_shared: rpc
- name: Node 1 re-reads its private events
  type: call
  app: '{{context_id}}'
  method: get_private_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    n1_private_after_shared: rpc
- name: Assert naming a peer put the event in the DAG
  type: assert
  statements:
  - contains({{n2_shared}}, shared-with-bob)
  - not_contains({{n1_private_after_shared}}, shared-with-bob)
  - not_contains({{n2_shared}}, solo-alice)
- name: Node 1 adds Bob to the peerless event
  type: call
  app: '{{context_id}}'
  method: update_private_event
  args:
    event_id: '{{solo_id}}'
    event_data:
      peers:
      - '{{bob_user_id}}'
    timestamp: 3000004
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Node 2 reads the shared calendar after the promotion
  type: call
  app: '{{context_id}}'
  method: get_events
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    n2_after_promotion: rpc
- name: Node 1 reads private events after the promotion
  type: call
  app: '{{context_id}}'
  method: get_private_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    n1_private_after_promotion: rpc
- name: Node 1 reads its shared calendar after the promotion
  type: call
  app: '{{context_id}}'
  method: get_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    n1_shared_after_promotion: rpc
- name: Assert the promotion moved the event and kept its id
  type: assert
  statements:
  - contains({{n1_shared_after_promotion}}, solo-alice)
  - contains({{n2_after_promotion}}, solo-alice)
  - not_contains({{n1_private_after_promotion}}, solo-alice)
  - contains({{n2_after_promotion}}, {{solo_id}})
- name: Node 2 (an invited peer) tries to rename Alice's shared event
  type: call
  app: '{{context_id}}'
  method: update_event
  args:
    event_id: '{{shared_id}}'
    event_data:
      title: hijacked-by-bob
    timestamp: 3000004
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  expected_failure: true
  outputs:
    peer_edit_error: error
- name: Assert the peer's edit was refused
  type: assert
  statements:
  - is_set({{peer_edit_error}})
- name: Node 1 removes every peer from the shared event
  type: call
  app: '{{context_id}}'
  method: update_event
  args:
    event_id: '{{shared_id}}'
    event_data:
      peers: []
    timestamp: 3000005
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Node 1 reads its shared calendar after the removal
  type: call
  app: '{{context_id}}'
  method: get_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    n1_shared_after_removal: rpc
- name: Node 1 reads private events after the removal
  type: call
  app: '{{context_id}}'
  method: get_private_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    n1_private_after_removal: rpc
- name: Node 2 reads the shared calendar after the removal
  type: call
  app: '{{context_id}}'
  method: get_events
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    n2_after_removal: rpc
- name: Assert removing the peers changed the audience, not the storage
  type: assert
  statements:
  - contains({{n1_shared_after_removal}}, shared-with-bob)
  - not_contains({{n1_private_after_removal}}, shared-with-bob)
  - not_contains({{n2_after_removal}}, shared-with-bob)
  - not_contains({{n1_shared_after_removal}}, hijacked-by-bob)
