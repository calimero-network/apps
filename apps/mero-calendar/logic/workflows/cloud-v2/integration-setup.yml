# Ported from integration-setup.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   sync_group x1: replication is synchronous
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: Integration Test Setup
description: 'Sets up a two-node Mero Calendar environment for Playwright integration tests. Creates a
  shared calendar context, registers two members (Alice and Bob), seeds a shared event, then leaves the
  nodes running for Playwright to drive.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3080
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_calendar.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.mero-calendar
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Namespace
  type: create_org
  org_name: Create Namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Set Default Member Capabilities
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 15
  account: calimero-node-1
- name: Create Calendar Context
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_calendar.wasm'
  app_name: Create Calendar Context
  init_args: '{}'
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Create Identity on Node 2
  type: whoami
  account: calimero-node-2
  outputs: {}
- name: Wait for Identity Setup
  type: wait
  seconds: 1.0
- name: Invite Node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invitation_2: token
- name: Settle before the namespace join (cold-join KeyDelivery)
  type: wait
  seconds: 1.0
- name: Node 2 Joins Namespace
  type: redeem_invite
  token: '{{invitation_2}}'
  account: calimero-node-2
- name: Settle After Namespace Join
  type: wait
  seconds: 1.0
- name: Settle After Sync
  type: wait
  seconds: 1.0
- name: Node 2 Joins Calendar Context
  type: whoami
  account: calimero-node-2
  outputs:
    public_key_2: publicKey
- name: Alice Registers Username
  type: call
  app: '{{context_id}}'
  method: set_username
  args:
    username: Alice
    timestamp: 1751953000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Bob Registers Username
  type: call
  app: '{{context_id}}'
  method: set_username
  args:
    username: Bob
    timestamp: 1751953001
  account: calimero-node-2
  as_key: '{{public_key_2}}'
- name: Alice Seeds a Shared Event
  type: call
  app: '{{context_id}}'
  method: create_event
  args:
    event_data:
      title: Integration Standup
      description: Seeded by integration-setup
      start: '2026-07-01T09:00:00'
      end: '2026-07-01T09:30:00'
      event_type: event
      color: rgb(51, 182, 121)
      peers:
      - '{{public_key_2}}'
    timestamp: 1751953010
  account: calimero-node-1
  as_key: '{{member_public_key}}'
