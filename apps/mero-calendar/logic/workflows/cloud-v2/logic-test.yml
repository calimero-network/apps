# Ported from logic-test.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
name: Logic Unit Test
description: 'End-to-end exercise of the Mero Calendar WASM contract on a single node: member username
  registration, shared event CRUD with owner gating, and node-local private events kept separate from
  the shared calendar.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3090
accounts:
- calimero-node-1
steps:
- name: Install Application
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_calendar.wasm'
  outputs:
    app_id: hash
  account: calimero-node-1
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Namespace
  type: create_org
  org_name: Create Namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Create Calendar Context
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_calendar.wasm'
  app_name: Create Calendar Context
  init_args: '{}'
  org: '{{namespace_id}}'
  outputs:
    context_id: appId
    member_public_key: memberPublicKey
- name: Set Username (Alice)
  type: call
  app: '{{context_id}}'
  method: set_username
  args:
    username: Alice
    timestamp: 1000000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Get Members
  type: call
  app: '{{context_id}}'
  method: get_members
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    members: rpc
    alice_user_id: result.0.id
- name: Assert Alice is a Member
  type: assert
  statements:
  - contains({{members}}, 'Alice')
  - is_set({{alice_user_id}})
- name: Create Shared Event
  type: call
  app: '{{context_id}}'
  method: create_event
  args:
    event_data:
      title: Team Standup
      description: Daily sync
      start: '2026-07-01T09:00:00'
      end: '2026-07-01T09:30:00'
      event_type: event
      color: rgb(51, 182, 121)
      peers:
      - '{{alice_user_id}}'
    timestamp: 1000001
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    event_id: result
- name: Get Shared Events
  type: call
  app: '{{context_id}}'
  method: get_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    events: rpc
- name: Assert Shared Event Present
  type: assert
  statements:
  - contains({{events}}, 'Team Standup')
- name: Update Shared Event
  type: call
  app: '{{context_id}}'
  method: update_event
  args:
    event_id: '{{event_id}}'
    event_data:
      title: Renamed Standup
      description: null
      start: null
      end: null
      event_type: null
      color: null
      peers: null
    timestamp: 1000002
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Get Events After Update
  type: call
  app: '{{context_id}}'
  method: get_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    updated_events: rpc
- name: Assert Event Renamed
  type: assert
  statements:
  - contains({{updated_events}}, 'Renamed Standup')
- name: Create Private Event
  type: call
  app: '{{context_id}}'
  method: create_private_event
  args:
    event_data:
      title: Dentist
      description: Personal
      start: '2026-07-02T14:00:00'
      end: '2026-07-02T15:00:00'
      event_type: event
      color: rgb(213, 0, 0)
      peers: []
    timestamp: 1000003
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Get Private Events
  type: call
  app: '{{context_id}}'
  method: get_private_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    private_events: rpc
- name: Assert Private Event Present
  type: assert
  statements:
  - contains({{private_events}}, 'Dentist')
- name: Re-read Shared Calendar After Private Event
  type: call
  app: '{{context_id}}'
  method: get_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    shared_after_private: rpc
- name: Assert Private Event Stayed Out of the Shared Calendar
  type: assert
  statements:
  - contains({{shared_after_private}}, 'Renamed Standup')
  - not_contains({{shared_after_private}}, 'Dentist')
- name: Delete Shared Event
  type: call
  app: '{{context_id}}'
  method: delete_event
  args:
    event_id: '{{event_id}}'
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Get Events After Delete
  type: call
  app: '{{context_id}}'
  method: get_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    final_events: rpc
- name: Assert Event Deleted
  type: assert
  statements:
  - not_contains({{final_events}}, 'Renamed Standup')
