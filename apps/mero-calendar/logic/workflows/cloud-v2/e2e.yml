# Ported from e2e.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   sync_group x1: replication is synchronous
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: E2E Two-Node Test
description: 'Two-node Mero Calendar workflow. Installs the app on both nodes, creates a shared calendar
  context, joins node 2, then verifies that a shared event created on node 1 (and shared with node 2 as
  a peer) syncs and is visible to node 2.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3070
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_calendar.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.mero-calendar
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Namespace
  type: create_org
  org_name: Create Namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Set Default Member Capabilities
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 15
  account: calimero-node-1
- name: Create Calendar Context
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_calendar.wasm'
  app_name: Create Calendar Context
  init_args: '{}'
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Create Identity on Node 2
  type: whoami
  account: calimero-node-2
  outputs: {}
- name: Wait for Identity Propagation
  type: wait
  seconds: 1.0
- name: Invite Node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invitation_2: token
- name: Settle before the namespace join (cold-join KeyDelivery)
  type: wait
  seconds: 1.0
- name: Node 2 Joins Namespace
  type: redeem_invite
  token: '{{invitation_2}}'
  account: calimero-node-2
- name: Settle After Namespace Join
  type: wait
  seconds: 1.0
- name: Settle After Sync
  type: wait
  seconds: 1.0
- name: Node 2 Joins Context
  type: whoami
  account: calimero-node-2
  outputs:
    public_key_2: publicKey
- name: Node 1 Registers Alice
  type: call
  app: '{{context_id}}'
  method: set_username
  args:
    username: AliceNode1
    timestamp: 1751953010
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Node 2 Registers Bob
  type: call
  app: '{{context_id}}'
  method: set_username
  args:
    username: BobNode2
    timestamp: 1751953011
  account: calimero-node-2
  as_key: '{{public_key_2}}'
- name: Node 1 Reads Members
  type: call
  app: '{{context_id}}'
  method: get_members
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    members_n1: rpc
- name: Node 2 Reads Members
  type: call
  app: '{{context_id}}'
  method: get_members
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    members_n2: rpc
- name: Assert Bidirectional Member Sync
  type: assert
  statements:
  - contains({{members_n1}}, 'AliceNode1')
  - contains({{members_n1}}, 'BobNode2')
  - contains({{members_n2}}, 'AliceNode1')
  - contains({{members_n2}}, 'BobNode2')
