# Ported from the v1 workflow private-events.yml (`merobox cloud port`).
# v1 nodes are accounts here.
# Dropped (no release-v2 counterpart):
#   sync_group x1: replication is synchronous
#   wait_for_sync x5: replication is synchronous: a read sees every committed write
name: Private events are node-local
description: 'The defining claim of `#[app::private]` storage, which nothing else here proves: a private
  event never leaves the node that created it.

  logic-test.yml already shows that a private event stays OUT of the shared calendar — but that is a single-node
  test, so it only shows private != shared WITHIN one node. It cannot show the thing that actually matters:
  that node 2 cannot see node 1''s private events at all, however much the two sync.

  This also closes the last two uncovered contract methods. `update_private_event` and `delete_private_event`
  were called by no scenario, which for the mutation paths of private data is the wrong pair to have missing.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3100
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.APPS_WASM_DIR}}/mero_calendar.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.mero-calendar
- name: Settle before the first admin call
  type: wait
  seconds: 1.0
- name: Create Namespace
  type: create_org
  org_name: Create Namespace
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Set Default Member Capabilities
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 15
  account: calimero-node-1
- name: Create Calendar Context
  type: deploy
  account: calimero-node-1
  wasm: '{{env.APPS_WASM_DIR}}/mero_calendar.wasm'
  app_name: Create Calendar Context
  init_args: '{}'
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Create Identity on Node 2
  type: whoami
  account: calimero-node-2
  outputs: {}
- name: Wait for Identity Propagation
  type: wait
  seconds: 1.0
- name: Invite Node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invitation_2: token
- name: Settle before the namespace join (cold-join KeyDelivery)
  type: wait
  seconds: 1.0
- name: Node 2 Joins Namespace
  type: redeem_invite
  token: '{{invitation_2}}'
  account: calimero-node-2
- name: Settle After Namespace Join
  type: wait
  seconds: 1.0
- name: Settle After Sync
  type: wait
  seconds: 1.0
- name: Node 2 Joins Context
  type: whoami
  account: calimero-node-2
  outputs:
    public_key_2: publicKey
- name: Node 1 registers Alice
  type: call
  app: '{{context_id}}'
  method: set_username
  args:
    username: alice
    timestamp: 2000000
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Node 2 registers Bob
  type: call
  app: '{{context_id}}'
  method: set_username
  args:
    username: bob
    timestamp: 2000001
  account: calimero-node-2
  as_key: '{{public_key_2}}'
- name: Node 2 reads members
  type: call
  app: '{{context_id}}'
  method: get_members
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    members_seen_by_node2: rpc
- name: Assert the mesh really is syncing
  type: assert
  statements:
  - contains({{members_seen_by_node2}}, alice)
  - contains({{members_seen_by_node2}}, bob)
- name: Node 1 creates a private event
  type: call
  app: '{{context_id}}'
  method: create_private_event
  args:
    event_data:
      title: alice-private
      description: only alice
      start: '2026-07-02T09:00:00'
      end: '2026-07-02T10:00:00'
      event_type: event
      color: rgb(213, 0, 0)
      peers: []
    timestamp: 2000002
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    alice_priv_id: result
- name: Node 2 creates a private event
  type: call
  app: '{{context_id}}'
  method: create_private_event
  args:
    event_data:
      title: bob-private
      description: only bob
      start: '2026-07-02T11:00:00'
      end: '2026-07-02T12:00:00'
      event_type: event
      color: rgb(0, 121, 213)
      peers: []
    timestamp: 2000003
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    bob_priv_id: result
- name: Node 1 reads its private events
  type: call
  app: '{{context_id}}'
  method: get_private_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    node1_privates: rpc
- name: Node 2 reads its private events
  type: call
  app: '{{context_id}}'
  method: get_private_events
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    node2_privates: rpc
- name: Assert each node sees ONLY its own private event
  type: assert
  statements:
  - contains({{node1_privates}}, alice-private)
  - not_contains({{node1_privates}}, bob-private)
  - contains({{node2_privates}}, bob-private)
  - not_contains({{node2_privates}}, alice-private)
- name: Node 2 reads the shared calendar
  type: call
  app: '{{context_id}}'
  method: get_events
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    shared_after_privates: rpc
- name: Assert no private event reached the SHARED calendar either
  type: assert
  statements:
  - not_contains({{shared_after_privates}}, alice-private)
  - not_contains({{shared_after_privates}}, bob-private)
- name: Node 1 updates its own private event
  type: call
  app: '{{context_id}}'
  method: update_private_event
  args:
    event_id: '{{alice_priv_id}}'
    event_data:
      title: alice-private-renamed
      description: null
      start: null
      end: null
      event_type: null
      color: null
      peers: null
    timestamp: 2000004
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Node 1 re-reads its private events
  type: call
  app: '{{context_id}}'
  method: get_private_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    node1_after_update: rpc
- name: Node 2 re-reads its private events
  type: call
  app: '{{context_id}}'
  method: get_private_events
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    node2_after_update: rpc
- name: Assert the update landed locally and leaked nowhere
  type: assert
  statements:
  - contains({{node1_after_update}}, alice-private-renamed)
  - not_contains({{node1_after_update}}, bob-private)
  - contains({{node2_after_update}}, bob-private)
  - not_contains({{node2_after_update}}, alice-private-renamed)
- name: Node 1 updates a private event that does not exist
  type: call
  app: '{{context_id}}'
  method: update_private_event
  args:
    event_id: no-such-private-event
    event_data:
      title: ghost
      description: null
      start: null
      end: null
      event_type: null
      color: null
      peers: null
    timestamp: 2000005
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  expected_failure: true
  outputs:
    update_ghost_error: error
- name: Assert the contract refused it
  type: assert
  statements:
  - is_set({{update_ghost_error}})
- name: Node 1 deletes its own private event
  type: call
  app: '{{context_id}}'
  method: delete_private_event
  args:
    event_id: '{{alice_priv_id}}'
  account: calimero-node-1
  as_key: '{{member_public_key}}'
- name: Node 1 reads private events after the delete
  type: call
  app: '{{context_id}}'
  method: get_private_events
  args: {}
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  outputs:
    node1_after_delete: rpc
- name: Node 2 reads private events after the delete
  type: call
  app: '{{context_id}}'
  method: get_private_events
  args: {}
  account: calimero-node-2
  as_key: '{{public_key_2}}'
  outputs:
    node2_after_delete: rpc
- name: Assert the delete was local and node 2 kept its own
  type: assert
  statements:
  - not_contains({{node1_after_delete}}, alice-private-renamed)
  - contains({{node2_after_delete}}, bob-private)
- name: Node 1 deletes a private event that does not exist
  type: call
  app: '{{context_id}}'
  method: delete_private_event
  args:
    event_id: no-such-private-event
  account: calimero-node-1
  as_key: '{{member_public_key}}'
  expected_failure: true
  outputs:
    delete_ghost_error: error
- name: Assert the contract refused that too
  type: assert
  statements:
  - is_set({{delete_ghost_error}})
