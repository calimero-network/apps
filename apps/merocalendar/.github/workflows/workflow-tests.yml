# Drives the merobox scenarios in the top-level workflows/ directory against real
# merod containers: a single-node contract CRUD pass (logic-test.yml) and a
# two-node CRDT sync pass (e2e.yml). This is the only place the contract is
# exercised through the actual node — `cargo test` runs against TestHost, which
# cannot see a sync bug.
name: Workflow Tests (merobox)

on:
  push:
    # `main` only — the repo's default branch, verified 2026-08-18. A branch name
    # in this list that does not exist never matches and never errors, so a
    # copied-in `master` reads as a working filter while producing zero runs.
    branches: [main]
    paths:
      - "logic/**"
      - "workflows/**"
      - ".github/workflows/workflow-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "logic/**"
      - "workflows/**"
      - ".github/workflows/workflow-tests.yml"

concurrency:
  group: workflow-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: merobox Workflow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          key: cargo-${{ runner.os }}-${{ hashFiles('logic/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-mero
        uses: ./.github/actions/install-cargo-mero

      # Was: `cargo build --target wasm32-unknown-unknown --profile app-release`
      # followed by a hand-written `cp target/.../merocalendar.wasm res/`.
      # `cargo mero build` replaces both — it applies the release profile, runs
      # the bundled wasm-opt, embeds the `calimero_abi_v1` section, and writes
      # logic/res/merocalendar.wasm itself, which is the exact path the scenarios
      # in workflows/ install from. It also means the wasm these scenarios prove
      # out is byte-for-byte the one deploy-bundle.yml signs; the old hand-copied
      # build was a different artifact with no ABI section, so a scenario passing
      # said nothing about what shipped.
      - name: Build WASM (+ ABI embed)
        working-directory: logic
        run: cargo mero build

      # merobox has had a console-verbosity knob since 0.6.30 (merobox#271): `quiet`
      # keeps the banners and the final pass/fail summary and drops the per-step
      # API-response dumps. Day to day that is what you want; to get the full detail
      # back, re-run the job with "Enable debug logging" and GitHub sets runner.debug,
      # which flips this to `verbose`. No second workflow, no flag to remember.
      #
      # It goes through $GITHUB_ENV rather than a workflow-level `env:` because the
      # `runner` context does not exist at workflow or job level — only inside a step.
      - name: Quiet merobox and its nodes on the happy path
        run: |
          # merobox's own console output.
          echo "MEROBOX_LOG_LEVEL=${{ runner.debug == '1' && 'verbose' || 'quiet' }}" >> "$GITHUB_ENV"
          # RUST_LOG for the merod nodes merobox boots. This has to go on the CLI:
          # `bootstrap run --log-level` defaults to "debug", so the value is never
          # None and merobox's `config.get("log_level")` fallback is unreachable — a
          # `log_level:` key in the workflow YAML is silently ignored.
          echo "MEROD_LOG=${{ runner.debug == '1' && 'debug' || 'info' }}" >> "$GITHUB_ENV"
      # calimero-client-py publishes an sdist and no manylinux wheel, so a cold
      # `pip install` compiles its Rust extension on the runner — 92 seconds of a
      # 134-second step, measured. pip stores wheels it builds itself under
      # ~/.cache/pip/wheels and reuses them, so keying this cache on the exact pins
      # makes every run after the first a few seconds. Bump the key with the pins.
      - name: Cache pip (calimero-client-py builds from source)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-merobox-0.6.55-ccpy-0.6.29
      - name: Install merobox
        # merobox and the merod image in workflows/*.yml must move in LOCKSTEP.
        # merobox drives the node's admin API directly, so a mismatch fails on
        # the very first step with a payload error and reads like a contract bug
        # on a commit that changed nothing:
        #   * merod <= rc.20 REQUIRES `upgradePolicy` on create_namespace;
        #     merobox 0.6.54 dropped it (core#3393 removed the concept in rc.21),
        #     so new merobox + old node => "missing field `upgradePolicy`".
        #   * old merobox + rc.21+ node => the reverse, an unknown-field reject.
        # The scenarios here pin merod 0.11.0-rc.25, so merobox must be >= 0.6.55.
        # Changing either pin without the other is the failure mode.
        #
        # calimero-client-py is the layer that actually builds the request, and
        # merobox only requires `>=0.6.28` — so an unpinned install silently
        # tracks core master and can break this job on a no-op commit. It is
        # now pinned explicitly alongside merobox, and still echoed into the
        # log so a future drift is identifiable without a bisect.
        run: |
          pip install -q --disable-pip-version-check "merobox==0.6.55" "calimero-client-py==0.6.29"
          merobox --version
          pip show calimero-client-py | sed -n 's/^Version: /calimero-client-py /p'

      - name: Run e2e workflow (two-node sync)
        working-directory: workflows
        run: |
          max_attempts=2
          attempt=1
          success=false
          while [ $attempt -le $max_attempts ]; do
            if [ $attempt -gt 1 ]; then
              merobox stop --all || true
              merobox nuke --force || true
              # The node containers run as root, so workflows/data/ is root-owned
              # and a plain `rm -rf` dies on it. Under the default `bash -e` that
              # killed the job before the retry ever ran, turning this loop into
              # a no-op on exactly the flake it exists to absorb.
              sudo rm -rf data || true
              sleep 2
            fi
            if merobox bootstrap run --log-level "$MEROD_LOG" e2e.yml; then success=true; break; fi
            attempt=$((attempt + 1))
          done
          merobox stop --all || true
          merobox nuke --force || true
          sudo rm -rf data || true
          [ "$success" = true ] || exit 1

      - name: Run logic-test workflow (single-node CRUD)
        working-directory: workflows
        run: |
          max_attempts=2
          attempt=1
          success=false
          while [ $attempt -le $max_attempts ]; do
            if [ $attempt -gt 1 ]; then
              merobox stop --all || true
              merobox nuke --force || true
              sudo rm -rf data || true
              sleep 2
            fi
            if merobox bootstrap run --log-level "$MEROD_LOG" logic-test.yml; then success=true; break; fi
            attempt=$((attempt + 1))
          done
          merobox stop --all || true
          merobox nuke --force || true
          sudo rm -rf data || true
          [ "$success" = true ] || exit 1

      - name: Stop nodes
        if: always()
        working-directory: workflows
        run: |
          merobox stop --all || true
          merobox nuke --force || true
