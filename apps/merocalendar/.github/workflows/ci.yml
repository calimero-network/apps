# Per-commit gate for mero-calendar: frontend unit tests, a mocked Playwright
# run, and the Rust contract. Nothing here talks to a real node — the merobox
# suites live in workflow-tests.yml and integration-ci.yml, which are slower and
# path-filtered.
name: CI

on:
  push:
    # `main` only. The default branch is `main` (verified 2026-08-18 via
    # `gh repo view calimero-network/mero-calendar --json defaultBranchRef`) and
    # no `master` exists. Listing a branch that does not exist is not an error —
    # GitHub just never matches it — so a stale `master` entry copied between
    # repos is indistinguishable from a working filter until someone notices the
    # workflow has no runs. Keep this list equal to the branches that exist.
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: app
        run: pnpm test

      # `pnpm lint` is defined as `tsc --noEmit` in app/package.json, so this is
      # the type gate as well as the lint gate — there is deliberately no
      # separate `pnpm exec tsc --noEmit` step, which is what used to be here and
      # ran the identical command twice.
      #
      # `--noEmit` only checks anything because app/tsconfig.json is a NORMAL
      # config with `"include": ["src"]`. In a project whose tsconfig.json is a
      # SOLUTION file (only `references`, no `files`/`include`) `--noEmit`
      # type-checks ZERO files and passes on genuinely broken code. If this app's
      # tsconfig is ever split into project references, this step goes green
      # while checking nothing — the `tsc -b` inside `pnpm build` below is the
      # one that keeps working either way.
      - name: Lint / type check
        working-directory: app
        run: pnpm lint

      # Also the production build gate: `pnpm build` is `tsc -b && vite build`.
      # Vite resolves imports and env differently from vitest, so a build can
      # break with every unit test green (a bare `import.meta.env` name that only
      # exists in the test setup, an asset path, a dep that has no browser
      # build). Nothing else in CI ever produced app/dist.
      - name: Build frontend
        working-directory: app
        run: pnpm build

  e2e-tests:
    name: E2E Tests (Playwright, mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: app
        run: pnpm exec playwright install chromium --with-deps
      - name: Run mocked E2E tests
        working-directory: app
        run: pnpm exec playwright test --project=mocked
        env:
          CI: "true"
          # Off Vite's default 5173. A stray dev server on the default port makes
          # the suite silently health-check and drive a DIFFERENT app instead of
          # the one under test, and it passes.
          PW_PORT: "5174"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/e2e-report/
          retention-days: 7

  # Deliberately its own job, not extra steps on `rust`: fmt and clippy need no
  # wasm target, no cargo-mero and no SDK build beyond a check, so they report in
  # about a minute instead of being buried behind a full wasm-opt release build.
  # Nothing was gating either one before, which is how two clippy lints sat in
  # the tree unnoticed.
  rust-lint:
    name: Rust (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep equal to `channel` in logic/rust-toolchain.toml. The components
          # must be listed here as well: with an explicit `toolchain:` this action
          # installs exactly what it is told, so it does NOT pick up the
          # `components` line from the toolchain file, and clippy/rustfmt would be
          # missing at the step that needs them.
          toolchain: "1.89.0"
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('logic/Cargo.lock') }}
          restore-keys: cargo-lint-${{ runner.os }}-

      - name: Formatting
        working-directory: logic
        run: cargo fmt --all --check

      # `--all-targets` so the tests are linted too, and `-D warnings` so a lint
      # is a failure rather than a line nobody reads in a green log — the whole
      # point of adding this. Lints run against the HOST target: clippy needs to
      # type-check, and the wasm32 build of this crate is a strict subset, so a
      # host run sees everything a wasm run would plus the test code.
      - name: Clippy
        working-directory: logic
        run: cargo clippy --all-targets -- -D warnings

  rust:
    name: Rust (contract tests + WASM build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          key: cargo-${{ runner.os }}-${{ hashFiles('logic/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Rust unit tests (native, TestHost)
        working-directory: logic
        run: cargo test

      - name: Install cargo-mero
        uses: ./.github/actions/install-cargo-mero

      # `cargo mero build`, NOT `cargo check --target wasm32-unknown-unknown`
      # (what this job used to run). Two things only this catches:
      #
      #   * The ABI. `cargo mero build` emits the ABI from a HOST build of the
      #     app and embeds it as the `calimero_abi_v1` section. A public method
      #     whose type has no `AbiType` impl compiles fine for wasm32 and fails
      #     only here — and the node reads that section to plan an upgrade, so a
      #     wasm without it is a wasm the registry publish step cannot use.
      #   * The artifact. `cargo check` produces no .wasm at all, so the thing
      #     deploy-bundle.yml and the merobox suites consume was never built by
      #     CI. This runs the same wasm-opt -Oz (bundled, not from PATH) that the
      #     release does, so CI and the release build the same bytes.
      - name: WASM build (+ ABI embed)
        working-directory: logic
        run: cargo mero build

      # abi.json and state-schema.json ride along because `cargo mero build`
      # emits them next to the wasm and they are what makes a build reviewable:
      # an ABI diff is the readable form of "did this change break callers", and
      # a state-schema diff is the readable form of "does this need the state
      # recreated". Neither is reconstructible from the wasm without the tool.
      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            logic/res/merocalendar.wasm
            logic/res/abi.json
            logic/res/state-schema.json
          retention-days: 7
