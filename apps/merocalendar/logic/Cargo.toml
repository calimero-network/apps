[package]
name        = "merocalendar"
description = "Mero Calendar — collaborative p2p calendar on Calimero"
# NOT the release version. cargo requires the field, but nothing reads it for a
# release: the registry owns the number, and `cargo mero bundle --bump patch`
# asks the registry for the highest published appVersion and increments it.
version     = "0.1.0"
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Read by `cargo mero bundle` (core #3374). `appVersion` is deliberately absent —
# release.yml resolves it from the registry.
#
# This table CANNOT be inherited: `[package.metadata]` is not on cargo's
# inheritable list, so `min-runtime-version.workspace = true` resolves to the
# literal `{"workspace": true}`. The fleet-wide values live in
# `[workspace.metadata.mero-apps]` and scripts/check-app-metadata.sh asserts this
# table agrees with them.
[package.metadata.calimero]
package     = "com.calimero.merocalendar"
name        = "Mero Calendar"
description = "A collaborative, peer-to-peer calendar on the Calimero network. Shared team calendars and private events — your schedule on your own nodes."
author      = "Calimero"
# The desktop resolves a deep link (calimero://<slug>/… and
# https://links.calimero.network/<slug>/…) by Application.package, so the slug IS
# the package id. Unchanged from the standalone repo: it is in every invite link
# already shared.
slug        = "com.calimero.merocalendar"
# `bundle` refuses to run without an icon decision, and it fails at BUNDLE time —
# i.e. after a green PR, on the release run. The repo ships no PNG app icon
# (app/src/assets carries SVGs and a .ico), so take the sentinel that ships the
# Calimero mark. Swap for a path once app/public gains an icon-512.png.
icon        = "default"
tags        = ["calendar", "scheduling", "collaboration"]
github      = "https://github.com/calimero-network/apps"
# Kept equal to the workspace SDK tag — that is what this is built and tested
# against. Was rc.23 in the standalone repo; check-app-metadata.sh now enforces
# the match, so it cannot drift back.
min-runtime-version = "0.11.0-rc.26"
# A BARE https origin. Not cosmetic: the embedded auth frontend compares
# `frontend.origin === callbackOrigin`, so a path or a wrong host fails hosted
# login AFTER credentials are accepted, while loopback/desktop login keeps
# working — which is exactly how it goes unnoticed.
frontend    = "https://mero-calendar.vercel.app"

[dependencies]
base64                  = "0.22.1"
bs58                    = { workspace = true }
# One pin for the whole fleet, in the root Cargo.toml. All three SDK crates must
# share the exact same tag: core's workspace version at a tag is 0.0.0, so a
# plain version requirement can never match.
calimero-sdk            = { workspace = true }
calimero-storage        = { workspace = true }
calimero-storage-macros = { workspace = true }
thiserror               = { workspace = true }

[dev-dependencies]
# Enables register_crdt_merge + the native mock host so TestHost can drive CRDT
# state under `cargo test`.
calimero-storage = { workspace = true, features = ["testing"] }

# NOTE: no [profile.*] here. Cargo IGNORES profiles in a workspace member
# ("profiles for the non root package will be ignored") and `cargo mero build`
# then fails with `profile 'app-release' is not defined`. app-release and
# app-profiling live in the root Cargo.toml.
