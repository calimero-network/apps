[package]
name = "mero-forms"
description = "Forms a team designs, the responses they collect, and a hand-off to Hyperfeed CRM, on the component SDK"
# NOT the release version: the release workflow takes the next appVersion from
# the registry and passes it to `meroctl app pack --app-version`. Cargo
# requires the field; bundling locally without --app-version uses it.
version = "0.1.0"
edition = "2021"
authors = ["Calimero Limited <info@calimero.network>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/calimero-network/apps"
publish = false

[lib]
# A `calimero:app` component. No `rlib`: the tests run the BUILT component on
# core's engine (tests/common/mod.rs), not the crate linked natively.
crate-type = ["cdylib"]

# TEMPORARY: core is pinned by rev to core#5195's head (public links as grants,
# `#[app::public]` for link visitors, `env::Caller::Visitor`, WIT
# calimero:app@0.5.6), which no core release carries yet. Back to
# `tag = <component-core-tag>` (root Cargo.toml) for every core crate below once
# the release with core#5195 is out; until then scripts/check-component-pins.py
# fails on this crate. A standalone crate cannot inherit `[workspace.dependencies]`.
[dependencies]
calimero-sdk = { git = "https://github.com/calimero-network/core", rev = "a9f480d6afc16df38766d8f76ffe21eafd0a61c8" }
serde = { version = "1", features = ["derive"] }
# Form and response ids are random bytes from the host, rendered as hex.
hex = "0.4"
# A captcha pass is an ed25519 signature the contract checks itself: the
# component SDK has no host ed25519 call, and this is pure computation.
ed25519-dalek = { version = "2", default-features = false }

# The harness (`TestApp`, `run_scenario`) and the builder the tests build this
# crate with, for `cargo test` on the host only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-sdk       = { git = "https://github.com/calimero-network/core", rev = "a9f480d6afc16df38766d8f76ffe21eafd0a61c8", features = ["testing"] }
calimero-app-build = { git = "https://github.com/calimero-network/core", rev = "a9f480d6afc16df38766d8f76ffe21eafd0a61c8" }
serde_json = "1"
# Signs captcha passes in the tests, as the verifier does.
ed25519-dalek = { version = "2", default-features = false }
hex = "0.4"

# Read by `meroctl app pack`, with the keys
# `cargo mero bundle` reads for a v1 app.
[package.metadata.calimero]
package = "com.calimero.mero-forms"
name = "Hyperfeed Forms"
description = "Build forms with the fields you need, collect responses from your website, a public link or by hand, and send any response to Hyperfeed CRM. A website answers with a key that can answer one form and nothing else."
author = "Calimero"
# The slug IS the package id: a deep link resolves by `Application.package`.
slug = "com.calimero.mero-forms"
# A real icon, not a placeholder (check-app-icons.py).
# Regenerate with `node app/scripts/gen-icons.mjs`.
icon = "../app/public/icon-512.png"
category = "productivity"
tags = ["forms", "surveys", "leads", "crm", "productivity"]
github = "https://github.com/calimero-network/apps"
# `component-min-runtime-version` in the root Cargo.toml: a node compares it
# with its own release. TEMPORARY: rc.32, the first release with public links
# (core#5195, `Feature::PublicLinks`) and WIT calimero:app@0.5.6; the root's
# `component-min-runtime-version` moves there with the core bump.
min-runtime-version = "1.0.0-rc.32"
# The listing's link, and an origin the node may send a person back to from
# its consent page. NOT where the production frontend runs: a Cloud node trusts
# passkey ceremonies only from frontends it serves from a bundle, so the
# production frontend is the one packed below (docs/COMPONENT-APPS.md).
frontend = "https://mero-forms.vercel.app"
# The built frontend the bundle carries; the cluster serves it from the
# package's own origin. Build it first: `pnpm -F mero-forms build`.
frontend-dir = "../app/dist"

# Standalone: excluded from the root workspace (root Cargo.toml), its own
# Cargo.lock, as core's component apps are.
[workspace]
