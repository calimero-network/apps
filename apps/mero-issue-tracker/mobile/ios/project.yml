# XcodeGen spec for the native iOS Hyperfeed Issue Tracker.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroIssues.xcodeproj (not committed)
#   open MeroIssues.xcodeproj
#
# The non-UI layer (generated contract client, models) is the local SwiftPM package in
# IssueTrackerCore/, tested with `swift test` on macOS. The Swift SDK (MeroKit, from
# calimero-network/core) is pinned to a core release (`exactVersion`). Bump the pins here, in
# IssueTrackerCore/Package.swift and IssueTrackerCore/Package.resolved together.
name: MeroIssues

# Staging: a Debug build that reaches Calimero Cloud's staging and trusts its
# debug node images (MeroKit's CloudEnvironment.staging), through the
# MERO_STAGING compilation condition, which only this configuration sets.
# Release, the build people install from the App Store, is always production.
configs:
  Debug: debug
  Staging: debug
  Release: release

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/core
    exactVersion: 1.0.0-rc.37
  IssueTrackerCore:
    path: IssueTrackerCore

targets:
  MeroIssues:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Issues
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          # The node's consent page returns here after an approval
          # (`mero-issues://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.issues.consent
            CFBundleURLSchemes: [mero-issues]
          # Invitation deep links: `calimero://com.calimero.mero-issue-tracker/join?invitation=…`.
          - CFBundleURLName: network.calimero.issues.invite
            CFBundleURLSchemes: [calimero]
        # The consent page's return. An https host (Associated Domains, iOS
        # 17.4+) replaces the scheme when set.
        IssuesCallbackScheme: mero-issues
        IssuesCallbackHost: ""
        IssuesCallbackPath: /consent
        # The Calimero Cloud cluster to sign in to: a node URL from the
        # console. Empty: the sign-in screen asks for one. See README.md.
        CalimeroClusterURL: ""
        # The development cluster (`merod local`) the sign-in screen prefills.
        DefaultNodeURL: "http://localhost:2501"
        # The Hyperfeed Issue Tracker version new repos run. Empty: the latest.
        MeroPackageVersion: ""
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # Plain http only to a node on the local network (merod local --dev);
        # everything else stays https under ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Signing in with the device's passkey on a real cluster needs the
    # cluster's relying party as an associated domain: add an entitlements
    # file with `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`.
    # A development cluster uses a software passkey and needs neither.
    settings:
      configs:
        Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MERO_STAGING"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.issues
        PRODUCT_NAME: MeroIssues
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: IssueTrackerCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # The demo tour (`-MeroDemo YES`, Debug only): apps-capture records it.
  MeroIssuesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MeroIssues
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.issues.uitests
        TEST_TARGET_NAME: MeroIssues
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  # Runs the Staging configuration: Calimero Cloud's staging (see `configs`).
  MeroIssues Staging:
    build:
      targets:
        MeroIssues: all
    run:
      config: Staging

  MeroIssues:
    build:
      targets:
        MeroIssues: all
    test:
      config: Debug
      targets:
        - MeroIssuesUITests
