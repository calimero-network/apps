# XcodeGen spec for the native iOS Mero Issue Tracker.
#
#   brew install xcodegen
#   xcodegen generate          # writes MeroIssues.xcodeproj (not committed)
#   open MeroIssues.xcodeproj
#
# The non-UI layer (generated contract client, models) is the local SwiftPM
# package in Core/, tested with `swift test` on macOS. The swift-sdk is pinned
# by revision to the head of its Calimero 1.0 port (calimero-network/swift-sdk#85,
# branch feat/calimero-1.0); it moves to the merge commit once that lands. Bump
# the pins here, in Core/Package.swift and Core/Package.resolved together.
name: MeroIssues

options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    revision: 35148e4de782c065f777e80c592d9548acd645cd
  IssueTrackerCore:
    path: Core

targets:
  MeroIssues:
    type: application
    platform: iOS
    sources:
      - Sources/App
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Issues
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          # The node's consent page returns here after an approval
          # (`mero-issues://consent?request_id=…&result=…`).
          - CFBundleURLName: network.calimero.issues.consent
            CFBundleURLSchemes: [mero-issues]
          # Invitation deep links: `calimero://com.calimero.mero-issue-tracker/join?invitation=…`.
          - CFBundleURLName: network.calimero.issues.invite
            CFBundleURLSchemes: [calimero]
        # The consent page's return. An https host (Associated Domains, iOS
        # 17.4+) replaces the scheme when set.
        IssuesCallbackScheme: mero-issues
        IssuesCallbackHost: ""
        IssuesCallbackPath: /consent
        # The Calimero Cloud cluster to sign in to: a node URL from the
        # console. Empty: the sign-in screen asks for one. See README.md.
        CalimeroClusterURL: ""
        # The development cluster (`merod local`) the sign-in screen prefills.
        DefaultNodeURL: "http://localhost:2501"
        # The Mero Issue Tracker version new repos run. Empty: the latest.
        MeroPackageVersion: ""
        NSLocalNetworkUsageDescription: "Connect to a Calimero development node on your local network."
        # Plain http only to a node on the local network (merod local --dev);
        # everything else stays https under ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Signing in with the device's passkey on a real cluster needs the
    # cluster's relying party as an associated domain: add an entitlements
    # file with `com.apple.developer.associated-domains: [webcredentials:<rp-id>]`.
    # A development cluster uses a software passkey and needs neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.issues
        PRODUCT_NAME: MeroIssues
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: IssueTrackerCore
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  # The demo tour (`-MeroDemo YES`, Debug only): apps-capture records it.
  MeroIssuesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MeroIssues
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.issues.uitests
        TEST_TARGET_NAME: MeroIssues
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  MeroIssues:
    build:
      targets:
        MeroIssues: all
    test:
      config: Debug
      targets:
        - MeroIssuesUITests
