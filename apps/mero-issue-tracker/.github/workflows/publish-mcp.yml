name: publish-mcp

on:
  # Auto-release on mcp/** pushes is disabled until the npm trusted publisher
  # for @calimero-network/mero-issue-tracker-mcp exists; restore the push
  # trigger (branches: [main], paths: mcp/** + this file) once it does.
  workflow_dispatch:

jobs:
  release:
    name: Create Release and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@calimero-network'
          token: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: mcp
        run: npm run build

      - name: Typecheck
        working-directory: mcp
        run: npm run typecheck

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        id: semantic
        working-directory: mcp
        run: |
          OUTPUT=$(pnpm exec semantic-release 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Published release"; then
            echo "new_release=true" >> $GITHUB_OUTPUT
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
            echo "No new release"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      # npm-side prerequisite: the trusted publisher for this package must be
      # configured on npmjs.com to point at this repo and this workflow
      # filename (publish-mcp.yml) before the first publish will succeed.
      - name: Publish to npm with OIDC
        if: steps.semantic.outputs.new_release == 'true'
        working-directory: mcp
        run: npm publish --provenance --access public

      - name: Push release commit and tag
        if: steps.semantic.outputs.new_release == 'true'
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin HEAD:main --follow-tags || true
