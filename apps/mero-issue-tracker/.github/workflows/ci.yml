name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # corepack's download prompt aborts in a non-interactive runner.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # ── LOGIC ── Rust workspace: fmt, clippy, tests, wasm build + codegen drift. ──
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (wasm32)
        run: rustup target add wasm32-unknown-unknown

      # Same key as verify.yml's build job: keyed on Cargo.lock so a dep
      # change invalidates it, restore-keys let an unrelated source edit
      # reuse most of the prior build. The wasm build is the long pole.
      - name: Cache cargo + WASM build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          key: cargo-wasm-${{ hashFiles('logic/Cargo.lock') }}
          restore-keys: |
            cargo-wasm-

      - name: cargo fmt --check
        working-directory: logic
        run: cargo fmt --check

      # Not run with -D warnings: the workspace currently has one
      # pre-existing clippy::too_many_arguments warning on the public
      # create_issue API (8 args); until that's addressed, -D would fail
      # every PR for an unrelated reason. Still runs so new lint regressions
      # are visible in the log.
      - name: cargo clippy
        working-directory: logic
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        working-directory: logic
        run: cargo test --workspace

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build wasm + bundle (regenerates ABI)
        run: pnpm logic:build

      - name: Regenerate the TS client from the fresh ABI
        run: pnpm app:codegen

      # Guards forgotten codegen: fail if the checked-in generated client
      # doesn't match what the ABI produced by this build's fresh compile.
      - name: Stale codegen guard
        run: git diff --exit-code -- app/src/api/issue-tracker/IssueTrackerClient.ts

  # ── APP ── Vite/React frontend: typecheck, unit tests, build. ──
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: app
        run: pnpm test

      - name: Build
        working-directory: app
        run: pnpm build

      - name: Typecheck e2e specs
        working-directory: app
        run: npx tsc --noEmit -p e2e/tsconfig.json

  # ── MCP ── stdio MCP server: typecheck, node:test suite. ──
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter ./mcp typecheck

      - name: Test
        run: pnpm --filter ./mcp test

  # ── E2E ── Playwright against native merod nodes (same path global-setup.ts uses locally). ──
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (wasm32)
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo + WASM build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          key: cargo-wasm-${{ hashFiles('logic/Cargo.lock') }}
          restore-keys: |
            cargo-wasm-

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build wasm + bundle
        run: pnpm logic:build

      # ── ACQUIRE MEROD (native, no Docker) ────────────────────────────
      # The e2e suite installs the dev bundle via a host filesystem path
      # (install-dev-application), which a docker/merobox-provisioned node
      # cannot see - it needs a native merod on PATH, same as global-setup.ts
      # resolves locally. Version derived from the app's own SDK tag, same
      # resolution + download steps as verify.yml's build job.
      - name: Resolve merod version
        id: merodver
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ vars.MEROD_VERSION }}
        run: |
          set -euo pipefail
          ver="${PINNED:-}"
          if [ -z "$ver" ] && [ -f logic/Cargo.toml ]; then
            ver="$(sed -nE 's/.*calimero-sdk.*tag *= *"([^"]+)".*/\1/p' logic/Cargo.toml | head -1)"
            [ -n "$ver" ] && echo "merod version from app SDK tag: $ver"
          fi
          if [ -z "$ver" ]; then
            ver="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              'https://api.github.com/repos/calimero-network/core/releases?per_page=30' \
              | jq -r '[ .[] | select(.prerelease==true)
                          | select(any(.assets[].name; .=="merod_x86_64-unknown-linux-gnu.tar.gz")) ]
                        | .[0].tag_name')"
            echo "merod version from newest prerelease (no SDK tag found): $ver"
          fi
          test -n "$ver" && test "$ver" != "null"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Cache merod
        id: merod-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/merod
          key: merod-${{ steps.merodver.outputs.version }}-x86_64-linux

      - name: Download merod
        if: steps.merod-cache.outputs.cache-hit != 'true'
        env:
          MEROD_VERSION: ${{ steps.merodver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/merod"
          url="https://github.com/calimero-network/core/releases/download/${MEROD_VERSION}/merod_x86_64-unknown-linux-gnu.tar.gz"
          echo "Downloading $url"
          curl -fsSL "$url" -o /tmp/merod.tgz
          tar -xzf /tmp/merod.tgz -C "$HOME/.local/merod"
          target="$HOME/.local/merod/merod"
          if [ ! -f "$target" ]; then
            nested="$(find "$HOME/.local/merod" -type f -name merod | head -n1)"
            test -n "$nested"
            ln -sf "$nested" "$target"
          fi
          chmod +x "$target"

      - name: Put merod on PATH
        run: |
          echo "$HOME/.local/merod" >> "$GITHUB_PATH"
          echo "MEROD_BINARY=$HOME/.local/merod/merod" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e
        working-directory: app
        run: npx playwright test --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          if-no-files-found: ignore
