# Builds, signs, and publishes the network.calimero.mero-issue-tracker bundle to
# the Calimero App Registry. The version is single-sourced from
# studio.config.json's appVersion, so bumping it on main IS the release.
#
# The registry, not the git history, decides whether a version is new: the check
# job asks whether this exact version exists and stops when it does. That holds
# up under re-runs, reverts and squashed merges, where a diff against the
# previous commit does not - and it is why this runs on every push to main
# rather than filtering on the file that carries the version. A filter would
# only save the few seconds the check costs, while adding a way to miss a
# release.
#
# Signing uses a PRODUCTION mero-sign key held in ORGANIZATION secrets (never
# the dev key). Required org (or repo) secrets:
#   MERO_SIGN_KEY              - full JSON of the production signing key file
#                                 ({private_key, public_key, signer_id}). Must
#                                 be the key that signed this package's first
#                                 version - the registry pins the signer per
#                                 package.
#   CALIMERO_REGISTRY_API_KEY  - API token from the registry Organizations
#                                 page (CLI Access).

name: Deploy Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version to publish, e.g. 1.2.3 (no leading v)"
        required: true
        type: string
      core_rev:
        description: "Require the SDK deps to resolve to this core commit (leave blank to accept the lockfile's)"
        required: false
        type: string

permissions:
  contents: read

# Serialize releases: the registry rejects a duplicate version, and two pushes
# publishing at once shouldn't interleave. Never cancel in progress - a
# half-finished publish is worse than a queued one.
concurrency:
  group: deploy-bundle
  cancel-in-progress: false

jobs:
  # Cheap gate: reads the version and asks the registry, so an ordinary push to
  # main does not pay for a Rust build before deciding to do nothing.
  check:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      package: ${{ steps.pkg.outputs.package }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read the package id
        id: pkg
        run: |
          # logic/Cargo.toml is what `cargo mero bundle` stamps into the
          # manifest; studio.config.json is what the build script names the
          # output file after. If those two ever disagree we would ask the
          # registry about one package and publish another.
          package=$(awk '/^\[workspace\.metadata\.calimero\]/{f=1; next} /^\[/{f=0} f && /^package/{gsub(/package *= *"|"/,""); print; exit}' logic/Cargo.toml)
          case "$package" in
            "" ) echo "::error::could not read package from logic/Cargo.toml [workspace.metadata.calimero]"; exit 1 ;;
            *[!a-zA-Z0-9.-]* ) echo "::error::unexpected characters in package id '$package'"; exit 1 ;;
          esac

          studio_package=$(jq -er '.package' studio.config.json)
          if [ "$package" != "$studio_package" ]; then
            echo "::error::package id differs between logic/Cargo.toml ($package) and studio.config.json ($studio_package)"
            exit 1
          fi

          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "Package: $package"

      - name: Resolve and validate version
        id: ver
        env:
          # Through the environment, never inlined: a template expression is
          # substituted into the script before the shell sees it, so a crafted
          # input would run as code.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # studio.config.json is the single source of truth. A dispatch input
          # is an intent cross-check, not an override.
          app_version=$(jq -er '.appVersion' studio.config.json)

          # A regex, not a case glob: in a glob `*` spans dots too, so
          # `[0-9]*.[0-9]*.[0-9]*` accepts 1.2.3.4 and anything trailing,
          # including a newline that would forge a second GITHUB_OUTPUT entry.
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::studio.config.json appVersion must be exactly X.Y.Z (got '$app_version')"
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_VERSION" != "$app_version" ]; then
            echo "::error::input version ($INPUT_VERSION) does not match studio.config.json appVersion ($app_version) - bump studio.config.json first"
            exit 1
          fi

          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "Version: $app_version"

      - name: Has this version already been published?
        id: decide
        env:
          PACKAGE: ${{ steps.pkg.outputs.package }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # An unreachable registry must not read as "not published" - that
          # would republish blind. Only a definite 404 means new.
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 30 \
            "https://apps.calimero.network/api/v2/bundles/$PACKAGE/$VERSION" || echo "000")
          case "$code" in
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$PACKAGE $VERSION is not published yet - releasing"
              ;;
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$PACKAGE $VERSION is already published - nothing to do"
              ;;
            *)
              echo "::error::registry returned $code asking about $PACKAGE $VERSION - refusing to decide blind"
              exit 1
              ;;
          esac

  deploy:
    name: Build, sign & publish bundle
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check required secrets
        env:
          MERO_SIGN_KEY: ${{ secrets.MERO_SIGN_KEY }}
          CALIMERO_REGISTRY_API_KEY: ${{ secrets.CALIMERO_REGISTRY_API_KEY }}
        run: |
          missing=0
          [ -n "$MERO_SIGN_KEY" ] || { echo "::error::MERO_SIGN_KEY secret is not set"; missing=1; }
          [ -n "$CALIMERO_REGISTRY_API_KEY" ] || { echo "::error::CALIMERO_REGISTRY_API_KEY secret is not set"; missing=1; }
          exit $missing

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rust toolchain (wasm32)
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo + WASM build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          key: cargo-wasm-${{ hashFiles('logic/Cargo.lock') }}
          restore-keys: |
            cargo-wasm-

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup cargo-mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Write signing key
        env:
          MERO_SIGN_KEY: ${{ secrets.MERO_SIGN_KEY }}
        run: |
          umask 077
          printf '%s' "$MERO_SIGN_KEY" > "$RUNNER_TEMP/mero-sign-key.json"

      - name: Verify signer matches the published package
        env:
          PACKAGE: ${{ needs.check.outputs.package }}
        run: |
          local_signer=$(cargo mero key derive-signer-id --key "$RUNNER_TEMP/mero-sign-key.json")

          # An unreachable registry must not look like an unpublished package:
          # that would silently skip the very check this step exists for. Fail
          # the release instead, and only treat a well-formed empty list as a
          # first publish.
          if ! response=$(curl -fsS --retry 3 --retry-delay 2 --max-time 30 \
              "https://apps.calimero.network/api/v2/bundles?package=$PACKAGE"); then
            echo "::error::could not reach the registry to verify the signer - refusing to publish blind"
            exit 1
          fi
          if ! published_signer=$(printf '%s' "$response" | jq -er '.[0].signerId // ""'); then
            echo "::error::registry returned a response this step cannot parse: $response"
            exit 1
          fi

          if [ -z "$published_signer" ]; then
            # The signer is pinned per package by whoever publishes first, and no
            # later run can change it, so name it on the run that decides it.
            echo "::notice::no bundles published yet for $PACKAGE - skipping signer check; this publish PINS the signer to $local_signer"
          elif [ "$local_signer" != "$published_signer" ]; then
            echo "::error::key's signerId ($local_signer) does not match the published signerId ($published_signer) - the registry pins the signer per package, so publishing with a different key would land as a new application id instead of an upgrade. Use the key that signed the first published version."
            exit 1
          else
            echo "signer matches published package ($local_signer)"
          fi

      # The SDK deps pin a core tag and a git tag can be repointed, so the commit
      # the lockfile resolved to is what a signed release records, not the tag.
      - name: Resolve and record the core revision
        id: core
        env:
          EXPECTED_CORE_REV: ${{ github.event.inputs.core_rev }}
        run: |
          rev=$(awk -F'#' '/^source = "git\+https:\/\/github.com\/calimero-network\/core/{print $2; exit}' logic/Cargo.lock | tr -d '"')
          if [ -z "$rev" ]; then
            echo "::error::could not determine which core revision the SDK deps resolved to"
            exit 1
          fi
          if [ -n "$EXPECTED_CORE_REV" ] && [ "$rev" != "$EXPECTED_CORE_REV" ]; then
            echo "::error::core resolved to $rev but this release requested $EXPECTED_CORE_REV"
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "::notice::signing a bundle built against core $rev"

      - name: Build & sign bundle
        env:
          MERO_SIGN_KEY_FILE: ${{ runner.temp }}/mero-sign-key.json
        run: pnpm logic:build

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mero-sign-key.json"

      - name: Publish to App Registry
        env:
          CALIMERO_API_KEY: ${{ secrets.CALIMERO_REGISTRY_API_KEY }}
          CALIMERO_REGISTRY_URL: https://apps.calimero.network
          PACKAGE: ${{ needs.check.outputs.package }}
        run: cargo mero publish "logic/dist/$PACKAGE.mpk"

      - name: Summary
        env:
          PACKAGE: ${{ needs.check.outputs.package }}
          VERSION: ${{ needs.check.outputs.version }}
          CORE_REV: ${{ steps.core.outputs.rev }}
        run: |
          {
            echo "### Bundle published :rocket:"
            echo ""
            echo "- **Package:** \`$PACKAGE\`"
            echo "- **Version:** \`$VERSION\`"
            echo "- **Core revision:** \`$CORE_REV\`"
            echo "- **Registry:** https://apps.calimero.network"
          } >> "$GITHUB_STEP_SUMMARY"
