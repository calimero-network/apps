[package]
name = "mero-ar"
description = "Mero AR — collaborative spatial editing on Calimero, on the component SDK"
# NOT the release version: the release workflow takes the next appVersion from
# the registry and passes it to `meroctl app pack --app-version`. Cargo
# requires the field; bundling locally without --app-version uses it.
version = "0.0.2"
edition = "2021"
authors = ["Calimero Limited <info@calimero.network>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/calimero-network/apps"
publish = false

[lib]
# A `calimero:app` component. No `rlib`: the tests run the BUILT component on
# core's engine (tests/common/mod.rs), not the crate linked natively.
crate-type = ["cdylib"]

# Core at `component-core-tag` (root Cargo.toml), the same tag for every core
# crate; scripts/check-component-pins.py asserts it. A standalone crate cannot
# inherit `[workspace.dependencies]`.
[dependencies]
calimero-sdk = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.35" }
serde = { version = "1", features = ["derive"] }

# The harness (`TestApp`, `run_scenario`) and the builder the tests build this
# crate with, for `cargo test` on the host only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-sdk       = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.35", features = ["testing"] }
calimero-app-build = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.35" }
serde_json = "1"

# Read by `meroctl app pack` (core's packer).
[package.metadata.calimero]
package = "com.calimero.mero-ar"
name = "Mero AR"
description = "Mero AR — collaborative spatial editing for your organization on Calimero."
author = "Calimero"
# The slug IS the package id: the registry and the node's `/packages/install
# {package, version}` both name the app by it.
slug = "com.calimero.mero-ar"
# The app icon at 1024px, scaled (mobile/ios/Sources/Assets.xcassets).
icon = "../app/public/icon-512.png"
tags = ["ar", "spatial", "collaboration"]
github = "https://github.com/calimero-network/apps"
# The served page the bundle carries (app/, built first: `pnpm -F mero-ar
# build`). Mero AR is an iPhone app; the cluster serves this page from the
# package's own origin, the only one a node takes Mero AR's passkey ceremonies
# from, and the app opens it for its Calimero Cloud sign-in, passkey approvals
# and consent returns.
frontend-dir = "../app/dist"
# The oldest node that can run this bundle: a `calimero:app` component on the
# core 1.0 wasmtime runtime, built against the SDK at `component-core-tag`. Older nodes, and every
# 0.x node, must refuse the install.
min-runtime-version = "1.0.0-rc.35"
# No `outbound`: the contract makes no outbound HTTP calls. Core 1.0 refuses any
# that are not declared here (as URL prefixes) and approved.

# Standalone: excluded from the root workspace (root Cargo.toml), its own
# Cargo.lock, as core's component apps are.
[workspace]
