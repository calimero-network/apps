# XcodeGen spec — regenerate MeroAR.xcodeproj with: `xcodegen generate`
# (from this directory) or `make app-gen` from the repo root.
name: MeroAR
options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# MeroKit + MeroKitUI are Calimero's Swift SDK, which lives in core
# (sdks/clients/mero-swift) and is versioned with it: `CalimeroClient` over the
# sealed channel (the node's TDX quote verified first), sign-in (`MeroClient`:
# Mero AR's served page on Calimero Cloud, a `SoftPasskey` for `merod local`),
# organizations, app instances and the consent page.
#
# Pinned to a core release (`exactVersion`); core's fleet bump keeps it current.
#
# Local development against a core checkout: swap `url` + `exactVersion` for
# `path: ../../../core` (or your worktree), regenerate, and do NOT commit that.
packages:
  core:
    url: https://github.com/calimero-network/core
    exactVersion: 1.0.0-rc.38
  # The non-UI layer (the generated contract client, models, the room service
  # and the scene store), tested on macOS with `swift test --package-path
  # MeroARCore`. Keep its MeroKit pin equal to the one above.
  MeroARCore:
    path: MeroARCore

targets:
  MeroAR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    # Calimero Cloud sign-in runs on Mero AR's served page in the system
    # sign-in sheet, which returns to `mero-ar://signed-in`: no associated
    # domains. A development node uses a software passkey.
    entitlements:
      path: MeroAR.entitlements
    # DEVELOPMENT_TEAM (for device builds) comes from Config/Signing.xcconfig:
    # empty by default, so simulator builds need none.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mero AR
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Mero AR uses the camera to scan your room and place shared 3D objects in it."
        # `merod local` development clusters are plain http on the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Mero AR connects to a development Calimero cluster on your network."
        UIRequiredDeviceCapabilities:
          - arkit
        CFBundleURLTypes:
          # Mero AR's served page returns here: the session after sign-in
          # (`mero-ar://signed-in#…`), a passkey approval (`mero-ar://approved#…`)
          # and the node's consent page's answer (`mero-ar://consent?…`).
          # ASWebAuthenticationSession intercepts it itself; registering it also
          # routes a return that arrives outside the sheet to the app.
          - CFBundleURLName: network.calimero.meroar.callback
            CFBundleURLSchemes: [mero-ar]
        # The app scheme the served page returns to.
        MeroARCallbackScheme: mero-ar
        # A Calimero Cloud cluster to sign in on. Empty: Mero AR's own
        # address, which routes to its primary cluster.
        MeroARCluster: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.meroar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5"
    dependencies:
      - package: MeroARCore
      - package: core
        product: MeroKit
      - package: core
        product: MeroKitUI

  MeroARTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests
    dependencies:
      - target: MeroAR
      - package: MeroARCore
      # The tests build fixtures out of the SDK's `JSONValue`, so they link the
      # package directly rather than relying on the app target's copy.
      - package: core
        product: MeroKit
      - package: core
        product: MeroKitUI

  MeroARUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: UITests
        optional: true
    dependencies:
      - target: MeroAR

schemes:
  MeroAR:
    build:
      targets:
        MeroAR: all
    run:
      config: Debug
    test:
      targets:
        - MeroARTests
        - MeroARUITests
