[package]
name = "mero-component"
version = "0.1.0"
edition = "2021"
publish = false
description = "Build a component app (calimero-sdk, wasm32-wasip2) and pack it into a signed .mpk"
license = "MIT OR Apache-2.0"
repository = "https://github.com/calimero-network/apps"

[[bin]]
name = "mero-component"
path = "src/main.rs"

# Every core crate at the same tag, and that tag is
# `[workspace.metadata.mero-apps].component-core-tag` in the root Cargo.toml
# (`scripts/check-component-pins.py` asserts it). `cargo mero bundle` at this
# tag builds `wasm32-unknown-unknown` only and cannot take a prebuilt
# component, so this tool builds with core's own builder and packs the `.mpk`
# with core's own manifest types and signer: the node verifies what this writes
# with the same `calimero-bundle`.
[dependencies]
calimero-app-build = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.14" }
calimero-bundle    = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.14" }
mero-sign          = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.14" }

base64     = "0.22"
clap       = { version = "4", features = ["derive", "env"] }
# Core's major: `calimero_bundle::sign_manifest_json` takes its `SigningKey`.
ed25519-dalek = "3"
eyre       = "0.6"
flate2     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
tar        = "0.4"
toml       = "0.8"

[dev-dependencies]
# `VerifiedBundle::open` takes the node's runtime version as a semver::Version.
semver   = "1"
tempfile = "3"

# Standalone, like every component app: not a member of the root workspace (which
# globs only `apps/*/logic`), and its own lockfile.
[workspace]
