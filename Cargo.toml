# The Cargo workspace for every app's contract.
#
# The point of this file is that a core release is ONE edit. Before the
# monorepo, the nine app repos held five different `calimero-sdk` tags at the
# same time — rc.15, rc.23, rc.24, rc.25, and one on `branch = "master"` —
# because bumping core meant remembering to open nine PRs. Here it is
# `[workspace.dependencies]` plus `cargo update`.

[workspace]
resolver = "2"
# Add "crates/*" back alongside the first shared contract crate — and create the
# directory in the same commit. A glob whose parent does not exist is a hard
# error, not an empty match: `failed to read .../crates/*/Cargo.toml`.
members  = ["apps/*/logic"]

[workspace.package]
edition    = "2021"
authors    = ["Calimero Limited <info@calimero.network>"]
license    = "MIT OR Apache-2.0"
repository = "https://github.com/calimero-network/apps"

# ── the single pin the whole fleet moves on ──────────────────────────────────
#
# Pin a real release TAG, never `branch = "master"` (rides unreleased protocol
# work against nodes running the release) and never `tag = "latest"` (core has
# no such tag — a warm cargo git cache resolves a stale local one and builds
# green, so it fails only on a cold cache, i.e. only in CI).
#
# All SDK crates must share the exact same tag. Version strings cannot express
# this: core's workspace version at a tag is 0.0.0.
#
# Bumping core: edit these three lines, update `min-runtime-version` and
# `merod-image` below, run `cargo update`, and let CI rebuild every app.
[workspace.dependencies]
calimero-sdk            = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.28" }
calimero-storage        = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.28" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.28" }

thiserror = "1.0.56"
bs58      = "0.5.1"
hex       = "0.4.3"
sha2      = "0.10.8"
borsh     = "1.6.1"

# ── fleet-wide values, in a table cargo-mero does not claim ──────────────────
#
# `[package.metadata]` is NOT on cargo's inheritable list: setting
# `min-runtime-version.workspace = true` in an app resolves to the literal
# `{"workspace": true}`. So the fleet-wide value lives here and
# `scripts/check-app-metadata.sh` asserts every app matches it. A check, not
# inheritance.
#
# ⚠️ It must NOT live in `[workspace.metadata.calimero]`, which is the obvious
# place and is wrong. cargo-mero reads that table, with `deny_unknown_fields`,
# and — the part that bites — it **REPLACES** the package table rather than
# merging with it:
#
#     /// Workspace-level `[workspace.metadata.calimero]` wins over the crate's
#     /// own `[package.metadata.calimero]` when both are present (multi-service
#     /// apps configure services at the workspace root).
#     — tools/cargo-mero/src/meta.rs
#
# That table exists for ONE multi-service app rooted at the workspace. In a
# workspace of many independent apps it masks each app's own metadata, and
# bundling fails with the confusing
#
#     Error: add a `[package.metadata.calimero]` table ... with a reverse-DNS
#     app id
#
# for an app that has one. Found by the dry-run bundle in ci.yml, which exists
# because `cargo mero build` does NOT read this table and so stayed green.
#
# Hence a table of our own. Nothing calimero-owned belongs at workspace level in
# this repo.
[workspace.metadata.mero-apps]
# Keep equal to the SDK tag above. A build imports host functions that only
# exist from that release on; an older node installs the bundle happily and then
# dies at context creation with `link error: unknown import`.
min-runtime-version = "0.11.0-rc.28"
# The merod image every merobox workflow runs against, matched to the SDK tag so
# contract and node always agree.
merod-image = "ghcr.io/calimero-network/merod:0.11.0-rc.28"

# ── profiles MUST live here ──────────────────────────────────────────────────
#
# Not a style preference. Cargo ignores `[profile.*]` in a workspace MEMBER:
#
#   warning: profiles for the non root package will be ignored,
#            specify profiles at the workspace root
#   error: profile `app-release` is not defined
#
# `cargo mero build` selects `app-release`, and `--profiling` selects
# `app-profiling` and errors if it is absent. So an app that kept its own
# profile block would simply fail to build once it became a member. Verified by
# running cargo.
[profile.app-release]
inherits        = "release"
codegen-units   = 1
opt-level       = "z"
lto             = true
debug           = false
strip           = "symbols"
panic           = "abort"
overflow-checks = true

# Selected by `cargo mero build --profiling` / `cargo mero bundle --profiling`.
# Keeps debug info and skips wasm-opt — for reading a flamegraph, not shipping.
[profile.app-profiling]
inherits        = "release"
codegen-units   = 1
opt-level       = 2
lto             = true
debug           = true
strip           = "none"
panic           = "abort"
overflow-checks = true
